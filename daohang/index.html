<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f0f4fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
<meta name="description" content="AiFeng 资源导航站：工具、系统软件、影音资源、开源脚本聚合。">
<meta name="author" content="AiFeng">
<link rel="canonical" href="https://duanaifeng.github.io/AFeng/daohang/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<title>AiFeng · 资源导航</title>

<!-- 拖拽排序库 -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
(function () {
  'use strict';
  var lite = false;
  try {
    var search = location.search || '';
    if (/[?&]full=1/.test(search)) lite = false;
    else if (/[?&]lite=1/.test(search)) lite = true;
    else if (navigator.deviceMemory <= 4 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) lite = true;
  } catch (e) { lite = true; }
  if (lite) document.documentElement.classList.add('perf-lite');
  window.__AF_LITE__ = lite;
  try {
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  } catch (e) { }
})();
</script>

<style>
:root {
  --bg:#d9e6fb; --bg-2:#edf3ff;
  --glass-1:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.20); --glass-3:rgba(255,255,255,.44);
  --glass-edge:rgba(255,255,255,.75); --glass-edge-2:rgba(255,255,255,.95);
  --glass-hi:rgba(255,255,255,.98); --glass-lo:rgba(255,255,255,.40);
  --surface:rgba(255,255,255,.24); --surface-2:rgba(255,255,255,.34); --surface-3:rgba(255,255,255,.58);
  --text-1:#0a1730; --text-2:#3a4d6c; --text-3:#5a6c8a;
  --border-1:rgba(255,255,255,.50); --border-2:rgba(255,255,255,.88);
  --accent:#1d64f2; --accent-hover:#1449c4; --accent-soft:rgba(59,130,246,.14); --accent-glow:rgba(59,130,246,.40);
  --danger:#dc2626; --success:#16a34a; --warning:#d97706;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --dur:220ms; --ease:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --shadow-sm:0 1px 2px rgba(15,40,90,.05), 0 6px 20px rgba(15,40,90,.08);
  --shadow-md:0 4px 10px rgba(15,40,90,.08), 0 18px 44px rgba(15,40,90,.13);
  --shadow-lg:0 8px 22px rgba(15,40,90,.10), 0 32px 76px rgba(37,99,235,.20);
  --container-pad-x:20px;
}
html.dark {
  --bg:#060b14; --bg-2:#0b1220;
  --glass-1:rgba(255,255,255,.115); --glass-2:rgba(255,255,255,.022); --glass-3:rgba(255,255,255,.070);
  --glass-edge:rgba(255,255,255,.155); --glass-edge-2:rgba(255,255,255,.30);
  --glass-hi:rgba(255,255,255,.24); --glass-lo:rgba(255,255,255,.045);
  --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.070); --surface-3:rgba(18,28,48,.86);
  --text-1:#e6eefb; --text-2:#a2b5d2; --text-3:#8ba0bf;
  --border-1:rgba(255,255,255,.12); --border-2:rgba(255,255,255,.28);
  --accent:#60a5fa; --accent-hover:#93c5fd; --accent-soft:rgba(96,165,250,.16); --accent-glow:rgba(96,165,250,.46);
  --danger:#f87171; --success:#4ade80; --warning:#fbbf24;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.35);
  --shadow-md:0 4px 10px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.50);
  --shadow-lg:0 8px 22px rgba(0,0,0,.55), 0 32px 72px rgba(0,0,0,.70);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { color-scheme:light; -webkit-text-size-adjust:100%; scroll-behavior:smooth; overflow-anchor:none; }
html.dark { color-scheme:dark; }
html.perf-lite { scroll-behavior:auto; }
html, body { overflow-x:clip; }
body {
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  font-family:-apple-system,BlinkMacSystemFont,'HarmonyOS Sans SC','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:15px; line-height:1.6; color:var(--text-1); background:var(--bg);
  -webkit-font-smoothing:antialiased; transition:background var(--dur),color var(--dur);
}
:focus { outline:none; } :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
::selection { background:var(--accent-soft); color:var(--text-1); }

.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-gradient {
  position:absolute; inset:0;
  background:radial-gradient(1100px 760px at 6% -14%, rgba(96,165,250,.55), transparent 62%),
    radial-gradient(980px 680px at 94% -4%, rgba(56,189,248,.45), transparent 60%),
    linear-gradient(165deg, var(--bg) 0%, var(--bg-2) 56%, var(--bg) 100%);
}
.bg-grid {
  position:absolute; inset:0; background-image:linear-gradient(rgba(59,130,246,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,.08) 1px, transparent 1px);
  background-size:52px 52px; mask-image:radial-gradient(ellipse at 50% 30%, #000 28%, transparent 84%);
}
html.perf-lite .bg-grid, html.perf-lite #particleCanvas { display:none; }

.page { position:relative; z-index:2; width:100%; max-width:1120px; padding:0 var(--container-pad-x); display:flex; flex-direction:column; margin:0 auto; }
@media (max-width:480px) { .page { --container-pad-x:16px; } }

/* 骨架屏 */
.skeleton-list { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
.skeleton-item { height:72px; border-radius:var(--radius-md); background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size:200% 100%; animation:skel 1.5s infinite; }
@keyframes skel { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

/* 顶部 */
.topbar { padding:40px 0 24px; }
.topbar-inner { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px; }
.brand-title { display:flex; align-items:baseline; gap:.3em; font-size:clamp(24px, 6vw, 44px); font-weight:800; line-height:1.15; letter-spacing:-.028em; }
.brand-mark { font-family:'Georgia',serif; font-style:italic; font-weight:400; color:var(--accent); }
.topbar-stats { display:flex; gap:24px; }
.topbar-stat { text-align:right; }
.topbar-stat-num { display:block; font-size:22px; font-weight:800; color:var(--text-1); }

/* 搜索 & 标签 */
.search-area { position:relative; margin-bottom:16px; }
.search-box {
  display:flex; align-items:center; border-radius:var(--radius-lg); border:1px solid var(--glass-edge);
  background:linear-gradient(150deg, var(--glass-1) 0%, var(--glass-2) 48%, var(--glass-3) 100%);
  backdrop-filter:blur(30px) saturate(210%); box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
  transition:border-color var(--dur), box-shadow var(--dur);
}
.search-box:focus-within { border-color:var(--glass-edge-2); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-md); }
.search-icon { width:20px; height:20px; margin-left:18px; color:var(--text-3); }
.search-input { flex:1; height:52px; padding:0 16px 0 12px; border:none; background:transparent; color:var(--text-1); font-size:15px; outline:none; }

.tag-bar { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:24px; scrollbar-width:none; }
.tag-bar::-webkit-scrollbar { display:none; }
.tag-chip {
  padding:6px 14px; border-radius:100px; border:1px solid var(--glass-edge); background:var(--surface-2);
  color:var(--text-2); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:all var(--dur);
}
.tag-chip.active { background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 4px 12px var(--accent-glow); }

/* ScrollSpy */
.scroll-nav { position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:90; display:flex; flex-direction:column; gap:12px; }
.scroll-dot { width:8px; height:8px; border-radius:50%; background:var(--text-3); opacity:0.4; cursor:pointer; transition:all 0.3s; position:relative; }
.scroll-dot.active { opacity:1; background:var(--accent); transform:scale(1.5); }
.scroll-dot::before { content:attr(data-title); position:absolute; right:20px; top:50%; transform:translateY(-50%); background:var(--surface-3); padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold; color:var(--text-1); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.2s; backdrop-filter:blur(10px); border:1px solid var(--glass-edge); }
.scroll-dot:hover::before { opacity:1; }
@media (max-width: 768px) { .scroll-nav { display:none; } }

/* 分类区 */
.section { position:relative; padding:16px 0; }
.section-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.section-icon { width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-md); background:var(--c-bg); border:1px solid var(--c-border); font-size:16px; }
.section-title { font-size:15px; font-weight:800; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.section-count { padding:2px 8px; border-radius:4px; background:var(--surface-2); font-size:11px; font-weight:700; color:var(--text-3); }
.section-rule { flex:1; height:1px; background:linear-gradient(90deg, var(--border-2), transparent); }

/* 滑动与卡片 */
.item-wrap { position:relative; overflow:hidden; border-radius:var(--radius-md); margin-bottom:8px; }
.swipe-action { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; width:80px; pointer-events:none; }
.swipe-left { left:0; background:var(--accent); transform:translateX(-100%); }
.swipe-right { right:0; background:var(--danger); transform:translateX(100%); }
body.editing .swipe-action { pointer-events:auto; }

.item {
  position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius-md);
  border:1px solid var(--glass-edge); background:linear-gradient(150deg, var(--glass-1) 0%, var(--glass-2) 46%, var(--glass-3) 100%);
  backdrop-filter:blur(24px) saturate(200%); box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-sm);
  text-decoration:none; cursor:pointer; transition:transform 0.2s var(--ease-spring), background 0.2s;
  z-index:2; width:100%;
}
.item.dragging { opacity:0.9; transform:scale(1.02); box-shadow:var(--shadow-lg); z-index:100; }
.item-icon { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); border:1px solid var(--c-border); background:var(--c-bg); font-size:18px; flex-shrink:0; }
.item-body { flex:1; min-width:0; }
.item-title { font-size:14px; font-weight:700; color:var(--text-1); margin-bottom:2px; }
.item-desc { font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-arrow { width:16px; height:16px; color:var(--text-3); opacity:0.6; flex-shrink:0; }
body.editing .item-arrow { display:none; }

.drag-handle { display:none; width:28px; height:100%; align-items:center; justify-content:center; color:var(--text-3); cursor:grab; touch-action:none; font-size:18px; margin-left:-10px; }
body.editing .drag-handle { display:flex; }
body.editing .item-wrap { margin-bottom:10px; }

.group-edit-btn { display:none; background:none; border:none; color:var(--accent); font-size:16px; padding:4px; cursor:pointer; }
body.editing .group-edit-btn { display:block; }

/* 弹窗与抽屉 */
.modal { position:fixed; inset:0; z-index:400; display:none; align-items:flex-end; justify-content:center; }
.modal.show { display:flex; animation:fadeIn 0.3s both; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal-mask { position:absolute; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(8px); cursor:pointer; }
.modal-box {
  position:relative; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; padding:24px 24px 32px;
  border-radius:24px 24px 0 0; border:1px solid var(--glass-edge); border-bottom:none;
  background:var(--surface-3); background-image:linear-gradient(150deg, var(--glass-1), var(--glass-2) 50%, var(--glass-3));
  backdrop-filter:blur(40px) saturate(220%); box-shadow:0 -10px 40px rgba(0,0,0,.2);
  transform:translateY(100%); transition:transform 0.3s var(--ease); animation:slideUp 0.3s var(--ease) forwards;
}
@keyframes slideUp { to { transform:translateY(0); } }
@media(min-width: 768px) { .modal { align-items:center; padding:20px; } .modal-box { border-radius:var(--radius-lg); border-bottom:1px solid var(--glass-edge); animation:none; transform:none; box-shadow:var(--shadow-lg); } }

.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.modal-title { font-size:18px; font-weight:800; color:var(--text-1); }
.modal-close { width:32px; height:32px; border-radius:50%; background:var(--surface-2); border:none; color:var(--text-2); font-size:16px; cursor:pointer; }
.form-field { margin-bottom:16px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:6px; }
.form-input { width:100%; padding:12px 14px; border-radius:var(--radius-md); border:1px solid var(--glass-edge); background:var(--surface-2); color:var(--text-1); font-size:14px; outline:none; }
.form-input:focus { border-color:var(--accent); }
textarea.form-input { resize:vertical; min-height:64px; }
.btn { padding:12px 20px; border-radius:var(--radius-md); border:1px solid var(--glass-edge); background:var(--surface-2); color:var(--text-1); font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.btn.primary { background:var(--accent); color:#fff; border:none; box-shadow:0 4px 14px var(--accent-glow); }

/* 底部工具栏 */
.edit-bar { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:200; display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface-3); border-radius:100px; box-shadow:var(--shadow-lg); border:1px solid var(--glass-edge); backdrop-filter:blur(30px); opacity:0; visibility:hidden; transition:all 0.3s; }
body.editing .edit-bar { opacity:1; visibility:visible; }
.edit-bar-btn { padding:8px 16px; border-radius:100px; border:none; background:transparent; color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer; }
.edit-bar-btn.primary { background:var(--accent); color:#fff; }

/* Toast */
.toast { position:fixed; left:50%; bottom:80px; transform:translate(-50%, 20px); z-index:10000; display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--surface-3); border-radius:12px; border:1px solid var(--glass-edge); box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:all 0.3s; backdrop-filter:blur(20px); }
.toast.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
.toast-btn { background:var(--accent-soft); color:var(--accent); border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }

.back-top { position:fixed; right:20px; bottom:20px; width:48px; height:48px; border-radius:50%; background:var(--surface-3); border:1px solid var(--glass-edge); backdrop-filter:blur(20px); z-index:100; display:flex; align-items:center; justify-content:center; color:var(--accent); cursor:pointer; opacity:0; visibility:hidden; transition:all 0.3s; }
.back-top.show { opacity:1; visibility:visible; }
body.editing .back-top { display:none; }

/* 工具栏里的小图标 */
.icon-picker-btn { aspect-ratio:1; border:1px solid var(--border-1); background:var(--surface-2); border-radius:6px; cursor:pointer; font-size:16px; }
.color-picker-btn { aspect-ratio:1; border-radius:50%; border:2px solid transparent; cursor:pointer; }
</style>
</head>
<body>

<div class="bg-layer"><div class="bg-gradient"></div><div class="bg-grid"></div></div>
<canvas id="particleCanvas" aria-hidden="true"></canvas>

<!-- 悬浮分类导航 -->
<div class="scroll-nav" id="scrollNav"></div>

<div class="page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-title"><span>AiFeng</span><span class="brand-mark">·</span><span>资源导航</span></h1>
      </div>
      <div class="topbar-stats">
        <div class="topbar-stat"><span class="topbar-stat-num" id="statTotal">-</span><span style="font-size:10px;color:var(--text-3)">Sites</span></div>
      </div>
    </div>
    <div class="search-area">
      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" class="search-input" type="search" placeholder="搜索站点…" autocomplete="off">
      </div>
    </div>
    <div class="tag-bar" id="tagBar"></div>
  </header>

  <main id="main">
    <div id="skeleton" class="skeleton-list"></div>
    <div id="app"></div>
  </main>

  <footer style="padding:40px 0;text-align:center;font-size:12px;color:var(--text-3);">
    <div style="margin-bottom:20px;" id="editEntryZone">
      <button class="btn" id="btnEnterEdit" style="padding:10px 24px;font-size:13px;border-radius:100px;background:var(--glass-1);backdrop-filter:blur(10px);">📝 进入编辑模式</button>
    </div>
    Made by AiFeng · v4.0
  </footer>
</div>

<!-- 确认弹窗 -->
<div class="modal" id="confirmModal">
  <div class="modal-mask" data-modal-close></div>
  <div class="modal-box" style="max-width:320px;">
    <h3 style="margin-bottom:12px;font-size:16px;font-weight:800;" id="confirmTitle">提示</h3>
    <p style="font-size:14px;color:var(--text-2);margin-bottom:24px;" id="confirmMsg"></p>
    <div style="display:flex;gap:12px;">
      <button class="btn" style="flex:1;" id="confirmCancel">取消</button>
      <button class="btn primary" style="flex:1;" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- 链接表单 -->
<div class="modal" id="linkModal">
  <div class="modal-mask" data-modal-close></div>
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title" id="linkTitle">编辑链接</h2>
      <button class="modal-close" data-modal-close>✕</button>
    </div>
    <div class="form-tabs" style="display:flex;gap:4px;margin-bottom:14px;background:var(--surface-2);padding:4px;border-radius:8px;">
      <button class="form-tab active" type="button" data-link-type="single" style="flex:1;padding:8px;border:none;background:var(--surface-3);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">单链接</button>
      <button class="form-tab" type="button" data-link-type="multi" style="flex:1;padding:8px;border:none;background:transparent;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">多链接</button>
    </div>
    <div class="form-field"><label class="form-label">名称</label><input class="form-input" id="linkName" type="text"></div>
    <div class="form-field" id="linkSingleField"><label class="form-label">网址</label><input class="form-input" id="linkUrl" type="url"></div>
    <div class="form-field" id="linkMultiField" hidden>
      <label class="form-label">子链接</label>
      <div class="popup-list" id="popupList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px;"></div>
      <button class="btn" type="button" id="popupAddBtn" style="width:100%;padding:8px;font-size:12px;">+ 添加子链接</button>
    </div>
    <div class="form-field"><label class="form-label">短描述 (18字内)</label><textarea class="form-input" id="linkDesc" rows="1" maxlength="18"></textarea></div>
    <div class="form-field"><label class="form-label">内容详情</label><textarea class="form-input" id="linkDetail" rows="2"></textarea></div>
    <div class="form-field"><label class="form-label">标签 (逗号分隔)</label><input class="form-input" id="linkTags" type="text"></div>
    <div class="form-field"><label class="form-label">所属分类</label><select class="form-input" id="linkGroup"></select></div>
    <button class="btn primary" id="linkOk" type="button" style="width:100%;margin-top:10px;">保存</button>
  </div>
</div>

<!-- 分类表单 -->
<div class="modal" id="groupModal">
  <div class="modal-mask" data-modal-close></div>
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title" id="groupTitle">编辑分类</h2>
      <button class="modal-close" data-modal-close>✕</button>
    </div>
    <div class="form-field"><label class="form-label">分类名称</label><input class="form-input" id="groupName" type="text"></div>
    <div class="form-field"><label class="form-label">图标</label><div class="icon-picker" id="iconPicker" style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:160px;overflow-y:auto;"></div></div>
    <div class="form-field"><label class="form-label">主题色</label><div class="color-picker" id="colorPicker" style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;"></div></div>
    <button class="btn primary" id="groupOk" type="button" style="width:100%;margin-top:10px;">保存</button>
  </div>
</div>

<!-- 详情预览 -->
<div class="modal" id="detailModal">
  <div class="modal-mask" data-modal-close></div>
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title" id="detailTitle">详情</h2>
      <button class="modal-close" data-modal-close>✕</button>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;">
      <div class="item-icon" id="detailIcon" style="width:56px;height:56px;font-size:28px;"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:800;color:var(--text-1);margin-bottom:4px;" id="detailName"></div>
        <div style="font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:8px;" id="detailHostWrap">
          <span id="detailHost"></span>
          <button id="copyHostBtn" style="background:none;border:none;cursor:pointer;color:var(--accent);font-size:12px;font-weight:bold;">复制</button>
        </div>
      </div>
    </div>
    <div style="font-size:14px;line-height:1.7;color:var(--text-2);margin-bottom:24px;white-space:pre-wrap;" id="detailDesc"></div>
    <div style="display:flex;gap:12px;">
      <button class="btn" style="flex:1;" data-modal-close>取消</button>
      <a class="btn primary" style="flex:1;" id="btnVisit" href="#" target="_blank">继续访问</a>
    </div>
  </div>
</div>

<!-- 底部编辑工具栏 -->
<div class="edit-bar" id="editBar">
  <span style="font-size:12px;font-weight:bold;color:var(--warning);margin-right:8px;">编辑中</span>
  <button class="edit-bar-btn" id="btnAddLink">+ 链接</button>
  <button class="edit-bar-btn" id="btnAddGroup">+ 分类</button>
  <button class="edit-bar-btn primary" id="btnExitEdit">完成</button>
</div>

<button class="back-top" id="backTop">↑</button>
<div class="toast" id="toast"></div>

<script>
(function (window, document) {
  'use strict';

  const CFG = {
    DATA_URL: './data.json', CACHE_KEY: '__af_nav_cache_v4__', EDITS_KEY: '__af_nav_edits_v4__',
    DESC_MAX: 18, ICONS: ['🏠','📌','📁','⭐','🔥','💡','📋','🌐','🔗','🔒','💻','🎵','🎬','🎮','📱','📦','📚','🧭','🚀','🧩','⚡'],
    COLORS: ['#60a5fa','#38bdf8','#22d3ee','#818cf8','#a78bfa','#f472b6','#fb923c','#4ade80','#fbbf24','#94a3b8']
  };

  const Dom = {
    $: (s, r) => (r || document).querySelector(s),
    $$: (s, r) => Array.from((r || document).querySelectorAll(s)),
    el: (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x) n.textContent = x; return n; },
    clear: n => { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  };

  const Utils = {
    calcW(str) { let w = 0; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); w += (c >= 0x4E00 && c <= 0x9FA5) ? 1 : 0.5; } return w; },
    rgba: (hex, a) => { let c = hex.replace('#',''); if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; return `rgba(${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)},${a})`; }
  };

  const Store = {
    get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set: (k,v) => { try { localStorage.setItem(k, v); } catch(e) {} },
    getJson: (k,f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch(e) { return f; } },
    setJson: (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
  };

  // ---- 核心状态 ----
  let Data = [];
  let isEditing = false;
  let currentFilterTag = '全部';
  let lastSnapshot = null;

  // ---- 排序逻辑 ----
  const SortUtil = {
    order(g) {
      const arr = g.items.map((item, idx) => ({ item, idx }));
      if (g.itemOrder === 'manual') {
        arr.sort((a,b) => (a.item.placeholder?1:0) - (b.item.placeholder?1:0) || a.idx - b.idx);
      } else {
        arr.sort((a,b) => {
          if (a.item.placeholder !== b.item.placeholder) return a.item.placeholder ? 1 : -1;
          const wa = Utils.calcW(a.item.name), wb = Utils.calcW(b.item.name);
          return wa - wb || a.idx - b.idx;
        });
      }
      return arr;
    },
    materialize(g) {
      if (g.itemOrder === 'manual') return;
      g.items = this.order(g).map(x => x.item);
      g.itemOrder = 'manual';
    }
  };

  // ---- 提示与确认 ----
  function showConfirm(title, msg) {
    return new Promise(resolve => {
      const modal = Dom.$('#confirmModal');
      Dom.$('#confirmTitle').textContent = title;
      Dom.$('#confirmMsg').textContent = msg;
      modal.classList.add('show');
      const close = (res) => { modal.classList.remove('show'); resolve(res); };
      Dom.$('#confirmOk').onclick = () => close(true);
      Dom.$('#confirmCancel').onclick = () => close(false);
      modal.querySelector('.modal-mask').onclick = () => close(false);
    });
  }

  let toastTimer;
  function showToast(msg, undoFn) {
    const t = Dom.$('#toast');
    Dom.clear(t);
    t.appendChild(Dom.el('span', '', msg));
    if (undoFn) {
      const btn = Dom.el('button', 'toast-btn', '撤销');
      btn.onclick = () => { t.classList.remove('show'); undoFn(); };
      t.appendChild(btn);
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), undoFn ? 5000 : 2000);
  }

  // ---- 数据加载 ----
  function renderSkeleton() {
    const sk = Dom.$('#skeleton');
    for(let i=0; i<3; i++) sk.appendChild(Dom.el('div', 'skeleton-item'));
  }

  async function loadData() {
    const cache = Store.getJson(CFG.CACHE_KEY);
    if (cache && Store.get(CFG.EDITS_KEY) === '1') { Data = cache; return; }
    try {
      const res = await fetch(CFG.DATA_URL + '?t=' + Date.now());
      Data = await res.json();
      Store.setJson(CFG.CACHE_KEY, Data);
      Store.set(CFG.EDITS_KEY, '0');
    } catch (e) {
      Data = Store.getJson(CFG.CACHE_KEY) || [];
    }
  }

  function saveData() {
    Store.setJson(CFG.CACHE_KEY, Data);
    Store.set(CFG.EDITS_KEY, '1');
    render();
  }

  // ---- 主渲染 ----
  function render() {
    Dom.$('#skeleton').style.display = 'none';
    const app = Dom.$('#app');
    Dom.clear(app);
    
    // 标签
    const tags = new Set(['全部']);
    Data.forEach(g => g.items.forEach(i => { if(i.tags) i.tags.forEach(t => tags.add(t)); }));
    const tagBar = Dom.$('#tagBar');
    Dom.clear(tagBar);
    Array.from(tags).forEach(tag => {
      const chip = Dom.el('div', 'tag-chip' + (tag === currentFilterTag ? ' active' : ''), tag);
      chip.onclick = () => { currentFilterTag = tag; render(); };
      tagBar.appendChild(chip);
    });

    // ScrollSpy
    const nav = Dom.$('#scrollNav');
    Dom.clear(nav);

    let total = 0;
    Data.forEach((group, gi) => {
      let displayItems = group.items;
      if (currentFilterTag !== '全部') {
        displayItems = group.items.filter(i => i.tags && i.tags.includes(currentFilterTag));
      }
      if (displayItems.length === 0 && !isEditing) return;

      const sec = Dom.el('section', 'section');
      sec.id = 'sec-' + gi;
      
      const dot = Dom.el('div', 'scroll-dot');
      dot.dataset.title = group.category;
      dot.onclick = () => sec.scrollIntoView({ behavior: 'smooth' });
      nav.appendChild(dot);

      const head = Dom.el('div', 'section-head');
      const icon = Dom.el('span', 'section-icon', group.icon);
      icon.style.cssText = `--c-bg:${Utils.rgba(group.color, .14)};--c-border:${Utils.rgba(group.color, .32)};`;
      const title = Dom.el('h2', 'section-title', group.category);
      const cnt = Dom.el('span', 'section-count', displayItems.length + ' 条');
      
      // 分类编辑按钮
      const editGroupBtn = Dom.el('button', 'group-edit-btn', '✎');
      editGroupBtn.onclick = () => openGroupModal(gi);

      head.append(icon, title, cnt, Dom.el('div', 'section-rule'), editGroupBtn);
      sec.appendChild(head);

      const list = Dom.el('div', 'item-list');
      list.dataset.gi = gi;
      
      const sorted = SortUtil.order({ items: displayItems, itemOrder: group.itemOrder });
      
      sorted.forEach(({ item, idx }) => {
        const realIdx = group.items.indexOf(item);
        total++;

        const wrap = Dom.el('div', 'item-wrap');
        wrap.dataset.gi = gi;
        wrap.dataset.ii = realIdx;

        const sLeft = Dom.el('div', 'swipe-action swipe-left', '✎ 编辑');
        const sRight = Dom.el('div', 'swipe-action swipe-right', '✕ 删除');
        wrap.append(sLeft, sRight);

        const el = Dom.el('div', 'item');
        el.style.cssText = `--c-bg:${Utils.rgba(group.color, .14)};--c-border:${Utils.rgba(group.color, .32)};`;
        
        const handle = Dom.el('div', 'drag-handle', '⋮⋮');
        const ic = Dom.el('div', 'item-icon', group.icon);
        const body = Dom.el('div', 'item-body');
        body.innerHTML = `<div class="item-title">${item.name}</div><div class="item-desc">${item.desc||''}</div>`;
        const arrow = Dom.el('div', 'item-arrow', '›');

        el.append(handle, ic, body, arrow);
        wrap.appendChild(el);
        list.appendChild(wrap);

        el.onclick = (e) => {
          if (e.target.closest('.drag-handle') && isEditing) return;
          if (isEditing) { openLinkModal(gi, realIdx); return; }
          if (item.popup && item.popup.length) openPopup(item, group);
          else if (item.url) openDetail(item, group);
        };

        // 滑动处理
        let startX = 0, startY = 0, currentX = 0;
        el.addEventListener('touchstart', e => {
          if (!isEditing) return;
          startX = e.touches[0].clientX; startY = e.touches[0].clientY;
          currentX = 0; el.style.transition = 'none';
        }, {passive: true});
        
        el.addEventListener('touchmove', e => {
          if (!isEditing) return;
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
            currentX = dx > 0 ? Math.min(dx, 80) : Math.max(dx, -80);
            el.style.transform = `translateX(${currentX}px)`;
          }
        }, {passive: true});
        
        el.addEventListener('touchend', () => {
          if (!isEditing) return;
          el.style.transition = 'transform 0.3s var(--ease-spring)';
          if (currentX > 40) el.style.transform = 'translateX(80px)';
          else if (currentX < -40) el.style.transform = 'translateX(-80px)';
          else el.style.transform = 'translateX(0)';
        });

        sLeft.onclick = (e) => { e.stopPropagation(); openLinkModal(gi, realIdx); };
        sRight.onclick = (e) => { e.stopPropagation(); delLink(gi, realIdx); };
      });
      
      sec.appendChild(list);
      app.appendChild(sec);
      
      // 拖拽
      if (isEditing && window.Sortable) {
        new Sortable(list, {
          handle: '.drag-handle',
          animation: 150,
          ghostClass: 'dragging',
          onEnd: () => {
            const items = [];
            Array.from(list.children).forEach(w => items.push(group.items[parseInt(w.dataset.ii)]));
            group.items = items;
            group.itemOrder = 'manual';
            saveData();
          }
        });
      }
    });

    Dom.$('#statTotal').textContent = total;
  }

  // ---- 详情 & 子菜单 ----
  function openDetail(item, group) {
    const m = Dom.$('#detailModal');
    m.classList.add('show');
    Dom.$('#detailName').textContent = item.name;
    Dom.$('#detailDesc').textContent = item.detail || item.desc || '暂无描述';
    Dom.$('#detailIcon').textContent = group.icon;
    Dom.$('#detailIcon').style.setProperty('--c-bg', Utils.rgba(group.color, .14));
    Dom.$('#detailIcon').style.setProperty('--c-border', Utils.rgba(group.color, .32));
    
    let host = item.url;
    try { host = new URL(item.url).hostname; } catch(e){}
    Dom.$('#detailHost').textContent = host;
    Dom.$('#copyHostBtn').onclick = () => { navigator.clipboard.writeText(item.url).then(()=>showToast('已复制')); };
    Dom.$('#btnVisit').href = item.url;
  }

  function openPopup(item, group) {
    const modal = Dom.el('div', 'modal show');
    const mask = Dom.el('div', 'modal-mask');
    const box = Dom.el('div', 'modal-box');
    
    box.appendChild(Dom.el('h2', 'modal-title', item.name));
    if (item.detail) box.appendChild(Dom.el('p', '', item.detail)).style.cssText = 'font-size:13px;color:var(--text-3);margin:10px 0;';
    
    const sorted = [...item.popup].sort((a,b) => Utils.calcW(a.label) - Utils.calcW(b.label));
    sorted.forEach(p => {
      const btn = Dom.el('div', 'item');
      btn.style.marginBottom = '8px';
      btn.innerHTML = `<div class="item-icon" style="background:${Utils.rgba(group.color,.14)};color:${group.color}">${group.icon}</div>
                       <div class="item-body"><div class="item-title">${p.label}</div><div class="item-desc">${p.desc||''}</div></div>`;
      btn.onclick = () => { modal.remove(); setTimeout(()=>openDetail({...p, name:p.label, desc:p.desc}, group), 150); };
      box.appendChild(btn);
    });
    
    modal.append(mask, box);
    document.body.appendChild(modal);
    mask.onclick = () => modal.remove();
  }

  // ---- 增删改 ----
  async function delLink(gi, ii) {
    if (!await showConfirm('删除链接', '确定删除此链接吗？')) return;
    lastSnapshot = JSON.parse(JSON.stringify(Data));
    Data[gi].items.splice(ii, 1);
    saveData();
    showToast('已删除', () => { Data = lastSnapshot; saveData(); });
  }

  function openLinkModal(gi, ii) {
    const isNew = ii < 0;
    const item = isNew ? { name:'', url:'', desc:'', detail:'', tags:[] } : Data[gi].items[ii];
    const m = Dom.$('#linkModal');
    m.classList.add('show');
    Dom.$('#linkTitle').textContent = isNew ? '添加链接' : '编辑链接';
    Dom.$('#linkName').value = item.name;
    Dom.$('#linkUrl').value = item.url || '';
    Dom.$('#linkDesc').value = item.desc || '';
    Dom.$('#linkDetail').value = item.detail || '';
    Dom.$('#linkTags').value = (item.tags||[]).join(', ');
    
    const sel = Dom.$('#linkGroup');
    Dom.clear(sel);
    Data.forEach((g, i) => sel.add(new Option(g.category, i, false, i === gi)));
    
    Dom.$('#linkOk').onclick = () => {
      const name = Dom.$('#linkName').value.trim();
      if (!name) return alert('名称必填');
      const newItem = {
        name,
        url: Dom.$('#linkUrl').value.trim(),
        desc: Dom.$('#linkDesc').value.trim(),
        detail: Dom.$('#linkDetail').value.trim(),
        tags: Dom.$('#linkTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)
      };
      const targetGi = parseInt(sel.value);
      if (!isNew) Data[gi].items.splice(ii, 1);
      Data[targetGi].items.push(newItem);
      m.classList.remove('show');
      saveData();
      showToast('已保存');
    };
  }

  function openGroupModal(gi) {
    const isNew = gi < 0;
    const group = isNew ? { category:'', icon:'📁', color:'#60a5fa' } : Data[gi];
    const m = Dom.$('#groupModal');
    m.classList.add('show');
    Dom.$('#groupTitle').textContent = isNew ? '添加分类' : '编辑分类';
    Dom.$('#groupName').value = group.category;
    
    let selectedIcon = group.icon;
    let selectedColor = group.color;

    const ip = Dom.$('#iconPicker'); Dom.clear(ip);
    CFG.ICONS.forEach(ic => {
      const b = Dom.el('button', 'icon-picker-btn', ic);
      if (ic === selectedIcon) b.style.borderColor = 'var(--accent)';
      b.onclick = () => { Dom.$$('.icon-picker-btn', ip).forEach(x=>x.style.borderColor='var(--border-1)'); b.style.borderColor = 'var(--accent)'; selectedIcon = ic; };
      ip.appendChild(b);
    });

    const cp = Dom.$('#colorPicker'); Dom.clear(cp);
    CFG.COLORS.forEach(c => {
      const b = Dom.el('button', 'color-picker-btn');
      b.style.background = c;
      if (c === selectedColor) b.style.borderColor = 'var(--text-1)';
      b.onclick = () => { Dom.$$('.color-picker-btn', cp).forEach(x=>x.style.borderColor='transparent'); b.style.borderColor = 'var(--text-1)'; selectedColor = c; };
      cp.appendChild(b);
    });

    Dom.$('#groupOk').onclick = () => {
      const name = Dom.$('#groupName').value.trim();
      if (!name) return alert('分类名称必填');
      if (isNew) {
        Data.unshift({ category: name, icon: selectedIcon, color: selectedColor, items: [] });
      } else {
        Data[gi].category = name;
        Data[gi].icon = selectedIcon;
        Data[gi].color = selectedColor;
      }
      m.classList.remove('show');
      saveData();
      showToast('已保存');
    };
  }

  // ---- 全局事件 ----
  document.addEventListener('click', e => {
    if (e.target.closest('[data-modal-close]')) {
      const m = e.target.closest('.modal');
      if (m) m.classList.remove('show');
    }
  });

  Dom.$('#searchInput').oninput = (e) => {
    const kw = e.target.value.toLowerCase();
    Dom.$$('.item-wrap').forEach(w => {
      w.style.display = w.textContent.toLowerCase().includes(kw) ? 'block' : 'none';
    });
  };

  // 编辑模式唤醒
  Dom.$('#btnEnterEdit').onclick = () => {
    isEditing = true;
    document.body.classList.add('editing');
    render();
    showToast('已进入编辑模式');
  };

  Dom.$('#btnExitEdit').onclick = () => {
    isEditing = false;
    document.body.classList.remove('editing');
    render();
  };

  Dom.$('#btnAddLink').onclick = () => { if(Data.length) openLinkModal(0, -1); };
  Dom.$('#btnAddGroup').onclick = () => openGroupModal(-1);
  Dom.$('#backTop').onclick = () => window.scrollTo({top:0, behavior:'smooth'});

  // ScrollSpy
  const observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        Dom.$$('.scroll-dot').forEach(d => d.classList.remove('active'));
        const title = en.target.querySelector('.section-title')?.textContent;
        const dot = Array.from(Dom.$$('.scroll-dot')).find(d => d.dataset.title === title);
        if (dot) dot.classList.add('active');
      }
    });
  }, { threshold: 0.1 });

  window.addEventListener('scroll', () => {
    Dom.$('#backTop').classList.toggle('show', window.scrollY > 300);
  });

  // 启动
  renderSkeleton();
  loadData().then(() => {
    render();
    Dom.$$('.section').forEach(s => observer.observe(s));
  });

})(window, document);
</script>
</body>
</html>
