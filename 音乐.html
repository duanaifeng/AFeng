<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f7fa">
<title>音乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f7f7fa;
    --text: #1a1a1e;
    --text-2: #6b6b70;
    --text-3: #9a9aa0;
    --border: rgba(0,0,0,.08);
    --surface: #ffffff;
    --surface-2: #f0f0f4;
    --surface-3: #e6e6ea;
    --accent: #fa2c56;
    --nav-bg: rgba(249,249,251,.94);
    --mini-bg: rgba(255,255,255,.92);
    --mini-border: rgba(0,0,0,.05);
    --sk-1: #e8e8ec;
    --sk-2: #f0f0f4;
    --full-bg: linear-gradient(180deg, #f2f2f7 0%, #e8e8ee 100%);
    --nav-h: 64px;
    --mini-h: 62px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0f;
      --text: #f0f0f5;
      --text-2: #a0a0b8;
      --text-3: #6b6b80;
      --border: rgba(255,255,255,.08);
      --surface: #14141c;
      --surface-2: #1c1c26;
      --surface-3: #24242f;
      --accent: #ff3b60;
      --nav-bg: rgba(16,16,24,.94);
      --mini-bg: rgba(28,28,38,.92);
      --mini-border: rgba(255,255,255,.08);
      --sk-1: #1c1c26;
      --sk-2: #24242f;
      --full-bg: linear-gradient(180deg, #14141c 0%, #0a0a0f 100%);
    }
  }

  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC',
                 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: fixed; inset: 0;
    transition: background .3s, color .3s;
  }

  .app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .pages { flex: 1; position: relative; overflow: hidden; }

  .page {
    position: absolute; inset: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(var(--nav-h) + var(--mini-h) + var(--safe-bottom) + 16px);
    display: none; scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.active { display: block; animation: pageIn .3s ease both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .top-bar { display: flex; align-items: center; padding: 14px 20px 10px; }
  .top-title { flex: 1; font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #d1d1d6, #a8a8ae);
    display: flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0; overflow: hidden;
  }
  .avatar svg { width: 22px; height: 22px; }

  .section-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; padding: 0 20px; margin: 22px 0 14px; }

  .h-scroll {
    display: flex; gap: 14px; overflow-x: auto; padding: 0 20px 6px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-scroll::after { content: ''; flex: 0 0 6px; }

  .rec-card {
    flex: 0 0 auto; width: 240px; height: 240px; border-radius: 12px;
    overflow: hidden; position: relative; background: var(--surface-2);
    cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    transition: transform .2s;
  }
  .rec-card:active { transform: scale(.97); }
  .rec-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec-card .overlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px 14px 14px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.75));
    color: #fff;
  }
  .rec-card .overlay .t {
    font-size: 14.5px; font-weight: 600; line-height: 1.35; margin-bottom: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .rec-card .overlay .s { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .recent-card { flex: 0 0 auto; width: 168px; cursor: pointer; transition: transform .2s; }
  .recent-card:active { transform: scale(.97); }
  .recent-card .cover {
    width: 168px; height: 168px; border-radius: 12px; overflow: hidden;
    position: relative; background: var(--surface-2);
    box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 8px;
  }
  .recent-card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #d8d8de, #b8b8c0);
    color: rgba(255,255,255,.9);
  }
  .cover-fallback svg { width: 40%; height: 40%; max-width: 80px; max-height: 80px; }
  .recent-card .cover .badge {
    position: absolute; left: 10px; bottom: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .recent-card .cover .badge svg { width: 14px; height: 14px; }
  .recent-card .cover .label {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: -.3px;
    text-shadow: 0 1px 6px rgba(0,0,0,.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  .recent-card .cover.has-badge .label { left: 44px; }
  .recent-card .title {
    font-size: 13.5px; font-weight: 600; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .recent-card .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .mini-player {
    position: absolute; left: 10px; right: 10px;
    bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
    height: var(--mini-h); border-radius: 14px;
    background: var(--mini-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--mini-border);
    box-shadow: 0 6px 22px rgba(0,0,0,.1);
    display: flex; align-items: center; gap: 11px;
    padding: 0 10px; z-index: 50;
    transform: translateY(140%); opacity: 0;
    transition: transform .35s cubic-bezier(.2,.8,.3,1), opacity .3s;
    cursor: pointer; overflow: hidden;
  }
  .mini-player.active { transform: none; opacity: 1; }
  .mini-cover {
    width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
    background: var(--surface-2); flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .mini-cover.hidden { display: none; }
  .mini-fallback {
    width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #d8d8de, #b8b8c0);
    display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .mini-fallback svg { width: 24px; height: 24px; }
  .mini-meta { flex: 1; min-width: 0; }
  .mini-name {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .mini-artist { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; background: none;
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform .15s;
  }
  .mini-btn:active { transform: scale(.88); }
  .mini-btn svg { width: 22px; height: 22px; }

  .bottom-nav {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: var(--nav-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; z-index: 60;
  }
  .nav-item {
    flex: 1; height: var(--nav-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; background: none; border: none; color: var(--text-3);
    cursor: pointer; transition: color .2s; font-family: inherit; padding: 0;
  }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item span { font-size: 10px; font-weight: 500; letter-spacing: .2px; }
  .nav-item.active { color: var(--accent); }

  .search-input-wrap { position: relative; margin: 0 20px; }
  .search-input-wrap > svg.search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-3); pointer-events: none;
  }
  .search-input-wrap input {
    width: 100%; height: 40px; padding: 0 40px 0 38px;
    border-radius: 10px; border: none; background: var(--surface-2);
    color: var(--text); font-size: 16px; font-family: inherit; outline: none;
  }
  .search-input-wrap input::placeholder { color: var(--text-3); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--surface-3); color: var(--text-2); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
  }
  .search-clear.show { display: flex; }

  .search-history { padding: 16px 20px 0; }
  .search-history-title {
    font-size: 13px; color: var(--text-3); margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .search-history-title button {
    background: none; border: none; color: var(--accent); font-size: 13px;
    cursor: pointer; font-family: inherit; padding: 4px 0;
  }
  .search-history-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .search-tag {
    padding: 7px 14px; border-radius: 16px;
    background: var(--surface-2); color: var(--text);
    font-size: 13px; cursor: pointer; border: none;
    font-family: inherit; transition: background .15s;
  }
  .search-tag:active { background: var(--surface-3); }

  .song-list { padding: 16px 20px 0; display: flex; flex-direction: column; }
  .song-item {
    display: flex; align-items: center; gap: 13px; padding: 8px 0;
    cursor: pointer; border-bottom: 1px solid var(--border); transition: opacity .2s;
  }
  .song-item:last-child { border-bottom: none; }
  .song-item:active { opacity: .55; }
  .song-cover-wrap {
    position: relative; width: 52px; height: 52px; flex-shrink: 0;
    border-radius: 8px; overflow: hidden; background: var(--surface-2);
  }
  .song-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .song-item.playing .song-name { color: var(--accent); }
  .song-info { flex: 1; min-width: 0; }
  .song-name {
    font-size: 15.5px; font-weight: 500; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .song-artist { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .song-duration { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .song-fav {
    width: 26px; height: 26px; border: none; background: none;
    color: var(--text-3); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, color .2s;
  }
  .song-fav:active { transform: scale(.85); }
  .song-fav.on { color: var(--accent); }
  .song-fav svg { width: 18px; height: 18px; }

  .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 14px; }
  .loading::before {
    content: ''; display: block; width: 30px; height: 30px;
    margin: 0 auto 16px; border-radius: 50%;
    border: 2.5px solid rgba(250,44,86,.15); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skeleton {
    background: linear-gradient(90deg, var(--sk-1) 25%, var(--sk-2) 50%, var(--sk-1) 75%);
    background-size: 200% 100%; animation: sk 1.4s ease-in-out infinite; border-radius: 12px;
  }
  @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .player-full {
    position: absolute; inset: 0; z-index: 200;
    background: var(--full-bg);
    transform: translateY(100%);
    transition: transform .42s cubic-bezier(.2,.8,.3,1);
    display: flex; flex-direction: column; overflow: hidden;
    touch-action: pan-y;
  }
  .player-full.active { transform: none; }
  .player-full.dragging { transition: none; }

  .full-header {
    display: flex; align-items: center; padding: 12px 20px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    flex-shrink: 0; gap: 4px;
  }
  .full-header .title {
    flex: 1; text-align: center; font-size: 13px; color: var(--text-3);
    letter-spacing: .3px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 8px;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: none;
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s; flex-shrink: 0; position: relative;
  }
  .icon-btn:active { transform: scale(.88); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.on { color: var(--accent); }
  .icon-btn .badge-num {
    position: absolute; top: 2px; right: 2px;
    font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 8px;
    background: var(--accent); color: #fff; min-width: 16px;
    text-align: center; line-height: 1.4; display: none;
  }
  .icon-btn .badge-num.show { display: block; }

  .full-body { flex: 1; position: relative; overflow: hidden; }

  .view-cover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 32px; gap: 34px;
    transition: opacity .3s ease, transform .35s ease;
  }
  .view-cover.hide { opacity: 0; transform: scale(.94); pointer-events: none; }

  .full-cover-wrap {
    position: relative; width: min(78vw, 330px); aspect-ratio: 1; flex-shrink: 0;
  }
  .full-cover {
    width: 100%; height: 100%; border-radius: 16px; object-fit: cover;
    box-shadow: 0 24px 60px rgba(0,0,0,.22); background: var(--surface-2);
    display: block;
  }
  .full-cover-fallback {
    width: 100%; height: 100%; border-radius: 16px;
    background: linear-gradient(135deg, #d8d8de, #b8b8c0);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.85);
    box-shadow: 0 24px 60px rgba(0,0,0,.22);
  }
  .full-cover-fallback svg { width: 90px; height: 90px; }

  .full-info { width: 100%; text-align: center; position: relative; }
  .full-name-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .full-name {
    font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 70%;
  }
  .fav-btn {
    width: 36px; height: 36px; border: none; background: none;
    color: var(--text-3); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, color .2s;
    flex-shrink: 0;
  }
  .fav-btn:active { transform: scale(.85); }
  .fav-btn.on { color: var(--accent); }
  .fav-btn svg { width: 24px; height: 24px; }
  .full-artist { font-size: 16px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .view-lyric {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; transform: scale(1.04); pointer-events: none;
    transition: opacity .3s ease, transform .35s ease;
  }
  .view-lyric.show { opacity: 1; transform: none; pointer-events: auto; }

  .lyric-scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 36px; scrollbar-width: none;
    --lyric-pad: 42%;
    padding-top: var(--lyric-pad);
    padding-bottom: var(--lyric-pad);
  }
  .lyric-scroll::-webkit-scrollbar { display: none; }

  .lyric-line {
    font-size: 17px; font-weight: 600; line-height: 1.6;
    color: var(--text-3); text-align: center; padding: 11px 0;
    transition: color .35s ease, transform .35s ease, opacity .35s ease;
    transform-origin: center; opacity: .55; cursor: pointer;
  }
  .lyric-line.active {
    color: var(--text); font-size: 19px;
    transform: scale(1.02); opacity: 1;
  }
  .lyric-line .trans {
    display: block; font-size: 13px; font-weight: 400;
    color: var(--text-3); margin-top: 4px; opacity: .8;
  }
  .lyric-line.active .trans { color: var(--text-2); }

  .lyric-empty {
    text-align: center; padding: 80px 20px;
    color: var(--text-3); font-size: 14px;
  }

  .full-footer {
    padding: 0 32px 32px;
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0; position: relative; z-index: 5;
  }
  .full-progress { display: flex; align-items: center; gap: 10px; }
  .full-progress .time {
    font-size: 11px; color: var(--text-3); min-width: 34px;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .progress-wrap { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
  .progress-track {
    width: 100%; height: 5px; background: rgba(128,128,140,.2);
    border-radius: 3px; position: relative; overflow: hidden; transition: height .2s;
  }
  .progress-wrap:active .progress-track { height: 7px; }
  .progress-fill { height: 100%; background: var(--text); border-radius: 3px; width: 0%; }

  .full-controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 22px;
  }
  .ctrl-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 8px; border-radius: 50%; transition: transform .15s; flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn svg { width: 32px; height: 32px; }
  .ctrl-btn:active { transform: scale(.86); }
  .ctrl-btn.main svg { width: 42px; height: 42px; }
  .ctrl-btn.small svg { width: 22px; height: 22px; }
  .ctrl-btn.on { color: var(--accent); }
</style>
</head>
<body>

<div class="app">
  <div class="pages">

    <div class="page active" id="pageHome">
      <div class="top-bar">
        <div class="top-title">主页</div>
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
        </div>
      </div>
      <div class="section-title">专属精选推荐</div>
      <div class="h-scroll" id="recommendList">
        <div class="rec-card skeleton"></div>
        <div class="rec-card skeleton"></div>
        <div class="rec-card skeleton"></div>
      </div>
      <div class="section-title">最近播放</div>
      <div class="h-scroll" id="recentList">
        <div style="color:var(--text-3);font-size:13px;padding:20px 0;">还没有播放记录</div>
      </div>
      <div style="height:20px;"></div>
    </div>

    <div class="page" id="pageNew">
      <div class="top-bar"><div class="top-title">新发现</div></div>
      <div class="section-title">热门歌单</div>
      <div class="h-scroll" id="playlistList">
        <div class="rec-card skeleton"></div>
        <div class="rec-card skeleton"></div>
        <div class="rec-card skeleton"></div>
      </div>
      <div style="height:20px;"></div>
    </div>

    <div class="page" id="pageRadio">
      <div class="top-bar"><div class="top-title">广播</div></div>
      <div style="text-align:center;padding:80px 20px;color:var(--text-3);font-size:14px;line-height:1.9;">📻<br><br>电台功能<br><span style="font-size:12px;">暂未开放</span></div>
    </div>

    <div class="page" id="pageLib">
      <div class="top-bar"><div class="top-title">资料库</div></div>
      <div class="song-list" id="libList"><div class="empty">还没有播放记录</div></div>
    </div>

    <div class="page" id="pageSearch">
      <div class="top-bar"><div class="top-title">搜索</div></div>
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<script>
// ==================== API 配置（corsproxy.io 代理路线） ====================
var RAW_API = 'http://139.9.223.233:3000';
var USE_PROXY = true; // 走代理时 true，本地 file:// 直接测试时可改 false

function api(path) {
  if (!USE_PROXY) return RAW_API + path;
  return 'https://corsproxy.io/?url=' + encodeURIComponent(RAW_API + path);
}

// ==================== 存储键 ====================
var RECENT_KEY = '__af_music_recent__';
var FAV_KEY = '__af_music_favs__';
var MODE_KEY = '__af_music_mode__';
var HISTORY_KEY = '__af_music_history__';

// ==================== DOM ====================
var qEl = document.getElementById('q');
var searchClear = document.getElementById('searchClear');
var searchListEl = document.getElementById('searchList');
var searchHistoryArea = document.getElementById('searchHistoryArea');
var searchHistoryTags = document.getElementById('searchHistoryTags');
var clearHistoryBtn = document.getElementById('clearHistory');
var libListEl = document.getElementById('libList');
var recentListEl = document.getElementById('recentList');
var recommendListEl = document.getElementById('recommendList');
var playlistListEl = document.getElementById('playlistList');

var audio = document.getElementById('audio');
var miniPlayer = document.getElementById('miniPlayer');
var miniCover = document.getElementById('miniCover');
var miniFallback = document.getElementById('miniFallback');
var miniName = document.getElementById('miniName');
var miniArtist = document.getElementById('miniArtist');
var miniPlay = document.getElementById('miniPlay');
var miniNext = document.getElementById('miniNext');
var miniIconPlay = document.getElementById('miniIconPlay');
var miniIconPause = document.getElementById('miniIconPause');

var playerFull = document.getElementById('playerFull');
var fullCover = document.getElementById('fullCover');
var fullCoverFallback = document.getElementById('fullCoverFallback');
var fullName = document.getElementById('fullName');
var fullArtist = document.getElementById('fullArtist');
var fullTitle = document.getElementById('fullTitle');
var btnCloseFull = document.getElementById('btnCloseFull');
var btnToggleView = document.getElementById('btnToggleView');
var btnSleep = document.getElementById('btnSleep');
var sleepBadge = document.getElementById('sleepBadge');
var iconToLyric = document.getElementById('iconToLyric');
var iconToCover = document.getElementById('iconToCover');
var viewCover = document.getElementById('viewCover');
var viewLyric = document.getElementById('viewLyric');
var lyricScroll = document.getElementById('lyricScroll');

var btnPlay = document.getElementById('btnPlay');
var btnPrev = document.getElementById('btnPrev');
var btnNext = document.getElementById('btnNext');
var btnMode = document.getElementById('btnMode');
var btnList = document.getElementById('btnList');
var btnFav = document.getElementById('btnFav');
var iconFavEmpty = document.getElementById('iconFavEmpty');
var iconFavFull = document.getElementById('iconFavFull');
var iconModeList = document.getElementById('iconModeList');
var iconModeSingle = document.getElementById('iconModeSingle');
var iconModeShuffle = document.getElementById('iconModeShuffle');
var iconPlay = document.getElementById('iconPlay');
var iconPause = document.getElementById('iconPause');

var progressWrap = document.getElementById('progressWrap');
var progressFill = document.getElementById('progressFill');
var tCur = document.getElementById('tCur');
var tDur = document.getElementById('tDur');

// ==================== 状态 ====================
var playlist = [];
var currentIndex = -1;
var lyrics = [];
var currentLyricIdx = -1;
var showingLyric = false;
var lyricLocked = false;
var lyricLockTimer = null;
var playMode = localStorage.getItem(MODE_KEY) || 'list';
var sleepTimer = null;
var sleepRemain = 0;

// ==================== 工具 ====================
function formatTime(sec) {
  if (!sec || isNaN(sec) || sec === Infinity) return '0:00';
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function escHtml(str) {
  return String(str || '').replace(/[&<>"']/g, function(m) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
  });
}
function extractCover(s) {
  var album = s.album || s.al || {};
  var pic = album.picUrl || s.picUrl || s.coverImgUrl || '';
  if (pic) pic = pic.replace(/^http:/, 'https:').split('?')[0];
  return pic;
}
function pickSong(s) {
  var artists = s.artists || s.ar || [];
  return {
    id: s.id,
    name: s.name,
    artist: artists.map(function(a){ return a.name; }).join(' / '),
    albumName: (s.album || s.al || {}).name || '',
    cover: extractCover(s),
    duration: s.duration || s.dt || 0
  };
}
function coverUrl(cover, size) {
  if (!cover) return '';
  return cover + '?param=' + size + 'y' + size;
}
function toast(msg) {
  var el = document.getElementById('__af_toast__');
  if (!el) {
    el = document.createElement('div');
    el.id = '__af_toast__';
    el.style.cssText = 'position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:12px;background:rgba(30,30,40,.94);color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:80vw;text-align:center;font-family:inherit;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(-6px)';
  clearTimeout(el.__timer);
  el.__timer = setTimeout(function(){
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(0)';
  }, 1600);
}

// ==================== 存储 ====================
function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { return []; }
}
function saveRecent(list) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 30))); } catch(e) {}
}
function addRecent(song) {
  var list = loadRecent().filter(function(s){ return s.id !== song.id; });
  list.unshift(song);
  saveRecent(list);
  renderRecent();
  renderLib();
}

function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e) { return []; }
}
function saveFavs(list) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch(e) {}
}
function isFav(id) {
  return loadFavs().some(function(s){ return s.id === id; });
}
function toggleFav(song) {
  if (!song) return;
  var list = loadFavs();
  var idx = list.findIndex(function(s){ return s.id === song.id; });
  if (idx > -1) { list.splice(idx, 1); toast('已取消收藏'); }
  else { list.unshift(song); toast('已收藏 ♥'); }
  saveFavs(list);
  updateFavUI();
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; }
}
function addHistory(kw) {
  if (!kw) return;
  var list = loadHistory().filter(function(s){ return s !== kw; });
  list.unshift(kw);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 20))); } catch(e) {}
}
function renderHistory() {
  var list = loadHistory();
  if (!list.length) {
    searchHistoryArea.style.display = 'none';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += '<button class="search-tag" type="button" data-kw="' + escHtml(list[i]) + '">' + escHtml(list[i]) + '</button>';
  }
  searchHistoryTags.innerHTML = html;
  searchHistoryArea.style.display = '';
}

// ==================== 播放模式 ====================
function updateModeUI() {
  iconModeList.style.display = playMode === 'list' ? '' : 'none';
  iconModeSingle.style.display = playMode === 'single' ? '' : 'none';
  iconModeShuffle.style.display = playMode === 'shuffle' ? '' : 'none';
  btnMode.classList.toggle('on', playMode !== 'list');
}
function togglePlayMode() {
  var modes = ['list', 'single', 'shuffle'];
  var idx = modes.indexOf(playMode);
  playMode = modes[(idx + 1) % modes.length];
  try { localStorage.setItem(MODE_KEY, playMode); } catch(e) {}
  updateModeUI();
  var labels = { list: '列表循环', single: '单曲循环', shuffle: '随机播放' };
  toast(labels[playMode]);
}

// ==================== 收藏 UI ====================
function updateFavUI() {
  if (!playlist[currentIndex]) return;
  var on = isFav(playlist[currentIndex].id);
  iconFavEmpty.style.display = on ? 'none' : '';
  iconFavFull.style.display = on ? '' : 'none';
  btnFav.classList.toggle('on', on);
}

// ==================== 封面兜底 ====================
function coverFallbackSVG() {
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
}

// ==================== 渲染 ====================
function renderRecent() {
  var list = loadRecent();
  if (!list.length) {
    recentListEl.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:20px 0;">还没有播放记录</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var img = coverUrl(s.cover, 340);
    html += '<div class="recent-card" data-index="' + i + '">';
    html += '<div class="cover' + (i === 0 ? ' has-badge' : '') + '">';
    if (img) {
      html += '<img src="' + escHtml(img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')">';
      html += '<div class="cover-fallback" style="display:none;">' + coverFallbackSVG() + '</div>';
    } else {
      html += '<div class="cover-fallback">' + coverFallbackSVG() + '</div>';
    }
    if (i === 0) {
      html += '<div class="badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></div>';
    }
    html += '<div class="label">' + escHtml(s.name.substring(0, 4)) + '</div>';
    html += '</div>';
    html += '<div class="title">' + escHtml(s.name) + '</div>';
    html += '<div class="sub">' + escHtml(s.artist) + '</div>';
    html += '</div>';
  }
  recentListEl.innerHTML = html;
}

function renderLib() {
  var list = loadRecent();
  if (!list.length) {
    libListEl.innerHTML = '<div class="empty">还没有播放记录</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += buildSongItemHTML(list[i], i, false);
  }
  libListEl.innerHTML = html;
}

function buildSongItemHTML(s, idx, showFav) {
  var img = coverUrl(s.cover, 100);
  var favOn = isFav(s.id);
  var html = '<div class="song-item" data-index="' + idx + '">';
  html += '<div class="song-cover-wrap">';
  if (img) {
    html += '<img class="song-cover" src="' + escHtml(img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" onerror="this.style.display=\'none\';this.nextElementSibling&&(this.nextElementSibling.style.display=\'flex\')">';
    html += '<div class="cover-fallback" style="display:none;position:absolute;inset:0;">' + coverFallbackSVG() + '</div>';
  } else {
    html += '<div class="cover-fallback" style="position:absolute;inset:0;">' + coverFallbackSVG() + '</div>';
  }
  html += '</div>';
  html += '<div class="song-info"><div class="song-name">' + escHtml(s.name) + '</div><div class="song-artist">' + escHtml(s.artist) + (s.albumName ? ' - ' + escHtml(s.albumName) : '') + '</div></div>';
  html += '<div class="song-right">';
  html += '<span class="song-duration">' + formatTime(s.duration / 1000) + '</span>';
  if (showFav) {
    html += '<button class="song-fav' + (favOn ? ' on' : '') + '" type="button" data-fav-id="' + s.id + '" aria-label="收藏">';
    html += '<svg viewBox="0 0 24 24" fill="' + (favOn ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
    html += '</button>';
  }
  html += '</div></div>';
  return html;
}

// ==================== 歌词 ====================
function parseLrc(lrcText) {
  if (!lrcText) return [];
  var lines = lrcText.split('\n');
  var result = [];
  var timeRe = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var text = line.replace(timeRe, '').trim();
    if (!text || /^\[[a-z]+:/i.test(line.trim())) continue;
    timeRe.lastIndex = 0;
    var m;
    while ((m = timeRe.exec(line)) !== null) {
      var min = parseInt(m[1], 10);
      var sec = parseInt(m[2], 10);
      var ms = m[3] ? parseInt(m[3].length === 3 ? m[3] : m[3] + '0', 10) : 0;
      result.push({ time: min * 60 + sec + ms / 1000, text: text, trans: '' });
    }
  }
  result.sort(function(a, b){ return a.time - b.time; });
  return result;
}
function mergeTranslation(lyrics, transText) {
  var trans = parseLrc(transText);
  if (!trans.length) return;
  for (var i = 0; i < lyrics.length; i++) {
    for (var j = 0; j < trans.length; j++) {
      if (Math.abs(trans[j].time - lyrics[i].time) < 0.3) {
        lyrics[i].trans = trans[j].text;
        break;
      }
    }
  }
}
function loadLyric(songId) {
  lyrics = [];
  currentLyricIdx = -1;
  renderLyrics();
  fetch(api('/lyric?id=' + songId))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var lrcText = (data.lrc && data.lrc.lyric) || '';
      var transText = (data.tlyric && data.tlyric.lyric) || '';
      lyrics = parseLrc(lrcText);
      if (transText) mergeTranslation(lyrics, transText);
      renderLyrics();
    })
    .catch(function(err) {
      console.error('歌词加载失败', err);
      lyrics = [];
      renderLyrics();
    });
}
function renderLyrics() {
  if (!lyrics.length) {
    lyricScroll.innerHTML = '<div class="lyric-empty">暂无歌词</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < lyrics.length; i++) {
    html += '<div class="lyric-line" data-idx="' + i + '" data-time="' + lyrics[i].time + '">' + escHtml(lyrics[i].text);
    if (lyrics[i].trans) html += '<span class="trans">' + escHtml(lyrics[i].trans) + '</span>';
    html += '</div>';
  }
  lyricScroll.innerHTML = html;
}
function syncLyric(currentTime) {
  if (!lyrics.length) return;
  var idx = -1;
  for (var i = 0; i < lyrics.length; i++) {
    if (lyrics[i].time <= currentTime + 0.2) idx = i;
    else break;
  }
  if (idx === currentLyricIdx) return;
  currentLyricIdx = idx;
  var nodes = lyricScroll.querySelectorAll('.lyric-line');
  for (var k = 0; k < nodes.length; k++) {
    nodes[k].classList.toggle('active', k === idx);
  }
  if (idx >= 0 && nodes[idx] && showingLyric && !lyricLocked) {
    var node = nodes[idx];
    var target = node.offsetTop - lyricScroll.clientHeight / 2 + node.clientHeight / 2;
    lyricScroll.scrollTo({ top: target, behavior: 'smooth' });
  }
}
lyricScroll.addEventListener('click', function(e) {
  var t = e.target;
  while (t && t !== lyricScroll && !t.classList.contains('lyric-line')) t = t.parentNode;
  if (!t || t === lyricScroll) return;
  var time = parseFloat(t.getAttribute('data-time'));
  if (!isNaN(time)) {
    audio.currentTime = time;
    if (audio.paused) audio.play();
  }
});
lyricScroll.addEventListener('touchstart', function() {
  lyricLocked = true;
  clearTimeout(lyricLockTimer);
}, { passive: true });
lyricScroll.addEventListener('touchend', function() {
  clearTimeout(lyricLockTimer);
  lyricLockTimer = setTimeout(function() {
    lyricLocked = false;
    syncLyric(audio.currentTime || 0);
  }, 3000);
}, { passive: true });
lyricScroll.addEventListener('wheel', function() {
  lyricLocked = true;
  clearTimeout(lyricLockTimer);
  lyricLockTimer = setTimeout(function() {
    lyricLocked = false;
    syncLyric(audio.currentTime || 0);
  }, 3000);
}, { passive: true });

// ==================== MediaSession ====================
function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;
  try {
    var artwork = [];
    if (song.cover) {
      artwork = [
        { src: song.cover + '?param=96y96', sizes: '96x96', type: 'image/jpeg' },
        { src: song.cover + '?param=256y256', sizes: '256x256', type: 'image/jpeg' },
        { src: song.cover + '?param=512y512', sizes: '512x512', type: 'image/jpeg' }
      ];
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name || '',
      artist: song.artist || '',
      album: song.albumName || '',
      artwork: artwork
    });
  } catch(e) {}
}
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', function(){ audio.play(); });
    navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ prevSong(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ nextSong(); });
  } catch(e) {}
}

// ==================== 播放 ====================
function playAt(index, list) {
  list = list || playlist;
  if (index < 0 || index >= list.length) return;
  var song = list[index];
  playlist = list;
  currentIndex = index;

  fullName.textContent = song.name;
  fullArtist.textContent = song.artist;
  fullTitle.textContent = song.name;

  var coverBig = coverUrl(song.cover, 500);
  if (coverBig) {
    fullCover.style.display = '';
    fullCoverFallback.style.display = 'none';
    fullCover.onerror = function() {
      fullCover.style.display = 'none';
      fullCoverFallback.style.display = 'flex';
    };
    fullCover.src = coverBig;
  } else {
    fullCover.style.display = 'none';
    fullCoverFallback.style.display = 'flex';
  }

  miniPlayer.classList.add('active');
  miniName.textContent = song.name;
  miniArtist.textContent = song.artist;
  var coverMini = coverUrl(song.cover, 120);
  if (coverMini) {
    miniCover.style.display = '';
    miniFallback.style.display = 'none';
    miniCover.onerror = function() {
      miniCover.style.display = 'none';
      miniFallback.style.display = 'flex';
    };
    miniCover.src = coverMini;
  } else {
    miniCover.style.display = 'none';
    miniFallback.style.display = 'flex';
  }

  var items = document.querySelectorAll('.song-item, .recent-card');
  for (var i = 0; i < items.length; i++) {
    var idx = parseInt(items[i].getAttribute('data-index'), 10);
    items[i].classList.toggle('playing', idx === index);
  }

  addRecent(song);
  updateFavUI();
  loadLyric(song.id);
  updateMediaSession(song);

  fetch(api('/song/url/v1?id=' + song.id + '&level=exhigh'))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var url = (data.data && data.data[0] && data.data[0].url) || '';
      if (!url) {
        miniArtist.textContent = '无法播放（VIP 或无版权）';
        fullArtist.textContent = '无法播放（VIP 或无版权）';
        return;
      }
      audio.src = url;
      audio.play().catch(function(e){ console.error(e); });
    })
    .catch(function(e){ console.error(e); });
}

function nextSong() {
  if (!playlist.length) return;
  if (playMode === 'shuffle') {
    playAt(Math.floor(Math.random() * playlist.length));
  } else if (currentIndex < playlist.length - 1) {
    playAt(currentIndex + 1);
  } else {
    playAt(0);
  }
}
function prevSong() {
  if (!playlist.length) return;
  if (currentIndex > 0) playAt(currentIndex - 1);
  else playAt(playlist.length - 1);
}

audio.addEventListener('pause', function() {
  iconPlay.style.display = ''; iconPause.style.display = 'none';
  miniIconPlay.style.display = ''; miniIconPause.style.display = 'none';
});
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  tCur.textContent = formatTime(audio.currentTime);
  syncLyric(audio.currentTime);
});

});
audio.addEventListener('ended', function() {
  if (playMode === 'single') {
    audio.currentTime = 0;
    audio.play();
  } else {
    nextSong();
  }
});
progressWrap.addEventListener('click', function(e) {
  if (!audio.duration) return;
  var r = progressWrap.getBoundingClientRect();
  audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
});

btnSleep.addEventListener('click', function() {
  if (sleepTimer) {
    clearInterval(sleepTimer);
    sleepTimer = null;
    sleepRemain = 0;
    sleepBadge.classList.remove('show');
    btnSleep.classList.remove('on');
    toast('已取消定时');
    return;
  }
  var input = prompt('设置睡眠定时（分钟）：\n输入 15、30、60 或自定义数字', '30');
  if (!input) return;
  var min = parseInt(input, 10);
  if (isNaN(min) || min <= 0) { toast('无效的分钟数'); return; }
  sleepRemain = min * 60;
  sleepBadge.textContent = min;
  sleepBadge.classList.add('show');
  btnSleep.classList.add('on');
  toast(min + ' 分钟后自动暂停');
  sleepTimer = setInterval(function() {
    sleepRemain--;
    if (sleepRemain <= 0) {
      clearInterval(sleepTimer);
      sleepTimer = null;
      audio.pause();
      sleepBadge.classList.remove('show');
      btnSleep.classList.remove('on');
      toast('定时结束，已暂停播放');
    } else if (sleepRemain % 60 === 0 && sleepRemain <= 300) {
      sleepBadge.textContent = Math.ceil(sleepRemain / 60);
    }
  }, 1000);
});

var touchStartX = 0, touchStartY = 0, touchIsSwipe = false;
viewCover.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchIsSwipe = false;
}, { passive: true });
viewCover.addEventListener('touchmove', function(e) {
  var dx = e.touches[0].clientX - touchStartX;
  var dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) touchIsSwipe = true;
}, { passive: true });
viewCover.addEventListener('touchend', function(e) {
  if (!touchIsSwipe) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextSong();
    else prevSong();
  }
  touchIsSwipe = false;
}, { passive: true });

var dragStartY = 0, dragDeltaY = 0, dragging = false;
playerFull.addEventListener('touchstart', function(e) {
  if (e.target.closest('.lyric-scroll') || e.target.closest('.full-footer') || e.target.closest('.icon-btn')) return;
  dragStartY = e.touches[0].clientY;
  dragDeltaY = 0;
  dragging = true;
  playerFull.classList.add('dragging');
}, { passive: true });
playerFull.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  dragDeltaY = e.touches[0].clientY - dragStartY;
  if (dragDeltaY > 0) {
    playerFull.style.transform = 'translateY(' + dragDeltaY + 'px)';
  }
}, { passive: true });
playerFull.addEventListener('touchend', function() {
  if (!dragging) return;
  playerFull.classList.remove('dragging');
  playerFull.style.transform = '';
  if (dragDeltaY > window.innerHeight * 0.3) {
    playerFull.classList.remove('active');
  }
  dragging = false;
  dragDeltaY = 0;
});

      .then(function(r){ return r.json(); })
