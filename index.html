<script>
/* ============================================================
   滚动位置策略（重写版）
   ============================================================ */
(function () {
  'use strict';
  var POS_KEY = '__af_scroll_y__';
  var TS_KEY  = '__af_scroll_t__';
  var root = document.documentElement;

  if ('scrollRestoration' in history) {
    try { history.scrollRestoration = 'manual'; } catch (e) {}
  }

  var navType = '';
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation');
    if (nav && nav[0] && nav[0].type) { navType = nav[0].type; }
    else if (performance.navigation && typeof performance.navigation.type === 'number') {
      navType = performance.navigation.type === 1 ? 'reload' : '';
    }
  } catch (e) {}

  var isReload = (navType === 'reload');
  var savedY = 0;
  var canRestore = false;

  if (isReload) {
    try { sessionStorage.removeItem(POS_KEY); sessionStorage.removeItem(TS_KEY); } catch (e) {}
  } else {
    try {
      var raw = sessionStorage.getItem(POS_KEY);
      if (raw !== null) {
        var y = parseInt(raw, 10);
        if (!isNaN(y) && y > 60) { savedY = y; canRestore = true; }
      }
    } catch (e) {}
  }

  var target = canRestore ? savedY : 0;
  var userActive = false;

  function release() { if (userActive) return; userActive = true; scheduleSave(); }
  var gestures = ['touchstart','touchmove','wheel','pointerdown','mousedown','keydown'];
  for (var i = 0; i < gestures.length; i++) {
    window.addEventListener(gestures[i], release, { passive: true, capture: true });
  }

  function jumpTo(y) { if (userActive) return; try { window.scrollTo(0, y); } catch (e) {} }
  function applyOnce() { jumpTo(target); }

  applyOnce();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyOnce);
  } else { applyOnce(); }

  window.addEventListener('load', function () {
    applyOnce();
    setTimeout(applyOnce, 50);
    setTimeout(applyOnce, 180);
    setTimeout(applyOnce, 450);
    setTimeout(applyOnce, 900);
  });
  setTimeout(applyOnce, 1500);

  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    if (userActive || !canRestore) return;
    setTimeout(function () { if (!userActive) jumpTo(savedY); }, 0);
  });

  var saveTimer = null;
  function saveNow() {
    try {
      var y = window.pageYOffset || root.scrollTop || 0;
      sessionStorage.setItem(POS_KEY, String(y));
      sessionStorage.setItem(TS_KEY, String(Date.now()));
    } catch (e) {}
  }
  function scheduleSave() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(); }, 200);
  }
  window.addEventListener('scroll', scheduleSave, { passive: true });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveNow();
  });
})();
</script>

<style>
:root{
  --bg:#f0f4fc;
  --bg-2:#e6edf8;
  --surface:rgba(255,255,255,.75);
  --surface-2:rgba(255,255,255,.9);
  --surface-hover:rgba(255,255,255,.98);
  --border:rgba(96,165,250,.18);
  --border-hover:rgba(96,165,250,.4);
  --text:#1e293b;
  --text-2:#475569;
  --text-3:#94a3b8;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --shadow-sm:0 4px 14px rgba(0,0,0,.06);
  --input-bg:rgba(255,255,255,.8);
  --input-focus:rgba(255,255,255,.98);
  --glow-1:rgba(96,165,250,.12);
  --glow-2:rgba(56,189,248,.08);
  --ring:rgba(96,165,250,.15);
  --card-shine:rgba(96,165,250,.25);
  --grad-brand:linear-gradient(135deg,#7dd3fc 0%,#60a5fa 45%,#3b82f6 100%);
  --grad-text:linear-gradient(45deg,#1e293b 0%,#2563eb 25%,#3b82f6 55%,#2563eb 75%,#1e293b 100%);
  --danger:#ef4444;
  --success:#22c55e;
}
html.dark {
  --bg:#0a0f1a;
  --bg-2:#0e1524;
  --surface:rgba(147,197,253,.03);
  --surface-2:rgba(147,197,253,.055);
  --surface-hover:rgba(147,197,253,.08);
  --border:rgba(147,197,253,.08);
  --border-hover:rgba(96,165,250,.24);
  --text:#e4edfa;
  --text-2:#9db0cb;
  --text-3:#6b7d99;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 4px 14px rgba(0,0,0,.24);
  --input-bg:rgba(147,197,253,.04);
  --input-focus:rgba(147,197,253,.07);
  --glow-1:rgba(59,130,246,.16);
  --glow-2:rgba(56,189,248,.12);
  --ring:rgba(96,165,250,.2);
  --card-shine:rgba(147,197,253,.32);
  --grad-text:linear-gradient(45deg,#fff 0%,#93c5fd 25%,#38bdf8 55%,#93c5fd 75%,#fff 100%);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'HarmonyOS Sans SC','HarmonyOS Sans','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','WenQuanYi Micro Hei','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition: background .3s ease, color .3s ease;
}
a{color:inherit}
html,body{overflow-anchor:none}

.bg-layer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden;-webkit-transform:translateZ(0);transform:translateZ(0);transition:background .3s ease;}
.bg-gradient{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(1100px 700px at 15% -15%,var(--glow-1),transparent 65%),radial-gradient(900px 600px at 92% 8%,var(--glow-2),transparent 62%);transition:background .3s ease;}
.bg-noise{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(0,0,0,.06) 100%);transition:background .3s ease;}
html.dark .bg-noise{background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(0,0,0,.42) 100%);}

.wrap{max-width:1000px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}

.hero{padding:20px 0 14px}
.profile-card{position:relative;border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:16px 20px 14px;overflow:hidden;box-shadow:var(--shadow-sm);transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;}
@supports ((-webkit-backdrop-filter: blur(16px)) or (backdrop-filter: blur(16px))) {
  .profile-card{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
}
.profile-card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--card-shine),transparent);pointer-events:none;}

.profile-top{position:relative;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;}
.profile-top > *{margin-right:12px}
.profile-top > *:last-child{margin-right:0}
@supports (gap: 1px){ .profile-top{gap:12px} .profile-top > *{margin-right:0} }

.avatar-wrap{position:relative;width:48px;height:48px;-webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;}
.avatar-wrap::before{content:'';position:absolute;top:50%;left:50%;width:160%;height:160%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(96,165,250,.18) 0%,transparent 68%);-webkit-animation:glow 6s ease-in-out infinite;animation:glow 6s ease-in-out infinite;z-index:0;pointer-events:none;}
.avatar{position:relative;width:100%;height:100%;border-radius:50%;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;font-size:22px;color:#0a0f1a;background:var(--grad-brand);background-size:220% 100%;border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 14px rgba(59,130,246,.2);-webkit-animation:shimmer 8s ease-in-out infinite;animation:shimmer 8s ease-in-out infinite;z-index:1;}

.profile-info{min-width:0;-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto}
.name{font-size:22px;font-weight:800;letter-spacing:1.5px;display:inline-block;position:relative;padding-bottom:4px;margin-bottom:2px;color:var(--text);line-height:1.2;}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .name{background:var(--grad-text);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-animation:shimmer 9s ease-in-out infinite;animation:shimmer 9s ease-in-out infinite;}
}
.name::after{content:'';position:absolute;bottom:0;left:0;width:36px;height:2px;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#38bdf8);}
.tagline{font-size:12px;color:var(--text-3);letter-spacing:1px;font-weight:500;line-height:1.5;}

.bio{position:relative;font-size:12.5px;color:var(--text-2);line-height:1.9;letter-spacing:.2px;margin:10px 0 0;text-align:justify;padding-left:10px;border-left:2px solid var(--border);transition:color .3s ease,border-color .3s ease;}

.stats{position:relative;display:grid;display:-ms-grid;grid-template-columns:repeat(2,1fr);-ms-grid-columns:1fr 1fr;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.stat{position:relative;text-align:center}
.stat + .stat::before{content:'';position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--border);}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:.5px;color:var(--text);line-height:1.3;}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .stat b{background:linear-gradient(135deg,var(--text),var(--text-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
}
.stat span{font-size:11px;color:var(--text-3);letter-spacing:1px;margin-top:2px;display:block;line-height:1.4;}

@media(max-width:600px){
  .hero{padding:14px 0 10px}
  .profile-card{padding:14px 16px 12px;border-radius:14px}
  .avatar-wrap{width:42px;height:42px}
  .avatar{font-size:18px}
  .name{font-size:19px;letter-spacing:1.2px}
  .tagline{font-size:11px;letter-spacing:.8px}
  .bio{font-size:11.5px;line-height:1.8;margin-top:8px;padding-left:8px}
  .stat b{font-size:16px}
  .stat span{font-size:10px}
}

/* 最近访问/常用区 */
.quick-area{
  display:none;margin-bottom:20px;padding:14px 16px;border-radius:14px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm);
}
.quick-area.show{display:block;}
.quick-title{
  font-size:12px;color:var(--text-3);letter-spacing:1px;
  margin-bottom:10px;font-weight:500;
}
.quick-list{display:flex;flex-wrap:wrap;gap:8px;}
.quick-item{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  padding:6px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface-2);
  text-decoration:none;color:var(--text);font-size:12.5px;
  -webkit-transition:background .2s ease,border-color .2s ease,transform .15s ease;
  transition:background .2s ease,border-color .2s ease,transform .15s ease;
  max-width:100%;overflow:hidden;
}
.quick-item:hover{background:var(--surface-hover);border-color:var(--border-hover);}
.quick-item:active{transform:scale(.96)}

@media(max-width:600px){
  .quick-area{padding:12px 14px;margin-bottom:16px;}
  .quick-item{padding:5px 10px;font-size:12px;}
}

.search-container{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;margin-bottom:24px;}
.search-container > *{margin-right:10px}
.search-container > *:last-child{margin-right:0}
@supports (gap: 1px){ .search-container{gap:10px} .search-container > *{margin-right:0} }

.search{-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto;position:relative;min-width:0;width:0;}
.search .si{position:absolute;left:14px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);width:18px;height:18px;color:var(--text-3);pointer-events:none;-webkit-transition:color .2s ease;transition:color .2s ease;z-index:2;}
.search input{width:100%;height:44px;padding:0 44px 0 42px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;-moz-appearance:none;appearance:none;-webkit-transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;}
.search input::placeholder{color:var(--text-3);opacity:1}
.search input::-webkit-input-placeholder{color:var(--text-3)}
.search input:focus{border-color:rgba(96,165,250,.45);background:var(--input-focus);box-shadow:0 0 0 4px var(--ring);}
.search input:focus ~ .si{color:var(--text-2)}

.search .clear{position:absolute;right:10px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-2);display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1;opacity:0;visibility:hidden;-webkit-transition:opacity .18s ease,visibility .18s ease,background .18s ease;transition:opacity .18s ease,visibility .18s ease,background .18s ease;-webkit-appearance:none;appearance:none;z-index:3;}
.search.has-value .clear{opacity:1;visibility:visible}
.search .clear:hover{background:var(--surface-hover);color:var(--text)}

.search-btn{width:44px;height:44px;-webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;border-radius:12px;border:none;background:var(--grad-brand);background-size:200% 100%;color:#fff;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.25);-webkit-transition:-webkit-transform .15s ease,filter .2s ease,box-shadow .2s ease;transition:transform .15s ease,filter .2s ease,box-shadow .2s ease;-webkit-appearance:none;appearance:none;}
.search-btn:hover{-webkit-filter:brightness(1.08);filter:brightness(1.08);box-shadow:0 6px 20px rgba(59,130,246,.35);}
.search-btn:active{-webkit-transform:scale(.92);transform:scale(.92);}
.search-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}

.theme-toggle{width:44px;height:44px;-webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);-webkit-transition:background .2s ease,color .2s ease,border-color .2s ease,-webkit-transform .15s ease;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .15s ease;-webkit-appearance:none;appearance:none;font-size:18px;line-height:1;}
.theme-toggle:hover{background:var(--surface-hover);border-color:var(--border-hover);color:var(--text)}

@media(max-width:600px){
  .search input{height:40px;font-size:15px;padding:0 40px 0 40px;}
  .search .si{left:12px;width:16px;height:16px;}
  .search-btn{width:40px;height:40px;border-radius:10px}

/* 搜索建议下拉 */
.search-suggest{
  position:absolute;top:100%;left:0;right:0;margin-top:6px;
  background:var(--surface-2);border:1px solid var(--border-hover);
  border-radius:12px;box-shadow:var(--shadow);
  max-height:340px;overflow-y:auto;
  display:none;z-index:50;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.search-suggest.show{display:block;}
.suggest-item{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  padding:10px 14px;text-decoration:none;color:var(--text);
  border-bottom:1px solid var(--border);
  -webkit-transition:background .15s ease;
  transition:background .15s ease;
}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover,.suggest-item.active{background:var(--surface-hover);}
.suggest-item .si-icon{
  width:28px;height:28px;border-radius:8px;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;

}

  margin-bottom:2px;
}
.suggest-item .si-desc{
  font-size:11px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.suggest-empty{
  padding:14px;text-align:center;color:var(--text-3);font-size:12.5px;
}
.suggest-empty b{color:var(--text-2);}

@media(max-width:600px){
  .search-suggest{max-height:280px;}
  .suggest-item{padding:9px 12px;}
  .suggest-item .si-icon{width:26px;height:26px;font-size:13px;margin-right:9px;}
  .suggest-item .si-name{font-size:13px;}
  .suggest-item .si-desc{font-size:10.5px;}
}

  position:fixed;top:0;left:0;right:0;z-index:150;
  display:none;
  align-items:center;gap:8px;
  padding:10px 16px;
  background:linear-gradient(180deg,rgba(30,41,59,.96),rgba(30,41,59,.9));
  border-bottom:1px solid var(--border-hover);
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:13px;
}
.admin-bar.show{display:flex;}
.admin-tag{
  padding:4px 10px;border-radius:6px;
  background:rgba(96,165,250,.25);
  border:1px solid rgba(96,165,250,.45);
  color:#93c5fd;font-weight:600;letter-spacing:.5px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;

.admin-bar button{
  padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);color:#e4edfa;font-size:12.5px;font-weight:500;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  -webkit-transition:background .2s ease,border-color .2s ease,transform .15s ease;

.admin-bar button:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);}

/* ============================================================
   设备性能检测
   ============================================================ */
(function(){
  var lite = false;
  var search = window.location.search || '';
  if (/[?&]full=1/.test(search)){ lite = false; }
  else if (/[?&]lite=1/.test(search)){ lite = true; }
  else {
    if (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4){ lite = true; }
    if (typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 4){ lite = true; }
    if (navigator.connection && navigator.connection.saveData === true){ lite = true; }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ lite = true; }
    var ua = navigator.userAgent || '';
    if (/iPhone OS (7|8|9|10|11|12)_/.test(ua)){ lite = true; }
    var hasMemInfo = typeof navigator.deviceMemory === 'number';
    var hasCpuInfo = typeof navigator.hardwareConcurrency === 'number';
    if (!hasMemInfo && !hasCpuInfo){
      var w = Math.min(window.screen ? window.screen.width : 9999, window.screen ? window.screen.height : 9999);
      if (w <= 360){ lite = true; }
    }
  }
  if (lite){
    var root = document.documentElement;
    if (root.classList) root.classList.add('perf-lite');
    else root.className += ' perf-lite';
  }
})();

/* ================= 主题切换 ================= */
(function(){
  var root = document.documentElement;

  else { root.classList.remove('dark'); if (icon) icon.textContent = '🌙'; }
  if (toggle) {
    toggle.addEventListener('click', function(){
      if (root.classList.contains('dark')) {
        root.classList.remove('dark'); if (icon) icon.textContent = '🌙';
        try { localStorage.setItem('__af_theme__', 'light'); } catch(e) {}
      } else {
        root.classList.add('dark'); if (icon) icon.textContent = '☀️';
        try { localStorage.setItem('__af_theme__', 'dark'); } catch(e) {}
      }
    });
  }
})();

/* ================= 数据管理 ================= */
var STORAGE_KEY = '__af_data__';
var DATA_VERSION = 2;

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

var DEFAULT_ICONS = {
  '原·创': '🏠',
  '网络·工具': '⚒',
  '聆听·音乐': '🎵',
  '影视·追剧': '🎬',
  '系统·软件': '💻',
  '资源·站点': '📦',
  '开源·脚本': '⚙️',
  '其·他': '📌'
};

function fixMissingIcons(data){
  if (!Array.isArray(data)) return data;
  for (var i = 0; i < data.length; i++){
    if (!data[i].icon){
      data[i].icon = DEFAULT_ICONS[data[i].category] || '📁';
    }
  }
  return data;
}

/* 数据版本迁移 */
function migrateData(parsed){
  if (!parsed || typeof parsed !== 'object') return parsed;
  /* 兼容旧格式：直接是数组 */
  if (Array.isArray(parsed)){
    fixMissingIcons(parsed);
    return { version: DATA_VERSION, data: parsed };
  }
  if (parsed.version === undefined){
    parsed.version = DATA_VERSION;
  }
  if (Array.isArray(parsed.data)){
    fixMissingIcons(parsed.data);
  }
  return parsed;
}

function loadData(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      parsed = migrateData(parsed);
      var arr = Array.isArray(parsed) ? parsed : parsed.data;
      if (Array.isArray(arr) && arr.length > 0) {
        return arr;
      }
    }
  } catch(e){}
  return deepClone(DATA);
}

function saveData(data){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: DATA_VERSION,
      data: data

/* ================= 访问统计 / 最近访问 / 常用 ================= */
var STATS_KEY = '__af_stats__';
var STATS_MAX = 200;

function loadStats(){
  try {
    var raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { freq: {}, recent: [] };
}
function saveStats(stats){
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch(e){}
}
function recordVisit(item){
  if (!item || !item.url) return;
  var stats = loadStats();
  var key = item.url;
  stats.freq[key] = (stats.freq[key] || 0) + 1;
  /* recent：去重，最新在前，最多 20 条 */
  stats.recent = stats.recent.filter(function(u){ return u !== key; });
  stats.recent.unshift(key);
  if (stats.recent.length > 20) stats.recent.length = 20;

  /* freq 限制条数，防膨胀 */
  var keys = Object.keys(stats.freq);
  if (keys.length > STATS_MAX){
    /* 按次数排序，保留前 100 */
    keys.sort(function(a,b){ return stats.freq[b] - stats.freq[a]; });
    var keep = {};
    for (var i = 0; i < 100 && i < keys.length; i++){
      keep[keys[i]] = stats.freq[keys[i]];
    }
    stats.freq = keep;
  }

  saveStats(stats);
}
function getUrlCount(url){
  var stats = loadStats();
  return stats.freq[url] || 0;
}
function getRecentItems(max){
  var stats = loadStats();
  var items = [];
  for (var i = 0; i < stats.recent.length && items.length < max; i++){
    var url = stats.recent[i];
    var item = findItemByUrl(url);
    if (item) items.push(item);
  }
  return items;
}
function findItemByUrl(url){
  for (var gi = 0; gi < WORK_DATA.length; gi++){
    var group = WORK_DATA[gi];
    for (var ii = 0; ii < group.items.length; ii++){
      if (group.items[ii].url === url) return group.items[ii];
    }
  }
  return null;
}

/* ================= 工具函数 ================= */
function hexToRgba(hex, alpha){
  hex = String(hex).replace('#','');
  if (hex.length === 3){
    hex = hex.charAt(0)+hex.charAt(0)+hex.charAt(1)+hex.charAt(1)+hex.charAt(2)+hex.charAt(2);
  }
  var r = parseInt(hex.substring(0,2),16);
  var g = parseInt(hex.substring(2,4),16);
  var b = parseInt(hex.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function hasClass(el, cls){
  if (!el) return false;
  if (el.classList) return el.classList.contains(cls);
  return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') > -1;
}
function addClass(el, cls){
  if (!el) return;
  if (el.classList) el.classList.add(cls);
  else if ((' ' + el.className + ' ').indexOf(' ' + cls + ' ') < 0) el.className += ' ' + cls;
}
function removeClass(el, cls){
  if (!el) return;
  if (el.classList) el.classList.remove(cls);
  else el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g,'');
}
function toggleClass(el, cls, force){
  if (force === undefined){
    if (hasClass(el, cls)) removeClass(el, cls); else addClass(el, cls);
  } else if (force){ addClass(el, cls); } else { removeClass(el, cls); }
}
function addEvent(el, type, handler, opts){
  if (!el) return;
  if (el.addEventListener) el.addEventListener(type, handler, opts || false);
  else if (el.attachEvent) el.attachEvent('on' + type, handler);
  else el['on' + type] = handler;
}
function isTyping(el){
  if (!el) return false;
  var tag = el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if (el.isContentEditable) return true;
  return false;
}
function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, function(m){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
  });
}

/* ================= 搜索建议 ================= */
var suggestIndex = -1;
var suggestItems = [];

function buildSuggest(keyword){
  var kw = String(keyword || '').toLowerCase().replace(/^\s+|\s+$/g,'');
  if (!kw) return [];
  var results = [];
  for (var gi = 0; gi < WORK_DATA.length; gi++){
    var group = WORK_DATA[gi];
    for (var ii = 0; ii < group.items.length; ii++){
      var item = group.items[ii];
      if (item.placeholder) continue;
      var name = String(item.name || '').toLowerCase();
      var desc = String(item.desc || '').toLowerCase();
      var cat  = String(group.category || '').toLowerCase();
      var url  = String(item.url || '').toLowerCase();
      if (name.indexOf(kw) > -1 || desc.indexOf(kw) > -1 || cat.indexOf(kw) > -1 || url.indexOf(kw) > -1){
        results.push({
          item: item,
          group: group,
          score: name.indexOf(kw) === 0 ? 3 : (name.indexOf(kw) > -1 ? 2 : 1)
        });
      }
      if (results.length >= 30) break;
    }
    if (results.length >= 30) break;
  }
  results.sort(function(a,b){ return b.score - a.score; });
  return results.slice(0, 12);
}

function renderSuggest(keyword){
  suggestItems = buildSuggest(keyword);
  suggestIndex = -1;
  while (searchSuggest.firstChild) searchSuggest.removeChild(searchSuggest.firstChild);

  if (!keyword || !keyword.replace(/^\s+|\s+$/g,'')){
    removeClass(searchSuggest, 'show');
    return;
  }

  if (suggestItems.length === 0){
    var empty = document.createElement('div');
    empty.className = 'suggest-empty';
    empty.innerHTML = '没有匹配的卡片，按 <b>回车</b> 搜全网';
    searchSuggest.appendChild(empty);
    addClass(searchSuggest, 'show');
    return;
  }

  for (var i = 0; i < suggestItems.length; i++){
    var r = suggestItems[i];
    var item = r.item;
    var a = document.createElement('a');
    a.className = 'suggest-item';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('data-idx', i);

    var ic = document.createElement('span');
    ic.className = 'si-icon';
    ic.textContent = '🌐';

    var meta = document.createElement('span');
    meta.className = 'si-meta';
    var n = document.createElement('div');
    n.className = 'si-name';
    n.textContent = item.name;
    var d = document.createElement('div');
    d.className = 'si-desc';
    d.textContent = r.group.category + ' · ' + (item.desc || '');
    meta.appendChild(n);
    meta.appendChild(d);

    a.appendChild(ic);
    a.appendChild(meta);
    searchSuggest.appendChild(a);

    (function(it){
      addEvent(a, 'click', function(){
        recordVisit(it);
        removeClass(searchSuggest, 'show');
      });
    })(item);
  }
  addClass(searchSuggest, 'show');
}

function moveSuggest(dir){
  if (!suggestItems.length) return;
  var nodes = searchSuggest.querySelectorAll('.suggest-item');
  if (!nodes.length) return;
  suggestIndex += dir;
  if (suggestIndex < 0) suggestIndex = nodes.length - 1;
  if (suggestIndex >= nodes.length) suggestIndex = 0;
  for (var i = 0; i < nodes.length; i++){
    if (i === suggestIndex) addClass(nodes[i], 'active');
    else removeClass(nodes[i], 'active');
  }
  /* 滚动到可见 */
  var active = nodes[suggestIndex];
  if (active && active.scrollIntoView){
    try { active.scrollIntoView({ block: 'nearest' }); } catch(e){}
  }
}

function openSuggest(){
  var nodes = searchSuggest.querySelectorAll('.suggest-item');
  if (suggestIndex >= 0 && nodes[suggestIndex]){
    nodes[suggestIndex].click();
  } else if (nodes.length > 0){
    nodes[0].click();
  } else {
    /* 无建议，走全网搜索 */
    doSearch();
  }
}

/* 事件委托 */
addEvent(app, 'click', function(e){
  e = e || window.event;
  var t = e.target || e.srcElement;
  while (t && t !== app && t.tagName !== 'BUTTON'){ t = t.parentNode; }
  if (!t || t.tagName !== 'BUTTON') return;
  var act = t.getAttribute('data-act');
  if (!act) return;
  if (t.disabled) return;
  e.preventDefault();
  e.stopPropagation();

  var gi = parseInt(t.getAttribute('data-gi'), 10);
  var ii = parseInt(t.getAttribute('data-ii'), 10);

  if (act === 'up-item'){
    if (ii <= 0) return;
    var items = WORK_DATA[gi].items;
    var tmp = items[ii - 1]; items[ii - 1] = items[ii]; items[ii] = tmp;
    saveData(WORK_DATA); render();
  }
  else if (act === 'down-item'){
    var items2 = WORK_DATA[gi].items;
    if (ii >= items2.length - 1) return;
    var tmp2 = items2[ii + 1]; items2[ii + 1] = items2[ii]; items2[ii] = tmp2;
    saveData(WORK_DATA); render();
  }
  else if (act === 'copy-item'){
    var it = WORK_DATA[gi].items[ii];
    copyToClipboard(it.url);
  }
  else if (act === 'edit-item'){ openEditItemModal(gi, ii); }
  else if (act === 'del-item'){
    if (!confirm('确定删除「' + WORK_DATA[gi].items[ii].name + '」？')) return;
    WORK_DATA[gi].items.splice(ii, 1);
    saveData(WORK_DATA); render();
    toast('已删除');
  }
  else if (act === 'up-cat'){
    if (gi <= 0) return;
    var tmp3 = WORK_DATA[gi - 1]; WORK_DATA[gi - 1] = WORK_DATA[gi]; WORK_DATA[gi] = tmp3;
    saveData(WORK_DATA); render();
  }
  else if (act === 'down-cat'){
    if (gi >= WORK_DATA.length - 1) return;
    var tmp4 = WORK_DATA[gi + 1]; WORK_DATA[gi + 1] = WORK_DATA[gi]; WORK_DATA[gi] = tmp4;
    saveData(WORK_DATA); render();
  }
  else if (act === 'edit-cat'){ openEditCatModal(gi); }
  else if (act === 'del-cat'){
    if (!confirm('确定删除分类「' + WORK_DATA[gi].category + '」及其下所有链接？')) return;
    WORK_DATA.splice(gi, 1);
    saveData(WORK_DATA); render();
    toast('已删除分类');
  }
});

/* 复制到剪贴板 */
function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('已复制：' + text);
    }).catch(function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('已复制：' + text);
  } catch(e){
    alert('复制失败，请手动复制：' + text);
  }
  document.body.removeChild(ta);
}

/* ================= Toast ================= */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('__af_toast__');
  if (!el){
    el = document.createElement('div');
    el.id = '__af_toast__';
    el.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:300;' +
      'padding:10px 20px;border-radius:10px;background:rgba(30,41,59,.95);color:#fff;font-size:13px;' +
      'box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;max-width:80vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(-6px)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(0)';
  }, 1800);
}

/* ================= 导出完整 HTML ================= */
function exportFullHtml(){
  var useFetch = true;
  var req;
  try { req = fetch(window.location.href, { cache: 'no-cache' }); }
  catch(e) { useFetch = false; }

  if (useFetch && req && req.then){
    req.then(function(resp){
      if (!resp.ok) throw new Error('fetch failed');
      return resp.text();
    }).then(function(html){
      doExportHtml(html);
    }).catch(function(){
      doExportHtmlFromDom();
    });
  } else {
    doExportHtmlFromDom();
  }
}

function doExportHtmlFromDom(){
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  doExportHtml(html);
}

function doExportHtml(sourceHtml){
  var dataStr = JSON.stringify(WORK_DATA);
  var startMarker = '/* __DATA_START__ */';
  var endMarker = '/* __DATA_END__ */';
  var startIdx = sourceHtml.indexOf(startMarker);
  var endIdx = sourceHtml.indexOf(endMarker);

  if (startIdx === -1 || endIdx === -1 || endIdx < startIdx){
    alert('导出失败：未找到数据标记');
    return;
  }

  var before = sourceHtml.substring(0, startIdx + startMarker.length);
  var after = sourceHtml.substring(endIdx);
  var newHtml = before + '\nvar DATA = ' + dataStr + ';\n' + after;

  newHtml = newHtml.replace(/<body class="[^"]*admin-mode[^"]*"/g, '<body');
  newHtml = newHtml.replace(/\sclass="admin-mode"/g, '');

  var blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);

  toast('已导出 index.html，直接上传覆盖即可');
}

/* ================= 搜索 ================= */
function doSearch(){
  var kw = qEl.value.replace(/^\s+|\s+$/g,'');
  if (!kw){ qEl.focus(); return; }
  window.location.href = 'https://www.bing.com/search?q=' + encodeURIComponent(kw);
}

addEvent(qEl, 'input', function(e){
  var v = e && e.target ? e.target.value : qEl.value;
  toggleClass(searchWrap, 'has-value', v.length > 0);
  renderSuggest(v);
});
addEvent(qEl, 'focus', function(){
  if (qEl.value) renderSuggest(qEl.value);
});
addEvent(qEl, 'keydown', function(e){
  e = e || window.event;
  var key = e.key || e.keyCode;
  if (key === 'ArrowDown' || key === 40){
    if (hasClass(searchSuggest, 'show') && suggestItems.length){
      e.preventDefault(); moveSuggest(1); return false;
    }
  }
  if (key === 'ArrowUp' || key === 38){
    if (hasClass(searchSuggest, 'show') && suggestItems.length){
      e.preventDefault(); moveSuggest(-1); return false;
    }
  }
  if (key === 'Enter' || key === 13){
    if (e.preventDefault) e.preventDefault();
    if (hasClass(searchSuggest, 'show') && suggestItems.length){
      openSuggest();
    } else {
      doSearch();
    }
    return false;
  }
  if (key === 'Escape' || key === 27){
    if (hasClass(searchSuggest, 'show')){
      removeClass(searchSuggest, 'show');
      return false;
    }
    qEl.value = '';
    removeClass(searchWrap, 'has-value');
    if (qEl.blur) qEl.blur();
  }
});
addEvent(searchBtn, 'click', function(e){
  e = e || window.event;
  if (e.preventDefault) e.preventDefault();
  doSearch();
  return false;
});
addEvent(clearBtn, 'click', function(e){
  e = e || window.event;
  if (e.preventDefault) e.preventDefault();
  qEl.value = '';
  removeClass(searchWrap, 'has-value');
  removeClass(searchSuggest, 'show');
  qEl.focus();
  return false;
});

/* 点击外部关闭建议 */
addEvent(document, 'click', function(e){
  e = e || window.event;
  var t = e.target || e.srcElement;
  if (t === qEl) return;
  var isInside = false;
  var cur = t;
  while (cur){
    if (cur === searchSuggest || cur === qEl || cur === searchWrap) { isInside = true; break; }
    cur = cur.parentNode;
  }
  if (!isInside) removeClass(searchSuggest, 'show');
});

/* 全局快捷键 */
addEvent(document, 'keydown', function(e){
  e = e || window.event;
  var key = e.key || '';
  var keyCode = e.keyCode || e.which || 0;

  /* ? 打开快捷键面板 */
  if ((key === '?' || (e.shiftKey && keyCode === 191)) && !isTyping(document.activeElement)){
    e.preventDefault();
    toggleClass(shortcutPanel, 'show');
    return false;
  }

  /* Ctrl/Cmd + K 聚焦搜索 */
  if ((e.ctrlKey || e.metaKey) && (key === 'k' || key === 'K' || keyCode === 75)){
    e.preventDefault();
    qEl.focus();
    return false;
  }

  /* / 聚焦搜索 */
  var isSlash = (key === '/' || keyCode === 191);
  if (isSlash){
    var active = document.activeElement;
    if (active === qEl) return;
    if (isTyping(active)) return;
    e.preventDefault();
    qEl.focus();
    return false;
  }
});

/* ================= 回到顶部 ================= */
var ticking = false;
var raf2 = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(cb){ return setTimeout(cb, 16); };
function onScroll(){
  if (ticking) return;
  ticking = true;
  raf2(function(){
    var y = window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || (document.body && document.body.scrollTop) || 0;
    toggleClass(backTop, 'show', y > 320);
    ticking = false;
  });
}
var supportsPassive = false;
try {
  var testOpts = Object.defineProperty({}, 'passive', { get: function(){ supportsPassive = true; return false; } });
  window.addEventListener('__test_passive__', null, testOpts);
  window.removeEventListener('__test_passive__', null, testOpts);
} catch(e){}
if (window.addEventListener){ window.addEventListener('scroll', onScroll, supportsPassive ? { passive: true } : false); }
else if (window.attachEvent){ window.attachEvent('onscroll', onScroll); }
else { window.onscroll = onScroll; }

addEvent(backTop, 'click', function(){
  if ('scrollBehavior' in document.documentElement.style){
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } catch (e) {}
  }
  var startY = window.pageYOffset || document.documentElement.scrollTop || 0;
  var startTime = null;
  var duration = 400;
  function step(timestamp){
    if (!startTime) startTime = timestamp;
    var p = Math.min((timestamp - startTime) / duration, 1);
    var ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    window.scrollTo(0, startY * (1 - ease));
    if (p < 1) raf2(step);
  }
  raf2(step);
});

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/AFeng/sw.js').catch(function(){});

}
