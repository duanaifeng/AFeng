<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AiFeng · 技术探索者，赶集日历、工具导航、数码维护">
<meta name="keywords" content="AiFeng,西邑赶集,技术探索,工具导航">
<meta name="theme-color" content="#0a0f1a">
<title>AiFeng · 技术探索者</title>
<style>
/* ================= 主题变量 ================= */
:root{
  --bg:#0a0f1a;
  --bg-2:#0e1524;
  --surface:rgba(147,197,253,.03);
  --surface-2:rgba(147,197,253,.055);
  --surface-hover:rgba(147,197,253,.08);
  --border:rgba(147,197,253,.08);
  --border-hover:rgba(96,165,250,.24);
  --text:#e4edfa;
  --text-2:#9db0cb;
  --text-3:#6b7d99;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 4px 14px rgba(0,0,0,.24);
  --input-bg:rgba(147,197,253,.04);
  --input-focus:rgba(147,197,253,.07);
  --glow-1:rgba(59,130,246,.16);
  --glow-2:rgba(56,189,248,.12);
  --ring:rgba(96,165,250,.2);
  --card-shine:rgba(147,197,253,.32);
  --grad-brand:linear-gradient(135deg,#7dd3fc 0%,#60a5fa 45%,#3b82f6 100%);
  --grad-text:linear-gradient(45deg,#fff 0%,#93c5fd 25%,#38bdf8 55%,#93c5fd 75%,#fff 100%);
}

/* ================= 基础重置 ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  font-family:
    -apple-system, BlinkMacSystemFont,
    'HarmonyOS Sans SC', 'HarmonyOS Sans',
    'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
    'Microsoft YaHei', 'WenQuanYi Micro Hei',
    'Helvetica Neue', Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{color:inherit}

/* ================= 背景装饰 ================= */
.bg-layer{
  position:fixed;
  top:0; right:0; bottom:0; left:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
.bg-gradient{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  background:
    radial-gradient(1100px 700px at 15% -15%,var(--glow-1),transparent 65%),
    radial-gradient(900px 600px at 92% 8%,var(--glow-2),transparent 62%);
}
.bg-noise{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(0,0,0,.42) 100%);
}

/* ================= 内容容器 ================= */
.wrap{
  max-width:1000px;margin:0 auto;padding:0 20px;
  position:relative;z-index:1;
}

/* ================= Hero ================= */
.hero{padding:38px 0 24px}
.profile-card{
  position:relative;
  border-radius:24px;
  border:1px solid var(--border);
  background:var(--surface);
  padding:26px 28px 22px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
@supports ((-webkit-backdrop-filter: blur(16px)) or (backdrop-filter: blur(16px))) {
  .profile-card{
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
  }
}
.profile-card::before{
  content:'';
  position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--card-shine),transparent);
  pointer-events:none;
}

.profile-top{
  position:relative;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
}
.profile-top > *{margin-right:20px}
.profile-top > *:last-child{margin-right:0}
@supports (gap: 1px){
  .profile-top{gap:20px}
  .profile-top > *{margin-right:0}
}

.avatar-wrap{
  position:relative;width:82px;height:82px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
}
.avatar-wrap::before{
  content:'';
  position:absolute;top:50%;left:50%;
  width:160%;height:160%;
  -webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(96,165,250,.22) 0%,transparent 68%);
  -webkit-animation:glow 6s ease-in-out infinite;
  animation:glow 6s ease-in-out infinite;
  z-index:0;pointer-events:none;
}
.avatar{
  position:relative;width:100%;height:100%;
  border-radius:50%;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  font-size:34px;color:#0a0f1a;
  background:var(--grad-brand);
  background-size:220% 100%;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 6px 20px rgba(59,130,246,.32),inset 0 2px 8px rgba(0,0,0,.15);
  -webkit-animation:shimmer 8s ease-in-out infinite;
  animation:shimmer 8s ease-in-out infinite;
  z-index:1;
}

.profile-info{min-width:0;-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto}
.name{
  font-size:26px;font-weight:900;letter-spacing:2.5px;
  display:inline-block;position:relative;
  padding-bottom:9px;margin-bottom:7px;
  color:#93c5fd;
}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .name{
    background:var(--grad-text);
    background-size:280% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    -webkit-animation:shimmer 7s ease-in-out infinite;
    animation:shimmer 7s ease-in-out infinite;
  }
}
.name::after{
  content:'';
  position:absolute;bottom:0;left:0;
  width:52px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#60a5fa,#38bdf8);
}
.tagline{
  font-size:12px;color:var(--text-3);
  letter-spacing:1.6px;font-weight:500;
}

.bio{
  position:relative;
  font-size:13px;color:var(--text-2);
  line-height:1.95;letter-spacing:.2px;
  margin:20px 0 0;
  text-align:justify;
  padding-left:12px;
  border-left:2px solid var(--border);
}

.stats{
  position:relative;
  display:grid;display:-ms-grid;
  grid-template-columns:repeat(2,1fr);
  -ms-grid-columns:1fr 1fr;
  margin-top:20px;padding-top:18px;
  border-top:1px solid var(--border);
}
.stat{position:relative;text-align:center}
.stat + .stat::before{
  content:'';
  position:absolute;left:0;top:15%;
  height:70%;width:1px;
  background:var(--border);
}
.stat b{
  display:block;
  font-size:20px;font-weight:800;letter-spacing:.5px;
  color:var(--text);
}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .stat b{
    background:linear-gradient(135deg,var(--text),var(--text-2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
}
.stat span{
  font-size:10.5px;color:var(--text-3);
  letter-spacing:1.5px;margin-top:2px;display:block;
}

@media(max-width:600px){
  .hero{padding:28px 0 20px}
  .profile-card{padding:22px 20px 18px;border-radius:20px}
  .profile-top > *{margin-right:16px}
  @supports (gap: 1px){ .profile-top{gap:16px} .profile-top > *{margin-right:0} }
  .avatar-wrap{width:70px;height:70px}
  .avatar{font-size:28px}
  .name{font-size:22px;letter-spacing:2px}
  .tagline{font-size:11px;letter-spacing:1.2px}
  .bio{font-size:12.5px;line-height:1.9;margin-top:16px}
  .stat b{font-size:18px}
}

/* ================= 搜索区 ================= */
.search-container{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  margin-bottom:30px;
}
.search-container > *{margin-right:10px}
.search-container > *:last-child{margin-right:0}
@supports (gap: 1px){
  .search-container{gap:10px}
  .search-container > *{margin-right:0}
}

.search{
  -webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto;
  position:relative;min-width:0;
  width:0;
}
.search .si{
  position:absolute;left:14px;top:50%;
  -webkit-transform:translateY(-50%);transform:translateY(-50%);
  width:18px;height:18px;
  color:var(--text-3);
  pointer-events:none;
  -webkit-transition:color .2s ease;transition:color .2s ease;
  z-index:2;
}
.search input{
  width:100%;height:46px;
  padding:0 44px 0 42px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--input-bg);
  color:var(--text);
  font-size:16px;font-family:inherit;outline:none;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  -webkit-transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;
  transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;
}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--text-3);opacity:1}
.search input::-webkit-input-placeholder{color:var(--text-3)}
.search input:focus{
  border-color:rgba(96,165,250,.45);
  background:var(--input-focus);
  box-shadow:0 0 0 4px var(--ring);
}
.search input:focus ~ .si{color:var(--text-2)}

.search .clear{
  position:absolute;right:10px;top:50%;
  -webkit-transform:translateY(-50%);transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  border:none;background:var(--surface-2);color:var(--text-2);
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  cursor:pointer;font-size:13px;line-height:1;
  opacity:0;visibility:hidden;
  -webkit-transition:opacity .18s ease,visibility .18s ease,background .18s ease;
  transition:opacity .18s ease,visibility .18s ease,background .18s ease;
  -webkit-appearance:none;appearance:none;
  z-index:3;
}
.search.has-value .clear{opacity:1;visibility:visible}
.search .clear:hover{background:var(--surface-hover);color:var(--text)}

.search-btn{
  width:46px;height:46px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
  border-radius:14px;border:none;
  background:var(--grad-brand);
  background-size:200% 100%;
  color:#0a0f1a;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(59,130,246,.32);
  -webkit-transition:-webkit-transform .15s ease,filter .2s ease,box-shadow .2s ease;
  transition:transform .15s ease,filter .2s ease,box-shadow .2s ease;
  -webkit-appearance:none;appearance:none;
}
.search-btn:hover{
  -webkit-filter:brightness(1.08);filter:brightness(1.08);
  box-shadow:0 6px 20px rgba(59,130,246,.45);
}
.search-btn:active{
  -webkit-transform:scale(.92);transform:scale(.92);
}
.search-btn svg{
  width:20px;height:20px;
  stroke:currentColor;fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
}

@media(max-width:600px){
  .search input{height:42px;font-size:16px;padding:0 38px 0 38px;}
  .search .si{left:12px;width:16px;height:16px;}
  .search-btn{width:42px;height:42px;border-radius:12px}
  .search-btn svg{width:18px;height:18px}
  .search-container{margin-bottom:22px;}
}

/* ================= 分类 ================= */
main{padding:0 0 40px}
.group{
  margin-bottom:34px;
  contain:layout style paint;
}
.group-head{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  margin-bottom:14px;padding-left:2px;
}
.group-head > *{margin-right:10px}
.group-head > *:last-child{margin-right:0}
@supports (gap: 1px){
  .group-head{gap:10px}
  .group-head > *{margin-right:0}
}
.group-bar{
  width:4px;height:16px;border-radius:3px;
  background:var(--c,#60a5fa);
  box-shadow:0 0 10px var(--c,#60a5fa);
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
}
.group-head h2{font-size:14.5px;font-weight:700;letter-spacing:.8px}
.group-head em{
  font-style:normal;font-size:11.5px;color:var(--text-3);
  margin-left:auto;padding-right:2px;
}
.grid{
  display:grid;display:-ms-grid;
  gap:11px;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  -ms-grid-columns:1fr;
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;-ms-grid-columns:1fr}
}

/* ================= 卡片 ================= */
.card{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  padding:14px;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--surface);
  text-decoration:none;color:inherit;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);
  -webkit-transition:-webkit-transform .2s cubic-bezier(.2,.8,.3,1),
             background .25s ease,
             border-color .25s ease,
             box-shadow .25s ease;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),
             background .25s ease,
             border-color .25s ease,
             box-shadow .25s ease;
}
@supports ((-webkit-backdrop-filter: blur(12px)) or (backdrop-filter: blur(12px))) {
  .card{
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
  }
}
.card > *{margin-right:13px}
.card > *:last-child{margin-right:0}
@supports (gap: 1px){
  .card{gap:13px}
  .card > *{margin-right:0}
}
.card::before{
  content:'';
  position:absolute;top:0;right:0;bottom:0;left:0;
  background:radial-gradient(220px 110px at 0% 0%,var(--c),transparent 68%);
  opacity:0;
  -webkit-transition:opacity .3s ease;
  transition:opacity .3s ease;
  pointer-events:none;
}
.card:hover{
  -webkit-transform:translateY(-2px);transform:translateY(-2px);
  background:var(--surface-hover);
  border-color:var(--border-hover);
  box-shadow:var(--shadow);
}
.card:hover::before{opacity:.09}
.card:active{
  -webkit-transform:translateY(-1px) scale(.992);
  transform:translateY(-1px) scale(.992);
}
.card:focus{outline:none}
@supports selector(:focus-visible){
  .card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
}

/* 多入口卡片右上角小标记 */
.card.has-popup::after{
  content:'';
  position:absolute;
  top:9px;right:9px;
  width:6px;height:6px;
  border-radius:50%;
  background:#60a5fa;
  box-shadow:0 0 8px #60a5fa;
  pointer-events:none;
}

/* 占位卡片（敬请期待） */
.card.card-placeholder{
  cursor:default;
  border-style:dashed;
  background:transparent;
  box-shadow:none;
  opacity:.7;
}
.card.card-placeholder:hover{
  -webkit-transform:none;
  transform:none;
  background:transparent;
  border-color:var(--border);
  box-shadow:none;
}
.card.card-placeholder:hover::before{opacity:0}
.card.card-placeholder:active{
  -webkit-transform:none;
  transform:none;
}
.card.card-placeholder:hover .ic{
  -webkit-transform:none;
  transform:none;
}
.card.card-placeholder .ic{
  background:rgba(148,163,184,.1);
  border-color:rgba(148,163,184,.22);
  color:#94a3b8;
}
.card.card-placeholder .meta .n{
  color:var(--text-2);
  font-weight:500;
}

.ic{
  width:40px;height:40px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
  border-radius:11px;
  position:relative;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  overflow:hidden;
  background:var(--c-bg, rgba(96,165,250,.15));
  border:1px solid var(--c-border, rgba(96,165,250,.3));
  color:var(--c, #60a5fa);
  font-weight:800;font-size:15px;
  -webkit-transition:-webkit-transform .2s ease;
  transition:transform .2s ease;
}
.card:hover .ic{
  -webkit-transform:scale(1.05);transform:scale(1.05);
}
.ic img{
  position:absolute;top:0;right:0;bottom:0;left:0;
  width:100%;height:100%;
  -o-object-fit:contain;object-fit:contain;
  padding:8px;
  opacity:0;
  -webkit-transition:opacity .25s ease;
  transition:opacity .25s ease;
}
.ic img.loaded{opacity:1}
.meta{min-width:0;-webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto}
.meta .n{
  font-size:14.5px;font-weight:600;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.2px;
}
.meta .d{
  font-size:11.5px;color:var(--text-3);line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  max-height:2.9em;
}

/* ================= 弹窗 ================= */
.modal{
  position:fixed;
  top:0;right:0;bottom:0;left:0;
  z-index:200;
  display:none;
  -webkit-box-align:center;
  -ms-flex-align:center;
  align-items:center;
  -webkit-box-pack:center;
  -ms-flex-pack:center;
  justify-content:center;
  padding:20px;
}
.modal.show{
  display:-webkit-box;
  display:-ms-flexbox;
  display:flex;
  -webkit-animation:modalIn .22s ease both;
  animation:modalIn .22s ease both;
}
.modal-mask{
  position:absolute;
  top:0;right:0;bottom:0;left:0;
  background:rgba(6,10,20,.72);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  -webkit-animation:fadeIn .22s ease both;
  animation:fadeIn .22s ease both;
  border:none;padding:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.modal-card{
  position:relative;
  width:100%;
  max-width:380px;
  border-radius:20px;
  border:1px solid var(--border-hover);
  background:linear-gradient(180deg,rgba(20,30,50,.98),rgba(14,21,36,.98));
  padding:20px 20px 16px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  -webkit-animation:cardIn .28s cubic-bezier(.2,.8,.3,1) both;
  animation:cardIn .28s cubic-bezier(.2,.8,.3,1) both;
}
.modal-head{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  margin-bottom:14px;
}
.modal-head h3{
  -webkit-box-flex:1;-ms-flex:1 1 auto;flex:1 1 auto;
  font-size:15px;font-weight:700;letter-spacing:.5px;
  color:var(--text);
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  min-width:0;
}
.modal-head h3::before{
  content:'';
  width:4px;height:14px;border-radius:3px;
  background:#60a5fa;
  box-shadow:0 0 10px #60a5fa;
  margin-right:8px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
}
.modal-close{
  width:30px;height:30px;border-radius:50%;
  border:none;background:var(--surface-2);color:var(--text-2);
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  font-size:14px;line-height:1;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  -webkit-transition:background .2s ease,color .2s ease,-webkit-transform .15s ease;
  transition:background .2s ease,color .2s ease,transform .15s ease;
  margin-left:10px;
  -webkit-box-flex:0;-ms-flex:0 0 auto;flex:0 0 auto;
}
.modal-close:hover{background:var(--surface-hover);color:var(--text)}
.modal-close:active{-webkit-transform:scale(.92);transform:scale(.92)}

.modal-opt{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--surface);

(function(){
  var lite = false;
  var search = window.location.search || '';

  if (/[?&]full=1/.test(search)){
    lite = false;
  } else if (/[?&]lite=1/.test(search)){
    lite = true;
  } else {
    if (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4){
      lite = true;
    }
    if (typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 4){
      lite = true;
    }
    if (navigator.connection && navigator.connection.saveData === true){
      lite = true;
    }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      lite = true;
    }
    var ua = navigator.userAgent || '';
    if (/iPhone OS (7|8|9|10|11|12)_/.test(ua)){
      lite = true;
    }
    var hasMemInfo = typeof navigator.deviceMemory === 'number';
    var hasCpuInfo = typeof navigator.hardwareConcurrency === 'number';
    if (!hasMemInfo && !hasCpuInfo){
      var w = Math.min(window.screen ? window.screen.width : 9999, window.screen ? window.screen.height : 9999);
      if (w <= 360){
        lite = true;
      }
    }
  }

  if (lite){
    var root = document.documentElement;
    if (root.classList) root.classList.add('perf-lite');
    else root.className += ' perf-lite';
  }
})();

/* ================= 工具函数 ================= */
function hexToRgba(hex, alpha){
  hex = String(hex).replace('#','');
  if (hex.length === 3){
    hex = hex.charAt(0)+hex.charAt(0)+hex.charAt(1)+hex.charAt(1)+hex.charAt(2)+hex.charAt(2);
  }
  var r = parseInt(hex.substring(0,2),16);
  var g = parseInt(hex.substring(2,4),16);
  var b = parseInt(hex.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function hasClass(el, cls){
  if (!el) return false;
  if (el.classList) return el.classList.contains(cls);
  return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') > -1;
}
function addClass(el, cls){
  if (!el) return;
  if (el.classList) el.classList.add(cls);
  else if ((' ' + el.className + ' ').indexOf(' ' + cls + ' ') < 0) el.className += ' ' + cls;
}
function removeClass(el, cls){
  if (!el) return;
  if (el.classList) el.classList.remove(cls);
  else el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g,'');
}
function toggleClass(el, cls, force){
  if (force === undefined){
    if (hasClass(el, cls)) removeClass(el, cls); else addClass(el, cls);
  } else if (force){ addClass(el, cls); } else { removeClass(el, cls); }
}
function addEvent(el, type, handler, opts){
  if (!el) return;
  if (el.addEventListener) el.addEventListener(type, handler, opts || false);
  else if (el.attachEvent) el.attachEvent('on' + type, handler);
  else el['on' + type] = handler;
}
function isTyping(el){
  if (!el) return false;
  var tag = el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if (el.isContentEditable) return true;
  return false;
}
function extractHost(url){
  try {
    var s = String(url || '');
    if (s.indexOf('://') === -1) return '';
    var after = s.split('://')[1];
    if (!after) return '';
    var host = after.split('/')[0].split('?')[0].split('#')[0];
    return host || '';
  } catch(e){
    return '';
  }
}

/* ================= DOM 引用 ================= */
var app       = document.getElementById('app');
var qEl       = document.getElementById('q');
var searchWrap= document.getElementById('searchWrap');
var clearBtn  = document.getElementById('clearBtn');
var searchBtn = document.getElementById('searchBtn');
var statSite  = document.getElementById('statSite');
var statCat   = document.getElementById('statCat');
var backTop   = document.getElementById('backTop');
var modal     = document.getElementById('modal');
var modalTitle= document.getElementById('modalTitle');
var modalBody = document.getElementById('modalBody');

/* 统计：占位卡片（placeholder）不计入站点总数 */
var TOTAL_SITES = 0;
var TOTAL_CATS  = DATA.length;
for (var i = 0; i < DATA.length; i++){
  var its = DATA[i].items;
  for (var j = 0; j < its.length; j++){
    if (!its[j].placeholder) TOTAL_SITES++;
  }
}

/* ================= favicon ================= */
var FAVICON_API = 'https://api.iowen.cn/favicon/';
var FAVICON_TIMEOUT = 6000;

function createFaviconImg(url){
  var host = extractHost(url);
  if (!host) return null;

  var img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';
  img.setAttribute('aria-hidden', 'true');

  var settled = false;
  var timer = null;

  function settle(ok){
    if (settled) return;
    settled = true;
    if (timer){ clearTimeout(timer); timer = null; }
    if (ok){
      addClass(img, 'loaded');
    } else if (img.parentNode){
      img.parentNode.removeChild(img);
    }
  }

  img.onload  = function(){ settle(true);  };
  img.onerror = function(){ settle(false); };
  timer = setTimeout(function(){ settle(false); }, FAVICON_TIMEOUT);
  img.src = FAVICON_API + encodeURIComponent(host) + '.png';
  return img;
}

/* ================= 弹窗逻辑 ================= */
function openPopup(item){
  if (!modal) return;
  modalTitle.textContent = item.name;

  while (modalBody.firstChild) modalBody.removeChild(modalBody.firstChild);

  var opts = item.popup || [];
  for (var oi = 0; oi < opts.length; oi++){
    var opt = opts[oi];
    var a = document.createElement('a');
    a.className = 'modal-opt';
    a.href = opt.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    var ic = document.createElement('div');
    ic.className = 'opt-ic';
    ic.textContent = opt.icon || '🔗';

    var tx = document.createElement('div');
    tx.className = 'opt-tx';
    var b = document.createElement('b');
    b.textContent = opt.label || '打开';
    var s = document.createElement('span');
    s.textContent = opt.desc || '';
    tx.appendChild(b);
    tx.appendChild(s);

    var arw = document.createElement('div');
    arw.className = 'opt-arw';
    arw.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    a.appendChild(ic);
    a.appendChild(tx);
    a.appendChild(arw);
    modalBody.appendChild(a);
  }

  addClass(modal, 'show');
  modal.setAttribute('aria-hidden', 'false');
}

function closePopup(){
  if (!modal) return;
  removeClass(modal, 'show');
  modal.setAttribute('aria-hidden', 'true');
}

(function(){
  var closers = document.querySelectorAll('[data-close]');
  for (var k = 0; k < closers.length; k++){
    addEvent(closers[k], 'click', function(e){
      e = e || window.event;
      if (e.preventDefault) e.preventDefault();
      closePopup();
    });
  }
})();

addEvent(document, 'keydown', function(e){
  e = e || window.event;
  var key = e.key || e.keyCode;
  if ((key === 'Escape' || key === 27) && hasClass(modal, 'show')){
    closePopup();
  }
});

/* ================= 渲染 ================= */
function bindPopup(el, itemData){
  addEvent(el, 'click', function(e){
    e = e || window.event;
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    openPopup(itemData);
    return false;
  });
}

function render(){
  var frag = document.createDocumentFragment();

  for (var gi = 0; gi < DATA.length; gi++){
    var group = DATA[gi];

    var sec = document.createElement('section');
    sec.className = 'group';
    sec.style.setProperty('--c', group.color);
    sec.style.animationDelay = (gi * 0.045) + 's';

    var head = document.createElement('div');
    head.className = 'group-head';
    var bar = document.createElement('span');
    bar.className = 'group-bar';
    bar.setAttribute('aria-hidden', 'true');
    var h2 = document.createElement('h2');
    h2.textContent = group.category;
    var em = document.createElement('em');
    em.textContent = group.items.length + ' 个';
    head.appendChild(bar);
    head.appendChild(h2);
    head.appendChild(em);
    sec.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'grid';

    for (var ii = 0; ii < group.items.length; ii++){
      var item = group.items[ii];

      /* ============ 占位卡片（敬请期待）============ */
      if (item.placeholder){
        var ph = document.createElement('div');
        ph.className = 'card card-placeholder';
        ph.style.setProperty('--c', group.color);
        ph.style.setProperty('--c-bg', hexToRgba(group.color, 0.15));
        ph.style.setProperty('--c-border', hexToRgba(group.color, 0.3));
        ph.setAttribute('role', 'note');
        ph.setAttribute('aria-label', item.name + '：' + item.desc);

        var phIc = document.createElement('div');
        phIc.className = 'ic';
        phIc.setAttribute('aria-hidden', 'true');
        var phSpan = document.createElement('span');
        phSpan.textContent = '✦';
        phIc.appendChild(phSpan);

        var phMeta = document.createElement('div');
        phMeta.className = 'meta';
        var phN = document.createElement('div');
        phN.className = 'n';
        phN.textContent = item.name;
        var phD = document.createElement('div');
        phD.className = 'd';
        phD.textContent = item.desc;
        phMeta.appendChild(phN);
        phMeta.appendChild(phD);

        ph.appendChild(phIc);
        ph.appendChild(phMeta);
        grid.appendChild(ph);
        continue;
      }

      /* ============ 普通卡片 ============ */
      var a = document.createElement('a');
      a.className = 'card';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.setProperty('--c', group.color);
      a.style.setProperty('--c-bg', hexToRgba(group.color, 0.15));
      a.style.setProperty('--c-border', hexToRgba(group.color, 0.3));
      a.setAttribute('title', item.name + ' · ' + item.desc);

      var ic = document.createElement('div');
      ic.className = 'ic';
      ic.setAttribute('aria-hidden', 'true');

      var letter = document.createElement('span');
      var rawName = String(item.name || '').replace(/^\s+|\s+$/g,'');
      letter.textContent = rawName.charAt(0).toUpperCase() || '·';
      ic.appendChild(letter);

      var faviconImg = createFaviconImg(item.url);
      if (faviconImg) ic.appendChild(faviconImg);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var nm = document.createElement('div');
      nm.className = 'n';
      nm.textContent = item.name;
      var ds = document.createElement('div');
      ds.className = 'd';
      ds.textContent = item.desc;
      meta.appendChild(nm);
      meta.appendChild(ds);

      a.appendChild(ic);
      a.appendChild(meta);

      if (item.popup && item.popup.length){
        a.href = 'javascript:void(0)';
        a.removeAttribute('target');
        a.removeAttribute('rel');
        a.setAttribute('title', item.name + ' · 点击选择入口');
        addClass(a, 'has-popup');
        bindPopup(a, item);
      }

      grid.appendChild(a);
    }

    sec.appendChild(grid);
    frag.appendChild(sec);
  }

  app.innerHTML = '';
  app.appendChild(frag);

  if (statSite) statSite.textContent = TOTAL_SITES;
  if (statCat)  statCat.textContent  = TOTAL_CATS;
}

/* ================= 必应搜索 ================= */
function doSearch(){
  var kw = qEl.value.replace(/^\s+|\s+$/g,'');
  if (!kw){ qEl.focus(); return; }
  window.location.href = 'https://www.bing.com/search?q=' + encodeURIComponent(kw);
}

/* ================= 事件绑定 ================= */
addEvent(qEl, 'input', function(e){
  var v = e && e.target ? e.target.value : qEl.value;
  toggleClass(searchWrap, 'has-value', v.length > 0);
});

addEvent(qEl, 'keydown', function(e){
  e = e || window.event;
  var key = e.key || e.keyCode;
  if (key === 'Enter' || key === 13){
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    e.returnValue = false;
    doSearch();
    return false;
  }
  if (key === 'Escape' || key === 27){
    qEl.value = '';
    removeClass(searchWrap, 'has-value');
    if (qEl.blur) qEl.blur();
  }
});

addEvent(searchBtn, 'click', function(e){
  e = e || window.event;
  if (e.preventDefault) e.preventDefault();
  doSearch();
  return false;
});

addEvent(clearBtn, 'click', function(e){
  e = e || window.event;
  if (e.preventDefault) e.preventDefault();
  qEl.value = '';
  removeClass(searchWrap, 'has-value');
  qEl.focus();
  return false;
});

addEvent(document, 'keydown', function(e){
  e = e || window.event;
  var key = e.key || '';
  var keyCode = e.keyCode || e.which || 0;
  var isSlash = (key === '/' || keyCode === 191);
  if (!isSlash) return;
  var active = document.activeElement;
  if (active === qEl) return;
  if (isTyping(active)) return;
  if (e.preventDefault) e.preventDefault();
  qEl.focus();
});

/* ================= 回到顶部 ================= */
var ticking = false;
var raf = window.requestAnimationFrame ||
          window.webkitRequestAnimationFrame ||
          window.mozRequestAnimationFrame ||
          function(cb){ return setTimeout(cb, 16); };

function onScroll(){
  if (ticking) return;
  ticking = true;
  raf(function(){
    var y = window.pageYOffset ||
            (document.documentElement && document.documentElement.scrollTop) ||
            (document.body && document.body.scrollTop) || 0;
    toggleClass(backTop, 'show', y > 320);
    ticking = false;
  });
}

var supportsPassive = false;
try {
  var testOpts = Object.defineProperty({}, 'passive', {
    get: function(){ supportsPassive = true; return false; }
  });
  window.addEventListener('__test_passive__', null, testOpts);
  window.removeEventListener('__test_passive__', null, testOpts);
} catch(e){}

if (window.addEventListener){
  window.addEventListener('scroll', onScroll, supportsPassive ? { passive: true } : false);
} else if (window.attachEvent){
  window.attachEvent('onscroll', onScroll);
} else {
  window.onscroll = onScroll;
}

addEvent(backTop, 'click', function(){
  if ('scrollBehavior' in document.documentElement.style){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    var startY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var startTime = null;
    var duration = 400;
    function step(timestamp){
      if (!startTime) startTime = timestamp;
      var p = Math.min((timestamp - startTime) / duration, 1);
      var ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
      window.scrollTo(0, startY * (1 - ease));
      if (p < 1) raf(step);
    }
    raf(step);
  }
});

/* ================= 启动 ================= */
render();
</script>
