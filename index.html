<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="AiFeng · 技术探索者，赶集日历、工具导航、数码维护">
<meta name="keywords" content="AiFeng,西邑赶集,技术探索,工具导航">
<meta name="theme-color" content="#05050a">
<title>AiFeng · 技术探索者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
    --primary-red: #e63946;
    --gold: #ffd700;
    --light-gold: #ffed4e;
    --white: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.18);
}
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #05050a;
    color: var(--white);
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 46px 14px 40px;
    text-align: center;
    position: relative;
    -webkit-overflow-scrolling: touch;
}

/* 背景 */
.bg-base {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, #0a0a14 0%, #05050a 45%, #0a0810 100%);
}
.bg-glow {
    position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
    transform: translateZ(0);
}
.bg-glow-1 {
    width: 700px; height: 700px; top: -22%; left: -25%;
    background: radial-gradient(circle, rgba(230,57,70,0.40) 0%, rgba(230,57,70,0.18) 30%, rgba(230,57,70,0.04) 55%, transparent 72%);
    animation: drift1 32s ease-in-out infinite;
}
.bg-glow-2 {
    width: 620px; height: 620px; bottom: -25%; right: -22%;
    background: radial-gradient(circle, rgba(255,215,0,0.28) 0%, rgba(255,215,0,0.12) 30%, rgba(255,215,0,0.03) 55%, transparent 72%);
    animation: drift2 38s ease-in-out infinite;
}
.bg-glow-3 {
    width: 520px; height: 520px; top: 38%; right: 10%;
    background: radial-gradient(circle, rgba(123,44,191,0.26) 0%, rgba(123,44,191,0.10) 35%, transparent 72%);
    animation: drift3 44s ease-in-out infinite;
}
.bg-dots {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1px, transparent 1.5px);
    background-size: 32px 32px;
    opacity: 0.55;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 25%, transparent 85%);
    mask-image: radial-gradient(ellipse at 50% 40%, black 25%, transparent 85%);
}
.bg-vignette {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0; pointer-events: none;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.07), transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(230,57,70,0.08), transparent 50%),
        radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,0.55) 100%);
}

/* 主容器 */
.container {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

/* 卡片 */
.glass {
    position: relative;
    border-radius: 28px;
    padding: 40px 22px 32px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.15) inset;
    text-align: center;
}
.glass::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    pointer-events: none;
}

/* 头像 */
.avatar-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 26px;
}
.avatar-wrap::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 240%; height: 240%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
        rgba(255,215,0,0.32) 0%,
        rgba(230,57,70,0.18) 30%,
        rgba(230,57,70,0.06) 50%,
        transparent 70%);
    animation: avatarGlow 4s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
}
.avatar-wrap::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 320%; height: 320%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
        rgba(230,57,70,0.18) 0%,
        rgba(255,215,0,0.06) 35%,
        transparent 65%);
    animation: avatarGlow 6s ease-in-out infinite reverse;
    z-index: 0;
    pointer-events: none;
}
.avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700 0%, #ffed4e 25%, #e63946 55%, #c1211c 100%);
    background-size: 300% 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 54px;
    color: #fff;
    box-shadow:
        0 0 30px rgba(230,57,70,0.5),
        inset 0 2px 10px rgba(0,0,0,0.25);
    border: 3px solid rgba(255,255,255,0.22);
    animation: shimmer 4s ease-in-out infinite;
    z-index: 1;
}

/* 标题 */
.app-title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 14px;
    background: linear-gradient(45deg,
        var(--white) 0%,
        var(--gold) 30%,
        var(--light-gold) 50%,
        var(--gold) 70%,
        var(--white) 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease-in-out infinite;
    position: relative;
    padding-bottom: 12px;
}
.app-title::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary-red), var(--gold), transparent);
    border-radius: 2px;
}

/* 简介 */
.bio {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.85;
    letter-spacing: 0.3px;
    margin-bottom: 28px;
    text-align: justify;
    text-align-last: center;
}

/* 按钮组 */
.links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 16px;
    color: rgba(255, 255, 255, 0.92);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
}
.link-btn .icon {
    font-size: 18px;
    margin-right: 10px;
    flex-shrink: 0;
}
.link-btn:active {
    transform: scale(0.97);
    background: rgba(255, 215, 0, 0.1);
    border-color: rgba(255, 215, 0, 0.45);
    color: var(--gold);
}

/* 页脚 */
.footer {
    text-align: center;
    padding: 30px 20px 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: 1px;
    line-height: 1.9;
}
.footer .heart { color: var(--primary-red); display: inline-block; }

/* 关键帧 */
@keyframes shimmer {
    0%, 100% { background-position: -200% center; }
    50% { background-position: 200% center; }
}
@keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.12); }
}
@keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -40px) scale(1.08); }
}
@keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 50px) scale(0.92); }
}
@keyframes avatarGlow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
    50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
}
</style>
</head>
