  border:1.5px solid var(--border-gold);
  box-shadow:0 16px 40px -12px rgba(140,50,20,.3),inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
}
.tab-pill{
  position:absolute;top:6px;bottom:6px;left:0;width:0;z-index:0;
  border-radius:var(--r-ctrl);
  background:linear-gradient(160deg,var(--red),var(--red-deep));
  box-shadow:0 6px 16px -6px rgba(200,26,36,.6),inset 0 1px 0 rgba(255,255,255,.2);
  will-change:transform,width;
}
.tab{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 0 6px;border:none;border-radius:var(--r-ctrl);cursor:pointer;font-family:inherit;
  font-size:var(--fs-xs);font-weight:900;letter-spacing:1px;color:var(--ink-light);background:transparent;
  transition:color .3s var(--ease-out);
  will-change:transform;
}
.tab svg{width:22px;height:22px;transition:transform .5s var(--spring);}
.tab.active{color:#fff;}
.tab.active svg{transform:translateY(-1px) scale(1.1);}

/* ---------- 10. 弹层与提示 ---------- */
.mask{
  position:fixed;inset:0;z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(80,30,10,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);
}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:460px;padding:24px 20px;
  border-radius:var(--r-hero) var(--r-hero) 0 0;border-bottom:none;
  border:1.5px solid var(--border-gold);
  background:linear-gradient(180deg,#FFFCF5,#FFF3E2);
  transform:translateY(40px) scale(.98);
  transition:transform .5s var(--spring);
  will-change:transform;
}
.mask.show .sheet{transform:none;}
.sheet-bar{width:36px;height:4px;margin:0 auto 20px;border-radius:var(--r-chip);background:rgba(214,40,40,.15);}
.sheet-title{margin-bottom:16px;text-align:center;font-size:var(--fs-md);font-weight:900;color:var(--red-deep);}
.year-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none;}
.year-scroll::-webkit-scrollbar{display:none;}
.ypill,.mpill{
  padding:10px 18px;border-radius:var(--r-ctrl);cursor:pointer;font-family:inherit;font-weight:900;
  background:var(--bg-card-solid);border:1.5px solid rgba(214,40,40,.1);color:var(--ink);
  transition:all .3s var(--ease-out);
  will-change:transform;
}
.ypill.on,.mpill.on{
  background:linear-gradient(160deg,var(--red),var(--red-deep));
  border-color:var(--border-gold);color:#fff;
}
.mpill:disabled{opacity:.3;pointer-events:none;}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.mpill{padding:12px 0;text-align:center;}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,16px);z-index:120;
  padding:12px 24px;border-radius:var(--r-chip);
  background:rgba(44,26,20,.9);border:1.5px solid var(--border-gold);color:#FFF6E0;
  font-size:var(--fs-sm);font-weight:800;opacity:0;pointer-events:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .3s var(--ease-out),transform .4s var(--spring);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 11. 开屏 Q 弹入场 ----------
   .app 整体入场，其内的 tabbar 随容器一同弹入；mask / toast 在 .app 外不受影响。
   动画结束移除 boot 类，不残留 inline transform，拖拽手势不受影响。 */
@keyframes appEnter{
  0%   {opacity:0; transform:translate3d(0,28px,0) scale(.9);}
  45%  {opacity:1; transform:translate3d(0,-9px,0) scale(1.035);}
  68%  {opacity:1; transform:translate3d(0,5px,0) scale(.985);}
  84%  {opacity:1; transform:translate3d(0,-2px,0) scale(1.006);}
  100% {opacity:1; transform:none;}
}
body.boot .app{animation:appEnter .95s var(--spring-soft) both;}

/* 极矮屏兜底：首屏间距压到固定最小值；所有视图底部留白同步略收，
   保证滚动到底时内容仍完整露在导航之上 */
@media (max-height:600px){
  :root{
    --street-fs:clamp(42px,min(17vw,8.4vh),68px);
    --home-gap:7px;
    --hero-py:13px; --hero-pb:11px;
    --hero-sub-mt:5px; --next-mt:8px; --next-pt:7px;
    --cycle-p:9px; --ct-head-pb:6px; --ct-node-gap:4px; --ct-prog-mt:7px;
    --runtime-p:9px; --runtime-pb:8px; --rt-label-mb:6px;
  }
  .view{padding-bottom:calc(env(safe-area-inset-bottom) + 92px);}
}

/* 移动端 100vh 按「大视口」计算，地址栏展开时会高估可视高度。
   支持 svh（最小可视高度）时按高度分档改用 svh，保证一屏放下且不随滚动跳动；
   放在矮屏兜底之后覆盖，两档互斥；不支持 svh 的设备保留上面的 vh 回退。 */
@supports (height:100svh){

      --next-pt:clamp(9px,1.8svh,16px);
      --cycle-p:clamp(10px,1.8svh,16px);

    }
  }
  @media (max-height:600px){
    :root{ --street-fs:clamp(42px,min(17vw,8.4svh),68px); }
  }
}

@media (prefers-reduced-motion:reduce){

<script>
(function(){
  'use strict';

  /* ============================================================
   * 1. 常量
   * ============================================================ */
  const DAY = 86400000;
  const N = 4;
  const CYCLE = [
    { name:'西邑街', short:'西' },
    { name:'永信街', short:'永' },
    { name:'羊邑街', short:'羊' },
    { name:'丙麻街', short:'丙' }
  ];
  const BASE = new Date(2026, 1, 15, 0, 0, 0);   // 基准日：西邑街
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  const MAX_YEAR = 2100;
  const MAX_DATE = new Date(2100, 11, 31);   // 全站统一上限：日历 / 月历 / 订阅共用
  // 统一守卫：CSS 的 prefers-reduced-motion 管不到 Web Animations API，需 JS 显式跳过
  const REDUCE_MOTION = !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const pad2 = n => String(n).padStart(2, '0');

  /* ============================================================
   * 2. 日期算法
   * ============================================================ */
  const startOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const diffDays = (a, b) => Math.round((startOf(a) - startOf(b)) / DAY);
  const idxOf = d => { const n = diffDays(d, BASE); return ((n % N) + N) % N; };
  const fmtMD = d => (d.getMonth() + 1) + '月' + d.getDate() + '日';
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();

  const getPhoneDate = () => {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), n.getMinutes(), n.getSeconds());
  };

  function addMonths(date, n){
    const d = new Date(date);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, daysInMonth(d.getFullYear(), d.getMonth())));
    return d;
  }

  // 日历差值：BASE → b 的 年/月/日/时/分/秒 分量
  function diffParts(a, b){
    if(b <= a) return { y:0, mo:0, d:0, h:0, mi:0, s:0 };

    let s  = b.getSeconds() - a.getSeconds();
    let mi = b.getMinutes() - a.getMinutes();
    let h  = b.getHours()   - a.getHours();
    let dayCarry = 0;

    if(s  < 0){ s  += 60; mi--; }
    if(mi < 0){ mi += 60; h--;  }
    if(h  < 0){ h  += 24; dayCarry = 1; }

    const aDate = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const bDate = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    if(dayCarry) bDate.setDate(bDate.getDate() - 1);

    let totalMonths = (bDate.getFullYear() - aDate.getFullYear()) * 12
                    + (bDate.getMonth()    - aDate.getMonth());
    while(totalMonths > 0 && addMonths(aDate, totalMonths) > bDate){
      totalMonths--;
    }
    const d = Math.max(0, Math.floor((bDate - addMonths(aDate, totalMonths)) / DAY));

    return { y: Math.floor(totalMonths / 12), mo: totalMonths % 12, d, h, mi, s };
  }

  // 下一周期内第 i 条街的日期（含当天；i 为 0..N-1）
  const nextDate = (i, from) => {
    const f = startOf(from);
    const add = ((i - idxOf(f)) % N + N) % N;
    return addDays(f, add);
  };

  /* ============================================================
   * 3. 自检：多算法交叉验证（控制台输出，失败时逐条列出）
   * ============================================================ */
  function selfTest(){
    const errors = [];
    const eq = (name, actual, expected) => {
      if(JSON.stringify(actual) !== JSON.stringify(expected)){
        errors.push(name + ' → 期望 ' + JSON.stringify(expected) + ' 实际 ' + JSON.stringify(actual));
      }
    };
    const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);

    // 3.1 各月天数：闰年 / 平年 / 世纪年
    for(let y = 1990; y <= 2110; y++){
      eq('feb-' + y, daysInMonth(y, 1), isLeap(y) ? 29 : 28);
    }

    // 3.2 diffDays 与儒略日数（完全独立的算法）逐日交叉验证
    const jdn = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
    const jBase = jdn(BASE);
    for(let t = Date.UTC(2023, 11, 1); t <= Date.UTC(2029, 2, 1); t += DAY){
      const d = new Date(t);
      eq('diff-' + ymd(d), diffDays(d, BASE), jdn(d) - jBase);
      eq('idx-'  + ymd(d), idxOf(d), ((jdn(d) - jBase) % N + N) % N);
    }

    // 3.3 addMonths 月末钳制（含闰日、跨年、负值）
    const am = (y, m, d, n) => ymd(addMonths(new Date(y, m, d), n));
    eq('am-leap',   am(2024, 0, 31, 1),  '2024-02-29');
    eq('am-non',    am(2023, 0, 31, 1),  '2023-02-28');
    eq('am-30',     am(2024, 2, 31, 1),  '2024-04-30');
    eq('am-year',   am(2024, 5, 15, 12), '2025-06-15');
    eq('am-neg',    am(2026, 1, 15, -1), '2026-01-15');
    eq('am-neg2',   am(2026, 0, 31, -1), '2025-12-31');
    eq('am-leap48', am(2024, 1, 29, 48), '2028-02-29');

    // 3.4 diffParts ↔ 重建 互逆验证：逐日 + 不同时间分量，覆盖闰日与月末
    const rebuild = p => {
      const d = addMonths(BASE, p.y * 12 + p.mo);
      d.setDate(d.getDate() + p.d);
      d.setHours(BASE.getHours() + p.h, BASE.getMinutes() + p.mi, BASE.getSeconds() + p.s, 0);
      return d;
    };
    for(let k = 0; k <= 800; k++){
      const d = addDays(BASE, k);
      d.setHours(k % 24, (k * 7) % 60, (k * 13) % 60);
      const p = diffParts(BASE, d);
      eq('rt-' + ymd(d) + ' ' + d.getHours() + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()),
         rebuild(p).getTime(), d.getTime());
    }

    // 3.5 ICS 规则一致性：首日期 + k·N 天的周期索引必须恒等于 i
    const start = TODAY, end = exportEndDate();
    CYCLE.forEach((s, i) => {
      const first = nextDate(i, start);
      if(first > end) return;
      for(let k = 0; ; k++){
        const d = addDays(first, k * N);
        if(d > end) break;
        eq('ics-' + i + '-' + ymd(d), idxOf(d), i);
      }
    });

    if(errors.length){
      console.error('[街道日历] 自检失败 (' + errors.length + ' 项):', errors);
    } else {
      console.info('[街道日历] 自检全部通过 ✓（闰年/平年 · JDN 交叉验证 · diffParts 互逆 · ICS 规则）');
    }
  }

  /* ============================================================
   * 4. DOM 缓存
   * ============================================================ */
  const $ = id => document.getElementById(id);

  const heroWrap   = $('heroWrap'),  heroCard   = $('heroCard');
  const heroBehind = $('heroBehind'), hbName    = $('hbName');
  const streetName = $('streetName'), heroSub   = $('heroSub');
  const nextText   = $('nextText'),   heroSeal  = $('heroSeal');
  const ctNodesEl  = $('ctNodes'),    ctSub     = $('ctSub'),     ctFill = $('ctFill');
  const calTitleText = $('calTitleText');
  const calPrev = $('calPrev'), calNext = $('calNext');
  const calGrid = $('calGrid'), calDetail = $('calDetail');
  const yearPills = $('yearPills'), evCount = $('evCount'), btnExport = $('btnExport');
  const pickerMask = $('pickerMask'), yearScroll = $('yearScroll'), monthGrid = $('monthGrid');
  const toastEl = $('toast'), tabPill = $('tabPill');
  const tabs = Array.from(document.querySelectorAll('.tab'));

  /* ============================================================
   * 5. 状态
   * ============================================================ */
  let TODAY = startOf(getPhoneDate());

  const state = {
    homeDate:    new Date(TODAY),
    calY:        TODAY.getFullYear(),
    calM:        TODAY.getMonth(),
    calSel:      new Date(TODAY),
    exportYears: 3,
    tab:         'home'
  };

  // 月序：按钮态 / 翻页 / 年月选择器 / 跨天重算共用的唯一「不得早于今天所在月」判定。
  // 依赖 TODAY，故放在状态声明之后，供后续所有渲染函数调用。
  const monthKey = (y, m) => y * 12 + m;
  const minMonthKey = () => monthKey(TODAY.getFullYear(), TODAY.getMonth());
  const isBeforeMinMonth = (y, m) => monthKey(y, m) < minMonthKey();

  /* ============================================================
   * 6. UI 工具
   * ============================================================ */
  let toastTimer = null;
  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
  }

  // 果冻按压：先压扁再回弹；导航 / 按钮 / 选择器控件统一使用
  function attachJellyPress(el, scale){
    scale = scale || .92;
    let anim = null, pressed = false;

    function down(e){
      pressed = true;
      try { el.setPointerCapture(e.pointerId); } catch(_) {}
      if(REDUCE_MOTION) return;
      if(anim) anim.cancel();
      anim = el.animate(
        [{ transform:'scale(1)' }, { transform:'scale(' + scale + ')' }],
        { duration:100, easing:'cubic-bezier(.4,0,.6,1)', fill:'forwards' }
      );
    }
    function release(){
      if(!pressed) return;
      pressed = false;
      if(REDUCE_MOTION) return;
      if(anim) anim.cancel();
      anim = el.animate([
        { transform:'scale(' + scale + ')' },
        { transform:'scale(1.1)',  offset:.3 },
        { transform:'scale(.95)',  offset:.6 },
        { transform:'scale(1.02)', offset:.8 },
        { transform:'scale(1)' }
      ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });
    }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  }

  /* ============================================================
   * 7. 计时器滚轮
   *    各分量按真实进制生成（月 12 / 日 31 / 时 24 / 分 60 / 秒 60），
   *    年份取 200 档以覆盖 2026→2226，避免超出上限时回绕显示成 00。
   *    3 圈冗余保证回绕动画永远有落点。
   * ============================================================ */
  const WHEEL_MAX = { y:200, mo:12, d:31, h:24, mi:60, s:60 };
  const WHEEL_CYCLES = 3;
  const wheels = {};
  let wheelsReady = false;

  function buildWheels(){
    document.querySelectorAll('.rt-box').forEach(box => {
      const key = box.dataset.k;
      const max = WHEEL_MAX[key];
      const wheel = box.querySelector('.rt-wheel');
      let html = '';
      for(let c = 0; c < WHEEL_CYCLES; c++){
        for(let d = 0; d < max; d++) html += '<b>' + pad2(d) + '</b>';
      }
      wheel.innerHTML = html;
      wheels[key] = { wheel, cur:0, max, onEnd:null, timer:null };
    });
  }

  function setWheel(key, val, animate){
    const w = wheels[key];
    if(!w) return;
    val = ((val % w.max) + w.max) % w.max;   // 安全归一化
    if(w.cur === val) return;

    const from = w.cur;
    w.cur = val;

    if(!animate){
      w.wheel.style.transition = 'none';
      w.wheel.style.transform  = 'translateY(calc(var(--rt-h) * ' + (-val) + '))';
      return;
    }

    // 目标位：同向直走；回绕则多滚一整圈（val + max 必 > from）
    const target = val > from ? val : val + w.max;

    if(w.onEnd) w.wheel.removeEventListener('transitionend', w.onEnd);
    clearTimeout(w.timer);

    w.wheel.style.transition = 'transform .6s cubic-bezier(.3,1.1,.4,1)';
    w.wheel.style.transform  = 'translateY(calc(var(--rt-h) * ' + (-target) + '))';

    if(target !== val){
      w.onEnd = () => {
        w.onEnd = null;
        clearTimeout(w.timer);
        w.wheel.style.transition = 'none';
        w.wheel.style.transform  = 'translateY(calc(var(--rt-h) * ' + (-val) + '))';
        void w.wheel.offsetHeight;
      };
      w.wheel.addEventListener('transitionend', w.onEnd, { once:true });
      w.timer = setTimeout(() => { if(w.onEnd) w.onEnd(); }, 650);
    }
  }

  function tickRuntime(){
    const p = diffParts(BASE, getPhoneDate());
    const anim = wheelsReady;
    setWheel('y',  p.y,  anim);
    setWheel('mo', p.mo, anim);
    setWheel('d',  p.d,  anim);
    setWheel('h',  p.h,  anim);
    setWheel('mi', p.mi, anim);
    setWheel('s',  p.s,  anim);
    wheelsReady = true;
  }

  function scheduleTick(){
    const delay = 1000 - (Date.now() % 1000);
    setTimeout(() => { tickRuntime(); scheduleTick(); }, delay);
  }

  /* ============================================================
   * 8. 日历渲染
   * ============================================================ */
  const ctNodeEls = CYCLE.map(s => {
    const node = document.createElement('div');
    node.className = 'ct-node';
    node.innerHTML = '<span class="ct-dot">' + s.short + '</span><span class="ct-day"></span>';
    ctNodesEl.appendChild(node);
    return node;
  });

  function renderCycle(animate){
    const todayIdx = idxOf(state.homeDate);

    ctNodeEls.forEach((node, i) => {
      const delta = ((i - todayIdx) % N + N) % N;
      node.querySelector('.ct-day').textContent =
        delta === 0 ? '今天' : delta === 1 ? '明天' : delta + ' 天后';
      node.classList.toggle('on', delta === 0);
    });

    ctSub.textContent = '第 ' + (todayIdx + 1) + ' / ' + N + ' 天';
    ctFill.style.width = ((todayIdx + 1) / N * 100) + '%';

    if(!animate || REDUCE_MOTION) return;

    ctNodeEls[todayIdx].querySelector('.ct-dot').animate([
      { transform:'scale(1)' },
      { transform:'scale(1.4)', offset:.3 },
      { transform:'scale(.9)',  offset:.6 },
      { transform:'scale(1.1)' }
    ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });

    ctNodeEls.forEach((node, i) => {
      node.querySelector('.ct-day').animate([
        { opacity:0, transform:'translateY(8px)' },
        { opacity:1, transform:'translateY(0)' }
      ], { duration:400, delay:i * 40, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'backwards' });
    });
  }

  function popCard(){
    if(!heroCard.animate || REDUCE_MOTION) return;
    heroCard.animate([
      { transform:'scale(.92) rotateX(6deg)',  opacity:.3 },
      { transform:'scale(1.04) rotateX(-2deg)', opacity:1, offset:.5 },
      { transform:'scale(.98) rotateX(1deg)',   opacity:1, offset:.75 },
      { transform:'scale(1)' }
    ], { duration:700, easing:'cubic-bezier(.34,1.56,.64,1)' });
  }

  function renderHome(animate){
    const idx = idxOf(state.homeDate);
    const s = CYCLE[idx];

    heroSeal.textContent = s.short;
    streetName.textContent = s.name;
    hbName.textContent = s.name;
    heroSub.textContent = fmtMD(state.homeDate) + ' · ' + WEEK[state.homeDate.getDay()];

    const nx = addDays(nextDate(idx, state.homeDate), N);
    nextText.textContent = '下次 ' + s.name + ' · ' + fmtMD(nx) + ' · ' + diffDays(nx, state.homeDate) + ' 天后';

    renderCycle(animate);

    if(!animate || REDUCE_MOTION) return;

    streetName.animate([
      { opacity:.2, transform:'translateY(10px) scale(.9)' },
      { opacity:1,  transform:'translateY(0) scale(1)' }
    ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });

    heroSeal.animate([
      { transform:'rotate(3deg) scale(.5)',  opacity:0 },
      { transform:'rotate(3deg) scale(1.2)', opacity:1, offset:.6 },
      { transform:'rotate(3deg) scale(1)',   opacity:1 }
    ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });

    popCard();
  }

  /* ============================================================
   * 9. 月历渲染
   * ============================================================ */
  function renderCal(animate, dir){
    const y = state.calY, m = state.calM;
    calTitleText.textContent = y + '年' + (m + 1) + '月';
    calPrev.disabled = monthKey(y, m) <= minMonthKey();
    calNext.disabled = (y === MAX_YEAR && m === 11);

    const firstWeekday = new Date(y, m, 1).getDay();
    const days = daysInMonth(y, m);
    // 上月天数：m=0 时 new Date(y,0,0) 即去年 12 月 31 日，无需写死特判
    const prevDays = daysInMonth(y, m - 1);
    const rows = Math.ceil((firstWeekday + days) / 7);
    // 按实际周数渲染，短月不再固定 6 行留下空白
    calGrid.style.setProperty('--cal-rows', String(rows));

    calGrid.innerHTML = '';
    const frag = document.createDocumentFragment();
    const liveCells = [];

    for(let i = 0; i < rows * 7; i++){
      const dayNum = i - firstWeekday + 1;
      let cellDate, isOut = false;

      if(dayNum < 1){
        cellDate = new Date(y, m - 1, prevDays + dayNum);
        isOut = true;
      } else if(dayNum > days){
        cellDate = new Date(y, m + 1, dayNum - days);
        isOut = true;
      } else {
        cellDate = new Date(y, m, dayNum);
      }

      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';

      if(isOut){
        cell.classList.add('out');
      } else {
        const s = CYCLE[idxOf(cellDate)];
        const cellTs      = startOf(cellDate);
        const ts          = cellTs.getTime();
        const isPast      = cellTs < TODAY;
        const isTodayCell = ts === TODAY.getTime();
        const isSel       = ts === startOf(state.calSel).getTime();

        if(isPast)           cell.classList.add('past');
        if(isTodayCell)      cell.classList.add('today');
        if(isSel && !isPast) cell.classList.add('sel');

        const inner = document.createElement('span');
        inner.className = 'cell-in';
        inner.innerHTML =
          '<span class="dnum">' + dayNum + '</span>' +
          '<span class="sname">' + (isTodayCell ? '今天' : s.short) + '</span>';
        cell.appendChild(inner);

        if(!isPast){
          cell.addEventListener('click', () => {
            if(startOf(state.calSel).getTime() === ts) return;
            state.calSel = new Date(cellDate);
            calGrid.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel'));
            cell.classList.add('sel');
            if(!REDUCE_MOTION && inner.animate){
              inner.animate([
                { transform:'scale(1)' },
                { transform:'scale(.82)',  offset:.2 },
                { transform:'scale(1.15)', offset:.55 },
                { transform:'scale(.95)',  offset:.8 },
                { transform:'scale(1.05)' }
              ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });
            }
            renderCalDetail();
          });
          liveCells.push(cell);
        }
      }
      frag.appendChild(cell);
    }
    calGrid.appendChild(frag);

    if(!animate || REDUCE_MOTION) return;

    liveCells.forEach((cell, i) => {
      cell.animate([
        { opacity:0, transform:'translateY(16px) scale(.9)' },
        { opacity:1, transform:'translateY(0) scale(1)' }
      ], {
        duration:500, delay:i * 8,
        easing:'cubic-bezier(.34,1.56,.64,1)',
        fill:'backwards'
      });
    });
    calTitleText.animate([
      { opacity:0, transform:'translateX(' + (dir > 0 ? 20 : -20) + 'px)' },
      { opacity:1, transform:'translateX(0)' }
    ], { duration:500, easing:'cubic-bezier(.34,1.56,.64,1)' });
  }

  function renderCalDetail(){
    const sel = startOf(state.calSel);
    if(sel < TODAY){
      calDetail.innerHTML = '<div class="cd-empty">这一天已经过去了</div>';
      return;
    }
    const s = CYCLE[idxOf(sel)];
    const d = diffDays(sel, TODAY);
    const gap = d === 0 ? '今天' : d === 1 ? '明天' : d + ' 天后';

    calDetail.innerHTML =
      '<div class="cd-row1">' +
        '<span class="cd-date">' + sel.getFullYear() + '年' + fmtMD(sel) + ' · ' + WEEK[sel.getDay()] + '</span>' +
        '<span class="cd-gap">' + gap + '</span>' +
      '</div>' +
      '<div class="cd-street"><i></i><span>' + s.name + '</span></div>';

    if(!REDUCE_MOTION && calDetail.animate){
      calDetail.animate([
        { opacity:.2, transform:'translateY(10px) scale(.96)' },
        { opacity:1,   transform:'translateY(0) scale(1)' }
      ], { duration:450, easing:'cubic-bezier(.34,1.56,.64,1)' });
    }
  }

  function changeMonth(delta){
    let y = state.calY, m = state.calM + delta;
    if(m < 0){ m = 11; y--; }
    if(m > 11){ m = 0; y++; }
    if(y > MAX_YEAR || isBeforeMinMonth(y, m)) return;
    state.calY = y;
    state.calM = m;
    renderCal(true, delta);
  }

  /* ============================================================
   * 10. 年月选择器
   * ============================================================ */
  function openPicker(){
    pickerMask.classList.add('show');
    buildYearScroll();
    buildMonthGrid();
  }
  function closePicker(){ pickerMask.classList.remove('show'); }

  function buildYearScroll(){
    yearScroll.innerHTML = '';
    for(let y = TODAY.getFullYear(); y <= MAX_YEAR; y++){
      const b = document.createElement('button');
      b.className = 'ypill' + (y === state.calY ? ' on' : '');
      b.textContent = y;
      b.addEventListener('click', () => {
        state.calY = y;
        if(isBeforeMinMonth(y, state.calM)){
          state.calY = TODAY.getFullYear();
          state.calM = TODAY.getMonth();
        }
        buildYearScroll();
        buildMonthGrid();
        renderCal(true, 1);
      });
      attachJellyPress(b, .9);
      yearScroll.appendChild(b);
    }
    // 用视口矩形差量居中：不受 offsetParent（.sheet 的 20px 内边距）影响
    requestAnimationFrame(() => {
      const on = yearScroll.querySelector('.ypill.on');
      if(!on) return;
      const pill = on.getBoundingClientRect(), rail = yearScroll.getBoundingClientRect();
      yearScroll.scrollLeft += (pill.left + pill.width / 2) - (rail.left + rail.width / 2);
    });
  }

  function buildMonthGrid(){
    monthGrid.innerHTML = '';
    for(let m = 0; m < 12; m++){
      const b = document.createElement('button');
      b.className = 'mpill' + (m === state.calM ? ' on' : '');
      b.textContent = (m + 1) + '月';
      if(isBeforeMinMonth(state.calY, m)) b.disabled = true;
      b.addEventListener('click', () => {
        state.calM = m;
        closePicker();
        renderCal(true, 1);
      });
      attachJellyPress(b, .9);
      monthGrid.appendChild(b);
    }
  }

  /* ============================================================
   * 11. 订阅 / ICS 导出
   * ============================================================ */
  function renderYearPills(){
    yearPills.innerHTML = '';
    // 接近上限时可选年数自动收敛，不让用户选到会被静默截断的档位
    const maxYears = Math.min(10, Math.max(1, MAX_YEAR - TODAY.getFullYear()));
    if(state.exportYears > maxYears) state.exportYears = maxYears;
    for(let y = 1; y <= maxYears; y++){
      const b = document.createElement('button');
      b.className = 'pill' + (y === state.exportYears ? ' on' : '');
      b.textContent = y;
      b.addEventListener('click', () => {
        state.exportYears = y;
        renderYearPills();
        updateEvCount();
      });
      attachJellyPress(b, .88);
      yearPills.appendChild(b);
    }
  }

  function exportEndDate(){
    const y = TODAY.getFullYear() + state.exportYears;
    const m = TODAY.getMonth();
    const wanted = new Date(y, m, Math.min(TODAY.getDate(), daysInMonth(y, m)));
    // 日历与月历都停在 2100-12-31，订阅也必须钳制，避免生成未验证范围的提醒
    return wanted > MAX_DATE ? new Date(MAX_DATE) : wanted;
  }

  function updateEvCount(){
    const days = Math.max(1, Math.round((exportEndDate() - TODAY) / DAY));
    evCount.textContent = days.toLocaleString('zh-CN');
  }

  const icsLocal = d =>
    d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' +
    pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());

  const icsUTC = d =>
    d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';

  const escICS = s =>
    String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');

  function buildICS(){
    const start = TODAY;
    const end   = exportEndDate();
    const stamp = icsUTC(new Date());
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0',
      'PRODID:-//JieDaoRiLi//Street Calendar//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
      'X-WR-CALNAME:街道日历','X-WR-TIMEZONE:Asia/Shanghai',
      'BEGIN:VTIMEZONE','TZID:Asia/Shanghai','BEGIN:STANDARD',
      'DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800',
      'TZNAME:CST','END:STANDARD','END:VTIMEZONE'
    ];
    const untilStr = icsUTC(new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59));

    CYCLE.forEach((s, i) => {
      const first = nextDate(i, start);
      if(first > end) return;

      const dtStart = new Date(first); dtStart.setHours(8, 0, 0, 0);
      const dtEnd   = new Date(first); dtEnd.setHours(9, 0, 0, 0);

      lines.push(
        'BEGIN:VEVENT',
        'UID:jiedao-' + i + '-' + first.getTime() + '@jiedao.local',
        'DTSTAMP:' + stamp,
        'DTSTART;TZID=Asia/Shanghai:' + icsLocal(dtStart),
        'DTEND;TZID=Asia/Shanghai:' + icsLocal(dtEnd),
        'SUMMARY:' + escICS('赶街 · ' + s.name),
        'DESCRIPTION:' + escICS('今天赶 ' + s.name + '，别忘了。'),
        'LOCATION:' + escICS(s.name),
        'RRULE:FREQ=DAILY;INTERVAL=' + N + ';UNTIL=' + untilStr,
        'TRANSP:TRANSPARENT',
        'BEGIN:VALARM','ACTION:DISPLAY',
        'DESCRIPTION:' + escICS('明天赶 ' + s.name),'TRIGGER:-PT12H','END:VALARM',
        'BEGIN:VALARM','ACTION:DISPLAY',
        'DESCRIPTION:' + escICS('今天赶 ' + s.name),'TRIGGER:PT0S','END:VALARM',
        'END:VEVENT'
      );
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n') + '\r\n';
  }

  function fallbackDownload(blob, fileName){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('日历已生成，打开即可导入');
  }

  function downloadICS(){
    const blob = new Blob(['\ufeff', buildICS()], { type:'text/calendar;charset=utf-8' });
    const fileName = '街道日历-' + state.exportYears + '年.ics';

    if(navigator.canShare && window.File){
      try{
        const file = new File([blob], fileName, { type:'text/calendar' });
        if(navigator.canShare({ files:[file] })){
          navigator.share({ files:[file], title:'街道日历' })
            .then(() => toast('已分享'))
            .catch(() => fallbackDownload(blob, fileName));
          return;
        }
      }catch(_){}
    }
    fallbackDownload(blob, fileName);
  }

  /* ============================================================
   * 12. Tab 导航（果冻滑块）
   * ============================================================ */
  const views = { home: $('view-home'), cal: $('view-cal'), set: $('view-set') };
  let pillFrom = 0, pillFromW = 0;

  const measurePill = idx => ({ left: tabs[idx].offsetLeft, width: tabs[idx].offsetWidth });

  function setPill(idx, animate){
    const to = measurePill(idx);
    if(animate && !REDUCE_MOTION && tabPill.animate){
      tabPill.animate([
        { transform:'translateX(' + pillFrom + 'px)', width: pillFromW + 'px' },
        { transform:'translateX(' + to.left + 'px)', width: (to.width * 1.3) + 'px', offset:.6 },
        { transform:'translateX(' + to.left + 'px)', width: to.width + 'px' }
      ], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });
    }
    tabPill.style.transform = 'translateX(' + to.left + 'px)';
    tabPill.style.width = to.width + 'px';
    pillFrom  = to.left;
    pillFromW = to.width;
  }

  function switchTab(name){
    if(state.tab === name) return;
    state.tab = name;
    const idx = tabs.findIndex(t => t.dataset.tab === name);
    setPill(idx, true);
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === name));

    if(name === 'cal'){ renderCal(true, 1); renderCalDetail(); }
    if(name === 'set'){ renderYearPills(); updateEvCount(); }
  }

  /* ============================================================
   * 13. 日历主卡手势（左右滑动翻日）
   * ============================================================ */
  let dragging = false, moved = false, sx = 0, sy = 0, behindDir = 0;

  function updateBehind(dir){
    if(behindDir === dir) return;
    behindDir = dir;
    const target = addDays(state.homeDate, dir);
    hbName.textContent = (target < TODAY || target > MAX_DATE) ? '' : CYCLE[idxOf(target)].name;
  }

  function onHeroPointerDown(e){
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    behindDir = 0;
    heroWrap.style.transition = 'none';
    heroBehind.style.transition = 'none';
    heroWrap.style.transform = '';
  }

  function onPointerMove(e){
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;

    if(!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
      moved = true;
      updateBehind(dx < 0 ? 1 : -1);
    }
    if(!moved) return;

    const canPrev = diffDays(state.homeDate, TODAY) > 0;
    // 非线性阻尼：边界橡皮筋，正常段更跟手
    const damp = (dx > 0 && !canPrev)
      ? Math.pow(dx, 0.5) * 0.8
      : Math.sign(dx) * Math.pow(Math.abs(dx), 0.8) * 1.6;

    heroWrap.style.transform =
      'translateX(' + damp + 'px) rotateY(' + (-dx * 0.05) + 'deg) scale(' +
      (1 - Math.min(Math.abs(dx) / 2500, 0.05)) + ')';

    const progress = Math.min(Math.abs(dx) / 200, 1);
    heroBehind.style.opacity = String(0.3 + 0.7 * progress);
    heroBehind.style.transform =
      'scale(' + (0.9 + 0.1 * progress) + ') translateY(' + (16 - 16 * progress) + 'px)';
  }

  function releaseHero(dxFinal){
    heroWrap.style.transition = 'transform .7s cubic-bezier(.34,1.56,.64,1)';
    heroWrap.style.transform = '';
    heroBehind.style.transition = 'transform .6s cubic-bezier(.34,1.56,.64,1), opacity .4s ease';
    heroBehind.style.opacity = '';
    heroBehind.style.transform = '';

    let switched = false;
    if(moved && Math.abs(dxFinal) > 60){
      const dir = dxFinal < 0 ? 1 : -1;
      const nextD = addDays(state.homeDate, dir);
      if(nextD >= TODAY && nextD <= MAX_DATE){
        state.homeDate = nextD;
        renderHome(true);
        switched = true;
      }
    }
    if(!switched) hbName.textContent = CYCLE[idxOf(state.homeDate)].name;
  }

  function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    releaseHero(e.clientX - sx);
    moved = false;
  }
  function onPointerCancel(){
    if(!dragging) return;
    dragging = false;
    releaseHero(0);
    moved = false;
  }

  /* ============================================================
   * 14. 跨天静默重算
   * ============================================================ */
  function checkCrossDay(){
    const now = startOf(getPhoneDate());
    if(now.getTime() === TODAY.getTime()) return;

    TODAY = now;

    // 任何停留在「新今天」之前的显示状态都钳制回今天，
    // 避免按钮可点却无反应、或详情显示已过去的日期
    if(state.homeDate < TODAY) state.homeDate = new Date(TODAY);
    if(startOf(state.calSel) < TODAY) state.calSel = new Date(TODAY);
    if(isBeforeMinMonth(state.calY, state.calM)){
      state.calY = TODAY.getFullYear();
      state.calM = TODAY.getMonth();
    }

    renderHome(false);
    renderCal(false);
    renderCalDetail();
    updateEvCount();
  }

  /* ============================================================
   * 15. 启动
   * ============================================================ */
  /* 开屏 Q 弹：CSS 负责容器整体，WAAPI 负责卡片错峰；
     两者都不写入 inline style，动画结束即还原，不影响拖拽手势。 */
  function playBootAnimation(){
    const app = document.querySelector('.app');
    let finished = false;
    let onEnd;                       // 先声明，避免回调与收尾函数互相前向引用
    const done = () => {
      if(finished) return;          // animationend 与兜底定时器可能都触发，保持幂等
      finished = true;
      document.body.classList.remove('boot');
      if(onEnd) app.removeEventListener('animationend', onEnd);
    };
    onEnd = e => { if(e.target === app) done(); };
    app.addEventListener('animationend', onEnd);
    setTimeout(done, 1500);         // 兜底：低帧率 / reduced-motion 下也能清场

    if(REDUCE_MOTION){ done(); return; }

    [heroCard, document.querySelector('.cycle-track'), document.querySelector('.runtime')]
      .forEach((el, i) => {
        if(!el || !el.animate) return;
        el.animate([
          { opacity:0, transform:'translateY(18px) scale(.9)' },
          { opacity:1, transform:'translateY(-6px) scale(1.04)', offset:.55 },
          { opacity:1, transform:'translateY(3px) scale(.985)',  offset:.78 },
          { opacity:1, transform:'none' }
        ], { duration:760, delay:120 + i * 110, easing:'cubic-bezier(.34,1.56,.64,1)' });
      });
  }

  function initPill(){
    const m = measurePill(0);
    pillFrom = m.left; pillFromW = m.width;
    tabPill.style.transform = 'translateX(' + m.left + 'px)';
    tabPill.style.width = m.width + 'px';
  }

  function onResize(){
    const idx = tabs.findIndex(t => t.dataset.tab === state.tab);
    const m = measurePill(idx);
    pillFrom = m.left; pillFromW = m.width;
    tabPill.style.transition = 'none';
    tabPill.style.transform = 'translateX(' + m.left + 'px)';
    tabPill.style.width = m.width + 'px';
    requestAnimationFrame(() => { tabPill.style.transition = ''; });
  }

  function bindEvents(){
    [btnExport, calPrev, calNext].forEach(el => attachJellyPress(el, .9));
    tabs.forEach(t => attachJellyPress(t, .94));

    calPrev.addEventListener('click', () => changeMonth(-1));
    calNext.addEventListener('click', () => changeMonth(1));

    $('calTitle').addEventListener('click', openPicker);
    pickerMask.addEventListener('click', e => { if(e.target === pickerMask) closePicker(); });

    tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    btnExport.addEventListener('click', () => {
      if(/MicroMessenger/i.test(navigator.userAgent)){
        toast('微信内无法下载，请用浏览器打开', 3600);
        return;
      }
      try { downloadICS(); } catch(_) { toast('生成失败'); }
    });

    heroWrap.addEventListener('pointerdown', onHeroPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
    window.addEventListener('resize', onResize);

    document.addEventListener('visibilitychange', () => {
      if(!document.hidden){
        requestAnimationFrame(initPill);
        checkCrossDay();
        tickRuntime();
      }
    });
  }

  function init(){
    buildWheels();

    // 自检约 5000 次断言，空闲时再跑，避免阻塞开屏 Q 弹入场
    if('requestIdleCallback' in window) requestIdleCallback(selfTest, { timeout:1000 });
    else setTimeout(selfTest, 0);
    renderHome(false);
    renderCal(false);
    renderCalDetail();
    renderYearPills();
    updateEvCount();

    tickRuntime();
    scheduleTick();
    bindEvents();

    requestAnimationFrame(() => requestAnimationFrame(initPill));
    if(document.readyState !== 'complete'){
      window.addEventListener('load', () => requestAnimationFrame(initPill), { once:true });
    }
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(() => requestAnimationFrame(initPill));
    }
    setInterval(checkCrossDay, 5000);
    playBootAnimation();
  }

  init();

})();
</script>
</body>
</html>
