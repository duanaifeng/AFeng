<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="西邑赶集日历，查询永信街、羊邑街、丙麻街、西邑街的赶集日期">
    <meta name="keywords" content="西邑赶集,永信街,羊邑街,丙麻街,西邑街,赶集日历,保山隆阳">
    <meta name="theme-color" content="#05050a">
    <title>西邑赶集日历｜永信街羊邑街丙麻街西邑街查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-red: #e63946;
            --deep-red: #c1211c;
            --darker-red: #8c1c13;
            --gold: #ffd700;
            --light-gold: #ffed4e;
            --white: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.28);
            --glass-outer: rgba(0, 0, 0, 0.35);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #05050a;
            color: var(--white);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 60px;
            text-align: center;
            position: relative;
        }

        /* ============ 背景层 ============ */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-light-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .light-ball {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            animation: lightFloat 18s ease-in-out infinite;
            will-change: transform;
        }

        .light-ball:nth-child(1) {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, var(--primary-red), transparent 70%);
            top: -15%;
            left: -15%;
            animation-duration: 20s;
        }

        .light-ball:nth-child(2) {
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, var(--gold), transparent 70%);
            bottom: -18%;
            right: -12%;
            animation-delay: 3s;
            animation-duration: 22s;
        }

        .light-ball:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #7b2cbf, transparent 70%);
            top: 40%;
            right: 15%;
            animation-delay: 6s;
            animation-duration: 18s;
        }

        .bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(230, 57, 70, 0.15), transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 215, 0, 0.08), transparent 60%),
                radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
        }

        /* ============ 主容器 ============ */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        /* ============ 通用玻璃卡 ============ */
        .glass {
            position: relative;
            border-radius: 28px;
            padding: 26px 22px;
            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.18) 0%,
                    rgba(255, 255, 255, 0.06) 40%,
                    rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.12);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.12);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 20px 50px var(--glass-outer),
                0 1px 0 rgba(255, 255, 255, 0.55) inset,
                0 -1px 0 rgba(255, 255, 255, 0.12) inset,
                0 0 80px rgba(230, 57, 70, 0.08);
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        box-shadow 0.5s ease,
                        border-color 0.5s ease;
            text-align: center;
        }

        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%);
            pointer-events: none;
        }

        .glass::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -30%;
            width: 160%;
            height: 220%;
            background:
                radial-gradient(ellipse at 30% 25%, rgba(255, 215, 0, 0.14), transparent 45%),
                radial-gradient(ellipse at 75% 70%, rgba(230, 57, 70, 0.12), transparent 50%);
            filter: blur(30px);
            animation: liquidFlow 14s ease-in-out infinite;
            pointer-events: none;
        }

        .glass > * {
            position: relative;
            z-index: 1;
        }

        .glass:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow:
                0 26px 60px var(--glass-outer),
                0 1px 0 rgba(255, 255, 255, 0.7) inset,
                0 -1px 0 rgba(255, 255, 255, 0.15) inset,
                0 0 100px rgba(255, 215, 0, 0.18);
        }

        /* ============ 头部 ============ */
        .header {
            margin-top: 22px;
            padding: 30px 22px 26px;
        }

        .app-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg,
                var(--white) 0%,
                var(--gold) 30%,
                var(--light-gold) 50%,
                var(--gold) 70%,
                var(--white) 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.35));
        }

        .street-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .street-tag {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.95);
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 1px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.35) inset,
                0 0 12px rgba(255, 215, 0, 0.15);
        }

        .share-btn {
            display: inline-block;
            background: linear-gradient(135deg,
                rgba(230, 57, 70, 0.85) 0%,
                rgba(193, 33, 28, 0.85) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 8px 24px rgba(230, 57, 70, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .share-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transition: left 0.7s;
        }

        .share-btn:hover::before {
            left: 100%;
        }

        .share-btn:hover {
            transform: translateY(-3px) scale(1.04);
            border-color: var(--gold);
            box-shadow:
                0 12px 32px rgba(230, 57, 70, 0.6),
                0 0 30px rgba(255, 215, 0, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.5) inset;
        }

        .share-btn:active {
            transform: scale(0.97);
        }

        /* ============ 今日卡片 ============ */
        .today-card {
            margin-top: 20px;
            padding: 34px 22px 28px;
        }

        .today-label {
            display: inline-block;
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255, 215, 0, 0.9);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .today-date {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .today-lunar {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 215, 0, 0.85);
            letter-spacing: 3px;
            margin-bottom: 6px;
            min-height: 0;
        }

        .today-lunar:empty {
            display: none;
        }

        .today-street {
            font-size: 76px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 4px;
            margin: 12px 0 8px;
            background: linear-gradient(45deg,
                var(--gold) 0%,
                var(--light-gold) 25%,
                var(--primary-red) 55%,
                var(--gold) 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite,
                       streetPulse 3s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.45))
                    drop-shadow(0 0 60px rgba(230, 57, 70, 0.25));
        }

        .today-hint {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .tomorrow-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 18px;
            background:
                linear-gradient(135deg,
                    rgba(230, 57, 70, 0.18) 0%,
                    rgba(193, 33, 28, 0.1) 100%);
            border: 1px solid rgba(255, 215, 0, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.2),
                0 1px 0 rgba(255, 255, 255, 0.25) inset;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .tomorrow-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
            animation: shimmerEffect 4s ease-in-out infinite;
            pointer-events: none;
        }

        .tomorrow-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .tomorrow-text {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .tomorrow-street {
            color: var(--gold);
            font-weight: 800;
            margin-left: 4px;
        }

        /* ============ 赶集倒计时 ============ */
        .countdown-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 22px 0 12px;
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .countdown-title::before,
        .countdown-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.18),
                transparent);
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .countdown-item {
            padding: 12px 4px;
            border-radius: 14px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-align: center;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.2) inset,
                0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .countdown-item.is-today {
            background: linear-gradient(135deg,
                rgba(255, 215, 0, 0.22) 0%,
                rgba(230, 57, 70, 0.15) 100%);
            border-color: rgba(255, 215, 0, 0.55);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.45) inset,
                0 0 24px rgba(255, 215, 0, 0.3);
            transform: scale(1.03);
        }

        .countdown-item.is-today::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.25), transparent);
            animation: shimmerEffect 3s ease-in-out infinite;
            pointer-events: none;
        }

        .countdown-street {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .countdown-item.is-today .countdown-street {
            color: var(--gold);
            font-weight: 800;
        }

        .countdown-days {
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.5px;
        }

        .countdown-item.is-today .countdown-days {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        /* ============ 查询卡 ============ */
        .query-card {
            margin-top: 20px;
            padding: 28px 22px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before,
        .card-title::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
        }

        .card-title::before {
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6));
        }

        .card-title::after {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.6), transparent);
        }

        .quick-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-btn {
            padding: 16px 8px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg,
                rgba(255, 215, 0, 0.14) 0%,
                rgba(255, 215, 0, 0.06) 100%);
            color: var(--gold);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.15),
                0 1px 0 rgba(255, 255, 255, 0.3) inset;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .quick-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            transition: left 0.6s;
        }

        .quick-btn:hover::before {
            left: 100%;
        }

        .quick-btn:hover {
            background: linear-gradient(135deg,
                rgba(255, 215, 0, 0.24) 0%,
                rgba(255, 215, 0, 0.12) 100%);
            transform: translateY(-3px);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow:
                0 10px 28px rgba(255, 215, 0, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.5) inset;
            color: var(--light-gold);
        }

        .quick-btn:active {
            transform: scale(0.96);
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        .divider-or::before,
        .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent);
        }

        .date-input {
            width: 100%;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 1px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.04) 100%);
            color: var(--white);
            margin-bottom: 14px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.3) inset,
                0 -1px 0 rgba(0, 0, 0, 0.1) inset;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }

        .date-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.7);
            box-shadow:
                0 0 0 4px rgba(255, 215, 0, 0.15),
                0 0 30px rgba(255, 215, 0, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transform: scale(1.01);
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.14) 0%,
                rgba(255, 255, 255, 0.06) 100%);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.2) sepia(1) saturate(5) hue-rotate(350deg);
            cursor: pointer;
            transform: scale(1.25);
            opacity: 0.9;
        }

        .query-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg,
                var(--primary-red) 0%,
                var(--deep-red) 50%,
                var(--darker-red) 100%);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 18px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 10px 30px rgba(230, 57, 70, 0.5),
                0 0 40px rgba(230, 57, 70, 0.25),
                0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .query-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 215, 0, 0.35),
                transparent);
            transition: left 0.7s;
        }

        .query-btn:hover::before {
            left: 100%;
        }

        .query-btn:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: var(--gold);
            box-shadow:
                0 16px 40px rgba(230, 57, 70, 0.6),
                0 0 60px rgba(255, 215, 0, 0.35),
                0 1px 0 rgba(255, 255, 255, 0.5) inset;
        }

        .query-btn:active {
            transform: scale(0.98);
        }

        /* ============ 结果卡 ============ */
        .result-card {
            display: none;
            margin-top: 20px;
            padding: 30px 22px;
        }

        .result-card.show {
            display: block;
            animation: resultReveal 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .result-date {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .result-lunar {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 215, 0, 0.85);
            letter-spacing: 3px;
            margin-bottom: 14px;
            min-height: 0;
        }

        .result-lunar:empty {
            display: none;
        }

        .result-street {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg,
                var(--gold),
                var(--light-gold),
                var(--primary-red),
                var(--gold));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
        }

        /* ============ 友链卡 ============ */
        .link-card {
            margin-top: 20px;
            padding: 26px 22px;
        }

        .link-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .link-item {
            padding: 14px 22px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--white);
            text-decoration: none;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.25) inset,
                0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: left 0.6s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: linear-gradient(135deg,
                rgba(230, 57, 70, 0.24) 0%,
                rgba(193, 33, 28, 0.12) 100%);
            color: var(--gold);
            transform: translateY(-4px) scale(1.05);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow:
                0 12px 30px rgba(230, 57, 70, 0.35),
                0 0 30px rgba(255, 215, 0, 0.25),
                0 1px 0 rgba(255, 255, 255, 0.4) inset;
        }

        /* ============ 回到顶部 ============ */
        #backToTop {
            position: fixed;
            right: 22px;
            bottom: 30px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg,
                rgba(230, 57, 70, 0.9) 0%,
                rgba(193, 33, 28, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            z-index: 100;
            box-shadow:
                0 10px 30px rgba(230, 57, 70, 0.5),
                0 1px 0 rgba(255, 255, 255, 0.5) inset;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #backToTop.show {
            opacity: 1;
            visibility: visible;
        }

        #backToTop:hover {
            transform: translateY(-5px) scale(1.1);
            border-color: var(--gold);
            box-shadow:
                0 16px 40px rgba(230, 57, 70, 0.7),
                0 0 40px rgba(255, 215, 0, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.6) inset;
        }

        /* ============ 页脚 ============ */
        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
            line-height: 1.9;
        }

        .footer .version {
            display: inline-block;
            padding: 2px 10px;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.75);
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 10px;
            letter-spacing: 1px;
        }

        .footer .heart {
            color: var(--primary-red);
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* ============ 开屏动画 ============ */
        #splash-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(230, 57, 70, 0.2), transparent 60%),
                linear-gradient(135deg, #05050a 0%, #150506 50%, #05050a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.7s ease, transform 0.7s ease, visibility 0.7s;
            overflow: hidden;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.08) translateY(-30px);
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            color: white;
            position: relative;
            padding: 0 20px;
        }

        .splash-title {
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 46px;
            letter-spacing: 5px;
            background: linear-gradient(45deg, var(--gold), var(--light-gold), var(--primary-red), var(--gold));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
        }

        .splash-loader-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 30px;
        }

        .splash-loader-circle {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin3D 1.3s linear infinite;
            position: absolute;
            top: 0;
            left: 0;
        }

        .splash-loader-circle:nth-child(2) {
            width: 76%;
            height: 76%;
            top: 12%;
            left: 12%;
            border-top-color: var(--primary-red);
            animation: spin3D 1.7s linear infinite reverse;
        }

        .splash-loader-circle:nth-child(3) {
            width: 52%;
            height: 52%;
            top: 24%;
            left: 24%;
            border-top-color: var(--light-gold);
            animation: spin3D 2s linear infinite;
        }

        .splash-date-text {
            font-size: 18px;
            opacity: 0.95;
            margin-top: 16px;
            animation: pulse 2s ease-in-out infinite;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
        }

        .splash-author {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .splash-email {
            font-size: 12px;
            opacity: 0.45;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* ============ 点击粒子 ============ */
        .click-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
        }

        /* ============ 关键帧 ============ */
        @keyframes spin3D {
            to { transform: rotate3d(1, 1, 1, 360deg); }
        }

        @keyframes shimmer {
            0%, 100% { background-position: -200% center; }
            50% { background-position: 200% center; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes slideUpIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes streetPulse {
            0%, 100% {
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.45))
                        drop-shadow(0 0 60px rgba(230, 57, 70, 0.25));
            }
            50% {
                filter: drop-shadow(0 0 45px rgba(255, 215, 0, 0.7))
                        drop-shadow(0 0 90px rgba(230, 57, 70, 0.4));
            }
        }

        @keyframes resultReveal {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes shimmerEffect {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes lightFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -40px) scale(1.12); }
            50% { transform: translate(-30px, 30px) scale(0.92); }
            75% { transform: translate(50px, 30px) scale(1.06); }
        }

        @keyframes liquidFlow {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, -15px) rotate(8deg); }
            66% { transform: translate(-15px, 20px) rotate(-6deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ============ 入场动画 ============ */
        .animate-in {
            opacity: 0;
            transform: translateY(40px);
        }

        .animate-in.visible {
            animation: slideUpIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* ============ 移动端适配 ============ */
        @media (max-width: 480px) {
            .container { padding: 0 14px; }
            .header { margin-top: 16px; padding: 26px 18px 22px; }
            .app-title { font-size: 28px; letter-spacing: 2px; }
            .street-tag { font-size: 12px; padding: 5px 11px; }
            .share-btn { padding: 11px 24px; font-size: 14px; }

            .today-street { font-size: 60px; letter-spacing: 3px; }

            .today-lunar { font-size: 13px; letter-spacing: 2px; }
            .tomorrow-bar { padding: 12px 14px; gap: 10px; }
            .tomorrow-text { font-size: 14px; }
            .countdown-grid { gap: 6px; }
            .countdown-item { padding: 10px 2px; border-radius: 12px; }
            .countdown-street { font-size: 11px; letter-spacing: 0.5px; }
            .countdown-days { font-size: 12px; }
            .query-card { padding: 24px 18px; }
            .quick-btn { padding: 14px 6px; font-size: 14px; letter-spacing: 1px; }
            .date-input { padding: 16px; font-size: 16px; }
            .query-btn { padding: 18px; font-size: 17px; letter-spacing: 5px; }
            .result-street { font-size: 48px; letter-spacing: 3px; }
            .result-lunar { font-size: 13px; letter-spacing: 2px; }
            .link-item { padding: 12px 18px; font-size: 14px; }
            .splash-title { font-size: 38px; letter-spacing: 3px; }
            #backToTop { width: 50px; height: 50px; font-size: 20px; right: 16px; bottom: 22px; }
            .light-ball { filter: blur(70px); }
            .light-ball:nth-child(1) { width: 380px; height: 380px; }
            .light-ball:nth-child(2) { width: 340px; height: 340px; }
            .light-ball:nth-child(3) { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <canvas id="particle-canvas"></canvas>

            </div>

        <!-- 页脚 -->

    <!-- 回到顶部 -->
    <button id="backToTop" data-action="backToTop" aria-label="回到顶部">↑</button>

    <script>
    (function () {
        'use strict';

        /* ============ 配置区 ============ */
        var CONFIG = {
            streets: ["永信街", "羊邑街", "丙麻街", "西邑街"],
            baseYear: 2026,
            baseMonth: 2,
            baseDay: 12,
            cycle: 4,
            onlineUrl: "https://duanaifeng.github.io/AFeng/ganji.html",
            // 日期输入范围
            minDate: "1995-01-01",
            maxDate: "2099-12-31",
            // 本地存储键（与版本号统一）
            storageKey: "ganji_visited_v3_1"
        };

        var STREETS = (Array.isArray(CONFIG.streets) && CONFIG.streets.length === CONFIG.cycle)
            ? CONFIG.streets
            : ["永信街", "羊邑街", "丙麻街", "西邑街"];

        var weekMap = ["日", "一", "二", "三", "四", "五", "六"];

        /* ============ DOM 缓存 ============ */
        var DOM = {};

        function cacheDom() {
            DOM.todayDate = document.getElementById('today-date');
            DOM.todayStreet = document.getElementById('today-street');
            DOM.todayLunar = document.getElementById('today-lunar');
            DOM.tomorrowMarket = document.getElementById('tomorrow-market');
            DOM.countdownGrid = document.getElementById('countdown-grid');
            DOM.resultSection = document.getElementById('result-section');
            DOM.resultDate = document.getElementById('result-date');
            DOM.resultLunar = document.getElementById('result-lunar');
            DOM.resultStreet = document.getElementById('result-street');
            DOM.queryDate = document.getElementById('query-date');
            DOM.splashDate = document.getElementById('splash-date');
            DOM.splashScreen = document.getElementById('splash-screen');
            DOM.backToTop = document.getElementById('backToTop');
        }

        /* ============ 北京时间工具 ============ */
        function getBeijingParts(date) {
            var d = date || new Date();
            var bj = new Date(d.getTime() + 8 * 3600 * 1000);
            return {
                year: bj.getUTCFullYear(),
                month: bj.getUTCMonth() + 1,
                day: bj.getUTCDate(),
                weekday: bj.getUTCDay()
            };
        }

        function getBeijingDate() {
            var p = getBeijingParts();
            return new Date(p.year, p.month - 1, p.day);
        }

        function getWeekday(date) {
            return "周" + weekMap[date.getDay()];
        }

        function formatDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + "年" + m + "月" + d + "日";
        }

        function formatInputDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + "-" + m + "-" + d;
        }

        function addDays(date, n) {
            var d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        }

        // 完整日期 key（年-月-日），用于跨天/跨月/跨年检测
        function getDateKey(date) {
            return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
        }

        /* ============ 农历（浏览器自带，零依赖） ============ */
        var LUNAR_DAY_NAMES = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
                               '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                               '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

        function getLunarText(date) {
            try {
                var fmt = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
                    month: 'long',
                    day: 'numeric'
                });
                var str = fmt.format(date).replace(/\s+/g, '');
                if (!str) return null;

                // 特征检测：农历月份必须以“X月”或“闰X月”开头（汉字）
                // 如果浏览器回退到公历，输出形如“9月14”，直接判为不可靠
                if (!/^(闰)?[正二三四五六七八九十冬腊]月/.test(str)) {
                    return null;
                }

                // 处理“八月3”这类带阿拉伯数字的格式
                var m = str.match(/^(.+?)(\d{1,2})日?$/);
                if (m) {
                    var num = parseInt(m[2], 10);
                    if (num >= 1 && num <= 30) {
                        var dayText = LUNAR_DAY_NAMES[num - 1] || m[2];
                        return '农历' + m[1] + dayText;
                    }
                    return null;
                }

                // 已是“八月初三”中文格式
                return '农历' + str;
            } catch (e) {
                return null;
            }
        }

        function renderLunarTo(el, date) {
            if (!el) return;
            var text = getLunarText(date);
            if (text) {
                el.textContent = text;
                el.style.display = '';
            } else {
                el.textContent = '';
                el.style.display = 'none';
            }
        }

        /* ============ 赶集核心算法 ============ */
        function getStreetIndex(date) {
            try {
                var base = Date.UTC(CONFIG.baseYear, CONFIG.baseMonth - 1, CONFIG.baseDay);
                var target = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
                var diffDays = Math.round((target - base) / 86400000);
                return ((diffDays % CONFIG.cycle) + CONFIG.cycle) % CONFIG.cycle;
            } catch (e) {
                console.error('计算街道索引错误:', e);
                return 0;
            }
        }

        /* ============ 今日渲染 ============ */
        var lastRenderedKey = null;

        function renderToday() {
            try {
                var today = getBeijingDate();
                var idx = getStreetIndex(today);
                var todayStreet = STREETS[idx];

                DOM.todayDate.textContent = formatDate(today) + " " + getWeekday(today);
                DOM.todayStreet.textContent = todayStreet;

                renderLunarTo(DOM.todayLunar, today);

                var tomorrow = addDays(today, 1);
                var tIdx = getStreetIndex(tomorrow);
                DOM.tomorrowMarket.innerHTML =
                    "明天 " + formatDate(tomorrow).replace(/年|月/g, '.').replace('日', '') +
                    " " + getWeekday(tomorrow) + " → <span class='tomorrow-street'>" + STREETS[tIdx] + "</span>";

                renderCountdown(today, idx);

                lastRenderedKey = getDateKey(today);
            } catch (e) {
                console.error('渲染今日信息错误:', e);
                DOM.todayDate.textContent = "日期计算错误";
                DOM.todayStreet.textContent = "请刷新页面";
                DOM.tomorrowMarket.textContent = "系统异常，请重试";
            }
        }

        // 仅在日期变化时才刷新（切回页面、定时检查）
        function refreshIfDateChanged() {
            var today = getBeijingDate();
            if (lastRenderedKey !== getDateKey(today)) {
                renderToday();
            }
        }

        /* ============ 赶集倒计时渲染（按天数升序） ============ */
        function renderCountdown(today, todayIdx) {
            var items = [];
            for (var i = 0; i < STREETS.length; i++) {
                var days = ((i - todayIdx) + CONFIG.cycle) % CONFIG.cycle;
                items.push({ name: STREETS[i], days: days });
            }
            items.sort(function (a, b) { return a.days - b.days; });

            var html = '';
            for (var j = 0; j < items.length; j++) {
                var item = items[j];
                var isToday = (item.days === 0);
                var dayText;
                if (item.days === 0) dayText = '今天';
                else if (item.days === 1) dayText = '明天';
                else dayText = item.days + '天后';

                html += '<div class="countdown-item' + (isToday ? ' is-today' : '') + '">' +
                            '<div class="countdown-street">' + item.name + '</div>' +
                            '<div class="countdown-days">' + dayText + '</div>' +
                        '</div>';
            }
            DOM.countdownGrid.innerHTML = html;
        }

        /* ============ 查询 ============ */
        function showResult(date) {
            var idx = getStreetIndex(date);
            var resultStreet = STREETS[idx];

            DOM.resultDate.textContent = formatDate(date) + " " + getWeekday(date);
            DOM.resultStreet.textContent = resultStreet;

            renderLunarTo(DOM.resultLunar, date);

            var section = DOM.resultSection;
            section.classList.remove("show");
            void section.offsetWidth; // 强制重排，重播动画
            section.classList.add("show");

            setTimeout(function () {
                section.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 250);
        }

        function doQuery() {
            var input = DOM.queryDate;
            var val = input.value;
            if (!val) {
                input.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(function () { input.style.animation = ''; }, 500);
                return;
            }
            var parts = val.split('-');
            if (parts.length !== 3) return;
            var sel = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            if (isNaN(sel.getTime())) {
                alert('日期无效，请重新选择');
                return;
            }
            showResult(sel);
        }

        function quickQuery(offset) {
            var d = addDays(getBeijingDate(), offset);
            DOM.queryDate.value = formatInputDate(d);
            showResult(d);
        }

        /* ============ 分享 ============ */
        function showTempFeedback(button, message) {
            if (!button) return;
            var originalText = button.textContent;
            button.textContent = message;
            button.disabled = true;
            setTimeout(function () {
                button.textContent = originalText;
                button.disabled = false;
            }, 2000);
        }

        function copyToClipboardFallback(text, button) {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.width = '2em';
            textArea.style.height = '2em';
            textArea.style.padding = '0';
            textArea.style.border = 'none';
            textArea.style.outline = 'none';
            textArea.style.boxShadow = 'none';
            textArea.style.background = 'transparent';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);

            // 老 iOS 上 setSelectionRange 可能抛错，用 try/catch 包住
            try {
                textArea.focus();
                textArea.select();
                textArea.setSelectionRange(0, text.length);
            } catch (e) { /* 忽略，继续尝试 execCommand */ }

            var ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (err) {
                ok = false;
            }
            document.body.removeChild(textArea);

            if (ok) {
                showTempFeedback(button, '✅ 已复制');
            } else {
                window.prompt('请长按复制下面的网址：', text);
            }
        }

        function doCopy(url, button) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    showTempFeedback(button, '✅ 已复制');
                }).catch(function () {
                    copyToClipboardFallback(url, button);
                });
            } else {
                copyToClipboardFallback(url, button);
            }
        }

        function getShareUrl() {
            if (location.protocol === 'file:') {
                return CONFIG.onlineUrl || '';
            }
            return location.href;
        }

        function sharePage(button) {
            var url = getShareUrl();

            if (!url) {
                showTempFeedback(button, '⚠️ 请先填网址');
                setTimeout(function () {
                    alert(
                        '本地打开时无法分享。\n\n' +
                        '请把页面部署到网上，\n' +
                        '然后在代码开头的 CONFIG.onlineUrl 里填入网址。'
                    );
                }, 100);
                return;
            }

            if (navigator.share) {
                navigator.share({
                    title: '西邑赶集日历',
                    text: '永信街、羊邑街、丙麻街、西邑街四天循环查询',
                    url: url
                }).catch(function (e) {
                    if (e && e.name === 'AbortError') return;
                    doCopy(url, button);
                });
                return;
            }

            doCopy(url, button);
        }

        /* ============ 回到顶部 ============ */
        function backToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ============ 入场动画 ============ */
        function setupRevealAnimation() {
            var els = document.querySelectorAll('[data-animate]');
            if (!('IntersectionObserver' in window)) {
                for (var i = 0; i < els.length; i++) {
                    els[i].classList.add('visible');
                }
                return;
            }
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08 });
            els.forEach(function (el) { observer.observe(el); });
        }

        /* ============ 事件绑定（事件委托，无全局函数挂载） ============ */
        function bindEvents() {
            // 分享按钮
            var shareBtn = document.querySelector('.share-btn');
            if (shareBtn) {
                shareBtn.addEventListener('click', function () {
                    sharePage(this);
                });
            }

            // 快捷查询按钮
            var quickBtns = document.querySelectorAll('.quick-btn');
            for (var i = 0; i < quickBtns.length; i++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var offset = parseInt(this.getAttribute('data-offset'), 10) || 0;
                        quickQuery(offset);
                    });
                })(quickBtns[i]);
            }

            // 查询按钮
            var queryBtn = document.querySelector('.query-btn');
            if (queryBtn) {
                queryBtn.addEventListener('click', doQuery);
            }

            // 回到顶部
            if (DOM.backToTop) {
                DOM.backToTop.addEventListener('click', backToTop);
            }
        }

        /* ============ 粒子背景 ============ */
        var canvas = document.getElementById('particle-canvas');
        var ctx = canvas.getContext('2d');
        var particles = [];
        var mouse = { x: null, y: null, radius: 160 };
        var animationFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function Particle() {
            this.reset(true);
        }
        Particle.prototype.reset = function (initial) {
            this.x = Math.random() * canvas.width;
            this.y = initial ? Math.random() * canvas.height : -10;
            this.size = Math.random() * 2.8 + 0.8;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.color = this.getRandomColor();
        };
        Particle.prototype.getRandomColor = function () {
            var colors = [
                'rgba(230, 57, 70, 0.85)',
                'rgba(255, 215, 0, 0.85)',
                'rgba(255, 237, 78, 0.7)',
                'rgba(193, 33, 28, 0.7)',
                'rgba(255, 255, 255, 0.55)'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        };
        Particle.prototype.update = function () {
            this.x += this.speedX;
            this.y += this.speedY;

            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;

            if (mouse.x !== null && mouse.y !== null) {
                var dx = mouse.x - this.x;
                var dy = mouse.y - this.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius && dist > 0) {
                    var force = (mouse.radius - dist) / mouse.radius;
                    this.x += (dx / dist) * force * 2.2;
                    this.y += (dy / dist) * force * 2.2;
                }
            }
        };
        Particle.prototype.draw = function () {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };

        function initParticles() {
            particles = [];
            var area = canvas.width * canvas.height;
            var count = Math.floor(area / 11000);
            if (count > 130) count = 130;
            if (count < 50) count = 50;
            for (var i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            var maxDist = 130;
            for (var a = 0; a < particles.length; a++) {
                for (var b = a + 1; b < particles.length; b++) {
                    var dx = particles[a].x - particles[b].x;
                    var dy = particles[a].y - particles[b].y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        var opacity = 1 - (dist / maxDist);
                        ctx.strokeStyle = 'rgba(255, 215, 0, ' + (opacity * 0.45) + ')';
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connectParticles();
            animationFrameId = requestAnimationFrame(animateParticles);
        }

        function stopParticles() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function startParticles() {
            if (!animationFrameId) {
                animateParticles();
            }
        }

        /* ============ 点击粒子 ============ */
        function createClickParticles(x, y) {
            var count = 16;
            for (var i = 0; i < count; i++) {
                var p = document.createElement('div');
                p.className = 'click-particle';
                var size = Math.random() * 8 + 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.borderRadius = '50%';
                p.style.background = Math.random() > 0.5 ? '#ffd700' : '#e63946';
                p.style.boxShadow = '0 0 12px ' + (Math.random() > 0.5 ? '#ffd700' : '#e63946');
                document.body.appendChild(p);

                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 180 + 90;
                var duration = Math.random() * 0.8 + 0.5;

                if (p.animate) {
                    p.animate([
                        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                        {
                            transform: 'translate(' + (Math.cos(angle) * speed) + 'px, ' +
                                (Math.sin(angle) * speed) + 'px) scale(0.3)',
                            opacity: 0
                        }
                    ], {
                        duration: duration * 1000,
                        easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                    });
                }

                (function (el, dur) {
                    setTimeout(function () {
                        if (el.parentNode) el.parentNode.removeChild(el);
                    }, dur * 1000);
                })(p, duration);
            }
        }

        /* ============ 开屏控制 ============ */
        function isFirstVisit() {
            try {
                return !localStorage.getItem(CONFIG.storageKey);
            } catch (e) {
                return true;
            }
        }

        function markVisited() {
            try {
                localStorage.setItem(CONFIG.storageKey, '1');
            } catch (e) { /* 忽略 */ }
        }

        /* ============ 初始化 ============ */
        function init() {
            cacheDom();

            try {
                var today = getBeijingDate();
                DOM.splashDate.textContent = formatDate(today) + " " + getWeekday(today);
            } catch (e) {
                DOM.splashDate.textContent = "加载完成";
            }

            renderToday();

            if (DOM.queryDate) {
                var now = getBeijingDate();
                DOM.queryDate.value = formatInputDate(now);
                DOM.queryDate.min = CONFIG.minDate;
                DOM.queryDate.max = CONFIG.maxDate;
            }

            bindEvents();
            resizeCanvas();
            startParticles();
            setupRevealAnimation();

            var first = isFirstVisit();
            var delay = first ? 1600 : 400;
            setTimeout(function () {
                if (DOM.splashScreen) DOM.splashScreen.classList.add("hidden");
                markVisited();
            }, delay);
        }

        /* ============ 全局事件绑定 ============ */
        var resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvas, 200);
        });

        window.addEventListener('mousemove', function (e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('touchmove', function (e) {
            if (e.touches && e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('mouseout', function () {
            mouse.x = null;
            mouse.y = null;
        });
        window.addEventListener('touchend', function () {
            mouse.x = null;
            mouse.y = null;
        });
        window.addEventListener('touchcancel', function () {
            mouse.x = null;
            mouse.y = null;
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopParticles();
            } else {
                refreshIfDateChanged(); // 只在日期变化时重渲染
                startParticles();
            }
        });

        // 每分钟检查一次是否跨天（完整日期比较，跨月跨年也安全）
        setInterval(refreshIfDateChanged, 60000);

        var scrollTimer = null;
        window.addEventListener('scroll', function () {
            if (scrollTimer) return;
            scrollTimer = setTimeout(function () {
                if (DOM.backToTop) {
                    if (window.scrollY > 300) DOM.backToTop.classList.add("show");
                    else DOM.backToTop.classList.remove("show");
                }
                scrollTimer = null;
            }, 100);
        }, { passive: true });

        if (window.PointerEvent) {
            window.addEventListener('pointerdown', function (e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                createClickParticles(e.clientX, e.clientY);
            });
        } else {
            window.addEventListener('click', function (e) {
                createClickParticles(e.clientX, e.clientY);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
