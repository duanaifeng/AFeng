<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>飞机大战 · Sky Force</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 60%, #060a15 100%);
    color: #e2e8f0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(5px + env(safe-area-inset-top)) 8px calc(30px + env(safe-area-inset-bottom));
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 顶部数据 ---------- */
  .hud {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
    align-items: center;
    width: 100%;
    max-width: 720px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat {
    background: rgba(30, 41, 59, .8);
    border: 1px solid rgba(71, 85, 105, .55);
    border-radius: 9px;
    padding: 4px 9px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #94a3b8;
    white-space: nowrap;
    min-height: 26px;
  }

  .stat b {
    color: #f1f5f9;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .lives-stat {
    min-width: 116px;
    justify-content: flex-start;
  }

  .life-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 5px rgba(74, 222, 128, .7);
    margin-right: 2px;
    transition: opacity .2s, transform .2s;
  }
  .life-dot.lost {
    opacity: .18;
    box-shadow: none;
    transform: scale(.8);
  }

  .btn-sm {
    border: 1px solid rgba(71, 85, 105, .8);
    background: rgba(30, 41, 59, .9);
    color: #7dd3fc;
    border-radius: 9px;
    padding: 4px 9px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .btn-sm:active { transform: scale(.94); }

  /* ---------- 画布区 ---------- */
  .board-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 720px;
    padding: 8px;
    border-radius: 14px;
    background: rgba(15, 23, 42, .72);
    border: 1px solid rgba(51, 65, 85, .8);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(255, 255, 255, .05);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #gameCanvas {
    display: block;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
    touch-action: none;
  }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(2, 6, 23, .86);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 10;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay-card {
    text-align: center;
    padding: 20px 26px;
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
    max-width: 90%;
    width: 300px;
  }

  .overlay.show .overlay-card { transform: scale(1); }

  .overlay-emoji { font-size: 42px; line-height: 1; margin-bottom: 6px; }

  .overlay-card h2 {
    font-size: 22px;
    color: #4ade80;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .overlay-card p {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .overlay-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

  .help-list {
    text-align: left;
    display: inline-block;
    font-size: 13px;
    color: #cbd5e1;
    line-height: 2;
    margin: 4px 0;
  }
  .help-list b {
    display: inline-block;
    min-width: 72px;
    color: #7dd3fc;
    font-weight: 700;
  }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn {
    border: 1px solid rgba(71, 85, 105, .8);
    background: rgba(30, 41, 59, .9);
    color: #cbd5e1;
    border-radius: 9px;
    padding: 6px 13px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .btn:hover  { background: rgba(51, 65, 85, .95); color: #f1f5f9; }
  .btn:active { transform: scale(.95); }

  .btn.primary {
    background: linear-gradient(160deg, #38bdf8, #0284c7);
    border-color: #0ea5e9;
    color: #fff;
    font-weight: 600;
  }

  .btn.primary:hover { filter: brightness(1.12); }

  /* =========================================================
     复古掌机手柄区
     ========================================================= */
  .gamepad {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
    padding: 0 4px;
    gap: 16px;
    flex-shrink: 0;
    margin-bottom: 6px;
  }

  /* ---- 左侧：十字方向键 ---- */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, var(--dp));
    grid-template-rows: repeat(3, var(--dp));
    gap: 4px;
    --dp: 52px;
    flex-shrink: 0;
  }

  .dpad button {
    background: linear-gradient(180deg, #2f3f55 0%, #232f42 100%);
    border: none;
    color: #7dd3fc;
    font-size: 20px;
    cursor: pointer;
    touch-action: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .07s, background .1s, box-shadow .1s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .1),
                0 4px 8px rgba(0, 0, 0, .45);
    user-select: none;
  }

  .dpad button:active,
  .dpad button.pressed {
    background: linear-gradient(180deg, #3d5372 0%, #2a3950 100%);
    transform: scale(.93);
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, .55),
                0 0 18px rgba(56, 189, 248, .55);
    color: #bae6fd;
  }

  .dpad .up    { grid-area: 1 / 2; border-radius: 12px 12px 3px 3px; }
  .dpad .left  { grid-area: 2 / 1; border-radius: 12px 3px 3px 12px; }
  .dpad .right { grid-area: 2 / 3; border-radius: 3px 12px 12px 3px; }
  .dpad .down  { grid-area: 3 / 2; border-radius: 3px 3px 12px 12px; }

  .dpad .center {
    grid-area: 2 / 2;
    background: #1a2332;
    border-radius: 3px;
    position: relative;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .55);
  }

  .dpad .center::after {
    content: '';
    position: absolute;
    inset: 36%;
    border-radius: 50%;
    background: rgba(125, 211, 252, .2);
    box-shadow: 0 0 8px rgba(125, 211, 252, .15);
  }

  /* ---- 右侧：暂停 + 大射击按钮 ---- */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .actions .btn-pause {
    width: 76px;
    height: 38px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
    background: radial-gradient(circle at 34% 28%, #93c5fd, #2563eb 62%, #1e3a8a);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .55),
                inset 0 2px 0 rgba(255, 255, 255, .3),
                inset 0 -3px 8px rgba(0, 0, 0, .3);
    touch-action: manipulation;
    transition: transform .08s, filter .08s;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
  }

  .actions .btn-pause:active {
    transform: scale(.93);
    filter: brightness(1.25);
  }

  .actions .btn-fire {
    width: 114px;
    height: 114px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: radial-gradient(circle at 34% 28%, #fca5a5, #dc2626 62%, #7f1d1d);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .6),
                inset 0 3px 0 rgba(255, 255, 255, .35),
                inset 0 -4px 10px rgba(0, 0, 0, .35);
    touch-action: none;
    transition: transform .07s, filter .08s;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    user-select: none;
  }

  .actions .btn-fire:active,
  .actions .btn-fire.firing {
    transform: scale(.92);
    filter: brightness(1.35);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .7),
                inset 0 3px 10px rgba(0, 0, 0, .3),
                0 0 30px rgba(248, 113, 113, .85);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(56, 189, 248, 0.96);
    color: #fff;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.5);
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- 小屏适配 ---------- */
  @media (max-width: 420px) {
    body { padding: 4px 6px calc(24px + env(safe-area-inset-bottom)); gap: 4px; }
    .stat { padding: 3px 7px; font-size: 10px; min-height: 24px; }
    .stat b { font-size: 12px; }
    .lives-stat { min-width: 104px; }
    .btn-sm { padding: 3px 7px; font-size: 11px; }
    .btn { padding: 5px 10px; font-size: 11px; }
    .gamepad { gap: 10px; margin-bottom: 4px; max-width: 460px; }

    .dpad { --dp: 46px; gap: 3px; }
    .dpad button { font-size: 18px; }

    .actions { gap: 8px; }
    .actions .btn-pause { width: 68px; height: 34px; font-size: 12px; }
    .actions .btn-fire { width: 98px; height: 98px; font-size: 16px; }

    .help-list { font-size: 12px; line-height: 1.9; }
    .help-list b { min-width: 64px; }
    .overlay-card { width: 270px; padding: 18px 20px; }
  }

  @media (max-width: 360px) {
    .btn { padding: 5px 9px; font-size: 11px; }
    .overlay-card { width: 250px; }

    .dpad { --dp: 40px; gap: 3px; }
    .dpad button { font-size: 16px; }

    .actions { gap: 6px; }
    .actions .btn-pause { width: 60px; height: 30px; font-size: 11px; }
    .actions .btn-fire { width: 86px; height: 86px; font-size: 14px; }
  }

  @media (max-width: 320px) {
    .stat { padding: 2px 6px; font-size: 9px; }
    .stat b { font-size: 11px; }
    .overlay-card { width: 230px; padding: 16px 16px; }

    .dpad { --dp: 36px; gap: 2px; }
    .dpad button { font-size: 14px; }

    .actions { gap: 5px; }
    .actions .btn-pause { width: 54px; height: 28px; font-size: 10px; }
    .actions .btn-fire { width: 78px; height: 78px; font-size: 13px; }
  }

  @media (min-width: 500px) {
    .board-wrap { max-width: 640px; }
    .gamepad { max-width: 600px; gap: 28px; }
    .btn { padding: 8px 18px; font-size: 14px; }
    .stat { padding: 5px 12px; font-size: 12px; }
    .stat b { font-size: 14px; }
    .btn-sm { padding: 5px 12px; font-size: 13px; }

    .dpad { --dp: 62px; gap: 5px; }
    .dpad button { font-size: 24px; }

    .actions { gap: 12px; }
    .actions .btn-pause { width: 90px; height: 44px; font-size: 15px; }
    .actions .btn-fire { width: 138px; height: 138px; font-size: 22px; }
  }

  @media (max-height: 620px) {
    body { gap: 4px; }
    .gamepad { margin-bottom: 2px; }

    .dpad { --dp: 44px; gap: 3px; }
    .dpad button { font-size: 17px; }

    .actions { gap: 6px; }
    .actions .btn-pause { width: 64px; height: 32px; font-size: 11px; }
    .actions .btn-fire { width: 92px; height: 92px; font-size: 15px; }
  }

  @media (max-height: 520px) {
    .toolbar .btn { padding: 5px 10px; font-size: 11px; }
    body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

    .dpad { --dp: 38px; gap: 2px; }
    .dpad button { font-size: 15px; }

    .actions { gap: 5px; }
    .actions .btn-pause { width: 56px; height: 28px; font-size: 10px; }
    .actions .btn-fire { width: 80px; height: 80px; font-size: 13px; }
  }
</style>
</head>
<body>

  <div class="hud">
    <div class="stat"><span>分数</span><b id="scoreNum">0</b></div>
    <div class="stat"><span>最高</span><b id="bestNum">0</b></div>
    <div class="stat"><span>关卡</span><b id="levelNum">1 / 10</b></div>
    <div class="stat lives-stat">
      <span>生命</span>
      <span id="livesBox">
        <span class="life-dot"></span>
        <span class="life-dot"></span>
        <span class="life-dot"></span>
        <span class="life-dot"></span>
        <span class="life-dot"></span>
      </span>
    </div>
    <button class="btn-sm" id="fsBtn">⛶ 全屏</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <div class="overlay-emoji" id="overlayEmoji">⏸</div>
        <h2 id="overlayTitle">已暂停</h2>
        <p id="overlayText"></p>
        <div class="overlay-btns">
          <button class="btn" id="overlayBtn1">继续</button>
          <button class="btn primary" id="overlayBtn2">重新开始</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="helpOverlay">
      <div class="overlay-card">
        <div class="overlay-emoji">🎮</div>
        <h2>使用说明</h2>
        <div class="help-list">
          <div><b>▲▼◀▶</b> 控制飞机移动</div>
          <div><b>射击</b> 按住持续射击</div>
          <div><b>暂停</b> 暂停 / 继续</div>
          <div><b>点击画布</b> 也可射击</div>
          <div><b>键盘</b> 方向键 / WASD 移动</div>
          <div><b>键盘</b> 空格射击 · P暂停</div>
          <div><b>键盘</b> R重开 · F全屏</div>
          <div><b>目标</b> 每1000分升一关，共10关</div>
        </div>
        <div class="overlay-btns">
          <button class="btn primary" id="helpClose">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="restartBtn">重新开始</button>
    <button class="btn" id="helpBtn">使用说明</button>
  </div>

  <!-- 复古掌机手柄 -->
  <div class="gamepad">
    <div class="dpad">
      <button class="up"    id="upBtn">▲</button>
      <button class="left"  id="leftBtn">◀</button>
      <div class="center"></div>
      <button class="right" id="rightBtn">▶</button>
      <button class="down"  id="downBtn">▼</button>
    </div>

    <div class="actions">
      <button class="btn-pause" id="pauseBtn">暂停</button>
      <button class="btn-fire"  id="fireBtn">射击</button>
    </div>
  </div>

<script>
/* =========================================================
   1. 常量
   ========================================================= */
const BASE_W = 400;
const BASE_H = 560;

const PLAYER_W = 34;
const PLAYER_H = 38;
const PLAYER_SPEED = 320;

const BULLET_W = 4;
const BULLET_H = 12;
const BULLET_SPEED = 560;
const FIRE_INTERVAL = 130;

const ENEMY_W = 32;
const ENEMY_H = 30;

const MAX_LIVES = 5;
const MAX_LEVEL = 10;
const SCORE_PER_KILL = 10;        // 每击落一架 10 分
const SCORE_PER_LEVEL = 1000;     // 每 1000 分升一关
const MAX_SCORE = MAX_LEVEL * SCORE_PER_LEVEL; // 10000

/* =========================================================
   2. DOM 引用
   ========================================================= */
const boardWrapEl = document.getElementById('boardWrap');
const canvas      = document.getElementById('gameCanvas');
const ctx         = canvas.getContext('2d');
const scoreEl     = document.getElementById('scoreNum');
const bestEl      = document.getElementById('bestNum');
const levelEl     = document.getElementById('levelNum');
const livesBox    = document.getElementById('livesBox');
const fsBtn       = document.getElementById('fsBtn');
const overlay     = document.getElementById('overlay');
const overlayEmoji= document.getElementById('overlayEmoji');
const overlayTitle= document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayBtn1 = document.getElementById('overlayBtn1');
const overlayBtn2 = document.getElementById('overlayBtn2');
const helpOverlay = document.getElementById('helpOverlay');
const helpClose   = document.getElementById('helpClose');
const helpBtn     = document.getElementById('helpBtn');
const restartBtn  = document.getElementById('restartBtn');
const pauseBtn    = document.getElementById('pauseBtn');
const fireBtn     = document.getElementById('fireBtn');
const upBtn       = document.getElementById('upBtn');
const downBtn     = document.getElementById('downBtn');
const leftBtn     = document.getElementById('leftBtn');
const rightBtn    = document.getElementById('rightBtn');

/* =========================================================
   3. 游戏状态
   ========================================================= */
let score = 0;
let best = parseInt(localStorage.getItem('skyforce_best') || '0', 10);
let level = 1;
let lives = MAX_LIVES;

let player = { x: BASE_W / 2, y: BASE_H - 90 };
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let paused = false;
let gameOver = false;
let gameWin = false;       // 通关标记
let firing = false;
let fireCooldown = 0;
let spawnTimer = 0;
let spawnInterval = 950;
let lastTime = 0;
let rafId = null;
let timeAccum = 0;

let scale = 1;
let canvasW = BASE_W;
let canvasH = BASE_H;

let keyLeft = false, keyRight = false, keyUp = false, keyDown = false;
let keyFire = false;

/* =========================================================
   4. 星空背景
   ========================================================= */
function initStars() {
  stars = [];
  for (let i = 0; i < 70; i++) {
    stars.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      speed: 20 + Math.random() * 60,
      size: 0.6 + Math.random() * 1.6,
      alpha: 0.3 + Math.random() * 0.7
    });
  }
}

/* =========================================================
   5. 自适应画布
   ========================================================= */
function resizeCanvas() {
  const style = getComputedStyle(boardWrapEl);
  const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

  const availW = boardWrapEl.clientWidth  - padX;
  const availH = boardWrapEl.clientHeight - padY;

  if (availW <= 0 || availH <= 0) return;

  const ratio = BASE_W / BASE_H;
  let w = availW;
  let h = w / ratio;
  if (h > availH) {
    h = availH;
    w = h * ratio;
  }

  canvasW = Math.floor(w);
  canvasH = Math.floor(h);
  scale = canvasW / BASE_W;

  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(canvasW * dpr);
  canvas.height = Math.floor(canvasH * dpr);
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.scale(scale, scale);

  draw();
}

/* =========================================================
   6. 绘制
   ========================================================= */
function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, BASE_H);
  bg.addColorStop(0, '#050b18');
  bg.addColorStop(0.5, '#0a1428');
  bg.addColorStop(1, '#0f1d38');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const b of bullets) {
    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + BULLET_H);
    grad.addColorStop(0, '#fef08a');
    grad.addColorStop(0.4, '#fde047');
    grad.addColorStop(1, '#f59e0b');
    ctx.fillStyle = grad;
    roundRect(ctx, b.x - BULLET_W / 2, b.y, BULLET_W, BULLET_H, 2);
    ctx.fill();

    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(b.x, b.y + BULLET_H / 2, BULLET_W * 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const e of enemies) {
    drawEnemy(e);
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (!gameOver && !gameWin) drawPlayer();
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  const flameLen = 12 + Math.sin(timeAccum * 0.02) * 5;
  const flameGrad = ctx.createLinearGradient(x, y + PLAYER_H / 2, x, y + PLAYER_H / 2 + flameLen);
  flameGrad.addColorStop(0, 'rgba(56, 189, 248, 0.95)');
  flameGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.85)');
  flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
  ctx.fillStyle = flameGrad;

  ctx.beginPath();
  ctx.moveTo(x - 6, y + PLAYER_H / 2 - 2);
  ctx.lineTo(x, y + PLAYER_H / 2 + flameLen);
  ctx.lineTo(x + 6, y + PLAYER_H / 2 - 2);
  ctx.closePath();
  ctx.fill();

  const bodyGrad = ctx.createLinearGradient(x, y - PLAYER_H / 2, x, y + PLAYER_H / 2);
  bodyGrad.addColorStop(0, '#e0f2fe');
  bodyGrad.addColorStop(0.4, '#38bdf8');
  bodyGrad.addColorStop(1, '#0369a1');

  ctx.beginPath();
  ctx.moveTo(x, y - PLAYER_H / 2);
  ctx.lineTo(x + PLAYER_W / 2, y + PLAYER_H / 4);
  ctx.lineTo(x + PLAYER_W / 2 - 4, y + PLAYER_H / 2);
  ctx.lineTo(x + 5, y + PLAYER_H / 3);
  ctx.lineTo(x, y + PLAYER_H / 2);
  ctx.lineTo(x - 5, y + PLAYER_H / 3);
  ctx.lineTo(x - PLAYER_W / 2 + 4, y + PLAYER_H / 2);
  ctx.lineTo(x - PLAYER_W / 2, y + PLAYER_H / 4);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(186, 230, 253, 0.9)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const cockpitGrad = ctx.createRadialGradient(x - 2, y - 4, 1, x, y - 2, 6);
  cockpitGrad.addColorStop(0, '#bae6fd');
  cockpitGrad.addColorStop(1, '#0369a1');
  ctx.fillStyle = cockpitGrad;
  ctx.beginPath();
  ctx.ellipse(x, y - 4, 4, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(x, y - PLAYER_H / 2 + 1, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawEnemy(e) {
  const x = e.x;
  const y = e.y;
  const w = ENEMY_W;
  const h = ENEMY_H;
  const colors = e.color;

  const bodyGrad = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
  bodyGrad.addColorStop(0, colors[0]);
  bodyGrad.addColorStop(1, colors[1]);

  ctx.beginPath();
  ctx.moveTo(x, y + h / 2);
  ctx.lineTo(x + w / 2, y - h / 4);
  ctx.lineTo(x + w / 2 - 5, y - h / 2);
  ctx.lineTo(x - w / 2 + 5, y - h / 2);
  ctx.lineTo(x - w / 2, y - h / 4);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  ctx.strokeStyle = colors[2];
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.fillStyle = colors[2];
  ctx.beginPath();
  ctx.ellipse(x, y - 2, 3.5, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(251, 191, 36, 0.8)';
  ctx.beginPath();
  ctx.arc(x, y + h / 2 + 2, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* =========================================================
   7. 难度曲线（平缓递增，第 10 关最难但可玩）
   ========================================================= */
function getEnemySpeed() {
  // 基础 70，每关 +12，第 10 关约 178
  return 70 + (level - 1) * 12;
}

function getSpawnInterval() {
  // 基础 950ms，每关 -45ms，第 10 关约 545ms
  return Math.max(480, 950 - (level - 1) * 45);
}

/* =========================================================
   8. 游戏逻辑
   ========================================================= */
const ENEMY_TYPES = [
  { colors: ['#f87171', '#991b1b', '#fecaca'], hp: 1, speedMul: 1.0 },
  { colors: ['#fb923c', '#9a3412', '#fed7aa'], hp: 1, speedMul: 1.15 },
  { colors: ['#a78bfa', '#5b21b6', '#ddd6fe'], hp: 2, speedMul: 0.9 },
  { colors: ['#4ade80', '#166534', '#bbf7d0'], hp: 1, speedMul: 1.3 }
];

function spawnEnemy() {
  const typeIdx = Math.floor(Math.random() * ENEMY_TYPES.length);
  const type = ENEMY_TYPES[typeIdx];

  let hp = type.hp;
  // 第 5 关起才有概率出现双血敌机，概率随关卡小幅提升
  if (level >= 5 && Math.random() < 0.12 + (level - 5) * 0.03) hp++;

  const x = 40 + Math.random() * (BASE_W - 80);
  const speed = getEnemySpeed() * type.speedMul;

  enemies.push({
    x: x,
    y: -ENEMY_H,
    hp: hp,
    maxHp: hp,
    color: type.colors,
    speed: speed,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 1.2 + Math.random() * 1.2
  });
}

function shoot() {
  if (paused || gameOver || gameWin) return;
  if (fireCooldown > 0) return;

  fireCooldown = FIRE_INTERVAL;

  bullets.push({ x: player.x - 8, y: player.y - PLAYER_H / 2 });
  bullets.push({ x: player.x + 8, y: player.y - PLAYER_H / 2 });
}

function loseLife() {
  lives--;
  updateLives();
  spawnParticles(player.x, player.y, '#f87171', 24);

  if (lives <= 0) {
    gameOver = true;
    showGameOver();
    return;
  }

  player.x = BASE_W / 2;
  player.y = BASE_H - 90;

  showToast('被击中！剩余 ' + lives + ' 条命');
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed * 60,
      vy: Math.sin(angle) * speed * 60,
      r: 1.5 + Math.random() * 3,
      color,
      life: 1,
      maxLife: 1
    });
  }
}

function updateLives() {
  const dots = livesBox.querySelectorAll('.life-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('lost', i >= lives);
  });
}

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent  = best;
  levelEl.textContent = level + ' / ' + MAX_LEVEL;
}

/* =========================================================
   9. 更新
   ========================================================= */
function update(dt) {
  timeAccum += dt * 1000;

  for (const s of stars) {
    s.y += s.speed * dt;
    if (s.y > BASE_H) {
      s.y = -2;
      s.x = Math.random() * BASE_W;
    }
  }

  if (paused || gameOver || gameWin) return;

  if (fireCooldown > 0) fireCooldown -= dt * 1000;

  let dx = 0, dy = 0;
  if (keyLeft)  dx -= 1;
  if (keyRight) dx += 1;
  if (keyUp)    dy -= 1;
  if (keyDown)  dy += 1;

  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }

  player.x += dx * PLAYER_SPEED * dt;
  player.y += dy * PLAYER_SPEED * dt;

  player.x = Math.max(PLAYER_W / 2 + 4, Math.min(BASE_W - PLAYER_W / 2 - 4, player.x));
  player.y = Math.max(PLAYER_H / 2 + 4, Math.min(BASE_H - PLAYER_H / 2 - 4, player.y));

  if (firing || keyFire) shoot();

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= BULLET_SPEED * dt;
    if (b.y + BULLET_H < 0) bullets.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed * dt;
    e.wobble += e.wobbleSpeed * dt;
    e.x += Math.sin(e.wobble) * 25 * dt;

    if (e.x < ENEMY_W / 2) e.x = ENEMY_W / 2;
    if (e.x > BASE_W - ENEMY_W / 2) e.x = BASE_W - ENEMY_W / 2;

    if (e.y - ENEMY_H / 2 > BASE_H) {
      enemies.splice(i, 1);
      continue;
    }

    if (!gameOver &&
        Math.abs(e.x - player.x) < (ENEMY_W / 2 + PLAYER_W / 2 - 8) &&
        Math.abs(e.y - player.y) < (ENEMY_H / 2 + PLAYER_H / 2 - 8)) {
      enemies.splice(i, 1);
      loseLife();
      continue;
    }
  }

  // 子弹与敌机碰撞
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(b.x - e.x) < ENEMY_W / 2 &&
          Math.abs(b.y - e.y) < ENEMY_H / 2) {
        e.hp--;
        bullets.splice(i, 1);

        if (e.hp <= 0) {
          // 每击落一架 10 分
          score += SCORE_PER_KILL;
          if (score > best) {
            best = score;
            localStorage.setItem('skyforce_best', best);
          }

          spawnParticles(e.x, e.y, e.color[0], 14);
          enemies.splice(j, 1);

          // 每 1000 分升一关，最多 10 关
          const newLevel = Math.min(MAX_LEVEL, Math.floor(score / SCORE_PER_LEVEL) + 1);
          if (newLevel > level) {
            level = newLevel;
            spawnInterval = getSpawnInterval();
            showToast('第 ' + level + ' / ' + MAX_LEVEL + ' 关！');
          }

          updateHUD();

          // 满分通关
          if (score >= MAX_SCORE) {
            gameWin = true;
            showGameWin();
            return;
          }
        } else {
          spawnParticles(b.x, b.y, '#fde047', 4);
        }
        break;
      }
    }
  }

  // 生成敌机
  spawnTimer += dt * 1000;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
    // 第 6 关起偶尔一次两架
    if (level >= 6 && Math.random() < 0.25) spawnEnemy();
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.life -= dt * 2.2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* =========================================================
   10. 游戏循环
   ========================================================= */
function loop(t) {
  rafId = requestAnimationFrame(loop);

  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000;
  lastTime = t;

  dt = Math.min(dt, 0.05);

  update(dt);
  draw();
}

/* =========================================================
   11. 暂停 / 结束 / 通关
   ========================================================= */
function togglePause() {
  if (gameOver || gameWin) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';

  if (paused) {
    overlayEmoji.textContent = '⏸';
    overlayTitle.textContent = '已暂停';
    overlayTitle.style.color = '#4ade80';
    overlayText.textContent = '';
    overlayBtn1.textContent = '继续';
    overlayBtn1.onclick = togglePause;
    overlayBtn2.textContent = '重新开始';
    overlayBtn2.onclick = resetGame;
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
    lastTime = 0;
  }
}

function showGameOver() {
  overlayEmoji.textContent = '💀';
  overlayTitle.textContent = '游戏结束';
  overlayTitle.style.color = '#f87171';
  overlayText.textContent = '分数：' + score + ' · 第 ' + level + ' 关';
  overlayBtn1.textContent = '再来一局';
  overlayBtn1.onclick = resetGame;
  overlayBtn2.textContent = '关闭';
  overlayBtn2.onclick = () => overlay.classList.remove('show');
  overlay.classList.add('show');
}

function showGameWin() {
  overlayEmoji.textContent = '🏆';
  overlayTitle.textContent = '恭喜通关！';
  overlayTitle.style.color = '#fbbf24';
  overlayText.textContent = '满分 ' + MAX_SCORE + '！你太强了！';
  overlayBtn1.textContent = '再来一局';
  overlayBtn1.onclick = resetGame;
  overlayBtn2.textContent = '关闭';
  overlayBtn2.onclick = () => overlay.classList.remove('show');
  overlay.classList.add('show');
}

/* =========================================================
   12. 重新开始
   ========================================================= */
function resetGame() {
  score = 0;
  level = 1;
  lives = MAX_LIVES;
  gameOver = false;
  gameWin = false;
  paused = false;
  firing = false;
  fireCooldown = 0;
  spawnTimer = 0;
  spawnInterval = getSpawnInterval();
  bullets = [];
  enemies = [];
  particles = [];
  timeAccum = 0;

  player.x = BASE_W / 2;
  player.y = BASE_H - 90;

  updateLives();
  updateHUD();

  pauseBtn.textContent = '暂停';
  overlay.classList.remove('show');

  showToast('起飞！5 条命 · 共 10 关');
  lastTime = 0;
}

/* =========================================================
   13. 方向键
   ========================================================= */
function bindDirButton(el, setter) {
  let active = false;

  const start = (e) => {
    e.preventDefault();
    active = true;
    setter(true);
    el.classList.add('pressed');
  };

  const stop = () => {
    if (!active) return;
    active = false;
    setter(false);
    el.classList.remove('pressed');
  };

  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  el.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

bindDirButton(upBtn,    v => { keyUp = v; });
bindDirButton(downBtn,  v => { keyDown = v; });
bindDirButton(leftBtn,  v => { keyLeft = v; });
bindDirButton(rightBtn, v => { keyRight = v; });

/* =========================================================
   14. 射击按钮
   ========================================================= */
function bindFireButton() {
  let active = false;

  const start = (e) => {
    e.preventDefault();
    active = true;
    firing = true;
    fireBtn.classList.add('firing');
    shoot();
  };

  const stop = () => {
    if (!active) return;
    active = false;
    firing = false;
    fireBtn.classList.remove('firing');
  };

  fireBtn.addEventListener('pointerdown', start);
  fireBtn.addEventListener('pointerup', stop);
  fireBtn.addEventListener('pointerleave', stop);
  fireBtn.addEventListener('pointercancel', stop);
  fireBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  fireBtn.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

/* =========================================================
   15. 全屏
   ========================================================= */
function isFullscreen() {
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.mozRequestFullScreen ||
                el.msRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
  } else {
    const exit = document.exitFullscreen ||
                 document.webkitExitFullscreen ||
                 document.mozCancelFullScreen ||
                 document.msExitFullscreen;
    if (exit) { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
  }
}

function updateFsBtn() {
  fsBtn.textContent = isFullscreen() ? '⛶ 退出' : '⛶ 全屏';
}

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
.forEach(ev => document.addEventListener(ev, () => {
  updateFsBtn();
  setTimeout(resizeCanvas, 60);
  setTimeout(resizeCanvas, 300);
}));

/* =========================================================
   16. Toast
   ========================================================= */
function showToast(text) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1500);
}

/* =========================================================
   17. 事件绑定
   ========================================================= */
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (gameOver || gameWin) return;
  firing = true;
  shoot();
});
canvas.addEventListener('pointerup', () => { firing = false; });
canvas.addEventListener('pointerleave', () => { firing = false; });
canvas.addEventListener('pointercancel', () => { firing = false; });

pauseBtn.addEventListener('click', togglePause);
restartBtn.addEventListener('click', resetGame);
helpBtn.addEventListener('click', () => helpOverlay.classList.add('show'));
helpClose.addEventListener('click', () => helpOverlay.classList.remove('show'));
fsBtn.addEventListener('click', toggleFullscreen);

window.addEventListener('keydown', e => {
  const k = e.key;

  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); keyLeft = true; return; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); keyRight = true; return; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); keyUp = true; return; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); keyDown = true; return; }

  if (k === ' ') { e.preventDefault(); keyFire = true; return; }
  if (k === 'p' || k === 'P') { e.preventDefault(); togglePause(); return; }
  if (k === 'r' || k === 'R') { e.preventDefault(); resetGame(); return; }
  if (k === 'f' || k === 'F') { e.preventDefault(); toggleFullscreen(); return; }
});

window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keyLeft = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keyRight = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keyUp = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keyDown = false;
  if (k === ' ') keyFire = false;
});

/* =========================================================
   18. 自适应
   ========================================================= */
if (window.ResizeObserver) {
  new ResizeObserver(() => resizeCanvas()).observe(boardWrapEl);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 200);
  setTimeout(resizeCanvas, 500);
});

/* =========================================================
   19. 启动
   ========================================================= */
initStars();
updateLives();
updateHUD();
updateFsBtn();
bindFireButton();

requestAnimationFrame(() => {
  resizeCanvas();
  lastTime = 0;
  rafId = requestAnimationFrame(loop);
});
</script>
