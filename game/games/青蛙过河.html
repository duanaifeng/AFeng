<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e20">
<title>青蛙过河 · Frogger</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --gold: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e20;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #fff;
    touch-action: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    background:
      radial-gradient(ellipse at 50% 0%, #1a2a4a 0%, transparent 60%),
      linear-gradient(180deg, #0a0e20 0%, #050810 100%);
    padding: calc(6px + var(--safe-top)) 6px calc(6px + var(--safe-bottom));
    gap: 5px;
  }
  .top-hud {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 720px;
    padding: 6px 14px;
    background: rgba(15, 23, 42, 0.85);
    border: 1.5px solid rgba(71, 85, 105, 0.6);
    border-radius: 12px;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .hud-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 800;
    letter-spacing: 1px;
    color: #94a3b8;
    white-space: nowrap;
  }
  .hud-val {
    color: #f1f5f9;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    text-shadow: 0 0 12px currentColor;
  }
  .hud-val.time { color: #fbbf24; }
  .hud-val.best { color: #4ade80; }
  .hud-val.lives { color: #fb7185; }
  .hud-val.level { color: #7dd3fc; }
  .hud-val.homes { color: #a78bfa; }

  .canvas-wrap {
    position: relative;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.7),
      0 0 0 2px rgba(71, 85, 105, 0.7),
      0 0 0 4px rgba(15, 23, 42, 0.9);
    background: #000;
    margin: 0 auto;
  }
  #game {
    display: block;
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .hint-bar {
    display: flex; align-items: center; justify-content: center;
    padding: 5px 14px;
    background: rgba(15, 23, 42, 0.8);
    border: 1.5px solid rgba(71, 85, 105, 0.6);
    border-radius: 10px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #94a3b8;
    flex-shrink: 0;
    min-height: 26px;
    text-align: center;
    transition: color 0.2s;
    max-width: 720px;
    width: 100%;
  }

  .ctrl-wrap {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    width: 100%;
    max-width: 720px;
    padding: 0;
    gap: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .left-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    width: 92px;
    height: 52px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.08s, filter 0.08s;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.35);
  }
  .action-btn:active { transform: scale(0.92); filter: brightness(1.2); }
  .action-btn.pause {
    background: radial-gradient(circle at 34% 28%, #93c5fd, #2563eb 62%, #1e3a8a);
  }
  .action-btn.restart {
    background: radial-gradient(circle at 34% 28%, #fcd34d, #d97706 62%, #78350f);
  }
  .action-btn.fs {
    background: radial-gradient(circle at 34% 28%, #c4b5fd, #8b5cf6 62%, #4c1d95);
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, var(--dp));
    grid-template-rows: repeat(3, var(--dp));
    gap: 8px;
    --dp: 74px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .dpad button {
    background: linear-gradient(180deg, #2f3f55 0%, #232f42 100%);
    border: none;
    color: #7dd3fc;
    font-size: 34px;
    font-weight: 900;
    cursor: pointer;
    touch-action: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.07s, background 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.14),
                0 6px 12px rgba(0, 0, 0, 0.55);
    user-select: none;
    border-radius: 14px;
  }
  .dpad button:active,
  .dpad button.pressed {
    background: linear-gradient(180deg, #3d5372 0%, #2a3950 100%);
    transform: scale(0.9);
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.55),
                0 0 22px rgba(56, 189, 248, 0.7);
    color: #bae6fd;
  }
  .dpad .empty { visibility: hidden; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(2, 6, 23, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-card {
    text-align: center;
    padding: 24px 28px;
    border-radius: 18px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid rgba(71, 85, 105, 0.8);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
    transform: scale(0.85);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
    width: 340px;
  }
  .overlay.show .overlay-card { transform: scale(1); }
  .overlay-emoji { font-size: 48px; line-height: 1; margin-bottom: 10px; }
  .overlay-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    margin-bottom: 8px;
    text-shadow: 0 4px 30px rgba(251, 191, 36, 0.5);
  }
  .overlay-title.lose { color: #fb7185; text-shadow: 0 4px 30px rgba(251, 113, 133, 0.5); }
  .overlay-title.win { color: #4ade80; text-shadow: 0 4px 30px rgba(74, 222, 128, 0.5); }
  .overlay-sub {
    font-size: 13px;
    letter-spacing: 2px;
    color: #94a3b8;
    margin-bottom: 16px;
    line-height: 1.9;
  }
  .overlay-btns {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap;
  }
  .ov-btn {
    padding: 11px 24px;
    border: 1.5px solid rgba(71, 85, 105, 0.8);
    background: rgba(30, 41, 59, 0.9);
    color: #cbd5e1;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .ov-btn:hover { background: rgba(51, 65, 85, 0.95); color: #f1f5f9; transform: translateY(-2px); }
  .ov-btn:active { transform: translateY(0) scale(0.95); }
  .ov-btn.primary {
    background: linear-gradient(160deg, #38bdf8, #0284c7);
    border-color: #0ea5e9;
    color: #fff;
    box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
  }
  .ov-btn.green {
    background: linear-gradient(160deg, #4ade80, #16a34a);
    border-color: #4ade80;
    color: #052e16;
    box-shadow: 0 4px 18px rgba(74, 222, 128, 0.4);
  }
  .help-list {
    text-align: left;
    display: inline-block;
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.9;
    margin-bottom: 14px;
  }
  .help-list b {
    display: inline-block;
    min-width: 66px;
    color: #7dd3fc;
    font-weight: 800;
  }
  .toast {
    position: fixed;
    top: calc(20px + var(--safe-top));
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(251, 191, 36, 0.95);
    color: #1a0f00;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 200;
    box-shadow: 0 8px 28px rgba(251, 191, 36, 0.5);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { background: rgba(74, 222, 128, 0.95); box-shadow: 0 8px 28px rgba(74, 222, 128, 0.5); }
  .toast.red   { background: rgba(251, 113, 133, 0.95); color: #fff; box-shadow: 0 8px 28px rgba(251, 113, 133, 0.5); }

  @media (max-width: 560px) {
    .action-btn { width: 84px; height: 46px; font-size: 13px; border-radius: 12px; }
    .dpad { --dp: 66px; gap: 7px; }
    .dpad button { font-size: 30px; border-radius: 12px; }
    .hud-item { font-size: 11px; }
    .hud-val { font-size: 13px; }
  }
  @media (max-width: 480px) {
    .action-btn { width: 78px; height: 44px; font-size: 12px; }
    .dpad { --dp: 62px; gap: 6px; }
    .dpad button { font-size: 28px; }
  }
  @media (max-width: 420px) {
    .action-btn { width: 72px; height: 42px; font-size: 12px; border-radius: 11px; }
    .dpad { --dp: 58px; gap: 5px; }
    .dpad button { font-size: 26px; border-radius: 11px; }
    .ctrl-wrap { gap: 8px; }
  }
  @media (max-width: 380px) {
    .action-btn { width: 66px; height: 40px; font-size: 11px; }
    .dpad { --dp: 54px; gap: 5px; }
    .dpad button { font-size: 24px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="top-hud">
    <div class="hud-item">时间 <span class="hud-val time" id="timeVal">0.0s</span></div>
    <div class="hud-item">最佳 <span class="hud-val best" id="bestVal">--</span></div>
    <div class="hud-item">生命 <span class="hud-val lives" id="livesVal">5</span></div>
    <div class="hud-item">关卡 <span class="hud-val level" id="levelVal">1</span></div>
    <div class="hud-item">到家 <span class="hud-val homes" id="homesVal">0/5</span></div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="game" width="448" height="512"></canvas>
  </div>

  <div class="hint-bar" id="hintBar">
    ← ↑ → ↓ 移动 · 踩荷叶过河 · 到家
  </div>

  <div class="ctrl-wrap">
    <div class="left-actions">
      <button class="action-btn pause" id="pauseBtn">暂停</button>
      <button class="action-btn restart" id="restartBtn">重开</button>
      <button class="action-btn fs" id="fsBtn">全屏</button>
    </div>
    <div class="dpad" id="dpad">
      <button class="empty"></button>
      <button id="upBtn">▲</button>
      <button class="empty"></button>
      <button id="leftBtn">◀</button>
      <button class="empty"></button>
      <button id="rightBtn">▶</button>
      <button class="empty"></button>
      <button id="downBtn">▼</button>
      <button class="empty"></button>
    </div>
  </div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🐸</div>
    <div class="overlay-title">青 蛙 过 河</div>
    <div class="overlay-sub">F R O G G E R</div>
    <div class="help-list">
      <div><b>移动</b>方向键 / 触屏方向键</div>
      <div><b>过河</b>踩荷叶过河</div>
      <div><b>荷叶</b>左右规律移动</div>
      <div><b>目标</b>5 只青蛙都到家</div>
      <div><b>计时</b>越快通关，成绩越好</div>
    </div>
    <div class="overlay-btns">
      <button class="ov-btn green" id="startBtn">开 始</button>
    </div>
  </div>
</div>

<div class="overlay" id="pauseOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">⏸</div>
    <div class="overlay-title">已 暂 停</div>
    <div class="overlay-sub">想继续还是重开？</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="resumeBtn">继 续</button>
      <button class="ov-btn" id="pauseRestartBtn">重 开</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title win">全 部 到 家 ！</div>
    <div class="overlay-sub" id="winSub">用时 0 秒</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="nextBtn">下 一 关</button>
    </div>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">💥</div>
    <div class="overlay-title lose">游 戏 结 束</div>
    <div class="overlay-sub" id="overSub">得分 0</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="retryBtn">再 来</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
 *  音效
 * ============================================================ */
const Sound = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },
  tone(o) {
    if (!this.enabled || !this.ctx) return;
    const { freq, freq2, dur = 0.1, type = 'square', vol = 0.3, delay = 0 } = o;
    try {
      const t0 = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (freq2 && freq2 !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  hop() { this.tone({ freq: 400, freq2: 700, dur: 0.08, type: 'square', vol: 0.15 }); },
  splash() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime;
      const len = Math.floor(this.ctx.sampleRate * 0.25);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 600;
      const g = this.ctx.createGain();
      g.gain.value = 0.3;
      src.connect(filt); filt.connect(g); g.connect(this.master);
      src.start(t0);
    } catch (e) {}
  },
  home() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, dur: 0.14, type: 'square', vol: 0.25, delay: i * 0.08 }));
  },
  win() {
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone({ freq: f, dur: 0.16, type: 'square', vol: 0.26, delay: i * 0.1 }));
  },
  lose() {
    [392, 330, 262, 196].forEach((f, i) => this.tone({ freq: f, dur: 0.3, type: 'sawtooth', vol: 0.24, delay: i * 0.15 }));
  },
  click() { this.tone({ freq: 880, dur: 0.045, type: 'square', vol: 0.08 }); }
};

/* ============================================================
 *  常量
 * ============================================================ */
const W = 448;
const H = 512;
const ROWS_VIS = 10;
const ROW_H = H / ROWS_VIS;

const ROW_TYPES = [
  'home',
  'water', 'water', 'water', 'water',
  'water', 'water', 'water', 'water',
  'start',
];

/* ============================================================
 *  主游戏
 * ============================================================ */
const Game = {
  canvas: null, ctx: null,

  state: 'menu',
  level: 1,
  lives: 5,
  homesFilled: 0,
  homes: [],

  totalTime: 0,
  bestTime: null,

  frog: null,
  lanes: [],
  particles: [],
  floats: [],

  keys: { up: false, down: false, left: false, right: false },

  lastHop: 0,
  hopCooldown: 0.08,
  dyingTimer: 0,

  lastTime: 0,
  time: 0,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = true;

    this.resizeCanvas();
    window.addEventListener('resize', () => this.resizeCanvas());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resizeCanvas(), 200));

    this.bindUI();
    this.bindInput();

    try {
      const bt = localStorage.getItem('frogger_best_time');
      if (bt) this.bestTime = parseFloat(bt);
    } catch (e) {}
    this.updateBestDisplay();

    this.lastTime = performance.now();
    requestAnimationFrame(t => this.loop(t));
  },

  resizeCanvas() {
    const wrap = document.getElementById('canvasWrap');
    const maxW = window.innerWidth - 16;
    const hudH = 50;
    const hintH = 34;
    const ctrlH = Math.min(300, window.innerHeight * 0.38);
    const padH = 30;
    const maxH = window.innerHeight - hudH - hintH - ctrlH - padH;
    const ratio = W / H;
    let w = maxW;
    let h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }
    if (w < 200) { w = 200; h = w / ratio; }
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
  },

  isFullscreen() {
    return !!(document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement ||
              document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    setTimeout(() => {
      this.updateFsBtn();
      this.resizeCanvas();
    }, 200);
  },
  updateFsBtn() {
    const btn = document.getElementById('fsBtn');
    if (btn) btn.textContent = this.isFullscreen() ? '退出全屏' : '全屏';
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('startBtn').addEventListener('click', () => {
      Sound.init(); Sound.resume(); Sound.click();
      this.hide('startOverlay');
      this.startGame();
    });
    $('pauseBtn').addEventListener('click', () => {
      Sound.click();
      if (this.state === 'playing') this.pause();
      else if (this.state === 'paused') this.resume();
    });
    $('restartBtn').addEventListener('click', () => {
      Sound.click();
      if (this.state === 'playing' || this.state === 'paused') {
        this.hide('pauseOverlay');
        this.startGame();
      }
    });
    $('resumeBtn').addEventListener('click', () => { Sound.click(); this.resume(); });
    $('pauseRestartBtn').addEventListener('click', () => { Sound.click(); this.hide('pauseOverlay'); this.startGame(); });
    $('nextBtn').addEventListener('click', () => {
      Sound.click();
      this.hide('winOverlay');
      this.level++;
      this.startLevel();
    });
    $('retryBtn').addEventListener('click', () => {
      Sound.click();
      this.hide('overOverlay');
      this.startGame();
    });
    $('fsBtn').addEventListener('click', () => {
      Sound.click();
      this.toggleFullscreen();
    });

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => {
        this.updateFsBtn();
        setTimeout(() => this.resizeCanvas(), 60);
        setTimeout(() => this.resizeCanvas(), 300);
      }));
  },

  bindInput() {
    window.addEventListener('keydown', e => {
      Sound.init(); Sound.resume();
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); this.keys.up = true; }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); this.keys.down = true; }
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); this.keys.left = true; }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); this.keys.right = true; }
      if (e.key === 'p' || e.key === 'P') {
        if (this.state === 'playing') this.pause();
        else if (this.state === 'paused') this.resume();
      }
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); this.toggleFullscreen(); }
      if (e.key === 'r' || e.key === 'R') {
        if (this.state === 'playing' || this.state === 'paused' || this.state === 'over' || this.state === 'win') {
          this.hide('pauseOverlay'); this.hide('overOverlay'); this.hide('winOverlay');
          this.startGame();
        }
      }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
    });

    const bindHop = (id, dx, dy) => {
      const el = document.getElementById(id);
      if (!el) return;
      const trigger = (e) => {
        e.preventDefault();
        Sound.init(); Sound.resume();
        el.classList.add('pressed');
        setTimeout(() => el.classList.remove('pressed'), 100);
        this.hopBy(dx, dy);
      };
      el.addEventListener('pointerdown', trigger);
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    };
    bindHop('upBtn', 0, -1);
    bindHop('downBtn', 0, 1);
    bindHop('leftBtn', -1, 0);
    bindHop('rightBtn', 1, 0);
  },

  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },

  hopBy(dx, dy) {
    if (this.state !== 'playing') return;
    if (this.frog.dead) return;
    if (this.time - this.lastHop < this.hopCooldown) return;
    this.lastHop = this.time;

    const f = this.frog;
    if (dx !== 0) {
      const nx = f.x + dx;
      if (nx < 0 || nx >= 16) return;
      f.x = nx;
      f.xFloat = nx;
      f.facing = dx;
    } else if (dy !== 0) {
      const ny = f.row + dy;
      if (ny < 0) return;
      if (ny >= ROWS_VIS) return;
      f.row = ny;
      f.y = ny;
      f.facing = 1;
      if (ROW_TYPES[ny] === 'home') {
        this.tryEnterHome(f.x);
        return;
      }
    }
    Sound.hop();
    if (ROW_TYPES[f.row] === 'water') {
      this.tryAttachLily();
    }
  },

  startGame() {
    this.level = 1;
    this.lives = 5;
    this.homesFilled = 0;
    this.totalTime = 0;
    this.updateHUD();
    this.startLevel();
  },

  startLevel() {
    this.homes = [];
    const homeTotalW = W - 40;
    const slotW = homeTotalW / 5;
    for (let i = 0; i < 5; i++) {
      this.homes.push({
        x: 20 + slotW * i + slotW / 2,
        w: slotW * 0.75,
        filled: false,
      });
    }
    this.homesFilled = 0;

    this.resetFrog();
    this.buildLanes();

    this.state = 'playing';
    this.totalTime = 0;
    this.dyingTimer = 0;
    this.particles = [];
    this.floats = [];
    this.updateHUD();
    this.updateBestDisplay();
    this.updateFsBtn();

    if (this.level === 1) showToast('🐸 踩荷叶过河！', 'green');
  },

  resetFrog() {
    this.frog = {
      x: 7,
      row: 9,
      y: 9,
      facing: 1,
      dead: false,
      ridingLane: -1,
      ridingObjIdx: -1,
      xFloat: 7,
    };
  },

  buildLanes() {
    this.lanes = [];

    const specs = [
      { speed: 1.0, dir: 1,  count: 4 },
      { speed: 1.2, dir: -1, count: 4 },
      { speed: 1.0, dir: 1,  count: 4 },
      { speed: 1.3, dir: -1, count: 4 },
      { speed: 1.0, dir: 1,  count: 4 },
      { speed: 1.3, dir: -1, count: 4 },
      { speed: 1.0, dir: 1,  count: 4 },
      { speed: 1.2, dir: -1, count: 4 },
    ];

    const LILY_D = ROW_H * 0.72;

    specs.forEach((spec, i) => {
      const row = 1 + i;
      const spacing = W / spec.count;
      const initialOffset = Math.random() * spacing;

      const lane = {
        row: row,
        dir: spec.dir,
        speed: spec.speed,
        count: spec.count,
        spacing: spacing,
        lilyDiameter: LILY_D,
        scroll: initialOffset,
      };
      this.lanes.push(lane);
    });
  },

  pause() { this.state = 'paused'; this.show('pauseOverlay'); },
  resume() { this.hide('pauseOverlay'); this.state = 'playing'; this.lastTime = performance.now(); },

  updateBestDisplay() {
    const el = document.getElementById('bestVal');
    if (this.bestTime === null) el.textContent = '--';
    else el.textContent = this.bestTime.toFixed(1) + 's';
  },

  updateHUD() {
    document.getElementById('timeVal').textContent = this.totalTime.toFixed(1) + 's';
    document.getElementById('livesVal').textContent = this.lives;
    document.getElementById('levelVal').textContent = this.level;
    document.getElementById('homesVal').textContent = this.homesFilled + '/5';
  },

  update(dt) {
    if (this.state !== 'playing') return;
    this.time += dt;
    this.totalTime += dt;

    if (this.frog.dead) {
      this.dyingTimer -= dt;
      if (this.dyingTimer <= 0) this.afterDeath();
      this.updateParticles(dt);
      return;
    }

    if (this.time - this.lastHop > 0.14) {
      let d = null;
      if (this.keys.up) d = { dx: 0, dy: -1 };
      else if (this.keys.down) d = { dx: 0, dy: 1 };
      else if (this.keys.left) d = { dx: -1, dy: 0 };
      else if (this.keys.right) d = { dx: 1, dy: 0 };
      if (d) {
        this.keys.left = this.keys.right = this.keys.up = this.keys.down = false;
        this.hopBy(d.dx, d.dy);
      }
    }

    this.updateLanes(dt);
    this.updateParticles(dt);
    this.updateFrogRiding(dt);

    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 30 * dt;
      f.life -= dt;
      if (f.life <= 0) this.floats.splice(i, 1);
    }

    this.updateHUD();
  },

  updateLanes(dt) {
    for (const lane of this.lanes) {
      lane.scroll += lane.speed * lane.dir * 60 * dt;
      lane.scroll = ((lane.scroll % lane.spacing) + lane.spacing) % lane.spacing;
    }
  },

  getLilyX(lane, i) {
    let x = i * lane.spacing + lane.scroll;
    x = ((x % W) + W) % W;
    return x;
  },

  tryAttachLily() {
    const f = this.frog;
    if (f.dead) return false;
    if (ROW_TYPES[f.row] !== 'water') return false;
    const lane = this.lanes.find(l => l.row === f.row);
    if (!lane) return false;
    const frogX = f.xFloat * ROW_H + ROW_H / 2;
    const halfD = lane.lilyDiameter / 2;
    for (let i = 0; i < lane.count; i++) {
      const cx = this.getLilyX(lane, i);
      if (Math.abs(frogX - cx) < halfD + 4) {
        f.ridingLane = lane.row;
        f.ridingObjIdx = i;
        return true;
      }
    }
    return false;
  },

  updateFrogRiding(dt) {
    const f = this.frog;
    if (f.dead) return;
    const rowType = ROW_TYPES[f.row];
    if (rowType !== 'water') {
      f.ridingLane = -1;
      f.ridingObjIdx = -1;
      f.xFloat = f.x;
      return;
    }
    const lane = this.lanes.find(l => l.row === f.row);
    if (!lane) return;
    const halfD = lane.lilyDiameter / 2;

    if (f.ridingLane === lane.row && f.ridingObjIdx >= 0 && f.ridingObjIdx < lane.count) {
      const cx = this.getLilyX(lane, f.ridingObjIdx);
      const frogX = f.xFloat * ROW_H + ROW_H / 2;
      if (Math.abs(frogX - cx) < halfD + 12) {
        f.xFloat = (cx - ROW_H / 2) / ROW_H;
        f.x = Math.round(f.xFloat);
        if (f.x < 0) { f.x = 0; f.xFloat = 0; }
        if (f.x > 15) { f.x = 15; f.xFloat = 15; }
        return;
      } else {
        f.ridingLane = -1;
        f.ridingObjIdx = -1;
      }
    }

    const frogX = f.xFloat * ROW_H + ROW_H / 2;
    for (let i = 0; i < lane.count; i++) {
      const cx = this.getLilyX(lane, i);
      if (Math.abs(frogX - cx) < halfD + 4) {
        f.ridingLane = lane.row;
        f.ridingObjIdx = i;
        f.xFloat = (cx - ROW_H / 2) / ROW_H;
        f.x = Math.round(f.xFloat);
        if (f.x < 0) { f.x = 0; f.xFloat = 0; }
        if (f.x > 15) { f.x = 15; f.xFloat = 15; }
        return;
      }
    }
    this.frogDie('落水');
  },

  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  },

  tryEnterHome(colX) {
    const f = this.frog;
    const frogX = f.x * ROW_H + ROW_H / 2;
    for (let i = 0; i < this.homes.length; i++) {
      const home = this.homes[i];
      if (home.filled) continue;
      if (Math.abs(frogX - home.x) < home.w / 2 + 8) {
        home.filled = true;
        this.homesFilled++;
        Sound.home();
        this.addFloat('🏠', home.x, ROW_H * 0.5, '#4ade80');
        this.resetFrog();

        if (this.homesFilled >= 5) {
          this.state = 'win';
          Sound.win();
          if (this.bestTime === null || this.totalTime < this.bestTime) {
            this.bestTime = this.totalTime;
            try { localStorage.setItem('frogger_best_time', String(this.bestTime)); } catch (e) {}
          }
          this.updateBestDisplay();
          document.getElementById('winSub').textContent =
            '用时 ' + this.totalTime.toFixed(1) + ' 秒 · 最佳 ' + this.bestTime.toFixed(1) + ' 秒';
          this.show('winOverlay');
        }
        this.updateHUD();
        return;
      }
    }
    this.frogDie('没到家');
  },

  frogDie(reason) {
    if (this.frog.dead) return;
    this.frog.dead = true;
    this.dyingTimer = 0.9;
    this.lives--;
    this.updateHUD();

    Sound.splash();

    const px = this.frog.xFloat * ROW_H + ROW_H / 2;
    const py = this.frog.row * ROW_H + ROW_H / 2;
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * 6.28;
      const sp = 60 + Math.random() * 120;
      this.particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 80,
        life: 0.6, maxLife: 0.6,
        r: 2 + Math.random() * 3,
        color: ['#7dd3fc', '#38bdf8', '#bae6fd', '#fff'][Math.floor(Math.random() * 4)],
      });
    }
    this.addFloat('💀', px, py, '#fb7185');
  },

  afterDeath() {
    if (this.lives <= 0) { this.gameOver(); return; }
    this.resetFrog();
  },

  gameOver() {
    this.state = 'over';
    Sound.lose();
    document.getElementById('overSub').textContent =
      '到家 ' + this.homesFilled + '/5 · 用时 ' + this.totalTime.toFixed(1) + ' 秒';
    this.show('overOverlay');
  },

  addFloat(text, x, y, color) {
    this.floats.push({ text, x, y, color, life: 1.0, maxLife: 1.0 });
  },

  render() {
    const ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (let r = 0; r < ROWS_VIS; r++) {
      const y = r * ROW_H;
      const type = ROW_TYPES[r];
      if (type === 'home') this.drawHomeRowBg(ctx, y);
      else if (type === 'water') this.drawWaterBg(ctx, y, r);
      else if (type === 'start') this.drawStartBg(ctx, y);
    }

    for (const lane of this.lanes) {
      const y = lane.row * ROW_H;
      for (let i = 0; i < lane.count; i++) {
        const cx = this.getLilyX(lane, i);
        this.drawLily(ctx, cx, y, lane.lilyDiameter);
      }
    }

    for (const home of this.homes) this.drawHome(ctx, home);

    for (const p of this.particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (this.frog && !this.frog.dead) {
      this.drawFrog(ctx, this.frog);
    } else if (this.frog && this.frog.dead) {
      const a = Math.abs(Math.sin(this.time * 20));
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#fb7185';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.frog.xFloat * ROW_H + ROW_H / 2, this.frog.row * ROW_H + ROW_H / 2, 22, 0, 6.283);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px "Courier New", monospace';
    for (const f of this.floats) {
      const a = Math.max(0, f.life / f.maxLife);
      ctx.globalAlpha = a;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  },

  drawHomeRowBg(ctx, y) {
    const g = ctx.createLinearGradient(0, y, 0, y + ROW_H);
    g.addColorStop(0, '#1e4620');
    g.addColorStop(1, '#0f2d0f');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, ROW_H);
    for (let i = 0; i < 4; i++) {
      const hx = 40 + i * 120;
      const hy = y + ROW_H * 0.75;
      ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
      ctx.beginPath();
      ctx.ellipse(hx, hy, 22, 8, 0, 0, 6.283);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, y + ROW_H - 4, W, 4);
  },

  drawWaterBg(ctx, y, row) {
    const g = ctx.createLinearGradient(0, y, 0, y + ROW_H);
    g.addColorStop(0, '#1a5c9e');
    g.addColorStop(0.5, '#0e4a8a');
    g.addColorStop(1, '#082f5c');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, ROW_H);

    ctx.strokeStyle = 'rgba(120, 200, 255, 0.18)';
    ctx.lineWidth = 1.5;
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let x = 0; x < W; x += 8) {
        const off = Math.sin((x * 0.08 + this.time * 1.2 + k * 2 + row) * 2) * 2.5;
        const yy = y + ROW_H * 0.35 + k * ROW_H * 0.35 + off;
        if (x === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(180, 230, 255, 0.08)';
    ctx.fillRect(0, y, W, 3);
  },

  drawStartBg(ctx, y) {
    const g = ctx.createLinearGradient(0, y, 0, y + ROW_H);
    g.addColorStop(0, '#3b7a3b');
    g.addColorStop(1, '#234a23');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, ROW_H);
    ctx.fillStyle = '#1a3d1a';
    ctx.fillRect(0, y, W, 3);
    ctx.strokeStyle = 'rgba(120, 220, 120, 0.5)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x += 6) {
      const h = 4 + ((x * 7) % 5);
      ctx.beginPath();
      ctx.moveTo(x, y + ROW_H - 2);
      ctx.lineTo(x + 1, y + ROW_H - 2 - h);
      ctx.stroke();
    }
  },

  drawLily(ctx, cx, rowY, diameter) {
    const cy = rowY + ROW_H / 2;
    const r = diameter / 2;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 3, r * 0.9, r * 0.45, 0, 0, 6.283);
    ctx.fill();

    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.15, cx, cy, r);
    g.addColorStop(0, '#86efac');
    g.addColorStop(0.5, '#22c55e');
    g.addColorStop(0.85, '#15803d');
    g.addColorStop(1, '#14532d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.283);
    ctx.fill();

    ctx.strokeStyle = 'rgba(20, 60, 20, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 0.5, 0, 6.283);
    ctx.stroke();

    ctx.fillStyle = 'rgba(10, 60, 40, 0.75)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * 0.95, cy + r * 0.3);
    ctx.lineTo(cx + r * 0.95, cy + r * 0.6);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(20, 80, 30, 0.55)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * 6.283 + 0.3;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r * 0.85, cy + Math.sin(a) * r * 0.85);
      ctx.stroke();
    }

    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.15, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.35, cy - r * 0.4, r * 0.35, r * 0.12, -0.5, 0, 6.283);
    ctx.fill();
  },

  drawHome(ctx, home) {
    const cx = home.x;
    const cy = ROW_H * 0.6;
    const w = home.w;
    const h = ROW_H * 0.7;

    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.ellipse(cx, cy, w / 2 + 6, h / 2 + 4, 0, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = 'rgba(34, 197, 94, 0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 1, w / 2 + 4, h / 2 + 2, 0, 0, 6.283);
    ctx.fill();

    if (home.filled) {
      ctx.save();
      ctx.translate(cx, cy);
      this.drawFrogShape(ctx, 22);
      ctx.restore();
      const t = (this.time * 3) % 2;
      if (t < 0.5) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(cx - 6, cy - 6, 2, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 6, cy - 4, 1.5, 0, 6.283);
        ctx.fill();
      }
    } else {
      const g = ctx.createRadialGradient(cx, cy - 2, 2, cx, cy, w / 2);
      g.addColorStop(0, '#000');
      g.addColorStop(0.7, '#0a1f0a');
      g.addColorStop(1, '#14532d');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, cy, w / 2 - 4, h / 2 - 4, 0, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, w / 2 + 2, h / 2 + 2, 0, 0, 6.283);
      ctx.stroke();
    }
  },

  drawFrog(ctx, f) {
    const cx = f.xFloat * ROW_H + ROW_H / 2;
    const cy = f.row * ROW_H + ROW_H / 2;
    ctx.save();
    ctx.translate(cx, cy);
    this.drawFrogShape(ctx, 30);
    ctx.restore();
  },

  drawFrogShape(ctx, size) {
    const r = size / 2;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.85, r * 0.9, r * 0.25, 0, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = '#166534';
    ctx.beginPath();
    ctx.ellipse(-r * 0.75, r * 0.55, r * 0.32, r * 0.24, -0.3, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.75, r * 0.55, r * 0.32, r * 0.24, 0.3, 0, 6.283);
    ctx.fill();

    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r * 1.05);
    g.addColorStop(0, '#a7f3a0');
    g.addColorStop(0.4, '#4ade80');
    g.addColorStop(0.8, '#22c55e');
    g.addColorStop(1, '#15803d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.9, 0, 0, 6.283);
    ctx.fill();

    const bg = ctx.createRadialGradient(0, r * 0.4, 1, 0, r * 0.3, r * 0.8);
    bg.addColorStop(0, 'rgba(255, 255, 200, 0.75)');
    bg.addColorStop(1, 'rgba(255, 255, 200, 0)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.35, r * 0.65, r * 0.5, 0, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.ellipse(-r * 0.85, r * 0.3, r * 0.16, r * 0.3, 0.25, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.85, r * 0.3, r * 0.16, r * 0.3, -0.25, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-r * 0.4, -r * 0.45, r * 0.32, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.4, -r * 0.45, r * 0.32, 0, 6.283);
    ctx.fill();
    ctx.strokeStyle = 'rgba(20, 60, 20, 0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(-r * 0.4, -r * 0.45, r * 0.32, 0, 6.283);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 0.4, -r * 0.45, r * 0.32, 0, 6.283);
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.45, r * 0.16, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.45, -r * 0.45, r * 0.16, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-r * 0.4, -r * 0.5, r * 0.06, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.4, -r * 0.5, r * 0.06, 0, 6.283);
    ctx.fill();

    ctx.strokeStyle = 'rgba(20, 60, 20, 0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, r * 0.05, r * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.4, -r * 0.6, r * 0.2, r * 0.1, -0.5, 0, 6.283);
    ctx.fill();
  },

  loop(t) {
    requestAnimationFrame(t2 => this.loop(t2));
    let dt = (t - this.lastTime) / 1000;
    this.lastTime = t;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    if (this.state === 'playing') this.update(dt);
    this.render();
  }
};

let toastTimer = null;
function showToast(text, type) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (type ? ' ' + type : ''); }, 1400);
}

window.addEventListener('DOMContentLoaded', () => Game.init());
</script>
