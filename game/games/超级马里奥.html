<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>超级马里奥 · 完整版</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#05060a;overflow:hidden;
  font-family:"Courier New",ui-monospace,monospace;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 50% 0%,rgba(60,120,220,.14),transparent 70%),
             radial-gradient(50% 40% at 100% 100%,rgba(255,180,60,.10),transparent 70%);
}
#game{
  display:block;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  image-rendering:pixelated;image-rendering:crisp-edges;
  background:#5c94fc;border-radius:3px;
  box-shadow:0 0 0 1px rgba(120,180,255,.18),0 26px 70px rgba(0,0,0,.8);
}
/* ============ 工具按钮 ============ */
.tool-btn{
  position:fixed;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(10,14,24,.62);color:#fff;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:900;font-family:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .12s,background .15s,opacity .15s;
}
.tool-btn:hover{background:rgba(40,60,100,.85)}
.tool-btn:active{transform:scale(.9)}
.tool-btn.dim{opacity:.42}
#btn-full {top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
#btn-sound{top:calc(10px + env(safe-area-inset-top));right:calc(64px + env(safe-area-inset-right))}
#btn-pause{top:calc(10px + env(safe-area-inset-top));right:calc(118px + env(safe-area-inset-right))}
/* ============ 触屏 ============ */
#touch{position:fixed;inset:0;pointer-events:none;z-index:600;display:none}
#joystick{position:fixed;left:22px;width:150px;height:150px;pointer-events:auto;touch-action:none}
#joystick-base{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.30);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 4px 18px rgba(0,0,0,.35);
}
#joystick-knob{
  position:absolute;width:62px;height:62px;left:50%;top:50%;
  margin-left:-31px;margin-top:-31px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.62),rgba(255,255,255,.28));
  border:2px solid rgba(255,255,255,.6);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  pointer-events:none;transition:transform .04s linear;
}
#dpad{position:fixed;left:22px;display:none;gap:14px;pointer-events:auto}
.dpad-btn{
  width:82px;height:82px;border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
  background:rgba(10,14,24,.45);color:#fff;font-size:30px;font-weight:800;
  display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.14);
  transition:transform .08s,background .08s;
}
.dpad-btn.pressed{transform:scale(.9);background:rgba(255,255,255,.5)}
.action-btn{
  position:fixed;width:78px;height:78px;border-radius:50%;
  border:2px solid rgba(255,255,255,.45);color:#fff;
  font-size:22px;font-weight:800;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;pointer-events:auto;
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.28);
  transition:transform .08s,filter .08s;
}
.action-btn.pressed{transform:scale(.9);filter:brightness(1.35)}
#btn-jump{background:radial-gradient(circle at 35% 28%,#7cc0ff,#1b5fc4 70%)}
#btn-fire{background:radial-gradient(circle at 35% 28%,#ff9d6b,#c23a12 70%)}
@media (pointer:coarse){#touch{display:block}}
/* ============ 弹窗 ============ */
.overlay{
  position:fixed;inset:0;z-index:8000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;padding:26px;text-align:center;overflow-y:auto;color:#fff;
  background:radial-gradient(circle at 50% 30%,rgba(24,36,64,.94),rgba(4,6,12,.98));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.overlay.show{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay h1{
  font-size:52px;letter-spacing:4px;font-style:italic;line-height:1.1;
  background:linear-gradient(180deg,#fff7c2,#ffd93b 45%,#e08a00);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #7a4a00) drop-shadow(0 8px 24px rgba(255,200,60,.35));
}
.overlay h2{font-size:25px;letter-spacing:3px;color:#fff}
.overlay p{font-size:13.5px;color:rgba(230,240,255,.72);line-height:1.8}
.menu-btn{
  padding:12px 34px;border-radius:26px;min-width:210px;
  border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(180deg,rgba(60,80,120,.85),rgba(28,40,64,.9));
  color:#eaf2ff;font-family:inherit;font-size:15px;letter-spacing:2px;font-weight:700;
  cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
}
.menu-btn:hover{filter:brightness(1.18)}
.menu-btn:active{transform:scale(.96)}
.menu-btn:focus-visible{outline:2px solid #ffd93b;outline-offset:3px}
.menu-btn.primary{
  background:linear-gradient(160deg,#ffe36e,#ffc107 45%,#e08a00);
  border-color:#ffe986;color:#3a2600;
  box-shadow:0 10px 26px rgba(255,200,60,.4),inset 0 1px 0 rgba(255,255,255,.5);
}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0}
.level-card{
  width:132px;height:132px;border-radius:16px;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(180deg,rgba(52,72,110,.6),rgba(20,30,50,.8));
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;transition:transform .12s,border-color .15s,box-shadow .15s;
  box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
}
.level-card:hover{border-color:rgba(255,217,59,.75);box-shadow:0 12px 30px rgba(255,200,60,.25)}
.level-card:active{transform:scale(.96)}
.level-card .emoji{font-size:44px;line-height:1}
.level-card .name{font-size:13px;letter-spacing:2px;color:#dfe9ff}
.level-card .tip{font-size:10px;color:rgba(220,235,255,.5);letter-spacing:1px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:min(90vw,360px);padding:9px 2px;font-size:13px;color:#dfe9ff;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.setting-row:last-of-type{border-bottom:none}
.setting-row input[type=range]{flex:1;max-width:170px;accent-color:#ffd93b;height:4px}
.segmented{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden}
.segmented button{
  padding:8px 16px;border:0;background:transparent;color:rgba(255,255,255,.7);
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.segmented button.active{background:linear-gradient(160deg,#ffe36e,#ffc107);color:#3a2600}
#rotate-tip{
  position:fixed;inset:0;background:#05070d;color:#fff;z-index:99999;
  display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
#rotate-tip .icon{font-size:80px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}45%,70%{transform:rotate(90deg)}90%,100%{transform:rotate(0)}}
@media (max-width:560px){
  .overlay h1{font-size:36px}
  .menu-btn{min-width:180px;padding:11px 22px;font-size:13.5px}
  .level-card{width:104px;height:104px}
  .level-card .emoji{font-size:34px}
}
@media (max-height:520px){
  .overlay{gap:8px;padding:14px}
  .overlay h1{font-size:30px}
  .menu-btn{padding:9px 18px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="game" width="960" height="512"></canvas>

<button id="btn-pause" class="tool-btn" title="暂停 (P)">⏸</button>
<button id="btn-sound" class="tool-btn" title="音效 (M)">♪</button>
<button id="btn-full"  class="tool-btn" title="全屏 (F)">⛶</button>

<div id="touch">
  <div id="joystick"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
  <div id="dpad">
    <div class="dpad-btn" data-key="ArrowLeft">◀</div>
    <div class="dpad-btn" data-key="ArrowRight">▶</div>
  </div>
  <div id="btn-fire" class="action-btn">B</div>
  <div id="btn-jump" class="action-btn">▲</div>
</div>

<div id="screen-main" class="overlay show">
  <h1>超级马里奥</h1>
  <h2>完 整 版</h2>
  <p>草原 · 地下 · 水下 —— 三个世界，等你通关</p>
  <button class="menu-btn primary" id="cmd-start">开 始 游 戏</button>
  <button class="menu-btn" id="cmd-levels">选 择 关 卡</button>
  <button class="menu-btn" id="cmd-settings">设 置</button>
  <p style="margin-top:16px">最高分 <b style="color:#ffd93b" id="ui-highscore">0</b></p>
</div>

<div id="screen-levels" class="overlay">
  <h2>选 择 关 卡</h2>
  <div class="level-grid" id="level-grid"></div>
  <button class="menu-btn" id="cmd-levels-back">返 回</button>
</div>

<div id="screen-settings" class="overlay">
  <h2>设 置</h2>
  <div class="setting-row">
    <span>操作模式</span>
    <div class="segmented" id="seg-control">
      <button data-mode="joystick">摇 杆</button>
      <button data-mode="buttons">方向键</button>
    </div>
  </div>
  <div class="setting-row"><span>音效音量</span><input type="range" id="set-volume" min="0" max="100" value="30"></div>
  <div class="setting-row"><span>按钮大小</span><input type="range" id="set-btnsize" min="60" max="120" value="78"></div>
  <div class="setting-row"><span>按钮透明度</span><input type="range" id="set-btnalpha" min="10" max="90" value="40"></div>
  <button class="menu-btn primary" id="cmd-settings-back">保 存 并 返 回</button>
</div>

<div id="screen-pause" class="overlay">
  <h2>暂 停</h2>
  <button class="menu-btn primary" id="cmd-resume">继 续 游 戏</button>
  <button class="menu-btn" id="cmd-restart">重 新 开 始</button>
  <button class="menu-btn" id="cmd-to-menu">返 回 主 菜 单</button>
</div>

<div id="screen-win" class="overlay">
  <h1>通 关 ！</h1>
  <p>关卡：<b id="ui-win-level"></b></p>
  <p>得分：<b id="ui-win-score">0</b> · 金币：<b id="ui-win-coins">0</b></p>
  <button class="menu-btn primary" id="cmd-next">下 一 关</button>
  <button class="menu-btn" id="cmd-win-menu">返 回 菜 单</button>
</div>

<div id="screen-over" class="overlay">
  <h1 style="background:linear-gradient(180deg,#ff9a9a,#ff5252 45%,#7a0000);-webkit-background-clip:text;background-clip:text;">游 戏 结 束</h1>
  <p>得分：<b id="ui-over-score">0</b> · 金币：<b id="ui-over-coins">0</b></p>
  <button class="menu-btn primary" id="cmd-over-retry">再 试 一 次</button>
  <button class="menu-btn" id="cmd-over-menu">返 回 菜 单</button>
</div>

<div id="rotate-tip">
  <div class="icon">📱</div>
  <p>请将手机旋转至横屏游玩</p>
  <button class="menu-btn" id="skip-rotate">竖屏继续</button>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   0. 基础
   ========================================================= */
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function $(id) { return document.getElementById(id); }

var CFG = {
  W: 960, H: 512, ZOOM: 1.6,
  TILE: 32, ROWS: 16,
  GRAVITY: 0.62, WATER_GRAVITY: 0.22,
  MAX_FALL: 16, WATER_MAX_FALL: 4,
  MOVE_ACCEL: 0.62, WATER_ACCEL: 0.32,
  MAX_SPEED: 3.9, MAX_SPEED_STAR: 5.2, MAX_SPEED_DASH: 5.6,
  FRICTION: 0.84, WATER_FRICTION: 0.94,
  JUMP_VEL: -13.2, WATER_JUMP: -6.5, DOUBLE_JUMP_VEL: -11,
  FIRE_COOLDOWN: 14, MAX_FIREBALLS: 3,
  STEP: 1000 / 60,
  DASH_FRAMES: 55,
  BOSS_FIRE_CD: 130,
  SAVE_KEY: 'mario_complete_v8'
};
CFG.LEVEL_H = CFG.ROWS * CFG.TILE;
CFG.VIEW_W = CFG.W / CFG.ZOOM;
CFG.VIEW_H = CFG.H / CFG.ZOOM;

/* =========================================================
   1. 存档
   ========================================================= */
var Save = {
  data: {
    highScore: 0, soundOn: true, volume: 0.30,
    btnSize: 78, btnAlpha: 0.4, controlMode: 'joystick'
  },
  load: function () {
    try {
      var raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save: function () {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  }
};

/* =========================================================
   2. 音效引擎（压缩 + 混响 + 主题音乐）
   ========================================================= */
var Sound = {
  ctx: null, master: null, bus: null, revIn: null, noiseBuf: null,
  musicGain: null,
  enabled: true, volume: 0.30, voices: 0, MAXV: 24,
  musicOn: false, musicTimer: 0, musicStep: 0, theme: 'grass',

  init: function () {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
      return this.ctx;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return null; }
      try { this.ctx = new AC({ latencyHint: 'interactive' }); }
      catch (e1) { this.ctx = new AC(); }

      var comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 5;
      comp.attack.value = 0.003; comp.release.value = 0.24;

      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? this.volume : 0;

      this.bus = this.ctx.createGain();
      this.bus.gain.value = 0.9;
      this.bus.connect(this.master);
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      this.revIn = this.ctx.createBiquadFilter();
      this.revIn.type = 'lowpass';
      this.revIn.frequency.value = 2600;
      var conv = this.ctx.createConvolver();
      conv.buffer = this.makeIR(1.0, 2.8);
      var vg = this.ctx.createGain();
      vg.gain.value = 0.35;
      this.revIn.connect(conv); conv.connect(vg); vg.connect(this.master);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.5;
      this.musicGain.connect(this.master);

      this.noiseBuf = this.makeNoise(1.2);
      return this.ctx;
    } catch (e) { this.ctx = null; return null; }
  },

  makeNoise: function (sec) {
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    var b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  makeIR: function (sec, decay) {
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    var b = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = b.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return b;
  },

  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },

  setVolume: function (v) {
    this.volume = clamp(v, 0, 1);
    if (this.master && this.ctx) {
      try {
        this.master.gain.setTargetAtTime(this.enabled ? this.volume : 0, this.ctx.currentTime, 0.03);
      } catch (e) {}
    }
  },
  setEnabled: function (v) {
    this.enabled = v;
    if (this.master && this.ctx) {
      try {
        this.master.gain.setTargetAtTime(v ? this.volume : 0, this.ctx.currentTime, 0.03);
      } catch (e) {}
    }
  },

  route: function (g, music, send) {
    g.connect(music ? this.musicGain : this.bus);
    if (send) {
      var s = this.ctx.createGain();
      s.gain.value = send;
      g.connect(s); s.connect(this.revIn);
    }
  },

  tone: function (o) {
    var c = this.init();
    if (!c || !this.enabled) return;
    if (this.voices >= this.MAXV) return;
    try {
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.12;
      var osc = c.createOscillator();
      osc.type = o.type || 'square';
      var f0 = Math.max(20, o.f0 || 400);
      var f1 = Math.max(20, o.f1 === undefined ? f0 : o.f1);
      osc.frequency.setValueAtTime(f0, t0);
      if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.9);

      var g = c.createGain();
      var peak = Math.max(0.0003, o.vol === undefined ? 0.2 : o.vol);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      var node = osc;
      if (o.filter) {
        var f = c.createBiquadFilter();
        f.type = o.filter.type || 'lowpass';
        f.frequency.setValueAtTime(Math.max(60, o.filter.f0 || 1200), t0);
        if (o.filter.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.filter.f1), t0 + dur);
        f.Q.value = o.filter.q || 0.9;
        node.connect(f); node = f;
      }
      node.connect(g);
      this.route(g, !!o.music, o.send || 0);

      var self = this;
      this.voices++;
      osc.onended = function () {
        self.voices = Math.max(0, self.voices - 1);
        try { g.disconnect(); } catch (e) {}
      };
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  },

  burst: function (o) {
    var c = this.init();
    if (!c || !this.enabled || !this.noiseBuf) return;
    if (this.voices >= this.MAXV) return;
    try {
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.12;
      var src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      var f = c.createBiquadFilter();
      f.type = o.type || 'lowpass';
      f.frequency.setValueAtTime(Math.max(60, o.f0 || 1800), t0);
      if (o.f1 !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t0 + dur);
      f.Q.value = o.q || 1;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0003, o.vol || 0.2), t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g);
      this.route(g, false, o.send || 0);
      var self = this;
      this.voices++;
      src.onended = function () {
        self.voices = Math.max(0, self.voices - 1);
        try { g.disconnect(); } catch (e) {}
      };
      src.start(t0, Math.random() * 0.2);
      src.stop(t0 + dur + 0.05);
    } catch (e) {}
  },

  /* ---------- 事件音 ---------- */
  jump: function () {
    this.tone({ f0: 480, f1: 900, dur: 0.13, type: 'square', vol: 0.16 });
    this.burst({ dur: 0.05, vol: 0.05, type: 'highpass', f0: 2200 });
  },
  doubleJump: function () {
    this.tone({ f0: 760, f1: 1300, dur: 0.12, type: 'square', vol: 0.16 });

   ========================================================= */
var Input = {
  keys: Object.create(null),
  joy: { x: 0, y: 0 },
  pointers: new Map(),

  init: function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
      self.keys[e.code] = true;
      Sound.init(); Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') Game.togglePause();
      if (e.code === 'KeyF') Game.toggleFullscreen();
      if (e.code === 'KeyM') Game.toggleSound();
      if (e.code === 'KeyR' && Game.state === 'playing') Game.startLevel(Game.currentLevel);
    });
    window.addEventListener('keyup', function (e) { self.keys[e.code] = false; });
    window.addEventListener('blur', function () { self.clear(); });

    this.initJoystick();
    this.bindHold($('btn-jump'), 'Space');
    this.bindHold($('btn-fire'), 'KeyX');

    document.querySelectorAll('#dpad .dpad-btn').forEach(function (btn) {
      self.bindHold(btn, btn.dataset.key);
    });

    window.addEventListener('pointerup', function (e) { self.releasePointer(e.pointerId); });
    window.addEventListener('pointercancel', function (e) { self.releasePointer(e.pointerId); });
  },

  releasePointer: function (id) {
    var rec = this.pointers.get(id);
    if (!rec) return;
    this.pointers.delete(id);
    this.keys[rec.key] = false;
    if (rec.el) rec.el.classList.remove('pressed');
  },

  bindHold: function (el, key) {
    if (!el) return;
    var self = this;
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (self.pointers.has(e.pointerId)) return;
      self.pointers.set(e.pointerId, { el: el, key: key });
      self.keys[key] = true;
      el.classList.add('pressed');
      Sound.init(); Sound.resume();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointerup', function (e) { self.releasePointer(e.pointerId); });
    el.addEventListener('pointercancel', function (e) { self.releasePointer(e.pointerId); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  },

  initJoystick: function () {
    var self = this;
    var base = $('joystick-base');
    var knob = $('joystick-knob');
    var MAX = 46;
    var pid = null, cx = 0, cy = 0;

    function start(e) {
      e.preventDefault();
      if (pid !== null) return;
      pid = e.pointerId;
      var r = base.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      move(e);
      Sound.init(); Sound.resume();
      try { base.setPointerCapture(pid); } catch (err) {}
    }
    function move(e) {
      if (e.pointerId !== pid) return;
      e.preventDefault();
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var d = Math.hypot(dx, dy);
      if (d > MAX) { dx = dx / d * MAX; dy = dy / d * MAX; }
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      self.joy.x = dx / MAX;
      self.joy.y = dy / MAX;
    }
    function end(e) {
      if (e.pointerId !== pid) return;
      pid = null;
      knob.style.transform = 'translate(0,0)';
      self.joy.x = 0; self.joy.y = 0;
    }
    base.addEventListener('pointerdown', start);
    base.addEventListener('pointermove', move);
    base.addEventListener('pointerup', end);
    base.addEventListener('pointercancel', end);
    base.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  },

  clear: function () {
    for (var k in this.keys) this.keys[k] = false;
    this.pointers.clear();
    this.joy.x = 0; this.joy.y = 0;
    var knob = $('joystick-knob');
    if (knob) knob.style.transform = 'translate(0,0)';
    document.querySelectorAll('.pressed').forEach(function (el) { el.classList.remove('pressed'); });
  },

  left: function () { return !!(this.keys['ArrowLeft'] || this.keys['KeyA'] || this.joy.x < -0.3); },
  right: function () { return !!(this.keys['ArrowRight'] || this.keys['KeyD'] || this.joy.x > 0.3); },
  up: function () { return !!(this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'] || this.joy.y < -0.5); },
  down: function () { return !!(this.keys['ArrowDown'] || this.keys['KeyS'] || this.joy.y > 0.5); },
  fire: function () { return !!(this.keys['KeyX'] || this.keys['ShiftLeft'] || this.keys['ShiftRight']); }
};

   4. 物理
   ========================================================= */
var Physics = {
  moveX: function (ent, solids) {
    ent.x += ent.vx;
    var hit = 0;
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (s.dead || s.type === 'hidden') continue;
      if (aabb(ent, s)) {
        if (ent.vx > 0) { ent.x = s.x - ent.w; hit = 1; }
        else if (ent.vx < 0) { ent.x = s.x + s.w; hit = -1; }
      }
    }
    return hit;
  },
  moveY: function (ent, solids) {
    ent.y += ent.vy;
    var hit = 0, solid = null;
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (s.dead || s.type === 'hidden') continue;
      if (aabb(ent, s)) {
        if (ent.vy > 0) { ent.y = s.y - ent.h; hit = 1; solid = s; }
        else if (ent.vy < 0) { ent.y = s.y + s.h; hit = -1; solid = s; }
      }
    }
    return { hit: hit, solid: solid };
  }
};
