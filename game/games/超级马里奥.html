/* =========================================================
   6. 玩家
   ========================================================= */
function Player(spawn) {
  this.x = spawn.x; this.y = spawn.y;
  this.w = 26; this.h = 30;
  this.vx = 0; this.vy = 0;
  this.onGround = false; this.facing = 1;
  this.jumpHeld = false;
  this.power = 0;
  this.invuln = 90; this.star = 0;
  this.animTimer = 0; this.fireCd = 0;
  this.dashFrames = 0;
  this.canDoubleJump = true;
  this.isDashing = false;
  this.standingOn = null;
  this.squash = 0;
  this.skid = 0;
  this.dustTimer = 0;
}
Player.prototype.maxSpeed = function () {
  if (this.star > 0) return CFG.MAX_SPEED_STAR;
  if (this.isDashing) return CFG.MAX_SPEED_DASH;
  return CFG.MAX_SPEED;
};
Player.prototype.setSize = function (w, h) {
  var b = this.y + this.h;
  this.w = w; this.h = h; this.y = b - h;
  for (var i = 0; i < 14; i++) {
    var stuck = false;
    for (var j = 0; j < Game.solids.length; j++) {
      var s = Game.solids[j];
      if (s.type === 'hidden' || s.dead) continue;
      if (aabb(this, s)) { stuck = true; break; }
    }
    if (!stuck) break;
    this.y -= 3;
  }
};
Player.prototype.grow = function () {
  if (this.power > 0) return;
  this.setSize(30, 44);
  this.power = 1;
  this.squash = -0.35;
  Sound.powerup();
};
Player.prototype.setFire = function () {
  if (this.power === 0) this.grow();
  this.power = 2;
  Sound.powerup();
};
Player.prototype.shrink = function () {
  if (this.power === 0) return false;
  this.setSize(26, 30);
  this.power = 0;
  this.invuln = 130;
  this.squash = 0.3;
  Sound.powerdown();
  return true;
};

/* =========================================================
   7. 主控
   ========================================================= */
var Game = {
  canvas: null, ctx: null,
  state: 'menu',
  currentLevel: 0,
  tick: 0, score: 0, coinCount: 0, lives: 3, checkpoint: 0,
  solids: [], coins: [], enemies: [], items: [], fireballs: [],
  springs: [], particles: [], floats: [], coinRains: [], boss: null, flag: null,
  player: null,
  camera: { x: 0, y: 0 },
  level: null,
  levelW: 300 * 32,
  isWater: false,
  spawnPoint: { x: 0, y: 0 },
  shake: 0,
  hitStop: 0,
  flash: 0,
  bgCache: null,
  banner: 0,
  bannerText: '',
  lastTime: 0, accumulator: 0,

  init: function () {
    this.canvas = $('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.enabled = Save.data.soundOn;
    Sound.volume = Save.data.volume;
    Input.init();
    UI.init();
    this.bindUI();
    this.applyControlMode(Save.data.controlMode);
    this.resize();
    var self = this;
    window.addEventListener('resize', function () { self.resize(); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { self.resize(); }, 250); });
    setTimeout(function () { self.positionTouch(); }, 300);
    requestAnimationFrame(function (t) { self.loop(t); });
  },

  bindUI: function () {
    var self = this;
    $('btn-full').addEventListener('click', function (e) { e.preventDefault(); self.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', function (e) { e.preventDefault(); self.toggleSound(); });
    $('btn-pause').addEventListener('click', function (e) { e.preventDefault(); self.togglePause(); });
    $('skip-rotate').addEventListener('click', function () {
      document.body.dataset.skipRotate = '1';
      self.checkOrientation();
    });
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(function (ev) {
        document.addEventListener(ev, function () {
          self.updateFsIcon();
          setTimeout(function () { self.resize(); }, 150);
        });
      });

    $('cmd-resume').addEventListener('click', function () { self.togglePause(); });
    $('cmd-restart').addEventListener('click', function () { UI.hide('screen-pause'); self.startLevel(self.currentLevel); });
    $('cmd-to-menu').addEventListener('click', function () { UI.hide('screen-pause'); self.toMenu(); });
    $('cmd-next').addEventListener('click', function () {
      UI.hide('screen-win');
      var next = self.currentLevel + 1;
      if (next >= 3) { self.toMenu(); return; }
      self.startLevel(next);
    });
    $('cmd-win-menu').addEventListener('click', function () { UI.hide('screen-win'); self.toMenu(); });
    $('cmd-over-retry').addEventListener('click', function () { UI.hide('screen-over'); self.startLevel(self.currentLevel); });
    $('cmd-over-menu').addEventListener('click', function () { UI.hide('screen-over'); self.toMenu(); });

    this.updateFsIcon();
  },

  applyControlMode: function (mode) {
    var joy = $('joystick'), dpad = $('dpad');
    if (mode === 'buttons') { joy.style.display = 'none'; dpad.style.display = 'flex'; }
    else { joy.style.display = 'block'; dpad.style.display = 'none'; }
  },

  resize: function () {
    var ratio = CFG.W / CFG.H;
    var ww = window.innerWidth, wh = window.innerHeight;
    var w, h;
    if (ww / wh > ratio) { h = wh; w = h * ratio; }
    else { w = ww; h = w / ratio; }
    this.canvas.style.width = Math.round(w) + 'px';
    this.canvas.style.height = Math.round(h) + 'px';
    this.checkOrientation();
    var self = this;
    setTimeout(function () { self.positionTouch(); }, 20);
  },

  positionTouch: function () {
    var touch = $('touch');
    if (!touch) return;
    var rect = this.canvas.getBoundingClientRect();
    var gapBelow = Math.max(0, window.innerHeight - rect.bottom);
    var size = Save.data.btnSize;
    var offset = Math.round(size * 0.9);
    var baseBottom = gapBelow - offset - size - 10;
    if (baseBottom < 8) baseBottom = 8;

    var joy = $('joystick'), dpad = $('dpad');
    if (joy) joy.style.bottom = baseBottom + 'px';
    if (dpad) dpad.style.bottom = baseBottom + 'px';

    var jump = $('btn-jump');
    jump.style.right = '24px';
    jump.style.bottom = baseBottom + 'px';
    var fire = $('btn-fire');
    fire.style.right = (24 + offset) + 'px';
    fire.style.bottom = (baseBottom + offset) + 'px';
  },

  checkOrientation: function () {
    var tip = $('rotate-tip');
    var isTouch = matchMedia('(pointer: coarse)').matches;
    var portrait = window.innerHeight > window.innerWidth;
    var skip = document.body.dataset.skipRotate === '1';
    tip.style.display = (isTouch && portrait && !skip) ? 'flex' : 'none';
  },

  isFullscreen: function () {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  toggleFullscreen: function () {
    var el = document.documentElement;
    if (!this.isFullscreen()) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen ||
                el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        try {
          var p = req.call(el);
          if (p && p.catch) p.catch(function () {});
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function () {});
          }
        } catch (e) {}
      }
    } else {
      var ex = document.exitFullscreen || document.webkitExitFullscreen ||
               document.mozCancelFullScreen || document.msExitFullscreen;
      if (ex) { try { var p2 = ex.call(document); if (p2 && p2.catch) p2.catch(function () {}); } catch (e) {} }
    }
    var self = this;
    setTimeout(function () { self.updateFsIcon(); self.resize(); }, 200);
  },
  updateFsIcon: function () {
    var btn = $('btn-full');
    btn.textContent = this.isFullscreen() ? '✕' : '⛶';
    btn.classList.toggle('dim', this.isFullscreen());
  },
  toggleSound: function () {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.setEnabled(Save.data.soundOn);
    Save.save();
    $('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    $('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (Sound.enabled) { Sound.init(); Sound.resume(); }
  },

  toMenu: function () {
    this.state = 'menu';
    Sound.musicStop();
    UI.hideAll();
    UI.show('screen-main');
    UI.refreshMenu();
  },

  startLevel: function (idx) {
    this.currentLevel = idx;
    this.level = LevelBuilder.build(idx);
    var i;
    this.solids = [];
    for (i = 0; i < this.level.solids.length; i++) this.solids.push(Object.assign({}, this.level.solids[i]));
    this.coins = [];
    for (i = 0; i < this.level.coins.length; i++) this.coins.push(Object.assign({}, this.level.coins[i]));
    this.enemies = [];
    for (i = 0; i < this.level.enemies.length; i++) this.enemies.push(Object.assign({}, this.level.enemies[i]));
    this.springs = [];
    for (i = 0; i < this.level.springs.length; i++) this.springs.push(Object.assign({}, this.level.springs[i]));
    this.items = []; this.fireballs = []; this.particles = [];
    this.floats = []; this.coinRains = [];
    this.flag = this.level.flag;
    this.levelW = this.level.width;
    this.isWater = this.level.water;
    this.shake = 0; this.hitStop = 0; this.flash = 0;
    this.banner = 1.8;
    this.bannerText = this.level.name;
    this.bgCache = null;

    this.boss = null;
    if (this.level.boss) {
      var T = CFG.TILE;
      this.boss = {
        x: this.level.boss.c * T, y: this.level.boss.r * T,
        w: 56, h: 56, vx: 0, vy: 0,
        hp: 3, alive: true, deadTimer: 0,
        onGround: false, invuln: 0, facing: -1,
        jumpCd: 60, fireCd: CFG.BOSS_FIRE_CD, t: 0, squash: 0
      };
    }

    for (i = 0; i < this.level.platforms.length; i++) {
      var p = Object.assign({}, this.level.platforms[i]);
      p.path = Object.assign({}, this.level.platforms[i].path);
      this.solids.push(p);
    }

    this.score = 0; this.coinCount = 0;
    this.lives = 3; this.checkpoint = 0;
    this.spawnPoint = { x: this.level.spawnPoint.x, y: this.level.spawnPoint.y };
    this.player = new Player(this.spawnPoint);
    this.player.invuln = 60;

    this.camera.x = clamp(this.player.x - CFG.VIEW_W / 2, 0, Math.max(0, this.levelW - CFG.VIEW_W));
    this.camera.y = clamp(this.player.y - CFG.VIEW_H * 0.62, 0, CFG.LEVEL_H - CFG.VIEW_H);

    this.state = 'playing';
    Sound.musicStart(this.level.theme);
    UI.hideAll();
    var self = this;
    setTimeout(function () { self.positionTouch(); }, 50);
  },

  togglePause: function () {
    if (this.state === 'playing') {
      this.state = 'paused';
      Sound.musicStop();
      UI.show('screen-pause');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      Sound.musicStart(this.level ? this.level.theme : 'grass');
      UI.hide('screen-pause');
      this.lastTime = 0;
    }
  },

  loop: function (now) {
    var self = this;
    requestAnimationFrame(function (t) { self.loop(t); });
    if (!this.lastTime) this.lastTime = now;
    var delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator += delta;
    var guard = 0;
    while (this.accumulator >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator = 0;
    this.render();
    Sound.musicUpdate(delta);
  },

  update: function () {
    this.tick++;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.8);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.05);
    if (this.banner > 0) this.banner -= 1 / 60;

    if (this.state === 'playing') {
      if (this.hitStop > 0) { this.hitStop--; this.updateParticles(); return; }
      this.updatePlatforms();
      this.updatePlayer();
      if (this.state !== 'playing') return;
      this.updateEnemies();
      this.updateBoss();
      this.updateCoins();
      this.updateItems();
      this.updateFireballs();
      this.updateSprings();
      this.updateCoinRains();
      this.updateCamera();
      this.updateSolids();
      this.checkCheckpoints();
      this.checkFlag();
    }
    this.updateParticles();
  },

  updatePlatforms: function () {
    for (var i = 0; i < this.solids.length; i++) {
      var s = this.solids[i];
      if (s.type !== 'platform') continue;
      s.t += s.speed;
      var k = 0.5 - 0.5 * Math.cos(s.t * Math.PI * 2);
      s.prevX = s.x; s.prevY = s.y;
      s.x = s.path.x0 + (s.path.x1 - s.path.x0) * k;
      s.y = s.path.y0 + (s.path.y1 - s.path.y0) * k;
    }
  },

  updateSolids: function () {
    var need = false, i;
    for (i = 0; i < this.solids.length; i++) if (this.solids[i].dead) { need = true; break; }
    if (need) {
      var arr = [];
      for (i = 0; i < this.solids.length; i++) {
        if (!this.solids[i].dead || this.solids[i].type === 'platform') arr.push(this.solids[i]);
      }
      this.solids = arr;
    }
    for (i = 0; i < this.solids.length; i++) {
      if (this.solids[i].bump > 0) this.solids[i].bump = Math.max(0, this.solids[i].bump - 0.11);
    }
  },

  updateCamera: function () {
    var p = this.player;
    var maxX = Math.max(0, this.levelW - CFG.VIEW_W);
    var tx = clamp(p.x + p.w / 2 - CFG.VIEW_W / 2, 0, maxX);
    var ty = clamp(p.y + p.h / 2 - CFG.VIEW_H * 0.62, 0, CFG.LEVEL_H - CFG.VIEW_H);
    this.camera.x += (tx - this.camera.x) * 0.16;
    this.camera.y += (ty - this.camera.y) * 0.12;
    if (Math.abs(tx - this.camera.x) < 0.3) this.camera.x = tx;
    if (Math.abs(ty - this.camera.y) < 0.3) this.camera.y = ty;
  },

  checkCheckpoints: function () {
    var cp = this.level.checkpoints;
    for (var i = 0; i < cp.length; i++) {
      if (this.checkpoint <= i && this.player.x > cp[i].x) {
        this.checkpoint = i + 1;
        this.spawnPoint = { x: cp[i].sp.x, y: cp[i].sp.y };
        this.addFloat(this.player.x, this.player.y - 30, 'CHECKPOINT', '#8ef5ff');
        Sound.checkpoint();
        for (var k = 0; k < 16; k++) this.sparkle(cp[i].x, cp[i].sp.y, '#8ef5ff', 1);
      }
    }
  },

  checkFlag: function () {
    if (!this.flag || (this.boss && this.boss.alive)) return;
    if (this.player.x + this.player.w / 2 > this.flag.x) this.onWin();
  },

  onWin: function () {
    this.state = 'win';
    this.score += 1000 + this.lives * 500;
    this.flash = 0.8;
    Sound.flag();
    Sound.musicStop();
    var self = this;
    setTimeout(function () { Sound.win(); }, 400);
    for (var i = 0; i < 40; i++) {
      this.sparkle(this.player.x + rand(-60, 60), this.player.y - rand(0, 120), i % 2 ? '#ffd93b' : '#8ef5ff', 1);
    }
    Save.data.highScore = Math.max(Save.data.highScore, this.score);
    Save.save();
    UI.setWin(this.currentLevel, this.score, this.coinCount);
    UI.show('screen-win');
  },

  updatePlayer: function () {
    var p = this.player;
    var inWater = this.isWater;
    var left = Input.left(), right = Input.right();
    var jump = Input.up();
    var fire = Input.fire();

    var accel = inWater ? CFG.WATER_ACCEL : CFG.MOVE_ACCEL;
    var friction = inWater ? CFG.WATER_FRICTION : CFG.FRICTION;
    var gravity = inWater ? CFG.WATER_GRAVITY : CFG.GRAVITY;
    var maxFall = inWater ? CFG.WATER_MAX_FALL : CFG.MAX_FALL;

    if ((left || right) && p.onGround) p.dashFrames = Math.min(p.dashFrames + 1, CFG.DASH_FRAMES);
    else if (!left && !right) p.dashFrames = Math.max(0, p.dashFrames - 2);
    var wasDash = p.isDashing;
    p.isDashing = p.dashFrames >= CFG.DASH_FRAMES;
    if (p.isDashing && !wasDash) Sound.dash();

    if (left && !right) { p.vx -= accel; p.facing = -1; }
    else if (right && !left) { p.vx += accel; p.facing = 1; }
    else { p.vx *= friction; if (Math.abs(p.vx) < 0.08) p.vx = 0; }

    /* 刹车/转身擦地 */
    if (p.onGround && Math.abs(p.vx) > 2.2 &&
        ((p.vx > 0 && left) || (p.vx < 0 && right))) {
      p.skid = 1;
      p.dustTimer--;
      if (p.dustTimer <= 0) {
        p.dustTimer = 3;
        this.dust(p.x + p.w / 2, p.y + p.h, '#d9c9a8', 1);
      }
    } else p.skid = Math.max(0, p.skid - 0.12);

    /* 跑步扬尘 */
    if (p.onGround && Math.abs(p.vx) > 1.6) {
      p.dustTimer--;
      if (p.dustTimer <= 0) {
        p.dustTimer = 7;
        this.dust(p.x + p.w / 2 - p.facing * 8, p.y + p.h - 2, 'rgba(220,205,175,0.75)', 1);
      }
    }

    p.vx = clamp(p.vx, -p.maxSpeed(), p.maxSpeed());

    if (inWater) {
      if (jump) {
        p.vy += CFG.WATER_JUMP * 0.16;
        if (p.vy < -4) p.vy = -4;
        if (Math.random() < 0.15) this.sparkle(p.x + p.w / 2, p.y + p.h, 'rgba(150,220,255,0.8)', 1);
      }
    } else {
      if (jump && p.onGround && !p.jumpHeld) {
        p.vy = CFG.JUMP_VEL; p.onGround = false; p.jumpHeld = true;
        p.canDoubleJump = true;
        p.squash = 0.35;
        Sound.jump();
        this.dust(p.x + p.w / 2, p.y + p.h, 'rgba(220,205,175,0.8)', 4);
      } else if (jump && !p.onGround && p.canDoubleJump && !p.jumpHeld) {
        p.vy = CFG.DOUBLE_JUMP_VEL; p.canDoubleJump = false; p.jumpHeld = true;
        p.squash = 0.4;
        Sound.doubleJump();
        this.sparkle(p.x + p.w / 2, p.y + p.h, '#8ef5ff', 10);
      }
      if (!jump) p.jumpHeld = false;
      if (!jump && p.vy < -4.5) p.vy = -4.5;
    }

    p.vy += gravity;
    if (p.vy > maxFall) p.vy = maxFall;

    if (p.standingOn && p.standingOn.type === 'platform') {
      p.x += p.standingOn.x - p.standingOn.prevX;
      p.y += p.standingOn.y - p.standingOn.prevY;
    }

    if (Physics.moveX(p, this.solids) !== 0) p.vx = 0;

    var wasOnGround = p.onGround;
    p.onGround = false;
    p.standingOn = null;
    var r = Physics.moveY(p, this.solids);
    if (r.hit === 1) {
      p.onGround = true; p.vy = 0; p.canDoubleJump = true;
      if (r.solid) p.standingOn = r.solid;
      if (!wasOnGround) {
        p.squash = -0.3;
        this.dust(p.x + p.w / 2, p.y + p.h, 'rgba(220,205,175,0.7)', 3);
      }
    } else if (r.hit === -1) {
      p.vy = 0;
      if (r.solid) this.hitBlock(r.solid);
    }

    /* 挤压动画回弹 */
    if (p.squash > 0) p.squash = Math.max(0, p.squash - 0.05);
    else if (p.squash < 0) p.squash = Math.min(0, p.squash + 0.05);

    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > this.levelW) { p.x = this.levelW - p.w; p.vx = 0; }
    if (p.y > CFG.LEVEL_H + 60) { this.hurtPlayer(true); return; }

    if (p.onGround && Math.abs(p.vx) > 0.4) p.animTimer += 0.28;
    else if (p.onGround) p.animTimer = 0;

    if (p.invuln > 0) p.invuln--;
    if (p.star > 0) p.star--;
    if (p.fireCd > 0) p.fireCd--;

    if (fire) this.shootFireball();
  },

  hitBlock: function (s) {
    if (s.type === 'hidden') {
      s.type = 'question'; s.used = true; s.bump = 1;
      this.spawnItem(s.x + CFG.TILE / 2, s.y);
      Sound.bump();
      return;
    }
    if (s.type === 'question') {
      if (s.used) return;
      s.used = true; s.bump = 1;
      if (s.rain) this.spawnCoinRain(s.x + CFG.TILE / 2, s.y);
      else this.spawnItem(s.x + CFG.TILE / 2, s.y);
      Sound.bump();
    } else if (s.type === 'brick') {
      if (this.player.power > 0) {
        s.dead = true;
        this.score += 50;
        Sound.brick();
        this.shake = Math.max(this.shake, 4);
        for (var i = 0; i < 12; i++) {
          this.particles.push({
            x: s.x + CFG.TILE / 2, y: s.y + CFG.TILE / 2,
            vx: rand(-4.5, 4.5), vy: rand(-9.5, -2), life: 60,
            color: i % 2 ? '#c1531b' : '#8d3a10', size: 7
          });
        }
        this.addFloat(s.x + CFG.TILE / 2, s.y - 6, '+50');
      } else { s.bump = 1; Sound.bump(); }
    } else { s.bump = 1; Sound.bump(); }
  },

  spawnItem: function (cx, cy) {
    var r = Math.random();
    var type;
    if (r < 0.04) type = '1up';
    else if (r < 0.14) type = 'star';
    else if (this.player.power === 0) type = 'mushroom';
    else if (this.player.power === 1) type = 'flower';
    else {
      this.coinCount++;
      this.score += 200;
      this.addFloat(cx, cy - 14, '+200');
      Sound.coin();
      return;
    }
    var w = 28, h = 28;
    this.items.push({
      type: type, x: cx - w / 2, y: cy, w: w, h: h,
      vx: 0, vy: 0, rise: h + 6, onGround: false, t: 0
    });
  },

  spawnCoinRain: function (cx, cy) {
    for (var i = 0; i < 18; i++) {
      this.coinRains.push({
        x: cx + rand(-40, 40), y: cy - 10,
        vx: rand(-3, 3), vy: rand(-10, -6), life: 90, value: 200
      });
    }
    this.addFloat(cx, cy - 40, '★ 金币雨 ★', '#ffd93b');
    Sound.oneUp();
    this.shake = Math.max(this.shake, 5);
  },

  updateCoinRains: function () {
    for (var i = this.coinRains.length - 1; i >= 0; i--) {
      var c = this.coinRains[i];
      c.vy += 0.5; c.x += c.vx; c.y += c.vy; c.life--;
      if (c.life <= 0 || c.y > CFG.LEVEL_H + 60) {
        this.coinCount++; this.score += c.value;
        this.addFloat(c.x, c.y - 10, '+' + c.value);
        Sound.coin();
        this.coinRains.splice(i, 1);
      }
    }
  },

  updateItems: function () {
    for (var i = this.items.length - 1; i >= 0; i--) {
      var it = this.items[i];
      it.t++;
      if (it.rise > 0) { it.y -= 0.9; it.rise -= 0.9; continue; }

      if (it.type === 'mushroom' || it.type === '1up') {
        if (it.vx === 0) it.vx = 1.6;
        it.vy += CFG.GRAVITY;
        if (it.vy > CFG.MAX_FALL) it.vy = CFG.MAX_FALL;
        if (Physics.moveX(it, this.solids) !== 0) it.vx = -it.vx;
        var r1 = Physics.moveY(it, this.solids);
        if (r1.hit === 1) { it.vy = 0; it.onGround = true; }
      } else if (it.type === 'star') {
        if (it.vx === 0) it.vx = 1.9;
        it.vy += CFG.GRAVITY;
        if (it.vy > CFG.MAX_FALL) it.vy = CFG.MAX_FALL;
        if (Physics.moveX(it, this.solids) !== 0) it.vx = -it.vx;
        var r2 = Physics.moveY(it, this.solids);
        if (r2.hit === 1) it.vy = -8.5;
      }

      if (it.y > CFG.LEVEL_H + 120) { this.items.splice(i, 1); continue; }
      if (aabb(this.player, it)) { this.applyItem(it); this.items.splice(i, 1); }
    }
  },

  applyItem: function (it) {
    var p = this.player;
    var cx = it.x + it.w / 2, cy = it.y;
    switch (it.type) {
      case 'mushroom':
        if (p.power === 0) p.grow();
        this.score += 1000;
        this.addFloat(cx, cy - 10, '+1000');
        this.sparkle(cx, cy, '#fff59d', 14);
        break;
      case 'flower':
        p.setFire();
        this.score += 1000;
        this.addFloat(cx, cy - 10, '+1000');
        this.sparkle(cx, cy, '#ff7043', 16);
        break;
      case 'star':
        p.star = 600;
        this.score += 1000;
        this.addFloat(cx, cy - 10, '★ 无敌');
        this.sparkle(cx, cy, '#ffeb3b', 20);
        Sound.oneUp();
        break;
      case '1up':
        this.lives++;
        this.addFloat(cx, cy - 10, '1UP');
        this.sparkle(cx, cy, '#66bb6a', 16);
        Sound.oneUp();
        break;
    }
  },

  shootFireball: function () {
    var p = this.player;
    if (p.power !== 2 || p.fireCd > 0) return;
    if (this.fireballs.length >= CFG.MAX_FIREBALLS) return;
    p.fireCd = CFG.FIRE_COOLDOWN;
    var fx = p.facing > 0 ? p.x + p.w - 2 : p.x - 12;
    this.fireballs.push({
      x: fx, y: p.y + p.h * 0.35, w: 14, h: 14,
      vx: p.facing * 7, vy: 1.5, life: 210, t: 0
    });
    Sound.fireball();
  },

  updateFireballs: function () {
    for (var i = this.fireballs.length - 1; i >= 0; i--) {
      var f = this.fireballs[i];
      f.t++; f.life--;
      f.vy += 0.45;
      if (f.vy > 11) f.vy = 11;
      f.x += f.vx;

      var wall = false;
      for (var k = 0; k < this.solids.length; k++) {
        var s = this.solids[k];
        if (s.type === 'hidden' || s.dead) continue;
        if (aabb(f, s)) { wall = true; break; }
      }
      if (wall || f.x < 0 || f.x > this.levelW) {
        this.sparkle(f.x + f.w / 2, f.y + f.h / 2, '#ffb74d', 8);
        this.fireballs.splice(i, 1);
        continue;
      }

      f.y += f.vy;
      for (var m = 0; m < this.solids.length; m++) {
        var s2 = this.solids[m];
        if (s2.type === 'hidden' || s2.dead) continue;
        if (aabb(f, s2)) {
          if (f.vy > 0) { f.y = s2.y - f.h; f.vy = -6.5; }
          else { f.y = s2.y + s2.h; f.vy = 2; }
        }
      }

      if (f.hostile) {
        if (aabb(f, this.player) && this.player.invuln === 0) {
          if (this.player.power > 0) this.player.shrink();
          else this.hurtPlayer();
          this.fireballs.splice(i, 1);
          continue;
        }
      } else {
        for (var n = 0; n < this.enemies.length; n++) {
          var e = this.enemies[n];
          if (e.alive && aabb(f, e)) this.killEnemy(e, 'fire');
        }
        if (this.boss && this.boss.alive && aabb(f, this.boss)) this.hitBoss();
      }

      if (f.life <= 0 || f.y > CFG.LEVEL_H + 60) this.fireballs.splice(i, 1);
    }
  },

  updateEnemies: function () {
    var p = this.player;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.alive) { e.deadTimer++; if (e.squash > 0) e.squash -= 0.05; continue; }
      if (e.x - this.camera.x > CFG.VIEW_W + 320 || e.x - this.camera.x < -420) continue;
      e.t += 1 / 60;

      if (e.shell && e.vx === 0) {
        e.shellTimer--;
        if (e.shellTimer <= 0) { e.shell = false; e.h = 34; e.vx = -1.0; e.y -= 12; }
      }

      if (e.kind === 'flyer') {
        e.flyPhase += 0.08;
        e.y = e.baseY + Math.sin(e.flyPhase) * 26;
        e.x += e.vx;
        for (var s = 0; s < this.solids.length; s++) {
          var so = this.solids[s];
          if (so.type === 'hidden' || so.dead) continue;
          if (aabb(e, so)) { e.x -= e.vx; e.vx = -e.vx; break; }
        }
      } else {
        e.vy += CFG.GRAVITY;
        if (e.vy > CFG.MAX_FALL) e.vy = CFG.MAX_FALL;
        if (e.kind === 'jumper' && e.onGround) {
          e.jumpCd--;
          if (e.jumpCd <= 0) { e.vy = -9.5; e.jumpCd = 70 + Math.floor(Math.random() * 40); }
        }
        if (Physics.moveX(e, this.solids) !== 0) e.vx = -e.vx;
        var r = Physics.moveY(e, this.solids);
        if (r.hit === 1) { e.vy = 0; e.onGround = true; }
        else e.onGround = false;
      }

      if (e.y > CFG.LEVEL_H + 120) { e.alive = false; e.deadTimer = 999; continue; }

      if (e.shell && e.vx !== 0) {
        for (var j = 0; j < this.enemies.length; j++) {
          var other = this.enemies[j];
          if (other !== e && other.alive && aabb(e, other)) this.killEnemy(other, 'shell');
        }
      }

      if (this.state !== 'playing' || !aabb(p, e)) continue;
      if (p.star > 0) { this.killEnemy(e, 'star'); continue; }

      if (e.shell && e.vx === 0) {
        e.vx = (p.x + p.w / 2 < e.x + e.w / 2) ? 5 : -5;
        e.shellTimer = 999;
        Sound.shellKick();
        this.addFloat(e.x + e.w / 2, e.y - 6, 'KICK!');
        this.shake = Math.max(this.shake, 3);
        continue;
      }

      if (e.shell && e.vx !== 0) {
        if (p.invuln > 0) continue;
        if (p.power > 0) p.shrink();
        else { this.hurtPlayer(); return; }
        continue;
      }

      if (p.invuln > 0) continue;

      var fromTop = p.vy > 1 && (p.y + p.h - e.y) < 28;
      if (fromTop) {
        if (e.kind === 'koopa' && !e.shell) {
          e.shell = true; e.vx = 0; e.h = 22; e.shellTimer = 200;
          e.y = e.y + 12;
          Sound.stomp();
          this.addFloat(e.x + e.w / 2, e.y - 6, '+200');
          this.score += 200;
        } else {
          this.killEnemy(e, 'stomp');
        }
        p.vy = Input.up() ? -13 : -9.5;
        this.hitStop = 3;
        this.shake = Math.max(this.shake, 4);
      } else {
        if (p.power > 0) p.shrink();
        else { this.hurtPlayer(); return; }
      }
    }
  },

  killEnemy: function (e, how) {
    e.alive = false;
    e.squash = 1;
    this.score += 200;
    this.addFloat(e.x + e.w / 2, e.y - 6, '+200');
    if (how === 'stomp') {
      e.deadTimer = 0;
      Sound.stomp();
    } else {
      e.deadTimer = 999;
      this.sparkle(e.x + e.w / 2, e.y + e.h / 2, how === 'star' ? '#ffeb3b' : '#ff9800', 12);
      Sound.stomp();
    }
  },

  updateBoss: function () {
    var b = this.boss;
    if (!b || !b.alive) return;
    b.t++;
    if (b.x - this.camera.x > CFG.VIEW_W + 320 || b.x - this.camera.x < -420) return;
    if (b.invuln > 0) b.invuln--;

    b.vy += CFG.GRAVITY;
    if (b.vy > CFG.MAX_FALL) b.vy = CFG.MAX_FALL;

    var p = this.player;
    b.facing = (p.x + p.w / 2 < b.x + b.w / 2) ? -1 : 1;

    b.jumpCd--;
    if (b.onGround && b.jumpCd <= 0) {
      b.vy = -12;
      b.vx = b.facing * 2.5;
      b.jumpCd = 90 + Math.floor(Math.random() * 60);
    }
    if (b.onGround) b.vx *= 0.85;

    b.fireCd--;
    if (b.fireCd <= 0) {
      b.fireCd = CFG.BOSS_FIRE_CD;
      this.fireballs.push({
        x: b.x + b.w / 2, y: b.y + b.h / 2, w: 16, h: 16,
        vx: b.facing * 5.5, vy: 0, life: 260, t: 0, hostile: true
      });
      Sound.fireball();
    }

    if (Physics.moveX(b, this.solids) !== 0) b.vx = -b.vx;
    var r = Physics.moveY(b, this.solids);
    if (r.hit === 1) { b.vy = 0; b.onGround = true; }
    else b.onGround = false;

    if (b.invuln > 0 || !aabb(p, b)) return;
    if (p.star > 0) { this.hitBoss(); return; }

    var fromTop = p.vy > 1 && (p.y + p.h - b.y) < 32;
    if (fromTop) {
      this.hitBoss();
      p.vy = Input.up() ? -13 : -10;
    } else if (p.invuln === 0) {
      if (p.power > 0) p.shrink();
      else this.hurtPlayer();
    }
  },

  hitBoss: function () {
    var b = this.boss;
    if (!b || b.invuln > 0) return;
    b.hp--;
    b.invuln = 70;
    b.squash = 1;
    Sound.bossHit();
    this.shake = Math.max(this.shake, 8);
    this.hitStop = 4;
    this.sparkle(b.x + b.w / 2, b.y + b.h / 2, '#ff5252', 20);
    this.addFloat(b.x + b.w / 2, b.y - 10, 'HP -1');
    if (b.hp <= 0) {
      b.alive = false;
      b.deadTimer = 0;
      this.score += 5000;
      this.flash = 0.6;
      this.shake = 12;
      this.addFloat(b.x + b.w / 2, b.y - 30, '+5000', '#ffd93b');
      for (var i = 0; i < 40; i++) {
        this.sparkle(b.x + b.w / 2, b.y + b.h / 2, i % 2 ? '#ffeb3b' : '#ff5252', 1);
      }
      Sound.oneUp();
    }
  },

  updateCoins: function () {
    for (var i = 0; i < this.coins.length; i++) {
      var c = this.coins[i];
      if (c.got) continue;
      c.t += 0.14;
      if (c.x - this.camera.x < -90 || c.x - this.camera.x > CFG.VIEW_W + 90) continue;
      var box = { x: c.x - 12, y: c.y - 14, w: 24, h: 28 };
      if (aabb(this.player, box)) {
        c.got = true;
        this.coinCount++;
        this.score += 100;
        this.addFloat(c.x, c.y - 12, '+100');
        this.sparkle(c.x, c.y, '#ffe066', 6);
        Sound.coin();
      }
    }
  },

  updateSprings: function () {
    var p = this.player;
    for (var i = 0; i < this.springs.length; i++) {
      var s = this.springs[i];
      if (s.cd > 0) s.cd--;
      if (s.compress > 0) s.compress = Math.max(0, s.compress - 0.14);
      if (s.cd > 0) continue;
      var box = { x: s.x, y: s.y + s.compress * 6, w: s.w, h: s.h - s.compress * 6 };
      if (aabb(p, box) && p.vy >= 0) {
        p.vy = -18.5;
        p.onGround = false;
        p.jumpHeld = true;
        p.squash = 0.4;
        s.compress = 1;
        s.cd = 22;
        Sound.spring();
        this.dust(s.x + s.w / 2, s.baseY + s.h, 'rgba(220,220,220,0.7)', 5);
      }
    }
  },

  hurtPlayer: function (fell) {
    this.lives--;
    Sound.hurt();
    this.shake = 10;
    this.flash = 0.45;
    this.hitStop = 6;
    if (fell) {
      this.player.y = CFG.LEVEL_H + 200;
    } else {
      this.sparkle(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, '#ff5252', 20);
    }
    if (this.lives <= 0) {
      this.state = 'gameover';
      Sound.musicStop();
      var self = this;
      setTimeout(function () { Sound.over(); }, 260);
      Save.data.highScore = Math.max(Save.data.highScore, this.score);
      Save.save();
      UI.setOver(this.score, this.coinCount);
      setTimeout(function () { UI.show('screen-over'); }, 320);
      return;
    }
    var self2 = this;
    setTimeout(function () { self2.respawn(); }, 300);
  },

  respawn: function () {
    if (this.state !== 'playing') return;
    this.player = new Player(this.spawnPoint);
    this.player.invuln = 110;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.alive && Math.abs(e.x - this.player.x) < 340) { e.alive = false; e.deadTimer = 999; }
    }
    this.camera.x = clamp(this.player.x + this.player.w / 2 - CFG.VIEW_W / 2, 0, Math.max(0, this.levelW - CFG.VIEW_W));
    this.camera.y = clamp(this.player.y + this.player.h / 2 - CFG.VIEW_H * 0.62, 0, CFG.LEVEL_H - CFG.VIEW_H);
  },

  addFloat: function (x, y, text, color) {
    this.floats.push({ x: x, y: y, text: text, color: color || '#fff', life: 60 });
  },

  sparkle: function (cx, cy, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var sp = rand(1.5, 5);
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
        life: rand(28, 50), color: color, size: rand(3, 6), gravity: 0.42
      });
    }
  },

  dust: function (cx, cy, color, n) {
    for (var i = 0; i < n; i++) {
      this.particles.push({
        x: cx + rand(-6, 6), y: cy + rand(-3, 2),
        vx: rand(-1.6, 1.6), vy: rand(-2.2, -0.4),
        life: rand(16, 30), color: color, size: rand(4, 9), gravity: 0.05
      });
    }
  },

  updateParticles: function () {
    for (var i = this.particles.length - 1; i >= 0; i--) {
      var p = this.particles[i];
      p.vy += (p.gravity === undefined ? 0.42 : p.gravity);
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (var j = this.floats.length - 1; j >= 0; j--) {
      var f = this.floats[j];
      f.y -= 1.1;
      f.life--;
      if (f.life <= 0) this.floats.splice(j, 1);
    }
  },

  /* =========================================================
     渲染
     ========================================================= */
  render: function () {
    if (this.state === 'menu') { this.renderMenuBg(); return; }
    var ctx = this.ctx;
    this.renderSky(ctx);
    this.renderParallax(ctx);

    ctx.save();
    ctx.scale(CFG.ZOOM, CFG.ZOOM);
    var sx = 0, sy = 0;
    if (this.shake > 0.4) {
      sx = (Math.random() - 0.5) * this.shake;
      sy = (Math.random() - 0.5) * this.shake;
    }
    ctx.translate(-Math.round(this.camera.x) + sx, -Math.round(this.camera.y) + sy);

    this.renderFlag(ctx);
    this.renderSolids(ctx);
    this.renderSprings(ctx);
    this.renderItems(ctx);
    this.renderCoins(ctx);
    this.renderCoinRains(ctx);
    this.renderEnemies(ctx);
    this.renderBoss(ctx);
    this.renderFireballs(ctx);
    if (this.player && this.state !== 'gameover') this.renderPlayer(ctx);
    this.renderEffects(ctx);
    ctx.restore();

    this.renderHUD(ctx);
    this.renderBanner(ctx);

    if (this.flash > 0) {
      ctx.globalAlpha = Math.min(0.75, this.flash);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.globalAlpha = 1;
    }
  },

  renderMenuBg: function () {
    var ctx = this.ctx;
    var g = ctx.createLinearGradient(0, 0, 0, CFG.H);
    g.addColorStop(0, '#101a33');
    g.addColorStop(0.55, '#1c2c52');
    g.addColorStop(1, '#2a1a3e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    for (var i = 0; i < 90; i++) {
      var x = (i * 137 + this.tick * 0.3) % CFG.W;
      var y = (i * 89) % CFG.H;
      var s = 0.6 + (i % 3) * 0.8;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.22 + Math.sin(this.tick * 0.05 + i) * 0.22) + ')';
      ctx.fillRect(x, y, s, s);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, CFG.H - 90, CFG.W, 90);
    var g2 = ctx.createLinearGradient(0, CFG.H - 90, 0, CFG.H);
    g2.addColorStop(0, 'rgba(90,180,90,0)');
    g2.addColorStop(1, 'rgba(60,140,70,0.5)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, CFG.H - 90, CFG.W, 90);
  },

  renderSky: function (ctx) {
    if (!this.bgCache) this.buildBg();
    ctx.drawImage(this.bgCache, 0, 0, CFG.W, CFG.H);
  },

  buildBg: function () {
    var cv = document.createElement('canvas');
    cv.width = CFG.W; cv.height = CFG.H;
    var c = cv.getContext('2d');
    var g;
    if (this.isWater) {
      g = c.createLinearGradient(0, 0, 0, CFG.H);
      g.addColorStop(0, '#08243f');
      g.addColorStop(0.5, '#12456f');
      g.addColorStop(1, '#1d6690');
    } else if (this.level && this.level.theme === 'cave') {
      g = c.createLinearGradient(0, 0, 0, CFG.H);
      g.addColorStop(0, '#07070f');
      g.addColorStop(0.6, '#12121f');
      g.addColorStop(1, '#1b1b2c');
    } else {
      g = c.createLinearGradient(0, 0, 0, CFG.H);
      g.addColorStop(0, '#2f6fd0');
      g.addColorStop(0.45, '#5f9ce8');
      g.addColorStop(1, '#bfe4ff');
    }
    c.fillStyle = g;
    c.fillRect(0, 0, CFG.W, CFG.H);

    if (!this.isWater && (!this.level || this.level.theme !== 'cave')) {
      var sun = c.createRadialGradient(760, 92, 10, 760, 92, 150);
      sun.addColorStop(0, 'rgba(255,250,200,0.95)');
      sun.addColorStop(0.3, 'rgba(255,235,150,0.4)');
      sun.addColorStop(1, 'rgba(255,220,120,0)');
      c.fillStyle = sun;
      c.beginPath(); c.arc(760, 92, 150, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,235,0.95)';
      c.beginPath(); c.arc(760, 92, 40, 0, TAU); c.fill();
    }
    this.bgCache = cv;
  },

  renderParallax: function (ctx) {
    ctx.save();
    ctx.scale(CFG.ZOOM, CFG.ZOOM);
    var camX = this.camera.x;

    if (this.isWater) {
      ctx.strokeStyle = 'rgba(150,220,255,0.12)';
      ctx.lineWidth = 3;
      for (var i = 0; i < 12; i++) {
        var y = (i * 60 + this.tick * 0.5) % CFG.LEVEL_H;
        ctx.beginPath();
        for (var x = 0; x < CFG.VIEW_W + 120; x += 24) {
          var yy = y + Math.sin((x + camX) * 0.02) * 5;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      /* 气泡 */
      for (var b = 0; b < 14; b++) {
        var bx = ((b * 137 + this.tick * 0.4) % (CFG.VIEW_W + 80)) - 40;
        var by = CFG.LEVEL_H - ((b * 97 + this.tick * 1.1) % CFG.LEVEL_H);
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#bfefff';
        ctx.beginPath(); ctx.arc(bx, by, 3 + (b % 3), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else {
      /* 远山 / 洞壁 */
      ctx.save();
      ctx.translate(-camX * 0.22, -this.camera.y * 0.10);
      if (this.level && this.level.theme === 'cave') {
        ctx.fillStyle = 'rgba(70,70,95,0.35)';
        for (var k = 0; k < 18; k++) {
          var hx = k * 220 + (k * 173 % 160);
          var hh = 100 + (k * 97 % 120);
          ctx.beginPath();
          ctx.moveTo(hx, CFG.H);
          ctx.lineTo(hx + 60, CFG.H - hh);
          ctx.lineTo(hx + 120, CFG.H);
          ctx.closePath();
          ctx.fill();
        }
      } else {
        ctx.fillStyle = 'rgba(90,150,120,0.35)';
        ctx.beginPath();
        ctx.moveTo(-200, 340);
        for (var h = 0; h < 14; h++) {
          var px = h * 150 - 200;
          ctx.quadraticCurveTo(px + 75, 200 + (h % 3) * 40, px + 150, 340);
        }
        ctx.lineTo(1600, 400);
        ctx.lineTo(-200, 400);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        for (var ci = 0; ci < 8; ci++) {
          var cx2 = ci * 300 + (ci * 197 % 180);
          var cy2 = 60 + (ci * 137 % 110);
          var cs = 0.7 + (ci * 43 % 60) / 120;
          ctx.beginPath();
          ctx.arc(cx2, cy2, 22 * cs, 0, TAU);
          ctx.arc(cx2 + 26 * cs, cy2 - 12 * cs, 28 * cs, 0, TAU);
          ctx.arc(cx2 + 58 * cs, cy2, 20 * cs, 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
    }
    ctx.restore();
  },

  renderSolids: function (ctx) {
    var left = this.camera.x - 100, right = this.camera.x + CFG.VIEW_W + 100;
    var T = CFG.TILE;
    var cave = this.level && this.level.theme === 'cave';

    for (var i = 0; i < this.solids.length; i++) {
      var s = this.solids[i];
      if (s.x + s.w < left || s.x > right) continue;
      if (s.type === 'hidden') continue;

      var bumpOff = s.bump > 0 ? -Math.sin(s.bump * Math.PI) * 11 : 0;
      var x = s.x, y = s.y + bumpOff, w = s.w, h = s.h;

      if (s.type === 'platform') {
        ctx.fillStyle = '#8a5a2a';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#c08040';
        ctx.fillRect(x, y, w, 4);
        ctx.strokeStyle = '#4a2a10';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
        continue;
      }

      if (s.type === 'ground') {
        ctx.fillStyle = cave ? '#4a2e14' : this.isWater ? '#5a4030' : '#b9561c';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = cave ? '#6a4a26' : this.isWater ? '#7a5a44' : '#d87a2a';
        ctx.fillRect(x, y, w, 8);
        ctx.fillStyle = cave ? '#7a5a36' : this.isWater ? '#8a6a54' : '#e89a44';
        ctx.fillRect(x, y, w, 3);
        /* 土壤纹理 */
        ctx.fillStyle = 'rgba(0,0,0,0.10)';
        for (var gx = x + 10; gx < x + w - 10; gx += 42) {
          ctx.fillRect(gx, y + 14, 6, 4);
          ctx.fillRect(gx + 18, y + 30, 5, 4);
        }
        continue;
      }

      switch (s.type) {
        case 'brick':
          ctx.fillStyle = this.isWater ? '#7a4a2a' : cave ? '#4e3418' : '#c1531b';
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = 'rgba(255,255,255,0.16)';
          ctx.fillRect(x, y, w, 4);
          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(x, y + h - 4, w, 4);
          ctx.strokeStyle = 'rgba(30,10,0,0.75)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          ctx.beginPath();
          ctx.moveTo(x + w / 2, y + 3);
          ctx.lineTo(x + w / 2, y + h - 3);
          ctx.moveTo(x + 3, y + h / 2);
          ctx.lineTo(x + w - 3, y + h / 2);
          ctx.stroke();
          break;
        case 'question':
          if (s.used) {
            ctx.fillStyle = '#6a4a2a';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#3a2010';
            ctx.lineWidth = 3;
            ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
          } else {
            var pulse = 0.5 + 0.5 * Math.sin(this.tick * 0.11);
            ctx.fillStyle = '#e8a41c';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = 'rgba(255,235,140,' + (0.25 + pulse * 0.3) + ')';
            ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
            ctx.strokeStyle = '#8a5a00';
            ctx.lineWidth = 3;
            ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
            ctx.fillStyle = '#7a4a00';
            ctx.font = 'bold 21px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + w / 2, y + h / 2 + 1);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            /* 四角铆钉 */
            ctx.fillStyle = 'rgba(90,50,0,0.5)';
            ctx.fillRect(x + 4, y + 4, 3, 3);
            ctx.fillRect(x + w - 7, y + 4, 3, 3);
            ctx.fillRect(x + 4, y + h - 7, 3, 3);
            ctx.fillRect(x + w - 7, y + h - 7, 3, 3);
          }
          break;
        case 'stone':
          ctx.fillStyle = cave ? '#454555' : '#9a9a9a';
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(x, y, w, 3);
          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(x, y + h - 3, w, 3);
          ctx.strokeStyle = cave ? '#2a2a38' : '#5a5a5a';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
          break;
        case 'pipe': {
          var capH = 26;
          var gc = this.isWater ? '#1a6a2a' : '#2f9e2f';
          var gc2 = this.isWater ? '#2a8a3a' : '#4ec44e';
          ctx.fillStyle = gc;
          ctx.fillRect(x + 5, y + capH, w - 10, h - capH);
          ctx.fillStyle = gc2;
          ctx.fillRect(x + 11, y + capH, 9, h - capH);
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.fillRect(x + w - 16, y + capH, 9, h - capH);
          ctx.fillStyle = gc;
          ctx.fillRect(x - 2, y, w + 4, capH);
          ctx.fillStyle = gc2;
          ctx.fillRect(x + 6, y + 4, 11, capH - 8);
          ctx.fillStyle = 'rgba(0,0,0,0.16)';
          ctx.fillRect(x + w - 14, y + 4, 9, capH - 8);
          ctx.strokeStyle = '#14611a';
          ctx.lineWidth = 3;
          ctx.strokeRect(x - 1.5, y + 1.5, w + 3, capH - 3);
          break;
        }
      }
    }
  },

  renderCoins: function (ctx) {
    for (var i = 0; i < this.coins.length; i++) {
      var c = this.coins[i];
      if (c.got) continue;
      if (c.x - this.camera.x < -50 || c.x - this.camera.x > CFG.VIEW_W + 50) continue;
      var spin = Math.cos(c.t);
      var halfW = Math.max(2.5, Math.abs(spin) * 9);
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(c.x, c.y, 16, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffd93b';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, halfW, 12, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
      if (halfW > 5) {
        ctx.fillStyle = 'rgba(255,255,220,0.7)';
        ctx.beginPath(); ctx.ellipse(c.x - halfW * 0.3, c.y - 3, halfW * 0.25, 5, 0, 0, TAU); ctx.fill();
      }
    }
  },

  renderCoinRains: function (ctx) {
    for (var i = 0; i < this.coinRains.length; i++) {
      var c = this.coinRains[i];
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(c.x, c.y, 14, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffd93b';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 9, 12, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
    }
  },

  renderItems: function (ctx) {
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      if (it.x - this.camera.x < -90 || it.x - this.camera.x > CFG.VIEW_W + 90) continue;
      var fo = it.type === 'flower' ? Math.sin(it.t * 0.09) * 3 : 0;
      var x = it.x, y = it.y + fo, w = it.w, h = it.h;

      if (it.type === 'mushroom' || it.type === '1up') {
        var capH = h * 0.62;
        ctx.fillStyle = it.type === '1up' ? '#3cb043' : '#e52521';
        ctx.beginPath();
        ctx.moveTo(x, y + capH);
        ctx.quadraticCurveTo(x + w / 2, y - h * 0.1, x + w, y + capH);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.34, y + capH * 0.5, w * 0.16, h * 0.12, -0.4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + w * 0.24, y + capH * 0.64, w * 0.13, 0, TAU);
        ctx.arc(x + w * 0.76, y + capH * 0.64, w * 0.13, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#f5e6c8';
        ctx.fillRect(x + w * 0.24, y + capH, w * 0.52, h - capH);
        ctx.fillStyle = '#3a2010';
        ctx.fillRect(x + w * 0.34, y + capH + 4, 3, 4);
        ctx.fillRect(x + w * 0.58, y + capH + 4, 3, 4);
      } else if (it.type === 'flower') {
        var cx = x + w / 2;
        for (var p = 0; p < 6; p++) {
          var a = it.t * 0.05 + p * Math.PI / 3;
          ctx.fillStyle = p % 2 === 0 ? '#ff5722' : '#ffc107';
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * w * 0.26, y + h * 0.42 + Math.sin(a) * h * 0.2, w * 0.18, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = '#fffde7';
        ctx.beginPath(); ctx.arc(cx, y + h * 0.42, w * 0.2, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e91e63';
        ctx.beginPath(); ctx.arc(cx, y + h * 0.42, w * 0.1, 0, TAU); ctx.fill();
      } else if (it.type === 'star') {
        var scx = x + w / 2, scy = y + h / 2;
        var R = w * 0.58, r = R * 0.45;
        var hue = (this.tick * 8 + it.t * 12) % 360;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = 'hsl(' + hue + ',100%,70%)';
        ctx.beginPath(); ctx.arc(scx, scy, R * 1.6, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'hsl(' + hue + ',100%,68%)';
        ctx.beginPath();
        for (var si = 0; si < 10; si++) {
          var ang = -Math.PI / 2 + si * Math.PI / 5;
          var rad = si % 2 === 0 ? R : r;
          var px = scx + Math.cos(ang) * rad;
          var py = scy + Math.sin(ang) * rad;
          if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  },

  renderFireballs: function (ctx) {
    for (var i = 0; i < this.fireballs.length; i++) {
      var f = this.fireballs[i];
      if (f.x - this.camera.x < -50 || f.x - this.camera.x > CFG.VIEW_W + 50) continue;
      var cx = f.x + f.w / 2, cy = f.y + f.h / 2, r = f.w / 2;
      var flick = 1 + Math.sin(f.t * 0.5) * 0.12;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = f.hostile ? '#ff4040' : '#ffab40';
      ctx.beginPath(); ctx.arc(cx, cy, r * 2 * flick, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 1, cx, cy, r * flick);
      g.addColorStop(0, f.hostile ? '#ffdcdc' : '#fffde7');
      g.addColorStop(0.45, f.hostile ? '#ff3b3b' : '#ffb300');
      g.addColorStop(1, f.hostile ? '#8a0000' : '#e65100');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r * flick, 0, TAU); ctx.fill();
    }
  },

  renderEnemies: function (ctx) {
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.alive && e.deadTimer > 34) continue;
      if (e.x - this.camera.x < -90 || e.x - this.camera.x > CFG.VIEW_W + 90) continue;
      var x = e.x, y = e.y, w = e.w, h = e.h;

      if (!e.alive) {
        ctx.fillStyle = '#8b4a1e';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h - 4, w / 2 + 3, 7, 0, 0, TAU);
        ctx.fill();
        continue;
      }

      var body = '#a45c22', foot = '#4a2a0e';
      if (e.kind === 'fast') { body = '#e53935'; foot = '#7a1a1a'; }
      else if (e.kind === 'jumper') { body = '#7e57c2'; foot = '#3a2373'; }
      else if (e.kind === 'flyer') { body = '#26a69a'; foot = '#0e5f57'; }
      else if (e.kind === 'koopa') { body = '#2f9e2f'; foot = '#14611a'; }

      /* 影子 */
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 1, w / 2, 4, 0, 0, TAU);
      ctx.fill();

      if (e.shell) {
        ctx.fillStyle = '#2f9e2f';
        ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#14611a';
        ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2 - 4, h / 2 - 4, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#8ef58e';
        for (var s = 0; s < 4; s++) {
          var aa = s * Math.PI / 2 + (e.vx !== 0 ? this.tick * 0.2 : 0);
          ctx.beginPath();
          ctx.arc(x + w / 2 + Math.cos(aa) * w * 0.22, y + h / 2 + Math.sin(aa) * h * 0.22, 3, 0, TAU);
          ctx.fill();
        }
        continue;
      }

      var wob = Math.sin(e.t * 12) * 2;
      var sq = e.squash || 0;

      if (e.kind === 'flyer') {
        var wingA = Math.sin(e.t * 18) * 0.5;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(wingA);
        ctx.beginPath(); ctx.ellipse(-w * 0.52, -2, 10, 5, 0, 0, TAU); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(-wingA);
        ctx.beginPath(); ctx.ellipse(w * 0.52, -2, 10, 5, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = foot;
      ctx.beginPath();
      ctx.ellipse(x + 7 + wob, y + h - 3, 9, 5, 0, 0, TAU);
      ctx.ellipse(x + w - 7 - wob, y + h - 3, 9, 5, 0, 0, TAU);
      ctx.fill();

      var bodyY = y - sq * 4;
      var bodyH = h + sq * 4;
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(x, bodyY + bodyH - 6);
      ctx.quadraticCurveTo(x + w / 2, bodyY - 6, x + w, bodyY + bodyH - 6);
      ctx.quadraticCurveTo(x + w / 2, bodyY + bodyH + 2, x, bodyY + bodyH - 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.3, bodyY + bodyH * 0.35, w * 0.16, bodyH * 0.16, -0.5, 0, TAU);
      ctx.fill();

      var eyeY = bodyY + bodyH * 0.48;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(x + 9, eyeY, 5, 6, 0, 0, TAU);
      ctx.ellipse(x + 19, eyeY, 5, 6, 0, 0, TAU);
      ctx.fill();
      var lookX = 0, lookY = 0;
      var p = this.player;
      if (p) {
        lookX = clamp((p.x + p.w / 2 - (x + w / 2)) * 0.05, -2, 2);
        lookY = clamp((p.y - y) * 0.02, -1.5, 1.5);
      }
      ctx.fillStyle = '#241206';
      ctx.beginPath();
      ctx.arc(x + 9 + lookX, eyeY + 1 + lookY, 2.5, 0, TAU);
      ctx.arc(x + 19 + lookX, eyeY + 1 + lookY, 2.5, 0, TAU);
      ctx.fill();
    }
  },

  renderBoss: function (ctx) {
    var b = this.boss;
    if (!b || !b.alive) return;
    if (b.x - this.camera.x < -120 || b.x - this.camera.x > CFG.VIEW_W + 120) return;
    var x = b.x, y = b.y, w = b.w, h = b.h;
    var flash = b.invuln > 0 && Math.floor(b.invuln / 5) % 2 === 0;
    var sq = b.squash || 0;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 2, w / 2, 6, 0, 0, TAU); ctx.fill();

    ctx.fillStyle = flash ? '#ffffff' : '#8a2a2a';
    ctx.beginPath();
    ctx.moveTo(x, y + h - 10);
    ctx.quadraticCurveTo(x + w / 2, y - 10 - sq * 6, x + w, y + h - 10);
    ctx.quadraticCurveTo(x + w / 2, y + h + 4, x, y + h - 10);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = flash ? '#ffffff' : '#4a0a0a';
    ctx.beginPath(); ctx.moveTo(x + 4, y + 12); ctx.lineTo(x - 6, y - 8); ctx.lineTo(x + 16, y + 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w - 4, y + 12); ctx.lineTo(x + w + 6, y - 8); ctx.lineTo(x + w - 16, y + 4); ctx.closePath(); ctx.fill();

    var eyeY = y + h * 0.42;
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.ellipse(x + 16, eyeY, 8, 10, 0, 0, TAU);
    ctx.ellipse(x + w - 16, eyeY, 8, 10, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x + 16 + b.facing * 2, eyeY + 1, 3.5, 0, TAU);
    ctx.arc(x + w - 16 + b.facing * 2, eyeY + 1, 3.5, 0, TAU);
    ctx.fill();

    var barW = w + 20, barX = x - 10, barY = y - 16;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(barX, barY, barW, 9);
    var bg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    bg.addColorStop(0, '#ff8a8a');
    bg.addColorStop(1, '#c62828');
    ctx.fillStyle = bg;
    ctx.fillRect(barX + 1, barY + 1, (barW - 2) * (b.hp / 3), 7);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(barX, barY, barW, 9);
  },

  renderPlayer: function (ctx) {
    var p = this.player;
    if (p.star > 0 && p.star < 60 && Math.floor(p.star / 4) % 2 === 0) return;
    if (p.invuln > 0 && Math.floor(p.invuln / 5) % 2 === 1) return;

    var scale = p.h / 30;
    var sq = p.squash;
    var scaleX = scale * (1 + sq * 0.55);
    var scaleY = scale * (1 - sq * 0.55);

    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h);
    ctx.scale(p.facing * scaleX, scaleY);
    ctx.translate(-13, -30);

    var RED = '#e52521', SKIN = '#fbc38a', DARK = '#3a2010', BLUE = '#2b52b8', SHOE = '#5d2f0c';
    if (p.power === 2) { RED = '#f8f8f8'; BLUE = '#e52521'; }
    if (p.star > 0) {
      var hue = (this.tick * 22) % 360;
      RED = 'hsl(' + hue + ',100%,60%)';
      BLUE = 'hsl(' + ((hue + 120) % 360) + ',100%,60%)';
    }

    var walking = p.onGround && Math.abs(p.vx) > 0.4;
    var jumping = !p.onGround;
    var skidding = p.skid > 0.3;

    /* 帽子 */
    ctx.fillStyle = RED;
    ctx.fillRect(5, 0, 16, 5);
    ctx.fillRect(2, 5, 22, 3);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(13, 3, 2.6, 0, TAU); ctx.fill();

    /* 脸 */
    ctx.fillStyle = SKIN;
    ctx.fillRect(7, 6, 13, 12);
    ctx.fillRect(18, 10, 4, 4);
    ctx.fillStyle = DARK;
    ctx.fillRect(15, 8, 3, 5);
    ctx.fillRect(7, 14, 11, 3);

    /* 衣服 */
    ctx.fillStyle = RED;
    ctx.fillRect(4, 17, 18, 7);
    ctx.fillStyle = BLUE;
    ctx.fillRect(5, 21, 16, 6);
    ctx.fillRect(8, 17, 3, 5);
    ctx.fillRect(15, 17, 3, 5);
    ctx.fillStyle = '#f5d442';
    ctx.fillRect(9, 22, 2, 2);
    ctx.fillRect(16, 22, 2, 2);

    /* 手 */
    ctx.fillStyle = SKIN;
    if (jumping) { ctx.fillRect(0, 13, 5, 6); ctx.fillRect(21, 13, 5, 6); }
    else if (skidding) { ctx.fillRect(-3, 16, 6, 5); ctx.fillRect(21, 19, 5, 5); }
    else { ctx.fillRect(0, 19, 5, 5); ctx.fillRect(21, 19, 5, 5); }

    /* 鞋 */
    ctx.fillStyle = SHOE;
    if (jumping) {
      ctx.fillRect(2, 27, 10, 3);
      ctx.fillRect(14, 26, 11, 4);
    } else if (walking) {
      var o = Math.sin(p.animTimer) * 3.5;
      ctx.fillRect(2 + o, 27, 10, 3);
      ctx.fillRect(14 - o, 27, 10, 3);
    } else if (skidding) {
      ctx.fillRect(0, 27, 11, 3);
      ctx.fillRect(15, 27, 11, 3);
    } else {
      ctx.fillRect(2, 27, 10, 3);
      ctx.fillRect(14, 27, 10, 3);
    }
    ctx.restore();

    /* 无敌闪光 */
    if (p.star > 0) {
      ctx.globalAlpha = 0.35 + Math.sin(this.tick * 0.4) * 0.2;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w * 0.9, p.h * 0.7, 0, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  },

  renderFlag: function (ctx) {
    if (!this.flag) return;
    var x = this.flag.x, top = this.flag.y, bottom = 14 * CFG.TILE;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x + 3, bottom + 2, 26, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a5a5a';
    ctx.fillRect(x - 16, bottom - 18, 38, 18);
    ctx.fillStyle = '#7a7a7a';
    ctx.fillRect(x - 16, bottom - 18, 38, 4);
    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(x, top, 6, bottom - top - 8);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(x + 1, top, 2, bottom - top - 8);
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.arc(x + 3, top - 6, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(x + 1, top - 8, 3, 0, TAU); ctx.fill();

    var wave = Math.sin(this.tick * 0.07) * 5;
    ctx.fillStyle = '#00c853';
    ctx.beginPath();
    ctx.moveTo(x + 6, top + 12);
    ctx.quadraticCurveTo(x + 46, top + 16 + wave, x + 76, top + 30 + wave);
    ctx.quadraticCurveTo(x + 46, top + 44 + wave, x + 6, top + 50);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x + 34, top + 30 + wave * 0.5, 9, 0, TAU);
    ctx.fill();
  },

  renderSprings: function (ctx) {
    for (var i = 0; i < this.springs.length; i++) {
      var s = this.springs[i];
      if (s.x - this.camera.x < -90 || s.x - this.camera.x > CFG.VIEW_W + 90) continue;
      var comp = s.compress * 6;
      var baseY = s.y + comp;
      var h = s.h - comp;

      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(s.x + s.w / 2, s.baseY + s.h + 1, s.w * 0.6, 4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#888';
      ctx.fillRect(s.x - 2, s.baseY + s.h - 3, s.w + 4, 4);

      for (var k = 0; k < 3; k++) {
        var yy = baseY + k * (h / 3);
        ctx.strokeStyle = '#ffd93b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(s.x, yy + 3);
        ctx.quadraticCurveTo(s.x + s.w / 2, yy - 2, s.x + s.w, yy + 3);
        ctx.stroke();
      }
      ctx.fillStyle = '#e52521';
      ctx.fillRect(s.x - 2, baseY - 3, s.w + 4, 5);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(s.x - 1, baseY - 2, s.w, 2);
    }
  },

  renderEffects: function (ctx) {
    for (var i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      ctx.globalAlpha = Math.min(1, p.life / 22);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.textAlign = 'center';
    for (var j = 0; j < this.floats.length; j++) {
      var f = this.floats[j];
      ctx.globalAlpha = Math.min(1, f.life / 28);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.72)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  },

  renderHUD: function (ctx) {
    ctx.save();
    var g = ctx.createLinearGradient(0, 0, 0, 78);
    g.addColorStop(0, 'rgba(0,0,0,0.58)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, 78);

    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';

    var st = '分数 ' + String(this.score).padStart(6, '0');
    ctx.strokeText(st, 22, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(st, 22, 30);

    /* 金币图标 */
    var coinSpin = Math.abs(Math.cos(this.tick * 0.08));
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath();
    ctx.ellipse(300, 29, 4 + coinSpin * 5, 9, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    var ct = '× ' + String(this.coinCount).padStart(2, '0');
    ctx.strokeText(ct, 314, 30);
    ctx.fillStyle = '#ffe082';
    ctx.fillText(ct, 314, 30);

    var lt = '生命 ' + this.lives;
    ctx.strokeText(lt, CFG.W - 176, 30);
    ctx.fillStyle = '#a5f3a5';
    ctx.fillText(lt, CFG.W - 176, 30);

    if (this.level) {
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.lineWidth = 3;
      var nm = this.level.name;
      ctx.strokeText(nm, CFG.W / 2 - 34, 30);
      ctx.fillStyle = 'rgba(200,230,255,0.92)';
      ctx.fillText(nm, CFG.W / 2 - 34, 30);
    }

    /* 进度条 */
    if (this.player && this.flag) {
      var prog = clamp(this.player.x / this.flag.x, 0, 1);
      var barW = 210;
      var barX = CFG.W / 2 - barW / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(barX, 20, barW, 6);
      var bg2 = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      bg2.addColorStop(0, '#38bdf8');
      bg2.addColorStop(1, '#ffd93b');
      ctx.fillStyle = bg2;
      ctx.fillRect(barX, 20, barW * prog, 6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(barX + barW * prog - 2, 16, 4, 14);
    }

    /* 状态图标 */
    if (this.player) {
      if (this.player.power === 2) {
        var fx = CFG.W - 210;
        ctx.fillStyle = '#ff5722';
        ctx.beginPath(); ctx.arc(fx, 30, 8, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffc107';
        ctx.beginPath(); ctx.arc(fx, 30, 4, 0, TAU); ctx.fill();
      } else if (this.player.power === 1) {
        var mx = CFG.W - 210;
        ctx.fillStyle = '#e52521';
        ctx.beginPath(); ctx.arc(mx, 30, 8, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#f5e6c8';
        ctx.fillRect(mx - 6, 30, 12, 6);
      }
      if (this.player.star > 0) {
        ctx.fillStyle = 'rgba(255,235,59,' + (0.6 + Math.sin(this.tick * 0.3) * 0.4) + ')';
        ctx.font = 'bold 15px "Courier New", monospace';
        ctx.fillText('★', CFG.W - 190, 30);
      }
    }

    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  },

  renderBanner: function (ctx) {
    if (this.banner <= 0) return;
    var a = clamp(this.banner > 1.4 ? (1.8 - this.banner) / 0.4 : this.banner / 0.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    var w = 330, h = 62;
    var x = CFG.W / 2 - w / 2;
    var y = 128 + (1 - a) * -14;
    ctx.fillStyle = 'rgba(4,10,20,0.78)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#ffd93b';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.bannerText, CFG.W / 2, y + 38);
    ctx.restore();
    ctx.textAlign = 'left';
  }
};

/* =========================================================
   8. UI
   ========================================================= */
var UI = {
  init: function () {
    var self = this;

    $('cmd-start').addEventListener('click', function () {
      Sound.init(); Sound.resume();
      Game.startLevel(0);
    });
    $('cmd-levels').addEventListener('click', function () {
      self.buildLevelGrid();
      self.hide('screen-main');
      self.show('screen-levels');
    });
    $('cmd-settings').addEventListener('click', function () {
      self.loadSettings();
      self.hide('screen-main');
      self.show('screen-settings');
    });
    $('cmd-levels-back').addEventListener('click', function () {
      self.hide('screen-levels');
      self.show('screen-main');
    });
    $('cmd-settings-back').addEventListener('click', function () {
      self.hide('screen-settings');
      self.show('screen-main');
      Save.save();
    });

    document.querySelectorAll('#seg-control button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var mode = btn.dataset.mode;
        Save.data.controlMode = mode;
        self.updateSegActive(mode);
        Game.applyControlMode(mode);
        Save.save();
        setTimeout(function () { Game.positionTouch(); }, 20);
      });
    });

    $('set-volume').addEventListener('input', function (e) {
      Save.data.volume = e.target.value / 100;
      Sound.setVolume(Save.data.volume);
    });
    $('set-btnsize').addEventListener('input', function (e) {
      self.applyBtnSize(+e.target.value);
      Game.positionTouch();
    });
    $('set-btnalpha').addEventListener('input', function (e) {
      self.applyBtnAlpha(+e.target.value);
    });

    this.refreshMenu();
    this.applyBtnSize(Save.data.btnSize);
    this.applyBtnAlpha(Save.data.btnAlpha * 100);
    this.updateSegActive(Save.data.controlMode);
  },

  updateSegActive: function (mode) {
    document.querySelectorAll('#seg-control button').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
  },

  loadSettings: function () {
    $('set-volume').value = Math.round(Save.data.volume * 100);
    $('set-btnsize').value = Save.data.btnSize;
    $('set-btnalpha').value = Math.round(Save.data.btnAlpha * 100);
    this.updateSegActive(Save.data.controlMode);
  },

  applyBtnSize: function (v) {
    Save.data.btnSize = +v;
    var size = +v;
    var fontSize = Math.round(size * 0.3);

    ['btn-jump', 'btn-fire'].forEach(function (id) {
      var el = $(id);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.fontSize = fontSize + 'px';
    });

    var joySize = Math.round(size * 1.5);
    var joy = $('joystick');
    joy.style.width = joySize + 'px';
    joy.style.height = joySize + 'px';

    var knob = $('joystick-knob');
    var knobSize = Math.round(size * 0.78);
    knob.style.width = knobSize + 'px';
    knob.style.height = knobSize + 'px';
    knob.style.marginLeft = (-knobSize / 2) + 'px';
    knob.style.marginTop = (-knobSize / 2) + 'px';

    var dpadSize = Math.round(size * 1.06);
    var dpadFont = Math.round(size * 0.42);
    document.querySelectorAll('#dpad .dpad-btn').forEach(function (b) {
      b.style.width = dpadSize + 'px';
      b.style.height = dpadSize + 'px';
      b.style.fontSize = dpadFont + 'px';
    });
  },

  applyBtnAlpha: function (v) {
    Save.data.btnAlpha = v / 100;
    var a = Save.data.btnAlpha;
    $('btn-jump').style.background = 'radial-gradient(circle at 35% 28%,rgba(124,192,255,' + Math.min(1, a * 1.7) + '),rgba(27,95,196,' + a + ') 70%)';
    $('btn-fire').style.background = 'radial-gradient(circle at 35% 28%,rgba(255,157,107,' + Math.min(1, a * 1.7) + '),rgba(194,58,18,' + a + ') 70%)';
    $('joystick-base').style.background = 'rgba(255,255,255,' + (a * 0.28) + ')';
    document.querySelectorAll('#dpad .dpad-btn').forEach(function (b) {
      b.style.background = 'rgba(10,14,24,' + a + ')';
    });
  },

  refreshMenu: function () {
    $('ui-highscore').textContent = Save.data.highScore;
  },

  buildLevelGrid: function () {
    var grid = $('level-grid');
    grid.innerHTML = '';
    var names = ['草 原', '地 下', '水 下'];
    var emojis = ['🌿', '🕳️', '🌊'];
    var tips = ['入门', '机关', '游泳'];
    for (var i = 0; i < 3; i++) {
      (function (idx) {
        var card = document.createElement('div');
        card.className = 'level-card';
        card.innerHTML =
          '<div class="emoji">' + emojis[idx] + '</div>' +
          '<div class="name">' + names[idx] + '</div>' +
          '<div class="tip">' + tips[idx] + '</div>';
        card.addEventListener('click', function () {
          Sound.init(); Sound.resume();
          UI.hide('screen-levels');
          Game.startLevel(idx);
        });
        grid.appendChild(card);
      })(i);
    }
  },

  show: function (id) { var el = $(id); if (el) el.classList.add('show'); },
  hide: function (id) { var el = $(id); if (el) el.classList.remove('show'); },
  hideAll: function () {
    ['screen-main','screen-levels','screen-settings','screen-pause','screen-win','screen-over']
      .forEach(function (id) { UI.hide(id); });
  },
  setWin: function (levelIdx, score, coins) {
    var names = ['草原', '地下', '水下'];
    $('ui-win-level').textContent = names[levelIdx];
    $('ui-win-score').textContent = score;
    $('ui-win-coins').textContent = coins;
    $('cmd-next').style.display = levelIdx >= 2 ? 'none' : '';
  },
  setOver: function (score, coins) {
    $('ui-over-score').textContent = score;
    $('ui-over-coins').textContent = coins;
  }
};

/* =========================================================
   9. 启动
   ========================================================= */
window.addEventListener('DOMContentLoaded', function () {
  Game.init();
  Game.updateFsIcon();
  $('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
  $('btn-sound').classList.toggle('dim', !Sound.enabled);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && Game.state === 'playing') Game.togglePause();
    else Sound.resume();
  });
});

})();
</script>
