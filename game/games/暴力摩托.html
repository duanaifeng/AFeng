<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120707">
<title>暴力摩托 · 公路争霸</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#ffd93b;
  --orange:#ff6b35;
  --red:#d32f2f;
  --ink:#fff5f0;
  --muted:rgba(255,240,230,.62);
  --line:rgba(255,150,110,.22);
  --panel:rgba(20,10,10,.88);
  --ease:cubic-bezier(.34,1.56,.64,1);
}
html,body{
  width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
  color:var(--ink);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(70% 45% at 50% -10%,rgba(255,107,53,.10),transparent 70%),
    radial-gradient(60% 45% at 100% 110%,rgba(211,47,47,.10),transparent 70%);
}
#game{
  display:block;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:#87ceeb;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,140,90,.15),0 30px 80px rgba(0,0,0,.85);
}
/* ================= 工具按钮 ================= */
.tool-btn{
  position:fixed;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,180,140,.35);
  background:rgba(28,12,10,.62);color:#ffe6d8;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:900;font-family:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .12s,background .15s,box-shadow .15s,opacity .15s;
}
.tool-btn:hover{background:rgba(60,24,16,.85);box-shadow:0 8px 22px rgba(255,107,53,.3),inset 0 1px 0 rgba(255,255,255,.15)}
.tool-btn:active{transform:scale(.9)}
.tool-btn.dim{opacity:.42}
.tool-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#btn-full {top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
#btn-sound{top:calc(10px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right))}
#btn-pause{top:calc(10px + env(safe-area-inset-top));right:calc(114px + env(safe-area-inset-right))}

/* ================= 触屏控制 ================= */
#touch-bottom{
  position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));
  display:none;justify-content:space-between;align-items:flex-end;
  padding:0 18px;pointer-events:none;z-index:600;
}
#touch-bottom .group{display:flex;align-items:flex-end;gap:12px;pointer-events:auto}
.ctrl-btn{
  width:76px;height:76px;border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  background:rgba(20,10,10,.55);color:#fff;font-size:24px;font-weight:800;
  font-family:inherit;display:flex;align-items:center;justify-content:center;
  touch-action:none;pointer-events:auto;
  box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.14);
  transition:transform .08s,background .1s,box-shadow .1s;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.ctrl-btn.pressed{transform:scale(.88);box-shadow:0 2px 10px rgba(0,0,0,.7),inset 0 2px 10px rgba(0,0,0,.35)}
.ctrl-btn.dir{background:rgba(32,78,175,.55);border-color:rgba(150,190,255,.75)}
.ctrl-btn.dir.pressed{background:rgba(90,150,255,.85)}
.ctrl-btn.gas{background:rgba(30,150,70,.55);border-color:rgba(140,255,170,.8)}
.ctrl-btn.gas.pressed{background:rgba(60,220,110,.85)}
.ctrl-btn.brake{background:rgba(160,40,40,.55);border-color:rgba(255,150,150,.75)}
.ctrl-btn.brake.pressed{background:rgba(230,80,80,.85)}
.ctrl-btn.punch{background:rgba(215,60,35,.6);border-color:rgba(255,205,110,.9);font-size:28px}
.ctrl-btn.punch.pressed{background:rgba(255,140,60,.9)}
@media (pointer:coarse){#touch-bottom{display:flex}}
@media (max-width:620px){
  #touch-bottom{padding:0 12px}#touch-bottom .group{gap:10px}
  .ctrl-btn{width:66px;height:66px;font-size:21px}
  .ctrl-btn.punch{font-size:25px}
}
@media (max-width:500px){
  #touch-bottom{padding:0 8px}#touch-bottom .group{gap:7px}
  .ctrl-btn{width:56px;height:56px;font-size:18px}
  .ctrl-btn.punch{font-size:22px}
  .tool-btn{width:38px;height:38px;font-size:16px;border-radius:10px}
  #btn-sound{right:calc(54px + env(safe-area-inset-right))}
  #btn-pause{right:calc(98px + env(safe-area-inset-right))}
}
@media (max-width:390px){
  .ctrl-btn{width:50px;height:50px;font-size:16px}
  .ctrl-btn.punch{font-size:19px}
}

/* ================= 弹窗 ================= */
.overlay{
  position:fixed;inset:0;z-index:8000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:26px 20px;text-align:center;overflow-y:auto;
  background:
    radial-gradient(circle at 50% 30%,rgba(60,20,12,.92),rgba(8,4,4,.97) 70%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.overlay.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay h1{
  font-size:58px;letter-spacing:6px;font-weight:900;font-style:italic;line-height:1.1;
  background:linear-gradient(180deg,#fff2b0 0%,#ffd93b 25%,#ff6b35 60%,#b71c1c 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 26px rgba(255,90,40,.55));
  animation:titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow{50%{filter:drop-shadow(0 6px 34px rgba(255,150,60,.8))}}
.overlay h2{font-size:22px;color:var(--gold);letter-spacing:5px;font-weight:800}
.overlay p{font-size:13px;color:var(--muted);line-height:1.8}
.card{
  width:min(94vw,430px);border-radius:18px;padding:16px 18px;
  background:linear-gradient(180deg,rgba(40,20,16,.8),rgba(16,8,8,.9));
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
}
.how-to{
  text-align:left;font-size:12.5px;line-height:1.95;color:#e8d8cf;
}
.how-to b{display:inline-block;min-width:46px;color:var(--gold);font-weight:800}
.how-to .warn{color:#ff8a80}

.menu-btn{
  width:min(84vw,280px);padding:13px 26px;border-radius:30px;
  border:1px solid rgba(255,180,140,.35);
  background:linear-gradient(180deg,rgba(70,36,24,.9),rgba(34,16,12,.95));
  color:#ffe9dc;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:3px;
  cursor:pointer;transition:transform .13s,filter .15s,box-shadow .15s;
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
}
.menu-btn:hover{filter:brightness(1.2);box-shadow:0 10px 28px rgba(255,107,53,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.menu-btn:active{transform:scale(.96)}
.menu-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.menu-btn.primary{
  background:linear-gradient(160deg,#ff8a3d,#e53935 55%,#9b1c1c);
  border-color:rgba(255,200,150,.55);color:#fff;
  box-shadow:0 12px 30px rgba(229,57,53,.45),inset 0 1px 0 rgba(255,255,255,.35);
}
.menu-btn.primary:hover{box-shadow:0 14px 38px rgba(255,107,53,.65),inset 0 1px 0 rgba(255,255,255,.4)}

.stats-row{display:flex;gap:10px;justify-content:center;width:100%}
.stat-box{
  flex:1;max-width:130px;padding:10px 6px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
}
.stat-box .label{display:block;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:1.5px;margin-bottom:4px}
.stat-box .value{display:block;font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}

.rank-list{
  width:100%;border-radius:12px;padding:10px 14px;font-size:13px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
}
.rank-list .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:#d8c8c0}
.rank-list .row.player{color:var(--gold);font-weight:800}
.rank-list .row .pos{width:26px;text-align:left;opacity:.8}
.rank-list .row .nm{flex:1;text-align:left}
.rank-list .row .tm{font-variant-numeric:tabular-nums;opacity:.85}

.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;padding:10px 2px;font-size:13px;color:#e8d8cf;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.setting-row:last-child{border-bottom:none}
.setting-row input[type=range]{flex:1;max-width:180px;accent-color:var(--orange);height:4px}
.chip{
  padding:7px 16px;border-radius:20px;font-family:inherit;font-size:12px;font-weight:700;
  border:1px solid rgba(255,180,140,.35);background:rgba(255,255,255,.06);
  color:#ffe9dc;cursor:pointer;transition:all .15s;
}
.chip.on{background:linear-gradient(160deg,#ff8a3d,#e53935);border-color:transparent;color:#fff}
.seg{display:flex;border-radius:20px;overflow:hidden;border:1px solid rgba(255,180,140,.3)}
.seg button{
  padding:7px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  background:transparent;border:none;color:#cbb8ae;transition:all .15s;
}
.seg button.on{background:linear-gradient(160deg,#ff8a3d,#e53935);color:#fff}
.foot{margin-top:6px;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.3)}

@media (max-width:520px){
  .overlay h1{font-size:38px;letter-spacing:3px}
  .overlay h2{font-size:17px;letter-spacing:3px}
  .menu-btn{font-size:13.5px;padding:11px 20px;letter-spacing:2px}
  .stat-box .value{font-size:18px}
  .card{padding:12px 14px}
  .how-to{font-size:11.5px;line-height:1.85}
}
@media (max-height:520px){
  .overlay{gap:8px;padding:14px}
  .overlay h1{font-size:30px}
  .overlay h2{font-size:15px}
  .menu-btn{padding:9px 18px;font-size:12.5px}
  .how-to{font-size:11px;line-height:1.7}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>

<button id="btn-pause" class="tool-btn" title="暂停 (P)" aria-label="暂停">⏸</button>
<button id="btn-sound" class="tool-btn" title="音效 (M)" aria-label="音效">♪</button>
<button id="btn-full"  class="tool-btn" title="全屏 (F)" aria-label="全屏">⛶</button>

<div id="touch-bottom">
  <div class="group">
    <div class="ctrl-btn dir"   data-key="ArrowLeft"  aria-label="左">◀</div>
    <div class="ctrl-btn dir"   data-key="ArrowRight" aria-label="右">▶</div>
  </div>
  <div class="group">
    <div class="ctrl-btn brake" data-key="ArrowDown" aria-label="刹车">▼</div>
    <div class="ctrl-btn gas"   data-key="ArrowUp"   aria-label="油门">▲</div>
    <div class="ctrl-btn punch" data-key="Space"     aria-label="出拳">👊</div>
  </div>
</div>

<!-- 主菜单 -->
<div id="screen-main" class="overlay show">
  <h1>暴力摩托</h1>
  <h2>公 路 争 霸</h2>
  <div class="card how-to">
    <div><b>操作</b>← → 左右移动 · ▲ 油门 · ▼ 刹车 · 👊 出拳</div>
    <div><b>目标</b>第一个冲过终点线，拿下冠军</div>
    <div><b>战斗</b>贴近对手时出拳，把对手打下摩托</div>
    <div><b class="warn">小心</b><span class="warn">撞上汽车会掉血，冲出路面会减速</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-start">开 始 比 赛</button>
  <button class="menu-btn" id="cmd-settings">设 置</button>
  <p>最高名次 <b id="ui-best-rank">-</b> · 最佳时间 <b id="ui-best-time">-</b> · 最高得分 <b id="ui-best-score">-</b></p>
</div>

<!-- 设置 -->
<div id="screen-settings" class="overlay">
  <h2>设 置</h2>
  <div class="card">
    <div class="setting-row">
      <span>音效开关</span>
      <button class="chip on" id="set-sound">开 启</button>
    </div>
    <div class="setting-row">
      <span>音效音量</span>
      <input type="range" id="set-volume" min="0" max="100" value="35">
    </div>
    <div class="setting-row">
      <span>难度</span>
      <div class="seg" id="set-diff">
        <button data-diff="easy">简单</button>
        <button data-diff="normal" class="on">普通</button>
        <button data-diff="hard">困难</button>
      </div>
    </div>
  </div>
  <button class="menu-btn primary" id="cmd-settings-back">保 存 并 返 回</button>
</div>

<!-- 暂停 -->
<div id="screen-pause" class="overlay">
  <h2>暂 停</h2>
  <p>P / Esc 继续 · R 重开</p>
  <button class="menu-btn primary" id="cmd-resume">继 续 比 赛</button>
  <button class="menu-btn" id="cmd-restart">重 新 开 始</button>
  <button class="menu-btn" id="cmd-to-menu">返 回 菜 单</button>
</div>

<!-- 通关 -->
<div id="screen-win" class="overlay">
  <h1 id="win-title">冲 线 ！</h1>
  <h2 id="win-rank">第 1 名</h2>
  <div class="stats-row">
    <div class="stat-box"><span class="label">用时</span><span class="value" id="ui-win-time">0.0s</span></div>
    <div class="stat-box"><span class="label">击倒</span><span class="value" id="ui-win-knock">0</span></div>
    <div class="stat-box"><span class="label">得分</span><span class="value" id="ui-win-score">0</span></div>
  </div>
  <div class="rank-list" id="ui-win-ranklist"></div>
  <button class="menu-btn primary" id="cmd-next">再 来 一 局</button>
  <button class="menu-btn" id="cmd-win-menu">返 回 菜 单</button>
</div>

<!-- 失败 -->
<div id="screen-over" class="overlay">
  <h1 style="background:linear-gradient(180deg,#ff8a80,#ff1744 45%,#7a0000);-webkit-background-clip:text;background-clip:text;">被 击 倒 了</h1>
  <p>HP 归零，比赛结束</p>
  <div class="stats-row">
    <div class="stat-box"><span class="label">进度</span><span class="value" id="ui-over-dist">0%</span></div>
    <div class="stat-box"><span class="label">击倒</span><span class="value" id="ui-over-knock">0</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-over-retry">再 试 一 次</button>
  <button class="menu-btn" id="cmd-over-menu">返 回 菜 单</button>
</div>

<script>
'use strict';

/* ============================================================
   配置
   ============================================================ */
const CFG = {
  W: 960, H: 540,
  STEP: 1000 / 60,
  HORIZON_Y: 184,
  ROAD_HALF_W: 330,
  Z_FALLOFF: 0.52,
  MAX_VISIBLE_Z: 11,
  FINISH_DISTANCE: 90,
  PLAYER_MAX_SPEED: 2.35,
  PLAYER_ACCEL: 1.62,
  PLAYER_BRAKE: 3.8,
  PLAYER_DRAG: 0.55,
  PLAYER_LATERAL: 2.45,
  PLAYER_HP: 3,
  AI_HP: 3,
  ATTACK_CD: 0.32,
  HIT_CD: 0.9,
  SAVE_KEY: 'roadrash_v3'
};

const DIFF = {
  easy:   { aiMul: 0.92, hp: 4 },
  normal: { aiMul: 1.00, hp: 3 },
  hard:   { aiMul: 1.09, hp: 2 }
};

/* ============================================================
   工具
   ============================================================ */
const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  shade(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    let r = (num >> 16) + Math.round(255 * percent / 100);
    let g = ((num >> 8) & 0xff) + Math.round(255 * percent / 100);
    let b = (num & 0xff) + Math.round(255 * percent / 100);
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }
};

/* ============================================================
   存档
   ============================================================ */
const Save = {
  data: { bestRank: 99, bestTime: 999, bestScore: 0, soundOn: true, volume: 0.35, diff: 'normal' },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
    if (!DIFF[this.data.diff]) this.data.diff = 'normal';
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  }
};

/* ============================================================
   音效引擎（分层合成 + 压缩 + 混响 + 引擎/风噪）
   ============================================================ */
const Sound = {
  ctx: null, master: null, bus: null, revIn: null, noiseBuf: null,
  enabled: true, vol: 0.35, voices: 0, MAXV: 24,
  engine: null, lastRatio: -1, lastLoad: -1,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
      return this.ctx;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return null; }
      this.ctx = new AC({ latencyHint: 'interactive' });

      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 5;
      comp.attack.value = 0.003; comp.release.value = 0.24;

      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? this.vol : 0;

      this.bus = this.ctx.createGain();
      this.bus.gain.value = 0.9;

      this.bus.connect(this.master);
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      this.revIn = this.ctx.createBiquadFilter();
      this.revIn.type = 'lowpass';
      this.revIn.frequency.value = 2600;
      const conv = this.ctx.createConvolver();
      conv.buffer = this.makeIR(1.2, 2.6);
      const vOut = this.ctx.createGain();
      vOut.gain.value = 0.45;
      this.revIn.connect(conv); conv.connect(vOut); vOut.connect(this.master);

      this.noiseBuf = this.makeNoise(2.0);
      return this.ctx;
    } catch (e) {
      this.enabled = false;
      return null;
    }
  },

  makeNoise(sec) {
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  makeIR(sec, decay) {
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    const b = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return b;
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  setVolume(v) {
    this.vol = U.clamp(v, 0, 1);
    if (this.master) this.master.gain.setTargetAtTime(this.enabled ? this.vol : 0, this.ctx.currentTime, 0.03);
  },
  setEnabled(v) {
    this.enabled = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? this.vol : 0, this.ctx.currentTime, 0.03);
    if (!v) this.stopEngine();
  },

  route(g, o) {
    let tail = g;
    if (o.pan) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = U.clamp(o.pan, -1, 1);
      g.connect(p); tail = p;
    }
    tail.connect(this.bus);
    if (o.send) {
      const s = this.ctx.createGain();
      s.gain.value = o.send;
      tail.connect(s); s.connect(this.revIn);
    }
    return tail;
  },

  tone(o) {
    if (!this.enabled) return;
    const c = this.init(); if (!c) return;
    if (this.voices >= this.MAXV) return;
    const t0 = c.currentTime + (o.delay || 0);
    const dur = o.dur || 0.15;
    const osc = c.createOscillator();
    osc.type = o.type || 'square';
    const f0 = Math.max(20, o.f0 || 300);
    const f1 = Math.max(20, o.f1 === undefined ? f0 : o.f1);
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.9);

    const g = c.createGain();
    const peak = Math.max(0.0003, o.vol === undefined ? 0.25 : o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    let node = osc;
    if (o.filter) {
      const f = c.createBiquadFilter();
      f.type = o.filter.type || 'lowpass';
      f.frequency.setValueAtTime(Math.max(60, o.filter.f0 || 1200), t0);
      if (o.filter.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.filter.f1), t0 + dur);
      f.Q.value = o.filter.q || 0.9;
      node.connect(f); node = f;
    }
    node.connect(g);
    const out = this.route(g, o);
    this.voices++;
    osc.onended = () => {
      this.voices = Math.max(0, this.voices - 1);
      try { g.disconnect(); if (out) out.disconnect(); } catch (e) {}
    };
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  },

  burst(o) {
    if (!this.enabled) return;
    const c = this.init(); if (!c) return;
    if (this.voices >= this.MAXV) return;
    const t0 = c.currentTime + (o.delay || 0);
    const dur = o.dur || 0.15;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(Math.max(60, o.f0 || 2000), t0);
    if (o.f1 !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t0 + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0003, o.vol || 0.25), t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g);
    const out = this.route(g, o);
    this.voices++;
    src.onended = () => {
      this.voices = Math.max(0, this.voices - 1);
      try { g.disconnect(); if (out) out.disconnect(); } catch (e) {}
    };
    src.start(t0, Math.random() * 0.4);
    src.stop(t0 + dur + 0.05);
  },

  /* ---------- 引擎 + 风噪 ---------- */
  startEngine() {
    if (!this.enabled) return;
    const c = this.init(); if (!c || this.engine) return;

    const g = c.createGain(); g.gain.value = 0;
    const filt = c.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 380; filt.Q.value = 5;

    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 52;
    const o2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 104;
    const g2 = c.createGain(); g2.gain.value = 0.35;

    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 6.4;
    const lfoG = c.createGain(); lfoG.gain.value = 65;
    lfo.connect(lfoG); lfoG.connect(filt.frequency);

    o1.connect(filt); o2.connect(g2); g2.connect(filt);
    filt.connect(g); g.connect(this.bus);

    /* 风噪 */
    const wind = c.createBufferSource();
    wind.buffer = this.noiseBuf; wind.loop = true;
    const windF = c.createBiquadFilter();
    windF.type = 'bandpass'; windF.frequency.value = 900; windF.Q.value = 0.7;
    const windG = c.createGain(); windG.gain.value = 0;
    wind.connect(windF); windF.connect(windG); windG.connect(this.bus);

    o1.start(); o2.start(); lfo.start(); wind.start();
    g.gain.setTargetAtTime(0.014, c.currentTime, 0.1);

    this.engine = { o1, o2, lfo, g, filt, wind, windG, windF };
    this.lastRatio = -1;
    this.lastLoad = -1;
  },

  setEngine(ratio, load) {
    if (!this.engine || !this.ctx) return;
    if (Math.abs(ratio - this.lastRatio) < 0.02 && Math.abs(load - this.lastLoad) < 0.15) return;
    this.lastRatio = ratio; this.lastLoad = load;
    const t = this.ctx.currentTime;
    const e = this.engine;
    const rpm = 46 + ratio * 148 + load * 14;
    e.o1.frequency.setTargetAtTime(rpm * 0.5, t, 0.08);
    e.o2.frequency.setTargetAtTime(rpm, t, 0.08);
    e.filt.frequency.setTargetAtTime(300 + ratio * 980, t, 0.1);
    e.g.gain.setTargetAtTime(0.012 + ratio * 0.05 + load * 0.008, t, 0.08);
    e.windG.gain.setTargetAtTime(ratio * ratio * 0.07, t, 0.15);
    e.windF.frequency.setTargetAtTime(700 + ratio * 900, t, 0.15);
  },

  stopEngine() {
    if (!this.engine || !this.ctx) { this.engine = null; return; }
    const e = this.engine; this.engine = null;
    const t = this.ctx.currentTime;
    try {
      e.g.gain.cancelScheduledValues(t);
      e.g.gain.setTargetAtTime(0.0001, t, 0.05);
      e.windG.gain.setTargetAtTime(0.0001, t, 0.05);
    } catch (err) {}
    setTimeout(() => {
      try { e.o1.stop(); e.o2.stop(); e.lfo.stop(); e.wind.stop(); } catch (err) {}
    }, 260);
  },

  /* ---------- 具体音效 ---------- */
  ui() { this.tone({ f0: 720, f1: 900, dur: 0.05, type: 'sine', vol: 0.12 }); },

  punch() {
    this.burst({ dur: 0.13, vol: 0.32, type: 'bandpass', f0: 1100, f1: 320, q: 0.9 });
    this.tone({ f0: 160, f1: 60, dur: 0.1, type: 'sawtooth', vol: 0.28, filter: { type: 'lowpass', f0: 900, f1: 200 } });
  },
  impact() {
    this.burst({ dur: 0.16, vol: 0.38, type: 'lowpass', f0: 900, f1: 160 });
    this.tone({ f0: 110, f1: 42, dur: 0.16, type: 'square', vol: 0.34 });
  },
  crash() {
    this.burst({ dur: 0.4, vol: 0.45, type: 'lowpass', f0: 2600, f1: 180 });
    this.tone({ f0: 90, f1: 28, dur: 0.4, type: 'sawtooth', vol: 0.32, filter: { type: 'lowpass', f0: 700, f1: 110 } });
    [1420, 2180, 2960].forEach((f, i) => {
      this.tone({ f0: f, f1: f * 0.85, dur: 0.22 - i * 0.05, type: 'sine', vol: 0.05, send: 0.3 });
    });
  },
  knockoff() {
    this.crash();
    [520, 420, 330, 250, 170].forEach((f, i) => {
      this.tone({ f0: f, f1: f * 0.6, dur: 0.16, type: 'sawtooth', vol: 0.22, delay: 0.06 + i * 0.075, send: 0.25 });
    });
  },
  skid() {
    this.burst({ dur: 0.22, vol: 0.14, type: 'bandpass', f0: 1800, f1: 700, q: 1.6 });
  },
  countdown() { this.tone({ f0: 660, dur: 0.14, type: 'square', vol: 0.32 }); },
  go() {
    this.tone({ f0: 880, dur: 0.24, type: 'square', vol: 0.36 });
    this.tone({ f0: 1320, dur: 0.35, type: 'square', vol: 0.3, delay: 0.12 });
  },
  finish() {
    [523, 659, 784, 1046].forEach((f, i) => {
      this.tone({ f0: f, dur: 0.3, type: 'triangle', vol: 0.28, delay: i * 0.09, send: 0.3 });
    });
  },
  win() {
    [523, 659, 784, 1046, 1318, 1046, 1318].forEach((f, i) => {
      this.tone({ f0: f, dur: 0.16, type: 'triangle', vol: 0.3, delay: i * 0.11, send: 0.25 });
    });
  },
  lose() {
    [392, 349, 294, 262, 196].forEach((f, i) => {
      this.tone({ f0: f, f1: f * 0.96, dur: 0.24, type: 'sawtooth', vol: 0.26, delay: i * 0.17, filter: { type: 'lowpass', f0: 1600, f1: 600 }, send: 0.3 });
    });
  }
};

/* ============================================================
   输入
   ============================================================ */
const Input = {
  keys: Object.create(null),
  pointers: new Map(),

  init() {
    window.addEventListener('keydown', e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      const c = e.code;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(c)) e.preventDefault();
      this.keys[c] = true;
      Sound.init(); Sound.resume();
      if (c === 'KeyP' || c === 'Escape') { e.preventDefault(); Game.togglePause(); }
      if (c === 'KeyM') { e.preventDefault(); Game.toggleSound(); }
      if (c === 'KeyF') { e.preventDefault(); Game.toggleFullscreen(); }
      if (c === 'KeyR' && Game.state !== 'menu' && Game.state !== 'settings') Game.startRace();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => this.clear());

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      const key = btn.dataset.key;
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (this.pointers.has(e.pointerId)) return;
        this.pointers.set(e.pointerId, { el: btn, key });
        this.keys[key] = true;
        btn.classList.add('pressed');
        Sound.init(); Sound.resume();
      });
      const release = e => {
        const rec = this.pointers.get(e.pointerId);
        if (!rec) return;
        this.pointers.delete(e.pointerId);
        this.keys[rec.key] = false;
        rec.el.classList.remove('pressed');
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });

    const globalRelease = e => {
      const rec = this.pointers.get(e.pointerId);
      if (!rec) return;
      this.pointers.delete(e.pointerId);
      this.keys[rec.key] = false;
      rec.el.classList.remove('pressed');
    };
    window.addEventListener('pointerup', globalRelease);
    window.addEventListener('pointercancel', globalRelease);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        this.clear();
        if (Game.state === 'playing') Game.togglePause();
      } else {
        Sound.resume();
        Game.lastTime = 0;
      }
    });
  },

  clear() {
    for (const k in this.keys) this.keys[k] = false;
    this.pointers.clear();
    document.querySelectorAll('.ctrl-btn.pressed').forEach(el => el.classList.remove('pressed'));
  },

  left() { return !!(this.keys['ArrowLeft'] || this.keys['KeyA']); },
  right() { return !!(this.keys['ArrowRight'] || this.keys['KeyD']); },
  up() { return !!(this.keys['ArrowUp'] || this.keys['KeyW']); },
  down() { return !!(this.keys['ArrowDown'] || this.keys['KeyS']); },
  punch() { return !!(this.keys['Space'] || this.keys['KeyX'] || this.keys['KeyJ']); }
};

const SPRITES = {};
function getBikeSprite(color) {
  if (SPRITES[color]) return SPRITES[color];
  const W = 120, H = 215, S = 2;
  const cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const c = cv.getContext('2d');
  c.setTransform(S, 0, 0, S, 0, 0);
  c.translate(W / 2, 202);
  paintBike(c, color);
  const spr = { canvas: cv, w: W, h: H, ox: W / 2, oy: 202 };
  SPRITES[color] = spr;
  return spr;
}
