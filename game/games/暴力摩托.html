    c.stroke();
    c.fillStyle = '#222';
    c.beginPath(); c.ellipse(side * 46, -154, 8, 5, side * 0.3, 0, 6.284); c.fill();
    c.fillStyle = 'rgba(180,220,255,.6)';
    c.beginPath(); c.ellipse(side * 46, -154, 6, 3.5, side * 0.3, 0, 6.284); c.fill();
  }

  /* 头盔 */
  const helmGrad = c.createRadialGradient(-10, -168, 4, 0, -160, 28);
  helmGrad.addColorStop(0, U.shade(jacketColor, 28));
  helmGrad.addColorStop(0.5, jacketColor);
  helmGrad.addColorStop(1, U.shade(jacketColor, -58));
  c.fillStyle = helmGrad;
  c.beginPath(); c.arc(0, -160, 26, 0, 6.284); c.fill();

  c.fillStyle = 'rgba(255,255,255,.32)';
  c.beginPath(); c.ellipse(-8, -168, 8, 12, 0.3, 0, 6.284); c.fill();

  c.strokeStyle = '#fff';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(-20, -160);
  c.quadraticCurveTo(0, -180, 20, -160);
  c.stroke();

  c.strokeStyle = 'rgba(0,0,0,.5)';
  c.lineWidth = 2;
  c.beginPath(); c.arc(0, -160, 26, 0.2, Math.PI - 0.2); c.stroke();

  c.fillStyle = 'rgba(0,0,0,.4)';
  c.beginPath(); c.ellipse(0, -172, 8, 3, 0, 0, 6.284); c.fill();
}

function drawArms(c, color, attacking, dir, progress) {
  const arm = U.shade(color, -8);
  c.strokeStyle = arm;
  c.lineWidth = 10;
  c.lineCap = 'round';

  if (attacking) {
    const ext = Math.sin(progress * Math.PI) * 58;
    const isRight = dir > 0;
    const activeX = isRight ? 24 : -24;
    const passiveX = isRight ? -24 : 24;

    c.beginPath();
    c.moveTo(passiveX, -132);
    c.quadraticCurveTo(passiveX * 1.4, -120, passiveX * 1.25, -104);
    c.stroke();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(passiveX * 1.25, -102, 6, 0, 6.284); c.fill();

    c.strokeStyle = arm;
    c.beginPath();
    c.moveTo(activeX, -132);
    c.lineTo(activeX + dir * ext, -128);
    c.stroke();

    c.fillStyle = '#d9a574';
    c.beginPath(); c.arc(activeX + dir * (ext + 9), -128, 9.5, 0, 6.284); c.fill();
    c.fillStyle = 'rgba(255,255,255,.42)';
    c.beginPath(); c.arc(activeX + dir * (ext + 6), -131, 3, 0, 6.284); c.fill();

    c.strokeStyle = 'rgba(255,240,150,' + (0.9 - progress * 0.9) + ')';
    c.lineWidth = 3;
    c.beginPath();
    c.arc(activeX + dir * (ext + 9), -128, 14 + progress * 26, 0, 6.284);
    c.stroke();
  } else {
    c.beginPath();
    c.moveTo(-24, -132);
    c.quadraticCurveTo(-32, -120, -30, -104);
    c.stroke();
    c.beginPath();
    c.moveTo(24, -132);
    c.quadraticCurveTo(32, -120, 30, -104);
    c.stroke();
    c.fillStyle = '#111';
    c.beginPath();
    c.arc(-30, -102, 6, 0, 6.284);
    c.arc(30, -102, 6, 0, 6.284);
    c.fill();
  }
}

function drawBike(ctx2, cx, cy, scale, color, lean, arms) {
  const spr = getBikeSprite(color);
  ctx2.save();
  ctx2.translate(cx, cy);
  ctx2.rotate(lean * 0.34);
  ctx2.scale(scale, scale);
  ctx2.drawImage(spr.canvas, -spr.ox, -spr.oy, spr.w, spr.h);
  drawArms(ctx2, color, arms.attacking, arms.dir, arms.progress);
  ctx2.restore();
}

/* ============================================================
   游戏
   ============================================================ */
const Game = {
  canvas: null, ctx: null,
  state: 'menu',
  tick: 0, raceTime: 0, countdown: 0, lastCount: 0, goTimer: 0,
  player: null, ai: [], cars: [], scenery: [],
  cameraShake: 0, screenFlash: 0,
  floatTexts: [], particles: [],
  hitStop: 0, finishTimer: 0,
  vignette: null,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.vol = Save.data.volume;
    Sound.enabled = Save.data.soundOn;
    Input.init();
    UI.init();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    this.lastTime = 0; this.accumulator = 0;
    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    document.getElementById('btn-full').addEventListener('click', e => { e.preventDefault(); UI.blur(e); this.toggleFullscreen(); });
    document.getElementById('btn-sound').addEventListener('click', e => { e.preventDefault(); UI.blur(e); this.toggleSound(); });
    document.getElementById('btn-pause').addEventListener('click', e => { e.preventDefault(); UI.blur(e); this.togglePause(); });
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => {
        this.updateFsIcon();
        setTimeout(() => this.resize(), 150);
      }));
  },

  resize() {
    const ratio = CFG.W / CFG.H;
    const ww = window.innerWidth, wh = window.innerHeight;
    let w, h;
    if (ww / wh > ratio) { h = wh; w = h * ratio; }
    else { w = ww; h = w / ratio; }
    this.canvas.style.width = Math.round(w) + 'px';
    this.canvas.style.height = Math.round(h) + 'px';
    const vg = this.ctx.createRadialGradient(CFG.W / 2, CFG.H * 0.55, CFG.H * 0.35, CFG.W / 2, CFG.H * 0.55, CFG.W * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    this.vignette = vg;
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
        try {
          if (screen.orientation && screen.orientation.lock)
            await screen.orientation.lock('landscape').catch(() => {});
        } catch (e) {}
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.setEnabled(Save.data.soundOn);
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    UI.syncSettings();
  },
  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      Sound.stopEngine();
      UI.show('screen-pause');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      Sound.resume();
      Sound.startEngine();
      UI.hide('screen-pause');
      this.lastTime = 0;
    }
  },

  startRace() {
    Sound.init(); Sound.resume(); Sound.ui();
    UI.hideAll();

    this.state = 'playing';
    this.tick = 0;
    this.raceTime = 0;
    this.countdown = 3.0;
    this.lastCount = 4;
    this.goTimer = 0;
    this.finishTimer = 0;
    this.hitStop = 0;
    this.cameraShake = 0;
    this.screenFlash = 0;
    this.floatTexts = [];
    this.particles = [];
    this.accumulator = 0;
    this.lastTime = 0;

    const diff = DIFF[Save.data.diff] || DIFF.normal;
    this.player = makePlayer();
    this.player.maxHp = Math.max(1, diff.hp);
    this.player.hp = this.player.maxHp;

    this.ai = [];
    for (let i = 0; i < 5; i++) this.ai.push(makeAIRacer(i, diff.aiMul));

    this.cars = [];
    const carColors = ['#90a4ae', '#eceff1', '#5c6bc0', '#ef5350', '#66bb6a', '#ffb300', '#8d6e63', '#26a69a'];
    for (let i = 0; i < 42; i++) {
      this.cars.push(makeCar(
        U.rand(-0.78, 0.78),
        10 + i * 1.9 + U.rand(-0.5, 0.5),
        U.rand(0.45, 0.95),
        U.pick(carColors)
      ));
    }

    this.scenery = [];
    for (let i = 0; i < 150; i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      this.scenery.push({
        z: 3 + i * 1.05 + U.rand(-0.35, 0.35),
        side,
        type: U.pick(['tree', 'tree', 'tree', 'rock', 'sign', 'pole']),
        size: U.rand(0.8, 1.35),
        phase: Math.random() * 6.28
      });
    }
    for (let z = 10; z < CFG.FINISH_DISTANCE; z += 10) {
      this.scenery.push({ z, side: 1, type: 'distance', size: 1, phase: 0, label: String(z) });
    }
    this.scenery.sort((a, b) => a.z - b.z);

    Sound.startEngine();
    this.updateSoundEngine(0);
  },

  lastTime: 0, accumulator: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator += delta;
    let guard = 0;
    while (this.accumulator >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator = 0;
    this.render();
  },

  update() {
    this.tick++;
    if (this.state === 'menu' || this.state === 'paused') return;

    if (this.state !== 'playing') { this.updateEffects(); return; }

    const dt = 1 / 60;

    if (this.hitStop > 0) {
      this.hitStop -= dt;
      this.updateEffects();
      return;
    }

    if (this.countdown > 0) {
      this.countdown -= dt;
      const c = Math.ceil(this.countdown);
      if (c > 0 && c !== this.lastCount) {
        this.lastCount = c;
        Sound.countdown();
      }
      if (this.countdown <= 0) {
        this.countdown = 0;
        this.goTimer = 1.1;
        Sound.go();
      } else {
        this.updateEffects();
        this.updateSoundEngine(0);
        return;
      }
    }
    if (this.goTimer > 0) this.goTimer -= dt;

    this.raceTime += dt;
    this.updatePlayer(dt);
    for (const ai of this.ai) this.updateAI(ai, dt);
    this.updateCars(dt);

    this.checkCollisions();
    this.handlePunch();
    this.updateEffects();
    this.updateSoundEngine(dt);

    if (!this.player.finished && this.player.z >= CFG.FINISH_DISTANCE) this.finishPlayer();

    if (this.finishTimer > 0) {
      this.finishTimer -= dt;
      if (this.finishTimer <= 0) this.onFinish();
    }

    if (this.player.hp <= 0 && !this.player.finished && this.state === 'playing') this.onLose();
  },

  updateSoundEngine(dt) {
    const p = this.player;
    if (!p) return;
    const ratio = U.clamp(p.speed / CFG.PLAYER_MAX_SPEED, 0, 1);
    Sound.setEngine(ratio, p.throttle ? 1 : 0);
  },

  updatePlayer(dt) {
    const p = this.player;
    if (p.attackCd > 0) p.attackCd -= dt;
    if (p.hitCd > 0) p.hitCd -= dt;
    if (p.attackAnim > 0) p.attackAnim -= dt;
    else p._punchHit = false;

    if (p.finished) {
      p.speed = Math.max(1.0, p.speed - 0.55 * dt);
      p.z += p.speed * dt;
      p.x = U.lerp(p.x, 0.35, dt * 1.2);
      p.leanAngle = U.lerp(p.leanAngle, 0, dt * 4);
      p.throttle = false;
      return;
    }

    p.throttle = Input.up();
    if (Input.up()) p.speed += CFG.PLAYER_ACCEL * dt;
    else if (Input.down()) p.speed -= CFG.PLAYER_BRAKE * dt;
    else {
      const target = CFG.PLAYER_MAX_SPEED * 0.72;
      if (p.speed < target) p.speed += CFG.PLAYER_ACCEL * 0.52 * dt;
      else p.speed -= CFG.PLAYER_DRAG * dt;
    }

    p.offRoad = Math.abs(p.x) > 0.8;
    if (p.offRoad) {
      p.speed -= 1.35 * dt;
      if (Math.random() < 0.55) {
        this.spawnParticles(p.x + U.rand(-0.05, 0.05), p.z - 0.25, 'rgba(150,120,80,0.65)', 1, {
          vx: U.rand(-0.3, 0.3), vy: U.rand(10, 40), size: U.rand(3, 7), life: 34
        });
      }
      this.cameraShake = Math.max(this.cameraShake, 2);
    }

    if (Input.down() && p.speed > 1.4 && Math.random() < 0.35) {
      this.spawnParticles(p.x - 0.1, p.z - 0.2, 'rgba(220,220,220,0.4)', 1, {
        vx: U.rand(-0.4, 0.4), vy: U.rand(6, 22), size: U.rand(2, 5), life: 26
      });
      if (Math.random() < 0.02) Sound.skid();
    }

    p.speed = U.clamp(p.speed, 0.25, CFG.PLAYER_MAX_SPEED);
    p.z += p.speed * dt;

    let lat = 0;
    if (Input.left()) lat -= 1;
    if (Input.right()) lat += 1;
    const latScale = 1 - (p.speed / CFG.PLAYER_MAX_SPEED) * 0.24;
    p.vx = lat * CFG.PLAYER_LATERAL * latScale;
    p.x = U.clamp(p.x + p.vx * dt, -0.94, 0.94);

    p.leanAngle = U.lerp(p.leanAngle, -p.vx * 0.36, dt * 9);
    p.bob = Math.sin(this.tick * 0.55) * (0.6 + p.speed * 0.6);

    if (Input.punch() && p.attackCd <= 0) {
      p.attackCd = CFG.ATTACK_CD;
      p.attackAnim = 0.26;
      p.attackDir = p.vx >= 0 ? 1 : -1;
      p._punchHit = false;
      Sound.punch();
      this.cameraShake = Math.max(this.cameraShake, 2.5);
    }
  },

  updateAI(ai, dt) {
    if (!ai.alive) {
      ai.knockTimer -= dt;
      ai.fallT += dt;
      if (ai.knockTimer <= 0) {
        ai.alive = true;
        ai.hp = ai.maxHp;
        ai.z = Math.max(0.5, this.player.z - 6);
        ai.x = U.rand(-0.55, 0.55);
        ai.speed = ai.baseSpeed * 0.85;
        ai.fallT = 0;
        ai.hitCd = 1.0;
        this.spawnParticles(ai.x, ai.z, ai.color, 10, {
          vx: U.rand(-1, 1), vy: U.rand(20, 60), size: U.rand(3, 8), life: 30
        });
      }
      return;
    }

    if (ai.finished) { ai.z += ai.speed * dt; return; }

    if (ai.hitCd > 0) ai.hitCd -= dt;

    const lead = ai.z - this.player.z;
    let target = ai.baseSpeed;
    if (lead < -3.5) target += 0.22;
    else if (lead < -1.5) target += 0.10;
    if (lead > 6) target -= 0.20;
    else if (lead > 3.5) target -= 0.08;

    /* 躲避前方汽车 */
    let avoid = 0;
    for (const car of this.cars) {
      const dz = car.z - ai.z;
      if (dz > 0.3 && dz < 2.6 && Math.abs(car.x - ai.x) < 0.28) {
        avoid = car.x > ai.x ? -1 : 1;
        break;
      }
    }

    if (ai.speed < target) ai.speed += 0.9 * dt;
    else ai.speed -= 1.2 * dt;
    ai.speed = U.clamp(ai.speed, 0.7, CFG.PLAYER_MAX_SPEED * 1.02);
    ai.z += ai.speed * dt;

    ai.laneTimer -= dt;
    if (ai.laneTimer <= 0) {
      ai.laneTimer = U.rand(1.6, 3.6);
      ai.laneTarget = U.rand(-0.7, 0.7);
    }

    let ddx = ai.laneTarget - ai.x;
    if (avoid !== 0) ddx = avoid * 0.9;
    const latSpeed = 0.35 + ai.speed * 0.35;
    ai.x += U.clamp(ddx * 2, -latSpeed * dt, latSpeed * dt);
    ai.x = U.clamp(ai.x, -0.86, 0.86);

    ai.leanAngle = U.lerp(ai.leanAngle, -U.clamp(ddx * 0.5, -0.45, 0.45), dt * 7);
    ai.bob = Math.sin(this.tick * 0.6 + ai.id * 1.7) * (0.5 + ai.speed * 0.5);

    /* 攻击玩家 */
    const zDiff = ai.z - this.player.z;
    const xDiff = ai.x - this.player.x;
    if (Math.abs(zDiff) < 0.5 && Math.abs(xDiff) < 0.42 && !this.player.finished) {
      ai.attackCd -= dt;
      if (ai.attackCd <= 0 && Math.random() < 0.03) {
        ai.attackCd = U.rand(1.1, 2.2);
        this.aiAttackPlayer(ai);
      }
    } else if (ai.attackCd > 0) {
      ai.attackCd -= dt;
    }

    if (!ai.finished && ai.z >= CFG.FINISH_DISTANCE) {
      ai.finished = true;
      ai.finishTime = this.raceTime + Math.max(0, ai.z - CFG.FINISH_DISTANCE) / Math.max(ai.speed, 0.2);
    }
  },

  updateCars(dt) {
    const pz = this.player.z;
    for (const car of this.cars) {
      car.z += car.speed * dt;
      if (car.z < pz - 7) {
        car.z = pz + 50 + U.rand(0, 30);
        car.x = U.rand(-0.8, 0.8);
        car.speed = U.rand(0.45, 0.95);
        const colors = ['#90a4ae', '#eceff1', '#5c6bc0', '#ef5350', '#66bb6a', '#ffb300', '#8d6e63', '#26a69a'];
        car.color = U.pick(colors);
      }
      /* AI 撞车 */
      for (const ai of this.ai) {
        if (!ai.alive || ai.finished) continue;
        if (Math.abs(car.z - ai.z) < 0.3 && Math.abs(car.x - ai.x) < 0.24 && ai.hitCd <= 0) {
          ai.speed *= 0.55;
          ai.hitCd = 1.2;
          this.spawnParticles(ai.x, ai.z, '#ffb300', 8, {
            vx: U.rand(-0.8, 0.8), vy: U.rand(20, 50), size: U.rand(3, 6), life: 24
          });
        }
      }
    }
  },

  aiAttackPlayer(ai) {
    const p = this.player;
    if (p.hitCd > 0 || p.finished) return;
    p.hp = Math.max(0, p.hp - 1);
    p.hitCd = CFG.HIT_CD;
    p.speed *= 0.68;
    this.cameraShake = 9;
    this.screenFlash = 0.28;
    this.hitStop = 0.05;
    Sound.impact();
    this.addFloat(p.x, p.z + 0.15, '-1 HP', '#ff5252');
    this.spawnParticles(p.x, p.z, '#ff5252', 10, {
      vx: U.rand(-0.8, 0.8), vy: U.rand(24, 70), size: U.rand(3, 7), life: 30
    });
  },

  handlePunch() {
    const p = this.player;
    if (p.attackAnim <= 0 || p.attackAnim > 0.21) return;
    if (p._punchHit) return;

    let best = null, bestD = 1e9;
    for (const ai of this.ai) {
      if (!ai.alive || ai.finished) continue;
      const zDiff = ai.z - p.z;
      const xDiff = ai.x - p.x;
      if (Math.abs(zDiff) < 0.68 && Math.abs(xDiff) < 0.44) {
        if (Math.sign(xDiff) === p.attackDir || Math.abs(xDiff) < 0.16) {
          const d = Math.abs(zDiff) + Math.abs(xDiff);
          if (d < bestD) { bestD = d; best = ai; }
        }
      }
    }
    if (best) {
      p._punchHit = true;
      this.damageAI(best, p.attackDir);
    }
  },

  damageAI(ai, dir) {
    ai.hp--;
    ai.hitCd = 0.55;
    this.hitStop = 0.045;
    if (ai.hp <= 0) {
      ai.alive = false;
      ai.knockTimer = 3.6;
      ai.fallT = 0;
      ai.fallDir = dir || 1;
      ai.speed = 0;
      this.player.knockCount++;
      this.cameraShake = 12;
      this.screenFlash = 0.22;
      this.hitStop = 0.09;
      Sound.knockoff();
      this.addFloat(ai.x, ai.z + 0.2, '击倒！', '#ffd93b');
      this.spawnParticles(ai.x, ai.z, ai.color, 16, {
        vx: U.rand(-1.4, 1.4), vy: U.rand(30, 90), size: U.rand(3, 9), life: 40
      });
      this.spawnParticles(ai.x, ai.z, '#ffb300', 10, {
        vx: U.rand(-1, 1), vy: U.rand(20, 60), size: U.rand(2, 5), life: 28
      });
    } else {
      ai.speed *= 0.55;
      ai.x = U.clamp(ai.x + dir * 0.16, -0.88, 0.88);
      this.cameraShake = 6;
      Sound.impact();
      this.addFloat(ai.x, ai.z + 0.2, '命中！', '#ffffff');
      this.spawnParticles(ai.x, ai.z, ai.color, 8, {
        vx: U.rand(-0.8, 0.8), vy: U.rand(20, 55), size: U.rand(2, 6), life: 24
      });
    }
  },

  checkCollisions() {
    const p = this.player;
    if (p.finished) return;

    for (const car of this.cars) {
      if (Math.abs(car.z - p.z) < 0.42 && Math.abs(car.x - p.x) < 0.30 && p.hitCd <= 0) {
        p.hp = Math.max(0, p.hp - 1);
        p.hitCd = CFG.HIT_CD;
        p.speed *= 0.38;
        p.x += (p.x >= car.x ? 1 : -1) * 0.16;
        p.x = U.clamp(p.x, -0.92, 0.92);
        this.cameraShake = 15;
        this.screenFlash = 0.45;
        this.hitStop = 0.08;
        Sound.crash();
        this.addFloat(p.x, p.z + 0.15, '-1 HP', '#ff5252');
        this.spawnParticles(p.x, p.z, '#ffb300', 14, {
          vx: U.rand(-1.4, 1.4), vy: U.rand(30, 90), size: U.rand(3, 8), life: 36
        });
        return;
      }
    }

    for (const ai of this.ai) {
      if (!ai.alive || ai.finished) continue;
      const zDiff = ai.z - p.z;
      const xDiff = ai.x - p.x;
      if (Math.abs(zDiff) < 0.26 && Math.abs(xDiff) < 0.20) {
        const push = xDiff === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(xDiff);
        ai.x = U.clamp(ai.x + push * 0.012, -0.88, 0.88);
        p.x = U.clamp(p.x - push * 0.012, -0.94, 0.94);
        p.speed *= 0.975;
        ai.speed *= 0.975;
      }
    }
  },

  finishPlayer() {
    const p = this.player;
    p.finished = true;
    p.finishTime = this.raceTime;
    this.finishTimer = 1.35;
    this.screenFlash = 0.3;
    this.cameraShake = 6;
    Sound.finish();
    Sound.stopEngine();
    this.addFloat(0, p.z + 0.4, 'FINISH!', '#ffd93b');
  },

  addFloat(x, z, text, color) {
    this.floatTexts.push({ x, z, text, color: color || '#fff', life: 66, maxLife: 66 });
  },

  spawnParticles(x, z, color, n, opt) {
    opt = opt || {};
    for (let i = 0; i < n; i++) {
      this.particles.push({
        x: x + U.rand(-0.04, 0.04),
        z: z,
        vx: opt.vx !== undefined ? opt.vx * U.rand(0.5, 1) : U.rand(-0.4, 0.4),
        vy: opt.vy !== undefined ? opt.vy * U.rand(0.6, 1) : U.rand(10, 40),
        vz: U.rand(-0.1, 0.1),
        size: opt.size !== undefined ? opt.size * U.rand(0.7, 1.2) : U.rand(3, 7),
        color,
        life: opt.life || 30,
        maxLife: opt.life || 30,
        rot: Math.random() * 6.28
      });
    }
  },

  updateEffects() {
    if (this.cameraShake > 0) this.cameraShake *= 0.86;
    if (this.screenFlash > 0) this.screenFlash -= 0.035;
    if (this.screenFlash < 0) this.screenFlash = 0;

    for (let i = this.floatTexts.length - 1; i >= 0; i--) {
      const f = this.floatTexts[i];
      f.z += 0.018;
      f.life--;
      if (f.life <= 0) this.floatTexts.splice(i, 1);
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * 0.02;
      pt.z += pt.vz * 0.02;
      pt.vx *= 0.985;
      pt.life--;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
  },

  onFinish() {
    const p = this.player;
    const entries = [{
      name: '你', isPlayer: true,
      time: p.finishTime,
      z: p.z
    }];
    for (const a of this.ai) {
      const t = a.finished
        ? a.finishTime
        : this.raceTime + Math.max(0, CFG.FINISH_DISTANCE - a.z) / Math.max(a.speed, 0.4);
      entries.push({ name: a.name, isPlayer: false, time: t, z: a.z, alive: a.alive });
    }
    entries.sort((a, b) => a.time - b.time);

    const rank = entries.findIndex(e => e.isPlayer) + 1;
    const score = Math.max(0, (6 - rank) * 700) + p.knockCount * 400 +
                  Math.round(Math.max(0, 70 - p.finishTime) * 10);

    Save.data.bestRank = Math.min(Save.data.bestRank, rank);
    Save.data.bestTime = Math.min(Save.data.bestTime, p.finishTime);
    Save.data.bestScore = Math.max(Save.data.bestScore, score);
    Save.save();

    Sound.stopEngine();
    if (rank === 1) Sound.win(); else Sound.finish();

    this.state = 'win';
    UI.setWin(rank, p.finishTime, p.knockCount, score, entries);
    UI.show('screen-win');
  },

  onLose() {
    Sound.stopEngine();
    Sound.lose();
    this.state = 'over';
    const progress = Math.min(100, Math.floor(this.player.z / CFG.FINISH_DISTANCE * 100));
    UI.setOver(progress, this.player.knockCount);
    UI.show('screen-over');
  },

  getPlayerRank() {
    const list = [{ z: this.player.z, t: this.player.finished ? this.player.finishTime : 1e9, me: true }];
    for (const a of this.ai) {
      list.push({ z: a.z, t: a.finished ? a.finishTime : 1e9, me: false });
    }
    list.sort((a, b) => {
      if (a.t !== b.t) return a.t - b.t;
      return b.z - a.z;
    });
    return list.findIndex(e => e.me) + 1;
  },

  /* ============================================================
     渲染
     ============================================================ */
  render() {
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CFG.W, CFG.H);

    ctx.save();
    if (this.cameraShake > 0.4) {
      ctx.translate((Math.random() - 0.5) * this.cameraShake, (Math.random() - 0.5) * this.cameraShake);
    }

    this.drawSky();
    this.drawMountains();
    this.drawRoad();
    this.drawScenery();
    this.drawSpeedLines();
    this.drawEntities();
    this.drawPlayer();
    this.drawParticles();
    this.drawHUD();
    this.drawCountdown();
    ctx.restore();

    if (this.vignette) {
      ctx.fillStyle = this.vignette;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }
    if (this.screenFlash > 0) {
      ctx.fillStyle = 'rgba(255,240,220,' + this.screenFlash + ')';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }
  },

  drawSky() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, CFG.HORIZON_Y + 50);
    g.addColorStop(0, '#2a5fa8');
    g.addColorStop(0.5, '#6fa8dc');
    g.addColorStop(1, '#cfe6f5');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.HORIZON_Y + 50);

    const sunX = CFG.W * 0.76, sunY = 86;
    const sg = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 120);
    sg.addColorStop(0, 'rgba(255,250,210,.95)');
    sg.addColorStop(0.25, 'rgba(255,225,150,.55)');
    sg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sunX, sunY, 120, 0, 6.284); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,235,.95)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 34, 0, 6.284); ctx.fill();

    const off = (this.player ? this.player.z * 26 : 0) % (CFG.W + 320);
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 250 + off) % (CFG.W + 320)) - 160;
      const cy = 44 + (i * 41) % 82;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + (i % 2) * 0.2) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, 20, 0, 6.284);
      ctx.arc(cx + 22, cy - 8, 26, 0, 6.284);
      ctx.arc(cx + 50, cy, 18, 0, 6.284);
      ctx.arc(cx + 25, cy + 9, 22, 0, 6.284);
      ctx.fill();
    }
  },

  drawMountains() {
    const ctx = this.ctx;
    const px = this.player ? this.player.x : 0;
    const parallax = -px * 34;

    ctx.fillStyle = '#5b7fa0';
    ctx.beginPath();
    ctx.moveTo(-120 + parallax, CFG.HORIZON_Y + 2);
    for (let i = 0; i <= 12; i++) {
      const x = i * 100 - 120 + parallax;
      const h = 46 + Math.sin(i * 1.7) * 30 + Math.cos(i * 0.9) * 22;
      ctx.lineTo(x, CFG.HORIZON_Y - h);
    }
    ctx.lineTo(CFG.W + 120 + parallax, CFG.HORIZON_Y + 2);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#496b4f';
    ctx.beginPath();
    ctx.moveTo(-120 - parallax * 0.6, CFG.HORIZON_Y + 2);
    for (let i = 0; i <= 9; i++) {
      const x = i * 140 - 120 - parallax * 0.6;
      const h = 26 + Math.sin(i * 2.3) * 22;
      ctx.lineTo(x, CFG.HORIZON_Y - h);
    }
    ctx.lineTo(CFG.W + 120 - parallax * 0.6, CFG.HORIZON_Y + 2);
    ctx.closePath(); ctx.fill();
  },

  drawRoad() {
    const ctx = this.ctx;
    const cam = this.player.z - 0.35;

    /* 草地 */
    const gg = ctx.createLinearGradient(0, CFG.HORIZON_Y, 0, CFG.H);
    gg.addColorStop(0, '#6d8f52');
    gg.addColorStop(0.35, '#587a42');
    gg.addColorStop(1, '#3f5c2e');
    ctx.fillStyle = gg;
    ctx.fillRect(0, CFG.HORIZON_Y, CFG.W, CFG.H - CFG.HORIZON_Y);

    const zNear = 0.16, zFar = CFG.MAX_VISIBLE_Z;

    /* 路肩 */
    ctx.fillStyle = '#8a7d63';
    ctx.beginPath();
    ctx.moveTo(View.x(-1.16, zFar), View.y(zFar));
    ctx.lineTo(View.x(-1.16, zNear), View.y(zNear));
    ctx.lineTo(View.x(-1.0, zNear), View.y(zNear));
    ctx.lineTo(View.x(-1.0, zFar), View.y(zFar));
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(View.x(1.0, zFar), View.y(zFar));
    ctx.lineTo(View.x(1.0, zNear), View.y(zNear));
    ctx.lineTo(View.x(1.16, zNear), View.y(zNear));
    ctx.lineTo(View.x(1.16, zFar), View.y(zFar));
    ctx.closePath(); ctx.fill();

    /* 沥青 */
    const rg = ctx.createLinearGradient(0, CFG.HORIZON_Y, 0, CFG.H);
    rg.addColorStop(0, '#5c5c5c');
    rg.addColorStop(0.25, '#3e3e3e');
    rg.addColorStop(1, '#292929');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(View.x(-1, zFar), View.y(zFar));
    ctx.lineTo(View.x(-1, zNear), View.y(zNear));
    ctx.lineTo(View.x(1, zNear), View.y(zNear));
    ctx.lineTo(View.x(1, zFar), View.y(zFar));
    ctx.closePath(); ctx.fill();

    /* 路缘红白条 */
    const spacing = 0.55;
    const phase = cam % spacing;
    for (let i = 0; i < 24; i++) {
      const z1 = i * spacing - phase;
      const z2 = z1 + spacing * 0.5;
      if (z2 < zNear || z1 > zFar) continue;
      const a = Math.max(z1, zNear), b = Math.min(z2, zFar);
      const idx = Math.floor((cam + i * spacing) / spacing);
      ctx.fillStyle = (idx % 2 === 0) ? '#e53935' : '#f5f5f5';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(View.x(side * 1.0, b), View.y(b));
        ctx.lineTo(View.x(side * 1.0, a), View.y(a));
        ctx.lineTo(View.x(side * 0.93, a), View.y(a));
        ctx.lineTo(View.x(side * 0.93, b), View.y(b));
        ctx.closePath(); ctx.fill();
      }
    }

    /* 车道虚线 */
    const dashSpacing = 0.62, dashLen = 0.28;
    const dashPhase = cam % dashSpacing;
    for (const laneX of [-0.5, 0.5]) {
      for (let i = 0; i < 22; i++) {
        const z1 = i * dashSpacing - dashPhase;
        const z2 = z1 + dashLen;
        if (z2 < zNear || z1 > zFar) continue;
        const a = Math.max(z1, zNear), b = Math.min(z2, zFar);
        const midZ = (a + b) / 2;
        const w = Math.max(1.2, 6 * View.scale(midZ));
        ctx.strokeStyle = 'rgba(248,248,240,.85)';
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(View.x(laneX, a), View.y(a));
        ctx.lineTo(View.x(laneX, b), View.y(b));
        ctx.stroke();
      }
    }

    /* 终点线 */
    const finishRel = CFG.FINISH_DISTANCE - cam;
    if (finishRel > zNear - 1 && finishRel < zFar + 3) {
      const z1 = Math.max(finishRel - 0.5, zNear);
      const z2 = Math.min(finishRel, zFar);
      if (z2 > z1) {
        const cols = 16;
        for (let i = 0; i < cols; i++) {
          const t1 = i / cols, t2 = (i + 1) / cols;
          ctx.fillStyle = (i % 2 === 0) ? '#101010' : '#fafafa';
          ctx.beginPath();
          ctx.moveTo(View.x(-1 + 2 * t1, z1), View.y(z1));
          ctx.lineTo(View.x(-1 + 2 * t2, z1), View.y(z1));
          ctx.lineTo(View.x(-1 + 2 * t2, z2), View.y(z2));
          ctx.lineTo(View.x(-1 + 2 * t1, z2), View.y(z2));
          ctx.closePath(); ctx.fill();
        }
        /* 龙门架 */
        if (finishRel < zFar) {
          const sc = View.scale(finishRel);
          const xl = View.x(-1.18, finishRel);
          const xr = View.x(1.18, finishRel);
          const yb = View.y(finishRel);
          const postH = 190 * sc;
          ctx.fillStyle = '#37474f';
          ctx.fillRect(xl - 6 * sc, yb - postH, 12 * sc, postH);
          ctx.fillRect(xr - 6 * sc, yb - postH, 12 * sc, postH);
          ctx.fillStyle = '#263238';
          ctx.fillRect(xl, yb - postH - 26 * sc, xr - xl, 26 * sc);
          ctx.fillStyle = '#ffd93b';
          ctx.font = 'bold ' + Math.max(8, Math.round(22 * sc)) + 'px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('FINISH', (xl + xr) / 2, yb - postH - 13 * sc);
        }
      }
    }
  },

  drawScenery() {
    const ctx = this.ctx;
    const cam = this.player.z - 0.35;
    for (const d of this.scenery) {
      const relZ = d.z - cam;
      if (relZ < 0.16 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const sc = View.scale(relZ);
      const baseX = View.x(d.side * 1.55, relZ);
      const baseY = View.y(relZ);
      const size = 40 * sc * d.size;

      if (d.type === 'tree') {
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + 2, size * 0.5, size * 0.12, 0, 0, 6.284);
        ctx.fill();
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(baseX - size * 0.08, baseY - size, size * 0.16, size);
        ctx.fillStyle = '#2e7a2e';
        ctx.beginPath();
        ctx.arc(baseX, baseY - size * 1.15, size * 0.6, 0, 6.284);
        ctx.arc(baseX - size * 0.35, baseY - size * 0.85, size * 0.45, 0, 6.284);
        ctx.arc(baseX + size * 0.35, baseY - size * 0.85, size * 0.45, 0, 6.284);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.beginPath();
        ctx.arc(baseX - size * 0.15, baseY - size * 1.28, size * 0.26, 0, 6.284);
        ctx.fill();
      } else if (d.type === 'rock') {
        ctx.fillStyle = '#6d6d6d';
        ctx.beginPath();
        ctx.ellipse(baseX, baseY - size * 0.25, size * 0.5, size * 0.34, 0, 0, 6.284);
        ctx.fill();
        ctx.fillStyle = '#8a8a8a';
        ctx.beginPath();
        ctx.ellipse(baseX - size * 0.1, baseY - size * 0.38, size * 0.25, size * 0.15, 0, 0, 6.284);
        ctx.fill();
      } else if (d.type === 'sign') {
        ctx.fillStyle = '#8a8a8a';
        ctx.fillRect(baseX - size * 0.05, baseY - size * 1.2, size * 0.1, size * 1.2);
        ctx.fillStyle = '#2a5a9a';
        ctx.fillRect(baseX - size * 0.4, baseY - size * 1.5, size * 0.8, size * 0.4);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(6, Math.round(size * 0.26)) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('→', baseX, baseY - size * 1.3);
      } else if (d.type === 'pole') {
        ctx.fillStyle = '#cfd8dc';
        ctx.fillRect(baseX - size * 0.05, baseY - size * 1.9, size * 0.1, size * 1.9);
        ctx.fillStyle = '#ff5252';
        ctx.beginPath();
        ctx.arc(baseX, baseY - size * 1.85, Math.max(1.5, size * 0.09), 0, 6.284);
        ctx.fill();
      } else if (d.type === 'distance') {
        ctx.fillStyle = '#9e9e9e';
        ctx.fillRect(baseX - size * 0.04, baseY - size, size * 0.08, size);
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(baseX - size * 0.36, baseY - size * 1.3, size * 0.72, size * 0.36);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(6, Math.round(size * 0.24)) + 'px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(d.label, baseX, baseY - size * 1.12);
      }
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  },

  drawSpeedLines() {
    const p = this.player;
    if (!p || p.speed < 1.55) return;
    const ctx = this.ctx;
    const intensity = (p.speed - 1.55) / (CFG.PLAYER_MAX_SPEED - 1.55);
    ctx.strokeStyle = 'rgba(255,255,255,' + (intensity * 0.16) + ')';
    ctx.lineWidth = 2;
    const t = this.tick * 1.4;
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * 6.284;
      const r1 = 260 + ((t + i * 37) % 120);
      const r2 = r1 + 90 + intensity * 60;
      const cx = CFG.W / 2, cy = CFG.H * 0.55;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r1 * 1.5, cy + Math.sin(ang) * r1);
      ctx.lineTo(cx + Math.cos(ang) * r2 * 1.5, cy + Math.sin(ang) * r2);
      ctx.stroke();
    }
  },

  drawShadow(x, y, sc, w) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4 * sc, 46 * sc * w, 12 * sc, 0, 0, 6.284);
    ctx.fill();
  },

  drawEntities() {
    const ctx = this.ctx;
    const cam = this.player.z - 0.35;
    const list = [];

    for (const car of this.cars) {
      const relZ = car.z - cam;
      if (relZ < 0.05 || relZ > CFG.MAX_VISIBLE_Z) continue;
      list.push({ relZ, type: 'car', obj: car });
    }
    for (const ai of this.ai) {
      const relZ = ai.z - cam;
      if (relZ < 0.05 || relZ > CFG.MAX_VISIBLE_Z) continue;
      list.push({ relZ, type: 'ai', obj: ai });
    }
    list.sort((a, b) => b.relZ - a.relZ);

    for (const item of list) {
      if (item.type === 'car') this.drawCar(item.obj, item.relZ);
      else this.drawAI(item.obj, item.relZ);
    }
  },

  drawCar(car, relZ) {
    const ctx = this.ctx;
    const sc = View.scale(relZ);
    const x = View.x(car.x, relZ);
    const y = View.y(relZ);
    const w = 112 * sc, h = 74 * sc;

    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3 * sc, w * 0.55, h * 0.14, 0, 0, 6.284);
    ctx.fill();

    const bg = ctx.createLinearGradient(x, y - h, x, y);
    bg.addColorStop(0, U.shade(car.color, 22));
    bg.addColorStop(1, U.shade(car.color, -28));
    ctx.fillStyle = bg;
    this.roundRect(x - w / 2, y - h, w, h * 0.75, 7 * sc); ctx.fill();
    ctx.fillStyle = U.shade(car.color, 8);
    this.roundRect(x - w * 0.35, y - h * 1.36, w * 0.7, h * 0.5, 5 * sc); ctx.fill();

    ctx.fillStyle = 'rgba(20,30,45,.9)';
    this.roundRect(x - w * 0.29, y - h * 1.27, w * 0.58, h * 0.31, 3 * sc); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    this.roundRect(x - w * 0.27, y - h * 1.25, w * 0.2, h * 0.1, 2 * sc); ctx.fill();

    ctx.fillStyle = '#ff2222';
    ctx.fillRect(x - w * 0.41, y - h * 0.52, w * 0.13, h * 0.16);
    ctx.fillRect(x + w * 0.28, y - h * 0.52, w * 0.13, h * 0.16);

    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(x - w * 0.13, y - h * 0.36, w * 0.26, h * 0.12);
    ctx.fillStyle = '#222';
    ctx.font = 'bold ' + Math.max(4, Math.round(6 * sc)) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CAR', x, y - h * 0.3);

    ctx.fillStyle = '#111';
    ctx.fillRect(x - w * 0.5, y - h * 0.2, w * 0.16, h * 0.2);
    ctx.fillRect(x + w * 0.34, y - h * 0.2, w * 0.16, h * 0.2);
  },

  drawAI(ai, relZ) {
    const ctx = this.ctx;
    const sc = View.scale(relZ);
    const x = View.x(ai.x, relZ);
    const y = View.y(relZ);

    if (!ai.alive) {
      const t = Math.min(1, ai.fallT / 0.9);
      const lift = Math.sin(t * Math.PI) * 55 * sc;
      const slide = ai.fallDir * t * 85 * sc;
      const alpha = U.clamp(1 - (ai.fallT - 2.4) / 1.2, 0, 1);

      ctx.save();
      ctx.globalAlpha = alpha;
      this.drawShadow(x + slide * 0.5, y, sc, 1.2);
      ctx.translate(x + slide, y - lift);
      ctx.rotate(ai.fallDir * t * Math.PI * 0.85);
      ctx.scale(sc, sc);
      const spr = getBikeSprite(ai.color);
      ctx.drawImage(spr.canvas, -spr.ox, -spr.oy, spr.w, spr.h);
      ctx.restore();

      /* 骑手飞出 */
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x + slide * 1.25, y - lift - 40 * sc);
      ctx.rotate(ai.fallDir * t * Math.PI * 1.4);
      ctx.fillStyle = ai.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, 13 * sc, 17 * sc, 0, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = '#d9a574';
      ctx.beginPath();
      ctx.arc(0, -20 * sc, 9 * sc, 0, 6.284);
      ctx.fill();
      ctx.restore();

      ctx.globalAlpha = 1;
      return;
    }

    this.drawShadow(x, y, sc, 0.95);
    drawBike(ctx, x, y + (ai.bob || 0) * sc * 0.5, sc * 0.95, ai.color, ai.leanAngle, {
      attacking: false, dir: 1, progress: 0
    });

    if (ai.hp < ai.maxHp && ai.hp > 0) {
      const barW = 56 * sc, barH = 4 * sc;
      const barX = x - barW / 2, barY = y - 128 * sc;
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      hpGrad.addColorStop(0, '#ff5252');
      hpGrad.addColorStop(1, '#ff8a65');
      ctx.fillStyle = hpGrad;
      ctx.fillRect(barX, barY, barW * (ai.hp / ai.maxHp), barH);
    }
  },

  drawPlayer() {
    const ctx = this.ctx;
    const p = this.player;
    const relZ = 0.35;
    const sc = View.scale(relZ);
    const x = View.x(p.x, relZ);
    const y = View.y(relZ) + 12;

    this.drawShadow(x, y, sc, 1.1);

    if (p.hitCd > 0 && Math.floor(p.hitCd * 24) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    const attacking = p.attackAnim > 0;
    const progress = attacking ? 1 - p.attackAnim / 0.26 : 0;

    drawBike(ctx, x, y + (p.bob || 0) * 0.6, sc * 1.05, p.color, p.leanAngle, {
      attacking, dir: p.attackDir, progress
    });

    ctx.globalAlpha = 1;
  },

  drawParticles() {
    const ctx = this.ctx;
    const cam = this.player.z - 0.35;
    for (const pt of this.particles) {
      const relZ = pt.z - cam;
      if (relZ < 0.05 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const sc = View.scale(relZ);
      const x = View.x(pt.x, relZ);
      const y = View.y(relZ) - pt.vy * 0.35 * sc;
      const a = Math.min(1, pt.life / pt.maxLife);
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0.5, pt.size * sc), 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const f of this.floatTexts) {
      const relZ = f.z - cam;
      if (relZ < 0.05 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const sc = View.scale(relZ);
      const x = View.x(f.x, relZ);
      const y = View.y(relZ) - 60 * sc;
      ctx.globalAlpha = Math.min(1, f.life / 26);
      ctx.font = 'bold ' + Math.max(9, Math.round(26 * sc)) + 'px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.85)';
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, x, y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  },

  drawHUD() {
    const ctx = this.ctx;
    const p = this.player;

    const topGrad = ctx.createLinearGradient(0, 0, 0, 92);
    topGrad.addColorStop(0, 'rgba(0,0,0,.72)');
    topGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, CFG.W, 92);

    /* 速度 */
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    const speedKmh = Math.round(p.speed * 88);
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    const spTxt = String(speedKmh);
    ctx.strokeText(spTxt, 22, 44);
    ctx.fillStyle = p.speed > CFG.PLAYER_MAX_SPEED * 0.82 ? '#ff5252' : '#ffd93b';
    ctx.fillText(spTxt, 22, 44);
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('km/h', 22, 60);

    const meterW = 150, meterH = 6, meterX = 22, meterY = 70;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    this.roundRect(meterX, meterY, meterW, meterH, 3); ctx.fill();
    const sg = ctx.createLinearGradient(meterX, 0, meterX + meterW, 0);
    sg.addColorStop(0, '#4caf50');
    sg.addColorStop(0.62, '#ffc107');
    sg.addColorStop(1, '#f44336');
    ctx.fillStyle = sg;
    this.roundRect(meterX, meterY, Math.max(2, meterW * (p.speed / CFG.PLAYER_MAX_SPEED)), meterH, 3); ctx.fill();

    /* HP */
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('HP', 190, 32);
    for (let i = 0; i < p.maxHp; i++) {
      const hx = 216 + i * 26, hy = 24;
      const filled = i < p.hp;
      ctx.fillStyle = filled ? '#ff2a4a' : 'rgba(255,255,255,.14)';
      this.roundRect(hx, hy, 18, 12, 3); ctx.fill();
      if (filled) {
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        this.roundRect(hx + 1.5, hy + 1.5, 15, 4, 2); ctx.fill();
      }
    }
    if (p.offRoad) {
      ctx.fillStyle = '#ffb74d';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillText('⚠ 路肩', 190, 52);
    }

    /* 名次 */
    const rank = this.getPlayerRank();
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Courier New", monospace';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    const rankTxt = '第 ' + rank + ' 名';
    ctx.strokeText(rankTxt, CFG.W / 2, 40);
    ctx.fillStyle = rank === 1 ? '#ffd93b' : '#ffffff';
    ctx.fillText(rankTxt, CFG.W / 2, 40);

    /* 进度条 */
    const barW = 340, barH = 8;
    const barX = CFG.W / 2 - barW / 2, barY = 56;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    this.roundRect(barX, barY, barW, barH, 4); ctx.fill();

    const pProg = U.clamp(p.z / CFG.FINISH_DISTANCE, 0, 1);
    const pg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    pg.addColorStop(0, '#ffd93b');
    pg.addColorStop(1, '#ff6b35');
    ctx.fillStyle = pg;
    this.roundRect(barX, barY, Math.max(2, barW * pProg), barH, 4); ctx.fill();

    /* 对手标记 */
    for (const a of this.ai) {
      if (!a.alive) continue;
      const t = U.clamp(a.z / CFG.FINISH_DISTANCE, 0, 1);
      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.arc(barX + barW * t, barY + barH / 2, 4, 0, 6.284);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    /* 玩家标记 */
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(barX + barW * pProg, barY + barH / 2, 6, 0, 6.284);
    ctx.fill();
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    /* 终点旗 */
    ctx.fillStyle = '#fff';
    ctx.fillRect(barX + barW - 2, barY - 7, 2, 22);
    ctx.beginPath();
    ctx.moveTo(barX + barW, barY - 7);
    ctx.lineTo(barX + barW + 12, barY - 3);
    ctx.lineTo(barX + barW, barY + 1);
    ctx.closePath();
    ctx.fillStyle = '#ff5252';
    ctx.fill();

    /* 右侧：时间 / 击倒 */
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText('时间 ' + this.raceTime.toFixed(1) + 's', CFG.W - 176, 28);
    ctx.fillStyle = '#ffd93b';
    ctx.fillText('击倒 ' + p.knockCount, CFG.W - 176, 48);
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('剩余 ' + Math.max(0, Math.ceil(CFG.FINISH_DISTANCE - p.z)) + ' 单位', CFG.W - 176, 66);

    ctx.textAlign = 'left';
  },

  drawCountdown() {
    if (this.state !== 'playing') return;
    const ctx = this.ctx;
    if (this.countdown <= 0 && this.goTimer <= 0) return;

    if (this.countdown > 0) {
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fillRect(0, 0, CFG.W, CFG.H);

      /* 起跑灯 */
      const lit = 3 - Math.ceil(this.countdown) + 1;
      const lx = CFG.W / 2 - 60, ly = 118;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < lit ? '#ff1744' : 'rgba(255,255,255,.12)';
        ctx.beginPath();
        ctx.arc(lx + i * 60, ly, 18, 0, 6.284);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.6)';
        ctx.lineWidth = 3;
        ctx.stroke();
        if (i < lit) {
          const g = ctx.createRadialGradient(lx + i * 60, ly, 2, lx + i * 60, ly, 34);
          g.addColorStop(0, 'rgba(255,60,60,.5)');
          g.addColorStop(1, 'rgba(255,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(lx + i * 60, ly, 34, 0, 6.284);
          ctx.fill();
        }
      }

      const n = Math.ceil(this.countdown);
      const frac = this.countdown - Math.floor(this.countdown);
      const scl = 1 + (1 - frac) * 0.45;
      const alpha = Math.min(1, frac * 2.2);
      ctx.save();
      ctx.translate(CFG.W / 2, CFG.H / 2 + 10);
      ctx.scale(scl, scl);
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 170px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#000';
      ctx.strokeText(n, 0, 0);
      ctx.fillStyle = n === 1 ? '#ff5252' : '#ffd93b';
      ctx.fillText(n, 0, 0);
      ctx.restore();
    } else if (this.goTimer > 0) {
      const t = this.goTimer / 1.1;
      ctx.save();
      ctx.translate(CFG.W / 2, CFG.H / 2 + 10);
      ctx.scale(1 + (1 - t) * 0.6, 1 + (1 - t) * 0.6);
      ctx.globalAlpha = Math.min(1, t * 2);
      ctx.font = 'bold 150px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#000';
      ctx.strokeText('GO!', 0, 0);
      ctx.fillStyle = '#4caf50';
      ctx.fillText('GO!', 0, 0);
      ctx.restore();
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  },

  roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    if (w < r * 2) r = w / 2;
    if (h < r * 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
};

/* ============================================================
   菜单 UI
   ============================================================ */
const UI = {
  init() {
    const $ = id => document.getElementById(id);

    $('cmd-start').addEventListener('click', e => {
      this.blur(e);
      Sound.init(); Sound.resume();
      Game.startRace();
    });
    $('cmd-settings').addEventListener('click', e => {
      this.blur(e);
      this.syncSettings();
      this.hide('screen-main');
      this.show('screen-settings');
    });
    $('cmd-settings-back').addEventListener('click', e => {
      this.blur(e);
      Game.state = 'menu';
      this.hide('screen-settings');
      this.show('screen-main');
      this.refreshMenu();
      Save.save();
    });

    $('set-volume').addEventListener('input', e => {
      Save.data.volume = e.target.value / 100;
      Sound.setVolume(Save.data.volume);
    });
    $('set-sound').addEventListener('click', e => {
      this.blur(e);
      Save.data.soundOn = !Save.data.soundOn;
      Sound.setEnabled(Save.data.soundOn);
      Save.save();
      this.syncSettings();
      Game.toggleSoundIcon();
    });
    document.querySelectorAll('#set-diff button').forEach(btn => {
      btn.addEventListener('click', e => {
        this.blur(e);
        Save.data.diff = btn.dataset.diff;
        Save.save();
        this.syncSettings();
      });
    });

    $('cmd-resume').addEventListener('click', e => { this.blur(e); Game.togglePause(); });
    $('cmd-restart').addEventListener('click', e => {
      this.blur(e);
      this.hide('screen-pause');
      Game.startRace();
    });
    $('cmd-to-menu').addEventListener('click', e => {
      this.blur(e);
      this.hide('screen-pause');
      this.toMenu();
    });

    $('cmd-next').addEventListener('click', e => { this.blur(e); this.hide('screen-win'); Game.startRace(); });
    $('cmd-win-menu').addEventListener('click', e => { this.blur(e); this.hide('screen-win'); this.toMenu(); });
    $('cmd-over-retry').addEventListener('click', e => { this.blur(e); this.hide('screen-over'); Game.startRace(); });
    $('cmd-over-menu').addEventListener('click', e => { this.blur(e); this.hide('screen-over'); this.toMenu(); });

    this.refreshMenu();
    this.syncSettings();
  },

  blur(e) {
    if (e && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
  },

  syncSettings() {
    const vol = document.getElementById('set-volume');
    if (vol) vol.value = Math.round(Save.data.volume * 100);
    const snd = document.getElementById('set-sound');
    if (snd) {
      snd.textContent = Save.data.soundOn ? '开 启' : '关 闭';
      snd.classList.toggle('on', !!Save.data.soundOn);
    }
    document.querySelectorAll('#set-diff button').forEach(b => {
      b.classList.toggle('on', b.dataset.diff === Save.data.diff);
    });
  },

  refreshMenu() {
    document.getElementById('ui-best-rank').textContent =
      Save.data.bestRank === 99 ? '-' : '第 ' + Save.data.bestRank + ' 名';
    document.getElementById('ui-best-time').textContent =
      Save.data.bestTime === 999 ? '-' : Save.data.bestTime.toFixed(1) + 's';
    document.getElementById('ui-best-score').textContent =
      Save.data.bestScore ? Save.data.bestScore : '-';
  },

  toMenu() {
    Game.state = 'menu';
    Sound.stopEngine();
    this.hideAll();
    this.show('screen-main');
    this.refreshMenu();
  },

  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },
  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  hideAll() {
    ['screen-main', 'screen-settings', 'screen-pause', 'screen-win', 'screen-over']
      .forEach(id => this.hide(id));
  },

  setWin(rank, time, knockCount, score, entries) {
    const title = document.getElementById('win-title');
    const rankEl = document.getElementById('win-rank');
    const names = ['', '第 1 名', '第 2 名', '第 3 名', '第 4 名', '第 5 名', '第 6 名'];
    rankEl.textContent = names[rank] || ('第 ' + rank + ' 名');
    title.textContent = rank === 1 ? '冠 军 ！' : '冲 线 ！';

    document.getElementById('ui-win-time').textContent = time.toFixed(1) + 's';
    document.getElementById('ui-win-knock').textContent = knockCount;
    document.getElementById('ui-win-score').textContent = score;

    const list = document.getElementById('ui-win-ranklist');
    list.innerHTML = '';
    entries.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'row' + (r.isPlayer ? ' player' : '');
      const timeTxt = r.time < 900 ? r.time.toFixed(1) + 's' : '未完赛';
      div.innerHTML =
        '<span class="pos">' + (i + 1) + '</span>' +
        '<span class="nm">' + (r.isPlayer ? '👤 ' : '') + r.name + '</span>' +
        '<span class="tm">' + timeTxt + '</span>';
      list.appendChild(div);
    });
  },

  setOver(progress, knockCount) {
    document.getElementById('ui-over-dist').textContent = progress + '%';
    document.getElementById('ui-over-knock').textContent = knockCount;
  }
};

/* ============================================================
   启动
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  Game.init();
  Game.updateFsIcon();
  Game.toggleSoundIcon();
  Game.state = 'menu';
});

/* 音效图标同步 */
Game.toggleSoundIcon = function () {
  const b = document.getElementById('btn-sound');
  if (!b) return;
  b.textContent = Sound.enabled ? '♪' : '🔇';
  b.classList.toggle('dim', !Sound.enabled);
};
</script>
