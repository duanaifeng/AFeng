<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a0a">
<title>暴力摩托 · 公路争霸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #game {
    display: block; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #87ceeb;
  }
  .tool-btn {
    position: fixed; width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5); color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 900;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tool-btn:active { transform: scale(0.9); }
  .tool-btn.dim { opacity: 0.4; }
  #btn-full  { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
  #btn-sound { top: calc(10px + env(safe-area-inset-top)); right: calc(64px + env(safe-area-inset-right)); }
  #btn-pause { top: calc(10px + env(safe-area-inset-top)); right: calc(118px + env(safe-area-inset-right)); }

  /* ============================================
   * 触屏控制：flex 布局，左右分组自动适应
   * ============================================ */
  #touch-bottom {
    position: fixed; left: 0; right: 0;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 20px;
    pointer-events: none;
    z-index: 600;
  }
  #touch-bottom .group {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    pointer-events: auto;
  }

  .ctrl-btn {
    width: 78px; height: 78px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, background 0.08s;
  }
  .ctrl-btn.pressed {
    transform: scale(0.88);
    background: rgba(255,255,255,0.55);
  }

  /* 方向键 —— 蓝色 */
  .ctrl-btn.dir {
    background: rgba(40, 90, 200, 0.5);
    border-color: rgba(140, 180, 255, 0.7);
  }
  /* 油门 —— 绿色 */
  .ctrl-btn.gas {
    background: rgba(40, 170, 70, 0.55);
    border-color: rgba(130, 255, 150, 0.75);
  }
  /* 刹车 —— 深红 */
  .ctrl-btn.brake {
    background: rgba(170, 50, 50, 0.5);
    border-color: rgba(255, 150, 150, 0.7);
  }
  /* 出拳 —— 亮红金边 */
  .ctrl-btn.punch {
    background: rgba(220, 60, 40, 0.55);
    border-color: rgba(255, 200, 100, 0.85);
    font-size: 30px;
  }

  @media (pointer: coarse) { #touch-bottom { display: flex; } }

  /* 响应式：竖屏/窄屏时按钮自动缩小，确保不重叠 */
  @media (max-width: 620px) {
    #touch-bottom { padding: 0 14px; }
    #touch-bottom .group { gap: 10px; }
    .ctrl-btn { width: 68px; height: 68px; font-size: 22px; }
    .ctrl-btn.punch { font-size: 26px; }
  }
  @media (max-width: 500px) {
    #touch-bottom { padding: 0 10px; }
    #touch-bottom .group { gap: 8px; }
    .ctrl-btn { width: 58px; height: 58px; font-size: 20px; }
    .ctrl-btn.punch { font-size: 24px; }
  }
  @media (max-width: 400px) {
    #touch-bottom { padding: 0 8px; }
    #touch-bottom .group { gap: 6px; }
    .ctrl-btn { width: 52px; height: 52px; font-size: 17px; border-width: 2px; }
    .ctrl-btn.punch { font-size: 21px; }
  }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,5,5,0.9);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 8000; color: #fff; padding: 30px;
    gap: 14px; text-align: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 62px; letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(180deg, #ffd93b 0%, #ff6b35 50%, #d32f2f 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 24px rgba(255,100,50,0.6);
    font-style: italic;
  }
  .overlay h2 { font-size: 26px; color: #ffd93b; letter-spacing: 4px; }
  .overlay p { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.8; }

  .menu-btn {
    padding: 13px 40px; border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08);
    color: #fff; font-family: inherit;
    font-size: 16px; letter-spacing: 2px;
    cursor: pointer; transition: all 0.15s;
    min-width: 220px; font-weight: bold;
  }
  .menu-btn:hover, .menu-btn:active { background: rgba(255,255,255,0.2); }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn.primary {
    background: linear-gradient(135deg, #ff6b35, #d32f2f);
    border-color: #ff6b35;
    box-shadow: 0 4px 20px rgba(255,107,53,0.5);
  }
  .menu-btn.primary:hover { box-shadow: 0 6px 26px rgba(255,107,53,0.8); }

  .stats-row { display: flex; gap: 36px; margin: 10px 0; }
  .stats-row .item { display: flex; flex-direction: column; gap: 4px; }
  .stats-row .label { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
  .stats-row .value { font-size: 28px; font-weight: bold; color: #ffd93b; }

  .rank-list {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 22px;
    text-align: left; min-width: 280px; font-size: 14px;
  }
  .rank-list .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .rank-list .row.player { color: #ffd93b; font-weight: bold; }
  .rank-list .row .pos { width: 30px; }

  .how-to {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 22px;
    font-size: 13px; color: rgba(255,255,255,0.7);
    line-height: 1.9; max-width: 400px;
  }
  .how-to b { color: #ffd93b; }

  .setting-row {
    display: flex; align-items: center; gap: 14px;
    font-size: 14px; min-width: 320px; justify-content: space-between;
    padding: 6px 0;
  }
  .setting-row input[type=range] { flex: 1; accent-color: #ff6b35; }

  @media (max-width: 500px) {
    .overlay h1 { font-size: 40px; letter-spacing: 3px; }
    .menu-btn { padding: 11px 30px; font-size: 14px; min-width: 180px; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>

<button id="btn-pause" class="tool-btn">⏸</button>
<button id="btn-sound" class="tool-btn">♪</button>
<button id="btn-full"  class="tool-btn">⛶</button>

<div id="touch-bottom">
  <div class="group">
    <div class="ctrl-btn dir"   data-key="ArrowLeft">◀</div>
    <div class="ctrl-btn dir"   data-key="ArrowRight">▶</div>
  </div>
  <div class="group">
    <div class="ctrl-btn gas"   data-key="ArrowUp">▲</div>
    <div class="ctrl-btn brake" data-key="ArrowDown">▼</div>
    <div class="ctrl-btn punch" data-key="Space">👊</div>
  </div>
</div>

<!-- 主菜单 -->
<div id="screen-main" class="overlay show">
  <h1>暴力摩托</h1>
  <h2>公 路 争 霸</h2>
  <div class="how-to">
    <b>操作</b>：← → 左右移动 · ▲ 油门 · ▼ 刹车 · 👊 出拳<br>
    <b>目标</b>：第一个冲过终点线<br>
    <b>战斗</b>：靠近对手时出拳，把对手打下摩托<br>
    <b>小心</b>：别撞上路上的汽车，你会掉血
  </div>
  <button class="menu-btn primary" id="cmd-start">开 始 比 赛</button>
  <button class="menu-btn" id="cmd-settings">设 置</button>
  <p style="margin-top:12px">最高名次：<span id="ui-best-rank">-</span> · 最佳时间：<span id="ui-best-time">-</span></p>
</div>

<!-- 设置 -->
<div id="screen-settings" class="overlay">
  <h2>设 置</h2>
  <div class="setting-row">
    <span>音效音量</span>
    <input type="range" id="set-volume" min="0" max="100" value="30">
  </div>
  <button class="menu-btn primary" id="cmd-settings-back">保 存 并 返 回</button>
</div>

<!-- 暂停 -->
<div id="screen-pause" class="overlay">
  <h2>暂 停</h2>
  <button class="menu-btn primary" id="cmd-resume">继 续 比 赛</button>
  <button class="menu-btn" id="cmd-restart">重 新 开 始</button>
  <button class="menu-btn" id="cmd-to-menu">返 回 菜 单</button>
</div>

<!-- 通关 -->
<div id="screen-win" class="overlay">
  <h1 id="win-title">冲 线 ！</h1>
  <h2 id="win-rank">第 1 名</h2>
  <div class="stats-row">
    <div class="item"><span class="label">用时</span><span class="value" id="ui-win-time">0.0s</span></div>
    <div class="item"><span class="label">击倒</span><span class="value" id="ui-win-knock">0</span></div>
    <div class="item"><span class="label">得分</span><span class="value" id="ui-win-score">0</span></div>
  </div>
  <div class="rank-list" id="ui-win-ranklist"></div>
  <button class="menu-btn primary" id="cmd-next">再 来 一 局</button>
  <button class="menu-btn" id="cmd-win-menu">返 回 菜 单</button>
</div>

<!-- 失败 -->
<div id="screen-over" class="overlay">
  <h1 style="background:linear-gradient(180deg,#ff5252,#7a0000);-webkit-background-clip:text;background-clip:text;">被 击 倒 了</h1>
  <p>HP 归零，比赛结束</p>
  <div class="stats-row">
    <div class="item"><span class="label">进度</span><span class="value" id="ui-over-dist">0%</span></div>
    <div class="item"><span class="label">击倒</span><span class="value" id="ui-over-knock">0</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-over-retry">再 试 一 次</button>
  <button class="menu-btn" id="cmd-over-menu">返 回 菜 单</button>
</div>

<script>
'use strict';

/* ============================================================
 *  配置
 * ============================================================ */
const CFG = {
  W: 960, H: 540,
  STEP: 1000 / 60,
  HORIZON_Y: 190,
  ROAD_HALF_W: 320,
  Z_FALLOFF: 0.55,
  MAX_VISIBLE_Z: 10,
  FINISH_DISTANCE: 80,
  PLAYER_MAX_SPEED: 2.2,
  PLAYER_ACCEL: 1.6,
  PLAYER_BRAKE: 4.0,
  PLAYER_DRAG: 0.6,
  PLAYER_LATERAL: 2.2,
  PLAYER_HP: 3,
  AI_HP: 3,
  ATTACK_CD: 0.30,
  HIT_CD: 0.60,
  ATTACK_RANGE_Z: 0.65,
  ATTACK_RANGE_X: 0.42,
  SAVE_KEY: 'roadrash_v2',
};

/* ============================================================
 *  工具
 * ============================================================ */
const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],

  // 颜色明暗调整（percent: -100 ~ +100）
  shade(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    let r = (num >> 16) + Math.round(255 * percent / 100);
    let g = ((num >> 8) & 0xff) + Math.round(255 * percent / 100);
    let b = (num & 0xff) + Math.round(255 * percent / 100);
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  },
};

/* ============================================================
 *  存档
 * ============================================================ */
const Save = {
  data: { bestRank: 99, bestTime: 999, soundOn: true, volume: 0.30 },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
};

/* ============================================================
 *  音效
 * ============================================================ */
const Sound = {
  ctx: null, master: null, engineOsc: null, engineGain: null,
  enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = Save.data.volume;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setVolume(v) { if (this.master) this.master.gain.value = v; },

  startEngine() {
    if (!this.enabled || !this.ctx) return;
    this.stopEngine();
    try {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = 60;
      g.gain.value = 0.05;
      o.connect(g).connect(this.master);
      o.start();
      this.engineOsc = o;
      this.engineGain = g;
    } catch (e) {}
  },
  stopEngine() {
    if (this.engineOsc) {
      try { this.engineOsc.stop(); } catch (e) {}
      this.engineOsc = null; this.engineGain = null;
    }
  },
  updateEngine(speed, maxSpeed) {
    if (!this.engineOsc) return;
    const t = speed / maxSpeed;
    try {
      this.engineOsc.frequency.setTargetAtTime(50 + t * 130, this.ctx.currentTime, 0.05);
      this.engineGain.gain.setTargetAtTime(0.03 + t * 0.05, this.ctx.currentTime, 0.05);
    } catch (e) {}
  },
  tone({ freq, freq2, dur = 0.1, type = 'square', vol = 0.3, delay = 0 }) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq2 || freq, t0);
      if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  noise({ dur = 0.1, vol = 0.3, filterFreq = 1200 }) {
    if (!this.enabled || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime;
      const size = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < size; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / size);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq;
      const g = this.ctx.createGain(); g.gain.value = vol;
      src.connect(f).connect(g).connect(this.master);
      src.start(t0);
    } catch (e) {}
  },
  punch()   { this.noise({ dur: 0.12, vol: 0.4, filterFreq: 600 });
              this.tone({ freq: 120, freq2: 60, dur: 0.1, type: 'sawtooth', vol: 0.35 }); },
  hit()     { this.noise({ dur: 0.18, vol: 0.45, filterFreq: 900 });
              this.tone({ freq: 80, freq2: 40, dur: 0.15, type: 'square', vol: 0.35 }); },
  crash()   { this.noise({ dur: 0.35, vol: 0.5, filterFreq: 2000 });
              this.tone({ freq: 60, freq2: 30, dur: 0.3, type: 'sawtooth', vol: 0.4 }); },
  knockoff(){ this.noise({ dur: 0.5, vol: 0.5, filterFreq: 1500 });
              [500, 400, 300, 200, 120].forEach((f, i) =>
                this.tone({ freq: f, freq2: f * 0.6, dur: 0.15, type: 'sawtooth', vol: 0.3, delay: i * 0.08 })); },
  countdown(){ this.tone({ freq: 660, dur: 0.15, type: 'square', vol: 0.4 }); },
  go()      { this.tone({ freq: 880, dur: 0.3, type: 'square', vol: 0.5 });
              this.tone({ freq: 1320, dur: 0.4, type: 'square', vol: 0.4, delay: 0.15 }); },
  win()     { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.14, type: 'triangle', vol: 0.4, delay: i * 0.11 })); },
  lose()    { [392, 349, 294, 262, 196].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.22, type: 'sawtooth', vol: 0.35, delay: i * 0.18 })); },
};

/* ============================================================
 *  输入
 * ============================================================ */
const Input = {
  keys: Object.create(null),
  init() {
    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      Sound.init(); Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') Game.togglePause();
      if (e.code === 'KeyF') Game.toggleFullscreen();
      if (e.code === 'KeyM') Game.toggleSound();
      if (e.code === 'KeyR' && Game.state !== 'menu') Game.startRace();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      const key = btn.dataset.key;
      const press = e => {
        e.preventDefault(); Sound.init(); Sound.resume();
        this.keys[key] = true; btn.classList.add('pressed');
      };
      const release = e => {
        e.preventDefault(); this.keys[key] = false; btn.classList.remove('pressed');
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
  left()  { return this.keys['ArrowLeft'] || this.keys['KeyA']; },
  right() { return this.keys['ArrowRight'] || this.keys['KeyD']; },
  up()    { return this.keys['ArrowUp'] || this.keys['KeyW']; },
  down()  { return this.keys['ArrowDown'] || this.keys['KeyS']; },
  punch() { return this.keys['Space'] || this.keys['KeyX']; },
};

/* ============================================================
 *  透视投影
 * ============================================================ */
const View = {
  scale(relZ) { return 1 / (1 + Math.max(relZ, 0.02) * CFG.Z_FALLOFF); },
  screenY(relZ) { return CFG.HORIZON_Y + (CFG.H - CFG.HORIZON_Y) * this.scale(relZ); },
  screenX(x, relZ) { return CFG.W / 2 + x * CFG.ROAD_HALF_W * this.scale(relZ); },
};

/* ============================================================
 *  实体构造
 * ============================================================ */
function makePlayer() {
  return {
    kind: 'player', x: 0, z: 0, vx: 0,
    speed: 1.2,
    hp: CFG.PLAYER_HP, maxHp: CFG.PLAYER_HP,
    attackCd: 0, hitCd: 0, knockCount: 0,
    finishTime: 0, finished: false,
    attackAnim: 0, attackDir: 0, leanAngle: 0,
    color: '#e53935',
    _punchHit: false,
  };
}

function makeAIRacer(idx) {
  const colors = ['#1976d2', '#388e3c', '#f9a825', '#7b1fa2', '#e64a19'];
  return {
    kind: 'ai', id: idx, name: '车手' + (idx + 1),
    x: U.rand(-0.6, 0.6),
    z: 1 + idx * 0.7,
    speed: U.rand(1.6, 1.9),
    targetSpeed: U.rand(1.65, 1.95),
    hp: CFG.AI_HP, maxHp: CFG.AI_HP,
    alive: true, knockTimer: 0,
    fallDir: 0, fallSpin: 0, fallY: 0,
    attackCd: U.rand(0, 2), hitCd: 0,
    leanAngle: 0, color: colors[idx % colors.length],
    laneTimer: U.rand(1, 3), laneTarget: U.rand(-0.6, 0.6),
    finished: false, finishTime: 0,
  };
}

function makeCar(x, z, speed, color) {
  return { kind: 'car', x, z, speed, color };
}

/* ============================================================
 *  游戏主控
 * ============================================================ */
const Game = {
  canvas: null, ctx: null,
  state: 'menu',
  tick: 0, raceTime: 0, countdown: 3,
  player: null, ai: [], cars: [], decorations: [],
  cameraShake: 0, screenFlash: 0,
  floatTexts: [], particles: [],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.enabled = Save.data.soundOn;
    Input.init();
    UI.init();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('btn-full').addEventListener('click', e => { e.preventDefault(); this.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', e => { e.preventDefault(); this.toggleSound(); });
    $('btn-pause').addEventListener('click', e => { e.preventDefault(); this.togglePause(); });
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.updateFsIcon(); setTimeout(() => this.resize(), 150); }));
  },

  resize() {
    const ratio = CFG.W / CFG.H;
    const ww = window.innerWidth, wh = window.innerHeight;
    let w, h;
    if (ww / wh > ratio) { h = wh; w = h * ratio; }
    else { w = ww; h = w / ratio; }
    this.canvas.style.width = Math.round(w) + 'px';
    this.canvas.style.height = Math.round(h) + 'px';
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.enabled = Save.data.soundOn;
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (!Sound.enabled) Sound.stopEngine();
  },
  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      Sound.stopEngine();
      UI.show('screen-pause');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      Sound.startEngine();
      UI.hide('screen-pause');
    }
  },

  startRace() {
    Sound.init(); Sound.resume();
    this.state = 'playing';
    this.tick = 0;
    this.raceTime = 0;
    this.countdown = 3;
    this.cameraShake = 0;
    this.screenFlash = 0;
    this.floatTexts = [];
    this.particles = [];

    this.player = makePlayer();
    this.ai = [];
    for (let i = 0; i < 5; i++) this.ai.push(makeAIRacer(i));

    this.cars = [];
    const carColors = ['#90a4ae', '#ffffff', '#5c6bc0', '#ef5350', '#66bb6a', '#ffb300', '#8d6e63'];
    for (let i = 0; i < 45; i++) {
      this.cars.push(makeCar(
        U.rand(-0.75, 0.75),
        12 + i * 1.7 + U.rand(-0.4, 0.4),
        U.rand(0.5, 1.0),
        U.pick(carColors)
      ));
    }

    this.decorations = [];
    for (let i = 0; i < 80; i++) {
      this.decorations.push({
        z: 4 + i * 1.1 + U.rand(-0.3, 0.3),
        side: Math.random() < 0.5 ? -1 : 1,
        type: U.pick(['tree', 'tree', 'rock', 'sign']),
        size: U.rand(0.8, 1.3),
      });
    }

    Sound.startEngine();
    Sound.countdown();
    UI.hideAll();
  },

  lastTime: 0, accumulator: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator += delta;
    let guard = 0;
    while (this.accumulator >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator = 0;
    this.render();
  },

  update() {
    this.tick++;
    if (this.state !== 'playing') { this.updateEffects(); return; }
    const dt = 1 / 60;

    if (this.countdown > 0) {
      const oldCount = Math.ceil(this.countdown);
      this.countdown -= dt;
      const newCount = Math.ceil(this.countdown);
      if (newCount !== oldCount && newCount >= 0) {
        if (newCount === 0) Sound.go();
        else Sound.countdown();
      }
      if (this.countdown < 0) this.countdown = 0;
      if (this.countdown > 0) { this.updateEffects(); return; }
    }

    this.raceTime += dt;
    this.updatePlayer(dt);
    for (const ai of this.ai) this.updateAI(ai, dt);
    for (const car of this.cars) car.z += car.speed * dt;

    this.checkCollisions();
    this.handlePunch();
    this.updateEffects();
    Sound.updateEngine(this.player.speed, CFG.PLAYER_MAX_SPEED);

    if (!this.player.finished && this.player.z >= CFG.FINISH_DISTANCE) {
      this.player.finished = true;
      this.player.finishTime = this.raceTime;
      setTimeout(() => this.onFinish(), 800);
    }
    if (this.player.hp <= 0 && this.state === 'playing') this.onLose();
  },

  updatePlayer(dt) {
    const p = this.player;
    if (p.finished) {
      p.speed = Math.max(1.5, p.speed - dt * 0.5);
      p.z += p.speed * dt;
      p.x = U.lerp(p.x, 0.4, dt * 0.5);
      return;
    }
    if (Input.up()) p.speed += CFG.PLAYER_ACCEL * dt;
    else if (Input.down()) p.speed -= CFG.PLAYER_BRAKE * dt;
    else {
      const target = CFG.PLAYER_MAX_SPEED * 0.7;
      if (p.speed > target) p.speed -= CFG.PLAYER_DRAG * dt;
      else p.speed += CFG.PLAYER_ACCEL * 0.5 * dt;
    }
    p.speed = U.clamp(p.speed, 0.3, CFG.PLAYER_MAX_SPEED);
    p.z += p.speed * dt;

    let lat = 0;
    if (Input.left())  lat -= 1;
    if (Input.right()) lat += 1;
    const latScale = 1 - (p.speed / CFG.PLAYER_MAX_SPEED) * 0.25;
    p.vx = lat * CFG.PLAYER_LATERAL * latScale;
    p.x += p.vx * dt;
    p.x = U.clamp(p.x, -0.85, 0.85);

    const targetLean = -p.vx * 0.35;
    p.leanAngle = U.lerp(p.leanAngle, targetLean, dt * 8);

    if (p.attackCd > 0) p.attackCd -= dt;
    if (p.hitCd > 0) p.hitCd -= dt;
    if (p.attackAnim > 0) p.attackAnim -= dt;
    else p._punchHit = false;

    if (Input.punch() && p.attackCd <= 0) {
      p.attackCd = CFG.ATTACK_CD;
      p.attackAnim = 0.25;
      p.attackDir = p.vx >= 0 ? 1 : -1;
      p._punchHit = false;
      Sound.punch();
    }
  },

  updateAI(ai, dt) {
    if (!ai.alive) {
      ai.knockTimer -= dt;
      if (ai.knockTimer <= 0) {
        ai.alive = true; ai.hp = CFG.AI_HP;
        ai.z = this.player.z - 3;
        ai.x = U.rand(-0.5, 0.5);
        ai.speed = ai.targetSpeed * 0.9;
        ai.fallY = 0; ai.fallSpin = 0;
      }
      ai.fallY += 8 * dt;
      ai.fallSpin += 8 * dt;
      return;
    }
    if (ai.finished) { ai.z += ai.speed * dt; return; }

    if (ai.speed < ai.targetSpeed) ai.speed += 0.8 * dt;
    else if (ai.speed > ai.targetSpeed) ai.speed -= 1.5 * dt;

    const diff = ai.z - this.player.z;
    if (diff > 3) ai.speed *= 0.995;
    else if (diff < -1) ai.speed += 0.5 * dt;
    ai.speed = U.clamp(ai.speed, 0.8, CFG.PLAYER_MAX_SPEED * 1.05);
    ai.z += ai.speed * dt;

    ai.laneTimer -= dt;
    if (ai.laneTimer <= 0) {
      ai.laneTimer = U.rand(1.5, 3.5);
      ai.laneTarget = U.rand(-0.7, 0.7);
    }
    const dx = ai.laneTarget - ai.x;
    const latSpeed = 0.5 + ai.speed * 0.3;
    ai.x += U.clamp(dx * 2, -latSpeed * dt, latSpeed * dt);

    const zDiff = ai.z - this.player.z;
    const xDiff = ai.x - this.player.x;
    if (Math.abs(zDiff) < 0.5 && Math.abs(xDiff) < 0.4) {
      ai.attackCd -= dt;
      if (ai.attackCd <= 0 && Math.random() < 0.02) {
        ai.attackCd = U.rand(1.2, 2.5);
        this.aiAttackPlayer(ai);
      }
    } else if (ai.attackCd > 0) ai.attackCd -= dt;

    if (ai.hitCd > 0) ai.hitCd -= dt;
    const targetLean = -U.clamp(dx * 0.5, -0.4, 0.4);
    ai.leanAngle = U.lerp(ai.leanAngle, targetLean, dt * 6);

    if (!ai.finished && ai.z >= CFG.FINISH_DISTANCE) {
      ai.finished = true;
      ai.finishTime = this.raceTime + (ai.z - CFG.FINISH_DISTANCE) / Math.max(ai.speed, 0.1);
    }
  },

  aiAttackPlayer(ai) {
    if (this.player.hitCd > 0 || this.player.finished) return;
    this.player.hp--;
    this.player.hitCd = CFG.HIT_CD;
    this.player.speed *= 0.7;
    this.cameraShake = 8;
    this.screenFlash = 0.3;
    Sound.hit();
    this.addFloat(this.player.x, 0.3, '-1 HP', '#ff5252');
    this.spawnHitParticles(this.player.x, 0.3, '#ff5252');
  },

  handlePunch() {
    const p = this.player;
    if (p.attackAnim <= 0 || p.attackAnim > 0.2) return;
    if (p._punchHit) return;
    for (const ai of this.ai) {
      if (!ai.alive || ai.finished) continue;
      const zDiff = ai.z - p.z;
      const xDiff = ai.x - p.x;
      if (Math.abs(zDiff) < CFG.ATTACK_RANGE_Z &&
          Math.abs(xDiff) < CFG.ATTACK_RANGE_X &&
          (Math.sign(xDiff) === p.attackDir || Math.abs(xDiff) < 0.15)) {
        p._punchHit = true;
        this.damageAI(ai, p.attackDir);
        return;
      }
    }
  },

  damageAI(ai, dir) {
    if (ai.hitCd > 0) return;
    ai.hp--;
    ai.hitCd = 0.5;
    if (ai.hp <= 0) {
      ai.alive = false;
      ai.knockTimer = 4;
      ai.fallDir = dir || 1;
      ai.fallSpin = 0;
      ai.fallY = 0;
      this.player.knockCount++;
      this.cameraShake = 10;
      Sound.knockoff();
      this.addFloat(ai.x, 0.3, '击倒！', '#ffd93b');
      this.spawnHitParticles(ai.x, 0.3, ai.color);
    } else {
      ai.speed *= 0.6;
      ai.x += dir * 0.15;
      this.cameraShake = 5;
      Sound.hit();
      this.addFloat(ai.x, 0.3, '命中！', '#fff');
      this.spawnHitParticles(ai.x, 0.3, ai.color);
    }
  },

  checkCollisions() {
    const p = this.player;
    if (p.finished) return;
    for (const car of this.cars) {
      const zDiff = car.z - p.z;
      const xDiff = car.x - p.x;
      if (Math.abs(zDiff) < 0.35 && Math.abs(xDiff) < 0.28 && p.hitCd <= 0) {
        p.hp--; p.hitCd = CFG.HIT_CD; p.speed *= 0.4;
        this.cameraShake = 14; this.screenFlash = 0.5;
        Sound.crash();
        this.addFloat(p.x, 0.3, '-1 HP', '#ff5252');
        this.spawnHitParticles(p.x, 0.2, '#ffb300');
        return;
      }
    }
    for (const ai of this.ai) {
      if (!ai.alive || ai.finished) continue;
      const zDiff = ai.z - p.z;
      const xDiff = ai.x - p.x;
      if (Math.abs(zDiff) < 0.25 && Math.abs(xDiff) < 0.20) {
        const push = Math.sign(xDiff) * 0.6;
        ai.x += push * 0.02;
        p.x -= push * 0.02;
        p.speed *= 0.97;
        ai.speed *= 0.97;
      }
    }
  },

  addFloat(x, z, text, color) {
    this.floatTexts.push({ x, z, text, color: color || '#fff', life: 60 });
  },

  spawnHitParticles(x, z, color) {
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * 6.284;
      const sp = U.rand(2, 5);
      this.particles.push({
        x, z,
        vx: Math.cos(ang) * 0.3,
        vy: Math.sin(ang) * 0.3 - 0.5,
        life: 40, color, size: U.rand(4, 8),
      });
    }
  },

  updateEffects() {
    if (this.cameraShake > 0) this.cameraShake *= 0.85;
    if (this.screenFlash > 0) this.screenFlash -= 0.03;
    for (let i = this.floatTexts.length - 1; i >= 0; i--) {
      const f = this.floatTexts[i];
      f.z += 0.02; f.life--;
      if (f.life <= 0) this.floatTexts.splice(i, 1);
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * 0.05;
      pt.z += pt.vy * 0.05;
      pt.life--;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
  },

  onFinish() {
    const racers = [
      { name: '你', dist: this.player.z, time: this.player.finishTime, isPlayer: true },
      ...this.ai.map(a => ({ name: a.name, dist: a.z, time: a.finished ? a.finishTime : 999, isPlayer: false })),
    ];
    racers.sort((a, b) => {
      if (a.time !== b.time) return a.time - b.time;
      return b.dist - a.dist;
    });
    const rank = racers.findIndex(r => r.isPlayer) + 1;
    Save.data.bestRank = Math.min(Save.data.bestRank, rank);
    Save.data.bestTime = Math.min(Save.data.bestTime, this.player.finishTime);
    Save.save();
    Sound.stopEngine();
    Sound.win();
    UI.setWin(rank, this.raceTime, this.player.knockCount, racers);
    UI.show('screen-win');
    this.state = 'win';
  },

  onLose() {
    Sound.stopEngine();
    Sound.lose();
    this.state = 'over';
    const progress = Math.min(100, Math.floor(this.player.z / CFG.FINISH_DISTANCE * 100));
    UI.setOver(progress, this.player.knockCount);
    UI.show('screen-over');
  },

  /* ============================================================
   *  渲染
   * ============================================================ */
  render() {
    const ctx = this.ctx;
    ctx.save();
    if (this.cameraShake > 0.5) {
      const dx = (Math.random() - 0.5) * this.cameraShake;
      const dy = (Math.random() - 0.5) * this.cameraShake;
      ctx.translate(dx, dy);
    }
    this.drawSky();
    this.drawMountains();
    this.drawRoad();
    this.drawDecorations();
    this.drawEntities();
    this.drawPlayer();
    this.drawEffects();
    this.drawHUD();
    ctx.restore();
    if (this.screenFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${this.screenFlash})`;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }
    if (this.state === 'playing' && this.countdown > 0) this.drawCountdown();
  },

  drawSky() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, CFG.HORIZON_Y + 40);
    g.addColorStop(0, '#4a86e8');
    g.addColorStop(0.6, '#87ceeb');
    g.addColorStop(1, '#b8e0f5');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.HORIZON_Y + 40);

    ctx.fillStyle = 'rgba(255,240,180,0.9)';
    ctx.beginPath(); ctx.arc(CFG.W * 0.78, 80, 50, 0, 6.284); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.3)';
    ctx.beginPath(); ctx.arc(CFG.W * 0.78, 80, 80, 0, 6.284); ctx.fill();

    const off = (this.tick * 0.15) % (CFG.W + 300);
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260 + off) % (CFG.W + 300)) - 150;
      const cy = 40 + (i * 37) % 80;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, 6.284);
      ctx.arc(cx + 24, cy - 8, 28, 0, 6.284);
      ctx.arc(cx + 55, cy, 20, 0, 6.284);
      ctx.arc(cx + 28, cy + 10, 24, 0, 6.284);
      ctx.fill();
    }
  },

  drawMountains() {
    const ctx = this.ctx;
    const parallax = -this.player.x * 30;
    ctx.fillStyle = '#5a7a5a';
    ctx.beginPath();
    ctx.moveTo(-100 + parallax, CFG.HORIZON_Y);
    for (let i = 0; i <= 12; i++) {
      const x = i * 100 - 100 + parallax;
      const h = 40 + Math.sin(i * 1.7) * 30 + Math.cos(i * 0.9) * 20;
      ctx.lineTo(x, CFG.HORIZON_Y - h);
    }
    ctx.lineTo(CFG.W + 100 + parallax, CFG.HORIZON_Y);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#4a6a4a';
    ctx.beginPath();
    ctx.moveTo(-100 - parallax * 0.5, CFG.HORIZON_Y);
    for (let i = 0; i <= 8; i++) {
      const x = i * 140 - 100 - parallax * 0.5;
      const h = 60 + Math.sin(i * 2.3) * 40;
      ctx.lineTo(x, CFG.HORIZON_Y - h);
    }
    ctx.lineTo(CFG.W + 100 - parallax * 0.5, CFG.HORIZON_Y);
    ctx.closePath(); ctx.fill();
  },

  drawRoad() {
    const ctx = this.ctx;
    const cameraZ = this.player.z - 0.3;
    const grad = ctx.createLinearGradient(0, CFG.HORIZON_Y, 0, CFG.H);
    grad.addColorStop(0, '#5a7a5a');
    grad.addColorStop(0.3, '#4a6a3a');
    grad.addColorStop(1, '#3a5a2a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, CFG.HORIZON_Y, CFG.W, CFG.H - CFG.HORIZON_Y);

    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.moveTo(CFG.W / 2, CFG.HORIZON_Y);
    ctx.lineTo(CFG.W / 2 - CFG.ROAD_HALF_W, CFG.H);
    ctx.lineTo(CFG.W / 2 + CFG.ROAD_HALF_W, CFG.H);
    ctx.closePath(); ctx.fill();

    const roadGrad = ctx.createLinearGradient(0, CFG.HORIZON_Y, 0, CFG.H);
    roadGrad.addColorStop(0, '#555');
    roadGrad.addColorStop(0.3, '#383838');
    roadGrad.addColorStop(1, '#2a2a2a');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(CFG.W / 2, CFG.HORIZON_Y);
    ctx.lineTo(CFG.W / 2 - CFG.ROAD_HALF_W, CFG.H);
    ctx.lineTo(CFG.W / 2 + CFG.ROAD_HALF_W, CFG.H);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#f0f0f0';
    for (const edge of [-1, 1]) {
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(CFG.W / 2 + edge * 5, CFG.HORIZON_Y);
      ctx.lineTo(CFG.W / 2 + edge * CFG.ROAD_HALF_W, CFG.H);
      ctx.stroke();
    }

    const DASH_SPACING = 0.6, DASH_LENGTH = 0.25;
    const dashPhase = cameraZ % DASH_SPACING;
    for (const laneX of [-0.5, 0.5]) {
      for (let i = 0; i < 20; i++) {
        const relZ1 = i * DASH_SPACING - dashPhase;
        const relZ2 = relZ1 + DASH_LENGTH;
        if (relZ2 < 0.15 || relZ1 > CFG.MAX_VISIBLE_Z) continue;
        const z1 = Math.max(relZ1, 0.15);
        const z2 = Math.min(relZ2, CFG.MAX_VISIBLE_Z);
        const x1 = View.screenX(laneX, z1), y1 = View.screenY(z1);
        const x2 = View.screenX(laneX, z2), y2 = View.screenY(z2);
        const w = Math.max(1, 5 * View.scale((z1 + z2) / 2));
        ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }

    const finishRelZ = CFG.FINISH_DISTANCE - cameraZ;
    if (finishRelZ > 0.2 && finishRelZ < CFG.MAX_VISIBLE_Z + 2) {
      const z1 = Math.max(finishRelZ - 0.4, 0.2);
      const z2 = Math.min(finishRelZ, CFG.MAX_VISIBLE_Z);
      if (z2 > z1) {
        const x1L = View.screenX(-1, z1), x1R = View.screenX(1, z1), y1 = View.screenY(z1);
        const x2L = View.screenX(-1, z2), x2R = View.screenX(1, z2), y2 = View.screenY(z2);
        const cols = 16;
        for (let i = 0; i < cols; i++) {
          const t1 = i / cols, t2 = (i + 1) / cols;
          ctx.fillStyle = (i % 2 === 0) ? '#000' : '#fff';
          ctx.beginPath();
          ctx.moveTo(x1L + (x1R - x1L) * t1, y1);
          ctx.lineTo(x1L + (x1R - x1L) * t2, y1);
          ctx.lineTo(x2L + (x2R - x2L) * t2, y2);
          ctx.lineTo(x2L + (x2R - x2L) * t1, y2);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  },

  drawDecorations() {
    const ctx = this.ctx;
    const cameraZ = this.player.z - 0.3;
    for (const d of this.decorations) {
      const relZ = d.z - cameraZ;
      if (relZ < 0.15 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const scale = View.scale(relZ);
      const baseX = CFG.W / 2 + d.side * (CFG.ROAD_HALF_W + 40) * scale;
      const baseY = View.screenY(relZ);
      const size = 40 * scale * d.size;

      if (d.type === 'tree') {
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(baseX - size * 0.08, baseY - size, size * 0.16, size);
        ctx.fillStyle = '#2e7a2e';
        ctx.beginPath();
        ctx.arc(baseX, baseY - size * 1.15, size * 0.6, 0, 6.284);
        ctx.arc(baseX - size * 0.35, baseY - size * 0.85, size * 0.45, 0, 6.284);
        ctx.arc(baseX + size * 0.35, baseY - size * 0.85, size * 0.45, 0, 6.284);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(baseX - size * 0.15, baseY - size * 1.25, size * 0.25, 0, 6.284);
        ctx.fill();
      } else if (d.type === 'rock') {
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.ellipse(baseX, baseY - size * 0.3, size * 0.5, size * 0.35, 0, 0, 6.284);
        ctx.fill();
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.ellipse(baseX - size * 0.1, baseY - size * 0.4, size * 0.25, size * 0.15, 0, 0, 6.284);
        ctx.fill();
      } else if (d.type === 'sign') {
        ctx.fillStyle = '#888';
        ctx.fillRect(baseX - size * 0.05, baseY - size * 1.2, size * 0.1, size * 1.2);
        ctx.fillStyle = '#2a5a9a';
        ctx.fillRect(baseX - size * 0.4, baseY - size * 1.5, size * 0.8, size * 0.4);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(size * 0.25)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('→', baseX, baseY - size * 1.3);
      }
    }
  },

  drawEntities() {
    const cameraZ = this.player.z - 0.3;
    const list = [];
    for (const car of this.cars) {
      const relZ = car.z - cameraZ;
      if (relZ < 0.2 || relZ > CFG.MAX_VISIBLE_Z) continue;
      list.push({ relZ, type: 'car', obj: car });
    }
    for (const ai of this.ai) {
      const relZ = ai.z - cameraZ;
      if (relZ < 0.2 || relZ > CFG.MAX_VISIBLE_Z) continue;
      list.push({ relZ, type: 'ai', obj: ai });
    }
    list.sort((a, b) => b.relZ - a.relZ);
    for (const item of list) {
      if (item.type === 'car') this.drawCar(item.obj, item.relZ);
      else this.drawAI(item.obj, item.relZ);
    }
  },

  drawCar(car, relZ) {
    const ctx = this.ctx;
    const scale = View.scale(relZ);
    const x = View.screenX(car.x, relZ);
    const y = View.screenY(relZ);
    const w = 110 * scale, h = 70 * scale;

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, w * 0.55, h * 0.15, 0, 0, 6.284);
    ctx.fill();

    ctx.fillStyle = car.color;
    this.roundRect(x - w / 2, y - h, w, h * 0.75, 6 * scale); ctx.fill();
    this.roundRect(x - w * 0.35, y - h * 1.35, w * 0.7, h * 0.5, 4 * scale); ctx.fill();

    ctx.fillStyle = 'rgba(30,40,60,0.85)';
    this.roundRect(x - w * 0.28, y - h * 1.25, w * 0.56, h * 0.3, 3 * scale); ctx.fill();

    ctx.fillStyle = '#ff2222';
    ctx.fillRect(x - w * 0.4, y - h * 0.5, w * 0.12, h * 0.15);
    ctx.fillRect(x + w * 0.28, y - h * 0.5, w * 0.12, h * 0.15);

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - w * 0.12, y - h * 0.35, w * 0.24, h * 0.12);
  },

  drawAI(ai, relZ) {
    const ctx = this.ctx;
    const scale = View.scale(relZ);
    const x = View.screenX(ai.x, relZ);
    const y = View.screenY(relZ);

    if (!ai.alive) {
      const fallOffset = ai.fallY * 60 * scale;
      const fallX = x + ai.fallDir * fallOffset;
      const fallY = y - fallOffset * 0.5;
      ctx.save();
      ctx.translate(fallX, fallY);
      ctx.rotate(ai.fallDir * Math.PI * ai.fallSpin * 0.3);
      // 倒地摩托 + 骑士
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(0, 0, 30 * scale, 12 * scale, 0, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = ai.color;
      ctx.fillRect(-25 * scale, -50 * scale, 50 * scale, 40 * scale);
      ctx.restore();
      return;
    }

    this.drawBikeBack(x, y, scale, ai.color, ai.leanAngle, false, 0, 0);

    if (ai.hp < ai.maxHp && ai.hp > 0) {
      const barW = 60 * scale, barH = 4 * scale;
      const barX = x - barW / 2, barY = y - 130 * scale;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(barX, barY, barW * (ai.hp / ai.maxHp), barH);
    }
  },

  drawPlayer() {
    const ctx = this.ctx;
    const p = this.player;
    const relZ = 0.3;
    const scale = View.scale(relZ);
    const x = View.screenX(p.x, relZ);
    const y = View.screenY(relZ) + 20;

    if (p.speed > 1.5) {
      const intensity = (p.speed - 1.5) / 0.7;
      ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.25})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const sx = Math.random() * CFG.W;
        const sy = Math.random() * CFG.H;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx, sy + 30);
        ctx.stroke();
      }
    }

    if (p.hitCd > 0 && Math.floor(p.hitCd * 20) % 2 === 0) return;

    const attacking = p.attackAnim > 0;
    const attackProgress = attacking ? 1 - p.attackAnim / 0.25 : 0;

    this.drawBikeBack(x, y, scale * 1.05, p.color, p.leanAngle, attacking, p.attackDir, attackProgress);
  },

  /* ============================================================
   *  摩托车绘制（从后方视角，更真实的实体车）
   * ============================================================ */
  drawBikeBack(cx, cy, scale, jacketColor, lean, attacking, attackDir, attackProgress) {
    const ctx = this.ctx;
    const leanRad = lean * 0.35;
    const S = scale;

    // 摩托车主色：暗黑 + 金属
    const bikeDark = '#161616';
    const bikeMid = '#2a2a2a';
    const bikeLight = '#4a4a4a';
    const chrome = '#b0b0b0';

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(leanRad);
    ctx.scale(S, S);

    // ========================================================
    // 1. 地面阴影（椭圆）
    // ========================================================
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 12, 52, 14, 0, 0, 6.284);
    ctx.fill();

    // ========================================================
    // 2. 后轮（宽胎 + 胎纹 + 轮毂）
    // ========================================================
    // 轮胎外圈
    const tireGrad = ctx.createRadialGradient(-6, -6, 3, 0, 0, 34);
    tireGrad.addColorStop(0, '#3a3a3a');
    tireGrad.addColorStop(0.6, '#1a1a1a');
    tireGrad.addColorStop(1, '#050505');
    ctx.fillStyle = tireGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 34, 22, 0, 0, 6.284);
    ctx.fill();

    // 胎纹（横向弧线）
    ctx.strokeStyle = 'rgba(70,70,70,0.55)';
    ctx.lineWidth = 1.4;
    for (let i = -3; i <= 3; i++) {
      const yy = i * 3;
      const rad = 32 - Math.abs(i) * 1.2;
      ctx.beginPath();
      ctx.ellipse(0, yy, rad, 1.2, 0, 0, 6.284);
      ctx.stroke();
    }

    // 轮胎侧面高光
    ctx.fillStyle = 'rgba(180,180,180,0.12)';
    ctx.beginPath();
    ctx.ellipse(-10, -8, 14, 6, -0.4, 0, 6.284);
    ctx.fill();

    // 轮毂（外圈）
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 10, 0, 0, 6.284);
    ctx.fill();
    // 轮毂（中间亮环）
    ctx.fillStyle = chrome;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 8, 0, 0, 6.284);
    ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 6, 0, 0, 6.284);
    ctx.fill();
    // 轮毂中心
    ctx.fillStyle = bikeLight;
    ctx.beginPath();
    ctx.arc(0, 0, 3.5, 0, 6.284);
    ctx.fill();

    // ========================================================
    // 3. 后挡泥板（弧形覆盖轮胎上方）
    // ========================================================
    const fenderGrad = ctx.createLinearGradient(0, -50, 0, -10);
    fenderGrad.addColorStop(0, bikeMid);
    fenderGrad.addColorStop(1, bikeDark);
    ctx.fillStyle = fenderGrad;
    ctx.beginPath();
    ctx.moveTo(-32, -8);
    ctx.quadraticCurveTo(-30, -42, 0, -48);
    ctx.quadraticCurveTo(30, -42, 32, -8);
    ctx.lineTo(28, -8);
    ctx.quadraticCurveTo(26, -36, 0, -42);
    ctx.quadraticCurveTo(-26, -36, -28, -8);
    ctx.closePath();
    ctx.fill();
    // 挡泥板高光
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.moveTo(-24, -14);
    ctx.quadraticCurveTo(-22, -38, 0, -44);
    ctx.lineTo(0, -40);
    ctx.quadraticCurveTo(-20, -35, -20, -14);
    ctx.closePath();
    ctx.fill();

    // ========================================================
    // 4. 双侧排气管（金属管）
    // ========================================================
    for (const side of [-1, 1]) {
      // 管身
      const pipeGrad = ctx.createLinearGradient(side * 22, -36, side * 32, -12);
      pipeGrad.addColorStop(0, '#888');
      pipeGrad.addColorStop(0.4, chrome);
      pipeGrad.addColorStop(1, '#555');
      ctx.fillStyle = pipeGrad;
      ctx.beginPath();
      ctx.moveTo(side * 20, -38);
      ctx.lineTo(side * 28, -34);
      ctx.lineTo(side * 36, -14);
      ctx.lineTo(side * 26, -13);
      ctx.lineTo(side * 22, -34);
      ctx.closePath();
      ctx.fill();

      // 排气口（深色圆环）
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.ellipse(side * 31, -13, 5, 3.5, 0, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(side * 31, -13, 3, 2, 0, 0, 6.284);
      ctx.fill();
    }

    // ========================================================
    // 5. 尾部车身 + 尾灯
    // ========================================================
    const tailGrad = ctx.createLinearGradient(0, -70, 0, -30);
    tailGrad.addColorStop(0, bikeMid);
    tailGrad.addColorStop(0.5, bikeDark);
    tailGrad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    ctx.moveTo(-24, -70);
    ctx.lineTo(24, -70);
    ctx.lineTo(28, -38);
    ctx.lineTo(-28, -38);
    ctx.closePath();
    ctx.fill();

    // 车身高光（左侧）
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.moveTo(-20, -68);
    ctx.lineTo(-16, -40);
    ctx.lineTo(-22, -40);
    ctx.lineTo(-22, -68);
    ctx.closePath();
    ctx.fill();

    // 尾灯（红色梯形）
    ctx.fillStyle = '#ff1a1a';
    ctx.beginPath();
    ctx.moveTo(-11, -60);
    ctx.lineTo(11, -60);
    ctx.lineTo(9, -46);
    ctx.lineTo(-9, -46);
    ctx.closePath();
    ctx.fill();
    // 尾灯高光
    ctx.fillStyle = 'rgba(255,180,180,0.7)';
    ctx.beginPath();
    ctx.ellipse(-3, -55, 4, 2, 0, 0, 6.284);
    ctx.fill();
    // 尾灯发光
    const lightGlow = ctx.createRadialGradient(0, -53, 1, 0, -53, 24);
    lightGlow.addColorStop(0, 'rgba(255,60,60,0.7)');
    lightGlow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = lightGlow;
    ctx.beginPath();
    ctx.arc(0, -53, 22, 0, 6.284);
    ctx.fill();

    // 转向灯（左右小黄点）
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(-23, -52, 2.5, 0, 6.284);
    ctx.arc(23, -52, 2.5, 0, 6.284);
    ctx.fill();

    // 车牌
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(-10, -44, 20, 6);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 5px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('7-777', 0, -41);

    // ========================================================
    // 6. 车座（骑士坐在上面）
    // ========================================================
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(-22, -82);
    ctx.quadraticCurveTo(0, -88, 22, -82);
    ctx.lineTo(20, -72);
    ctx.lineTo(-20, -72);
    ctx.closePath();
    ctx.fill();
    // 车座高光
    ctx.fillStyle = 'rgba(80,80,80,0.35)';
    ctx.beginPath();
    ctx.ellipse(-3, -80, 16, 3, 0, 0, 6.284);
    ctx.fill();

    // ========================================================
    // 7. 骑士腿部（膝盖向外张开）
    // ========================================================
    // 左腿（大腿 + 小腿 + 靴子）
    const legGrad = ctx.createLinearGradient(-20, -95, -35, -60);
    legGrad.addColorStop(0, '#1a1a2a');
    legGrad.addColorStop(1, '#050508');
    ctx.fillStyle = legGrad;
    ctx.beginPath();
    ctx.moveTo(-22, -95);
    ctx.quadraticCurveTo(-38, -88, -38, -68);
    ctx.quadraticCurveTo(-38, -58, -34, -54);
    ctx.lineTo(-28, -54);
    ctx.quadraticCurveTo(-30, -62, -30, -72);
    ctx.quadraticCurveTo(-28, -84, -18, -90);
    ctx.closePath();
    ctx.fill();

    // 右腿
    ctx.beginPath();
    ctx.moveTo(22, -95);
    ctx.quadraticCurveTo(38, -88, 38, -68);
    ctx.quadraticCurveTo(38, -58, 34, -54);
    ctx.lineTo(28, -54);
    ctx.quadraticCurveTo(30, -62, 30, -72);
    ctx.quadraticCurveTo(28, -84, 18, -90);
    ctx.closePath();
    ctx.fill();

    // 靴子（黑色）
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(-32, -54, 7, 4, 0, 0, 6.284);
    ctx.ellipse(32, -54, 7, 4, 0, 0, 6.284);
    ctx.fill();
    // 靴子高光
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(-34, -56, 3, 1.5, 0, 0, 6.284);
    ctx.ellipse(30, -56, 3, 1.5, 0, 0, 6.284);
    ctx.fill();

    // ========================================================
    // 8. 骑士身体（夹克，颜色区分玩家/AI）
    // ========================================================
    const jacketGrad = ctx.createLinearGradient(0, -140, 0, -92);
    jacketGrad.addColorStop(0, U.shade(jacketColor, -20));
    jacketGrad.addColorStop(0.6, jacketColor);
    jacketGrad.addColorStop(1, U.shade(jacketColor, -40));
    ctx.fillStyle = jacketGrad;
    ctx.beginPath();
    ctx.moveTo(-26, -138);
    ctx.quadraticCurveTo(-32, -122, -30, -96);
    ctx.lineTo(30, -96);
    ctx.quadraticCurveTo(32, -122, 26, -138);
    ctx.closePath();
    ctx.fill();

    // 夹克背中线
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(0, -138);
    ctx.lineTo(0, -96);
    ctx.stroke();

    // 夹克背上的条纹装饰
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-20, -132);
    ctx.lineTo(-22, -100);
    ctx.moveTo(20, -132);
    ctx.lineTo(22, -100);
    ctx.stroke();

    // 背部高光
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(-14, -135);
    ctx.lineTo(-18, -100);
    ctx.lineTo(-6, -100);
    ctx.lineTo(-6, -135);
    ctx.closePath();
    ctx.fill();

    // 肩膀（肩章）
    ctx.fillStyle = U.shade(jacketColor, 15);
    ctx.beginPath();
    ctx.arc(-24, -134, 10, 0, 6.284);
    ctx.arc(24, -134, 10, 0, 6.284);
    ctx.fill();

    // ========================================================
    // 9. 手臂（伸向车把，出拳时一只伸直）
    // ========================================================
    const armColor = U.shade(jacketColor, -10);
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';

    if (attacking) {
      const dir = attackDir;
      const ext = Math.sin(attackProgress * Math.PI) * 60;
      const isRight = dir > 0;
      const activeX = isRight ? 24 : -24;
      const passiveX = isRight ? -24 : 24;

      // 被动侧
      ctx.beginPath();
      ctx.moveTo(passiveX, -132);
      ctx.quadraticCurveTo(passiveX * 1.4, -120, passiveX * 1.25, -104);
      ctx.stroke();
      // 手套
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(passiveX * 1.25, -102, 6, 0, 6.284);
      ctx.fill();

      // 出拳侧
      ctx.strokeStyle = armColor;
      ctx.beginPath();
      ctx.moveTo(activeX, -132);
      ctx.lineTo(activeX + dir * ext, -128);
      ctx.stroke();
      // 拳头
      ctx.fillStyle = '#d4a574';
      ctx.beginPath();
      ctx.arc(activeX + dir * (ext + 9), -128, 10, 0, 6.284);
      ctx.fill();
      // 拳套高光
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(activeX + dir * (ext + 6), -131, 3, 0, 6.284);
      ctx.fill();
      // 冲击波
      ctx.strokeStyle = `rgba(255,240,150,${0.9 - attackProgress})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(activeX + dir * (ext + 9), -128, 14 + attackProgress * 24, 0, 6.284);
      ctx.stroke();
    } else {
      // 双手握把
      ctx.beginPath();
      ctx.moveTo(-24, -132);
      ctx.quadraticCurveTo(-32, -120, -30, -104);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(24, -132);
      ctx.quadraticCurveTo(32, -120, 30, -104);
      ctx.stroke();
      // 手套
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-30, -102, 6, 0, 6.284);
      ctx.arc(30, -102, 6, 0, 6.284);
      ctx.fill();
    }

    // ========================================================
    // 10. 后视镜（车把两侧伸出的小镜）
    // ========================================================
    for (const side of [-1, 1]) {
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(side * 30, -138);
      ctx.lineTo(side * 44, -152);
      ctx.stroke();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(side * 46, -154, 8, 5, side * 0.3, 0, 6.284);
      ctx.fill();
      // 镜面
      ctx.fillStyle = 'rgba(180,220,255,0.6)';
      ctx.beginPath();
      ctx.ellipse(side * 46, -154, 6, 3.5, side * 0.3, 0, 6.284);
      ctx.fill();
    }

    // ========================================================
    // 11. 头盔（彩色 + 后脑勺 + 白色条纹）
    // ========================================================
    const helmGrad = ctx.createRadialGradient(-10, -168, 4, 0, -160, 28);
    helmGrad.addColorStop(0, U.shade(jacketColor, 25));
    helmGrad.addColorStop(0.5, jacketColor);
    helmGrad.addColorStop(1, U.shade(jacketColor, -55));
    ctx.fillStyle = helmGrad;
    ctx.beginPath();
    ctx.arc(0, -160, 26, 0, 6.284);
    ctx.fill();

    // 头盔高光
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-8, -168, 8, 12, 0.3, 0, 6.284);
    ctx.fill();

    // 头盔条纹（白色）
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-20, -160);
    ctx.quadraticCurveTo(0, -180, 20, -160);
    ctx.stroke();

    // 头盔底部轮廓
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -160, 26, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // 头盔后部的出风口（暗色小块）
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, -172, 8, 3, 0, 0, 6.284);
    ctx.fill();

    ctx.restore();
  },

  drawEffects() {
    const ctx = this.ctx;
    const cameraZ = this.player.z - 0.3;
    for (const pt of this.particles) {
      const relZ = pt.z - cameraZ + 0.3;
      if (relZ < 0.2 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const scale = View.scale(relZ);
      const x = View.screenX(pt.x, relZ);
      const y = View.screenY(relZ);
      ctx.globalAlpha = Math.min(1, pt.life / 30);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(x, y, pt.size * scale, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const f of this.floatTexts) {
      const relZ = f.z;
      if (relZ < 0.2 || relZ > CFG.MAX_VISIBLE_Z) continue;
      const scale = View.scale(relZ);
      const x = View.screenX(f.x, relZ);
      const y = View.screenY(relZ);
      ctx.globalAlpha = Math.min(1, f.life / 30);
      ctx.font = `bold ${Math.round(28 * scale)}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(f.text, x + 2, y + 2);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, x, y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  },

  drawHUD() {
    const ctx = this.ctx;
    const p = this.player;
    const g = ctx.createLinearGradient(0, 0, 0, 76);
    g.addColorStop(0, 'rgba(0,0,0,0.65)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, 76);

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px "Courier New", monospace';

    const speedKmh = Math.round(p.speed * 90);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = 4;
    const speedTxt = speedKmh + ' km/h';
    ctx.strokeText(speedTxt, 20, 30);
    ctx.fillStyle = p.speed > 1.7 ? '#ff5252' : '#ffd93b';
    ctx.fillText(speedTxt, 20, 30);

    const meterW = 140, meterH = 8, meterX = 20, meterY = 50;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(meterX, meterY, meterW, meterH);
    const speedRatio = p.speed / CFG.PLAYER_MAX_SPEED;
    const sg = ctx.createLinearGradient(meterX, 0, meterX + meterW, 0);
    sg.addColorStop(0, '#4caf50');
    sg.addColorStop(0.6, '#ffc107');
    sg.addColorStop(1, '#f44336');
    ctx.fillStyle = sg;
    ctx.fillRect(meterX, meterY, meterW * speedRatio, meterH);

    const hpX = CFG.W - 130;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText('HP', hpX - 4, 28);
    for (let i = 0; i < p.maxHp; i++) {
      const hx = hpX + 25 + i * 26, hy = 28;
      const filled = i < p.hp;
      ctx.fillStyle = filled ? '#ff2a4a' : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(hx, hy, 9, 0, 6.284);
      ctx.fill();
      ctx.strokeStyle = filled ? '#fff' : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const rank = this.getPlayerRank();
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = 5;
    const rankTxt = '第 ' + rank + ' 名';
    ctx.strokeText(rankTxt, CFG.W / 2, 32);
    ctx.fillStyle = rank === 1 ? '#ffd93b' : '#fff';
    ctx.fillText(rankTxt, CFG.W / 2, 32);

    const progress = U.clamp(p.z / CFG.FINISH_DISTANCE, 0, 1);
    const barW = 400, barH = 8;
    const barX = CFG.W / 2 - barW / 2, barY = 56;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    this.roundRect(barX, barY, barW, barH, 4); ctx.fill();
    ctx.fillStyle = '#4caf50';
    this.roundRect(barX, barY, barW * progress, barH, 4); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(barX + barW - 3, barY - 6, 3, 20);
    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.moveTo(barX + barW - 3, barY - 6);
    ctx.lineTo(barX + barW + 10, barY - 2);
    ctx.lineTo(barX + barW - 3, barY + 2);
    ctx.fill();
    const playerDotX = barX + barW * progress;
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.arc(playerDotX, barY + barH / 2, 6, 0, 6.284); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  },

  getPlayerRank() {
    const all = [
      { z: this.player.z, isPlayer: true, time: this.player.finishTime || 9999 },
      ...this.ai.map(a => ({ z: a.z, isPlayer: false, time: a.finishTime || 9999 })),
    ];
    all.sort((a, b) => {
      if (a.time !== b.time) return a.time - b.time;
      return b.z - a.z;
    });
    return all.findIndex(r => r.isPlayer) + 1;
  },

  drawCountdown() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    const n = Math.ceil(this.countdown);
    if (n <= 0) return;
    const t = this.countdown - Math.floor(this.countdown);
    const scale = 1 + (1 - t) * 0.5;
    const alpha = Math.min(1, t * 2);
    ctx.save();
    ctx.translate(CFG.W / 2, CFG.H / 2);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 180px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#000';
    ctx.strokeText(n, 0, 0);
    ctx.fillStyle = n === 1 ? '#ff5252' : '#ffd93b';
    ctx.fillText(n, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  },

  roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    if (w < r * 2) r = w / 2;
    if (h < r * 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
};

/* ============================================================
 *  菜单 UI
 * ============================================================ */
const UI = {
  init() {
    const $ = id => document.getElementById(id);
    $('cmd-start').addEventListener('click', () => {
      Sound.init(); Sound.resume();
      Game.startRace();
    });
    $('cmd-settings').addEventListener('click', () => {
      this.loadSettings();
      this.hide('screen-main');
      this.show('screen-settings');
    });
    $('cmd-settings-back').addEventListener('click', () => {
      this.hide('screen-settings');
      this.show('screen-main');
      this.refreshMenu();
      Save.save();
    });
    $('set-volume').addEventListener('input', e => {
      Save.data.volume = e.target.value / 100;
      Sound.setVolume(Save.data.volume);
    });
    $('cmd-resume').addEventListener('click', () => Game.togglePause());
    $('cmd-restart').addEventListener('click', () => {
      this.hide('screen-pause');
      Game.startRace();
    });
    $('cmd-to-menu').addEventListener('click', () => {
      this.hide('screen-pause');
      this.toMenu();
    });
    $('cmd-next').addEventListener('click', () => {
      this.hide('screen-win');
      Game.startRace();
    });
    $('cmd-win-menu').addEventListener('click', () => {
      this.hide('screen-win');
      this.toMenu();
    });
    $('cmd-over-retry').addEventListener('click', () => {
      this.hide('screen-over');
      Game.startRace();
    });
    $('cmd-over-menu').addEventListener('click', () => {
      this.hide('screen-over');
      this.toMenu();
    });
    this.refreshMenu();
  },

  loadSettings() {
    document.getElementById('set-volume').value = Math.round(Save.data.volume * 100);
  },

  refreshMenu() {
    document.getElementById('ui-best-rank').textContent =
      Save.data.bestRank === 99 ? '-' : '第 ' + Save.data.bestRank + ' 名';
    document.getElementById('ui-best-time').textContent =
      Save.data.bestTime === 999 ? '-' : Save.data.bestTime.toFixed(1) + 's';
  },

  toMenu() {
    Game.state = 'menu';
    Sound.stopEngine();
    this.hideAll();
    this.show('screen-main');
    this.refreshMenu();
  },

  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },
  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  hideAll() {
    ['screen-main','screen-settings','screen-pause','screen-win','screen-over']
      .forEach(id => this.hide(id));
  },

  setWin(rank, time, knockCount, racers) {
    const title = document.getElementById('win-title');
    const rankEl = document.getElementById('win-rank');
    const rankTxt = ['', '第 1 名', '第 2 名', '第 3 名', '第 4 名', '第 5 名', '第 6 名'];
    rankEl.textContent = rankTxt[rank] || ('第 ' + rank + ' 名');
    if (rank === 1) title.textContent = '冠 军 ！';
    else title.textContent = '冲 线 ！';

    document.getElementById('ui-win-time').textContent = time.toFixed(1) + 's';
    document.getElementById('ui-win-knock').textContent = knockCount;
    document.getElementById('ui-win-score').textContent = Math.max(0, (6 - rank) * 1000 + knockCount * 500);

    const list = document.getElementById('ui-win-ranklist');
    list.innerHTML = '';
    racers.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'row' + (r.isPlayer ? ' player' : '');
      const timeTxt = r.time < 900 ? r.time.toFixed(1) + 's' : '未完赛';
      div.innerHTML = `<span class="pos">${i + 1}</span><span>${r.isPlayer ? '👤 ' : ''}${r.name}</span><span>${timeTxt}</span>`;
      list.appendChild(div);
    });
  },

  setOver(progress, knockCount) {
    document.getElementById('ui-over-dist').textContent = progress + '%';
    document.getElementById('ui-over-knock').textContent = knockCount;
  },
};

/* ============================================================
 *  启动
 * ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  Game.init();
  Game.updateFsIcon();
  document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
  document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
});
</script>
