<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e20">
<title>大力水手 · Popeye</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#fbbf24;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{
  width:100%;height:100%;overflow:hidden;background:#05070f;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Courier New",monospace;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 45% at 50% 0%,rgba(56,189,248,.13),transparent 70%),
    radial-gradient(50% 40% at 100% 100%,rgba(251,191,36,.08),transparent 70%);
}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;
  padding:calc(6px + var(--safe-top)) 6px calc(6px + var(--safe-bottom));gap:5px}
.top-hud{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:760px;padding:6px 12px;gap:6px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(22,32,54,.92),rgba(12,18,32,.92));
  border:1px solid rgba(90,125,170,.35);border-radius:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
}
.hud-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  letter-spacing:1px;color:#8ba1bf;white-space:nowrap}
.hud-val{color:#f1f5f9;font-size:15px;font-variant-numeric:tabular-nums;
  letter-spacing:1.5px;text-shadow:0 0 12px currentColor}
.hud-val.score{color:#fbbf24}
.hud-val.lives{color:#fb7185}
.hud-val.level{color:#7dd3fc}
.hud-val.items{color:#4ade80}
.hud-val.combo{color:#f472b6}
#comboWrap{opacity:0;transition:opacity .2s}
#comboWrap.on{opacity:1}
.power-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:rgba(255,255,255,.06);opacity:0;transition:opacity .2s}
.power-bar.on{opacity:1}
.power-bar i{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#4ade80,#a3e635);
  box-shadow:0 0 12px rgba(74,222,128,.9);transition:width .08s linear}
.stage{flex:1 1 auto;min-height:0;width:100%;max-width:760px;
  display:flex;align-items:center;justify-content:center;position:relative}
.canvas-wrap{position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 0 1px rgba(90,125,170,.5),0 0 0 4px rgba(10,16,28,.9)}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  touch-action:none;background:#000;border-radius:8px}
.hint-bar{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 12px;min-height:26px;width:100%;max-width:760px;flex-shrink:0;
  background:rgba(15,23,42,.82);border:1px solid rgba(71,85,105,.55);
  border-radius:10px;font-size:11.5px;letter-spacing:1.4px;color:#94a3b8;
  text-align:center;transition:color .2s,border-color .2s}
.hint-bar.spinach{color:#4ade80;border-color:rgba(74,222,128,.8);
  animation:spinachPulse .7s ease-in-out infinite alternate}
@keyframes spinachPulse{
  from{box-shadow:0 0 8px rgba(74,222,128,.35)}
  to{box-shadow:0 0 22px rgba(74,222,128,.85)}
}
.hint-bar.slow{color:#a78bfa;border-color:rgba(167,139,250,.8)}
.ctrl-wrap{display:flex;align-items:flex-end;justify-content:space-between;
  width:100%;max-width:760px;gap:10px;flex-shrink:0;margin-top:1px}
.left-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.action-btn{width:88px;height:46px;border:none;border-radius:13px;
  font-family:inherit;font-size:13px;font-weight:900;letter-spacing:2px;
  cursor:pointer;color:#fff;padding:0;touch-action:none;
  transition:transform .08s,filter .08s,box-shadow .12s;
  box-shadow:0 5px 14px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.28),
             inset 0 -4px 10px rgba(0,0,0,.32)}
.action-btn:active{transform:scale(.92);filter:brightness(1.22)}
.action-btn.pause{background:radial-gradient(circle at 34% 28%,#93c5fd,#2563eb 62%,#1e3a8a)}
.action-btn.restart{background:radial-gradient(circle at 34% 28%,#fcd34d,#d97706 62%,#78350f)}
.action-btn.punch{height:54px;font-size:15px;
  background:radial-gradient(circle at 34% 28%,#86efac,#16a34a 62%,#14532d)}
#fsBtn{width:88px;height:38px;border:1px solid rgba(251,191,36,.55);border-radius:13px;
  background:linear-gradient(180deg,rgba(47,63,85,.95),rgba(26,26,46,.95));
  color:#fbbf24;font-size:12px;font-weight:900;font-family:inherit;letter-spacing:2px;
  cursor:pointer;touch-action:manipulation;
  box-shadow:0 5px 14px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.18);
  transition:transform .1s,background .15s}
#fsBtn:active{transform:scale(.93)}
#fsBtn .fs-exit{display:none}
#fsBtn.fs-active .fs-enter{display:none}
#fsBtn.fs-active .fs-exit{display:inline}
.dpad{display:grid;grid-template-columns:repeat(3,var(--dp));grid-template-rows:repeat(3,var(--dp));
  gap:7px;--dp:70px;flex-shrink:0;margin-left:auto}
.dpad button{background:linear-gradient(180deg,#2f3f55,#232f42);border:none;color:#7dd3fc;
  font-size:30px;font-weight:900;cursor:pointer;touch-action:none;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:14px;
  transition:transform .07s,background .1s,box-shadow .1s;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.13),0 6px 12px rgba(0,0,0,.5)}
.dpad button:active,.dpad button.pressed{
  background:linear-gradient(180deg,#3d5372,#2a3950);transform:scale(.9);color:#e0f2fe;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.55),0 0 20px rgba(56,189,248,.65)}
.dpad .empty{visibility:hidden;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;
  background:radial-gradient(circle at 50% 35%,rgba(20,32,54,.92),rgba(3,6,12,.97));
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{width:min(92vw,340px);text-align:center;padding:24px 22px;border-radius:20px;
  background:linear-gradient(180deg,rgba(30,42,66,.98),rgba(10,17,30,.99));
  border:1px solid rgba(96,130,172,.42);
  box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
  transform:scale(.86);transition:transform .36s cubic-bezier(.34,1.56,.64,1)}
.overlay.show .overlay-card{transform:scale(1)}
.overlay-emoji{font-size:46px;line-height:1;margin-bottom:8px;animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.overlay-title{font-size:23px;font-weight:900;letter-spacing:5px;color:var(--gold);
  margin-bottom:8px;text-shadow:0 4px 26px rgba(251,191,36,.45)}
.overlay-title.lose{color:#fb7185;text-shadow:0 4px 26px rgba(251,113,133,.45)}
.overlay-sub{font-size:12.5px;letter-spacing:1.5px;color:#93a8c4;margin-bottom:14px;line-height:1.85}
.overlay-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ov-btn{padding:11px 22px;border:1px solid rgba(96,130,172,.45);
  background:linear-gradient(180deg,rgba(38,54,80,.95),rgba(24,36,56,.95));
  color:#cfe0f5;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:800;
  letter-spacing:2px;cursor:pointer;white-space:nowrap;
  transition:transform .12s,filter .15s;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.ov-btn:hover{filter:brightness(1.16)}
.ov-btn:active{transform:scale(.95)}
.ov-btn.primary{background:linear-gradient(160deg,#38bdf8,#0284c7);border-color:#0ea5e9;color:#fff;
  box-shadow:0 8px 22px rgba(56,189,248,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.ov-btn.spinach{background:linear-gradient(160deg,#4ade80,#16a34a);border-color:#4ade80;color:#052e16;
  box-shadow:0 8px 22px rgba(74,222,128,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.help-list{text-align:left;display:inline-block;font-size:12px;color:#cbd5e1;
  line-height:1.95;margin-bottom:12px}
.help-list b{display:inline-block;min-width:58px;color:#7dd3fc;font-weight:800}
.best-line{font-size:11.5px;color:#8ba1bf;margin-top:12px;letter-spacing:1px}
.best-line b{color:var(--gold);font-size:14px}
.toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;
  transform:translateX(-50%) translateY(-18px);
  background:linear-gradient(180deg,rgba(251,191,36,.97),rgba(217,119,6,.97));
  color:#1a0f00;padding:9px 20px;border-radius:12px;
  font-size:13px;font-weight:800;letter-spacing:1px;opacity:0;pointer-events:none;
  transition:opacity .28s,transform .28s cubic-bezier(.34,1.56,.64,1);z-index:200;
  box-shadow:0 10px 28px rgba(251,191,36,.45),inset 0 1px 0 rgba(255,255,255,.4);
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{background:linear-gradient(180deg,rgba(74,222,128,.97),rgba(22,163,74,.97));
  box-shadow:0 10px 28px rgba(74,222,128,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.toast.red{background:linear-gradient(180deg,rgba(251,113,133,.97),rgba(190,18,60,.97));color:#fff;
  box-shadow:0 10px 28px rgba(251,113,133,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.toast.purple{background:linear-gradient(180deg,rgba(167,139,250,.97),rgba(109,40,217,.97));color:#fff;
  box-shadow:0 10px 28px rgba(167,139,250,.45),inset 0 1px 0 rgba(255,255,255,.3)}
@media (max-width:600px){
  .action-btn{width:76px;height:42px;font-size:12px;border-radius:11px}
  .action-btn.punch{height:48px;font-size:13px}
  #fsBtn{width:76px;height:34px;font-size:11px}
  .dpad{--dp:62px;gap:6px}
  .dpad button{font-size:26px;border-radius:12px}
  .hud-item{font-size:10px}
  .hud-val{font-size:13px}
}
@media (max-width:440px){
  .action-btn{width:66px;height:38px;font-size:11px}
  .action-btn.punch{height:44px;font-size:12px}
  #fsBtn{width:66px;height:30px;font-size:10px}
  .dpad{--dp:54px;gap:5px}
  .dpad button{font-size:22px;border-radius:10px}
  .overlay-card{padding:18px 16px}
  .help-list{font-size:11px}
}
@media (max-height:560px){
  .action-btn{height:38px}
  .action-btn.punch{height:44px}
  .dpad{--dp:54px;gap:5px}
  .dpad button{font-size:22px}
  .top-hud{padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="app">
  <div class="top-hud">
    <div class="hud-item">分数 <span class="hud-val score" id="scoreVal">0</span></div>
    <div class="hud-item">生命 <span class="hud-val lives" id="livesVal">3</span></div>
    <div class="hud-item">关卡 <span class="hud-val level" id="levelVal">1</span></div>
    <div class="hud-item">道具 <span class="hud-val items" id="itemLeftVal">0</span></div>
    <div class="hud-item" id="comboWrap">连击 <span class="hud-val combo" id="comboVal">x1</span></div>
    <div class="power-bar" id="powerBar"><i id="powerFill"></i></div>
  </div>

  <div class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="game" width="512" height="448"></canvas>
    </div>
  </div>

  <div class="hint-bar" id="hintBar">对准梯子按 ▲ / ▼ 攀爬</div>

  <div class="ctrl-wrap">
    <div class="left-actions">
      <button class="action-btn pause" id="pauseBtn">暂停</button>
      <button class="action-btn restart" id="restartBtn">重开</button>
      <button class="action-btn punch" id="punchBtn">出拳</button>
      <button id="fsBtn"><span class="fs-enter">⛶ 全屏</span><span class="fs-exit">✕ 退出</span></button>
    </div>
    <div class="dpad" id="dpad">
      <button class="empty"></button>
      <button id="upBtn" aria-label="上">▲</button>
      <button class="empty"></button>
      <button id="leftBtn" aria-label="左">◀</button>
      <button class="empty"></button>
      <button id="rightBtn" aria-label="右">▶</button>
      <button class="empty"></button>
      <button id="downBtn" aria-label="下">▼</button>
      <button class="empty"></button>
    </div>
  </div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">💪</div>
    <div class="overlay-title">大 力 水 手</div>
    <div class="overlay-sub">P O P E Y E</div>
    <div class="help-list">
      <div><b>移动</b>方向键 / 触屏按钮</div>
      <div><b>爬梯</b>站在梯子下按 ▲ 上爬</div>
      <div><b>下梯</b>站在梯子上方按 ▼</div>
      <div><b>跳下</b>梯子上按 ◀ / ▶</div>
      <div><b>出拳</b>J 键 / 出拳按钮</div>
      <div><b>穿越</b>走到边缘可穿屏</div>
      <div><b>连击</b>3 秒内连续收集加分</div>
      <div><b>目标</b>收集全部道具过关</div>
    </div>
    <div class="overlay-btns">
      <button class="ov-btn spinach" id="startBtn">开 始 游 戏</button>
    </div>
    <div class="best-line">最高分 <b id="bestScoreVal">0</b> · 最远第 <b id="bestLevelVal">1</b> 关</div>
  </div>
</div>

<div class="overlay" id="pauseOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">⏸</div>
    <div class="overlay-title">已 暂 停</div>
    <div class="overlay-sub">按 P 或点击继续</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="resumeBtn">继 续</button>
      <button class="ov-btn" id="pauseRestartBtn">重 开</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title">过 关 ！</div>
    <div class="overlay-sub" id="winSub"></div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="nextBtn">下 一 关</button>
    </div>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">💥</div>
    <div class="overlay-title lose">游 戏 结 束</div>
    <div class="overlay-sub" id="overSub"></div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="retryBtn">再 来 一 次</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function $(id) { return document.getElementById(id); }
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

var TILE = 32, COLS = 16, ROWS = 14;
var WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;
var GRAVITY = 1250;

var THEMES = [
  { name: '码 头', sky: ['#0d2f52', '#06111f'], floor: '#8b5a2b', top: '#c08040', dark: '#5a3818', lad: '#d9a441', accent: '#38bdf8' },
  { name: '街 道', sky: ['#20123c', '#08040f'], floor: '#5b6270', top: '#98a2b3', dark: '#333a46', lad: '#a78bfa', accent: '#a78bfa' },
  { name: '船 舱', sky: ['#0b2f2a', '#04100e'], floor: '#7a5230', top: '#b7824a', dark: '#4a2f18', lad: '#5eead4', accent: '#2dd4bf' },
  { name: '高 塔', sky: ['#2a1236', '#0a0410'], floor: '#6b5a86', top: '#a894c9', dark: '#3d3250', lad: '#f0abfc', accent: '#e879f9' },
  { name: '双 塔', sky: ['#102a44', '#040a12'], floor: '#4b6b7a', top: '#82a8b8', dark: '#2a3f4a', lad: '#7dd3fc', accent: '#38bdf8' },
  { name: '迷 宫', sky: ['#2f1a10', '#0d0604'], floor: '#8a5a1e', top: '#c9922e', dark: '#4f3210', lad: '#fbbf24', accent: '#fbbf24' }
];

var Save = {
  key: 'popeye_v3',
  data: { best: 0, bestLevel: 1 },
  load: function () {
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save: function () {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  }
};

var Sound = {
  ctx: null, master: null, bus: null, revIn: null, noiseBuf: null,
  enabled: true, voices: 0, MAXV: 20,
  musicOn: false, musicTimer: 0, musicStep: 0, theme: 0,

  init: function () {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
      return this.ctx;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return null; }
      try { this.ctx = new AC({ latencyHint: 'interactive' }); }
      catch (e1) { this.ctx = new AC(); }

      var comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 5;
      comp.attack.value = 0.003; comp.release.value = 0.24;

      this.master = this.ctx.createGain();
      this.master.gain.value = 0.3;
      this.bus = this.ctx.createGain();
      this.bus.gain.value = 0.9;
      this.bus.connect(this.master);
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      this.revIn = this.ctx.createBiquadFilter();
      this.revIn.type = 'lowpass';
      this.revIn.frequency.value = 2400;
      var conv = this.ctx.createConvolver();
      conv.buffer = this.makeIR(0.9, 2.8);
      var vg = this.ctx.createGain();
      vg.gain.value = 0.32;
      this.revIn.connect(conv); conv.connect(vg); vg.connect(this.master);

      this.noiseBuf = this.makeNoise(1.0);
      return this.ctx;
    } catch (e) { this.ctx = null; return null; }
  },

  makeNoise: function (sec) {
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    var b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  makeIR: function (sec, decay) {
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * sec));
    var b = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = b.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return b;
  },

  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },

  tone: function (o) {
    var c = this.init();
    if (!c || !this.enabled) return;
    if (this.voices >= this.MAXV) return;
    try {
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.12;
      var osc = c.createOscillator();
      osc.type = o.type || 'square';
      var f0 = Math.max(20, o.f0 || 400);
      var f1 = Math.max(20, o.f1 === undefined ? f0 : o.f1);
      osc.frequency.setValueAtTime(f0, t0);
      if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.9);

      var g = c.createGain();
      var peak = Math.max(0.0003, o.vol === undefined ? 0.2 : o.vol);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      var node = osc;
      if (o.filter) {
        var f = c.createBiquadFilter();
        f.type = o.filter.type || 'lowpass';
        f.frequency.setValueAtTime(Math.max(60, o.filter.f0 || 1200), t0);
        if (o.filter.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.filter.f1), t0 + dur);
        f.Q.value = o.filter.q || 0.9;
        node.connect(f); node = f;
      }
      node.connect(g);
      g.connect(this.bus);
      if (o.send) {
        var s = c.createGain();
        s.gain.value = o.send;
        g.connect(s); s.connect(this.revIn);
      }
      var self = this;
      this.voices++;
      osc.onended = function () {
        self.voices = Math.max(0, self.voices - 1);
        try { g.disconnect(); } catch (e) {}
      };
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  },

  burst: function (o) {
    var c = this.init();
    if (!c || !this.enabled || !this.noiseBuf) return;
    if (this.voices >= this.MAXV) return;
    try {
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.1;
      var src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      var f = c.createBiquadFilter();
      f.type = o.type || 'lowpass';
      f.frequency.setValueAtTime(Math.max(60, o.f0 || 1800), t0);
      if (o.f1 !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t0 + dur);
      f.Q.value = o.q || 1;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0003, o.vol || 0.16), t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(this.bus);
      var self = this;
      this.voices++;
      src.onended = function () {
        self.voices = Math.max(0, self.voices - 1);
        try { g.disconnect(); } catch (e) {}
      };
      src.start(t0, Math.random() * 0.2);
      src.stop(t0 + dur + 0.04);
    } catch (e) {}
  },

  click: function () { this.tone({ f0: 880, f1: 660, dur: 0.045, type: 'square', vol: 0.06 }); },
  collect: function () {
    this.tone({ f0: 988, dur: 0.055, type: 'square', vol: 0.11 });
    this.tone({ f0: 1319, dur: 0.08, type: 'square', vol: 0.1, delay: 0.05, send: 0.2 });
  },
  combo: function (n) {

  },
  step: function () { this.burst({ dur: 0.04, vol: 0.045, type: 'bandpass', f0: 600, f1: 300 }); },
  wrap: function () { this.tone({ f0: 520, f1: 980, dur: 0.1, type: 'sine', vol: 0.1, send: 0.2 }); },
  climb: function () { this.burst({ dur: 0.05, vol: 0.04, type: 'bandpass', f0: 900, f1: 500 }); },
  spinach: function () {

  },
  clock: function () {

  },
  punch: function () {

  },
  hit: function () {

  },
  bonk: function () {

  },
  win: function () {

  lose: function () {

  life: function () {

    });
  },

  MEL: [
    [392, 0, 523, 0, 587, 523, 440, 0],
    [349, 0, 440, 0, 523, 0, 440, 392],
    [330, 0, 415, 0, 494, 415, 349, 0],
    [294, 0, 370, 0, 440, 0, 370, 330],
    [392, 440, 523, 0, 587, 0, 523, 440],
    [262, 0, 330, 392, 440, 392, 330, 0]
  ],

  musicStart: function (theme) {
    this.init();

  musicStop: function () { this.musicOn = false; },
  musicUpdate: function (dt) {
    if (!this.musicOn || !this.enabled || !this.ctx) return;

    this.musicTimer = 210;
    var mel = this.MEL[this.theme % this.MEL.length];
    var i = this.musicStep % mel.length;
    var n = mel[i];
    if (n) this.tone({ f0: n, dur: 0.17, type: 'triangle', vol: 0.055 });
    if (i % 2 === 0) {
      var bass = mel[(i + 4) % mel.length] / 2;
      if (bass > 40) this.tone({ f0: bass, dur: 0.3, type: 'sine', vol: 0.07 });
    }
    this.musicStep++;
  }
};

var Input = {
  keys: { left: false, right: false, up: false, down: false, punch: false },
  pointers: new Map(),

  init: function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      Sound.init(); Sound.resume();
      var k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); self.keys.left = true; }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); self.keys.right = true; }
      else if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); self.keys.up = true; }
      else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); self.keys.down = true; }
      else if (k === 'j' || k === 'J' || k === ' ') { e.preventDefault(); self.keys.punch = true; }
      else if (k === 'p' || k === 'P' || k === 'Escape') {
        if (Game.state === 'playing') Game.pause();
        else if (Game.state === 'paused') Game.resume();
      }
      else if (k === 'r' || k === 'R') {
        if (Game.state !== 'menu') Game.restartCurrent();
      }
    });
    window.addEventListener('keyup', function (e) {
      var k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') self.keys.left = false;
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') self.keys.right = false;
      else if (k === 'ArrowUp' || k === 'w' || k === 'W') self.keys.up = false;
      else if (k === 'ArrowDown' || k === 's' || k === 'S') self.keys.down = false;
      else if (k === 'j' || k === 'J' || k === ' ') self.keys.punch = false;
    });
    window.addEventListener('blur', function () { self.clear(); });

    this.bindHold('leftBtn', 'left');
    this.bindHold('rightBtn', 'right');
    this.bindHold('upBtn', 'up');
    this.bindHold('downBtn', 'down');
    this.bindHold('punchBtn', 'punch');

    window.addEventListener('pointerup', function (e) { self.release(e.pointerId); });
    window.addEventListener('pointercancel', function (e) { self.release(e.pointerId); });
  },

  release: function (id) {
    var rec = this.pointers.get(id);
    if (!rec) return;
    this.pointers.delete(id);
    this.keys[rec.key] = false;
    if (rec.el) rec.el.classList.remove('pressed');
  },

  bindHold: function (id, key) {
    var el = $(id);
    if (!el) return;
    var self = this;
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (self.pointers.has(e.pointerId)) return;
      self.pointers.set(e.pointerId, { el: el, key: key });
      self.keys[key] = true;
      el.classList.add('pressed');
      Sound.init(); Sound.resume();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointerup', function (e) { self.release(e.pointerId); });
    el.addEventListener('pointercancel', function (e) { self.release(e.pointerId); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  },

  clear: function () {
    for (var k in this.keys) this.keys[k] = false;
    this.pointers.clear();
    var els = document.querySelectorAll('.pressed');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('pressed');
  }
};

    var stage = $('stage');
    var wrap = $('canvasWrap');
    var availW = stage.clientWidth;
    var availH = stage.clientHeight;
    if (availW <= 0 || availH <= 0) return;

    var ratio = WORLD_W / WORLD_H;
    var w = availW, h = w / ratio;
    if (h > availH) { h = availH; w = h * ratio; }

    wrap.style.width = Math.floor(w) + 'px';
    wrap.style.height = Math.floor(h) + 'px';

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = Math.floor(w) + 'px';
    this.canvas.style.height = Math.floor(h) + 'px';

    this.scale = (w / WORLD_W) * dpr;
    this.ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);

      }
      if (screen.orientation && screen.orientation.lock) {

      }

  buildMap: function () {
    var LAYERS = 10;
    var yTop = 1.6 * TILE;
    var yBot = 13 * TILE;
    var ys = [];
    for (var i = 0; i < LAYERS; i++) ys.push(yTop + (yBot - yTop) * i / (LAYERS - 1));

    this.floors = [];
    for (var j = 0; j < LAYERS; j++) {
      this.floors.push({ x: 0, y: ys[j], w: WORLD_W });
    }

    var seqs = [
      [0, 5, 2, 1, 4, 3, 5, 0, 3],
      [5, 0, 4, 3, 1, 5, 0, 4, 3],
      [2, 4, 1, 5, 0, 3, 4, 1, 5],
      [1, 3, 4, 0, 5, 1, 4, 3, 0],
      [3, 2, 1, 2, 4, 0, 5, 1, 2],
      [0, 1, 2, 3, 4, 5, 4, 3, 2]
    ];
    var POS = [40, 104, 170, 336, 402, 456];
    var seq = seqs[(this.level - 1) % seqs.length];

    this.ladders = [];
    for (var k = 0; k < LAYERS - 1; k++) {
      var px = POS[seq[k % seq.length]];
      this.ladders.push({ x: px, yTop: ys[k], yBot: ys[k + 1] });
    }

    var bottom = this.floors[LAYERS - 1];
    this.playerStart = { x: bottom.w / 2 - 11, y: bottom.y - 30 };
    var top = this.floors[0];
    this.bruteStart = { x: 40, y: top.y - 32 };
  },

  buildItems: function (idx) {
    var type = ['heart', 'note', 'letter'][idx % 3];
    var count = idx % 2 === 0 ? 30 : 24;
    var spots = [];
    var letters = 'HELP'.split('');

    for (var i = 0; i < this.floors.length; i++) {
      var f = this.floors[i];
      var n = 3 + (Math.random() < 0.5 ? 1 : 0);
      for (var s = 0; s < n; s++) {
        var cx = f.x + 40 + (f.w - 80) * (s + 0.5) / n;
        var bad = false;
        for (var l = 0; l < this.ladders.length; l++) {
          var lad = this.ladders[l];
          if (Math.abs(lad.x + 8 - cx) < 26 &&
              (Math.abs(lad.yTop - f.y) < 3 || Math.abs(lad.yBot - f.y) < 3)) { bad = true; break; }
        }
        if (bad) continue;
        spots.push({ x: cx - 16, y: f.y - 30 });
      }
    }

    for (var a = spots.length - 1; a > 0; a--) {
      var b = randInt(0, a);
      var tmp = spots[a]; spots[a] = spots[b]; spots[b] = tmp;
    }

    var chosen = spots.slice(0, count);
    while (chosen.length < count) {
      var f2 = this.floors[randInt(1, this.floors.length - 1)];
      chosen.push({ x: rand(40, WORLD_W - 56), y: f2.y - 30 });
    }

    this.items = [];
    for (var m = 0; m < chosen.length; m++) {
      this.items.push({
        x: chosen[m].x,
        y: chosen[m].y,
        type: type,
        letter: letters[m % letters.length],
        got: false,
        anim: Math.random() * 10
      });
    }
    this.itemsTotal = this.items.length;
  },

  xOnFloor: function (cx, f) {
    if (cx >= f.x && cx <= f.x + f.w) return true;
    if (cx < 0 && cx + WORLD_W >= f.x && cx + WORLD_W <= f.x + f.w) return true;
    if (cx > WORLD_W && cx - WORLD_W >= f.x && cx - WORLD_W <= f.x + f.w) return true;
    return false;
  },

  landingY: function (cx, prevBottom, newBottom) {
    var best = null;
    for (var i = 0; i < this.floors.length; i++) {
      var f = this.floors[i];
      if (!this.xOnFloor(cx, f)) continue;
      if (prevBottom <= f.y + 3 && newBottom >= f.y) {
        if (best === null || f.y < best) best = f.y;
      }
    }
    return best;
  },

  floorBelow: function (cx, y) {
    var best = null;
    for (var i = 0; i < this.floors.length; i++) {
      var f = this.floors[i];
      if (!this.xOnFloor(cx, f)) continue;
      if (f.y >= y - 4 && (best === null || f.y < best)) best = f.y;
    }
    return best;
  },

  /* ★ 修复：方向判定
     dir < 0（按上）→ 必须站在梯子【底部】
     dir > 0（按下）→ 必须站在梯子【顶部】 */
  findLadderAt: function (cx, bottomY, dir) {
    for (var i = 0; i < this.ladders.length; i++) {
      var l = this.ladders[i];
      var lx = l.x + 8;
      var dx = Math.abs(cx - lx);
      if (dx > WORLD_W / 2) dx = WORLD_W - dx;
      if (dx > 26) continue;

      var dTop = Math.abs(bottomY - l.yTop);
      var dBot = Math.abs(bottomY - l.yBot);

      if (dir < 0 && dBot < 18) return l;
      if (dir > 0 && dTop < 18) return l;
      if (!dir && (dTop < 18 || dBot < 18)) return l;
    }
    return null;
  },

  update: function (dt) {
    this.time += dt;

    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 30);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 2.4);

    if (this.invincible > 0) this.invincible = Math.max(0, this.invincible - dt);
    if (this.slowTimer > 0) this.slowTimer = Math.max(0, this.slowTimer - dt);
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) { this.combo = 0; this.updateComboUI(); }
    }

    this.updatePlayer(dt);
    this.updateBrute(dt);
    this.updateDrops(dt);
    this.updateBottles(dt);
    this.updatePunches(dt);
    this.updateParticles(dt);
    this.spawnLogic(dt);
    this.checkCollisions();

    if (this.state === 'playing' && this.itemsCollected >= this.itemsTotal) this.onWin();
  },

  updatePlayer: function (dt) {
    var p = this.player;
    if (!p) return;
    if (p.respawn > 0) { p.respawn -= dt; return; }

    if (p.knockback > 0) {
      p.knockback -= dt;
      p.x += p.kbVX * dt;
      p.kbVX *= 0.88;
    }

    if (p.punchTimer > 0) p.punchTimer -= dt;

    var speed = this.invincible > 0 ? 118 : 98;
    var ladderSpeed = 90;

    if (Input.keys.punch && p.punchTimer <= 0) {
      p.punchTimer = 0.26;
      this.punches.push({
        x: p.x + (p.facing > 0 ? p.w - 2 : -18),
        y: p.y + 8, w: 20, h: 16,
        facing: p.facing, life: 0.14, maxLife: 0.14
      });
      Sound.punch();
      this.shake = Math.max(this.shake, 2);
    }

    var mx = (Input.keys.right ? 1 : 0) - (Input.keys.left ? 1 : 0);
    var my = (Input.keys.down ? 1 : 0) - (Input.keys.up ? 1 : 0);

    /* 梯子上按左右 → 跳下 */
    if (p.onLadder && mx !== 0) {
      p.onLadder = false;
      p.ladder = null;
      p.vy = 0;
    }

    /* 抓梯 */
    if (!p.onLadder && my !== 0 && p.knockback <= 0) {
      var lad = this.findLadderAt(p.x + p.w / 2, p.y + p.h, my);
      if (lad) {
        p.onLadder = true;
        p.ladder = lad;
        p.x = lad.x + 8 - p.w / 2;
        p.vy = 0;
        p.climbSfx = 0;
      }
    }

    if (mx !== 0) p.facing = mx;

    if (p.onLadder) {
      p.vx = 0;
      p.vy = my * ladderSpeed;
      p.y += p.vy * dt;

      p.climbSfx -= dt;
      if (Math.abs(p.vy) > 1) {
        p.walking += dt * 9;
        if (p.climbSfx <= 0) { p.climbSfx = 0.22; Sound.climb(); }
      }

      var l = p.ladder;
      if (p.y + p.h <= l.yTop + 0.5) {
        p.y = l.yTop - p.h;
        p.onLadder = false; p.ladder = null; p.vy = 0;
      } else if (p.y + p.h >= l.yBot - 0.5) {
        p.y = l.yBot - p.h;
        p.onLadder = false; p.ladder = null; p.vy = 0;
      }
      p.grounded = false;
    } else {
      p.vx = mx * speed;
      if (p.vx !== 0) p.walking += dt * 9;

      p.vy += GRAVITY * dt;
      if (p.vy > 900) p.vy = 900;

      p.x += p.vx * dt;

      var prevBottom = p.y + p.h;
      p.y += p.vy * dt;

      if (p.vy >= 0) {
        var gy = this.landingY(p.x + p.w / 2, prevBottom, p.y + p.h);
        if (gy !== null) {
          p.y = gy - p.h;
          p.vy = 0;
          p.grounded = true;
        } else {
          p.grounded = false;
        }
      } else {
        p.grounded = false;
      }

      p.stepTimer -= dt;
      if (p.grounded && p.vx !== 0 && p.stepTimer <= 0) {
        p.stepTimer = 0.26;
        Sound.step();
      }
    }

    this.wrapEntity(p);
  },

  updateBrute: function (dt) {
    var b = this.brute, p = this.player;
    if (!b || !p) return;

    b.anim += dt;

    if (b.stunned > 0) {
      b.stunned -= dt;
      b.vy += GRAVITY * 0.6 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= 0.94;
      if (b.stunned <= 0) {
        b.x = this.bruteStart.x;
        b.y = this.bruteStart.y;
        b.vx = 0; b.vy = 0;
        b.state = 'chase'; b.targetLadder = null; b.onLadder = false;
      }
      this.wrapEntity(b);
      return;
    }

    if (b.knockback > 0) {
      b.knockback -= dt;
      b.x += b.kbVX * dt;
      b.kbVX *= 0.9;
    }

    var slow = this.slowTimer > 0 ? 0.42 : 1;
    var speed = (66 + this.level * 5) * slow;
    var ladderSpeed = 84 * slow;

    var cx = b.x + b.w / 2;
    var cy = b.y + b.h;
    var px = p.x + p.w / 2;
    var py = p.y + p.h;

    b.stuckTimer += dt;
    if (b.stuckTimer > 0.8) {
      if (Math.abs(b.x - b.lastX) < 3 && Math.abs(b.y - b.lastY) < 3) {
        b.state = 'chase';
        b.targetLadder = null;
        b.onLadder = false;
        b.facing = -b.facing;
      }
      b.lastX = b.x; b.lastY = b.y;
      b.stuckTimer = 0;
    }

    if (b.state === 'climb') {
      var lad = b.targetLadder;
      if (!lad) { b.state = 'chase'; return; }
      b.x = lad.x + 8 - b.w / 2;
      b.y += b.ladderDir * ladderSpeed * dt;
      b.walking += dt * 8;
      b.onLadder = true;
      if (b.ladderDir < 0 && b.y + b.h <= lad.yTop) {
        b.y = lad.yTop - b.h;
        b.state = 'chase'; b.onLadder = false; b.targetLadder = null;
      } else if (b.ladderDir > 0 && b.y + b.h >= lad.yBot) {
        b.y = lad.yBot - b.h;
        b.state = 'chase'; b.onLadder = false; b.targetLadder = null;
      }
      this.wrapEntity(b);
      return;
    }

    var onSame = Math.abs(cy - py) < 22;

    if (onSame) {
      b.onLadder = false;
      var dxs = px - cx;
      if (Math.abs(dxs) > 5) {
        b.facing = dxs > 0 ? 1 : -1;
        b.x += b.facing * speed * dt;
        b.walking += dt * 9;
      } else {
        b.walking = 0;
      }
      var fy = this.floorBelow(cx, b.y + b.h);
      if (fy !== null) b.y = fy - b.h;
    } else {
      if (b.state !== 'toLadder' || !b.targetLadder) {
        var goingUp = py < cy;
        var best = null, bestScore = Infinity;
        for (var i = 0; i < this.ladders.length; i++) {
          var l = this.ladders[i];
          if (goingUp && l.yTop >= cy - 6) continue;
          if (!goingUp && l.yBot <= cy + 6) continue;
          var atTop = Math.abs((b.y + b.h) - l.yTop) < 20;
          var atBot = Math.abs((b.y + b.h) - l.yBot) < 20;
          if (!atTop && !atBot) continue;
          var ty = goingUp ? l.yTop : l.yBot;
          var score = Math.abs(ty - cy) * 0.6 + Math.abs((l.x + 8) - cx);
          if (score < bestScore) { bestScore = score; best = l; }
        }
        b.targetLadder = best;
        b.state = best ? 'toLadder' : 'chase';
      }

      if (b.targetLadder) {
        var t = b.targetLadder;
        var tx = t.x + 8;
        var d = tx - cx;
        if (Math.abs(d) <= 5) {
          var goingUp2 = py < cy;
          b.ladderDir = goingUp2 ? -1 : 1;
          b.state = 'climb';
          b.x = tx - b.w / 2;
        } else {
          b.facing = d > 0 ? 1 : -1;
          b.x += b.facing * speed * dt;
          b.walking += dt * 9;
        }
        var fy2 = this.floorBelow(cx, b.y + b.h);
        if (fy2 !== null) b.y = fy2 - b.h;
      } else {
        var dx2 = px - cx;
        if (Math.abs(dx2) > 5) {
          b.facing = dx2 > 0 ? 1 : -1;
          b.x += b.facing * speed * dt;
          b.walking += dt * 8;
        }
        var fy3 = this.floorBelow(cx, b.y + b.h);
        if (fy3 !== null) b.y = fy3 - b.h;
      }
    }

    b.throwCd -= dt;
    if (b.throwCd <= 0) {
      b.throwCd = rand(3.2, 5.6);
      this.throwBottle();
    }

    this.wrapEntity(b);
  },

  wrapEntity: function (e) {
    if (!e) return;
    if (e.x + e.w < 0) e.x = WORLD_W - 1;
    else if (e.x > WORLD_W) e.x = -e.w + 1;
    if (e.y < -40) e.y = -40;
  },

  throwBottle: function () {
    var b = this.brute, p = this.player;
    if (!b || !p || b.stunned > 0) return;
    var fromX = b.x + b.w / 2;
    var fromY = b.y + 8;
    var dx = (p.x + p.w / 2) - fromX;
    var dy = (p.y + p.h / 2) - fromY;
    var dist = Math.max(1, Math.hypot(dx, dy));
    var sp = 190 + this.level * 10;
    this.bottles.push({
      x: fromX, y: fromY, w: 10, h: 14,
      vx: (dx / dist) * sp,
      vy: -160,
      life: 3.2, rot: 0
    });
    Sound.tone({ f0: 320, f1: 520, dur: 0.08, type: 'triangle', vol: 0.06 });
  },

  updateBottles: function (dt) {
    for (var i = this.bottles.length - 1; i >= 0; i--) {
      var b = this.bottles[i];
      b.life -= dt;
      b.rot += dt * 8;
      b.vy += 620 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      var gy = this.floorBelow(b.x + b.w / 2, b.y + b.h);
      if (gy !== null && b.y + b.h >= gy && b.vy > 0) {
        b.y = gy - b.h;
        b.vy = 0; b.vx = 0;
      }
      if (b.life <= 0 || b.y > WORLD_H + 40) this.bottles.splice(i, 1);
    }
  },

  updatePunches: function (dt) {
    for (var i = this.punches.length - 1; i >= 0; i--) {
      this.punches[i].life -= dt;
      if (this.punches[i].life <= 0) this.punches.splice(i, 1);
    }
  },

  /* ★ 修复：随机选一层落地，而不是永远落在最顶层 */
  spawnDropAt: function (type) {
    var w, h;
    if (type === 'spinach') { w = 20; h = 22; }
    else if (type === 'clock' || type === 'life') { w = 20; h = 20; }
    else { w = 16; h = 18; }

    /* 顶层 20% 概率，其余优先中下层 */
    var fi;
    if (Math.random() < 0.2) fi = randInt(0, 1);
    else fi = randInt(1, this.floors.length - 1);

    var f = this.floors[fi];
    var x = rand(24, WORLD_W - w - 24);

    var y;
    if (fi === 0) {
      y = -40;
    } else {
      y = f.y - h - 12;
      var prevTop = this.floors[fi - 1].y;
      var minY = prevTop + 12;
      if (y < minY) y = minY;
    }

    this.drops.push({
      x: x, y: y, w: w, h: h,
      vx: rand(-8, 8), vy: 0,
      type: type,
      landed: false,
      hover: fi === 0 ? 0 : 0.45,
      targetY: f.y,
      life: 0,
      rot: Math.random() * TAU,
      warn: 0.45
    });
  },

  updateDrops: function (dt) {
    for (var i = this.drops.length - 1; i >= 0; i--) {
      var d = this.drops[i];

      if (d.landed) {
        d.life -= dt;
        if (d.life <= 0) this.drops.splice(i, 1);
        continue;
      }

      if (d.warn > 0) d.warn -= dt;

      if (d.hover > 0) {
        d.hover -= dt;
        if (d.hover <= 0) d.vy = 60;
        continue;
      }

      d.vy += 620 * dt;
      if (d.vy > 340) d.vy = 340;
      d.y += d.vy * dt;
      d.x += d.vx * dt;

      if (d.y + d.h >= d.targetY) {
        d.y = d.targetY - d.h;
        d.vy = 0;
        d.landed = true;
        d.life = 7;
        this.dust(d.x + d.w / 2, d.targetY, 4);
      }

      if (d.y > WORLD_H + 60) this.drops.splice(i, 1);
    }
  },

  spawnLogic: function (dt) {
    this.spinachTimer -= dt;
    if (this.spinachTimer <= 0) {
      this.spinachTimer = rand(10, 16);
      var has = false;
      for (var i = 0; i < this.drops.length; i++) if (this.drops[i].type === 'spinach') { has = true; break; }
      if (!has) this.spawnDropAt('spinach');
    }

    this.clockTimer -= dt;
    if (this.clockTimer <= 0) {
      this.clockTimer = rand(13, 20);
      this.spawnDropAt(Math.random() < 0.3 ? 'life' : 'clock');
    }

    this.dropTimer -= dt;
    if (this.dropTimer <= 0) {
      this.dropTimer = rand(1.3, 2.3);
      var types = ['trash', 'vase', 'bottle'];
      this.spawnDropAt(types[randInt(0, types.length - 1)]);
    }

    this.bottleTimer -= dt;
    if (this.bottleTimer <= 0) {
      this.bottleTimer = rand(3.5, 6);
      if (this.brute && this.brute.stunned <= 0) this.throwBottle();
    }
  },

  checkCollisions: function () {
    var p = this.player, b = this.brute;
    if (!p || p.respawn > 0) return;

    var pBox = { x: p.x + 2, y: p.y + 4, w: p.w - 4, h: p.h - 6 };
    var bBox = (b && b.stunned <= 0) ? { x: b.x + 3, y: b.y + 4, w: b.w - 6, h: b.h - 6 } : null;

    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      if (it.got) continue;
      if (overlap(pBox, { x: it.x + 2, y: it.y + 2, w: 28, h: 28 })) {
        it.got = true;
        this.itemsCollected++;
        this.onCollect(it);
      }
    }

    for (var j = this.bottles.length - 1; j >= 0; j--) {
      var bo = this.bottles[j];
      for (var k = 0; k < this.punches.length; k++) {
        if (overlap(this.punches[k], bo)) {
          this.bottles.splice(j, 1);
          this.addScore(50);
          this.addFloat(bo.x, bo.y - 10, '+50', '#a5f3fc');
          this.sparkle(bo.x + 5, bo.y + 7, '#7dd3fc', 6);
          Sound.punch();
          break;
        }
      }
    }

    for (var m = this.drops.length - 1; m >= 0; m--) {
      var d = this.drops[m];
      var dBox = { x: d.x + 2, y: d.y + 2, w: d.w - 4, h: d.h - 4 };

      if (overlap(pBox, dBox)) {
        if (d.type === 'spinach') {
          this.invincible = 9;
          this.addScore(300);
          this.addFloat(p.x + p.w / 2, p.y - 12, '💪 菠菜！', '#4ade80');
          Sound.spinach();
          this.showToast('💪 大力水手！9 秒无敌', 'green');
          this.updatePowerBar();
          this.drops.splice(m, 1);
          continue;
        }
        if (d.type === 'clock') {
          this.slowTimer = 6;
          this.addScore(200);
          this.addFloat(p.x + p.w / 2, p.y - 12, '⏱ 布鲁托变慢', '#a78bfa');
          Sound.clock();
          this.showToast('⏱ 布鲁托减速 6 秒', 'purple');
          this.drops.splice(m, 1);
          continue;
        }
        if (d.type === 'life') {
          this.lives++;
          this.addScore(200);
          this.addFloat(p.x + p.w / 2, p.y - 12, '❤ 生命 +1', '#fb7185');
          Sound.life();
          this.showToast('❤ 生命 +1', 'green');
          this.updateHUD();
          this.drops.splice(m, 1);
          continue;
        }

        if (!d.landed) continue;

        Sound.bonk();
        var dir = (p.x + p.w / 2 < d.x + d.w / 2) ? -1 : 1;
        p.knockback = 0.32;
        p.kbVX = dir * 210;
        this.shake = Math.max(this.shake, 5);
        this.addFloat(p.x + p.w / 2, p.y - 10, '哎哟！', '#f87171');
        this.drops.splice(m, 1);
        continue;
      }

      if (bBox && overlap(bBox, dBox) && (d.type === 'trash' || d.type === 'vase' || d.type === 'bottle')) {
        Sound.bonk();
        b.x = this.bruteStart.x;
        b.y = this.bruteStart.y;
        b.vx = 0; b.vy = 0;
        b.state = 'chase'; b.targetLadder = null; b.onLadder = false;
        b.stunned = 0; b.knockback = 0; b.stuckTimer = 0;
        b.lastX = b.x; b.lastY = b.y;
        this.addScore(500);
        this.addFloat(b.x + b.w / 2, b.y - 14, '+500 送回塔顶', '#4ade80');
        this.sparkle(b.x + b.w / 2, b.y + b.h / 2, '#fbbf24', 14);
        this.shake = Math.max(this.shake, 7);
        this.showToast('💥 布鲁托被砸回塔顶 +500', 'green');
        this.drops.splice(m, 1);
        continue;
      }
    }

    if (bBox && overlap(pBox, bBox)) {
      if (this.invincible > 0) {
        var dirx = p.facing;
        b.stunned = 1.6;
        b.vx = dirx * 340;
        b.vy = -280;
        b.onLadder = false;
        b.targetLadder = null;
        b.state = 'chase';
        this.addScore(2000);
        this.addFloat(b.x + b.w / 2, b.y - 16, '+2000 打飞！', '#fbbf24');
        this.sparkle(b.x + b.w / 2, b.y + b.h / 2, '#fde047', 18);
        this.shake = Math.max(this.shake, 9);
        this.flash = 0.35;
        Sound.punch();
        Sound.hit();
        this.showToast('💥 一拳打飞布鲁托 +2000', 'green');
      } else if (p.knockback <= 0) {
        Sound.hit();
        this.loseLife();
      }
    }
  },

  onCollect: function (it) {
    var p = this.player;
    var base;
    var py = p.y + p.h;
    if (py < 4 * TILE) base = 500;
    else if (py < 7 * TILE) base = 300;
    else if (py < 10 * TILE) base = 120;
    else base = 50;

    if (this.comboTimer > 0) this.combo = Math.min(this.combo + 1, 20);
    else this.combo = 1;
    this.comboTimer = 3;

    var mult = 1 + Math.min(this.combo - 1, 9) * 0.2;
    var pts = Math.round(base * mult);
    if (this.invincible > 0) pts *= 2;

    this.addScore(pts);
    this.addFloat(it.x + 16, it.y - 4, '+' + pts, this.combo > 1 ? '#f472b6' : '#fde047');
    this.sparkle(it.x + 16, it.y + 16,
      it.type === 'heart' ? '#fb7185' : (it.type === 'note' ? '#fbbf24' : '#7dd3fc'), 7);
    Sound.collect();
    if (this.combo > 1) Sound.combo(this.combo);
    this.updateComboUI();
    this.updateHUD();
  },

  onWin: function () {
    this.state = 'win';
    Sound.musicStop();
    Sound.win();
    this.flash = 0.8;
    this.addScore(1000 + this.lives * 500);
    Save.data.best = Math.max(Save.data.best, this.score);
    Save.data.bestLevel = Math.max(Save.data.bestLevel, this.level);
    Save.save();
    this.updateBestUI();
    var next = this.level % THEMES.length + 1;
    $('winSub').textContent = '得分 ' + this.score + ' · 下一步：第 ' + next + ' 关 ' +
      THEMES[(next - 1) % THEMES.length].name;
    this.show('winOverlay');
  },

  loseLife: function () {
    this.lives--;
    this.updateHUD();
    this.shake = 10;
    this.flash = 0.45;
    var p = this.player;
    this.sparkle(p.x + p.w / 2, p.y + p.h / 2, '#f87171', 20);

    if (this.lives <= 0) {
      this.state = 'over';
      Sound.musicStop();
      Sound.lose();
      Save.data.best = Math.max(Save.data.best, this.score);
      Save.data.bestLevel = Math.max(Save.data.bestLevel, this.level);
      Save.save();
      this.updateBestUI();
      $('overSub').textContent = '得分 ' + this.score + ' · 到达第 ' + this.level + ' 关';
      this.show('overOverlay');
      return;
    }

    p.x = this.playerStart.x;
    p.y = this.playerStart.y;
    p.vx = 0; p.vy = 0;
    p.onLadder = false; p.ladder = null;
    p.respawn = 1.2;
    p.knockback = 0;
    this.combo = 0;
    this.updateComboUI();

    var b = this.brute;
    if (b) {
      b.x = this.bruteStart.x;
      b.y = this.bruteStart.y;
      b.vx = 0; b.vy = 0;
      b.stunned = 0; b.knockback = 0;
      b.state = 'chase'; b.targetLadder = null; b.onLadder = false;
      b.lastX = b.x; b.lastY = b.y;
      b.stuckTimer = 0;
    }
    this.showToast('💔 掉了一条命', 'red');
  },

  addScore: function (n) {
    this.score += n;
    if (this.score >= this.nextBonusLife) {
      this.nextBonusLife += 30000;
      this.lives++;
      Sound.life();
      this.showToast('❤ 奖励一条命！', 'green');
    }
    this.updateHUD();
  },

  updateHUD: function () {
    $('scoreVal').textContent = this.score;
    $('livesVal').textContent = this.lives;
    $('levelVal').textContent = this.level;
    $('itemLeftVal').textContent = Math.max(0, this.itemsTotal - this.itemsCollected);
  },

  updateComboUI: function () {
    var wrap = $('comboWrap');
    if (!wrap) return;
    if (this.combo > 1) {
      wrap.classList.add('on');
      $('comboVal').textContent = 'x' + this.combo;
    } else {
      wrap.classList.remove('on');
    }
  },

  updatePowerBar: function () {
    var bar = $('powerBar'), fill = $('powerFill');
    if (!bar) return;
    if (this.invincible > 0) {
      bar.classList.add('on');
      fill.style.width = (this.invincible / 9 * 100) + '%';
    } else {
      bar.classList.remove('on');
      fill.style.width = '0%';
    }
  },

  setHint: function () {
    var bar = $('hintBar');
    if (!bar) return;
    var msg;
    if (this.invincible > 0) {
      msg = '💪 菠菜无敌 ' + this.invincible.toFixed(1) + ' 秒';
      bar.classList.add('spinach');
      bar.classList.remove('slow');
    } else if (this.slowTimer > 0) {
      msg = '⏱ 布鲁托减速 ' + this.slowTimer.toFixed(1) + ' 秒';
      bar.classList.add('slow');
      bar.classList.remove('spinach');
    } else {
      msg = '第 ' + this.level + ' 关 · ' + this.theme.name + ' · 剩余 ' +
        Math.max(0, this.itemsTotal - this.itemsCollected) + ' 个道具';
      bar.classList.remove('spinach');
      bar.classList.remove('slow');
    }
    if (msg !== this.lastHint) {
      bar.textContent = msg;
      this.lastHint = msg;
    }
  },

  sparkle: function (cx, cy, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var sp = rand(30, 150);
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: rand(0.3, 0.6), maxLife: 0.6,
        size: rand(2, 4), color: color, gravity: 380
      });
    }
  },
  dust: function (cx, cy, n) {
    for (var i = 0; i < n; i++) {
      this.particles.push({
        x: cx + rand(-6, 6), y: cy - rand(0, 4),
        vx: rand(-40, 40), vy: rand(-60, -10),
        life: rand(0.25, 0.45), maxLife: 0.45,
        size: rand(3, 6), color: 'rgba(210,195,165,0.75)', gravity: 60
      });
    }
  },
  addFloat: function (x, y, text, color) {
    this.floats.push({ x: x, y: y, text: text, color: color || '#fff', life: 0.9, maxLife: 0.9 });
  },
  updateParticles: function (dt) {
    for (var i = this.particles.length - 1; i >= 0; i--) {
      var p = this.particles[i];
      p.vy += (p.gravity || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (var j = this.floats.length - 1; j >= 0; j--) {
      var f = this.floats[j];
      f.y -= 26 * dt;
      f.life -= dt;
      if (f.life <= 0) this.floats.splice(j, 1);
    }
  },

  pause: function () {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    Sound.musicStop();
    this.show('pauseOverlay');
  },
  resume: function () {
    if (this.state !== 'paused') return;
    this.hide('pauseOverlay');
    this.state = 'playing';
    this.lastTime = performance.now();
    Sound.musicStart((this.level - 1) % THEMES.length);
  },

  /* ================= 渲染 ================= */
  render: function () {
    var ctx = this.ctx;
    if (!ctx) return;

    if (this.state === 'menu') { this.renderMenuBg(); return; }

    ctx.save();
    var sx = 0, sy = 0;
    if (this.shake > 0.4) {
      sx = (Math.random() - 0.5) * this.shake;
      sy = (Math.random() - 0.5) * this.shake;
    }
    ctx.translate(sx, sy);

    if (!this.bgCache) this.buildBg();
    if (this.bgCache) ctx.drawImage(this.bgCache, 0, 0, WORLD_W, WORLD_H);

    this.drawFloors(ctx);
    this.drawLadders(ctx);

    var i;
    for (i = 0; i < this.items.length; i++) if (!this.items[i].got) this.drawItem(this.items[i]);
    for (i = 0; i < this.drops.length; i++) this.drawDrop(this.drops[i]);
    for (i = 0; i < this.bottles.length; i++) this.drawBottle(this.bottles[i]);
    for (i = 0; i < this.punches.length; i++) this.drawPunch(this.punches[i]);

    if (this.brute) this.drawEntityWrapped(this.brute, 'brute');
    if (this.player && this.player.respawn <= 0) this.drawEntityWrapped(this.player, 'player');

    this.drawParticles(ctx);
    ctx.restore();

    if (this.flash > 0) {
      ctx.globalAlpha = Math.min(0.7, this.flash);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      ctx.globalAlpha = 1;
    }
    this.drawVignette(ctx);
  },

  drawEntityWrapped: function (e, kind) {
    var draw = kind === 'brute' ? this.drawBrute : this.drawPlayer;
    draw.call(this, e);
    if (e.x < 0) {
      var old = e.x; e.x += WORLD_W;
      draw.call(this, e);
      e.x = old;
    } else if (e.x + e.w > WORLD_W) {
      var old2 = e.x; e.x -= WORLD_W;
      draw.call(this, e);
      e.x = old2;
    }
  },

  renderMenuBg: function () {
    var ctx = this.ctx;
    var g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    g.addColorStop(0, '#0d1730');
    g.addColorStop(1, '#04060c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    for (var i = 0; i < 50; i++) {
      var x = (i * 137 + this.time * 20) % WORLD_W;
      var y = (i * 91) % WORLD_H;
      ctx.globalAlpha = 0.15 + Math.sin(this.time * 2 + i) * 0.15;
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  },

  buildBg: function () {
    var cv = document.createElement('canvas');
    cv.width = WORLD_W;
    cv.height = WORLD_H;
    var c = cv.getContext('2d');
    var th = this.theme || THEMES[0];

    var g = c.createLinearGradient(0, 0, 0, WORLD_H);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(1, th.sky[1]);
    c.fillStyle = g;
    c.fillRect(0, 0, WORLD_W, WORLD_H);

    c.globalAlpha = 0.10;
    c.fillStyle = th.accent;
    for (var i = 0; i < 6; i++) {
      var bx = (i * 97) % WORLD_W;
      var by = (i * 71) % WORLD_H;
      c.beginPath();
      c.arc(bx, by, 50 + (i % 3) * 26, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;

    for (var s = 0; s < 40; s++) {
      var sx = (s * 137) % WORLD_W;
      var sy = (s * 211) % WORLD_H;
      c.fillStyle = 'rgba(180,220,255,0.35)';
      c.fillRect(sx, sy, 2, 2);
    }

    this.bgCache = cv;
  },

  drawFloors: function (ctx) {
    var th = this.theme;
    for (var i = 0; i < this.floors.length; i++) {
      var f = this.floors[i];
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(f.x, f.y + 9, f.w, 3);
      ctx.fillStyle = th.floor;
      ctx.fillRect(f.x, f.y, f.w, 10);
      ctx.fillStyle = th.top;
      ctx.fillRect(f.x, f.y, f.w, 2.5);
      ctx.fillStyle = th.dark;
      ctx.fillRect(f.x, f.y + 7.5, f.w, 2.5);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      for (var x = f.x + 10; x < f.x + f.w - 6; x += 28) {
        ctx.fillRect(x, f.y + 3, 1.5, 4);
      }
    }
  },

  drawLadders: function (ctx) {
    var th = this.theme;
    for (var i = 0; i < this.ladders.length; i++) {
      var l = this.ladders[i];
      var w = 16;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(l.x + 2, l.yTop, w, l.yBot - l.yTop);
      ctx.fillStyle = th.lad;
      ctx.fillRect(l.x + 1, l.yTop, 2.4, l.yBot - l.yTop + 10);
      ctx.fillRect(l.x + w - 3.4, l.yTop, 2.4, l.yBot - l.yTop + 10);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(l.x + 1, l.yTop, 1, l.yBot - l.yTop + 10);
      for (var y = l.yTop + 5; y < l.yBot + 8; y += 7) {
        ctx.fillStyle = th.lad;
        ctx.fillRect(l.x + 1, y, w - 2.4, 2);
      }
    }
  },

  drawItem: function (it) {
    var ctx = this.ctx;
    var bob = Math.sin(it.anim * 3) * 2;
    var cx = it.x + 16, cy = it.y + 16 + bob;

    ctx.globalAlpha = 0.18 + Math.sin(it.anim * 2) * 0.06;
    ctx.fillStyle = it.type === 'heart' ? '#fb7185' : it.type === 'note' ? '#fbbf24' : '#7dd3fc';
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (it.type === 'heart') {
      ctx.fillStyle = '#ff3b7a';
      ctx.fillRect(cx - 8, cy - 6, 4, 4);
      ctx.fillRect(cx + 4, cy - 6, 4, 4);
      ctx.fillRect(cx - 10, cy - 2, 20, 4);
      ctx.fillRect(cx - 8, cy + 2, 16, 4);
      ctx.fillRect(cx - 6, cy + 6, 12, 2);
      ctx.fillRect(cx - 4, cy + 8, 8, 2);
      ctx.fillStyle = '#ffb3cc';
      ctx.fillRect(cx - 6, cy - 4, 3, 2);
    } else if (it.type === 'note') {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(cx + 2, cy - 9, 3, 14);
      ctx.fillRect(cx - 5, cy + 1, 10, 6);
      ctx.fillRect(cx + 5, cy - 11, 7, 3);
      ctx.fillStyle = '#fff3c4';
      ctx.fillRect(cx + 2, cy - 9, 1, 9);
    } else {
      ctx.fillStyle = '#082f49';
      ctx.fillRect(cx - 11, cy - 12, 22, 24);
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - 10, cy - 11, 20, 22);
      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.letter, cx, cy + 1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  },

  drawDrop: function (d) {
    var ctx = this.ctx;

    /* 落点预警 */
    if (!d.landed) {
      var pulse = 0.35 + Math.sin(this.time * 16) * 0.28;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = d.type === 'spinach' ? '#4ade80' :
                      d.type === 'clock' ? '#a78bfa' :
                      d.type === 'life' ? '#fb7185' : '#f87171';
      ctx.beginPath();
      ctx.ellipse(d.x + d.w / 2, d.targetY - 2, 14, 5, 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = Math.min(1, d.life / 1.2);
    }

    /* 悬停预警闪烁 */
    if (!d.landed && d.warn > 0) {
      if (Math.floor(this.time * 12) % 2 === 0) ctx.globalAlpha *= 0.35;
    }

    var px = d.x, py = d.y, w = d.w, h = d.h;

    if (d.type === 'spinach') {
      ctx.fillStyle = '#166534';
      ctx.fillRect(px + 2, py + 5, w - 4, h - 5);
      ctx.fillStyle = '#a3a3a3';
      ctx.fillRect(px, py, w, 5);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(px + 4, py + 9, w - 8, 7);
      ctx.fillStyle = '#166534';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', px + w / 2, py + 13);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    } else if (d.type === 'clock') {
      ctx.fillStyle = '#c4b5fd';
      ctx.beginPath();
      ctx.arc(px + w / 2, py + h / 2, w / 2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#6d28d9';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = '#3b0764';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px + w / 2, py + h / 2);
      ctx.lineTo(px + w / 2, py + 4);
      ctx.moveTo(px + w / 2, py + h / 2);
      ctx.lineTo(px + w - 5, py + h / 2);
      ctx.stroke();
    } else if (d.type === 'life') {
      var cx = px + w / 2, cy = py + h / 2;
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(cx - 7, cy - 5, 3, 3);
      ctx.fillRect(cx + 4, cy - 5, 3, 3);
      ctx.fillRect(cx - 8, cy - 2, 16, 4);
      ctx.fillRect(cx - 6, cy + 2, 12, 3);
      ctx.fillRect(cx - 3, cy + 5, 6, 2);
    } else if (d.type === 'trash') {
      ctx.fillStyle = '#6b7280';
      ctx.fillRect(px, py + 2, w, h - 2);
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(px, py, w, 4);
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(px + 3, py + 7, w - 6, h - 10);
    } else if (d.type === 'vase') {
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(px + 4, py + 2, 8, 4);
      ctx.fillRect(px + 2, py + 6, 12, 9);
      ctx.fillRect(px + 4, py + 15, 8, 3);
      ctx.fillStyle = '#d8b4fe';
      ctx.fillRect(px + 3, py + 3, 2, 10);
    } else {
      ctx.fillStyle = '#166534';
      ctx.fillRect(px + 2, py + 3, 6, 12);
      ctx.fillStyle = '#15803d';
      ctx.fillRect(px + 3, py, 4, 4);
    }

    ctx.globalAlpha = 1;
  },

  drawBottle: function (b) {
    var ctx = this.ctx;
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.rotate(b.rot);
    ctx.fillStyle = '#166534';
    ctx.fillRect(-3, -5, 6, 11);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(-2, -7, 4, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-2, -3, 1.5, 6);
    ctx.restore();
  },

  drawPunch: function (p) {
    var ctx = this.ctx;
    var t = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w * 0.7, p.h * 0.5, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = t * 0.5;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.w * 0.9 + (1 - t) * 10, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  },

  drawPlayer: function (p) {
    var ctx = this.ctx;
    if (this.invincible > 0 && Math.floor(this.time * 14) % 2 === 0) return;

    var px = p.x, py = p.y, w = p.w, h = p.h;
    var walk = Math.floor(p.walking) % 2;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(px + w / 2, py + h + 1, w * 0.55, 3, 0, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#1e293b';
    if (walk === 0) {
      ctx.fillRect(px + 2, py + h - 6, 7, 6);
      ctx.fillRect(px + w - 9, py + h - 6, 7, 6);
    } else {
      ctx.fillRect(px + 3, py + h - 6, 7, 6);
      ctx.fillRect(px + w - 10, py + h - 6, 7, 6);
    }
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px + 1, py + h - 2, 9, 2);
    ctx.fillRect(px + w - 10, py + h - 2, 9, 2);

    var bg = ctx.createLinearGradient(px, py + 8, px, py + h - 6);
    bg.addColorStop(0, '#3b82f6');
    bg.addColorStop(1, '#1e40af');
    ctx.fillStyle = bg;
    ctx.fillRect(px + 2, py + 9, w - 4, h - 15);

    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(px + 4, py + 8, w - 8, 3);
    ctx.fillRect(px + w / 2 - 3, py + 8, 6, 6);

    ctx.fillStyle = '#fcd9b6';
    if (p.facing > 0) {
      ctx.fillRect(px + w - 4, py + 13, 6, 10);
      ctx.fillStyle = '#f6c89a';
      ctx.fillRect(px + w - 1, py + 15, 4, 6);
      ctx.fillStyle = '#fcd9b6';
      ctx.fillRect(px - 1, py + 15, 5, 8);
    } else {
      ctx.fillRect(px - 2, py + 13, 6, 10);
      ctx.fillStyle = '#f6c89a';
      ctx.fillRect(px - 3, py + 15, 4, 6);
      ctx.fillStyle = '#fcd9b6';
      ctx.fillRect(px + w - 4, py + 15, 5, 8);
    }

    ctx.fillStyle = '#fcd9b6';
    ctx.fillRect(px + 4, py, w - 8, 10);

    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(px + 2, py - 4, w - 4, 5);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(px + 2, py - 4, w - 4, 1.5);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(px + 2, py + 1, w - 4, 2);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px + w / 2 - 2, py - 2, 4, 3);

    ctx.fillStyle = '#0f172a';
    if (p.facing > 0) {
      ctx.fillRect(px + 12, py + 4, 2.5, 3);
      ctx.fillRect(px + 6, py + 4, 2, 3);
    } else {
      ctx.fillRect(px + 6, py + 4, 2.5, 3);
      ctx.fillRect(px + 13, py + 4, 2, 3);
    }
    ctx.fillStyle = '#f6c89a';
    ctx.fillRect(px + w / 2 - 1, py + 5, 3, 3);

    ctx.fillStyle = '#78350f';
    if (p.facing > 0) {
      ctx.fillRect(px + w - 3, py + 7, 5, 2);
      ctx.fillRect(px + w + 1, py + 5, 3, 3);
    } else {
      ctx.fillRect(px - 2, py + 7, 5, 2);
      ctx.fillRect(px - 4, py + 5, 3, 3);
    }

    if (this.invincible > 0) {
      var a = this.time * 6;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(px + w / 2, py + h / 2, w * 0.95, h * 0.75, 0, 0, TAU);
      ctx.stroke();
      for (var i = 0; i < 3; i++) {
        var ang = a + i * TAU / 3;
        ctx.fillStyle = '#bbf7d0';
        ctx.beginPath();
        ctx.arc(px + w / 2 + Math.cos(ang) * w * 0.9,
                py + h / 2 + Math.sin(ang) * h * 0.7, 2.2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (p.knockback > 0) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#fff';
      ctx.fillRect(px, py, w, h);
      ctx.globalAlpha = 1;
    }
  },

  drawBrute: function (b) {
    var ctx = this.ctx;
    var px = b.x, py = b.y, w = b.w, h = b.h;
    var walk = Math.floor(b.walking) % 2;

    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.ellipse(px + w / 2, py + h + 1, w * 0.6, 3.2, 0, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#111827';
    if (walk === 0) {
      ctx.fillRect(px + 3, py + h - 6, 9, 6);
      ctx.fillRect(px + w - 12, py + h - 6, 9, 6);
    } else {
      ctx.fillRect(px + 5, py + h - 6, 9, 6);
      ctx.fillRect(px + w - 14, py + h - 6, 9, 6);
    }

    var bg = ctx.createLinearGradient(px, py + 9, px, py + h - 6);
    bg.addColorStop(0, '#4b5563');
    bg.addColorStop(1, '#1f2937');
    ctx.fillStyle = bg;
    ctx.fillRect(px + 1, py + 9, w - 2, h - 15);

    ctx.fillStyle = '#4b5563';
    ctx.fillRect(px - 3, py + 12, 5, 12);
    ctx.fillRect(px + w - 2, py + 12, 5, 12);
    ctx.fillStyle = '#fcd9b6';
    ctx.fillRect(px - 3, py + 22, 5, 4);
    ctx.fillRect(px + w - 2, py + 22, 5, 4);

    ctx.fillStyle = '#fcd9b6';
    ctx.fillRect(px + 4, py, w - 8, 11);

    ctx.fillStyle = '#0b0f17';
    ctx.fillRect(px + 4, py + 7, w - 8, 5);
    ctx.fillRect(px + 6, py + 11, w - 12, 2);

    ctx.fillStyle = '#111827';
    ctx.fillRect(px + 3, py - 4, w - 6, 5);
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(px + 3, py - 4, w - 6, 1.5);

    ctx.fillStyle = '#fde047';
    ctx.fillRect(px + 6, py + 3, 4, 3.5);
    ctx.fillRect(px + w - 10, py + 3, 4, 3.5);
    ctx.fillStyle = '#000';
    var look = b.facing > 0 ? 1 : -1;
    ctx.fillRect(px + 7 + look, py + 4, 1.8, 2);
    ctx.fillRect(px + w - 9 + look, py + 4, 1.8, 2);

    if (b.stunned > 0) {
      ctx.globalAlpha = 0.55 + Math.sin(this.time * 22) * 0.35;
      ctx.fillStyle = '#fff';
      for (var i = 0; i < 3; i++) {
        var a = this.time * 5 + i * TAU / 3;
        ctx.beginPath();
        ctx.arc(px + w / 2 + Math.cos(a) * 12, py - 8 + Math.sin(a) * 4, 2.4, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(px, py, w, h);
    }

    if (this.slowTimer > 0 && b.stunned <= 0) {
      ctx.globalAlpha = 0.45 + Math.sin(this.time * 6) * 0.2;
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(px + w / 2, py + h / 2, w * 0.8, h * 0.65, 0, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  },

  drawParticles: function (ctx) {
    for (var i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      var t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + t * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    for (var j = 0; j < this.floats.length; j++) {
      var f = this.floats[j];
      var a = clamp(f.life / f.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  },

  drawVignette: function (ctx) {
    if (!this.vignette) {
      this.vignette = ctx.createRadialGradient(
        WORLD_W / 2, WORLD_H / 2, WORLD_H * 0.34,
        WORLD_W / 2, WORLD_H / 2, WORLD_W * 0.78
      );
      this.vignette.addColorStop(0, 'rgba(0,0,0,0)');
      this.vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
    }
    ctx.fillStyle = this.vignette;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  },

  loop: function (t) {
    var self = this;
    requestAnimationFrame(function (t2) { self.loop(t2); });
    if (!this.lastTime) this.lastTime = t;
    var dt = (t - this.lastTime) / 1000;
    this.lastTime = t;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    if (this.state === 'playing') {
      this.update(dt);
      this.setHint();
      this.updatePowerBar();
    } else if (this.state === 'menu') {
      this.time += dt;
    }
    this.render();
    Sound.musicUpdate(dt * 1000);
  }
};

var toastTimer = null;
function showToast(text, type) {
  var el = $('toast');
  if (!el) return;
  el.textContent = text;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    el.className = 'toast' + (type ? ' ' + type : '');
  }, 1500);
}
Game.showToast = showToast;

window.addEventListener('DOMContentLoaded', function () {
  Game.init();
  Game.updateFsBtn();
});
window.addEventListener('load', function () { setTimeout(function () { Game.resize(); }, 60); });

})();
</script>
