<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e20">
<title>大力水手 · Popeye</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --gold: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e20;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #fff;
    touch-action: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    background:
      radial-gradient(ellipse at 50% 0%, #1a2a4a 0%, transparent 60%),
      linear-gradient(180deg, #0a0e20 0%, #050810 100%);
    padding: calc(6px + var(--safe-top)) 6px calc(6px + var(--safe-bottom));
    gap: 5px;
  }
  .top-hud {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 720px;
    padding: 6px 14px;
    background: rgba(15, 23, 42, 0.85);
    border: 1.5px solid rgba(71, 85, 105, 0.6);
    border-radius: 12px;
    gap: 8px;
    flex-shrink: 0;
  }
  .hud-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 800;
    letter-spacing: 1px;
    color: #94a3b8;
    white-space: nowrap;
  }
  .hud-val {
    color: #f1f5f9;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    text-shadow: 0 0 12px currentColor;
  }
  .hud-val.score { color: #fbbf24; }
  .hud-val.lives { color: #fb7185; }
  .hud-val.level { color: #7dd3fc; }

  .canvas-wrap {
    position: relative;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.7),
      0 0 0 2px rgba(71, 85, 105, 0.7),
      0 0 0 4px rgba(15, 23, 42, 0.9);
    background: #000;
    margin: 0 auto;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .hint-bar {
    display: flex; align-items: center; justify-content: center;
    padding: 5px 14px;
    background: rgba(15, 23, 42, 0.8);
    border: 1.5px solid rgba(71, 85, 105, 0.6);
    border-radius: 10px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #94a3b8;
    flex-shrink: 0;
    min-height: 26px;
    text-align: center;
    transition: color 0.2s;
    max-width: 720px;
    width: 100%;
  }
  .hint-bar.spinach { color: #4ade80; border-color: #4ade80; animation: spinachPulse 0.6s ease-in-out infinite alternate; }
  @keyframes spinachPulse {
    from { box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
    to { box-shadow: 0 0 24px rgba(74, 222, 128, 0.9); }
  }

  .ctrl-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 720px;
    padding: 0;
    gap: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .left-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    width: 92px;
    height: 52px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.08s, filter 0.08s;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.35);
  }
  .action-btn:active { transform: scale(0.92); filter: brightness(1.2); }
  .action-btn.pause {
    background: radial-gradient(circle at 34% 28%, #93c5fd, #2563eb 62%, #1e3a8a);
  }
  .action-btn.restart {
    background: radial-gradient(circle at 34% 28%, #fcd34d, #d97706 62%, #78350f);
  }
  .action-btn.punch {
    background: radial-gradient(circle at 34% 28%, #86efac, #16a34a 62%, #14532d);
    height: 60px;
    font-size: 16px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, var(--dp));
    grid-template-rows: repeat(3, var(--dp));
    gap: 8px;
    --dp: 74px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .dpad button {
    background: linear-gradient(180deg, #2f3f55 0%, #232f42 100%);
    border: none;
    color: #7dd3fc;
    font-size: 34px;
    font-weight: 900;
    cursor: pointer;
    touch-action: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.07s, background 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.14),
                0 6px 12px rgba(0, 0, 0, 0.55);
    user-select: none;
    border-radius: 14px;
  }
  .dpad button:active,
  .dpad button.pressed {
    background: linear-gradient(180deg, #3d5372 0%, #2a3950 100%);
    transform: scale(0.9);
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.55),
                0 0 22px rgba(56, 189, 248, 0.7);
    color: #bae6fd;
  }
  .dpad .empty { visibility: hidden; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(2, 6, 23, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-card {
    text-align: center;
    padding: 24px 28px;
    border-radius: 18px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid rgba(71, 85, 105, 0.8);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
    transform: scale(0.85);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
    width: 330px;
  }
  .overlay.show .overlay-card { transform: scale(1); }
  .overlay-emoji { font-size: 48px; line-height: 1; margin-bottom: 10px; }
  .overlay-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    margin-bottom: 8px;
    text-shadow: 0 4px 30px rgba(251, 191, 36, 0.5);
  }
  .overlay-title.lose { color: #fb7185; text-shadow: 0 4px 30px rgba(251, 113, 133, 0.5); }
  .overlay-sub {
    font-size: 13px;
    letter-spacing: 2px;
    color: #94a3b8;
    margin-bottom: 16px;
    line-height: 1.9;
  }
  .overlay-btns {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap;
  }
  .ov-btn {
    padding: 11px 24px;
    border: 1.5px solid rgba(71, 85, 105, 0.8);
    background: rgba(30, 41, 59, 0.9);
    color: #cbd5e1;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .ov-btn:hover { background: rgba(51, 65, 85, 0.95); color: #f1f5f9; transform: translateY(-2px); }
  .ov-btn:active { transform: translateY(0) scale(0.95); }
  .ov-btn.primary {
    background: linear-gradient(160deg, #38bdf8, #0284c7);
    border-color: #0ea5e9;
    color: #fff;
    box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
  }
  .ov-btn.spinach {
    background: linear-gradient(160deg, #4ade80, #16a34a);
    border-color: #4ade80;
    color: #052e16;
    box-shadow: 0 4px 18px rgba(74, 222, 128, 0.4);
  }
  .help-list {
    text-align: left;
    display: inline-block;
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.9;
    margin-bottom: 14px;
  }
  .help-list b {
    display: inline-block;
    min-width: 60px;
    color: #7dd3fc;
    font-weight: 800;
  }
  .toast {
    position: fixed;
    top: calc(20px + var(--safe-top));
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(251, 191, 36, 0.95);
    color: #1a0f00;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 200;
    box-shadow: 0 8px 28px rgba(251, 191, 36, 0.5);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { background: rgba(74, 222, 128, 0.95); box-shadow: 0 8px 28px rgba(74, 222, 128, 0.5); }
  .toast.red   { background: rgba(251, 113, 133, 0.95); color: #fff; box-shadow: 0 8px 28px rgba(251, 113, 133, 0.5); }

  /* 全屏按钮 */
  #fsBtn {
    width: 92px;
    height: 40px;
    border: 2px solid rgba(251, 191, 36, 0.7);
    border-radius: 14px;
    background: radial-gradient(circle at 34% 28%, #2f3f55, #232f42 62%, #1a1a2e);
    color: #fbbf24;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.35);
    font-family: inherit;
    letter-spacing: 2px;
    line-height: 1;
  }
  #fsBtn:hover { background: rgba(251, 191, 36, 0.2); }
  #fsBtn:active { transform: scale(0.92); }
  #fsBtn .fs-enter { display: block; }
  #fsBtn .fs-exit { display: none; }
  #fsBtn.fs-active .fs-enter { display: none; }
  #fsBtn.fs-active .fs-exit { display: block; }

  /* 全屏模式下的适配 */
  #app:fullscreen { padding: 6px; gap: 6px; }
  #app:-webkit-full-screen { padding: 6px; gap: 6px; }

  @media (max-width: 560px) {
    .action-btn { width: 84px; height: 46px; font-size: 13px; border-radius: 12px; }
    .action-btn.punch { height: 54px; font-size: 14px; }
    .dpad { --dp: 66px; gap: 7px; }
    .dpad button { font-size: 30px; border-radius: 12px; }
  }
  @media (max-width: 480px) {
    .action-btn { width: 78px; height: 44px; font-size: 12px; }
    .action-btn.punch { height: 50px; font-size: 13px; }
    .dpad { --dp: 62px; gap: 6px; }
    .dpad button { font-size: 28px; }
  }
  @media (max-width: 420px) {
    .action-btn { width: 72px; height: 42px; font-size: 12px; border-radius: 11px; }
    .action-btn.punch { height: 46px; font-size: 13px; }
    .dpad { --dp: 58px; gap: 5px; }
    .dpad button { font-size: 26px; border-radius: 11px; }
    .ctrl-wrap { gap: 8px; }
  }
  @media (max-width: 380px) {
    .action-btn { width: 66px; height: 40px; font-size: 11px; }
    .action-btn.punch { height: 44px; font-size: 12px; }
    .dpad { --dp: 54px; gap: 5px; }
    .dpad button { font-size: 24px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="top-hud">
    <div class="hud-item">分数 <span class="hud-val score" id="scoreVal">0</span></div>
    <div class="hud-item">生命 <span class="hud-val lives" id="livesVal">3</span></div>
    <div class="hud-item">关卡 <span class="hud-val level" id="levelVal">1</span></div>
    <div class="hud-item" id="itemIconWrap" style="display:none;">剩余 <span class="hud-val" id="itemLeftVal">0</span></div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="game" width="512" height="448"></canvas>
  </div>

  <div class="hint-bar" id="hintBar">
    天上会掉东西 · 砸到布鲁托会把他送回塔顶
  </div>

  <div class="ctrl-wrap">
    <div class="left-actions">
      <button class="action-btn pause" id="pauseBtn">暂停</button>
      <button class="action-btn restart" id="restartBtn">重开</button>
      <button class="action-btn punch" id="punchBtn">出拳</button>
      <button id="fsBtn" title="全屏">⛶</button>
    </div>
    <div class="dpad" id="dpad">
      <button class="empty"></button>
      <button id="upBtn">▲</button>
      <button class="empty"></button>
      <button id="leftBtn">◀</button>
      <button class="empty"></button>
      <button id="rightBtn">▶</button>
      <button class="empty"></button>
      <button id="downBtn">▼</button>
      <button class="empty"></button>
    </div>
  </div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">💪</div>
    <div class="overlay-title">大 力 水 手</div>
    <div class="overlay-sub">P O P E Y E</div>
    <div class="help-list">
      <div><b>移动</b>方向键 / 触屏摇杆</div>
      <div><b>爬梯</b>对准梯子按上/下</div>
      <div><b>出拳</b>J 键 / 出拳按钮</div>
      <div><b>穿越</b>走到边缘可穿屏</div>
      <div><b>目标</b>收集全部道具过关</div>
      <div><b>掉落</b>天上掉东西，砸中布鲁托送他回塔顶</div>
    </div>
    <div class="overlay-btns">
      <button class="ov-btn spinach" id="startBtn">开 始</button>
    </div>
  </div>
</div>

<div class="overlay" id="pauseOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">⏸</div>
    <div class="overlay-title">已 暂 停</div>
    <div class="overlay-sub">想继续还是重开？</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="resumeBtn">继 续</button>
      <button class="ov-btn" id="pauseRestartBtn">重 开</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title">过 关 ！</div>
    <div class="overlay-sub" id="winSub">准备进入下一关</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="nextBtn">下 一 关</button>
    </div>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji">💥</div>
    <div class="overlay-title lose">游 戏 结 束</div>
    <div class="overlay-sub" id="overSub">得分 0</div>
    <div class="overlay-btns">
      <button class="ov-btn primary" id="retryBtn">再 来</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const Sound = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },
  tone(o) {
    if (!this.enabled || !this.ctx) return;
    const { freq, freq2, dur = 0.1, type = 'sine', vol = 0.3, delay = 0 } = o;
    try {
      const t0 = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (freq2 && freq2 !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  collect() { this.tone({ freq: 880, dur: 0.06, type: 'square', vol: 0.22 }); this.tone({ freq: 1320, dur: 0.08, type: 'square', vol: 0.22, delay: 0.05 }); },
  step() { this.tone({ freq: 300, freq2: 400, dur: 0.05, type: 'square', vol: 0.1 }); },
  wrap() { this.tone({ freq: 500, freq2: 900, dur: 0.08, type: 'sine', vol: 0.15 }); },
  spinach() { [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, dur: 0.12, type: 'square', vol: 0.22, delay: i * 0.07 })); },
  punch() { this.tone({ freq: 200, freq2: 100, dur: 0.15, type: 'square', vol: 0.25 }); },
  hit() { this.tone({ freq: 300, freq2: 80, dur: 0.4, type: 'sawtooth', vol: 0.28 }); },
  bonk() { this.tone({ freq: 500, freq2: 150, dur: 0.2, type: 'triangle', vol: 0.22 }); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone({ freq: f, dur: 0.16, type: 'square', vol: 0.24, delay: i * 0.1 })); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone({ freq: f, dur: 0.3, type: 'sawtooth', vol: 0.24, delay: i * 0.15 })); },
  click() { this.tone({ freq: 880, dur: 0.045, type: 'square', vol: 0.08 }); },
  extraLife() { [659, 784, 988, 1319].forEach((f, i) => this.tone({ freq: f, dur: 0.14, type: 'triangle', vol: 0.22, delay: i * 0.08 })); }
};

const TILE = 32;
const COLS = 16;
const ROWS = 14;
const WORLD_W = COLS * TILE;
const WORLD_H = ROWS * TILE;

const Game = {
  canvas: null, ctx: null,

  floors: [],
  ladders: [],

  player: null,
  brute: null,

  drops: [],
  items: [],
  bottles: [],
  punches: [],

  level: 1,
  score: 0,
  lives: 3,
  itemsCollected: 0,
  itemsTotal: 0,
  nextBonusLife: 40000,

  state: 'menu',
  invincible: 0,
  spinachSpawnTimer: 0,
  dropTimer: 0,
  bruteThrowTimer: 0,

  lastTime: 0,
  time: 0,

  keys: { left: false, right: false, up: false, down: false, punch: false },

  levelConfigs: [],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.buildLevelConfigs();
    this.bindUI();
    this.bindInput();
    this.resizeCanvas();
    window.addEventListener('resize', () => this.resizeCanvas());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resizeCanvas(), 200));

    this.lastTime = performance.now();
    requestAnimationFrame(t => this.loop(t));
  },

  resizeCanvas() {
    const wrap = document.getElementById('canvasWrap');
    const maxW = window.innerWidth - 16;
    const hudH = 46;
    const hintH = 34;
    const ctrlH = Math.min(260, window.innerHeight * 0.36);
    const padH = 30;
    const maxH = window.innerHeight - hudH - hintH - ctrlH - padH;
    const ratio = WORLD_W / WORLD_H;
    let w = maxW;
    let h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }
    if (w < 200) { w = 200; h = w / ratio; }
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
  },

  buildLevelConfigs() {
    const LAYERS = 10;
    const yTop = 1.5 * TILE;
    const yBot = 13 * TILE;
    const layerYs = [];
    for (let i = 0; i < LAYERS; i++) {
      layerYs.push(yTop + (yBot - yTop) * i / (LAYERS - 1));
    }

    const POSITIONS = [36, 100, 168, 336, 400, 448];

    function buildFloors() {
      const floors = [];
      for (let i = 0; i < LAYERS; i++) {
        floors.push({ x: 0, y: layerYs[i], w: WORLD_W });
      }
      return floors;
    }

    function buildLadders(sequence) {
      const ladders = [];
      for (let i = 0; i < LAYERS - 1; i++) {
        const upperY = layerYs[i];
        const lowerY = layerYs[i + 1];
        const idx = sequence[i % sequence.length];
        ladders.push({
          x: POSITIONS[idx],
          yTop: upperY,
          yBot: lowerY,
        });
      }
      return ladders;
    }

    this.levelConfigs = [
      { name: '码头', itemType: 'heart', itemCount: 30, ...(() => { const seq = [0, 5, 2, 1, 4, 3, 5, 0, 3]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
      { name: '街道', itemType: 'note', itemCount: 24, ...(() => { const seq = [5, 0, 4, 3, 1, 5, 0, 4, 3]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
      { name: '船舱', itemType: 'letter', itemCount: 30, ...(() => { const seq = [2, 4, 1, 5, 0, 3, 4, 1, 5]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
      { name: '高塔', itemType: 'heart', itemCount: 30, ...(() => { const seq = [1, 3, 4, 0, 5, 1, 4, 3, 0]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
      { name: '双塔', itemType: 'note', itemCount: 24, ...(() => { const seq = [3, 2, 1, 2, 4, 0, 5, 1, 2]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
      { name: '迷宫', itemType: 'letter', itemCount: 30, ...(() => { const seq = [0, 1, 2, 3, 4, 5, 4, 3, 2]; return { floors: buildFloors(), ladders: buildLadders(seq) }; })() },
    ];

    this.levelConfigs.forEach(cfg => {
      const lowest = cfg.floors[cfg.floors.length - 1];
      cfg.playerStart = {
        x: lowest.x + lowest.w / 2 - 12,
        y: lowest.y - 32 + 4,
      };
      const highest = cfg.floors[0];
      cfg.bruteStart = {
        x: highest.x + 32,
        y: highest.y - 32 + 4,
      };
    });
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('startBtn').addEventListener('click', () => {
      Sound.init(); Sound.resume(); Sound.click();
      this.hide('startOverlay');
      this.startGame();
    });
    $('pauseBtn').addEventListener('click', () => {
      Sound.click();
      if (this.state === 'playing') this.pause();
      else if (this.state === 'paused') this.resume();
    });
    $('restartBtn').addEventListener('click', () => {
      Sound.click();
      if (this.state === 'playing' || this.state === 'paused') {
        this.hide('pauseOverlay');
        this.startGame();
      }
    });
    $('resumeBtn').addEventListener('click', () => { Sound.click(); this.resume(); });
    $('pauseRestartBtn').addEventListener('click', () => { Sound.click(); this.hide('pauseOverlay'); this.startGame(); });
    $('nextBtn').addEventListener('click', () => {
      Sound.click();
      this.hide('winOverlay');
      this.level++;
      const cfgCount = this.levelConfigs.length;
      if (this.level > cfgCount) this.level = 1;
      this.startLevel();
    });
    $('retryBtn').addEventListener('click', () => {
      Sound.click();
      this.hide('overOverlay');
      this.startGame();
    });

    // 全屏功能
    const fsBtn = document.getElementById('fsBtn');
    const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    const toggleFullscreen = () => {
      const el = document.documentElement;
      if (!isFullscreen()) {
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    };
    if (fsBtn) {
      fsBtn.addEventListener('click', () => { Sound.click(); toggleFullscreen(); });
    }
    document.addEventListener('fullscreenchange', () => {
      if (fsBtn) fsBtn.classList.toggle('fs-active', isFullscreen());
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (fsBtn) fsBtn.classList.toggle('fs-active', isFullscreen());
    });
    // 全屏状态下重新计算canvas尺寸
    document.addEventListener('fullscreenchange', () => this.resizeCanvas());
    document.addEventListener('webkitfullscreenchange', () => this.resizeCanvas());
  },

  bindInput() {
    window.addEventListener('keydown', e => {
      Sound.init(); Sound.resume();
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); this.keys.left = true; }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); this.keys.right = true; }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); this.keys.up = true; }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); this.keys.down = true; }
      if (e.key === 'j' || e.key === 'J' || e.key === ' ') { e.preventDefault(); this.keys.punch = true; }
      if (e.key === 'p' || e.key === 'P') {
        if (this.state === 'playing') this.pause();
        else if (this.state === 'paused') this.resume();
      }
      if (e.key === 'r' || e.key === 'R') {
        if (this.state === 'playing' || this.state === 'paused' || this.state === 'over') {
          this.hide('pauseOverlay'); this.hide('overOverlay');
          this.startGame();
        }
      }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.keys.down = false;
      if (e.key === 'j' || e.key === 'J' || e.key === ' ') this.keys.punch = false;
    });

    const bindHold = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      const start = (e) => { e.preventDefault(); Sound.init(); Sound.resume(); this.keys[key] = true; el.classList.add('pressed'); };
      const stop = () => { this.keys[key] = false; el.classList.remove('pressed'); };
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointerleave', stop);
      el.addEventListener('pointercancel', stop);
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    };
    bindHold('leftBtn', 'left');
    bindHold('rightBtn', 'right');
    bindHold('upBtn', 'up');
    bindHold('downBtn', 'down');

    const punchBtn = document.getElementById('punchBtn');
    if (punchBtn) {
      const start = (e) => { e.preventDefault(); Sound.init(); Sound.resume(); this.keys.punch = true; punchBtn.classList.add('pressed'); };
      const stop = () => { this.keys.punch = false; punchBtn.classList.remove('pressed'); };
      punchBtn.addEventListener('pointerdown', start);
      punchBtn.addEventListener('pointerup', stop);
      punchBtn.addEventListener('pointerleave', stop);
      punchBtn.addEventListener('pointercancel', stop);
      punchBtn.addEventListener('contextmenu', e => e.preventDefault());
      punchBtn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    }
  },

  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },

  startGame() {
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.nextBonusLife = 40000;
    this.updateHUD();
    this.startLevel();
  },

  startLevel() {
    const cfg = this.levelConfigs[(this.level - 1) % this.levelConfigs.length];
    this.currentConfig = cfg;

    this.floors = cfg.floors;
    this.ladders = cfg.ladders;

    this.player = {
      x: cfg.playerStart.x,
      y: cfg.playerStart.y,
      w: 24, h: 32,
      vx: 0, vy: 0,
      facing: 1,
      onLadder: false,
      ladder: null,
      walking: 0,
      anim: 0,
      respawn: 0,
      punchTimer: 0,
      knockbackTimer: 0,
      knockbackVX: 0,
    };

    this.brute = {
      x: cfg.bruteStart.x,
      y: cfg.bruteStart.y,
      w: 24, h: 32,
      vx: 0, vy: 0,
      facing: 1,
      onLadder: false,
      ladder: null,
      walking: 0,
      anim: 0,
      aiState: 'chase-horizontal',
      aiLadderDir: 0,
      aiLadder: null,
      stunned: 0,
      throwTimer: 0,
      stuckTimer: 0,
      lastX: cfg.bruteStart.x,
      lastY: cfg.bruteStart.y,
      decisionTimer: 0,
      knockbackTimer: 0,
      knockbackVX: 0,
    };

    this.drops = [];
    this.items = [];
    this.bottles = [];
    this.punches = [];
    this.itemsCollected = 0;

    const count = Math.min(cfg.itemCount, 30);
    const positions = this.generateItemPositions(count);
    const letters = 'HELP'.split('');

    positions.forEach((p, i) => {
      let letter = 'A';
      if (cfg.itemType === 'letter') letter = letters[i % letters.length];
      this.items.push({
        x: p.x, y: p.y,
        type: cfg.itemType,
        letter: letter,
        got: false,
        anim: Math.random() * 10
      });
    });

    this.itemsTotal = this.items.length;

    this.spinachSpawnTimer = 6 + Math.random() * 4;
    this.dropTimer = 1.6 + Math.random() * 1.2;
    this.bruteThrowTimer = 3 + Math.random() * 2;

    this.state = 'playing';
    this.invincible = 0;
    this.time = 0;
    this.lastTime = performance.now();
    this.updateHUD();
    this.updateHint();

    const itemIconWrap = document.getElementById('itemIconWrap');
    if (itemIconWrap) itemIconWrap.style.display = 'flex';
    document.getElementById('itemLeftVal').textContent = this.itemsTotal;
  },

  generateItemPositions(count) {
    const positions = [];
    const used = new Set();
    const candidates = [];
    for (const f of this.floors) {
      const spots = 2 + Math.floor(Math.random() * 2);
      for (let s = 0; s < spots; s++) {
        const cx = f.x + 40 + (f.w - 80) * (s + 0.5) / spots;
        candidates.push({ x: cx - 16, y: f.y - TILE + 4, key: Math.round(cx) + '_' + f.y });
      }
    }
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    for (let i = 0; i < candidates.length && positions.length < count; i++) {
      const p = candidates[i];
      if (!used.has(p.key)) {
        used.add(p.key);
        positions.push({ x: p.x, y: p.y });
      }
    }
    while (positions.length < count) {
      positions.push({
        x: Math.random() * (COLS - 2) * TILE + TILE,
        y: Math.random() * (ROWS - 4) * TILE + TILE * 2
      });
    }
    return positions;
  },

  pause() { this.state = 'paused'; this.show('pauseOverlay'); },
  resume() { this.hide('pauseOverlay'); this.state = 'playing'; this.lastTime = performance.now(); },

  updateHUD() {
    document.getElementById('scoreVal').textContent = this.score;
    document.getElementById('livesVal').textContent = this.lives;
    document.getElementById('levelVal').textContent = this.level;
    document.getElementById('itemLeftVal').textContent = Math.max(0, this.itemsTotal - this.itemsCollected);
  },

  updateHint() {
    const bar = document.getElementById('hintBar');
    if (this.invincible > 0) {
      bar.textContent = '💪 大力水手变强！剩余 ' + this.invincible.toFixed(1) + ' 秒';
      bar.classList.add('spinach');
    } else {
      const cfg = this.levelConfigs[(this.level - 1) % this.levelConfigs.length];
      bar.textContent = '第 ' + this.level + ' 关 · ' + cfg.name + ' · 收集 ' + this.itemsTotal + ' 个道具';
      bar.classList.remove('spinach');
    }
  },

  wrapAround(entity) {
    if (!entity) return;
    if (entity.x + entity.w < 0) {
      entity.x = WORLD_W - 1;
      Sound.wrap();
    } else if (entity.x > WORLD_W) {
      entity.x = -entity.w + 1;
      Sound.wrap();
    }
    if (entity.y < 0) { entity.y = 0; if (entity.vy < 0) entity.vy = 0; }
  },

  update(dt) {
    if (this.state !== 'playing') return;
    this.time += dt;
    this.player.anim += dt;

    if (this.invincible > 0) {
      this.invincible -= dt;
      if (this.invincible < 0) this.invincible = 0;
      this.updateHint();
    }

    this.updatePlayer(dt);
    this.updateBrute(dt);
    this.updateDrops(dt);
    this.updateBottles(dt);
    this.updatePunches(dt);
    this.updateItems(dt);
    this.checkCollisions();
    this.checkWinLose();

    // 菠菜：随机层落下
    this.spinachSpawnTimer -= dt;
    if (this.spinachSpawnTimer <= 0) {
      this.spinachSpawnTimer = 12 + Math.random() * 8;
      if (!this.drops.some(d => d.type === 'spinach')) {
        const layerIdx = 1 + Math.floor(Math.random() * (this.floors.length - 1));
        const layer = this.floors[layerIdx];
        const x = 60 + Math.random() * (WORLD_W - 120);
        this.drops.push({
          x: x,
          y: layer.y - 200,
          w: 20, h: 20,
          vy: 120,
          type: 'spinach',
          landed: false,
          restY: 0
        });
      }
    }

    // 掉落物：随机层落下
    this.dropTimer -= dt;
    if (this.dropTimer <= 0) {
      this.dropTimer = 1.5 + Math.random() * 1.3;
      const types = ['trash', 'vase'];
      const type = types[Math.floor(Math.random() * types.length)];
      const layerIdx = Math.floor(Math.random() * this.floors.length);
      const layer = this.floors[layerIdx];
      const x = 30 + Math.random() * (WORLD_W - 60);
      this.drops.push({
        x: x,
        y: layer.y - 140,
        w: 16, h: 16,
        vy: 100,
        type: type,
        landed: false,
        restY: 0
      });
    }

    // 布鲁托扔瓶子
    this.bruteThrowTimer -= dt;
    if (this.bruteThrowTimer <= 0 && this.brute && this.brute.stunned <= 0) {
      this.bruteThrowTimer = 4 + Math.random() * 3;
      this.throwBottle();
    }
  },

  updatePlayer(dt) {
    const p = this.player;
    if (p.respawn > 0) { p.respawn -= dt; return; }

    if (p.knockbackTimer > 0) {
      p.knockbackTimer -= dt;
      p.x += p.knockbackVX * dt;
      p.knockbackVX *= 0.9;
    }

    const speed = this.invincible > 0 ? 105 : 90;
    const ladderSpeed = 85;

    if (p.punchTimer > 0) p.punchTimer -= dt;

    if (this.keys.punch && p.punchTimer <= 0) {
      p.punchTimer = 0.3;
      this.punches.push({
        x: p.x + (p.facing > 0 ? p.w : -20),
        y: p.y + 8,
        w: 20, h: 16,
        facing: p.facing,
        life: 0.15
      });
      Sound.punch();
    }

    if (p.onLadder) {
      p.vx = 0;
    } else {
      if (this.keys.left)  { p.vx = -speed; p.facing = -1; }
      else if (this.keys.right) { p.vx = speed; p.facing = 1; }
      else p.vx = 0;
    }

    if (p.vx !== 0) p.walking += dt * 8;
    else p.walking = 0;

    if (this.keys.up || this.keys.down) {
      if (p.onLadder) {
        p.vy = this.keys.up ? -ladderSpeed : ladderSpeed;
      } else {
        const ladder = this.findLadderAt(p.x + p.w / 2, p.y + p.h);
        if (ladder) {
          const targetX = ladder.x + 8;
          p.x = targetX - p.w / 2;
          p.onLadder = true;
          p.ladder = ladder;
          p.vy = this.keys.up ? -ladderSpeed : ladderSpeed;
        } else {
          p.vy = 0;
        }
      }
    } else if (p.onLadder) {
      p.vy = 0;
    } else {
      p.vy += 900 * dt;
    }

    if (p.onLadder) {
      p.y += p.vy * dt;
      const ladder = p.ladder;
      if (p.y + p.h <= ladder.yTop) {
        p.y = ladder.yTop - p.h;
        p.onLadder = false;
        p.ladder = null;
        p.vy = 0;
        Sound.step();
      } else if (p.y + p.h >= ladder.yBot + 8) {
        p.y = ladder.yBot - p.h + 8;
        p.onLadder = false;
        p.ladder = null;
        p.vy = 0;
        Sound.step();
      }
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      const groundY = this.getGroundY(p.x + p.w / 2, p.y + p.h);
      if (groundY !== null && p.y + p.h >= groundY && p.vy >= 0) {
        p.y = groundY - p.h;
        p.vy = 0;
      }
    }

    this.wrapAround(p);
    if (p.y > WORLD_H + 40) this.loseLife();
  },

  getGroundY(cx, bottomY) {
    let best = null;
    for (const f of this.floors) {
      if (cx >= f.x && cx <= f.x + f.w) {
        if (f.y >= bottomY - 20 && (best === null || f.y < best)) {
          best = f.y;
        }
      }
    }
    const cxWrapped = cx < 0 ? cx + WORLD_W : (cx > WORLD_W ? cx - WORLD_W : cx);
    if (cxWrapped !== cx) {
      for (const f of this.floors) {
        if (cxWrapped >= f.x && cxWrapped <= f.x + f.w) {
          if (f.y >= bottomY - 20 && (best === null || f.y < best)) {
            best = f.y;
          }
        }
      }
    }
    if (cxWrapped >= 0 && cxWrapped <= WORLD_W) {
      if (best === null || WORLD_H < best) {
        if (bottomY >= WORLD_H - 20) best = WORLD_H;
      }
    }
    return best;
  },

  findLadderAt(cx, bottomY) {
    for (const l of this.ladders) {
      if (cx >= l.x - 8 && cx <= l.x + 24) {
        const dTop = Math.abs(bottomY - l.yTop);
        const dBot = Math.abs(bottomY - l.yBot);
        if (dTop < 16 || dBot < 16) {
          if (bottomY > l.yTop + 16 && bottomY < l.yBot - 16) {
            return null;
          }
          return l;
        }
      }
    }
    return null;
  },

  hasDropAboveBrute(b) {
    const bx = b.x + b.w / 2;
    for (const d of this.drops) {
      if (d.landed) continue;
      const dx = d.x + d.w / 2;
      if (Math.abs(dx - bx) < 40 && d.y < b.y && d.y > b.y - 200) {
        return d;
      }
    }
    return null;
  },

  updateBrute(dt) {
    const b = this.brute;
    if (!b) return;

    if (b.knockbackTimer > 0) {
      b.knockbackTimer -= dt;
      b.x += b.knockbackVX * dt;
      b.knockbackVX *= 0.9;
    }

    if (b.stunned > 0) {
      b.stunned -= dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= 0.92;
      if (b.stunned <= 0) {
        b.x = this.currentConfig.bruteStart.x;
        b.y = this.currentConfig.bruteStart.y;
        b.vx = 0; b.vy = 0;
        b.walking = 0;
        b.aiState = 'chase-horizontal';
        b.aiLadder = null;
        b.onLadder = false;
      }
      this.wrapAround(b);
      return;
    }

    b.anim += dt;
    const p = this.player;
    if (!p || p.respawn > 0) return;

    b.stuckTimer += dt;
    if (b.stuckTimer > 0.7) {
      const movedX = Math.abs(b.x - b.lastX);
      const movedY = Math.abs(b.y - b.lastY);
      if (movedX < 3 && movedY < 3) {
        b.aiState = 'chase-horizontal';
        b.aiLadder = null;
        b.onLadder = false;
        b.facing = -b.facing;
        b.decisionTimer = 0;
      }
      b.lastX = b.x;
      b.lastY = b.y;
      b.stuckTimer = 0;
    }

    b.decisionTimer -= dt;

    // ★ 紧追速度（调回原来的）
    const speed = 70 + this.level * 6;
    const ladderSpeed = 85;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h;
    const px = p.x + p.w / 2;
    const py = p.y + p.h;

    const dy = py - cy;
    const dx = px - cx;
    const sameFloor = Math.abs(dy) < 20;

    if (b.aiState === 'climb-ladder') {
      if (!b.aiLadder) {
        b.aiState = 'chase-horizontal';
        b.onLadder = false;
      } else {
        b.x = b.aiLadder.x + 8 - b.w / 2;
        b.y += b.aiLadderDir * ladderSpeed * dt;
        b.walking += dt * 6;
        b.onLadder = true;

        if (b.aiLadderDir < 0 && b.y + b.h <= b.aiLadder.yTop) {
          b.y = b.aiLadder.yTop - b.h;
          b.aiState = 'chase-horizontal';
          b.onLadder = false;
          b.aiLadder = null;
        } else if (b.aiLadderDir > 0 && b.y + b.h >= b.aiLadder.yBot + 8) {
          b.y = b.aiLadder.yBot - b.h + 8;
          b.aiState = 'chase-horizontal';
          b.onLadder = false;
          b.aiLadder = null;
        }
        this.wrapAround(b);
        return;
      }
    }

    if (b.aiState === 'go-to-ladder') {
      const ladder = b.aiLadder;
      if (!ladder) {
        b.aiState = 'chase-horizontal';
      } else {
        const currentFloorY = this.getCurrentFloorY(cx, b.y + b.h);
        if (currentFloorY !== null) {
          b.y = currentFloorY - b.h;
        }

        const targetX = ladder.x + 8;
        const d = targetX - cx;
        const goingUp = dy < 0;
        const ladderCorrect = goingUp
          ? ladder.yTop < cy - 8
          : ladder.yBot > cy + 8;

        if (!ladderCorrect) {
          b.aiState = 'chase-horizontal';
          b.aiLadder = null;
          b.decisionTimer = 0;
        } else if (Math.abs(d) <= 4) {
          const atTop = Math.abs((b.y + b.h) - ladder.yTop) < 16;
          const atBottom = Math.abs((b.y + b.h) - ladder.yBot) < 16;
          if (!atTop && !atBottom) {
            b.aiState = 'chase-horizontal';
            b.aiLadder = null;
            b.decisionTimer = 0;
          } else {
            b.x = targetX - b.w / 2;
            b.aiState = 'climb-ladder';
            b.aiLadderDir = goingUp ? -1 : 1;
          }
        } else {
          b.x += Math.sign(d) * speed * dt;
          b.facing = d > 0 ? 1 : -1;
          b.walking += dt * 8;
        }
        this.wrapAround(b);
        return;
      }
    }

    if (sameFloor) {
      b.onLadder = false;
      b.vx = 0;
      if (dx > 4) { b.vx = speed; b.facing = 1; }
      else if (dx < -4) { b.vx = -speed; b.facing = -1; }
      b.x += b.vx * dt;
      if (b.vx !== 0) b.walking += dt * 8;
      else b.walking = 0;

      const currentFloorY = this.getCurrentFloorY(cx, b.y + b.h);
      if (currentFloorY !== null) {
        b.y = currentFloorY - b.h;
      }
    } else {
      const goingUp = dy < 0;
      let best = null, bestScore = Infinity;
      for (const l of this.ladders) {
        if (goingUp && l.yTop >= cy - 8) continue;
        if (!goingUp && l.yBot <= cy + 8) continue;
        const atTop = Math.abs((b.y + b.h) - l.yTop) < 20;
        const atBottom = Math.abs((b.y + b.h) - l.yBot) < 20;
        if (!atTop && !atBottom) continue;
        const targetY = goingUp ? l.yTop : l.yBot;
        const yDist = Math.abs(targetY - cy);
        const xDist = Math.abs((l.x + 8) - cx);
        const score = yDist * 0.7 + xDist * 1.0;
        if (score < bestScore) {
          bestScore = score;
          best = l;
        }
      }

      if (best) {
        b.aiState = 'go-to-ladder';
        b.aiLadder = best;
        b.onLadder = false;
      } else {
        b.vx = 0;
        if (dx > 4) { b.vx = speed; b.facing = 1; }
        else if (dx < -4) { b.vx = -speed; b.facing = -1; }
        b.x += b.vx * dt;
        if (b.vx !== 0) b.walking += dt * 8;
        else b.walking = 0;
      }
      const currentFloorY = this.getCurrentFloorY(cx, b.y + b.h);
      if (currentFloorY !== null) {
        b.y = currentFloorY - b.h;
      }
    }

    this.wrapAround(b);
  },

  getCurrentFloorY(cx, bottomY) {
    let best = null;
    for (const f of this.floors) {
      if (cx >= f.x && cx <= f.x + f.w) {
        if (f.y >= bottomY - 12 && (best === null || f.y < best)) {
          best = f.y;
        }
      }
    }
    return best;
  },

  throwBottle() {
    const b = this.brute;
    if (!b || b.stunned > 0) return;
    const targetX = this.player.x + this.player.w / 2;
    const dx = targetX - (b.x + b.w / 2);
    const dist = Math.abs(dx) || 1;
    const speed = 130 + this.level * 6;
    const vx = (dx / dist) * speed;
    this.bottles.push({
      x: b.x + b.w / 2,
      y: b.y + 8,
      w: 10, h: 14,
      vx: vx,
      vy: -60,
      life: 3
    });
  },

  updateBottles(dt) {
    for (let i = this.bottles.length - 1; i >= 0; i--) {
      const bo = this.bottles[i];
      bo.life -= dt;
      bo.vy += 400 * dt;
      bo.x += bo.vx * dt;
      bo.y += bo.vy * dt;
      const gy = this.getGroundY(bo.x + bo.w / 2, bo.y + bo.h);
      if (gy !== null && bo.y + bo.h >= gy) {
        bo.y = gy - bo.h;
        bo.vy = 0;
        bo.vx = 0;
      }
      if (bo.life <= 0 || bo.y > WORLD_H + 30) {
        this.bottles.splice(i, 1);
      }
    }
  },

  updatePunches(dt) {
    for (let i = this.punches.length - 1; i >= 0; i--) {
      const pu = this.punches[i];
      pu.life -= dt;
      if (pu.life <= 0) this.punches.splice(i, 1);
    }
  },

  updateDrops(dt) {
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      if (d.landed) {
        d.life = (d.life || 6) - dt;
        if (d.life <= 0) this.drops.splice(i, 1);
        continue;
      }
      d.vy += 500 * dt;
      if (d.vy > 260) d.vy = 260;
      d.y += d.vy * dt;
      const cx = d.x + d.w / 2;
      const gy = this.getGroundY(cx, d.y + d.h);
      if (gy !== null && d.y + d.h >= gy) {
        d.y = gy - d.h;
        d.vy = 0;
        d.landed = true;
        d.life = 6;
      }
      if (d.y > WORLD_H + 40) this.drops.splice(i, 1);
    }
  },

  updateItems(dt) {
    for (const it of this.items) {
      if (!it.got) it.anim += dt;
    }
  },

  checkCollisions() {
    const p = this.player;
    if (p.respawn > 0) return;
    const pRect = { x: p.x + 4, y: p.y + 6, w: p.w - 8, h: p.h - 6 };
    const b = this.brute;
    const bRect = (b && b.stunned <= 0) ?
      { x: b.x + 4, y: b.y + 6, w: b.w - 8, h: b.h - 6 } : null;

    // 收集物
    for (const it of this.items) {
      if (it.got) continue;
      const itRect = { x: it.x + 4, y: it.y + 4, w: 24, h: 24 };
      if (this.rectOverlap(pRect, itRect)) {
        it.got = true;
        this.itemsCollected++;
        const platformY = p.y + p.h;
        let points = 100;
        if (platformY < 4 * TILE) points = 500;
        else if (platformY < 7 * TILE) points = 300;
        else if (platformY < 10 * TILE) points = 100;
        else points = 50;
        if (this.invincible > 0) points *= 2;
        this.score += points;
        Sound.collect();
        this.updateHUD();
        this.checkBonusLife();
      }
    }

    // 拳击打瓶子
    for (let i = this.bottles.length - 1; i >= 0; i--) {
      const bo = this.bottles[i];
      for (const pu of this.punches) {
        if (this.rectOverlap(pu, bo)) {
          this.bottles.splice(i, 1);
          this.score += 100;
          Sound.punch();
          this.updateHUD();
          break;
        }
      }
    }

    // 掉落物
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      const dRect = { x: d.x + 2, y: d.y + 2, w: d.w - 4, h: d.h - 4 };

      // 玩家
      if (this.rectOverlap(pRect, dRect)) {
        if (d.type === 'spinach') {
          this.invincible = 8;
          this.score += 200;
          Sound.spinach();
          showToast('💪 大力水手变强！', 'green');
          this.updateHint();
          this.drops.splice(i, 1);
          continue;
        } else {
          Sound.bonk();
          const dir = (p.x + p.w / 2 < d.x + d.w / 2) ? -1 : 1;
          p.knockbackTimer = 0.35;
          p.knockbackVX = dir * 180;
          this.invincible = Math.max(this.invincible, 0.8);
          showToast('😵 被砸到，闪开！', 'red');
          this.updateHint();
          this.drops.splice(i, 1);
          continue;
        }
      }

      // ★ 布鲁托被砸到：直接送回塔顶（出生点）
      if (bRect && this.rectOverlap(bRect, dRect)) {
        if (d.type === 'spinach') {
          continue;  // 菠菜对布鲁托无效
        }
        Sound.bonk();
        // 送回出生点
        b.x = this.currentConfig.bruteStart.x;
        b.y = this.currentConfig.bruteStart.y;
        b.vx = 0; b.vy = 0;
        b.walking = 0;
        b.aiState = 'chase-horizontal';
        b.aiLadder = null;
        b.onLadder = false;
        b.stunned = 0;
        b.knockbackTimer = 0;
        b.stuckTimer = 0;
        b.decisionTimer = 0;
        b.lastX = b.x;
        b.lastY = b.y;
        // 分数奖励
        this.score += 500;
        showToast('💥 布鲁托被砸回塔顶！+500', 'green');
        this.updateHUD();
        this.drops.splice(i, 1);
        continue;
      }
    }

    // 布鲁托撞玩家
    if (bRect) {
      if (this.rectOverlap(pRect, bRect)) {
        if (this.invincible > 0) {
          const dir = p.facing;
          b.stunned = 1.5;
          b.vx = dir * 320;
          b.vy = -260;
          this.score += 3000;
          Sound.punch();
          showToast('💥 打飞布鲁托 +3000', 'green');
          this.updateHUD();
          this.checkBonusLife();
        } else {
          Sound.hit();
          this.loseLife();
        }
      }
    }
  },

  checkBonusLife() {
    if (this.score >= this.nextBonusLife) {
      this.lives++;
      this.nextBonusLife += 40000;
      Sound.extraLife();
      showToast('❤️ 奖励一条命！', 'green');
      this.updateHUD();
    }
  },

  rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  },

  loseLife() {
    this.lives--;
    this.updateHUD();
    if (this.lives <= 0) { this.gameOver(); return; }
    this.player.x = this.currentConfig.playerStart.x;
    this.player.y = this.currentConfig.playerStart.y;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.onLadder = false;
    this.player.ladder = null;
    this.player.respawn = 1.2;
    this.player.knockbackTimer = 0;

    if (this.brute) {
      this.brute.x = this.currentConfig.bruteStart.x;
      this.brute.y = this.currentConfig.bruteStart.y;
      this.brute.vx = 0; this.brute.vy = 0;
      this.brute.stunned = 0;
      this.brute.aiState = 'chase-horizontal';
      this.brute.aiLadder = null;
      this.brute.onLadder = false;
      this.brute.lastX = this.brute.x;
      this.brute.lastY = this.brute.y;
      this.brute.stuckTimer = 0;
      this.brute.decisionTimer = 0;
      this.brute.knockbackTimer = 0;
    }
    showToast('💔 掉了一条命', 'red');
  },

  checkWinLose() {
    if (this.itemsCollected >= this.itemsTotal) {
      this.state = 'win';
      Sound.win();
      const nextLevel = this.level + 1;
      document.getElementById('winSub').textContent = '得分 ' + this.score + ' · 进入第 ' + nextLevel + ' 关';
      this.show('winOverlay');
    }
  },

  gameOver() {
    this.state = 'over';
    Sound.lose();
    document.getElementById('overSub').textContent = '得分 ' + this.score + ' · 到达第 ' + this.level + ' 关';
    this.show('overOverlay');
  },

  render() {
    const ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    const bgGrad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    bgGrad.addColorStop(0, '#0b1220');
    bgGrad.addColorStop(1, '#04060a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    for (let i = 0; i < 30; i++) {
      const sx = ((i * 137) % WORLD_W);
      const sy = ((i * 211) % WORLD_H);
      const tw = 0.5 + Math.abs(Math.sin(this.time * 1.5 + i)) * 0.5;
      ctx.fillStyle = 'rgba(120, 180, 255, ' + tw * 0.5 + ')';
      ctx.fillRect(sx, sy, 2, 2);
    }

    this.drawFloors(ctx);
    this.drawLadders(ctx);
    this.drawWrapGhosts(ctx);

    this.items.forEach(it => { if (!it.got) this.drawItem(ctx, it); });
    this.drops.forEach(d => this.drawDrop(ctx, d));
    this.bottles.forEach(b => this.drawBottle(ctx, b));
    this.punches.forEach(p => this.drawPunch(ctx, p));

    if (this.brute) this.drawBrute(ctx, this.brute);
    if (this.player && this.player.respawn <= 0) this.drawPlayer(ctx);
  },

  drawWrapGhosts(ctx) {
    const p = this.player;
    const b = this.brute;

    if (p && p.respawn <= 0) {
      if (p.x < 0) {
        this.drawPlayerAt(ctx, p, p.x + WORLD_W, p.y);
      } else if (p.x + p.w > WORLD_W) {
        this.drawPlayerAt(ctx, p, p.x - WORLD_W, p.y);
      }
    }
    if (b) {
      if (b.x < 0) {
        this.drawBruteAt(ctx, b, b.x + WORLD_W, b.y);
      } else if (b.x + b.w > WORLD_W) {
        this.drawBruteAt(ctx, b, b.x - WORLD_W, b.y);
      }
    }
  },

  drawPlayerAt(ctx, p, x, y) {
    const savedX = p.x, savedY = p.y;
    p.x = x; p.y = y;
    this.drawPlayer(ctx);
    p.x = savedX; p.y = savedY;
  },

  drawBruteAt(ctx, b, x, y) {
    const savedX = b.x, savedY = b.y;
    b.x = x; b.y = y;
    this.drawBrute(ctx, b);
    b.x = savedX; b.y = savedY;
  },

  drawFloors(ctx) {
    for (const f of this.floors) {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(f.x, f.y, f.w, 10);
      ctx.fillStyle = '#c08040';
      ctx.fillRect(f.x, f.y, f.w, 2);
      ctx.fillStyle = '#5a3818';
      ctx.fillRect(f.x, f.y + 7, f.w, 3);
      ctx.fillStyle = 'rgba(60, 30, 10, 0.5)';
      for (let x = f.x + 8; x < f.x + f.w - 4; x += 24) {
        ctx.fillRect(x, f.y + 3, 1, 4);
      }
    }
  },

  drawLadders(ctx) {
    for (const l of this.ladders) {
      const x = l.x;
      const yTop = l.yTop;
      const yBot = l.yBot;
      const w = 16;
      ctx.fillStyle = '#c08040';
      ctx.fillRect(x + 1, yTop, 2, yBot - yTop + 10);
      ctx.fillRect(x + w - 3, yTop, 2, yBot - yTop + 10);
      ctx.fillStyle = '#e0a060';
      for (let y = yTop + 4; y < yBot + 8; y += 7) {
        ctx.fillRect(x + 1, y, w - 2, 2);
      }
    }
  },

  drawItem(ctx, it) {
    const px = it.x;
    const py = it.y;
    const bob = Math.sin(it.anim * 3) * 2;
    const cx = px + 16;
    const cy = py + 16 + bob;

    if (it.type === 'heart') {
      ctx.fillStyle = '#ff3b7a';
      ctx.fillRect(cx - 8, cy - 6, 4, 4);
      ctx.fillRect(cx + 4, cy - 6, 4, 4);
      ctx.fillRect(cx - 10, cy - 2, 20, 4);
      ctx.fillRect(cx - 8, cy + 2, 16, 4);
      ctx.fillRect(cx - 6, cy + 6, 12, 2);
      ctx.fillRect(cx - 4, cy + 8, 8, 2);
      ctx.fillStyle = '#ff9ec0';
      ctx.fillRect(cx - 6, cy - 4, 2, 2);
    } else if (it.type === 'note') {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(cx + 2, cy - 8, 3, 12);
      ctx.fillRect(cx - 4, cy + 1, 9, 6);
      ctx.fillRect(cx + 5, cy - 10, 6, 3);
      ctx.fillStyle = '#fff3c4';
      ctx.fillRect(cx + 2, cy - 8, 1, 8);
    } else if (it.type === 'letter') {
      ctx.fillStyle = '#7dd3fc';
      ctx.font = 'bold 22px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.letter, cx, cy + 2);
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 1;
      ctx.strokeText(it.letter, cx, cy + 2);
    }
  },

  drawDrop(ctx, d) {
    if (!d.landed) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      const gy = this.getGroundY(d.x + d.w / 2, d.y + d.h + 1);
      if (gy !== null) {
        ctx.fillRect(d.x, gy - 2, d.w, 2);
      }
    }
    if (d.type === 'spinach') {
      const px = d.x, py = d.y;
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(px + 2, py + 4, 16, 14);
      ctx.fillStyle = '#a3a3a3';
      ctx.fillRect(px + 1, py, 18, 4);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(px + 4, py + 8, 12, 6);
      ctx.fillStyle = '#16a34a';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', px + 10, py + 11);
    } else if (d.type === 'trash') {
      const px = d.x, py = d.y;
      ctx.fillStyle = '#6b7280';
      ctx.fillRect(px, py + 2, d.w, d.h - 2);
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(px, py, d.w, 4);
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(px + 3, py + 6, d.w - 6, d.h - 8);
    } else if (d.type === 'vase') {
      const px = d.x, py = d.y;
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(px + 4, py + 2, 8, 4);
      ctx.fillRect(px + 2, py + 6, 12, 8);
      ctx.fillRect(px + 4, py + 14, 8, 2);
      ctx.fillStyle = '#c084fc';
      ctx.fillRect(px + 3, py + 3, 2, 10);
    }
  },

  drawBottle(ctx, bo) {
    const px = bo.x, py = bo.y;
    ctx.fillStyle = '#166534';
    ctx.fillRect(px + 2, py + 2, 6, 12);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(px + 3, py, 4, 4);
  },

  drawPunch(ctx, pu) {
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (pu.life / 0.15) + ')';
    ctx.fillRect(pu.x, pu.y, pu.w, pu.h);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(pu.x, pu.y, pu.w, pu.h);
  },

  drawBrute(ctx, b) {
    const px = b.x, py = b.y;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px + 2, py + b.h - 2, b.w - 4, 3);
    ctx.fillStyle = '#4b5563';
    ctx.fillRect(px + 2, py + 10, b.w - 4, b.h - 14);
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(px + 4, py, b.w - 8, 12);
    ctx.fillStyle = '#4b5563';
    ctx.fillRect(px, py + 4, 4, 6);
    ctx.fillRect(px + b.w - 4, py + 4, 4, 6);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(px + 6, py + 4, 4, 4);
    ctx.fillRect(px + b.w - 10, py + 4, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 7, py + 5, 2, 2);
    ctx.fillRect(px + b.w - 9, py + 5, 2, 2);
    const legPhase = Math.floor(b.walking) % 2;
    ctx.fillStyle = '#374151';
    if (legPhase === 0) {
      ctx.fillRect(px + 3, py + b.h - 4, 6, 4);
      ctx.fillRect(px + b.w - 9, py + b.h - 4, 6, 4);
    } else {
      ctx.fillRect(px + 4, py + b.h - 4, 6, 4);
      ctx.fillRect(px + b.w - 10, py + b.h - 4, 6, 4);
    }
    if (b.stunned > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.5 + Math.sin(this.time * 30) * 0.5) + ')';
      ctx.fillRect(px, py, b.w, b.h);
    }
  },

  drawPlayer(ctx) {
    const p = this.player;
    const px = p.x, py = p.y;
    if (this.invincible > 0) {
      const blink = Math.floor(this.invincible * 12) % 2;
      if (blink) return;
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px + 2, py + p.h - 2, p.w - 4, 3);
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(px + 2, py + 10, p.w - 4, p.h - 14);
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(px + 1, py + 12, 4, 8);
    ctx.fillRect(px + p.w - 5, py + 12, 4, 8);
    ctx.fillStyle = '#ffd7b3';
    ctx.fillRect(px + 4, py, p.w - 8, 12);
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(px + 2, py - 2, p.w - 4, 5);
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(px + 2, py + 2, p.w - 4, 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 6, py + 4, 3, 4);
    ctx.fillRect(px + p.w - 9, py + 4, 3, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 7, py + 5, 2, 2);
    ctx.fillRect(px + p.w - 8, py + 5, 2, 2);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(px + p.w - 8, py + 7, 4, 3);
    ctx.fillStyle = '#7c2d12';
    ctx.fillRect(px + 6, py + 8, 6, 2);
    const legPhase = Math.floor(p.walking) % 2;
    ctx.fillStyle = '#111827';
    if (legPhase === 0) {
      ctx.fillRect(px + 3, py + p.h - 4, 6, 4);
      ctx.fillRect(px + p.w - 9, py + p.h - 4, 6, 4);
    } else {
      ctx.fillRect(px + 4, py + p.h - 4, 6, 4);
      ctx.fillRect(px + p.w - 10, py + p.h - 4, 6, 4);
    }
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(px + 4, py - 4, p.w - 8, 5);
    if (this.invincible > 0) {
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(px, py + 12, 4, 6);
      ctx.fillRect(px + p.w - 4, py + 12, 4, 6);
      for (let i = 0; i < 3; i++) {
        const a = this.time * 3 + i * 2.1;
        const sx = px + p.w / 2 + Math.cos(a) * 16;
        const sy = py + p.h / 2 + Math.sin(a) * 16;
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx, sy, 2, 2);
      }
    }
  },

  loop(t) {
    requestAnimationFrame(t2 => this.loop(t2));
    let dt = (t - this.lastTime) / 1000;
    this.lastTime = t;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    if (this.state === 'playing') this.update(dt);
    this.render();
  }
};

let toastTimer = null;
function showToast(text, type) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (type ? ' ' + type : ''); }, 1400);
}

window.addEventListener('DOMContentLoaded', () => Game.init());
</script>
</body>
