<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a2e">
<title>贪吃蛇 · 丛林猎手</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #0d1a2e; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }

  #game {
    display: block;
    position: fixed;
    background: #13233d;
    border-radius: 12px;
    touch-action: none;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }

  .tool-btn {
    position: fixed;
    width: 42px; height: 42px; border-radius: 10px;
    border: 2px solid rgba(56, 189, 248, 0.45);
    background: rgba(19, 35, 61, 0.92);
    color: #7dd3fc; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 900;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.1s;
  }
  .tool-btn:active { transform: scale(0.9); }
  .tool-btn.dim { opacity: 0.4; }
  #btn-full  { top: calc(8px + var(--safe-top)); right: calc(8px + var(--safe-right)); }
  #btn-sound { top: calc(8px + var(--safe-top)); right: calc(58px + var(--safe-right)); }
  #btn-pause { top: calc(8px + var(--safe-top)); right: calc(108px + var(--safe-right)); }

  #dpad {
    --size: 200px;
    position: fixed;
    right: calc(14px + var(--safe-right));
    bottom: calc(14px + var(--safe-bottom));
    width: var(--size);
    height: var(--size);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    pointer-events: none;
    z-index: 700;
    display: none;
  }
  #dpad.show { display: grid; }

  .dpad-btn {
    pointer-events: auto;
    border-radius: 20px;
    border: 3px solid rgba(56, 189, 248, 0.5);
    background: linear-gradient(180deg, rgba(32, 62, 105, 0.92) 0%, rgba(19, 35, 61, 0.95) 100%);
    color: #7dd3fc;
    font-size: calc(var(--size) * 0.16);
    font-weight: bold;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.08s;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    user-select: none;
  }
  .dpad-btn.pressed {
    background: linear-gradient(180deg, #7dd3fc 0%, #0ea5e9 100%);
    color: #04121f;
    transform: scale(0.9);
    border-color: #a5f3fc;
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4);
  }

  .dpad-btn.up    { grid-column: 2; grid-row: 1; }
  .dpad-btn.left  { grid-column: 1; grid-row: 2; }
  .dpad-btn.right { grid-column: 3; grid-row: 2; }
  .dpad-btn.down  { grid-column: 2; grid-row: 3; }

  #menu {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0d1a2e;
    gap: 16px;
    padding: 20px;
    z-index: 100;
    overflow-y: auto;
  }
  #menu.hidden { display: none; }

  #menu h1 {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #a5f3fc 0%, #38bdf8 50%, #0c4a6e 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
    font-style: italic;
    text-align: center;
  }
  #menu .sub {
    font-size: 11px;
    color: rgba(125, 211, 252, 0.5);
    letter-spacing: 8px;
    margin-top: -8px;
  }

  .menu-section {
    display: flex; flex-direction: column;
    gap: 8px; align-items: center;
  }
  .menu-section .label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 3px;
  }
  .option-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .opt-btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 66px;
  }
  .opt-btn.active {
    border-color: #38bdf8;
    color: #fff;
    background: rgba(56, 189, 248, 0.18);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
  }

  .start-btn {
    margin-top: 14px;
    padding: 15px 60px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: #04121f;
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: all 0.15s;
  }
  .start-btn:active { transform: scale(0.96); }

  .menu-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
    line-height: 1.9;
    margin-top: 8px;
  }
  .menu-hint b { color: #7dd3fc; }

  .overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 12, 24, 0.88);
    z-index: 800;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #13233d;
    border: 3px solid rgba(56, 189, 248, 0.4);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.22);
    max-width: 92vw;
  }
  .panel h2 {
    color: #7dd3fc;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 12px;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
  }
  .panel .stats {
    display: flex;
    gap: 26px;
    justify-content: center;
    margin: 14px 0 22px;
  }
  .panel .stat { display: flex; flex-direction: column; gap: 4px; }
  .panel .stat .lbl {
    font-size: 10px;
    color: rgba(125, 211, 252, 0.5);
    letter-spacing: 2px;
  }
  .panel .stat .val {
    font-size: 26px;
    font-weight: 900;
    color: #7dd3fc;
    font-variant-numeric: tabular-nums;
  }
  .panel .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .panel .btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    min-width: 110px;
    transition: all 0.15s;
  }
  .panel .btn.primary {
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color: #04121f;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.5);
  }
  .panel .btn.primary:active { transform: scale(0.96); }
  .panel .btn.secondary {
    background: transparent;
    color: #7dd3fc;
    border: 2px solid rgba(56, 189, 248, 0.4);
  }
  .panel .btn.secondary:active { transform: scale(0.96); background: rgba(56, 189, 248, 0.1); }

  @media (max-width: 480px) {
    #menu h1 { font-size: 32px; letter-spacing: 6px; }
    .opt-btn { padding: 8px 12px; font-size: 12px; min-width: 56px; }
    .start-btn { padding: 14px 48px; font-size: 16px; }
    .panel { padding: 22px 24px; }
    .panel h2 { font-size: 22px; }
    .panel .stat .val { font-size: 22px; }
    .panel .btn { padding: 10px 18px; font-size: 12px; min-width: 90px; }
  }
</style>
</head>
<body>
<canvas id="game" width="720" height="780"></canvas>

<button id="btn-pause" class="tool-btn">⏸</button>
<button id="btn-sound" class="tool-btn">♪</button>
<button id="btn-full"  class="tool-btn">⛶</button>

<div id="dpad">
  <button class="dpad-btn up"    data-dir="up">▲</button>
  <button class="dpad-btn left"  data-dir="left">◀</button>
  <button class="dpad-btn right" data-dir="right">▶</button>
  <button class="dpad-btn down"  data-dir="down">▼</button>
</div>

<div id="menu">
  <h1>贪吃蛇</h1>
  <div class="sub">JUNGLE HUNTER</div>

  <div class="menu-section">
    <div class="label">速度</div>
    <div class="option-row" id="speedRow">
      <button class="opt-btn" data-speed="0">悠闲</button>
      <button class="opt-btn" data-speed="1">慢速</button>
      <button class="opt-btn active" data-speed="2">适中</button>
      <button class="opt-btn" data-speed="3">快速</button>
      <button class="opt-btn" data-speed="4">极速</button>
    </div>
  </div>

  <button class="start-btn" id="btnStart">开 始</button>

  <div class="menu-hint">
    用右下角方向键控制蛇的方向<br>
    吃到红苹果，别撞墙或咬自己
  </div>
</div>

<div class="overlay" id="pauseOverlay">
  <div class="panel">
    <h2>暂 停</h2>
    <div class="btn-row">
      <button class="btn primary" id="btnResume">继 续</button>
      <button class="btn secondary" id="btnRestart">重 开</button>
      <button class="btn secondary" id="btnToMenu">菜 单</button>
    </div>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="panel">
    <h2 id="overTitle">撞 墙 了</h2>
    <div class="stats">
      <div class="stat">
        <div class="lbl">分数</div>
        <div class="val" id="ui-over-score">0</div>
      </div>
      <div class="stat">
        <div class="lbl">长度</div>
        <div class="val" id="ui-over-len">0</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btnOverRetry">再 来 一 次</button>
      <button class="btn secondary" id="btnOverMenu">回 菜 单</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
 *  配置（速度已整体调慢）
 * ============================================================ */
const CFG = {
  W: 720, H: 780,
  HUD_H: 56,
  BOARD_X: 0,
  BOARD_Y: 56,
  COLS: 24, ROWS: 24,
  CELL: 30,
  STEP: 1000 / 60,
  FOOD_MARGIN: 2,
  SAVE_KEY: 'snake_jungle_v6',
  SPEEDS: [
    { name: '悠闲', interval: 400 },
    { name: '慢速', interval: 320 },
    { name: '适中', interval: 250 },
    { name: '快速', interval: 190 },
    { name: '极速', interval: 140 },
  ],
};

const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
};

const Save = {
  data: { highScore: 0, bestLen: 0, soundOn: true, speed: 2 },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
};

const Sound = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone({ freq, freq2, dur = 0.1, type = 'square', vol = 0.3, delay = 0 }) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq2 || freq, t0);
      if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  eat() {
    this.tone({ freq: 660, dur: 0.06, type: 'triangle', vol: 0.3 });
    this.tone({ freq: 990, dur: 0.1, type: 'triangle', vol: 0.28, delay: 0.06 });
    this.tone({ freq: 1320, dur: 0.12, type: 'triangle', vol: 0.22, delay: 0.14 });
  },
  die() {
    [400, 320, 250, 180, 120].forEach((f, i) =>
      this.tone({ freq: f, freq2: f * 0.6, dur: 0.18, type: 'sawtooth', vol: 0.32, delay: i * 0.1 }));
  },
  turn() { this.tone({ freq: 800, dur: 0.03, type: 'sine', vol: 0.15 }); },
};

const Input = {
  keys: Object.create(null),
  init() {
    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      Sound.init(); Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') Game.togglePause();
      if (e.code === 'KeyF') Game.toggleFullscreen();
      if (e.code === 'KeyM') Game.toggleSound();
      if (e.code === 'KeyR' && Game.state !== 'menu') Game.start();
      if (e.code === 'Space' && Game.state === 'menu') Game.start();

      if (Game.state !== 'playing') return;
      if (e.code === 'ArrowLeft'  || e.code === 'KeyA') Game.setDirection('left');
      if (e.code === 'ArrowRight' || e.code === 'KeyD') Game.setDirection('right');
      if (e.code === 'ArrowUp'    || e.code === 'KeyW') Game.setDirection('up');
      if (e.code === 'ArrowDown'  || e.code === 'KeyS') Game.setDirection('down');
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const press = e => {
        e.preventDefault();
        Sound.init(); Sound.resume();
        Game.setDirection(dir);
        btn.classList.add('pressed');
      };
      const release = e => {
        e.preventDefault();
        btn.classList.remove('pressed');
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
};

/* ============================================================
 *  蛇
 * ============================================================ */
class Snake {
  constructor(cols, rows, len = 4) {
    this.cols = cols;
    this.rows = rows;
    const cx = Math.floor(cols / 2);
    const cy = Math.floor(rows / 2);
    this.segments = [];
    for (let i = 0; i < len; i++) this.segments.push({ x: cx - i, y: cy });
    this.prevSegments = this.segments.map(s => ({ ...s }));
    this.dir = { x: 1, y: 0 };
    this.pendingDir = { x: 1, y: 0 };
    this.pendingGrow = 0;
    this.alive = true;
    this.deathReason = '';
  }
  setDir(dx, dy) {
    if (dx === -this.dir.x && dy === -this.dir.y) return false;
    if (dx === this.pendingDir.x && dy === this.pendingDir.y) return false;
    this.pendingDir = { x: dx, y: dy };
    return true;
  }
  step() {
    this.prevSegments = this.segments.map(s => ({ ...s }));
    this.dir = { ...this.pendingDir };
    const head = this.segments[0];
    const nx = head.x + this.dir.x;
    const ny = head.y + this.dir.y;
    if (nx < 0 || nx >= this.cols || ny < 0 || ny >= this.rows) {
      this.alive = false; this.deathReason = 'wall'; return 'wall';
    }
    const len = this.segments.length;
    const limit = this.pendingGrow > 0 ? len : len - 1;
    for (let i = 0; i < limit; i++) {
      if (this.segments[i].x === nx && this.segments[i].y === ny) {
        this.alive = false; this.deathReason = 'self'; return 'self';
      }
    }
    this.segments.unshift({ x: nx, y: ny });
    if (this.pendingGrow > 0) this.pendingGrow--;
    else this.segments.pop();
    return 'ok';
  }
  grow(n = 1) { this.pendingGrow += n; }
  occupies(x, y) {
    for (const s of this.segments) if (s.x === x && s.y === y) return true;
    return false;
  }
  getRenderSegments(t) {
    const out = [];
    const N = this.segments.length;
    for (let i = 0; i < N; i++) {
      const curr = this.segments[i];
      const prev = this.prevSegments[i] || curr;
      out.push({
        x: U.lerp(prev.x, curr.x, t),
        y: U.lerp(prev.y, curr.y, t),
      });
    }
    return out;
  }
}

/* ============================================================
 *  游戏主控
 * ============================================================ */
const Game = {
  canvas: null, ctx: null,
  state: 'menu',
  tick: 0,
  snake: null,
  food: null,
  foodPulse: 0,
  speedLevel: 2,
  accumulator: 0,
  snakeT: 0,
  score: 0,
  particles: [],
  floats: [],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.enabled = Save.data.soundOn;
    this.speedLevel = Save.data.speed || 2;

    Input.init();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));

    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);

    this.syncMenu();
    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('btn-full').addEventListener('click', e => { e.preventDefault(); this.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', e => { e.preventDefault(); this.toggleSound(); });
    $('btn-pause').addEventListener('click', e => { e.preventDefault(); this.togglePause(); });
    $('btnStart').addEventListener('click', () => { Sound.init(); Sound.resume(); this.start(); });

    $('speedRow').querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $('speedRow').querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.speedLevel = +btn.dataset.speed;
        Save.data.speed = this.speedLevel; Save.save();
      });
    });

    $('btnResume').addEventListener('click', () => this.togglePause());
    $('btnRestart').addEventListener('click', () => { this.hide('pauseOverlay'); this.start(); });
    $('btnToMenu').addEventListener('click', () => { this.hide('pauseOverlay'); this.toMenu(); });
    $('btnOverRetry').addEventListener('click', () => { this.hide('overOverlay'); this.start(); });
    $('btnOverMenu').addEventListener('click', () => { this.hide('overOverlay'); this.toMenu(); });

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.updateFsIcon(); setTimeout(() => this.resize(), 150); }));
    this.updateFsIcon();
  },

  syncMenu() {
    document.getElementById('speedRow').querySelectorAll('.opt-btn').forEach(b => {
      b.classList.toggle('active', +b.dataset.speed === this.speedLevel);
    });
  },

  resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const isPortrait = vh > vw;

    const cs = getComputedStyle(document.documentElement);
    const safeTop = parseFloat(cs.getPropertyValue('--safe-top')) || 0;
    const safeBottom = parseFloat(cs.getPropertyValue('--safe-bottom')) || 0;
    const safeLeft = parseFloat(cs.getPropertyValue('--safe-left')) || 0;
    const safeRight = parseFloat(cs.getPropertyValue('--safe-right')) || 0;

    const topBar = 50 + 12 + safeTop;

    const ratio = CFG.W / CFG.H;
    let w, h;

    if (isPortrait) {
      const dpadSize = Math.min(220, vw * 0.6);
      const bottomBar = dpadSize + 24 + safeBottom;

      const availW = vw - 16 - safeLeft - safeRight;
      const availH = vh - topBar - bottomBar;

      if (availW / availH > ratio) {
        h = availH;
        w = h * ratio;
      } else {
        w = availW;
        h = w / ratio;
      }

      const left = safeLeft + (vw - safeLeft - safeRight - w) / 2;
      const extraV = availH - h;
      const top = topBar + Math.max(0, extraV / 2);

      this.canvas.style.width = Math.round(w) + 'px';
      this.canvas.style.height = Math.round(h) + 'px';
      this.canvas.style.left = Math.round(left) + 'px';
      this.canvas.style.top = Math.round(top) + 'px';
      this.canvas.style.transform = 'none';

      document.getElementById('dpad').style.setProperty('--size', dpadSize + 'px');
    } else {
      const dpadSize = Math.min(200, vh * 0.65);
      const availW = vw - 16 - safeLeft - safeRight;
      const availH = vh - topBar - 16 - safeBottom;

      if (availW / availH > ratio) {
        h = availH;
        w = h * ratio;
      } else {
        w = availW;
        h = w / ratio;
      }

      let left = safeLeft + (vw - safeLeft - safeRight - w) / 2;

      const dpadLeft = vw - safeRight - dpadSize - 14;
      const dpadTop = vh - safeBottom - dpadSize - 14;
      const canvasRight = left + w;
      const canvasBottom = topBar + h;

      if (canvasRight > dpadLeft - 10 && canvasBottom > dpadTop - 10) {
        left = dpadLeft - 10 - w;
        if (left < safeLeft + 8) left = safeLeft + 8;
      }

      const extraV = availH - h;
      const top = topBar + Math.max(0, extraV / 2);

      this.canvas.style.width = Math.round(w) + 'px';
      this.canvas.style.height = Math.round(h) + 'px';
      this.canvas.style.left = Math.round(left) + 'px';
      this.canvas.style.top = Math.round(top) + 'px';
      this.canvas.style.transform = 'none';

      document.getElementById('dpad').style.setProperty('--size', dpadSize + 'px');
    }
  },

  start() {
    this.snake = new Snake(CFG.COLS, CFG.ROWS, 4);
    this.food = null;
    this.foodPulse = 0;
    this.accumulator = 0;
    this.snakeT = 0;
    this.score = 0;
    this.tick = 0;
    this.particles = [];
    this.floats = [];
    this.spawnFood();
    this.state = 'playing';
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('dpad').classList.add('show');
    this.hide('pauseOverlay');
    this.hide('overOverlay');
    Sound.init(); Sound.resume();
    setTimeout(() => this.resize(), 30);
  },

  toMenu() {
    this.state = 'menu';
    document.getElementById('menu').classList.remove('hidden');
    document.getElementById('dpad').classList.remove('show');
    this.syncMenu();
    this.resize();
  },

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      document.getElementById('dpad').classList.remove('show');
      this.show('pauseOverlay');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      document.getElementById('dpad').classList.add('show');
      this.hide('pauseOverlay');
    }
  },

  show(id) { document.getElementById(id).classList.add('show'); },
  hide(id) { document.getElementById(id).classList.remove('show'); },

  setDirection(dir) {
    if (this.state !== 'playing' || !this.snake || !this.snake.alive) return;
    let dx = 0, dy = 0;
    if (dir === 'up')    { dx = 0;  dy = -1; }
    if (dir === 'down')  { dx = 0;  dy = 1; }
    if (dir === 'left')  { dx = -1; dy = 0; }
    if (dir === 'right') { dx = 1;  dy = 0; }
    if (this.snake.setDir(dx, dy)) Sound.turn();
  },

  spawnFood() {
    const margin = CFG.FOOD_MARGIN;
    const candidates = [];
    for (let x = margin; x < CFG.COLS - margin; x++) {
      for (let y = margin; y < CFG.ROWS - margin; y++) {
        if (!this.snake.occupies(x, y)) candidates.push({ x, y });
      }
    }
    if (candidates.length > 0) {
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      this.food = { x: pick.x, y: pick.y, born: this.tick };
    } else {
      for (let x = 0; x < CFG.COLS; x++)
        for (let y = 0; y < CFG.ROWS; y++)
          if (!this.snake.occupies(x, y)) { this.food = { x, y, born: this.tick }; return; }
      this.food = null;
    }
  },

  stepSnake() {
    const result = this.snake.step();
    if (result !== 'ok') { this.onDeath(); return; }
    const head = this.snake.segments[0];
    if (this.food && head.x === this.food.x && head.y === this.food.y) {
      this.snake.grow(2);
      this.score += 10;
      Sound.eat();
      this.addFloat(
        CFG.BOARD_X + (head.x + 0.5) * CFG.CELL,
        CFG.BOARD_Y + (head.y + 0.5) * CFG.CELL,
        '+10', '#a4e84a'
      );
      this.spawnFoodParticles(head.x, head.y);
      this.spawnFood();
    }
  },

  onDeath() {
    this.state = 'dead';
    document.getElementById('dpad').classList.remove('show');
    Sound.die();
    const len = this.snake.segments.length;
    if (this.score > Save.data.highScore) Save.data.highScore = this.score;
    if (len > Save.data.bestLen) Save.data.bestLen = len;
    Save.save();
    const reason = this.snake.deathReason === 'wall' ? '撞 墙 了' : '咬 到 自 己';
    document.getElementById('overTitle').textContent = reason;
    document.getElementById('ui-over-score').textContent = this.score;
    document.getElementById('ui-over-len').textContent = len;
    this.show('overOverlay');
  },

  addFloat(x, y, text, color) {
    this.floats.push({ x, y, text, color, life: 60 });
  },

  spawnFoodParticles(gx, gy) {
    const px = CFG.BOARD_X + (gx + 0.5) * CFG.CELL;
    const py = CFG.BOARD_Y + (gy + 0.5) * CFG.CELL;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.284;
      const sp = U.rand(1.5, 4);
      this.particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
        life: 42, color: Math.random() < 0.6 ? '#ff3b3b' : '#7ed957',
        size: U.rand(3, 6),
      });
    }
  },

  lastTime: 0, accumulator2: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator2 += delta;
    let guard = 0;
    while (this.accumulator2 >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator2 -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator2 = 0;
    this.render();
  },

  update() {
    this.tick++;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.vy += 0.3; p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 1; f.life--;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
    if (this.state !== 'playing' || !this.snake || !this.snake.alive) return;

    this.foodPulse = (this.foodPulse + 0.06) % (Math.PI * 2);
    const interval = CFG.SPEEDS[this.speedLevel].interval;
    this.accumulator += CFG.STEP;
    let guard = 0;
    while (this.accumulator >= interval && guard < 4) {
      this.accumulator -= interval;
      this.stepSnake();
      guard++;
      if (!this.snake.alive) break;
    }
    if (guard >= 4) this.accumulator = 0;
    this.snakeT = Math.min(1, this.accumulator / interval);
  },

  render() {
    const ctx = this.ctx;
    ctx.fillStyle = '#13233d';
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    this.drawBoard();
    if (this.state === 'menu') { this.drawMenuBg(); return; }
    if (this.food) this.drawFood();
    if (this.snake) this.drawSnake();
    this.drawParticles();
    this.drawFloats();
    this.drawHUD();
  },

  drawMenuBg() {
    const ctx = this.ctx;
    const g = ctx.createRadialGradient(CFG.W/2, CFG.H/2, 100, CFG.W/2, CFG.H/2, 600);
    g.addColorStop(0, 'rgba(40, 90, 150, 0.42)');
    g.addColorStop(1, 'rgba(13, 26, 46, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
  },

  drawBoard() {
    const ctx = this.ctx;
    const bx = CFG.BOARD_X, by = CFG.BOARD_Y;
    const bw = CFG.COLS * CFG.CELL, bh = CFG.ROWS * CFG.CELL;

    const g = ctx.createLinearGradient(0, by, 0, by + bh);
    g.addColorStop(0, '#1a3050');
    g.addColorStop(0.5, '#162a47');
    g.addColorStop(1, '#122440');
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw, bh);

    const halo = ctx.createRadialGradient(
      bx + bw * 0.5, by + bh * 0.45, 30,
      bx + bw * 0.5, by + bh * 0.5, bw * 0.8
    );
    halo.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
    halo.addColorStop(0.55, 'rgba(56, 189, 248, 0.05)');
    halo.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(bx, by, bw, bh);

    ctx.fillStyle = 'rgba(125, 211, 252, 0.22)';
    for (let x = 2; x < CFG.COLS; x += 2) {
      for (let y = 2; y < CFG.ROWS; y += 2) {
        ctx.beginPath();
        ctx.arc(bx + x * CFG.CELL, by + y * CFG.CELL, 1.5, 0, 6.284);
        ctx.fill();
      }
    }

    ctx.strokeStyle = 'rgba(125, 211, 252, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < CFG.COLS; x++) {
      ctx.moveTo(bx + x * CFG.CELL + 0.5, by);
      ctx.lineTo(bx + x * CFG.CELL + 0.5, by + bh);
    }
    for (let y = 1; y < CFG.ROWS; y++) {
      ctx.moveTo(bx, by + y * CFG.CELL + 0.5);
      ctx.lineTo(bx + bw, by + y * CFG.CELL + 0.5);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(125, 211, 252, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + bw / 2, by + bh * 0.22);
    ctx.lineTo(bx + bw / 2, by + bh * 0.78);
    ctx.moveTo(bx + bw * 0.22, by + bh / 2);
    ctx.lineTo(bx + bw * 0.78, by + bh / 2);
    ctx.stroke();

    const vig = ctx.createRadialGradient(
      bx + bw / 2, by + bh / 2, bw * 0.35,
      bx + bw / 2, by + bh / 2, bw * 0.85
    );
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = vig;
    ctx.fillRect(bx, by, bw, bh);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.42)';
    ctx.lineWidth = 3;
    ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, bh - 3);

    const cl = 26;
    ctx.strokeStyle = 'rgba(165, 243, 252, 0.85)';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    const corners = [
      [bx + 5,      by + 5,       1,  1],
      [bx + bw - 5, by + 5,      -1,  1],
      [bx + 5,      by + bh - 5,  1, -1],
      [bx + bw - 5, by + bh - 5, -1, -1],
    ];
    for (const [cx0, cy0, sx, sy] of corners) {
      ctx.beginPath();
      ctx.moveTo(cx0 + sx * cl, cy0);
      ctx.lineTo(cx0, cy0);
      ctx.lineTo(cx0, cy0 + sy * cl);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  },

  /* ============================================================
   *  苹果：鲜红明亮
   * ============================================================ */
  drawFood() {
    const ctx = this.ctx;
    const f = this.food;
    const cx = CFG.BOARD_X + (f.x + 0.5) * CFG.CELL;
    const cy = CFG.BOARD_Y + (f.y + 0.5) * CFG.CELL;
    const pulse = Math.sin(this.foodPulse) * 0.5 + 0.5;
    const R = CFG.CELL * 0.34 * (1 + pulse * 0.08);

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + R * 0.9, R * 0.9, R * 0.28, 0, 0, 6.284);
    ctx.fill();

    // 主体渐变——鲜红
    const grad = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, 1, cx, cy, R * 1.15);
    grad.addColorStop(0, '#ffb3b3');
    grad.addColorStop(0.25, '#ff5252');
    grad.addColorStop(0.6, '#ff1a1a');
    grad.addColorStop(0.85, '#e00000');
    grad.addColorStop(1, '#a30000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 6.284);
    ctx.fill();

    // 底部暗红
    ctx.fillStyle = 'rgba(120,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + R * 0.55, R * 0.35, R * 0.14, 0, 0, 6.284);
    ctx.fill();

    // 果皮小点
    ctx.fillStyle = 'rgba(255, 200, 180, 0.5)';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * 6.284 + 0.3;
      const d = R * 0.65;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d * 0.6, cy + Math.sin(a) * d * 0.4, R * 0.05, 0, 6.284);
      ctx.fill();
    }

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.ellipse(cx - R * 0.38, cy - R * 0.42, R * 0.3, R * 0.2, -0.6, 0, 6.284);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(cx + R * 0.35, cy + R * 0.15, R * 0.14, 0, 6.284);
    ctx.fill();

    // 果梗
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy - R * 0.88);
    ctx.quadraticCurveTo(cx + R * 0.1, cy - R * 1.2, cx - R * 0.15, cy - R * 1.4);
    ctx.stroke();

    // 叶子
    ctx.fillStyle = '#66bb6a';
    ctx.save();
    ctx.translate(cx + R * 0.15, cy - R * 1.05);
    ctx.rotate(0.4);
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 0.42, R * 0.18, 0, 0, 6.284);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-R * 0.35, 0);
    ctx.lineTo(R * 0.35, 0);
    ctx.stroke();
    ctx.restore();

    // 外发光
    const glow = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.9);
    glow.addColorStop(0, `rgba(255,60,60,${0.25 + pulse * 0.2})`);
    glow.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.9, 0, 6.284);
    ctx.fill();
  },

  /* ============================================================
   *  蛇：明亮鲜绿
   * ============================================================ */
  drawSnake() {
    const ctx = this.ctx;
    const segs = this.snake.getRenderSegments(this.snakeT);
    const N = segs.length;
    if (N === 0) return;

    const toPx = (s) => ({
      x: CFG.BOARD_X + (s.x + 0.5) * CFG.CELL,
      y: CFG.BOARD_Y + (s.y + 0.5) * CFG.CELL,
    });
    const pts = segs.map(toPx);

    const headR = CFG.CELL * 0.46;
    const bodyR0 = CFG.CELL * 0.42;
    const bodyR1 = CFG.CELL * 0.17;
    const dead = !this.snake.alive;

    // 阴影
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#000';
    for (let i = N - 1; i >= 0; i--) {
      const p = pts[i];
      const tNorm = i / Math.max(N - 1, 1);
      const r = U.lerp(bodyR0, bodyR1, tNorm);
      ctx.beginPath();
      ctx.arc(p.x, p.y + 5, r * 1.05, 0, 6.284);
      ctx.fill();
    }
    ctx.restore();

    for (let i = N - 1; i >= 1; i--) {
      const p = pts[i];
      const tNorm = i / Math.max(N - 1, 1);
      const r = U.lerp(bodyR0, bodyR1, tNorm);

      // 连接带——亮绿
      if (i > 0) {
        const p2 = pts[i - 1];
        const r2 = U.lerp(bodyR0, bodyR1, (i - 1) / Math.max(N - 1, 1));
        ctx.strokeStyle = dead ? '#3a2a20' : '#4d8f24';
        ctx.lineWidth = Math.min(r, r2) * 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // 身体球——亮绿渐变
      const grad = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.45, 1, p.x, p.y, r * 1.2);
      if (dead) {
        grad.addColorStop(0, '#a08878');
        grad.addColorStop(0.55, '#6a4a36');
        grad.addColorStop(1, '#3a2418');
      } else {
        grad.addColorStop(0, '#c8f57a');   // 顶部高光黄绿
        grad.addColorStop(0.35, '#8fe04a'); // 亮绿
        grad.addColorStop(0.7, '#5bb82b');  // 中绿
        grad.addColorStop(1, '#38801a');    // 深绿收边
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.284);
      ctx.fill();

      // 鳞片弧纹
      if (i < N - 1) {
        const angle = Math.atan2(pts[i].y - pts[i + 1].y, pts[i].x - pts[i + 1].x);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        ctx.strokeStyle = dead ? 'rgba(0,0,0,0.4)' : 'rgba(30, 90, 15, 0.4)';
        ctx.lineWidth = 1;
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.arc(k * r * 0.55, 0, r * 0.35, -1.1, 1.1);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 背脊线
      if (i > 0 && i < N - 1) {
        const prev = pts[i + 1];
        const a = Math.atan2(p.y - prev.y, p.x - prev.x);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(a);
        ctx.strokeStyle = dead ? 'rgba(0,0,0,0.5)' : 'rgba(40, 120, 20, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-r * 0.9, -r * 0.1);
        ctx.lineTo(r * 0.9, -r * 0.1);
        ctx.stroke();
        ctx.restore();
      }

      // 高光——更亮
      ctx.fillStyle = dead ? 'rgba(255,220,180,0.08)' : 'rgba(230, 255, 180, 0.4)';
      ctx.beginPath();
      ctx.ellipse(p.x - r * 0.15, p.y - r * 0.45, r * 0.55, r * 0.22, -0.2, 0, 6.284);
      ctx.fill();
    }

    this.drawSnakeHead(pts[0], pts[1] || pts[0], headR, dead);
  },

  drawSnakeHead(head, neck, R, dead) {
    const ctx = this.ctx;
    const angle = Math.atan2(head.y - neck.y, head.x - neck.x);

    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(angle);

    // 头部主体——亮绿
    const grad = ctx.createRadialGradient(-R * 0.3, -R * 0.4, 1, 0, 0, R * 1.2);
    if (dead) {
      grad.addColorStop(0, '#b09880');
      grad.addColorStop(0.5, '#6a4a36');
      grad.addColorStop(1, '#3a2418');
    } else {
      grad.addColorStop(0, '#d4ff8a');   // 高光黄绿
      grad.addColorStop(0.3, '#9fe855');  // 亮绿
      grad.addColorStop(0.65, '#6cc832'); // 中绿
      grad.addColorStop(1, '#3d8a1c');    // 深绿
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 1.15, R * 1.0, 0, 0, 6.284);
    ctx.fill();

    // 吻部——稍深
    ctx.fillStyle = dead ? '#3a2a20' : '#4d8f24';
    ctx.beginPath();
    ctx.ellipse(R * 0.75, 0, R * 0.42, R * 0.55, 0, 0, 6.284);
    ctx.fill();

    // 吻部鳞纹
    ctx.strokeStyle = dead ? 'rgba(0,0,0,0.4)' : 'rgba(30, 90, 15, 0.45)';
    ctx.lineWidth = 1.2;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.arc(-R * 0.1 + k * R * 0.25, -R * 0.3, R * 0.18, -0.9, 0.9);
      ctx.stroke();
    }

    // 鼻孔
    ctx.fillStyle = dead ? '#1a0e08' : '#1a3d0a';
    ctx.beginPath();
    ctx.arc(R * 0.85, -R * 0.15, R * 0.06, 0, 6.284);
    ctx.arc(R * 0.85, R * 0.15, R * 0.06, 0, 6.284);
    ctx.fill();

    // 吐信
    const tongueCycle = Math.sin(this.tick * 0.06) > 0.7;
    if (tongueCycle && !dead) {
      const len = R * 1.6;
      ctx.strokeStyle = '#ff1744';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(R * 1.0, 0);
      ctx.lineTo(R * 1.0 + len * 0.55, 0);
      ctx.lineTo(R * 1.0 + len, -R * 0.32);
      ctx.moveTo(R * 1.0 + len * 0.55, 0);
      ctx.lineTo(R * 1.0 + len, R * 0.32);
      ctx.stroke();
    }

    // 眼睛——更大更亮
    const eyeX = -R * 0.15;
    const eyeY = R * 0.5;
    const eyeR = R * 0.32;

    for (const side of [-1, 1]) {
      const eyeGrad = ctx.createRadialGradient(
        eyeX - eyeR * 0.3, side * eyeY - eyeR * 0.3, 1,
        eyeX, side * eyeY, eyeR
      );
      eyeGrad.addColorStop(0, '#ffffff');
      eyeGrad.addColorStop(0.6, '#fffde7');
      eyeGrad.addColorStop(1, '#ffd54f');
      ctx.fillStyle = eyeGrad;
      ctx.beginPath();
      ctx.arc(eyeX, side * eyeY, eyeR, 0, 6.284);
      ctx.fill();
      ctx.strokeStyle = '#2a1a10';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 瞳孔
      ctx.fillStyle = '#0a0500';
      ctx.beginPath();
      ctx.ellipse(eyeX + eyeR * 0.28, side * eyeY, eyeR * 0.42, eyeR * 0.78, 0, 0, 6.284);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath();
      ctx.arc(eyeX + eyeR * 0.1, side * eyeY - eyeR * 0.35, eyeR * 0.3, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(eyeX - eyeR * 0.25, side * eyeY + eyeR * 0.25, eyeR * 0.16, 0, 6.284);
      ctx.fill();
    }

    ctx.restore();
  },

  drawParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      ctx.globalAlpha = Math.min(1, p.life / 22);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  drawFloats() {
    const ctx = this.ctx;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of this.floats) {
      ctx.globalAlpha = Math.min(1, f.life / 30);
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillStyle = '#000';
      ctx.fillText(f.text, f.x + 2, f.y + 2);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  },

  drawHUD() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, CFG.HUD_H);
    g.addColorStop(0, 'rgba(14, 28, 50, 0.98)');
    g.addColorStop(1, 'rgba(14, 28, 50, 0.75)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.HUD_H);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, CFG.HUD_H - 1);
    ctx.lineTo(CFG.W, CFG.HUD_H - 1);
    ctx.stroke();

    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#7dd3fc';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText('分数', 16, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(String(this.score).padStart(4, '0'), 16, 38);

    const len = this.snake ? this.snake.segments.length : 0;
    ctx.fillStyle = '#7dd3fc';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText('长度', 130, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(String(len), 130, 38);

    ctx.fillStyle = 'rgba(125, 211, 252, 0.7)';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText('最高', 230, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.fillText(String(Save.data.highScore).padStart(4, '0'), 230, 38);

    ctx.textBaseline = 'alphabetic';
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.enabled = Save.data.soundOn;
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (Sound.enabled) { Sound.init(); Sound.resume(); }
  },
};

window.addEventListener('DOMContentLoaded', () => {
  Game.init();
});
</script>
