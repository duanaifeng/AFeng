<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#021018">
<title>大鱼吃小鱼 · 深海猎食</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #game {
    display: block; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #021018;
  }
  .tool-btn {
    position: fixed; width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5); color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 900;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tool-btn:active { transform: scale(0.9); }
  .tool-btn.dim { opacity: 0.4; }
  #btn-full  { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
  #btn-sound { top: calc(10px + env(safe-area-inset-top)); right: calc(64px + env(safe-area-inset-right)); }
  #btn-pause { top: calc(10px + env(safe-area-inset-top)); right: calc(118px + env(safe-area-inset-right)); }

  /* ============================================
     实体方向按钮（十字布局，右下角 —— 右手拇指位）
     ============================================ */
  #dpad {
    position: fixed;
    right: 24px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 240px;
    height: 240px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    pointer-events: none;
    z-index: 700;
  }
  .dpad-btn {
    pointer-events: auto;
    border-radius: 20px;
    border: 3px solid rgba(77,208,225,0.6);
    background: rgba(4,26,48,0.7);
    color: #4dd0e1;
    font-size: 38px;
    font-weight: bold;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.08s, background 0.08s, color 0.08s;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), inset 0 0 12px rgba(77,208,225,0.15);
  }
  .dpad-btn.pressed {
    transform: scale(0.88);
    background: rgba(77,208,225,0.85);
    color: #021018;
    box-shadow: 0 0 20px rgba(77,208,225,0.7), inset 0 0 12px rgba(255,255,255,0.4);
  }
  .dpad-btn.up    { grid-column: 2; grid-row: 1; }
  .dpad-btn.left  { grid-column: 1; grid-row: 2; }
  .dpad-btn.right { grid-column: 3; grid-row: 2; }
  .dpad-btn.down  { grid-column: 2; grid-row: 3; }

  /* 响应式缩小 */
  @media (max-width: 820px) {
    #dpad { width: 210px; height: 210px; right: 20px; gap: 9px; }
    .dpad-btn { font-size: 33px; border-radius: 18px; }
  }
  @media (max-width: 680px) {
    #dpad { width: 190px; height: 190px; right: 16px; gap: 8px; bottom: calc(18px + env(safe-area-inset-bottom)); }
    .dpad-btn { font-size: 29px; border-radius: 16px; border-width: 2.5px; }
  }
  @media (max-width: 560px) {
    #dpad { width: 170px; height: 170px; right: 14px; gap: 7px; }
    .dpad-btn { font-size: 25px; border-radius: 14px; border-width: 2px; }
  }
  @media (max-width: 440px) {
    #dpad { width: 150px; height: 150px; right: 12px; gap: 6px; }
    .dpad-btn { font-size: 22px; border-radius: 12px; }
  }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(2,16,24,0.94);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 8000; color: #fff; padding: 30px;
    gap: 14px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 56px; letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(180deg, #ffe082 0%, #26c6da 50%, #0d47a1 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 24px rgba(38,198,218,0.5);
    font-style: italic;
  }
  .overlay h2 { font-size: 24px; color: #4dd0e1; letter-spacing: 4px; }
  .overlay p { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.9; }

  .menu-btn {
    padding: 13px 40px; border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08);
    color: #fff; font-family: inherit;
    font-size: 16px; letter-spacing: 2px;
    cursor: pointer; transition: all 0.15s;
    min-width: 220px; font-weight: bold;
  }
  .menu-btn:hover, .menu-btn:active { background: rgba(255,255,255,0.2); }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn.primary {
    background: linear-gradient(135deg, #26c6da, #0d47a1);
    border-color: #26c6da;
    box-shadow: 0 4px 20px rgba(38,198,218,0.5);
  }
  .menu-btn.primary:hover { box-shadow: 0 6px 26px rgba(38,198,218,0.8); }

  .stats-row { display: flex; gap: 40px; margin: 12px 0; }
  .stats-row .item { display: flex; flex-direction: column; gap: 4px; }
  .stats-row .label { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
  .stats-row .value { font-size: 30px; font-weight: bold; color: #4dd0e1; }

  .how-to {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 22px;
    font-size: 13px; color: rgba(255,255,255,0.75);
    line-height: 1.9; max-width: 440px;
  }
  .how-to b { color: #ffe082; }
  .how-to .big { color: #4dd0e1; }
  .how-to .small { color: #ff8a80; }

  .setting-row {
    display: flex; align-items: center; gap: 14px;
    font-size: 14px; min-width: 320px; justify-content: space-between;
    padding: 6px 0;
  }
  .setting-row input[type=range] { flex: 1; accent-color: #26c6da; }

  @media (max-width: 500px) {
    .overlay h1 { font-size: 36px; letter-spacing: 3px; }
    .menu-btn { padding: 11px 30px; font-size: 14px; min-width: 180px; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>

<button id="btn-pause" class="tool-btn">⏸</button>
<button id="btn-sound" class="tool-btn">♪</button>
<button id="btn-full"  class="tool-btn">⛶</button>

<!-- 实体方向键（右下角） -->
<div id="dpad">
  <button class="dpad-btn up"    data-key="ArrowUp">▲</button>
  <button class="dpad-btn left"  data-key="ArrowLeft">◀</button>
  <button class="dpad-btn right" data-key="ArrowRight">▶</button>
  <button class="dpad-btn down"  data-key="ArrowDown">▼</button>
</div>

<!-- 主菜单 -->
<div id="screen-main" class="overlay show">
  <h1>大鱼吃小鱼</h1>
  <h2>深 海 猎 食</h2>
  <div class="how-to">
    <b>移动</b>：右下角方向键 / 键盘 / 鼠标拖动<br>
    <b>玩法</b>：吃<span class="small">比自己数字小</span>的鱼，躲避<span class="big">比自己数字大</span>的鱼<br>
    <b>成长</b>：吃得越多，头顶数字越大<br>
    <b>危险</b>：被大数字的鱼碰到就结束了
  </div>
  <button class="menu-btn primary" id="cmd-start">开 始 游 戏</button>
  <button class="menu-btn" id="cmd-settings">设 置</button>
  <p style="margin-top:12px">最高分：<span id="ui-highscore">0</span> · 最大体型：<span id="ui-bestsize">0</span></p>
</div>

<!-- 设置 -->
<div id="screen-settings" class="overlay">
  <h2>设 置</h2>
  <div class="setting-row">
    <span>音效音量</span>
    <input type="range" id="set-volume" min="0" max="100" value="30">
  </div>
  <div class="setting-row">
    <span>操作模式</span>
    <select id="set-mode" style="padding:6px 12px;border-radius:8px;background:#0a2030;color:#fff;border:1px solid #444;font-family:inherit;font-size:14px;">
      <option value="follow">跟随鼠标/手指</option>
      <option value="keyboard">方向键按钮</option>
    </select>
  </div>
  <button class="menu-btn primary" id="cmd-settings-back">保 存 并 返 回</button>
</div>

<!-- 暂停 -->
<div id="screen-pause" class="overlay">
  <h2>暂 停</h2>
  <button class="menu-btn primary" id="cmd-resume">继 续 游 戏</button>
  <button class="menu-btn" id="cmd-restart">重 新 开 始</button>
  <button class="menu-btn" id="cmd-to-menu">返 回 菜 单</button>
</div>

<!-- 死亡 -->
<div id="screen-over" class="overlay">
  <h1 style="background:linear-gradient(180deg,#ff8a80,#7a0000);-webkit-background-clip:text;background-clip:text;">被 吃 掉 了</h1>
  <p id="ui-over-reason">遇到了更大的鱼</p>
  <div class="stats-row">
    <div class="item"><span class="label">分数</span><span class="value" id="ui-over-score">0</span></div>
    <div class="item"><span class="label">体型</span><span class="value" id="ui-over-size">0</span></div>
    <div class="item"><span class="label">存活</span><span class="value" id="ui-over-time">0s</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-over-retry">再 试 一 次</button>
  <button class="menu-btn" id="cmd-over-menu">返 回 菜 单</button>
</div>

<script>
'use strict';

const CFG = {
  W: 960, H: 640,
  STEP: 1000 / 60,
  SAVE_KEY: 'bigfish_v3',
  PLAYER_START_SIZE: 22,
  PLAYER_MAX_SIZE: 130,
  EAT_THRESHOLD: 0.92,
  PLAYER_ACCEL: 0.85,
  PLAYER_MAX_SPEED: 5.5,
  PLAYER_FRICTION: 0.90,
  SPAWN_INTERVAL: 60,
  MAX_ENEMIES: 28,
};

const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  angleTo: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
};

const Save = {
  data: { highScore: 0, bestSize: 0, soundOn: true, volume: 0.30, mode: 'keyboard' },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
      if (!this.data.mode) this.data.mode = 'keyboard';
    } catch (e) {}
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
};

const Sound = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = Save.data.volume;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setVolume(v) { if (this.master) this.master.gain.value = v; },
  tone({ freq, freq2, dur = 0.1, type = 'square', vol = 0.3, delay = 0 }) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq2 || freq, t0);
      if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  eat()   { this.tone({ freq: 400, freq2: 900, dur: 0.1, type: 'sine', vol: 0.3 });
            this.tone({ freq: 700, freq2: 1300, dur: 0.13, type: 'sine', vol: 0.28, delay: 0.08 }); },
  bigEat(){ [500, 700, 900, 1200].forEach((f, i) =>
              this.tone({ freq: f, freq2: f * 1.3, dur: 0.1, type: 'sine', vol: 0.3, delay: i * 0.05 })); },
  die()   { [500, 400, 320, 250, 180].forEach((f, i) =>
              this.tone({ freq: f, freq2: f * 0.5, dur: 0.18, type: 'sawtooth', vol: 0.35, delay: i * 0.12 })); },
};

const Input = {
  keys: Object.create(null),
  pointer: { x: CFG.W / 2, y: CFG.H / 2, active: false },

  init() {
    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      Sound.init(); Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') Game.togglePause();
      if (e.code === 'KeyF') Game.toggleFullscreen();
      if (e.code === 'KeyM') Game.toggleSound();
      if (e.code === 'KeyR' && Game.state !== 'menu') Game.start();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const key = btn.dataset.key;
      const press = e => {
        e.preventDefault();
        Sound.init(); Sound.resume();
        this.keys[key] = true;
        btn.classList.add('pressed');
      };
      const release = e => {
        e.preventDefault();
        this.keys[key] = false;
        btn.classList.remove('pressed');
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });

    const canvas = document.getElementById('game');
    const updatePointer = (clientX, clientY) => {
      const rect = canvas.getBoundingClientRect();
      this.pointer.x = (clientX - rect.left) * (CFG.W / rect.width);
      this.pointer.y = (clientY - rect.top) * (CFG.H / rect.height);
      this.pointer.active = true;
    };
    canvas.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
    canvas.addEventListener('mousedown', e => { Sound.init(); Sound.resume(); updatePointer(e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault(); Sound.init(); Sound.resume();
      const t = e.touches[0];
      updatePointer(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      updatePointer(t.clientX, t.clientY);
    }, { passive: false });
  },

  left()  { return this.keys['ArrowLeft'] || this.keys['KeyA']; },
  right() { return this.keys['ArrowRight'] || this.keys['KeyD']; },
  up()    { return this.keys['ArrowUp'] || this.keys['KeyW']; },
  down()  { return this.keys['ArrowDown'] || this.keys['KeyS']; },
  anyDirPressed() { return this.left() || this.right() || this.up() || this.down(); },
};

const FISH_TYPES = [
  { name: 'goldfish',   color: '#ff9f1c', color2: '#e76f51', pattern: 'stripes', speed: 1.6, sizeMin: 10, sizeMax: 18 },
  { name: 'clownfish',  color: '#ffb703', color2: '#fb8500', pattern: 'bands',   speed: 1.5, sizeMin: 11, sizeMax: 19 },
  { name: 'neon',       color: '#4dd0e1', color2: '#0288d1', pattern: 'stripe',  speed: 2.0, sizeMin: 8,  sizeMax: 14 },
  { name: 'bluefish',   color: '#3d5afe', color2: '#1a237e', pattern: 'spots',   speed: 1.4, sizeMin: 22, sizeMax: 36 },
  { name: 'greenfish',  color: '#66bb6a', color2: '#2e7d32', pattern: 'scale',   speed: 1.3, sizeMin: 24, sizeMax: 40 },
  { name: 'puffer',     color: '#ab47bc', color2: '#6a1b9a', pattern: 'dots',    speed: 1.0, sizeMin: 26, sizeMax: 42 },
  { name: 'tuna',       color: '#546e7a', color2: '#263238', pattern: 'stripe',  speed: 1.5, sizeMin: 46, sizeMax: 68 },
  { name: 'redSnapper', color: '#ef5350', color2: '#b71c1c', pattern: 'scale',   speed: 1.3, sizeMin: 50, sizeMax: 72 },
  { name: 'shark',      color: '#607d8b', color2: '#1c2833', pattern: 'shark',   speed: 1.7, sizeMin: 80, sizeMax: 130 },
];

class Fish {
  constructor(opts) {
    this.x = opts.x;
    this.y = opts.y;
    this.size = opts.size;
    this.angle = opts.angle !== undefined ? opts.angle : 0;
    this.typeIdx = opts.typeIdx;
    this.type = FISH_TYPES[this.typeIdx];
    this.color = this.type.color;
    this.color2 = this.type.color2;
    this.pattern = this.type.pattern;
    this.baseSpeed = this.type.speed;
    this.vx = 0;
    this.vy = 0;
    this.wanderTimer = U.rand(0, 120);
    this.targetAngle = this.angle;
    this.tailPhase = Math.random() * 6.28;
    this.mouthOpen = 0;
    this.isPlayer = false;
    this.alive = true;
    this.flipX = Math.cos(this.angle) < 0 ? -1 : 1;
    this.spawnTime = 0;
  }

  update(dt, game) {
    this.tailPhase += dt * 8;
    if (this.isPlayer) this.updatePlayer(dt);
    else this.updateAI(dt, game);
    this.x += this.vx;
    this.y += this.vy;
    const m = this.size * 1.2;
    if (this.x < m) { this.x = m; this.vx = Math.abs(this.vx); }
    if (this.x > CFG.W - m) { this.x = CFG.W - m; this.vx = -Math.abs(this.vx); }
    if (this.y < m) { this.y = m; this.vy = Math.abs(this.vy); }
    if (this.y > CFG.H - m) { this.y = CFG.H - m; this.vy = -Math.abs(this.vy); }
    // 鱼身始终保持水平，仅根据水平速度方向决定头朝左还是朝右
    if (Math.abs(this.vx) > 0.3) {
      this.flipX = this.vx > 0 ? 1 : -1;
    }
    if (this.mouthOpen > 0) this.mouthOpen -= dt * 0.1;
    this.spawnTime += dt;
  }

  updatePlayer(dt) {
    const mode = Save.data.mode;
    const usingButtons = Input.anyDirPressed();

    if (mode === 'follow' && Input.pointer.active && !usingButtons) {
      const dx = Input.pointer.x - this.x;
      const dy = Input.pointer.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        const sp = Math.min(CFG.PLAYER_MAX_SPEED, d * 0.15);
        const targetVx = (dx / d) * sp;
        const targetVy = (dy / d) * sp;
        this.vx = U.lerp(this.vx, targetVx, 0.18);
        this.vy = U.lerp(this.vy, targetVy, 0.18);
      } else {
        this.vx *= 0.85;
        this.vy *= 0.85;
      }
    } else {
      let ax = 0, ay = 0;
      if (Input.left())  ax -= 1;
      if (Input.right()) ax += 1;
      if (Input.up())    ay -= 1;
      if (Input.down())  ay += 1;
      if (ax || ay) {
        const len = Math.hypot(ax, ay);
        this.vx += (ax / len) * CFG.PLAYER_ACCEL;
        this.vy += (ay / len) * CFG.PLAYER_ACCEL;
      } else {
        this.vx *= CFG.PLAYER_FRICTION;
        this.vy *= CFG.PLAYER_FRICTION;
      }
    }
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > CFG.PLAYER_MAX_SPEED) {
      this.vx = this.vx / sp * CFG.PLAYER_MAX_SPEED;
      this.vy = this.vy / sp * CFG.PLAYER_MAX_SPEED;
    }
  }

  updateAI(dt, game) {
    this.wanderTimer -= dt;
    const player = game.player;
    const dToPlayer = U.dist(this, player);
    const detectRange = 180 + this.size * 2;

    if (dToPlayer < detectRange) {
      if (this.size > player.size * 1.05) {
        // 追逐玩家：头朝向玩家方向
        this.targetAngle = U.angleTo(this, player);
        const chaseSpeed = this.baseSpeed * 0.9;
        this.vx = U.lerp(this.vx, Math.cos(this.targetAngle) * chaseSpeed, 0.05);
        this.vy = U.lerp(this.vy, Math.sin(this.targetAngle) * chaseSpeed, 0.05);
        return;
      } else if (this.size < player.size * 0.95) {
        // 逃离玩家：头背对玩家方向
        this.targetAngle = U.angleTo(player, this);
        const fleeSpeed = this.baseSpeed * 1.4;
        this.vx = U.lerp(this.vx, Math.cos(this.targetAngle) * fleeSpeed, 0.07);
        this.vy = U.lerp(this.vy, Math.sin(this.targetAngle) * fleeSpeed, 0.07);
        return;
      }
    }
    if (this.wanderTimer <= 0) {
      this.wanderTimer = U.rand(60, 180);
      this.targetAngle = U.rand(-Math.PI, Math.PI);
      if (Math.abs(Math.cos(this.targetAngle)) < 0.4) {
        this.targetAngle += this.targetAngle > 0 ? 0.6 : -0.6;
      }
    }
    const spd = this.baseSpeed * 0.7;
    this.vx = U.lerp(this.vx, Math.cos(this.targetAngle) * spd, 0.03);
    this.vy = U.lerp(this.vy, Math.sin(this.targetAngle) * spd, 0.03);
  }

  draw(ctx, tick) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.flipX, 1);
    // 鱼身始终水平，不随移动方向倾斜
    const s = this.size;

    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.9, s * 1.15, s * 0.35, 0, 0, 6.284);
    ctx.fill();
    ctx.restore();

    const tailWag = Math.sin(this.tailPhase) * 0.35;
    ctx.save();
    ctx.translate(-s * 0.85, 0);
    ctx.rotate(tailWag);
    this.drawTail(ctx, s);
    ctx.restore();

    this.drawFins(ctx, s);
    this.drawBody(ctx, s);
    this.drawPectoral(ctx, s);

    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = Math.max(1, s * 0.06);
    ctx.beginPath();
    ctx.arc(s * 0.1, 0, s * 0.55, -0.9, 0.9);
    ctx.stroke();

    this.drawScales(ctx, s);
    this.drawEyes(ctx, s);
    this.drawMouth(ctx, s);

    ctx.restore();

    if (this.isPlayer) {
      const pulse = 0.6 + Math.sin(tick * 0.08) * 0.15;
      ctx.save();
      ctx.strokeStyle = `rgba(255,224,130,${pulse * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 1.3, 0, 6.284);
      ctx.stroke();
      ctx.restore();
    }

    this.drawSizeLabel(ctx, tick);
  }

  drawSizeLabel(ctx, tick) {
    const s = this.size;
    const label = String(Math.floor(s));
    const labelY = this.y - s * 1.28 - 4;
    const fontSize = Math.max(15, Math.min(28, s * 0.5));

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (this.isPlayer) {
      const r = fontSize * 0.78;
      const pulse = 1 + Math.sin(tick * 0.1) * 0.08;
      ctx.beginPath();
      ctx.arc(this.x, labelY, r * pulse, 0, 6.284);
      const g = ctx.createRadialGradient(this.x - r * 0.3, labelY - r * 0.3, 1, this.x, labelY, r);
      g.addColorStop(0, 'rgba(255,230,150,0.95)');
      g.addColorStop(0.7, 'rgba(255,180,50,0.9)');
      g.addColorStop(1, 'rgba(200,120,20,0.95)');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    ctx.font = `bold ${fontSize}px "Courier New", monospace`;
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.strokeText(label, this.x, labelY + 1);

    if (this.isPlayer) {
      ctx.fillStyle = '#fffbe6';
    } else {
      const player = Game.player;
      if (player) {
        if (this.size < player.size * CFG.EAT_THRESHOLD) ctx.fillStyle = '#8ef58e';
        else if (this.size > player.size * 1.05) ctx.fillStyle = '#ff8a80';
        else ctx.fillStyle = '#ffe082';
      } else {
        ctx.fillStyle = '#e0f7fa';
      }
    }
    ctx.fillText(label, this.x, labelY + 1);

    if (this.isPlayer) {
      ctx.beginPath();
      ctx.moveTo(this.x - 5, labelY + fontSize * 0.72);
      ctx.lineTo(this.x + 5, labelY + fontSize * 0.72);
      ctx.lineTo(this.x, labelY + fontSize * 1.0);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,200,80,0.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawBody(ctx, s) {
    ctx.beginPath();
    ctx.moveTo(-s * 0.85, 0);
    ctx.bezierCurveTo(-s * 0.7, -s * 0.5, -s * 0.1, -s * 0.9, s * 0.5, -s * 0.75);
    ctx.bezierCurveTo(s * 0.95, -s * 0.55, s * 1.1, -s * 0.25, s * 1.1, 0);
    ctx.bezierCurveTo(s * 1.1, s * 0.25, s * 0.95, s * 0.55, s * 0.5, s * 0.75);
    ctx.bezierCurveTo(-s * 0.1, s * 0.9, -s * 0.7, s * 0.5, -s * 0.85, 0);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, -s, 0, s);
    grad.addColorStop(0, this.color);
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, this.color2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = 0.35;
    const hl = ctx.createLinearGradient(0, -s * 0.9, 0, 0);
    hl.addColorStop(0, 'rgba(255,255,255,0.7)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.moveTo(-s * 0.7, -s * 0.2);
    ctx.bezierCurveTo(-s * 0.5, -s * 0.7, s * 0.2, -s * 0.85, s * 0.7, -s * 0.6);
    ctx.bezierCurveTo(s * 0.4, -s * 0.5, -s * 0.2, -s * 0.4, -s * 0.7, -s * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawTail(ctx, s) {
    const grad = ctx.createLinearGradient(0, 0, -s * 0.8, 0);
    grad.addColorStop(0, this.color);
    grad.addColorStop(1, this.color2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-s * 0.4, -s * 0.2, -s * 0.85, -s * 0.75);
    ctx.lineTo(-s * 0.7, -s * 0.15);
    ctx.lineTo(-s * 0.85, 0);
    ctx.lineTo(-s * 0.7, s * 0.15);
    ctx.lineTo(-s * 0.85, s * 0.75);
    ctx.quadraticCurveTo(-s * 0.4, s * 0.2, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = Math.max(0.5, s * 0.03);
    for (let i = 0; i < 3; i++) {
      const t = -0.2 - i * 0.25;
      ctx.beginPath(); ctx.moveTo(-s * 0.15, 0); ctx.lineTo(s * t, -s * (0.4 + i * 0.1)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s * 0.15, 0); ctx.lineTo(s * t, s * (0.4 + i * 0.1)); ctx.stroke();
    }
  }

  drawFins(ctx, s) {
    ctx.fillStyle = this.color2;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(-s * 0.25, -s * 0.55);
    ctx.quadraticCurveTo(-s * 0.05, -s * 1.15, s * 0.35, -s * 0.65);
    ctx.quadraticCurveTo(s * 0.1, -s * 0.6, -s * 0.25, -s * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = Math.max(0.8, s * 0.03);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-s * 0.15, s * 0.5);
    ctx.quadraticCurveTo(-s * 0.05, s * 1.05, s * 0.25, s * 0.55);
    ctx.quadraticCurveTo(s * 0.05, s * 0.55, -s * 0.15, s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  drawPectoral(ctx, s) {
    const wag = Math.sin(this.tailPhase + 1.5) * 0.25;
    ctx.save();
    ctx.translate(s * 0.25, s * 0.1);
    ctx.rotate(wag);
    ctx.fillStyle = this.color2;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-s * 0.3, s * 0.35, s * 0.05, s * 0.7);
    ctx.quadraticCurveTo(s * 0.25, s * 0.35, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = Math.max(0.6, s * 0.025);
    ctx.stroke();
    ctx.restore();
  }

  drawScales(ctx, s) {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = Math.max(0.5, s * 0.02);
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 5; c++) {
        const px = -s * 0.4 + c * s * 0.22;
        const py = -s * 0.35 + r * s * 0.35;
        ctx.beginPath();
        ctx.arc(px, py, s * 0.09, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.save();
    if (this.pattern === 'stripes') {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = this.color2;
      for (let i = 0; i < 4; i++) {
        const px = -s * 0.3 + i * s * 0.3;
        ctx.beginPath();
        ctx.ellipse(px, 0, s * 0.06, s * 0.7, 0, 0, 6.284);
        ctx.fill();
      }
    } else if (this.pattern === 'bands') {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) {
        const px = -s * 0.15 + i * s * 0.4;
        ctx.beginPath();
        ctx.ellipse(px, 0, s * 0.05, s * 0.72, 0, 0, 6.284);
        ctx.fill();
      }
    } else if (this.pattern === 'spots') {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = this.color2;
      for (let i = 0; i < 6; i++) {
        const px = -s * 0.4 + (i % 3) * s * 0.35;
        const py = -s * 0.3 + Math.floor(i / 3) * s * 0.55;
        ctx.beginPath();
        ctx.arc(px, py, s * 0.1, 0, 6.284);
        ctx.fill();
      }
    } else if (this.pattern === 'dots') {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 8; i++) {
        const px = -s * 0.4 + (i * 0.13) * s;
        const py = -s * 0.5 + ((i * 0.27) % 1) * s;
        ctx.beginPath();
        ctx.arc(px, py, s * 0.05, 0, 6.284);
        ctx.fill();
      }
    } else if (this.pattern === 'stripe') {
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = this.color2;
      ctx.beginPath();
      ctx.moveTo(-s * 0.8, -s * 0.1);
      ctx.quadraticCurveTo(0, -s * 0.4, s * 0.9, -s * 0.1);
      ctx.lineTo(s * 0.9, s * 0.05);
      ctx.quadraticCurveTo(0, -s * 0.25, -s * 0.8, s * 0.05);
      ctx.closePath();
      ctx.fill();
    } else if (this.pattern === 'scale') {
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = this.color2;
      ctx.lineWidth = Math.max(0.8, s * 0.03);
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(-s * 0.5 + i * s * 0.3, 0, s * 0.25, -1.2, 1.2);
        ctx.stroke();
      }
    } else if (this.pattern === 'shark') {
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#1c2833';
      ctx.beginPath();
      ctx.moveTo(-s * 0.8, -s * 0.15);
      ctx.quadraticCurveTo(0, -s * 0.9, s * 0.9, -s * 0.4);
      ctx.quadraticCurveTo(s * 0.5, -s * 0.35, -s * 0.8, -s * 0.15);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  drawEyes(ctx, s) {
    const eyeX = s * 0.65;
    const eyeY = -s * 0.25;
    const eyeR = s * 0.17;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, eyeR, 0, 6.284);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = Math.max(0.8, s * 0.03);
    ctx.stroke();

    const irisR = eyeR * 0.72;
    const irisGrad = ctx.createRadialGradient(eyeX + eyeR * 0.2, eyeY - eyeR * 0.2, 1, eyeX, eyeY, irisR);
    irisGrad.addColorStop(0, '#ffca28');
    irisGrad.addColorStop(1, '#e65100');
    ctx.fillStyle = irisGrad;
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, irisR, 0, 6.284);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(eyeX, eyeY, irisR * 0.4, irisR * 0.9, 0, 0, 6.284);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(eyeX + irisR * 0.3, eyeY - irisR * 0.35, irisR * 0.28, 0, 6.284);
    ctx.fill();
  }

  drawMouth(ctx, s) {
    const openness = this.mouthOpen;
    ctx.fillStyle = this.color2;
    ctx.beginPath();
    ctx.ellipse(s * 1.02, 0, s * 0.14, s * 0.15, 0, 0, 6.284);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath();
    if (openness > 0.05) {
      ctx.ellipse(s * 1.02, 0, s * 0.12, s * (0.1 + openness * 0.15), 0, 0, 6.284);
    } else {
      ctx.moveTo(s * 0.95, 0);
      ctx.quadraticCurveTo(s * 1.05, 0.05, s * 1.1, 0.08);
    }
    ctx.stroke();
  }
}

class Bubble {
  constructor() {
    this.x = U.rand(0, CFG.W);
    this.y = CFG.H + 20;
    this.r = U.rand(2, 8);
    this.speed = U.rand(0.5, 1.5);
    this.wobble = Math.random() * 6.284;
    this.wobbleSpeed = U.rand(0.02, 0.05);
  }
  update() {
    this.y -= this.speed;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.3;
    if (this.y < -20) {
      this.y = CFG.H + 20;
      this.x = U.rand(0, CFG.W);
      this.r = U.rand(2, 8);
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, 6.284);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.3, 0, 6.284);
    ctx.fill();
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const a = Math.random() * 6.284;
    const sp = U.rand(1, 4);
    this.vx = Math.cos(a) * sp;
    this.vy = Math.sin(a) * sp - 1;
    this.life = U.rand(30, 55);
    this.maxLife = this.life;
    this.color = color;
    this.size = U.rand(2, 5);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.vy -= 0.05;
    this.life--;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.min(1, this.life / this.maxLife * 1.5);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, 6.284);
    ctx.fill();
  }
}

const Game = {
  canvas: null, ctx: null,
  state: 'menu',
  tick: 0,
  player: null,
  enemies: [],
  bubbles: [],
  particles: [],
  floats: [],
  seaweed: [],
  caustics: [],
  score: 0,
  runTime: 0,
  spawnTimer: 0,
  cameraShake: 0,
  deathFlash: 0,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.enabled = Save.data.soundOn;
    Input.init();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));

    for (let i = 0; i < 25; i++) this.bubbles.push(new Bubble());
    for (let i = 0; i < 14; i++) {
      this.seaweed.push({
        x: U.rand(0, CFG.W),
        h: U.rand(60, 180),
        phase: Math.random() * 6.284,
        speed: U.rand(0.02, 0.05),
        width: U.rand(4, 10),
        color: U.pick(['#2e7d32', '#388e3c', '#43a047', '#1b5e20']),
      });
    }
    for (let i = 0; i < 6; i++) {
      this.caustics.push({
        x: U.rand(0, CFG.W),
        w: U.rand(80, 200),
        phase: Math.random() * 6.284,
        speed: U.rand(0.005, 0.015),
      });
    }
    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('btn-full').addEventListener('click', e => { e.preventDefault(); this.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', e => { e.preventDefault(); this.toggleSound(); });
    $('btn-pause').addEventListener('click', e => { e.preventDefault(); this.togglePause(); });
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.updateFsIcon(); setTimeout(() => this.resize(), 150); }));

    $('cmd-start').addEventListener('click', () => { Sound.init(); Sound.resume(); this.start(); });
    $('cmd-settings').addEventListener('click', () => {
      this.loadSettings();
      UI.hide('screen-main'); UI.show('screen-settings');
    });
    $('cmd-settings-back').addEventListener('click', () => {
      UI.hide('screen-settings'); UI.show('screen-main');
      UI.refreshMenu(); Save.save();
    });
    $('set-volume').addEventListener('input', e => {
      Save.data.volume = e.target.value / 100;
      Sound.setVolume(Save.data.volume);
    });
    $('set-mode').addEventListener('change', e => { Save.data.mode = e.target.value; });

    $('cmd-resume').addEventListener('click', () => this.togglePause());
    $('cmd-restart').addEventListener('click', () => { UI.hide('screen-pause'); this.start(); });
    $('cmd-to-menu').addEventListener('click', () => { UI.hide('screen-pause'); this.toMenu(); });

    $('cmd-over-retry').addEventListener('click', () => { UI.hide('screen-over'); this.start(); });
    $('cmd-over-menu').addEventListener('click', () => { UI.hide('screen-over'); this.toMenu(); });
  },

  loadSettings() {
    document.getElementById('set-volume').value = Math.round(Save.data.volume * 100);
    document.getElementById('set-mode').value = Save.data.mode;
  },

  resize() {
    const ratio = CFG.W / CFG.H;
    const ww = window.innerWidth, wh = window.innerHeight;
    let w, h;
    if (ww / wh > ratio) { h = wh; w = h * ratio; }
    else { w = ww; h = w / ratio; }
    this.canvas.style.width = Math.round(w) + 'px';
    this.canvas.style.height = Math.round(h) + 'px';
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.enabled = Save.data.soundOn;
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (Sound.enabled) { Sound.init(); Sound.resume(); }
  },
  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      UI.show('screen-pause');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      UI.hide('screen-pause');
    }
  },

  start() {
    this.score = 0;
    this.runTime = 0;
    this.tick = 0;
    this.spawnTimer = 0;
    this.cameraShake = 0;
    this.deathFlash = 0;
    this.enemies = [];
    this.particles = [];
    this.floats = [];

    this.player = new Fish({
      x: CFG.W / 2,
      y: CFG.H / 2,
      size: CFG.PLAYER_START_SIZE,
      angle: 0,
      typeIdx: 0,
    });
    this.player.isPlayer = true;
    this.player.color = '#ffb300';
    this.player.color2 = '#e65100';
    this.player.pattern = 'stripes';

    for (let i = 0; i < 8; i++) this.spawnEnemy(true);

    this.state = 'playing';
    UI.hideAll();
    Sound.init(); Sound.resume();
  },

  toMenu() {
    this.state = 'menu';
    UI.hideAll();
    UI.show('screen-main');
    UI.refreshMenu();
  },

  spawnEnemy(initial = false) {
    if (this.enemies.length >= CFG.MAX_ENEMIES) return;
    const playerSize = this.player ? this.player.size : CFG.PLAYER_START_SIZE;

    // ---- 动态体型上限 ----
    // 玩家越小，允许的最大敌人体型越小；玩家越大，上限逐渐放开
    let maxAllowedSize = Math.min(playerSize * 1.5 + 15, 130);
    if (initial) {
      // 初始生成时更加保守，上限再降低一些
      maxAllowedSize = Math.min(maxAllowedSize, playerSize * 1.8);
    }

    // ---- 构建候选池（带权重） ----
    const pool = [];
    for (let i = 0; i < FISH_TYPES.length; i++) {
      const t = FISH_TYPES[i];
      const avg = (t.sizeMin + t.sizeMax) / 2;

      // 跳过平均体型远小于玩家的（除非玩家很小）
      if (avg < playerSize * 0.25 && playerSize > 40) continue;

      // 如果该类型的最大体型超过了允许的上限，则不加入池中
      if (t.sizeMax > maxAllowedSize) continue;

      // 计算权重：体型越接近玩家，权重越高；过大的权重低
      const sizeRatio = avg / playerSize;
      let weight = 1.0;
      if (sizeRatio < 0.5) {
        weight = 0.5;          // 小鱼出现概率较低
      } else if (sizeRatio > 1.2) {
        weight = 0.2;          // 大鱼出现概率极低（关键！）
      } else {
        weight = 1.5;          // 相近体型出现概率较高
      }

      for (let w = 0; w < weight; w++) {
        pool.push(i);
      }
    }

    if (pool.length === 0) {
      pool.push(0);
    }

    // ---- 随机选取类型 ----
    const typeIdx = U.pick(pool);
    const type = FISH_TYPES[typeIdx];

    // ---- 生成位置 ----
    const side = U.randInt(0, 3);
    let x, y, angle;
    const margin = 60;
    if (side === 0) { x = -margin; y = U.rand(0, CFG.H); angle = U.rand(-0.4, 0.4); }
    else if (side === 1) { x = CFG.W + margin; y = U.rand(0, CFG.H); angle = Math.PI + U.rand(-0.4, 0.4); }
    else if (side === 2) { x = U.rand(0, CFG.W); y = -margin; angle = Math.PI / 2 + U.rand(-0.4, 0.4); }
    else { x = U.rand(0, CFG.W); y = CFG.H + margin; angle = -Math.PI / 2 + U.rand(-0.4, 0.4); }

    // 体型在类型范围内随机，但不超过动态上限
    const size = U.rand(type.sizeMin, Math.min(type.sizeMax, maxAllowedSize));

    this.enemies.push(new Fish({ x, y, size, angle, typeIdx }));
  },

  onDeath(reason) {
    if (this.state !== 'playing') return;
    this.state = 'dead';
    this.cameraShake = 20;
    this.deathFlash = 0.8;
    Sound.die();

    if (this.score > Save.data.highScore) Save.data.highScore = this.score;
    if (this.player.size > Save.data.bestSize) Save.data.bestSize = Math.floor(this.player.size);
    Save.save();

    UI.setOver(reason, this.score, Math.floor(this.player.size), this.runTime);
    setTimeout(() => UI.show('screen-over'), 700);
  },

  lastTime: 0, accumulator: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator += delta;
    let guard = 0;
    while (this.accumulator >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator = 0;
    this.render();
  },

  update() {
    this.tick++;
    for (const b of this.bubbles) b.update();
    for (const s of this.seaweed) s.phase += s.speed;
    for (const c of this.caustics) c.phase += c.speed;

    if (this.state !== 'playing' && this.state !== 'dead') return;
    if (this.cameraShake > 0) this.cameraShake *= 0.9;
    if (this.deathFlash > 0) this.deathFlash -= 0.03;

    if (this.state === 'dead') {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        this.particles[i].update();
        if (this.particles[i].life <= 0) this.particles.splice(i, 1);
      }
      return;
    }

    this.runTime += 1 / 60;
    this.player.update(1, this);

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(1, this);

      if (e.x < -200 || e.x > CFG.W + 200 || e.y < -200 || e.y > CFG.H + 200) {
        this.enemies.splice(i, 1);
        continue;
      }
      const d = U.dist(e, this.player);
      const threshold = (e.size + this.player.size) * 0.6;
      if (d < threshold) {
        if (e.size < this.player.size * CFG.EAT_THRESHOLD) {
          this.eatEnemy(e, i);
        } else if (e.size > this.player.size * 1.05) {
          this.onDeath('被更大的鱼吃掉了');
          return;
        }
      }
    }

    this.spawnTimer++;
    if (this.spawnTimer >= CFG.SPAWN_INTERVAL) {
      this.spawnTimer = 0;
      this.spawnEnemy();
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update();
      if (this.particles[i].life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 1;
      f.life--;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
  },

  eatEnemy(e, idx) {
    e.alive = false;
    this.player.mouthOpen = 1;
    this.player.size = Math.min(CFG.PLAYER_MAX_SIZE, this.player.size + e.size * 0.13);
    const pts = Math.floor(e.size * 1.5);
    this.score += pts;
    Sound.eat();
    if (e.size > this.player.size * 0.6) Sound.bigEat();

    this.floats.push({ x: e.x, y: e.y, text: '+' + pts, life: 50, color: '#ffe082' });
    for (let i = 0; i < 14; i++) {
      this.particles.push(new Particle(e.x, e.y, U.pick([e.color, e.color2, '#fff'])));
    }
    this.enemies.splice(idx, 1);
    this.cameraShake = Math.min(8, 2 + e.size * 0.1);
  },

  render() {
    const ctx = this.ctx;
    ctx.save();
    if (this.cameraShake > 0.5) {
      ctx.translate((Math.random() - 0.5) * this.cameraShake,
                    (Math.random() - 0.5) * this.cameraShake);
    }
    this.drawBackground(ctx);
    this.drawCaustics(ctx);
    this.drawSeaweed(ctx);
    for (const b of this.bubbles) b.draw(ctx);

    if (this.player) {
      const all = [...this.enemies, this.player];
      all.sort((a, b) => a.size - b.size);
      for (const f of all) f.draw(ctx, this.tick);
    }

    for (const p of this.particles) p.draw(ctx);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of this.floats) {
      ctx.globalAlpha = Math.min(1, f.life / 30);
      ctx.font = 'bold 22px "Courier New", monospace';
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.restore();

    if (this.deathFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${this.deathFlash * 0.6})`;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }
    if (this.state !== 'menu') this.drawHUD(ctx);
  },

  drawBackground(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
    g.addColorStop(0, '#0a3a5a');
    g.addColorStop(0.4, '#062a45');
    g.addColorStop(0.75, '#041a30');
    g.addColorStop(1, '#021018');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    const sandGrad = ctx.createLinearGradient(0, CFG.H - 80, 0, CFG.H);
    sandGrad.addColorStop(0, 'rgba(80,60,40,0.4)');
    sandGrad.addColorStop(1, 'rgba(50,35,20,0.9)');
    ctx.fillStyle = sandGrad;
    ctx.beginPath();
    ctx.moveTo(0, CFG.H - 40);
    for (let x = 0; x <= CFG.W; x += 40) {
      const y = CFG.H - 50 + Math.sin(x * 0.02) * 15 + Math.cos(x * 0.05) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(CFG.W, CFG.H);
    ctx.lineTo(0, CFG.H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(200,180,140,0.15)';
    for (let i = 0; i < 40; i++) {
      const x = (i * 137 + this.tick * 0.1) % CFG.W;
      const y = CFG.H - 30 + (i * 37) % 30;
      ctx.fillRect(x, y, 2, 2);
    }
  },

  drawCaustics(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const c of this.caustics) {
      const intensity = 0.04 + Math.sin(c.phase * 3) * 0.02;
      const sway = Math.sin(c.phase) * 30;
      const grad = ctx.createLinearGradient(c.x, 0, c.x + sway, CFG.H);
      grad.addColorStop(0, `rgba(150,220,255,${intensity})`);
      grad.addColorStop(0.5, `rgba(150,220,255,${intensity * 0.5})`);
      grad.addColorStop(1, 'rgba(150,220,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(c.x - c.w / 2, 0);
      ctx.lineTo(c.x + c.w / 2, 0);
      ctx.lineTo(c.x + sway + c.w * 0.3, CFG.H);
      ctx.lineTo(c.x + sway - c.w * 0.3, CFG.H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  },

  drawSeaweed(ctx) {
    for (const s of this.seaweed) {
      ctx.save();
      ctx.translate(s.x, CFG.H);
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width;
      ctx.lineCap = 'round';
      const wobble = Math.sin(s.phase) * 20;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(wobble * 0.5, -s.h * 0.5, wobble, -s.h);
      ctx.stroke();
      ctx.fillStyle = s.color;
      for (let i = 0; i < 3; i++) {
        const t = (i + 1) / 4;
        const lx = wobble * t;
        const ly = -s.h * t;
        ctx.beginPath();
        ctx.ellipse(lx, ly, 12, 6, Math.sin(s.phase + i) * 0.5, 0, 6.284);
        ctx.fill();
      }
      ctx.restore();
    }
  },

  drawHUD(ctx) {
    ctx.save();
    const g = ctx.createLinearGradient(0, 0, 0, 70);
    g.addColorStop(0, 'rgba(0,20,30,0.7)');
    g.addColorStop(1, 'rgba(0,20,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, 70);

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#4dd0e1';
    ctx.fillText('分数', 22, 24);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillText(String(this.score).padStart(5, '0'), 22, 50);

    if (this.player) {
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillStyle = '#4dd0e1';
      ctx.fillText('体型', 170, 24);
      ctx.fillStyle = '#ffe082';
      ctx.font = 'bold 24px "Courier New", monospace';
      ctx.fillText(Math.floor(this.player.size), 170, 50);
    }

    if (this.player) {
      const pw = 220, ph = 10;
      const px = CFG.W / 2 - pw / 2, py = 30;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 5);
      else ctx.rect(px, py, pw, ph);
      ctx.fill();

      const ratio = this.player.size / CFG.PLAYER_MAX_SIZE;
      const barGrad = ctx.createLinearGradient(px, 0, px + pw, 0);
      barGrad.addColorStop(0, '#4dd0e1');
      barGrad.addColorStop(0.7, '#ffe082');
      barGrad.addColorStop(1, '#ff8a65');
      ctx.fillStyle = barGrad;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(px, py, pw * ratio, ph, 5);
      else ctx.rect(px, py, pw * ratio, ph);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px + pw * ratio, py + ph / 2, 7, 0, 6.284);
      ctx.fill();
      ctx.strokeStyle = '#4dd0e1';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (this.state === 'playing' || this.state === 'paused') {
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.textAlign = 'right';
      ctx.fillText(Math.floor(this.runTime) + 's', CFG.W - 22, 24);
      ctx.textAlign = 'left';
    }

    if (this.state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText('暂 停', CFG.W / 2, CFG.H / 2);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  },
};

const UI = {
  refreshMenu() {
    document.getElementById('ui-highscore').textContent = Save.data.highScore;
    document.getElementById('ui-bestsize').textContent = Save.data.bestSize;
  },
  setOver(reason, score, size, time) {
    document.getElementById('ui-over-reason').textContent = reason;
    document.getElementById('ui-over-score').textContent = score;
    document.getElementById('ui-over-size').textContent = size;
    document.getElementById('ui-over-time').textContent = Math.floor(time) + 's';
  },
  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },
  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  hideAll() {
    ['screen-main','screen-settings','screen-pause','screen-over'].forEach(id => this.hide(id));
  },
};

window.addEventListener('DOMContentLoaded', () => {
  Game.init();
  Game.updateFsIcon();
  UI.refreshMenu();
  document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
  document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
});
</script>
</body>
