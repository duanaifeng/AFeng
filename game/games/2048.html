<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf8ef">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #faf8ef; overflow: hidden;
    font-family: "Clear Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block; position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 14px;
    background: #bbada0;
    box-shadow: 0 12px 48px rgba(120,100,80,0.25), 0 2px 8px rgba(120,100,80,0.15);
  }

  /* ============================================
     顶部工具按钮（右上角）
     ============================================ */
  .tool-btn {
    position: fixed;
    width: 46px; height: 46px; border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, #a5907e 0%, #8f7a66 100%);
    color: #f9f6f2; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 900;
    font-family: inherit;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(120,100,80,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
  }
  .tool-btn:hover { background: linear-gradient(180deg, #b09b88 0%, #9a8672 100%); }
  .tool-btn:active {
    transform: scale(0.92);
    box-shadow: 0 1px 4px rgba(120,100,80,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .tool-btn.dim { opacity: 0.4; }

  #btn-sound { top: calc(14px + env(safe-area-inset-top)); right: calc(70px + env(safe-area-inset-right)); }
  #btn-full  { top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); }

  /* ============================================
     HUD 分数面板（左上角，与右上角工具按钮永不重叠）
     ============================================ */
  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    display: flex;
    gap: 10px;
    z-index: 800;
    pointer-events: none;
  }
  .score-box {
    position: relative;
    background: linear-gradient(180deg, #a5907e 0%, #8f7a66 100%);
    color: #f9f6f2;
    border-radius: 12px;
    padding: 8px 18px 9px;
    text-align: center;
    min-width: 92px;
    box-shadow: 0 3px 10px rgba(120,100,80,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .score-box .label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #eee4da;
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .score-box .value {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    font-variant-numeric: tabular-nums;
  }

  /* ============================================
     撤销按钮（底部居中，视觉升级）
     ============================================ */
  #btn-undo {
    position: fixed;
    bottom: calc(22px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #a5907e 0%, #8f7a66 100%);
    color: #f9f6f2;
    border: none;
    border-radius: 26px;
    padding: 12px 30px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 700;
    box-shadow: 0 4px 16px rgba(120,100,80,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.1s, background 0.15s, opacity 0.2s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #btn-undo:hover { background: linear-gradient(180deg, #b09b88 0%, #9a8672 100%); }
  #btn-undo:active {
    transform: translateX(-50%) scale(0.95);
    box-shadow: 0 2px 6px rgba(120,100,80,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  #btn-undo.disabled {
    opacity: 0.35;
    pointer-events: none;
  }
  #btn-undo .icon { font-size: 18px; line-height: 1; }

  /* ============================================
     弹窗
     ============================================ */
  .overlay {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 8000; padding: 30px;
    gap: 16px; text-align: center;
    background: rgba(250, 248, 239, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay.show { display: flex; }
  .overlay .panel {
    background: #faf8ef;
    border-radius: 18px;
    padding: 32px 44px;
    box-shadow: 0 20px 60px rgba(120,100,80,0.25), 0 4px 12px rgba(120,100,80,0.15);
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    max-width: 90vw;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .overlay h1 {
    font-size: 44px; font-weight: 900;
    color: #776e65;
    letter-spacing: 2px;
  }
  .overlay h1.win { color: #edc22e; text-shadow: 0 2px 8px rgba(237,194,46,0.4); }
  .overlay p { font-size: 15px; color: #776e65; line-height: 1.8; }
  .overlay p b { color: #8f7a66; font-size: 22px; font-weight: 900; }

  .menu-btn {
    padding: 13px 40px; border-radius: 10px;
    border: none;
    background: linear-gradient(180deg, #a5907e 0%, #8f7a66 100%);
    color: #f9f6f2; font-family: inherit;
    font-size: 16px; letter-spacing: 1px; font-weight: bold;
    cursor: pointer; transition: all 0.15s;
    min-width: 180px;
    box-shadow: 0 4px 12px rgba(120,100,80,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .menu-btn:hover { background: linear-gradient(180deg, #b09b88 0%, #9a8672 100%); transform: translateY(-1px); }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn.primary {
    background: linear-gradient(180deg, #f0cc4d 0%, #edc22e 100%);
    color: #776e65;
    box-shadow: 0 4px 12px rgba(237,194,46,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .menu-btn.primary:hover { background: linear-gradient(180deg, #f5d566 0%, #f0c63a 100%); }
  .menu-btn.secondary {
    background: linear-gradient(180deg, #c8bab0 0%, #bbada0 100%);
    color: #776e65;
  }
  .menu-btn.secondary:hover { background: linear-gradient(180deg, #d4c8be 0%, #c8bab0 100%); }

  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* ============================================
     响应式适配
     ============================================ */
  @media (max-width: 520px) {
    .tool-btn { width: 42px; height: 42px; font-size: 18px; border-radius: 12px; }
    #btn-sound { right: calc(62px + env(safe-area-inset-right)); }
    #btn-full  { right: calc(12px + env(safe-area-inset-right)); }

    .score-box { padding: 6px 14px 7px; min-width: 78px; border-radius: 10px; }
    .score-box .label { font-size: 9px; letter-spacing: 1px; }
    .score-box .value { font-size: 18px; }

    #btn-undo { padding: 10px 24px; font-size: 14px; border-radius: 22px; }
    #btn-undo .icon { font-size: 16px; }

    .overlay h1 { font-size: 34px; }
    .menu-btn { padding: 11px 28px; font-size: 14px; min-width: 150px; }
    .overlay .panel { padding: 24px 26px; }
  }

  @media (max-width: 380px) {
    .tool-btn { width: 38px; height: 38px; font-size: 16px; border-radius: 10px; }
    #btn-sound { right: calc(56px + env(safe-area-inset-right)); }
    .score-box { padding: 5px 10px 6px; min-width: 68px; }
    .score-box .label { font-size: 8px; }
    .score-box .value { font-size: 16px; }
    #hud { gap: 6px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>

<!-- HUD：左上角 -->
<div id="hud">
  <div class="score-box">
    <div class="label">分数</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="score-box">
    <div class="label">最高</div>
    <div class="value" id="best">0</div>
  </div>
</div>

<!-- 撤销按钮：底部居中 -->
<button id="btn-undo" class="disabled">
  <span class="icon">↶</span>
  <span>撤销</span>
</button>

<!-- 工具按钮：右上角（与 HUD 永不重叠） -->
<button id="btn-sound" class="tool-btn">♪</button>
<button id="btn-full"  class="tool-btn">⛶</button>

<!-- 胜利 -->
<div id="screen-win" class="overlay">
  <div class="panel">
    <h1 class="win">🎉 2048 达成！</h1>
    <p>分数：<b id="win-score">0</b></p>
    <div class="btn-row">
      <button class="menu-btn primary" id="cmd-continue">继续挑战</button>
      <button class="menu-btn secondary" id="cmd-win-restart">重新开始</button>
    </div>
  </div>
</div>

<!-- 结束 -->
<div id="screen-over" class="overlay">
  <div class="panel">
    <h1>游戏结束</h1>
    <p>最终分数：<b id="over-score">0</b></p>
    <p>最大方块：<b id="over-max">0</b></p>
    <div class="btn-row">
      <button class="menu-btn primary" id="cmd-over-retry">再来一局</button>
      <button class="menu-btn secondary" id="cmd-over-undo">撤销一步</button>
    </div>
  </div>
</div>

<script>
'use strict';

const CFG = {
  SIZE: 4,
  TILE_GAP_RATIO: 0.055,
  PADDING_RATIO: 0.03,
  ANIM_MOVE: 0.14,
  ANIM_POP: 0.16,
  ANIM_MERGE: 0.18,
  SAVE_KEY: 'game2048_v2',
  WIN_VALUE: 2048,
};

const TILE_COLORS = {
  2:    { bg: '#eee4da', fg: '#776e65', font: 0.52 },
  4:    { bg: '#ede0c8', fg: '#776e65', font: 0.52 },
  8:    { bg: '#f2b179', fg: '#f9f6f2', font: 0.52 },
  16:   { bg: '#f59563', fg: '#f9f6f2', font: 0.52 },
  32:   { bg: '#f67c5f', fg: '#f9f6f2', font: 0.48 },
  64:   { bg: '#f65e3b', fg: '#f9f6f2', font: 0.48 },
  128:  { bg: '#edcf72', fg: '#f9f6f2', font: 0.42 },
  256:  { bg: '#edcc61', fg: '#f9f6f2', font: 0.42 },
  512:  { bg: '#edc850', fg: '#f9f6f2', font: 0.42 },
  1024: { bg: '#edc53f', fg: '#f9f6f2', font: 0.34 },
  2048: { bg: '#edc22e', fg: '#f9f6f2', font: 0.34 },
  4096: { bg: '#3c3a32', fg: '#f9f6f2', font: 0.34 },
  8192: { bg: '#2e2c26', fg: '#f9f6f2', font: 0.34 },
};
const BOARD_BG = '#bbada0';
const EMPTY_BG = 'rgba(238, 228, 218, 0.35)';

const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  easeOut: t => 1 - Math.pow(1 - t, 3),
  easeInOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
};

const Save = {
  data: { best: 0, soundOn: true },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
};

const Sound = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone({ freq, freq2, dur = 0.1, type = 'sine', vol = 0.3, delay = 0 }) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq2 || freq, t0);
      if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  move()   { this.tone({ freq: 220, freq2: 180, dur: 0.04, type: 'sine', vol: 0.15 }); },
  merge(v) {
    const idx = Math.log2(v) - 1;
    const base = 300 + Math.min(idx, 10) * 80;
    this.tone({ freq: base, freq2: base * 1.4, dur: 0.1, type: 'triangle', vol: 0.3 });
    this.tone({ freq: base * 1.6, dur: 0.08, type: 'triangle', vol: 0.2, delay: 0.05 });
  },
  spawn()  { this.tone({ freq: 500, freq2: 700, dur: 0.06, type: 'sine', vol: 0.16 }); },
  win()    { [523, 659, 784, 1047, 1319].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.14, type: 'triangle', vol: 0.35, delay: i * 0.1 })); },
  over()   { [392, 349, 294, 262, 196].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.2, type: 'sawtooth', vol: 0.3, delay: i * 0.14 })); },
  undo()   { this.tone({ freq: 600, freq2: 400, dur: 0.1, type: 'sine', vol: 0.2 }); },
};

let tileIdCounter = 0;

class Tile {
  constructor(x, y, value, isNew = false) {
    this.id = ++tileIdCounter;
    this.x = x; this.y = y;
    this.value = value;
    this.prevX = x; this.prevY = y;
    this.isNew = isNew;
    this.mergedFrom = null;
    this.popTimer = isNew ? CFG.ANIM_POP : 0;
    this.mergeTimer = 0;
    this.removed = false;
    this.removeTimer = 0;
  }
}

const Game = {
  canvas: null, ctx: null,
  size: CFG.SIZE,
  grid: [],
  tiles: [],
  score: 0,
  best: 0,
  state: 'playing',
  won: false,
  keepPlaying: false,
  history: [],
  cellSize: 0, gap: 0, pad: 0, originX: 0, originY: 0, canvasSize: 0,
  moveTimer: 0,
  moveDuration: CFG.ANIM_MOVE,
  moveData: null,
  scoreFloats: [],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    this.best = Save.data.best;
    this.updateScoreUI();
    this.bindInput();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    this.start();
    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('btn-full').addEventListener('click', e => { e.preventDefault(); this.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', e => { e.preventDefault(); this.toggleSound(); });
    $('btn-undo').addEventListener('click', e => { e.preventDefault(); this.undo(); });

    $('cmd-continue').addEventListener('click', () => {
      this.keepPlaying = true;
      this.state = 'playing';
      UI.hide('screen-win');
    });
    $('cmd-win-restart').addEventListener('click', () => { UI.hide('screen-win'); this.start(); });
    $('cmd-over-retry').addEventListener('click', () => { UI.hide('screen-over'); this.start(); });
    $('cmd-over-undo').addEventListener('click', () => { UI.hide('screen-over'); this.undo(); });
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.updateFsIcon(); setTimeout(() => this.resize(), 150); }));
    this.updateFsIcon();
  },

  bindInput() {
    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
      Sound.init(); Sound.resume();
      if (e.code === 'KeyF') this.toggleFullscreen();
      if (e.code === 'KeyM') this.toggleSound();
      if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey)) { this.undo(); return; }
      if (this.state !== 'playing' || this.moveTimer > 0) return;
      let dir = null;
      if (e.code === 'ArrowLeft'  || e.code === 'KeyA') dir = 'left';
      if (e.code === 'ArrowRight' || e.code === 'KeyD') dir = 'right';
      if (e.code === 'ArrowUp'    || e.code === 'KeyW') dir = 'up';
      if (e.code === 'ArrowDown'  || e.code === 'KeyS') dir = 'down';
      if (dir) this.move(dir);
    });

    const c = this.canvas;
    let tx = 0, ty = 0, tActive = false;
    const THRESHOLD = 24;
    c.addEventListener('touchstart', e => {
      e.preventDefault(); Sound.init(); Sound.resume();
      const t = e.touches[0];
      tx = t.clientX; ty = t.clientY; tActive = true;
    }, { passive: false });
    c.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!tActive || this.state !== 'playing' || this.moveTimer > 0) return;
      const t = e.touches[0];
      const dx = t.clientX - tx;
      const dy = t.clientY - ty;
      if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      this.move(dir);
      tActive = false;
    }, { passive: false });
    c.addEventListener('touchend', () => { tActive = false; });

    let mx = 0, my = 0, mActive = false;
    c.addEventListener('mousedown', e => {
      Sound.init(); Sound.resume();
      mx = e.clientX; my = e.clientY; mActive = true;
    });
    window.addEventListener('mousemove', e => {
      if (!mActive || this.state !== 'playing' || this.moveTimer > 0) return;
      const dx = e.clientX - mx;
      const dy = e.clientY - my;
      if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
      let dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      this.move(dir);
      mActive = false;
    });
    window.addEventListener('mouseup', () => { mActive = false; });
  },

  resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // 顶部 HUD + 底部撤销按钮预留空间
    const topReserve = 90;
    const bottomReserve = 110;
    const maxW = Math.min(vw - 40, 560);
    const maxH = Math.min(vh - topReserve - bottomReserve, 560);
    const size = Math.floor(Math.min(maxW, maxH));
    const dpr = window.devicePixelRatio || 1;
    this.canvasSize = size;
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    this.canvas.width = size * dpr;
    this.canvas.height = size * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    this.pad = size * CFG.PADDING_RATIO;
    this.gap = size * CFG.TILE_GAP_RATIO;
    const inner = size - this.pad * 2 - this.gap * (this.size - 1);
    this.cellSize = inner / this.size;
    this.originX = this.pad;
    this.originY = this.pad;
  },

  cellX(x) { return this.originX + x * (this.cellSize + this.gap); },
  cellY(y) { return this.originY + y * (this.cellSize + this.gap); },

  start() {
    this.grid = [];
    for (let y = 0; y < this.size; y++) {
      this.grid[y] = [];
      for (let x = 0; x < this.size; x++) this.grid[y][x] = null;
    }
    this.tiles = [];
    this.score = 0;
    this.won = false;
    this.keepPlaying = false;
    this.history = [];
    this.state = 'playing';
    this.moveTimer = 0;
    this.moveData = null;
    this.scoreFloats = [];
    this.addRandomTile();
    this.addRandomTile();
    this.updateScoreUI();
    this.updateUndoUI();
    UI.hideAll();
  },

  addRandomTile() {
    const empty = [];
    for (let y = 0; y < this.size; y++)
      for (let x = 0; x < this.size; x++)
        if (!this.grid[y][x]) empty.push({ x, y });
    if (empty.length === 0) return;
    const spot = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = new Tile(spot.x, spot.y, value, true);
    this.grid[spot.y][spot.x] = tile;
    this.tiles.push(tile);
    Sound.spawn();
  },

  move(direction) {
    if (this.state !== 'playing') return;
    if (this.moveTimer > 0) return;

    const snapshot = this.snapshot();
    const startScore = this.score;

    for (const t of this.tiles) {
      t.prevX = t.x;
      t.prevY = t.y;
      t.isNew = false;
      t.mergedFrom = null;
      t.popTimer = 0;
      t.mergeTimer = 0;
    }
    this.tiles = this.tiles.filter(t => !t.removed);
    for (const t of this.tiles) t.removed = false;

    const moved = this.slideAndMerge(direction);
    if (!moved) return;

    this.history.push({ snapshot, score: startScore });
    if (this.history.length > 50) this.history.shift();

    this.moveTimer = this.moveDuration;
    this.moveData = { direction };

    const gained = this.score - startScore;
    if (gained > 0) {
      this.scoreFloats.push({
        text: '+' + gained,
        x: this.canvasSize / 2 + (Math.random() - 0.5) * 40,
        y: this.canvasSize * 0.35,
        life: 50,
      });
    }

    if (!this.won) {
      for (const t of this.tiles) {
        if (t.value >= CFG.WIN_VALUE) {
          this.won = true;
          setTimeout(() => this.onWin(), 250);
          return;
        }
      }
    }

    setTimeout(() => {
      if (this.state !== 'playing') return;
      this.tiles = this.tiles.filter(t => !t.removed);
      for (const t of this.tiles) t.mergedFrom = null;
      this.addRandomTile();
      if (!this.hasMoves()) {
        this.state = 'over';
        Sound.over();
        UI.setOver(this.score, this.maxTileValue());
        setTimeout(() => UI.show('screen-over'), 200);
      }
      this.updateUndoUI();
    }, this.moveDuration * 1000 + 20);

    this.updateScoreUI();
    this.updateUndoUI();
    Sound.move();
  },

  slideAndMerge(direction) {
    const size = this.size;
    let moved = false;

    for (let line = 0; line < size; line++) {
      const lineTiles = [];
      for (let i = 0; i < size; i++) {
        let x, y;
        if (direction === 'left' || direction === 'right') { x = i; y = line; }
        else { x = line; y = i; }
        const t = this.grid[y][x];
        if (t) {
          t.prevX = t.x;
          t.prevY = t.y;
          lineTiles.push(t);
        }
      }

      const forward = (direction === 'left' || direction === 'up') ? 1 : -1;
      lineTiles.sort((a, b) => {
        const av = (direction === 'left' || direction === 'right') ? a.x : a.y;
        const bv = (direction === 'left' || direction === 'right') ? b.x : b.y;
        return (av - bv) * forward;
      });

      const result = [];
      let writeIdx = 0;

      for (let i = 0; i < lineTiles.length; i++) {
        const t = lineTiles[i];
        const next = lineTiles[i + 1];

        if (next && next.value === t.value && !t.mergedFrom && !next.mergedFrom) {
          const newValue = t.value * 2;
          const newTile = new Tile(0, 0, newValue, false);
          const targetPos = this.mergedPosition(t, next, direction);
          newTile.x = targetPos.x;
          newTile.y = targetPos.y;
          newTile.prevX = targetPos.x;
          newTile.prevY = targetPos.y;
          newTile.mergedFrom = [t, next];
          newTile.mergeTimer = CFG.ANIM_MERGE;

          t.removed = true;
          next.removed = true;
          t.removeTimer = CFG.ANIM_MOVE;
          next.removeTimer = CFG.ANIM_MOVE;

          this.setPos(newTile, writeIdx, line, direction);
          result.push(newTile);
          this.score += newValue;
          Sound.merge(newValue);
          this.addTileNoGrid(newTile);

          i++;
          writeIdx++;
          moved = true;
        } else {
          const before = { x: t.x, y: t.y };
          this.setPos(t, writeIdx, line, direction);
          if (t.x !== before.x || t.y !== before.y) moved = true;
          result.push(t);
          writeIdx++;
        }
      }

      for (let i = 0; i < size; i++) {
        let x, y;
        if (direction === 'left' || direction === 'right') { x = i; y = line; }
        else { x = line; y = i; }
        this.grid[y][x] = null;
      }
      for (const t of result) this.grid[t.y][t.x] = t;
    }
    return moved;
  },

  addTileNoGrid(tile) { this.tiles.push(tile); },

  setPos(tile, idx, line, direction) {
    if (direction === 'left')       { tile.x = idx;  tile.y = line; }
    else if (direction === 'right') { tile.x = this.size - 1 - idx; tile.y = line; }
    else if (direction === 'up')    { tile.x = line; tile.y = idx; }
    else if (direction === 'down')  { tile.x = line; tile.y = this.size - 1 - idx; }
  },

  mergedPosition(a, b, direction) {
    if (direction === 'left')  return a.x < b.x ? { x: a.x, y: a.y } : { x: b.x, y: b.y };
    if (direction === 'right') return a.x > b.x ? { x: a.x, y: a.y } : { x: b.x, y: b.y };
    if (direction === 'up')    return a.y < b.y ? { x: a.x, y: a.y } : { x: b.x, y: b.y };
    if (direction === 'down')  return a.y > b.y ? { x: a.x, y: a.y } : { x: b.x, y: b.y };
    return { x: a.x, y: a.y };
  },

  hasMoves() {
    for (let y = 0; y < this.size; y++)
      for (let x = 0; x < this.size; x++)
        if (!this.grid[y][x]) return true;
    for (let y = 0; y < this.size; y++)
      for (let x = 0; x < this.size; x++) {
        const t = this.grid[y][x];
        if (!t) continue;
        if (x + 1 < this.size && this.grid[y][x+1] && this.grid[y][x+1].value === t.value) return true;
        if (y + 1 < this.size && this.grid[y+1][x] && this.grid[y+1][x].value === t.value) return true;
      }
    return false;
  },

  maxTileValue() {
    let max = 0;
    for (const t of this.tiles) if (t.value > max) max = t.value;
    return max;
  },

  snapshot() {
    const grid = [];
    for (let y = 0; y < this.size; y++) {
      grid[y] = [];
      for (let x = 0; x < this.size; x++) {
        const t = this.grid[y][x];
        grid[y][x] = t ? t.value : 0;
      }
    }
    return grid;
  },

  undo() {
    if (this.history.length === 0) return;
    if (this.moveTimer > 0) return;
    const last = this.history.pop();
    const snap = last.snapshot;
    this.grid = [];
    this.tiles = [];
    for (let y = 0; y < this.size; y++) {
      this.grid[y] = [];
      for (let x = 0; x < this.size; x++) {
        const v = snap[y][x];
        if (v) {
          const t = new Tile(x, y, v, false);
          t.popTimer = 0;
          this.grid[y][x] = t;
          this.tiles.push(t);
        } else {
          this.grid[y][x] = null;
        }
      }
    }
    this.score = last.score;
    this.state = 'playing';
    this.moveTimer = 0;
    this.moveData = null;
    this.updateScoreUI();
    this.updateUndoUI();
    Sound.undo();
    UI.hideAll();
  },

  onWin() {
    this.state = 'won';
    Sound.win();
    UI.setWin(this.score);
    UI.show('screen-win');
  },

  updateScoreUI() {
    const s = document.getElementById('score');
    const b = document.getElementById('best');
    s.textContent = this.score;
    if (this.score > this.best) {
      this.best = this.score;
      Save.data.best = this.best;
      Save.save();
    }
    b.textContent = this.best;
  },

  updateUndoUI() {
    const btn = document.getElementById('btn-undo');
    if (this.history.length > 0) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.enabled = Save.data.soundOn;
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (Sound.enabled) { Sound.init(); Sound.resume(); }
  },

  lastTime: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (dt > 0.1) dt = 0.1;

    if (this.moveTimer > 0) {
      this.moveTimer -= dt;
      if (this.moveTimer < 0) this.moveTimer = 0;
    }
    for (const t of this.tiles) {
      if (t.popTimer > 0) t.popTimer -= dt;
      if (t.mergeTimer > 0) t.mergeTimer -= dt;
      if (t.removeTimer > 0) t.removeTimer -= dt;
    }
    for (let i = this.scoreFloats.length - 1; i >= 0; i--) {
      const f = this.scoreFloats[i];
      f.y -= 0.8;
      f.life--;
      if (f.life <= 0) this.scoreFloats.splice(i, 1);
    }
    this.render();
  },

  render() {
    const ctx = this.ctx;
    const size = this.canvasSize;

    ctx.fillStyle = BOARD_BG;
    this.roundRect(0, 0, size, size, 14);
    ctx.fill();

    for (let y = 0; y < this.size; y++) {
      for (let x = 0; x < this.size; x++) {
        ctx.fillStyle = EMPTY_BG;
        this.roundRect(this.cellX(x), this.cellY(y), this.cellSize, this.cellSize, 8);
        ctx.fill();
      }
    }

    const moveT = this.moveTimer > 0 ? 1 - this.moveTimer / this.moveDuration : 1;
    const easeT = U.easeInOut(Math.min(1, moveT));

    for (const t of this.tiles) {
      if (t.removed) {
        const alpha = Math.max(0, 1 - moveT * 1.4);
        if (alpha > 0.02) this.drawTileAt(t.x, t.y, t.value, alpha, 1);
      }
    }

    for (const t of this.tiles) {
      if (t.removed) continue;
      let dx = t.x, dy = t.y;
      if (this.moveTimer > 0 && (t.prevX !== t.x || t.prevY !== t.y)) {
        dx = U.lerp(t.prevX, t.x, easeT);
        dy = U.lerp(t.prevY, t.y, easeT);
      }
      let scale = 1;
      if (t.popTimer > 0) {
        const p = 1 - t.popTimer / CFG.ANIM_POP;
        scale = U.easeOut(p);
        scale = 0.4 + scale * 0.6;
      }
      if (t.mergeTimer > 0) {
        const p = 1 - t.mergeTimer / CFG.ANIM_MERGE;
        scale = 1 + Math.sin(p * Math.PI) * 0.18;
      }
      this.drawTileAt(dx, dy, t.value, 1, scale);
    }

    for (const f of this.scoreFloats) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.life / 25);
      ctx.font = 'bold 20px "Clear Sans", Arial, sans-serif';
      ctx.fillStyle = '#776e65';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  },

  drawTileAt(gx, gy, value, alpha = 1, scale = 1) {
    const ctx = this.ctx;
    const x = this.cellX(gx);
    const y = this.cellY(gy);
    const s = this.cellSize;

    ctx.save();
    ctx.globalAlpha = alpha;
    if (scale !== 1) {
      ctx.translate(x + s / 2, y + s / 2);
      ctx.scale(scale, scale);
      ctx.translate(-(x + s / 2), -(y + s / 2));
    }

    const def = TILE_COLORS[value] || TILE_COLORS[8192];

    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    this.roundRect(x + 2, y + 3, s, s, 8);
    ctx.fill();

    ctx.fillStyle = def.bg;
    this.roundRect(x, y, s, s, 8);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    this.roundRect(x + 0.5, y + 0.5, s - 1, s - 1, 8);
    ctx.stroke();

    const fontSize = Math.max(14, s * def.font);
    ctx.font = `900 ${fontSize}px "Clear Sans", "Helvetica Neue", Arial, sans-serif`;
    ctx.fillStyle = def.fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(value), x + s / 2, y + s / 2 + fontSize * 0.02);

    ctx.restore();
  },

  roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    if (w < r * 2) r = w / 2;
    if (h < r * 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
};

const UI = {
  show(id) { document.getElementById(id).classList.add('show'); },
  hide(id) { document.getElementById(id).classList.remove('show'); },
  hideAll() { ['screen-win','screen-over'].forEach(id => this.hide(id)); },
  setWin(score) { document.getElementById('win-score').textContent = score; },
  setOver(score, maxTile) {
    document.getElementById('over-score').textContent = score;
    document.getElementById('over-max').textContent = maxTile;
  },
};

window.addEventListener('DOMContentLoaded', () => {
  Game.init();
  document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
  document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
});
</script>
</body>
