<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>连连看 · 水果消消乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #game {
    display: block; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #0a0a1a;
  }
  .tool-btn {
    position: fixed; width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5); color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 900;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tool-btn:active { transform: scale(0.9); }
  .tool-btn.dim { opacity: 0.4; }
  #btn-full  { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
  #btn-sound { top: calc(10px + env(safe-area-inset-top)); right: calc(64px + env(safe-area-inset-right)); }
  #btn-pause { top: calc(10px + env(safe-area-inset-top)); right: calc(118px + env(safe-area-inset-right)); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,26,0.94);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 8000; color: #fff; padding: 30px;
    gap: 14px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 56px; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffe066 0%, #ff8c42 50%, #e74c3c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(255,140,66,0.5);
    font-weight: 900;
  }
  .overlay h2 { font-size: 30px; color: #ffe066; letter-spacing: 3px; }
  .overlay p { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.8; }

  .menu-btn {
    padding: 13px 40px; border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.08);
    color: #fff; font-family: inherit;
    font-size: 16px; letter-spacing: 2px;
    cursor: pointer; transition: all 0.15s;
    min-width: 220px;
    font-weight: bold;
  }
  .menu-btn:hover, .menu-btn:active { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn.primary {
    background: linear-gradient(135deg, #ff8c42, #e74c3c);
    color: #fff; border-color: #ff8c42;
    box-shadow: 0 4px 20px rgba(231,76,60,0.4);
  }
  .menu-btn.primary:hover { box-shadow: 0 6px 26px rgba(231,76,60,0.6); }

  .stats {
    display: flex; gap: 30px; margin: 8px 0;
  }
  .stats > div {
    display: flex; flex-direction: column; gap: 4px;
  }
  .stats .label { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
  .stats .value { font-size: 26px; font-weight: bold; color: #ffe066; }

  .how-to {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 22px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    line-height: 1.9;
    max-width: 380px;
  }
  .how-to b { color: #ffe066; }

  @media (max-width: 500px) {
    .overlay h1 { font-size: 40px; letter-spacing: 4px; }
    .menu-btn { padding: 11px 30px; font-size: 14px; min-width: 180px; }
    .stats .value { font-size: 20px; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>

<button id="btn-pause" class="tool-btn">⏸</button>
<button id="btn-sound" class="tool-btn">♪</button>
<button id="btn-full"  class="tool-btn">⛶</button>

<!-- 主菜单 -->
<div id="screen-main" class="overlay show">
  <h1>连连看</h1>
  <h2>水 果 消 消 乐</h2>
  <div class="how-to">
    <b>玩法</b>：点击两个相同的水果<br>
    它们之间用 <b>最多 2 个拐角</b> 的线相连即可消除<br>
    限时内清空全部方块即通关
  </div>
  <button class="menu-btn primary" id="cmd-start">开 始 游 戏</button>
  <button class="menu-btn" id="cmd-settings">设 置</button>
  <p style="margin-top:16px">最高分：<span id="ui-highscore">0</span></p>
</div>

<!-- 设置 -->
<div id="screen-settings" class="overlay">
  <h2>设 置</h2>
  <div class="how-to" style="text-align:left;">
    <b>音效音量</b>
    <input type="range" id="set-volume" min="0" max="100" value="30" style="width:100%;accent-color:#ff8c42;margin-top:6px;">
  </div>
  <button class="menu-btn primary" id="cmd-settings-back">保 存 并 返 回</button>
</div>

<!-- 暂停 -->
<div id="screen-pause" class="overlay">
  <h2>暂 停</h2>
  <button class="menu-btn primary" id="cmd-resume">继 续 游 戏</button>
  <button class="menu-btn" id="cmd-restart">重 新 开 始</button>
  <button class="menu-btn" id="cmd-to-menu">返 回 菜 单</button>
</div>

<!-- 通关 -->
<div id="screen-win" class="overlay">
  <h1>通 关 ！</h1>
  <div class="stats">
    <div><span class="label">关卡</span><span class="value" id="ui-win-level">1</span></div>
    <div><span class="label">得分</span><span class="value" id="ui-win-score">0</span></div>
    <div><span class="label">剩余时间</span><span class="value" id="ui-win-time">0</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-next">下 一 关</button>
  <button class="menu-btn" id="cmd-win-menu">返 回 菜 单</button>
</div>

<!-- 失败 -->
<div id="screen-over" class="overlay">
  <h1 style="background:linear-gradient(180deg,#ff5252,#7a0000);-webkit-background-clip:text;background-clip:text;">时 间 到</h1>
  <div class="stats">
    <div><span class="label">关卡</span><span class="value" id="ui-over-level">1</span></div>
    <div><span class="label">得分</span><span class="value" id="ui-over-score">0</span></div>
  </div>
  <button class="menu-btn primary" id="cmd-over-retry">再 试 一 次</button>
  <button class="menu-btn" id="cmd-over-menu">返 回 菜 单</button>
</div>

<script>
'use strict';

/* ============================================================
 *  配置
 * ============================================================ */
const CFG = {
  W: 960, H: 600,
  COLS: 10, ROWS: 7,
  PAD_TOP: 70,
  PAD_BOTTOM: 90,
  PAD_X: 60,
  STEP: 1000 / 60,
  COMBO_WINDOW: 90,        // 连击窗口（帧）
  MATCH_ANIM: 18,          // 消除动画帧数
  HINT_COOLDOWN: 60,       // 提示冷却（帧）
  SAVE_KEY: 'linklink_v1',
};

const TILE_DEFS = [
  { emoji: '🍎', bg: '#e74c3c', dark: '#a02c1e' },
  { emoji: '🍊', bg: '#e67e22', dark: '#a04c0e' },
  { emoji: '🍋', bg: '#f1c40f', dark: '#a88a0a' },
  { emoji: '🍇', bg: '#9b59b6', dark: '#6a3d7e' },
  { emoji: '🍓', bg: '#e84393', dark: '#a02c64' },
  { emoji: '🍒', bg: '#c0392b', dark: '#7a2419' },
  { emoji: '🥝', bg: '#27ae60', dark: '#1a7440' },
  { emoji: '🍍', bg: '#f39c12', dark: '#a86e0a' },
  { emoji: '🍅', bg: '#d35400', dark: '#8a3800' },
  { emoji: '🌽', bg: '#f7dc6f', dark: '#a89a4a' },
  { emoji: '🥕', bg: '#e67e22', dark: '#a04c0e' },
  { emoji: '🍄', bg: '#e74c3c', dark: '#a02c1e' },
  { emoji: '🌰', bg: '#7f4f24', dark: '#4d3016' },
  { emoji: '🥥', bg: '#6d4c41', dark: '#3d2a24' },
  { emoji: '🍆', bg: '#8e44ad', dark: '#5e2d74' },
  { emoji: '🥦', bg: '#229954', dark: '#146536' },
];

/* ============================================================
 *  工具
 * ============================================================ */
const U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
};

/* ============================================================
 *  存档
 * ============================================================ */
const Save = {
  data: { highScore: 0, soundOn: true, volume: 0.30, maxLevel: 1 },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
  },
  save() {
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
};

/* ============================================================
 *  音效
 * ============================================================ */
const Sound = {
  ctx: null, master: null,
  enabled: true,

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = Save.data.volume;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setVolume(v) { if (this.master) this.master.gain.value = v; },

  tone({ freq, freq2, dur = 0.1, type = 'square', vol = 0.35, delay = 0 }) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq2 || freq, t0);
      if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(freq, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  },

  select()  { this.tone({ freq: 660, freq2: 880, dur: 0.06, type: 'sine', vol: 0.25 }); },
  match(c)  {
    const base = 523 + Math.min(c, 8) * 80;
    this.tone({ freq: base, dur: 0.08, type: 'triangle', vol: 0.35 });
    this.tone({ freq: base * 1.5, dur: 0.12, type: 'triangle', vol: 0.3, delay: 0.05 });
    this.tone({ freq: base * 2, dur: 0.14, type: 'triangle', vol: 0.25, delay: 0.10 });
  },
  error()   { this.tone({ freq: 180, freq2: 110, dur: 0.16, type: 'sawtooth', vol: 0.28 }); },
  hint()    { this.tone({ freq: 1200, dur: 0.07, type: 'sine', vol: 0.28 });
              this.tone({ freq: 1600, dur: 0.1, type: 'sine', vol: 0.24, delay: 0.07 }); },
  shuffle() { for (let i = 0; i < 6; i++)
                this.tone({ freq: 400 + i * 120, dur: 0.05, type: 'square', vol: 0.15, delay: i * 0.05 }); },
  win()     { [523, 659, 784, 1047, 1319].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.13, type: 'triangle', vol: 0.35, delay: i * 0.1 })); },
  lose()    { [400, 350, 300, 250, 200].forEach((f, i) =>
                this.tone({ freq: f, dur: 0.2, type: 'sawtooth', vol: 0.3, delay: i * 0.15 })); },
};

/* ============================================================
 *  连连看棋盘核心逻辑
 * ============================================================ */
class Board {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.grid = [];
    for (let y = 0; y < rows + 2; y++) {
      this.grid[y] = [];
      for (let x = 0; x < cols + 2; x++) this.grid[y][x] = null;
    }
  }

  isEmpty(x, y) {
    if (x < 0 || x > this.cols + 1 || y < 0 || y > this.rows + 1) return false;
    if (x === 0 || x === this.cols + 1 || y === 0 || y === this.rows + 1) return true;
    return this.grid[y][x] === null;
  }

  lineClear(x1, y1, x2, y2) {
    if (x1 === x2 && y1 === y2) return true;
    if (x1 === x2) {
      const a = Math.min(y1, y2), b = Math.max(y1, y2);
      for (let y = a + 1; y < b; y++) if (!this.isEmpty(x1, y)) return false;
      return true;
    }
    if (y1 === y2) {
      const a = Math.min(x1, x2), b = Math.max(x1, x2);
      for (let x = a + 1; x < b; x++) if (!this.isEmpty(x, y1)) return false;
      return true;
    }
    return false;
  }

  // 返回路径点数组（含起终点），无解返回 null
  findPath(x1, y1, x2, y2) {
    // 0 拐角
    if (this.lineClear(x1, y1, x2, y2)) {
      return [{x: x1, y: y1}, {x: x2, y: y2}];
    }
    // 1 拐角（拐点 (x1,y2)）
    if (this.isEmpty(x1, y2) &&
        this.lineClear(x1, y1, x1, y2) && this.lineClear(x1, y2, x2, y2)) {
      return [{x: x1, y: y1}, {x: x1, y: y2}, {x: x2, y: y2}];
    }
    // 1 拐角（拐点 (x2,y1)）
    if (this.isEmpty(x2, y1) &&
        this.lineClear(x1, y1, x2, y1) && this.lineClear(x2, y1, x2, y2)) {
      return [{x: x1, y: y1}, {x: x2, y: y1}, {x: x2, y: y2}];
    }
    // 2 拐角 —— 垂直扫描
    for (let x = 0; x <= this.cols + 1; x++) {
      if (x === x1 || x === x2) continue;
      if (this.isEmpty(x, y1) && this.isEmpty(x, y2) &&
          this.lineClear(x1, y1, x, y1) &&
          this.lineClear(x, y1, x, y2) &&
          this.lineClear(x, y2, x2, y2)) {
        return [{x: x1, y: y1}, {x, y: y1}, {x, y: y2}, {x: x2, y: y2}];
      }
    }
    // 2 拐角 —— 水平扫描
    for (let y = 0; y <= this.rows + 1; y++) {
      if (y === y1 || y === y2) continue;
      if (this.isEmpty(x1, y) && this.isEmpty(x2, y) &&
          this.lineClear(x1, y1, x1, y) &&
          this.lineClear(x1, y, x2, y) &&
          this.lineClear(x2, y, x2, y2)) {
        return [{x: x1, y: y1}, {x: x1, y}, {x: x2, y}, {x: x2, y: y2}];
      }
    }
    return null;
  }

  // 填充棋盘（图案种类数可指定）
  fill(kinds) {
    const total = this.cols * this.rows;
    const pairs = total / 2;
    const values = [];
    for (let i = 0; i < pairs; i++) {
      const k = U.randInt(0, kinds - 1);
      values.push(k, k);
    }
    // 洗牌
    for (let i = values.length - 1; i > 0; i--) {
      const j = U.randInt(0, i);
      [values[i], values[j]] = [values[j], values[i]];
    }
    let idx = 0;
    for (let y = 1; y <= this.rows; y++)
      for (let x = 1; x <= this.cols; x++)
        this.grid[y][x] = values[idx++];

    // 确保可解
    let safety = 0;
    while (!this.hasSolution() && safety++ < 60) this.shuffle(false);
    return this;
  }

  remaining() {
    let n = 0;
    for (let y = 1; y <= this.rows; y++)
      for (let x = 1; x <= this.cols; x++)
        if (this.grid[y][x] !== null) n++;
    return n;
  }

  // 是否还有可连接的配对
  hasSolution() {
    const tiles = this.allTiles();
    for (let i = 0; i < tiles.length; i++) {
      for (let j = i + 1; j < tiles.length; j++) {
        if (tiles[i].v === tiles[j].v) {
          if (this.findPath(tiles[i].x, tiles[i].y, tiles[j].x, tiles[j].y)) return true;
        }
      }
    }
    return false;
  }

  allTiles() {
    const t = [];
    for (let y = 1; y <= this.rows; y++)
      for (let x = 1; x <= this.cols; x++)
        if (this.grid[y][x] !== null) t.push({x, y, v: this.grid[y][x]});
    return t;
  }

  // 洗牌（返回是否有解）
  shuffle(needCheck = true) {
    const tiles = this.allTiles();
    const values = tiles.map(t => t.v);
    for (let i = values.length - 1; i > 0; i--) {
      const j = U.randInt(0, i);
      [values[i], values[j]] = [values[j], values[i]];
    }
    tiles.forEach((t, i) => { this.grid[t.y][t.x] = values[i]; });
    if (needCheck && !this.hasSolution()) {
      let safety = 0;
      while (!this.hasSolution() && safety++ < 100) {
        for (let i = values.length - 1; i > 0; i--) {
          const j = U.randInt(0, i);
          [values[i], values[j]] = [values[j], values[i]];
        }
        tiles.forEach((t, i) => { this.grid[t.y][t.x] = values[i]; });
      }
    }
    return this.hasSolution();
  }

  // 找一对可消除的
  findHint() {
    const tiles = this.allTiles();
    for (let i = 0; i < tiles.length; i++) {
      for (let j = i + 1; j < tiles.length; j++) {
        if (tiles[i].v === tiles[j].v) {
          const path = this.findPath(tiles[i].x, tiles[i].y, tiles[j].x, tiles[j].y);
          if (path) return { a: tiles[i], b: tiles[j], path };
        }
      }
    }
    return null;
  }
}

/* ============================================================
 *  游戏主控
 * ============================================================ */
const Game = {
  canvas: null, ctx: null,
  state: 'menu',
  tick: 0,

  board: null,
  selected: null,      // {x, y} 逻辑坐标
  matchPath: null,     // 当前要绘制的路径
  matchTimer: 0,
  hintPair: null,      // {a, b} 高亮
  hintTimer: 0,
  hintCd: 0,

  score: 0,
  level: 1,
  combo: 0,
  comboTimer: 0,
  timeLeft: 0,
  timeMax: 0,
  wrongFlash: 0,

  particles: [],
  floats: [],

  // 棋盘几何（运行时计算）
  layout: { tile: 0, boardX: 0, boardY: 0, boardW: 0, boardH: 0 },

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Save.load();
    Sound.enabled = Save.data.soundOn;
    UI.init();
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));

    this.canvas.addEventListener('mousedown', e => this.onPointer(e));
    this.canvas.addEventListener('touchstart', e => { e.preventDefault(); this.onPointer(e); }, { passive: false });

    window.addEventListener('keydown', e => {
      Sound.init(); Sound.resume();
      if (e.code === 'KeyP' || e.code === 'Escape') this.togglePause();
      if (e.code === 'KeyF') this.toggleFullscreen();
      if (e.code === 'KeyM') this.toggleSound();
      if (e.code === 'KeyH' && this.state === 'playing') this.useHint();
      if (e.code === 'KeyR' && this.state !== 'menu') this.startLevel(this.level);
    });

    requestAnimationFrame(t => this.loop(t));
  },

  bindUI() {
    const $ = id => document.getElementById(id);
    $('btn-full').addEventListener('click', e => { e.preventDefault(); this.toggleFullscreen(); });
    $('btn-sound').addEventListener('click', e => { e.preventDefault(); this.toggleSound(); });
    $('btn-pause').addEventListener('click', e => { e.preventDefault(); this.togglePause(); });

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
      .forEach(ev => document.addEventListener(ev, () => { this.updateFsIcon(); setTimeout(() => this.resize(), 150); }));
  },

  resize() {
    const ratio = CFG.W / CFG.H;
    const ww = window.innerWidth, wh = window.innerHeight;
    let w, h;
    if (ww / wh > ratio) { h = wh; w = h * ratio; }
    else { w = ww; h = w / ratio; }
    this.canvas.style.width = Math.round(w) + 'px';
    this.canvas.style.height = Math.round(h) + 'px';
    this.computeLayout();
  },

  computeLayout() {
    const availW = CFG.W - CFG.PAD_X * 2;
    const availH = CFG.H - CFG.PAD_TOP - CFG.PAD_BOTTOM;
    const tileW = Math.floor(availW / CFG.COLS);
    const tileH = Math.floor(availH / CFG.ROWS);
    const tile = Math.min(tileW, tileH);
    const boardW = tile * CFG.COLS;
    const boardH = tile * CFG.ROWS;
    const boardX = Math.round((CFG.W - boardW) / 2);
    const boardY = CFG.PAD_TOP + Math.round((availH - boardH) / 2);
    this.layout = { tile, boardX, boardY, boardW, boardH };
  },

  // 逻辑坐标 → 屏幕像素（中心点）
  tileCenter(x, y) {
    const L = this.layout;
    return {
      cx: L.boardX + (x - 1) * L.tile + L.tile / 2,
      cy: L.boardY + (y - 1) * L.tile + L.tile / 2,
    };
  },

  // 屏幕坐标 → 逻辑坐标
  pointerToTile(px, py) {
    const L = this.layout;
    const x = Math.floor((px - L.boardX) / L.tile) + 1;
    const y = Math.floor((py - L.boardY) / L.tile) + 1;
    if (x < 1 || x > CFG.COLS || y < 1 || y > CFG.ROWS) return null;
    return { x, y };
  },

  getCanvasCoords(e) {
    const rect = this.canvas.getBoundingClientRect();
    const clientX = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
    const clientY = (e.touches && e.touches.length) ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (CFG.W / rect.width),
      y: (clientY - rect.top) * (CFG.H / rect.height),
    };
  },

  onPointer(e) {
    Sound.init(); Sound.resume();
    if (this.state !== 'playing') return;
    const p = this.getCanvasCoords(e);
    const tile = this.pointerToTile(p.x, p.y);
    if (!tile) return;
    if (this.board.grid[tile.y][tile.x] === null) return;
    this.handleTileClick(tile.x, tile.y);
  },

  handleTileClick(x, y) {
    // 第一次选中
    if (!this.selected) {
      this.selected = { x, y };
      Sound.select();
      return;
    }
    // 点击同一个 → 取消
    if (this.selected.x === x && this.selected.y === y) {
      this.selected = null;
      return;
    }
    const a = this.selected, b = { x, y };
    const va = this.board.grid[a.y][a.x];
    const vb = this.board.grid[b.y][b.x];

    if (va !== vb) {
      this.selected = b;
      Sound.select();
      return;
    }

    const path = this.board.findPath(a.x, a.y, b.x, b.y);
    if (!path) {
      this.selected = b;
      this.wrongFlash = 10;
      Sound.error();
      return;
    }

    // 成功匹配
    this.board.grid[a.y][a.x] = null;
    this.board.grid[b.y][b.x] = null;
    this.matchPath = path;
    this.matchTimer = CFG.MATCH_ANIM;
    this.selected = null;
    this.hintPair = null;
    this.hintTimer = 0;

    // 连击
    if (this.comboTimer > 0) this.combo++;
    else this.combo = 1;
    this.comboTimer = CFG.COMBO_WINDOW;

    const points = 100 * this.combo;
    this.score += points;

    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    this.addFloat((mx - 1) * this.layout.tile + this.layout.boardX + this.layout.tile / 2,
                  (my - 1) * this.layout.tile + this.layout.boardY + this.layout.tile / 2,
                  '+' + points, this.combo);
    this.spawnParticles(a, b);
    Sound.match(this.combo);

    // 检查胜利
    if (this.board.remaining() === 0) {
      setTimeout(() => this.onWin(), 400);
    } else if (!this.board.hasSolution()) {
      // 无解自动洗牌
      setTimeout(() => {
        this.board.shuffle();
        this.addFloat(CFG.W / 2, CFG.H / 2, '自动洗牌', 0);
        Sound.shuffle();
      }, 500);
    }
  },

  spawnParticles(a, b) {
    for (const t of [a, b]) {
      const c = this.tileCenter(t.x, t.y);
      const def = TILE_DEFS[this.board.grid[t.y] !== null ? this.board.grid[t.y] : 0];
      for (let i = 0; i < 8; i++) {
        const ang = Math.random() * 6.284;
        const sp = U.rand(2, 5);
        this.particles.push({
          x: c.cx, y: c.cy,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.5,
          life: U.rand(28, 45),
          color: def ? def.bg : '#ffe066',
          size: U.rand(4, 7),
        });
      }
    }
  },

  addFloat(x, y, text, combo) {
    this.floats.push({ x, y, text, life: 60, combo });
  },

  /* ---------- 关卡流程 ---------- */
  startLevel(level) {
    Sound.init(); Sound.resume();
    this.level = level;
    this.score = this.score || 0;
    if (level === 1) this.score = 0;

    // 难度配置
    const kinds = U.clamp(6 + level * 2, 6, TILE_DEFS.length);
    const time  = Math.max(60, 130 - (level - 1) * 15);

    this.board = new Board(CFG.COLS, CFG.ROWS);
    this.board.fill(kinds);
    this.selected = null;
    this.matchPath = null;
    this.matchTimer = 0;
    this.hintPair = null;
    this.hintTimer = 0;
    this.hintCd = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.timeMax = time;
    this.timeLeft = time;
    this.particles = [];
    this.floats = [];
    this.state = 'playing';
    UI.hideAll();
  },

  onWin() {
    this.state = 'win';
    Sound.win();
    this.score += Math.floor(this.timeLeft) * 10;
    Save.data.highScore = Math.max(Save.data.highScore, this.score);
    Save.data.maxLevel = Math.max(Save.data.maxLevel, this.level + 1);
    Save.save();
    UI.setWin(this.level, this.score, Math.floor(this.timeLeft));
    UI.show('screen-win');
  },

  onLose() {
    this.state = 'over';
    Sound.lose();
    Save.data.highScore = Math.max(Save.data.highScore, this.score);
    Save.save();
    UI.setOver(this.level, this.score);
    UI.show('screen-over');
  },

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      UI.show('screen-pause');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      UI.hide('screen-pause');
    }
  },

  useHint() {
    if (this.hintCd > 0) return;
    if (this.state !== 'playing') return;
    const h = this.board.findHint();
    if (h) {
      this.hintPair = h;
      this.hintTimer = 100;
      this.hintCd = CFG.HINT_COOLDOWN;
      Sound.hint();
    }
  },

  useShuffle() {
    if (this.state !== 'playing') return;
    this.board.shuffle();
    this.selected = null;
    this.hintPair = null;
    Sound.shuffle();
    this.addFloat(CFG.W / 2, CFG.H / 2, '洗牌', 0);
  },

  isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  },
  async toggleFullscreen() {
    try {
      if (!this.isFullscreen()) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                    el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) await req.call(el);
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) await ex.call(document);
      }
    } catch (e) {}
    this.updateFsIcon();
    setTimeout(() => this.resize(), 150);
  },
  updateFsIcon() {
    const btn = document.getElementById('btn-full');
    const full = this.isFullscreen();
    btn.textContent = full ? '✕' : '⛶';
    btn.classList.toggle('dim', full);
  },
  toggleSound() {
    Save.data.soundOn = !Save.data.soundOn;
    Sound.enabled = Save.data.soundOn;
    Save.save();
    document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
    document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
    if (Sound.enabled) { Sound.init(); Sound.resume(); }
  },

  /* ---------- 主循环 ---------- */
  lastTime: 0, accumulator: 0,
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    if (!this.lastTime) this.lastTime = now;
    let delta = now - this.lastTime;
    this.lastTime = now;
    if (delta > 120) delta = 120;
    this.accumulator += delta;
    let guard = 0;
    while (this.accumulator >= CFG.STEP && guard < 6) {
      this.update();
      this.accumulator -= CFG.STEP;
      guard++;
    }
    if (guard >= 6) this.accumulator = 0;
    this.render();
  },

  update() {
    this.tick++;

    if (this.state === 'playing') {
      // 倒计时
      this.timeLeft -= 1 / 60;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.onLose(); return; }

      if (this.comboTimer > 0) this.comboTimer--;
      if (this.hintCd > 0) this.hintCd--;
      if (this.wrongFlash > 0) this.wrongFlash--;
      if (this.hintTimer > 0) {
        this.hintTimer--;
        if (this.hintTimer === 0) this.hintPair = null;
      }
      if (this.matchTimer > 0) this.matchTimer--;
      if (this.matchTimer === 0) this.matchPath = null;
    }

    // 粒子 & 飘字（始终更新）
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 1.2; f.life--;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
  },

  /* ---------- 渲染 ---------- */
  render() {
    const ctx = this.ctx;
    // 深色背景
    const bg = ctx.createRadialGradient(CFG.W / 2, CFG.H / 2, 100, CFG.W / 2, CFG.H / 2, 700);
    bg.addColorStop(0, '#1a1a3e');
    bg.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    if (this.state === 'menu') return;

    this.renderBoardBg();
    this.renderTiles();
    this.renderPath();
    this.renderParticles();
    this.renderFloats();
    this.renderHUD();
    this.renderToolbar();
  },

  renderBoardBg() {
    const ctx = this.ctx;
    const L = this.layout;
    // 棋盘外框
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    this.roundRect(L.boardX - 8, L.boardY - 8, L.boardW + 16, L.boardH + 16, 16);
    ctx.fill();

    // 棋盘底纹
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    this.roundRect(L.boardX, L.boardY, L.boardW, L.boardH, 8);
    ctx.fill();
  },

  renderTiles() {
    const ctx = this.ctx;
    const L = this.layout;
    const emojiFont = `${Math.round(L.tile * 0.55)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;

    for (let y = 1; y <= CFG.ROWS; y++) {
      for (let x = 1; x <= CFG.COLS; x++) {
        const v = this.board.grid[y][x];
        if (v === null) continue;

        const def = TILE_DEFS[v % TILE_DEFS.length];
        const px = L.boardX + (x - 1) * L.tile;
        const py = L.boardY + (y - 1) * L.tile;
        const pad = Math.max(2, Math.round(L.tile * 0.06));
        const size = L.tile - pad * 2;

        // 选中
        const isSel = this.selected && this.selected.x === x && this.selected.y === y;
        // 提示高亮
        const isHint = this.hintPair &&
          ((this.hintPair.a.x === x && this.hintPair.a.y === y) ||
           (this.hintPair.b.x === x && this.hintPair.b.y === y));
        // 错误闪烁
        const isWrong = this.wrongFlash > 0 && isSel;

        // 悬停缩放
        let scale = 1;
        if (isSel) scale = 1.08;
        else if (isHint) scale = 1.06 + Math.sin(this.tick * 0.3) * 0.05;

        ctx.save();
        ctx.translate(px + L.tile / 2, py + L.tile / 2);
        ctx.scale(scale, scale);
        ctx.translate(-L.tile / 2, -L.tile / 2);

        // 阴影
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        this.roundRect(pad + 2, pad + 4, size, size, 8);
        ctx.fill();

        // 方块背景渐变
        const grad = ctx.createLinearGradient(pad, pad, pad, pad + size);
        grad.addColorStop(0, def.bg);
        grad.addColorStop(1, def.dark);
        ctx.fillStyle = grad;
        this.roundRect(pad, pad, size, size, 8);
        ctx.fill();

        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        this.roundRect(pad + 3, pad + 3, size - 6, size * 0.35, 6);
        ctx.fill();

        // 选中/提示 描边
        if (isWrong) {
          ctx.strokeStyle = '#ff5252';
          ctx.lineWidth = 3;
          this.roundRect(pad - 1, pad - 1, size + 2, size + 2, 9);
          ctx.stroke();
        } else if (isSel) {
          ctx.strokeStyle = '#ffe066';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#ffe066';
          ctx.shadowBlur = 12;
          this.roundRect(pad - 1, pad - 1, size + 2, size + 2, 9);
          ctx.stroke();
          ctx.shadowBlur = 0;
        } else if (isHint) {
          ctx.strokeStyle = '#8ef58e';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#8ef58e';
          ctx.shadowBlur = 10;
          this.roundRect(pad - 1, pad - 1, size + 2, size + 2, 9);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // emoji
        ctx.font = emojiFont;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000';
        ctx.fillText(def.emoji, L.tile / 2 + 1, L.tile / 2 + 2);
        ctx.fillStyle = '#fff';
        ctx.fillText(def.emoji, L.tile / 2, L.tile / 2);

        ctx.restore();
      }
    }
  },

  renderPath() {
    if (!this.matchPath || this.matchTimer <= 0) return;
    const ctx = this.ctx;
    const L = this.layout;
    const alpha = this.matchTimer / CFG.MATCH_ANIM;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 16;

    ctx.beginPath();
    for (let i = 0; i < this.matchPath.length; i++) {
      const p = this.matchPath[i];
      const cx = L.boardX + (p.x - 1) * L.tile + L.tile / 2;
      const cy = L.boardY + (p.y - 1) * L.tile + L.tile / 2;
      if (i === 0) ctx.moveTo(cx, cy);
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();

    // 端点圆点
    ctx.fillStyle = '#fff';
    for (const p of [this.matchPath[0], this.matchPath[this.matchPath.length - 1]]) {
      const cx = L.boardX + (p.x - 1) * L.tile + L.tile / 2;
      const cy = L.boardY + (p.y - 1) * L.tile + L.tile / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, 6.284);
      ctx.fill();
    }

    ctx.restore();
  },

  renderParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      ctx.globalAlpha = Math.min(1, p.life / 22);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  renderFloats() {
    const ctx = this.ctx;
    ctx.textAlign = 'center';
    for (const f of this.floats) {
      ctx.globalAlpha = Math.min(1, f.life / 30);
      const size = f.combo >= 3 ? 28 : 20;
      ctx.font = `bold ${size}px "Courier New", monospace`;
      ctx.fillStyle = '#000';
      ctx.fillText(f.text, f.x + 2, f.y + 2);
      ctx.fillStyle = f.combo >= 5 ? '#ff5252' : (f.combo >= 3 ? '#ff8c42' : '#ffe066');
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  },

  renderHUD() {
    const ctx = this.ctx;
    ctx.save();

    // 顶部渐变
    const g = ctx.createLinearGradient(0, 0, 0, 66);
    g.addColorStop(0, 'rgba(0,0,0,0.6)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, 66);

    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textBaseline = 'middle';

    // 关卡
    ctx.fillStyle = '#ffe066';
    ctx.fillText('第 ' + this.level + ' 关', 24, 30);

    // 分数
    ctx.fillStyle = '#fff';
    const scoreTxt = '分数 ' + String(this.score).padStart(6, '0');
    ctx.fillText(scoreTxt, 180, 30);

    // 连击（活跃时显示）
    if (this.comboTimer > 0 && this.combo >= 2) {
      const blink = Math.sin(this.tick * 0.3) * 0.3 + 0.7;
      ctx.globalAlpha = blink;
      ctx.fillStyle = '#ff5252';
      ctx.font = 'bold 22px "Courier New", monospace';
      ctx.fillText('×' + this.combo + ' COMBO', 400, 30);
      ctx.globalAlpha = 1;
    }

    // 剩余方块
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const rem = this.board ? this.board.remaining() : 0;
    ctx.fillText('剩余 ' + rem, CFG.W / 2 - 20, 30);

    // 时间条
    const timeRatio = this.timeLeft / this.timeMax;
    const barW = 240, barH = 14;
    const barX = CFG.W - barW - 30;
    const barY = 22;

    // 底框
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    this.roundRect(barX - 4, barY - 4, barW + 8, barH + 8, 10);
    ctx.fill();

    // 时间渐变
    const tg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    if (timeRatio > 0.5) { tg.addColorStop(0, '#27ae60'); tg.addColorStop(1, '#2ecc71'); }
    else if (timeRatio > 0.25) { tg.addColorStop(0, '#f39c12'); tg.addColorStop(1, '#f1c40f'); }
    else { tg.addColorStop(0, '#c0392b'); tg.addColorStop(1, '#e74c3c'); }
    ctx.fillStyle = tg;
    this.roundRect(barX, barY, barW * timeRatio, barH, 7);
    ctx.fill();

    // 时间数字
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = timeRatio < 0.25 ? '#ff5252' : '#fff';
    const sec = Math.ceil(this.timeLeft);
    ctx.fillText(sec + 's', CFG.W - 14, barY + barH / 2);
    ctx.textAlign = 'left';

    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  },

  renderToolbar() {
    const ctx = this.ctx;
    const cy = CFG.H - 44;

    const buttons = [
      { label: '💡 提示', x: CFG.W / 2 - 200, w: 140, action: 'hint',
        disabled: this.hintCd > 0, cd: this.hintCd / CFG.HINT_COOLDOWN },
      { label: '🔀 洗牌', x: CFG.W / 2 - 40, w: 140, action: 'shuffle' },
      { label: '⏸ 暂停', x: CFG.W / 2 + 120, w: 140, action: 'pause' },
    ];

    for (const b of buttons) {
      const x = b.x - b.w / 2;
      const y = cy - 24;
      const h = 48;

      // 底
      const grad = ctx.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, b.disabled ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.12)');
      grad.addColorStop(1, b.disabled ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.06)');
      ctx.fillStyle = grad;
      this.roundRect(x, y, b.w, h, 24);
      ctx.fill();

      // 边框
      ctx.strokeStyle = b.disabled ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      this.roundRect(x, y, b.w, h, 24);
      ctx.stroke();

      // 冷却遮罩
      if (b.disabled && b.cd > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        this.roundRect(x, y, b.w * (1 - b.cd), h, 24);
        ctx.fill();
      }

      // 文字
      ctx.font = 'bold 17px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = b.disabled ? 'rgba(255,255,255,0.35)' : '#fff';
      ctx.fillText(b.label, x + b.w / 2, y + h / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    // 保存按钮坐标，用于点击判定
    this._toolbarButtons = buttons.map(b => ({ ...b, x1: b.x - b.w / 2, y1: cy - 24, x2: b.x + b.w / 2, y2: cy + 24 }));
  },

  roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    if (w < r * 2) r = w / 2;
    if (h < r * 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
};

/* ============================================================
 *  菜单 UI
 * ============================================================ */
const UI = {
  init() {
    const $ = id => document.getElementById(id);

    $('cmd-start').addEventListener('click', () => {
      Sound.init(); Sound.resume();
      Game.startLevel(1);
    });

    $('cmd-settings').addEventListener('click', () => {
      this.loadSettings();
      this.hide('screen-main');
      this.show('screen-settings');
    });

    $('cmd-settings-back').addEventListener('click', () => {
      this.hide('screen-settings');
      this.show('screen-main');
      Save.save();
    });

    $('set-volume').addEventListener('input', e => {
      Save.data.volume = e.target.value / 100;
      Sound.setVolume(Save.data.volume);
    });

    // 暂停菜单
    $('cmd-resume').addEventListener('click', () => Game.togglePause());
    $('cmd-restart').addEventListener('click', () => {
      this.hide('screen-pause');
      Game.startLevel(Game.level);
    });
    $('cmd-to-menu').addEventListener('click', () => {
      this.hide('screen-pause');
      this.toMenu();
    });

    // 通关
    $('cmd-next').addEventListener('click', () => {
      this.hide('screen-win');
      Game.startLevel(Game.level + 1);
    });
    $('cmd-win-menu').addEventListener('click', () => {
      this.hide('screen-win');
      this.toMenu();
    });

    // 失败
    $('cmd-over-retry').addEventListener('click', () => {
      this.hide('screen-over');
      Game.startLevel(Game.level);
    });
    $('cmd-over-menu').addEventListener('click', () => {
      this.hide('screen-over');
      this.toMenu();
    });

    this.refreshMenu();
  },

  loadSettings() {
    document.getElementById('set-volume').value = Math.round(Save.data.volume * 100);
  },

  refreshMenu() {
    document.getElementById('ui-highscore').textContent = Save.data.highScore;
  },

  toMenu() {
    Game.state = 'menu';
    this.hideAll();
    this.show('screen-main');
    this.refreshMenu();
  },

  show(id) { const el = document.getElementById(id); if (el) el.classList.add('show'); },
  hide(id) { const el = document.getElementById(id); if (el) el.classList.remove('show'); },
  hideAll() {
    ['screen-main','screen-settings','screen-pause','screen-win','screen-over']
      .forEach(id => this.hide(id));
  },
  setWin(level, score, time) {
    document.getElementById('ui-win-level').textContent = level;
    document.getElementById('ui-win-score').textContent = score;
    document.getElementById('ui-win-time').textContent = time + 's';
  },
  setOver(level, score) {
    document.getElementById('ui-over-level').textContent = level;
    document.getElementById('ui-over-score').textContent = score;
  },
};

/* ============================================================
 *  工具栏点击处理（画布上的按钮）
 * ============================================================ */
Game.handleToolbarClick = function(px, py) {
  if (!this._toolbarButtons) return false;
  for (const b of this._toolbarButtons) {
    if (px >= b.x1 && px <= b.x2 && py >= b.y1 && py <= b.y2) {
      if (b.action === 'hint') { this.useHint(); }
      else if (b.action === 'shuffle') { this.useShuffle(); }
      else if (b.action === 'pause') { this.togglePause(); }
      return true;
    }
  }
  return false;
};

// 修改 onPointer 以先检测工具栏
const _origOnPointer = Game.onPointer.bind(Game);
Game.onPointer = function(e) {
  Sound.init(); Sound.resume();
  if (this.state !== 'playing') return;
  const p = this.getCanvasCoords(e);
  if (this.handleToolbarClick(p.x, p.y)) return;
  const tile = this.pointerToTile(p.x, p.y);
  if (!tile) return;
  if (this.board.grid[tile.y][tile.x] === null) return;
  this.handleTileClick(tile.x, tile.y);
};

/* ============================================================
 *  启动
 * ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  Game.init();
  Game.updateFsIcon();
  document.getElementById('btn-sound').textContent = Sound.enabled ? '♪' : '🔇';
  document.getElementById('btn-sound').classList.toggle('dim', !Sound.enabled);
});
</script>
