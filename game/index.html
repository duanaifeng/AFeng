<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f0f4fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
<title>怀旧小游戏</title>

<style>
/* ============================================================
   设计令牌（与导航主页统一）
   ============================================================ */
:root{
  --bg:#f0f4fc;
  --bg-2:#e6edf8;
  --surface:rgba(255,255,255,.72);
  --surface-2:rgba(255,255,255,.9);
  --surface-hover:rgba(255,255,255,.98);
  --border:rgba(96,165,250,.18);
  --border-hover:rgba(96,165,250,.4);
  --text:#1e293b;
  --text-2:#475569;
  --text-3:#94a3b8;
  --accent:#3b82f6;
  --accent-2:#60a5fa;
  --accent-3:#38bdf8;
  --accent-soft:rgba(96,165,250,.12);
  --accent-border:rgba(96,165,250,.3);
  --shadow:0 10px 30px rgba(15,40,90,.10);
  --shadow-sm:0 4px 14px rgba(15,40,90,.07);
  --shadow-lg:0 24px 56px -18px rgba(37,99,235,.30);
  --glow-1:rgba(96,165,250,.16);
  --glow-2:rgba(56,189,248,.11);
  --glow-3:rgba(129,140,248,.11);
  --ring:rgba(96,165,250,.15);
  --card-shine:rgba(96,165,250,.45);
  --grid-line:rgba(96,165,250,.09);
  --glare:rgba(255,255,255,.75);
  --glare-2:rgba(96,165,250,.16);
  --ripple:rgba(96,165,250,.55);
  --grad-brand:linear-gradient(135deg,#7dd3fc 0%,#60a5fa 45%,#3b82f6 100%);
  --grad-text:linear-gradient(45deg,#1e293b 0%,#2563eb 25%,#3b82f6 55%,#2563eb 75%,#1e293b 100%);
  --toast-bg:rgba(15,23,42,.94);
  --toast-fg:#fff;
}
html.dark{
  --bg:#0a0f1a;
  --bg-2:#0e1524;
  --surface:rgba(147,197,253,.035);
  --surface-2:rgba(147,197,253,.06);
  --surface-hover:rgba(147,197,253,.09);
  --border:rgba(147,197,253,.09);
  --border-hover:rgba(96,165,250,.26);
  --text:#e4edfa;
  --text-2:#9db0cb;
  --text-3:#6b7d99;
  --accent:#60a5fa;
  --accent-2:#7dd3fc;
  --accent-3:#38bdf8;
  --accent-soft:rgba(96,165,250,.14);
  --accent-border:rgba(96,165,250,.28);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-sm:0 4px 14px rgba(0,0,0,.28);
  --shadow-lg:0 24px 56px -18px rgba(0,0,0,.7);
  --glow-1:rgba(59,130,246,.20);
  --glow-2:rgba(56,189,248,.15);
  --glow-3:rgba(129,140,248,.13);
  --ring:rgba(96,165,250,.2);
  --card-shine:rgba(147,197,253,.55);
  --grid-line:rgba(96,165,250,.10);
  --glare:rgba(147,197,253,.16);
  --glare-2:rgba(96,165,250,.24);
  --ripple:rgba(147,197,253,.5);
  --grad-text:linear-gradient(45deg,#fff 0%,#93c5fd 25%,#38bdf8 55%,#93c5fd 75%,#fff 100%);
  --toast-bg:rgba(18,32,52,.96);
  --toast-fg:#8affef;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.dark{color-scheme:dark}
html{scroll-behavior:smooth}
html.perf-lite{scroll-behavior:auto}
html,body{min-height:100%;overflow-x:hidden}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
              "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  min-height:100vh;
  position:relative;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .45s ease,color .45s ease;
}
body.game-open{overflow:hidden}

/* ============ 背景层 ============ */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-gradient{
  position:absolute;inset:0;
  background:
    radial-gradient(1100px 700px at 12% -12%,var(--glow-1),transparent 65%),
    radial-gradient(900px 620px at 92% 6%,var(--glow-2),transparent 62%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 55%,var(--bg) 100%);
  transition:background .45s ease;
}
.bg-blobs{position:absolute;inset:0;filter:blur(90px);opacity:.85}
.blob{position:absolute;border-radius:50%;animation:blobFloat 22s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:radial-gradient(circle,var(--glow-1),transparent 70%);top:-100px;left:-80px}
.blob.b2{width:480px;height:480px;background:radial-gradient(circle,var(--glow-2),transparent 70%);top:-60px;right:-140px;animation-delay:-5s}
.blob.b3{width:380px;height:380px;background:radial-gradient(circle,var(--glow-3),transparent 70%);bottom:-100px;left:-60px;animation-delay:-10s}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.08)}
  66%{transform:translate(-20px,30px) scale(.95)}
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 28%,transparent 84%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 28%,transparent 84%);
  transition:background-image .45s ease;
}
.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(15,40,90,.06) 100%);
  transition:background .45s ease;
}
html.dark .bg-vignette{
  background:radial-gradient(ellipse at 50% 40%,transparent 42%,rgba(0,0,0,.55) 100%);
}

#particleCanvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

html.perf-lite .bg-blobs,
html.perf-lite .bg-grid,
html.perf-lite .bg-vignette{display:none}
html.perf-lite .bg-gradient{background:var(--bg)}
html.perf-lite #particleCanvas{display:none}
html.perf-lite .glass{box-shadow:var(--shadow-sm)}

/* ============ 视图 ============ */
.view{
  display:none;flex-direction:column;width:100%;min-height:100%;
  opacity:0;transition:opacity .25s ease;
  position:relative;z-index:2;
}
.view.active{display:flex;opacity:1}

/* ============ 菜单页 ============ */
#menuView{
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  gap:16px;align-items:center;
  min-height:100vh;
}
#menuView.active{display:flex}

/* ============ 头部 ============ */
.header{
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;z-index:2;width:100%;max-width:560px;
}
@media (min-width:620px){
  .header{max-width:900px}
}

.logo{
  display:inline-flex;align-items:center;gap:10px;
  padding:11px 24px;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.25) inset;
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  position:relative;overflow:hidden;
  transition:background .45s ease,border-color .45s ease,box-shadow .35s ease;
}
html.dark .logo{box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.03) inset}
.logo::before{
  content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--card-shine),transparent);
  pointer-events:none;
}
.logo-icon{font-size:26px;line-height:1;filter:drop-shadow(0 0 12px var(--accent-2))}
.logo-text{
  font-size:22px;font-weight:900;letter-spacing:3px;
  background:var(--grad-text);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:gradientFlow 8s ease-in-out infinite;
}
@keyframes gradientFlow{
  0%,100%{background-position:0% 50%}
  50%{background-position:200% 50%}
}
.subtitle{
  font-size:12px;color:var(--text-3);letter-spacing:2px;font-weight:600;
}
.subtitle b{color:var(--accent);font-weight:800}

/* ============ 统计徽章 ============ */
.stats-badges{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  width:100%;
  max-width:380px;
  margin-top:4px;
}
.stat-badge{
  padding:12px 8px;
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.2) inset;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4),background .3s ease,border-color .3s ease;
}
html.dark .stat-badge{box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.03) inset}
.stat-badge::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,var(--card-shine),transparent);
  pointer-events:none;
}
.stat-badge:hover{
  transform:translateY(-2px);
  border-color:var(--border-hover);
}
.stat-badge .num{
  font-size:18px;font-weight:900;letter-spacing:.5px;
  background:var(--grad-text);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:gradientFlow 6s ease-in-out infinite;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.stat-badge .label{
  font-size:10px;color:var(--text-3);
  letter-spacing:1px;font-weight:700;
}

/* ============ 区块标题 ============ */
.section-title{
  display:flex;align-items:center;gap:10px;
  width:100%;max-width:560px;
  margin-top:6px;
  font-size:13px;font-weight:800;
  letter-spacing:2px;
  color:var(--accent);
  padding-left:4px;
}
@media (min-width:620px){
  .section-title{max-width:900px}
}
.section-title::before{
  content:'';width:7px;height:7px;border-radius:2px;
  background:var(--grad-brand);
  box-shadow:0 0 0 3px var(--accent-soft),0 0 12px var(--accent-2);
  animation:dotPulse 2.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 3px var(--accent-soft),0 0 12px var(--accent-2)}
  50%{transform:scale(1.28);box-shadow:0 0 0 6px rgba(96,165,250,0),0 0 18px var(--accent-2)}
}
.section-title .line{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border-hover),var(--border),transparent);
}
.section-title .count{
  font-size:11px;font-weight:700;
  color:var(--text-3);
  padding:2px 8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  letter-spacing:.5px;
  margin-right:2px;
}

/* ============ 卡片网格 ============ */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;width:100%;max-width:560px;
}
@media (min-width:620px){
  .grid{grid-template-columns:repeat(4,1fr);max-width:900px;gap:14px}
}

.card{
  --rx:0deg;--ry:0deg;--mx:50%;--my:50%;--lift:0px;--scale:1;
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  padding:16px 10px 14px;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.22) inset;
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  cursor:pointer;overflow:hidden;
  font-family:inherit;color:inherit;text-align:center;
  -webkit-appearance:none;appearance:none;
  transform-style:preserve-3d;
  transform:
    perspective(1000px)
    rotateX(var(--rx))
    rotateY(var(--ry))
    translateY(var(--lift))
    scale(var(--scale));
  transition:
    transform .45s cubic-bezier(.2,.9,.3,1.2),
    background .4s ease,
    border-color .4s ease,
    box-shadow .4s ease;
  aspect-ratio:1/1.15;
  animation:cardIn .55s cubic-bezier(.34,1.4,.64,1) backwards;
}
html.dark .card{box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.03) inset}
.card.is-tilting{
  transition:background .4s ease,border-color .4s ease,box-shadow .4s ease;
  will-change:transform;
}

.card:nth-child(1) {animation-delay:.04s}
.card:nth-child(2) {animation-delay:.09s}
.card:nth-child(3) {animation-delay:.14s}
.card:nth-child(4) {animation-delay:.19s}
.card:nth-child(5) {animation-delay:.24s}
.card:nth-child(6) {animation-delay:.29s}
.card:nth-child(7) {animation-delay:.34s}
.card:nth-child(8) {animation-delay:.39s}
.card:nth-child(9) {animation-delay:.44s}
.card:nth-child(10){animation-delay:.49s}

@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(220px circle at 0% 0%,var(--c),transparent 68%);
  opacity:.12;transition:opacity .3s ease;pointer-events:none;z-index:0;
}
.card::after{
  content:'';position:absolute;
  left:14%;right:14%;bottom:0;height:3px;
  border-radius:3px 3px 0 0;
  background:var(--c);
  box-shadow:0 0 14px var(--c);
  opacity:.75;transition:opacity .3s ease;
  z-index:1;
}

.card .glare{
  position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(480px circle at var(--mx) var(--my),
    var(--glare),
    var(--glare-2) 32%,
    transparent 58%);
  opacity:0;transition:opacity .35s ease;
  pointer-events:none;z-index:4;
}

.card:hover{
  --lift:-5px;
  --scale:1.02;
  background:var(--surface-hover);
  border-color:var(--c);
  box-shadow:var(--shadow-lg),
             0 0 0 1px var(--c) inset,
             0 0 28px -4px var(--c);
}
.card:hover::before{opacity:.3}
.card:hover::after{opacity:1;height:4px}
.card:hover .glare{opacity:1}
.card:active{--lift:-1px;--scale:.985}
.card:focus-visible{
  outline:none;
  border-color:var(--c);
  box-shadow:0 0 0 2px var(--c),0 0 24px -2px var(--c);
}

.icon-wrap{
  position:relative;z-index:2;
  width:54px;height:54px;border-radius:50%;
  background:var(--c-soft);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px var(--c-border),0 0 20px -4px var(--c);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4);
}
.card:hover .icon-wrap{transform:scale(1.1) rotate(-5deg)}
.icon{
  font-size:28px;line-height:1;
  filter:drop-shadow(0 0 10px var(--c));
}

.name{
  position:relative;z-index:2;
  font-size:15px;font-weight:800;color:var(--text);
  letter-spacing:1px;margin-top:2px;
  transition:color .2s ease;
}
.card:hover .name{color:var(--accent)}

.desc{
  position:relative;z-index:2;
  font-size:10px;color:var(--text-3);
  line-height:1.35;text-align:center;padding:0 2px;
}

.tag{
  position:absolute;top:9px;right:9px;
  font-size:9px;font-weight:800;
  padding:2px 8px;border-radius:8px;
  background:var(--c-soft);color:var(--c);
  border:1px solid var(--c-border);
  letter-spacing:.5px;z-index:3;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}

/* ============ 主推卡片 ============ */
.card.featured{
  grid-column:span 2;
  aspect-ratio:2.1/1;
  flex-direction:row;
  justify-content:flex-start;
  align-items:center;
  text-align:left;
  padding:20px 22px;
  gap:16px;
  border-radius:20px;
}
.card.featured::before{
  background:radial-gradient(360px circle at 0% 50%,var(--c),transparent 70%);
  opacity:.16;
}
.card.featured:hover::before{opacity:.34}
.card.featured::after{
  left:6%;right:6%;height:3px;
  opacity:.85;
}
.card.featured:hover::after{opacity:1;height:4px}

.card.featured .icon-wrap{
  width:64px;height:64px;
  flex-shrink:0;
  box-shadow:inset 0 0 0 1px var(--c-border),0 0 26px -2px var(--c);
}
.card.featured:hover .icon-wrap{transform:scale(1.1) rotate(-6deg)}
.card.featured .icon{font-size:34px}

.card.featured .featured-body{
  display:flex;flex-direction:column;gap:4px;
  min-width:0;flex:1;position:relative;z-index:2;
}
.card.featured .name{
  font-size:18px;letter-spacing:1.5px;
  margin-top:0;text-align:left;
}
.card.featured .desc{
  font-size:11.5px;text-align:left;
  line-height:1.4;padding:0;
}

.card.featured .featured-tag{
  position:absolute;top:10px;right:10px;
  font-size:9.5px;font-weight:900;
  padding:3px 10px;border-radius:8px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);
  color:#422006;
  border:none;
  letter-spacing:1.5px;
  box-shadow:0 4px 14px rgba(251,191,36,.55),
             0 0 20px rgba(251,191,36,.35),
             inset 0 1px 0 rgba(255,255,255,.5);
  z-index:5;
  animation:tagShine 2.6s ease-in-out infinite;
}
@keyframes tagShine{
  0%,100%{box-shadow:0 4px 14px rgba(251,191,36,.55),0 0 20px rgba(251,191,36,.35),inset 0 1px 0 rgba(255,255,255,.5)}
  50%{box-shadow:0 4px 20px rgba(251,191,36,.85),0 0 32px rgba(251,191,36,.6),inset 0 1px 0 rgba(255,255,255,.6)}
}

/* ============ 涟漪 ============ */
.ripple{
  position:absolute;
  width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle,var(--ripple),transparent 70%);
  transform:translate(-50%,-50%) scale(0);
  animation:rippleAnim .65s ease-out forwards;
  pointer-events:none;z-index:5;
}
@keyframes rippleAnim{
  to{transform:translate(-50%,-50%) scale(22);opacity:0}
}

/* ============ 页脚 ============ */
.footer{
  margin-top:auto;padding-top:26px;width:100%;max-width:560px;
  text-align:center;letter-spacing:1px;
  position:relative;z-index:2;
}
@media (min-width:620px){
  .footer{max-width:900px}
}

.footer-slogan{
  font-size:11px;color:var(--text-3);
  letter-spacing:1.5px;margin-bottom:20px;
  font-weight:600;
}
.footer-slogan .dot{display:inline-block;margin:0 6px;color:var(--border-hover)}

.footer-poem{margin-bottom:20px;line-height:2}
.footer-poem p{
  font-size:12px;color:var(--text-2);
  letter-spacing:1px;
}

.footer-bottom{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding-top:14px;
  border-top:1px solid var(--border);
}

.mail-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:10px;
  background:var(--accent-soft);border:1px solid var(--accent-border);
  font-family:inherit;font-size:12px;font-weight:700;
  letter-spacing:.5px;color:var(--accent);
  cursor:pointer;

<script>
/* ============================================================
   怀旧小游戏 v2.2
   - 主推：斗地主 / 保山幺子分
   - 统计徽章 + 分类标题 + 回到顶部
   - 蓝青主题 + 亮暗双主题
   - 粒子背景 + 3D 卡片 + 光标高光 + 涟漪
   - 低端机性能模式
   ============================================================ */
(function(){
    'use strict';

    /* ===== 0. 低端机性能检测 ===== */
    (function(){
        var lite = false;
        var search = window.location.search || '';
        if (/[?&]full=1/.test(search)) { lite = false; }
        else if (/[?&]lite=1/.test(search)) { lite = true; }
        else {
            if (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4) lite = true;
            if (typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 4) lite = true;
            if (navigator.connection && navigator.connection.saveData === true) lite = true;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) lite = true;
            var ua = navigator.userAgent || '';
            if (/iPhone OS (7|8|9|10|11|12)_/.test(ua)) lite = true;
            var hasMemInfo = typeof navigator.deviceMemory === 'number';
            var hasCpuInfo = typeof navigator.hardwareConcurrency === 'number';
            if (!hasMemInfo && !hasCpuInfo){
                var w = Math.min(window.screen ? window.screen.width : 9999, window.screen ? window.screen.height : 9999);
                if (w <= 360) lite = true;
            }
        }
        if (lite) document.documentElement.classList.add('perf-lite');
        window.__LITE__ = lite;
    })();

    /* ===== 1. 粒子背景 ===== */
    (function(){
        var canvas = document.getElementById('particleCanvas');
        if (!canvas || window.__LITE__) return;
        var ctx = canvas.getContext('2d', { alpha: true });

        var W = 0, H = 0, dpr = 1;
        var particles = [];
        var rafId = 0, running = false;
        var mouse = { x: -9999, y: -9999 };

        function isDark(){ return document.documentElement.classList.contains('dark'); }

        var COLORS_LIGHT = [[59,130,246],[96,165,250],[56,189,248],[14,165,233],[129,140,248]];
        var COLORS_DARK  = [[96,165,250],[125,211,252],[56,189,248],[147,197,253],[129,140,248]];
        var LINK_LIGHT = [59,130,246];
        var LINK_DARK  = [125,211,252];
        var COLORS = COLORS_LIGHT;
        var LINK_COLOR = LINK_LIGHT;
        var SPRITE = 64;
        var sprites = [];

        function buildSprites(dark){
            COLORS = dark ? COLORS_DARK : COLORS_LIGHT;
            LINK_COLOR = dark ? LINK_DARK : LINK_LIGHT;
            sprites = COLORS.map(function(rgb){
                var r = rgb[0], g = rgb[1], b = rgb[2];
                var cv = document.createElement('canvas');
                cv.width = cv.height = SPRITE;
                var c = cv.getContext('2d');
                var grd = c.createRadialGradient(32,32,0,32,32,32);
                if (dark){
                    grd.addColorStop(0,    'rgba(255,255,255,0.95)');
                    grd.addColorStop(0.18, 'rgba(' + r + ',' + g + ',' + b + ',0.85)');
                    grd.addColorStop(0.5,  'rgba(' + r + ',' + g + ',' + b + ',0.25)');
                    grd.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
                } else {
                    grd.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',0.95)');
                    grd.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.55)');
                    grd.addColorStop(0.7,  'rgba(' + r + ',' + g + ',' + b + ',0.16)');
                    grd.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
                }
                c.fillStyle = grd;
                c.fillRect(0,0,SPRITE,SPRITE);
                return cv;
            });
        }

        var isCoarse = window.matchMedia('(pointer: coarse)').matches;

        function resize(){
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initParticles();
        }

        function initParticles(){
            var base = Math.floor(W * H / 18000);
            var cap = isCoarse ? 45 : 85;
            var count = Math.min(cap, Math.max(28, base));
            particles = [];
            for (var i = 0; i < count; i++){
                var si = Math.random() < 0.9 ? Math.floor(Math.random() * 4) : 4;
                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    r: Math.random() * 2 + 0.8,
                    si: si,
                    c: COLORS[si],
                    a: Math.random() * 0.4 + 0.4,
                    tw: Math.random() * Math.PI * 2,
                    twSpeed: Math.random() * 0.02 + 0.008
                });
            }
        }

        var LINK_DIST = 130;
        var LINK_DIST2 = LINK_DIST * LINK_DIST;

        function draw(){
            ctx.clearRect(0, 0, W, H);
            var dark = isDark();

            for (var i = 0; i < particles.length; i++){
                var p = particles[i];
                var dx = mouse.x - p.x, dy = mouse.y - p.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150 && dist > 0.5){
                    var force = (150 - dist) / 150 * 0.4;
                    p.vx += dx / dist * force * 0.04;
                    p.vy += dy / dist * force * 0.04;
                }
                var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 0.9){ p.vx = p.vx / speed * 0.9; p.vy = p.vy / speed * 0.9; }
                p.x += p.vx; p.y += p.vy; p.tw += p.twSpeed;
                if (p.x < 0){ p.x = 0; p.vx *= -1; } else if (p.x > W){ p.x = W; p.vx *= -1; }
                if (p.y < 0){ p.y = 0; p.vy *= -1; } else if (p.y > H){ p.y = H; p.vy *= -1; }
            }

            var lineAlphaBase = dark ? 0.28 : 0.20;
            var lr = LINK_COLOR[0], lg = LINK_COLOR[1], lb = LINK_COLOR[2];
            ctx.lineWidth = 0.8;
            for (var a1 = 0; a1 < particles.length; a1++){
                var pa = particles[a1];
                for (var b1 = a1 + 1; b1 < particles.length; b1++){
                    var pb = particles[b1];
                    var ddx = pa.x - pb.x, ddy = pa.y - pb.y;
                    var d2 = ddx * ddx + ddy * ddy;
                    if (d2 < LINK_DIST2){
                        var op = (1 - Math.sqrt(d2) / LINK_DIST) * lineAlphaBase;
                        ctx.strokeStyle = 'rgba(' + lr + ',' + lg + ',' + lb + ',' + op + ')';
                        ctx.beginPath();
                        ctx.moveTo(pa.x, pa.y);
                        ctx.lineTo(pb.x, pb.y);
                        ctx.stroke();
                    }
                }
            }

            var alphaScale = dark ? 1 : 0.75;
            for (var k = 0; k < particles.length; k++){
                var pk = particles[k];
                var alpha = pk.a * (0.65 + 0.35 * Math.sin(pk.tw)) * alphaScale;
                var size = pk.r * (dark ? 10 : 8.5);
                ctx.globalAlpha = alpha;
                ctx.drawImage(sprites[pk.si], pk.x - size / 2, pk.y - size / 2, size, size);
            }
            ctx.globalAlpha = 1;
        }

        function loop(){ if (!running) return; draw(); rafId = requestAnimationFrame(loop); }
        function start(){ if (running) return; running = true; loop(); }
        function stop(){ running = false; cancelAnimationFrame(rafId); }

        document.addEventListener('visibilitychange', function(){
            if (document.hidden) stop(); else start();
        });

        window.addEventListener('mousemove', function(e){
            mouse.x = e.clientX; mouse.y = e.clientY;
        }, { passive: true });
        window.addEventListener('mouseleave', function(){ mouse.x = -9999; mouse.y = -9999; });
        window.addEventListener('touchmove', function(e){
            if (e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        }, { passive: true });
        window.addEventListener('touchend', function(){ mouse.x = -9999; mouse.y = -9999; });

        var rt = 0;
        window.addEventListener('resize', function(){
            clearTimeout(rt);
            rt = setTimeout(resize, 200);
        }, { passive: true });

        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener && mq.addEventListener('change', function(){
            buildSprites(isDark());
            for (var i = 0; i < particles.length; i++) particles[i].c = COLORS[particles[i].si];
        });

        buildSprites(isDark());
        resize();
        if ('requestIdleCallback' in window){
            requestIdleCallback(function(){ start(); }, { timeout: 800 });
        } else {
            setTimeout(start, 350);
        }
    })();

    /* ===== 2. 卡片 3D 倾斜 + 涟漪 ===== */
    var TILT_MAX = 6;
    (function(){
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var isCoarse = window.matchMedia('(pointer: coarse)').matches;
        var canTilt = !reduce && !isCoarse && !window.__LITE__;
        var cards = document.querySelectorAll('.card');

        Array.prototype.forEach.call(cards, function(card){
            card.addEventListener('pointerdown', function(e){
                var r = card.getBoundingClientRect();
                var ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.left = (e.clientX - r.left) + 'px';
                ripple.style.top = (e.clientY - r.top) + 'px';
                card.appendChild(ripple);
                setTimeout(function(){ if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 680);
            });

            if (!canTilt) return;

            var rafId = 0;
            var lastEvent = null;

            function apply(){
                rafId = 0;
                if (!lastEvent) return;
                var r = card.getBoundingClientRect();
                if (!r.width || !r.height) return;
                var px = (lastEvent.clientX - r.left) / r.width;
                var py = (lastEvent.clientY - r.top) / r.height;
                px = Math.max(0, Math.min(1, px));
                py = Math.max(0, Math.min(1, py));
                var ry = (px - 0.5) * TILT_MAX * 2;
                var rx = (0.5 - py) * TILT_MAX * 2;
                card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
                card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
                card.style.setProperty('--mx', (px * 100).toFixed(2) + '%');
                card.style.setProperty('--my', (py * 100).toFixed(2) + '%');
            }

            card.addEventListener('mousemove', function(e){
                if (!card.classList.contains('is-tilting')) card.classList.add('is-tilting');
                lastEvent = e;
                if (!rafId) rafId = requestAnimationFrame(apply);
            });
            card.addEventListener('mouseleave', function(){
                if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
                lastEvent = null;
                card.classList.remove('is-tilting');
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--ry', '0deg');
                card.style.setProperty('--mx', '50%');
                card.style.setProperty('--my', '50%');
            });
        });
    })();

    /* ===== 3. 回到顶部 ===== */
    (function(){
        var btn = document.getElementById('backToTop');
        if (!btn) return;
        var fg = btn.querySelector('.ring-fg');
        var R = 21;
        var CIRC = 2 * Math.PI * R;
        if (fg){
            fg.style.strokeDasharray = CIRC;
            fg.style.strokeDashoffset = CIRC;
        }

        var ticking = false;
        function update(){
            ticking = false;
            var y = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
            var max = Math.max(1, (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight);
            var p = Math.max(0, Math.min(1, y / max));
            if (fg) fg.style.strokeDashoffset = CIRC * (1 - p);
            if (y > 300) btn.classList.add('show');
            else btn.classList.remove('show');
        }
        function onScroll(){
            if (!ticking){ ticking = true; requestAnimationFrame(update); }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        setTimeout(update, 150);

        btn.addEventListener('click', function(){
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        });
    })();

    /* ===== 4. 游戏视图逻辑 ===== */
    var menuView  = document.getElementById('menuView');
    var gameView  = document.getElementById('gameView');
    var gameFrame = document.getElementById('gameFrame');
    var gameTitle = document.getElementById('gameTitle');
    var backBtn   = document.getElementById('backBtn');
    var loading   = document.getElementById('loading');
    var loadingName = document.getElementById('loadingName');
    var mailBtn   = document.getElementById('mailBtn');
    var toastEl   = document.getElementById('toast');
    var backToTop = document.getElementById('backToTop');

    var EMAIL = '88061995@qq.com';
    var currentGame = null;

    function isGameOpen(){ return gameView.classList.contains('active'); }

    function showToast(msg){
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastEl._timer) clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
    }

    function openGame(file, title){
        currentGame = file;
        gameTitle.textContent = title;
        loadingName.textContent = title;

        loading.classList.remove('hide');
        gameFrame.classList.remove('loaded');
        gameFrame.src = file;

        document.body.classList.add('game-open');

        menuView.classList.remove('active');
        gameView.classList.add('active');

        // 隐藏回到顶部按钮
        if (backToTop) backToTop.classList.remove('show');

        history.pushState({ game: file }, '', location.hash || '#game');
    }

    function goMenu(fromPopstate){
        currentGame = null;
        gameFrame.src = 'about:blank';
        gameFrame.classList.remove('loaded');
        loading.classList.remove('hide');

        document.body.classList.remove('game-open');

        gameView.classList.remove('active');
        menuView.classList.add('active');

        if (!fromPopstate && history.state && history.state.game){
            history.back();
        }
    }

    function copyText(text){
        if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(function(){
                onCopyResult(true);
            }).catch(function(){
                onCopyResult(fallbackCopy(text));
            });
        } else {
            onCopyResult(fallbackCopy(text));
        }
    }
    function fallbackCopy(text){
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;width:2em;height:2em;padding:0;border:none;outline:none;background:transparent;opacity:0;';
        document.body.appendChild(ta);
        var ok = false;
        try {
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);
            ok = document.execCommand('copy');
        } catch (_){ ok = false; }
        document.body.removeChild(ta);
        return ok;
    }
    function onCopyResult(ok){
        if (!mailBtn) return;
        var textEl = mailBtn.querySelector('.mail-text');
        var iconEl = mailBtn.querySelector('.mail-icon');
        if (!textEl || !iconEl) return;

        if (mailBtn._copyTimer) clearTimeout(mailBtn._copyTimer);

        if (ok){
            mailBtn.classList.add('copied');
            iconEl.textContent = '✅';
            textEl.textContent = '已复制';
            showToast('邮箱已复制：' + EMAIL);
            mailBtn._copyTimer = setTimeout(function(){
                mailBtn.classList.remove('copied');
                iconEl.textContent = '📧';
                textEl.textContent = EMAIL;
            }, 1600);
        } else {
            window.prompt('请手动复制邮箱地址：', EMAIL);
        }
    }

    Array.prototype.forEach.call(document.querySelectorAll('.card'), function(card){
        card.addEventListener('click', function(){
            var file = card.dataset.game;
            var nameEl = card.querySelector('.name');
            var title = (nameEl && nameEl.textContent && nameEl.textContent.trim()) || '游戏';

            if (navigator.vibrate){ try { navigator.vibrate(12); } catch(_){} }

            openGame(file, title);
        });
    });

    backBtn.addEventListener('click', function(){ goMenu(false); });

    if (mailBtn){
        mailBtn.addEventListener('click', function(){ copyText(EMAIL); });
    }

    gameFrame.addEventListener('load', function(){
        if (gameFrame.src === 'about:blank') return;
        requestAnimationFrame(function(){
            loading.classList.add('hide');
            gameFrame.classList.add('loaded');
        });
    });

    window.addEventListener('popstate', function(){
        if (isGameOpen()) goMenu(true);
    });

})();
</script>
</body>
</html>
