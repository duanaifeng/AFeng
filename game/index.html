<style>
/* ============================================================
 * 01. 令牌 · 三层架构
 * ============================================================ */
:root {
  /* L1 基础色 */
  --k-blue-100:#dbeafe;--k-blue-200:#bfdbfe;--k-blue-300:#93c5fd;
  --k-blue-400:#60a5fa;--k-blue-500:#3b82f6;--k-blue-600:#2563eb;--k-blue-700:#1d4ed8;
  --k-cyan-300:#67e8f9;--k-cyan-400:#38bdf8;--k-cyan-500:#0ea5e9;
  --k-indigo-300:#a5b4fc;--k-indigo-400:#818cf8;--k-indigo-500:#6366f1;
  --k-violet-400:#a78bfa;--k-violet-500:#8b5cf6;
  --k-green-400:#4ade80;--k-green-500:#22c55e;
  --k-amber-400:#fbbf24;--k-amber-500:#f59e0b;
  --k-rose-400:#fb7185;--k-rose-500:#f43f5e;
  --k-orange-400:#fb923c;--k-orange-500:#ea580c;
  --k-pink-400:#f472b6;--k-pink-500:#ec4899;
  --k-slate-50:#f8fafc;--k-slate-100:#f1f5f9;--k-slate-200:#e2e8f0;
  --k-slate-300:#cbd5e1;--k-slate-400:#94a3b8;--k-slate-500:#64748b;
  --k-slate-600:#475569;--k-slate-700:#334155;--k-slate-800:#1e293b;
  --k-slate-900:#0f172a;--k-slate-950:#0a0f1a;
  --k-navy-800:#0e1524;--k-navy-900:#0b1120;
  --k-white:#fff;

  /* L2 语义色 · 亮色 */
  --bg:#f0f4fc;--bg-2:#e6edf8;
  --surface:rgba(255,255,255,.72);
  --surface-2:rgba(255,255,255,.90);
  --surface-3:#ffffff;
  --text-1:#0f172a;--text-2:#475569;--text-3:#64748b;
  --border-1:rgba(59,130,246,.14);
  --border-2:rgba(59,130,246,.32);
  --accent:#2563eb;--accent-hover:#1d4ed8;
  --accent-soft:rgba(59,130,246,.10);
  --accent-glow:rgba(59,130,246,.30);
  --accent-tint:rgba(59,130,246,.06);
  --glow-blue:rgba(96,165,250,.22);
  --glow-cyan:rgba(56,189,248,.15);
  --glow-indigo:rgba(129,140,248,.13);
  --grid-line:rgba(59,130,246,.07);
  --shine:rgba(255,255,255,.85);
  --danger:#dc2626;

  /* L3 组件令牌 */
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;
  --dur-instant:80ms;--dur-fast:140ms;--dur:220ms;--dur-slow:360ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --focus-ring:0 0 0 3px rgba(59,130,246,.26);
  --shadow-sm:0 1px 2px rgba(15,40,90,.05),0 2px 8px rgba(15,40,90,.05);
  --shadow-md:0 2px 4px rgba(15,40,90,.05),0 8px 24px rgba(15,40,90,.08);
  --shadow-lg:0 4px 12px rgba(15,40,90,.06),0 20px 48px rgba(37,99,235,.14);
  --container-max:1120px;
  --container-pad-x:20px;
}
html.dark {
  --bg:#0a0f1a;--bg-2:#0e1524;
  --surface:rgba(147,197,253,.045);
  --surface-2:rgba(147,197,253,.07);
  --surface-3:rgba(147,197,253,.10);
  --text-1:#e4edfa;--text-2:#9db0cb;--text-3:#8ba3c2;
  --border-1:rgba(147,197,253,.10);
  --border-2:rgba(96,165,250,.28);
  --accent:#60a5fa;--accent-hover:#93c5fd;
  --accent-soft:rgba(96,165,250,.14);
  --accent-glow:rgba(96,165,250,.42);
  --accent-tint:rgba(96,165,250,.08);
  --glow-blue:rgba(59,130,246,.26);
  --glow-cyan:rgba(56,189,248,.18);
  --glow-indigo:rgba(129,140,248,.16);
  --grid-line:rgba(96,165,250,.08);
  --shine:rgba(147,197,253,.28);
  --danger:#f87171;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 2px 4px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.7);
  --focus-ring:0 0 0 3px rgba(96,165,250,.4);
}

/* ============================================================
 * 02. 重置
 * ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
html.dark{color-scheme:dark}
html.perf-lite{scroll-behavior:auto}
html,body{overflow-x:hidden}
html.game-open,body.game-open{overflow:hidden}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'HarmonyOS Sans SC','HarmonyOS Sans','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','WenQuanYi Micro Hei',Arial,sans-serif;
  font-size:15px;line-height:1.6;
  color:var(--text-1);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  transition:background var(--dur-slow) var(--ease),color var(--dur-slow) var(--ease);
  display:flex;flex-direction:column;align-items:center;
}

:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
::selection{background:var(--accent-soft);color:var(--text-1)}

@media (min-width:1024px){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-glow)}
}

.skip-link{
  position:absolute;left:12px;top:-64px;z-index:10000;
  padding:10px 18px;border-radius:var(--radius-md);
  background:var(--accent);color:#fff;
  font-weight:700;font-size:14px;text-decoration:none;
  transition:top var(--dur-fast) var(--ease);
}
.skip-link:focus{top:12px}

/* ============================================================
 * 03. 背景层
 * ============================================================ */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.bg-gradient{
  position:absolute;inset:0;
  background:
    radial-gradient(1000px 640px at 10% -10%,var(--glow-blue),transparent 62%),
    radial-gradient(840px 560px at 92% 4%,var(--glow-cyan),transparent 60%),
    radial-gradient(720px 520px at 60% 100%,var(--glow-indigo),transparent 65%),
    linear-gradient(165deg,var(--bg) 0%,var(--bg-2) 58%,var(--bg) 100%);
  transition:background var(--dur-slow) var(--ease);
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 28%,transparent 84%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 28%,transparent 84%);
}
.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 46%,rgba(15,40,90,.06) 100%);
}
html.dark .bg-vignette{
  background:radial-gradient(ellipse at 50% 40%,transparent 42%,rgba(0,0,0,.55) 100%);
}
#particleCanvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
html.perf-lite .bg-grid,
html.perf-lite .bg-vignette,
html.perf-lite #particleCanvas{display:none}
html.perf-lite .bg-gradient{background:var(--bg)}

/* ============================================================
 * 04. 视图容器
 * ============================================================ */
.view{
  display:none;flex-direction:column;
  width:100%;min-height:100%;
  opacity:0;transition:opacity var(--dur) var(--ease);
  position:relative;z-index:2;
}
.view.active{display:flex;opacity:1}

/* ============================================================
 * 05. 菜单页
 * ============================================================ */
#menuView{padding:40px var(--container-pad-x) 48px;align-items:center;gap:0}
@media (max-width:480px){#menuView{padding:32px 16px 40px}}
@media (min-width:768px){#menuView{padding:56px 32px 56px}}
@media (min-width:1024px){#menuView{padding:72px 48px 64px}}

.menu-inner{
  width:100%;max-width:var(--container-max);
  display:flex;flex-direction:column;gap:36px;
}

/* ── 头部 ── */
.menu-header{display:flex;flex-direction:column;gap:14px;padding:16px 4px}

.brand-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-family:ui-monospace,'SF Mono','Menlo','Consolas',monospace;
  font-size:11.5px;letter-spacing:.14em;
  color:var(--text-3);font-weight:700;align-self:flex-start;
}
.brand-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft),0 0 12px var(--accent-glow);
  animation:brandPulse 2.6s ease-in-out infinite;
}
@keyframes brandPulse{
  0%,100%{box-shadow:0 0 0 4px var(--accent-soft),0 0 12px var(--accent-glow)}
  50%{box-shadow:0 0 0 8px transparent,0 0 20px var(--accent-glow)}
}

/* 主标题 · 单行左对齐 */
.menu-title{
  font-size:clamp(22px,4.6vw,42px);
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.25;
  color:var(--text-1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.menu-title .accent{
  color:var(--accent);
  font-style:italic;font-weight:400;
  font-family:'Georgia','Songti SC','STSong',serif;
}

.menu-sub{
  font-size:14.5px;color:var(--text-3);
  font-weight:500;line-height:1.65;
  max-width:560px;margin-top:2px;
}

/* ── 统计徽章 ── */
.menu-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;padding:18px 8px;
  border-radius:var(--radius-lg);
  background:var(--surface);
  border:1px solid var(--border-1);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-sm),0 0 0 1px var(--shine) inset;
}
html.dark .menu-stats{box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.03) inset}

.menu-stat{text-align:center;position:relative;padding:4px}
.menu-stat + .menu-stat::before{
  content:'';position:absolute;
  left:0;top:20%;height:60%;width:1px;
  background:var(--border-1);
}
.menu-stat-num{
  display:block;font-size:26px;font-weight:800;
  letter-spacing:-.02em;color:var(--text-1);
  font-variant-numeric:tabular-nums;
  line-height:1.15;margin-bottom:3px;
}
.menu-stat-label{
  display:block;font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);
}

/* ── 分组标题 ── */
.section-head{display:flex;align-items:center;gap:14px;padding:0 4px}
.section-num{
  font-family:ui-monospace,'SF Mono','Menlo','Consolas',monospace;
  font-size:11px;font-weight:800;
  color:var(--accent);letter-spacing:.12em;
  padding:4px 9px;border-radius:var(--radius-xs);
  background:var(--accent-soft);
  border:1px solid var(--accent-soft);
  flex:0 0 auto;
}
.section-title{
  font-size:14px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-1);flex:0 0 auto;
}
.section-rule{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border-2),var(--border-1) 60%,transparent);
}
.section-count{
  font-family:ui-monospace,'SF Mono','Menlo',monospace;
  font-size:11px;font-weight:700;
  color:var(--text-3);letter-spacing:.06em;
  padding:2px 8px;border-radius:var(--radius-xs);
  background:var(--surface-2);
  border:1px solid var(--border-1);
  flex:0 0 auto;
}

/* ============================================================
 * 06. 主推游戏
 * ============================================================ */
.featured-list{
  display:grid;grid-template-columns:1fr;
  gap:14px;list-style:none;
}
@media (min-width:640px){.featured-list{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.featured-list{gap:18px}}

.featured-list > li{display:flex}

.featured-card{
  --mx:50%;--my:50%;
  position:relative;flex:1;
  min-height:132px;
  padding:24px 22px;
  border-radius:var(--radius-xl);
  border:1px solid var(--border-1);
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow-md),0 0 0 1px var(--shine) inset;
  cursor:pointer;font-family:inherit;
  color:inherit;text-align:left;
  display:flex;align-items:center;gap:20px;
  overflow:hidden;
  transition:transform var(--dur-slow) var(--ease),
             border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
html.dark .featured-card{box-shadow:var(--shadow-md),0 0 0 1px rgba(255,255,255,.03) inset}

.featured-card::before{
  content:'';position:absolute;
  top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gc-glow,var(--accent-glow)),transparent);
}
.featured-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(440px circle at var(--mx) var(--my),var(--accent-tint),transparent 45%);
  opacity:0;transition:opacity var(--dur-slow) var(--ease);
  pointer-events:none;
}
@media (hover:hover) and (pointer:fine){
  .featured-card:hover,.featured-card:focus-visible{
    transform:translateY(-4px);
    border-color:var(--border-2);
    box-shadow:var(--shadow-lg),0 0 0 1px var(--shine) inset;
  }
  .featured-card:hover::after{opacity:1}
}
.featured-card:active{transform:translateY(-1px) scale(.995)}
@media (min-width:1024px){
  .featured-card{padding:30px 28px;gap:24px;min-height:152px}
}

.featured-icon{
  flex:0 0 auto;
  width:60px;height:60px;
  border-radius:var(--radius-lg);
  background:var(--gc-bg,var(--accent-soft));
  border:1px solid var(--gc-border,var(--border-1));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;line-height:1;
  position:relative;z-index:1;
  transition:transform var(--dur-slow) var(--ease-spring);
}
@media (hover:hover) and (pointer:fine){
  .featured-card:hover .featured-icon{transform:scale(1.08) rotate(-5deg)}
}
@media (min-width:1024px){.featured-icon{width:72px;height:72px;font-size:34px}}

.featured-body{
  min-width:0;flex:1;position:relative;z-index:1;
  display:flex;flex-direction:column;gap:8px;
}
.featured-name{
  font-size:20px;font-weight:800;
  letter-spacing:-.01em;color:var(--text-1);
  line-height:1.2;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
@media (min-width:1024px){.featured-name{font-size:24px}}

.featured-desc{
  font-size:13px;color:var(--text-3);
  font-weight:400;line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-clamp:2;overflow:hidden;
  min-height:calc(13px * 1.55 * 2);
}
.featured-badge{
  display:inline-block;
  font-size:9.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--radius-xs);
  background:var(--accent);color:#fff;
  font-family:ui-monospace,'SF Mono','Menlo',monospace;
  line-height:1.4;
  box-shadow:0 2px 8px var(--accent-glow);
}

/* ============================================================
 * 07. 全部游戏网格
 * ============================================================ */
.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(160px, 100%), 1fr));
  gap:12px;list-style:none;
}
@media (min-width:1024px){
  .game-grid{
    gap:18px;
    grid-template-columns:repeat(auto-fill, minmax(min(200px, 100%), 1fr));
  }
}
.game-grid > li{display:flex}

.game-card{
  --mx:50%;--my:50%;
  position:relative;flex:1;
  aspect-ratio:1 / 1.1;
  padding:22px 14px 20px;
  border-radius:var(--radius-lg);
  border:1px solid var(--border-1);
  background:var(--surface);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--shadow-sm),0 0 0 1px var(--shine) inset;
  cursor:pointer;font-family:inherit;
  color:inherit;text-align:center;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  transition:transform var(--dur) var(--ease),
             border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
html.dark .game-card{box-shadow:var(--shadow-sm),0 0 0 1px rgba(255,255,255,.03) inset}

.game-card::before{
  content:'';position:absolute;
  left:20%;right:20%;bottom:0;height:2px;
  background:var(--gc,var(--accent));
  border-radius:2px 2px 0 0;
  opacity:.5;
  transition:opacity var(--dur) var(--ease),
             left var(--dur) var(--ease),
             right var(--dur) var(--ease),
             height var(--dur) var(--ease);
}

 * 08. 页脚
 * ============================================================ */
.menu-footer{

}

}
.footer-copy{

}

}

/* ============================================================
 * 09. 游戏视图
 * ============================================================ */
#gameView{position:fixed;inset:0;z-index:100;background:#0b1120;padding:0}

}
.back-btn{

}
.back-btn:hover{border-color:rgba(56,189,248,.6);color:#38bdf8;background:rgba(51,65,85,.95)}

.back-btn-icon{

  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}
.game-title{
  flex:1;min-width:0;
  font-size:14px;font-weight:800;
  color:#e2e8f0;letter-spacing:.02em;

}

.frame-wrap{position:relative;flex:1;min-height:0;background:#0b1120}
#gameFrame{

}

.loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
  background:radial-gradient(circle at 50% 40%,#1e293b 0%,#0b1120 70%);

  transition:opacity var(--dur-slow) var(--ease),visibility var(--dur-slow);
}
.loading.hide{opacity:0;visibility:hidden;pointer-events:none}

.spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(56,189,248,.18);
  border-top-color:#38bdf8;
  animation:spin .85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

  color:#94a3b8;letter-spacing:.04em;
  text-align:center;padding:0 20px;line-height:1.6;
}
.loading-text b{color:#7dd3fc;font-weight:800}

.error-state{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:18px;
  background:radial-gradient(circle at 50% 40%,#2a1a1a 0%,#0b1120 70%);

}

}

.error-btn.primary{

}

/* ============================================================
 * 10. 回到顶部
 * ============================================================ */
.back-top{
  position:fixed;right:20px;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;padding:0;
  border:1px solid var(--border-1);
  border-radius:50%;
  background:var(--surface-2);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:100;
  opacity:0;visibility:hidden;
  transform:translateY(12px);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:var(--shadow-md);
  transition:opacity var(--dur) var(--ease),
             transform var(--dur) var(--ease),
             visibility var(--dur) var(--ease),
             color var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),
             box-shadow var(--dur) var(--ease);
}
.back-top.show{opacity:1;visibility:visible;transform:translateY(0)}
@media (hover:hover) and (pointer:fine){
  .back-top:hover{
    color:var(--accent-hover);
    border-color:var(--border-2);
    box-shadow:var(--shadow-lg);
    transform:translateY(-2px);
  }
}
.back-top:active{transform:scale(.94)}
.back-top .ring{
  position:absolute;inset:0;
  width:100%;height:100%;
  transform:rotate(-90deg);pointer-events:none;
}
.back-top .ring circle{fill:none;stroke-width:2.5}
.back-top .ring .ring-bg{stroke:var(--border-1)}
.back-top .ring .ring-fg{
  stroke:var(--accent);stroke-linecap:round;
  transition:stroke-dashoffset 80ms linear;
}
.back-top .arrow{
  position:relative;z-index:1;
  width:18px;height:18px;
  stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
body.game-open .back-top{display:none !important}
@media (min-width:1024px){
  .back-top{
    right:32px;
    bottom:calc(32px + env(safe-area-inset-bottom,0px));
    width:52px;height:52px;
  }
}

/* ============================================================
 * 11. Toast
 * ============================================================ */
.toast{
  position:fixed;left:50%;
  bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);
  padding:11px 20px;border-radius:var(--radius-md);
  background:var(--surface-3);
  border:1px solid var(--border-2);
  color:var(--text-1);
  font-size:12.5px;font-weight:700;
  letter-spacing:.01em;
  box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
  z-index:10000;
  max-width:calc(100vw - 48px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
 * 12. 响应式
 * ============================================================ */
@media (max-width:480px){
  .menu-title{font-size:22px;letter-spacing:-.015em}
  .menu-sub{font-size:13px}
  .menu-stat-num{font-size:22px}

  .featured-icon{width:54px;height:54px;font-size:26px}
  .featured-name{font-size:18px}
  .featured-desc{font-size:12px}
  .game-grid{grid-template-columns:repeat(2, 1fr);gap:10px}
  .game-card{padding:20px 10px 18px}
  .game-icon{width:48px;height:48px;font-size:22px;margin-bottom:12px}
  .game-name{font-size:14.5px;margin-bottom:6px}
  .game-desc{font-size:10.5px}
  .game-tag{font-size:8.5px;padding:2px 6px;top:8px;right:8px}
  .back-top{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .menu-footer{gap:10px}
}
@media (max-width:360px){

  .game-grid{grid-template-columns:1fr}
  .game-card{
    aspect-ratio:auto;min-height:96px;

  }
  .game-icon{margin-bottom:0}

  .game-desc{text-align:left;padding:0}
  .game-tag{top:50%;right:12px;transform:translateY(-50%)}
}

/* ============================================================
 * 13. 兼容 / 无障碍 / 打印
 * ============================================================ */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .menu-stats,.featured-card,.game-card,.back-top,.toast,.footer-mail{
    background:var(--surface-3);
  }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  #particleCanvas{display:none}
}
@media print{

    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  a{color:#000;text-decoration:none}
}

  /* ============================================================
   * Reporter · 全局错误监听
   * ============================================================ */
  const Reporter = (function () {
    let el = null, timer = 0, count = 0;
    const MAX = 4;

    function ensure() {
      if (el || !document.body) return el;
      el = document.createElement('div');
      el.setAttribute('role', 'alert');
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;padding:11px 20px;border-radius:10px;background:#2563eb;color:#fff;font:600 13px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif;box-shadow:0 10px 30px rgba(37,99,235,.35);max-width:88vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s ease;';
      document.body.appendChild(el);
      return el;
    }

    function show(msg) {
      if (count++ > MAX) return;
      try {
        const node = ensure();
        if (!node) return;
        node.textContent = String(msg || '');
        node.style.opacity = '1';
        clearTimeout(timer);
        timer = setTimeout(function () { if (el) el.style.opacity = '0'; }, 4500);
      } catch (e) {}
    }

    global.addEventListener('error', function (e) {
      if (e && e.message) show('页面出错：' + e.message);
    }, true);
    global.addEventListener('unhandledrejection', function (e) {
      const r = e && e.reason;
      show('请求失败：' + ((r && r.message) || r || '未知错误'));
    });

    return { show };
  })();

  /* ============================================================
   * Utils · 通用工具
   * ============================================================ */
  const Utils = {
    rafThrottle(fn) {
      let ticking = false, lastArgs = null;
      return function () {
        lastArgs = arguments;
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          ticking = false;
          try { fn.apply(null, lastArgs); } catch (e) {}
        });
      };
    },
    prefersReducedMotion() {
      try { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
      catch (e) { return false; }
    },
    isDark() { return document.documentElement.classList.contains('dark'); },
    isCoarse() {
      try { return matchMedia('(pointer: coarse)').matches; }
      catch (e) { return false; }
    },
    hexToRgba(hex, alpha) {
      let h = String(hex || '').replace('#', '');
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      if (isNaN(r) || isNaN(g) || isNaN(b)) return 'rgba(96,165,250,' + alpha + ')';
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
  };

  /* ============================================================
   * Theme · 主题跟随系统
   * ============================================================ */
  const Theme = (function () {
    const listeners = [];
    function apply(dark) {
      document.documentElement.classList.toggle('dark', !!dark);
      for (let i = 0; i < listeners.length; i++) {
        try { listeners[i](!!dark); } catch (e) {}
      }
    }
    return {
      init() {
        let mq = null;
        try { mq = matchMedia('(prefers-color-scheme: dark)'); }
        catch (e) { return; }
        if (!mq) return;
        apply(mq.matches);
        const handler = function (e) { apply(e.matches); };
        if (mq.addEventListener) mq.addEventListener('change', handler);
        else if (mq.addListener) mq.addListener(handler);
      },
      onChange(fn) { listeners.push(fn); }
    };
  })();

  /* ============================================================
   * Particles · 粒子背景
   * ============================================================ */
  const Particles = (function () {
    const canvas = document.getElementById('particleCanvas');
    if (!canvas || global.__AF_LITE__) return { noop: true };
    if (Utils.prefersReducedMotion()) return { noop: true };

    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return { noop: true };

    let W = 0, H = 0, dpr = 1;
    let parts = [];
    let rafId = 0, running = false, lastTime = 0;
    const mouse = { x: -9999, y: -9999 };
    const isCoarse = Utils.isCoarse();

    const COLORS_LIGHT = [[59,130,246],[96,165,250],[56,189,248],[14,165,233],[129,140,248]];
    const COLORS_DARK  = [[96,165,250],[125,211,252],[56,189,248],[147,197,253],[129,140,248]];
    const LINK_LIGHT = [59,130,246];
    const LINK_DARK  = [125,211,252];

    let COLORS = COLORS_LIGHT, LINK_COLOR = LINK_LIGHT;
    const SPRITE_SIZE = 64;
    let sprites = [];

    function buildSprites(dark) {
      COLORS = dark ? COLORS_DARK : COLORS_LIGHT;
      LINK_COLOR = dark ? LINK_DARK : LINK_LIGHT;
      sprites = COLORS.map(function (rgb) {
        const r = rgb[0], g = rgb[1], b = rgb[2];
        const cv = document.createElement('canvas');
        cv.width = cv.height = SPRITE_SIZE;
        const c = cv.getContext('2d');
        const grd = c.createRadialGradient(32, 32, 0, 32, 32, 32);
        if (dark) {
          grd.addColorStop(0, 'rgba(255,255,255,0.95)');
          grd.addColorStop(0.18, 'rgba(' + r + ',' + g + ',' + b + ',0.85)');
          grd.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ',0.25)');
          grd.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
        } else {
          grd.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
          grd.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.55)');
          grd.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',0.16)');
          grd.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
        }
        c.fillStyle = grd;
        c.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
        return cv;
      });
    }

    function resize() {
      try {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initParticles();
      } catch (e) { stop(); }
    }

    function initParticles() {
      const base = Math.floor(W * H / CFG.PARTICLE_DENSITY);
      const cap = isCoarse ? CFG.PARTICLE_CAP_MOBILE : CFG.PARTICLE_CAP_DESKTOP;
      const n = Math.min(cap, Math.max(22, base));
      parts = [];
      for (let i = 0; i < n; i++) {
        const si = Math.random() < 0.9 ? Math.floor(Math.random() * 4) : 4;
        parts.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.32, vy: (Math.random() - 0.5) * 0.32,
          r: Math.random() * 2 + 0.8, si,
          a: Math.random() * 0.4 + 0.4,
          tw: Math.random() * Math.PI * 2,
          twS: Math.random() * 0.02 + 0.008
        });
      }
    }

    const LINK_DIST = CFG.PARTICLE_LINK_DIST;
    const LINK_DIST2 = LINK_DIST * LINK_DIST;

    function draw(now) {
      if (now - lastTime < CFG.PARTICLE_MIN_DT) {
        rafId = requestAnimationFrame(draw); return;
      }
      lastTime = now;
      try {
        ctx.clearRect(0, 0, W, H);
        const dark = Utils.isDark();

        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 150 && d > 0.5) {
            const f = (150 - d) / 150 * 0.4;
            p.vx += dx / d * f * 0.04;
            p.vy += dy / d * f * 0.04;
          }
          const s = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (s > 0.9) { p.vx = p.vx / s * 0.9; p.vy = p.vy / s * 0.9; }
          p.x += p.vx; p.y += p.vy; p.tw += p.twS;
          if (p.x < 0) { p.x = 0; p.vx *= -1; } else if (p.x > W) { p.x = W; p.vx *= -1; }
          if (p.y < 0) { p.y = 0; p.vy *= -1; } else if (p.y > H) { p.y = H; p.vy *= -1; }
        }

        const lineAlpha = dark ? 0.24 : 0.16;
        const lr = LINK_COLOR[0], lg = LINK_COLOR[1], lb = LINK_COLOR[2];
        ctx.lineWidth = 0.8;
        for (let a1 = 0; a1 < parts.length; a1++) {
          const pa = parts[a1];
          for (let b1 = a1 + 1; b1 < parts.length; b1++) {
            const pb = parts[b1];
            const ddx = pa.x - pb.x, ddy = pa.y - pb.y;
            const d2 = ddx * ddx + ddy * ddy;
            if (d2 < LINK_DIST2) {
              const op = (1 - Math.sqrt(d2) / LINK_DIST) * lineAlpha;
              ctx.strokeStyle = 'rgba(' + lr + ',' + lg + ',' + lb + ',' + op + ')';
              ctx.beginPath();
              ctx.moveTo(pa.x, pa.y);
              ctx.lineTo(pb.x, pb.y);
              ctx.stroke();
            }
          }
        }

        const aS = dark ? 1 : 0.72;
        for (let k = 0; k < parts.length; k++) {
          const pk = parts[k];
          const alpha = pk.a * (0.65 + 0.35 * Math.sin(pk.tw)) * aS;
          const size = pk.r * (dark ? 10 : 8.5);
          ctx.globalAlpha = alpha;
          ctx.drawImage(sprites[pk.si], pk.x - size / 2, pk.y - size / 2, size, size);
        }
        ctx.globalAlpha = 1;
      } catch (e) { stop(); return; }
      rafId = requestAnimationFrame(draw);
    }

    function start() { if (running) return; running = true; lastTime = 0; rafId = requestAnimationFrame(draw); }
    function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
    window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    window.addEventListener('mouseleave', function () { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', function (e) {
      if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener('touchend', function () { mouse.x = -9999; mouse.y = -9999; });

    let rt = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rt); rt = setTimeout(resize, 200);
    }, { passive: true });

    buildSprites(Utils.isDark());
    resize();
    if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 800 });
    else setTimeout(start, 350);
    Theme.onChange(function (dark) { buildSprites(dark); });

    return { start, stop };
  })();

  /* ============================================================
   * Toast
   * ============================================================ */
  const Toast = (function () {
    const el = document.getElementById('toast');
    let timer = 0;
    return {
      show(msg, duration) {
        if (!el) return;
        el.textContent = String(msg || '');
        el.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { el.classList.remove('show'); }, duration || 1800);
      }
    };
  })();

  /* ============================================================
   * ViewManager · 视图切换

  const ViewManager = {
    menu: null, game: null,

    showMenu() {
      if (this.game) {

      if (this.menu) this.menu.classList.add('active');

    },
    showGame() {

      document.documentElement.classList.add('game-open');
    }
  };

  /* ============================================================
   * GameList · 渲染游戏卡片
   * ============================================================ */
  const GameList = {
    render() {
      const grid = document.getElementById('gameGrid');
      if (!grid) return;
      while (grid.firstChild) grid.removeChild(grid.firstChild);

      GAMES.forEach(function (g) {
        const li = document.createElement('li');

        tag.className = 'game-tag';
        tag.textContent = g.tag;

        grid.appendChild(li);

  /* ============================================================
   * IframeLoader · iframe 加载管理
   * ============================================================ */
  const IframeLoader = {
    frame: null, loading: null, loadingName: null,
    errorState: null, errorDesc: null, gameTitle: null,
    currentTimer: null, currentLoadStart: 0, currentGame: null,
    loadHandler: null, errorHandler: null,

    init() {
      this.frame = document.getElementById('gameFrame');
      this.loading = document.getElementById('loading');
      this.loadingName = document.getElementById('loadingName');
      this.errorState = document.getElementById('errorState');
      this.errorDesc = document.getElementById('errorDesc');
      this.gameTitle = document.getElementById('gameTitle');
    },

    cleanup() {
      if (this.currentTimer) { clearTimeout(this.currentTimer); this.currentTimer = null; }
      if (this.frame) {
        if (this.loadHandler) { this.frame.removeEventListener('load', this.loadHandler); this.loadHandler = null; }
        if (this.errorHandler) { this.frame.removeEventListener('error', this.errorHandler); this.errorHandler = null; }
      }
    },

    load(file, title) {
      if (!this.frame) return;
      this.cleanup();
      this.currentGame = { file, title };
      this.currentLoadStart = Date.now();

      if (this.gameTitle) this.gameTitle.textContent = title;
      if (this.loadingName) this.loadingName.textContent = title;
      if (this.loading) this.loading.classList.remove('hide');
      if (this.errorState) this.errorState.classList.remove('show');
      this.frame.classList.remove('loaded');

      const self = this;

      this.loadHandler = function () {
        const src = self.frame.getAttribute('src') || '';
        if (!src || src === 'about:blank') return;
        const elapsed = Date.now() - self.currentLoadStart;
        const wait = Math.max(0, CFG.LOADING_MIN_MS - elapsed);
        setTimeout(function () {
          if (self.loading) self.loading.classList.add('hide');
          if (self.frame) self.frame.classList.add('loaded');
          if (self.currentTimer) { clearTimeout(self.currentTimer); self.currentTimer = null; }
        }, wait);
      };

      this.errorHandler = function () {
        self.handleError('游戏文件加载失败，请检查文件是否存在。');
      };

      this.frame.addEventListener('load', this.loadHandler);
      this.frame.addEventListener('error', this.errorHandler);

      this.currentTimer = setTimeout(function () {
        if (self.frame && !self.frame.classList.contains('loaded')) {
          self.handleError('游戏加载超时，请检查网络或稍后重试。');
        }
      }, CFG.IFRAME_TIMEOUT);

      try { this.frame.src = file; }
      catch (e) { this.handleError('无法加载游戏文件'); }
    },

    handleError(msg) {
      this.cleanup();
      if (this.loading) this.loading.classList.add('hide');
      if (this.errorDesc) this.errorDesc.textContent = msg;
      if (this.errorState) this.errorState.classList.add('show');
      Toast.show('游戏加载失败', 2400);
    },

    retry() {
      if (this.currentGame) this.load(this.currentGame.file, this.currentGame.title);
    },

    unload() {
      this.cleanup();
      if (this.frame) {
        try { this.frame.src = 'about:blank'; } catch (e) {}
        this.frame.classList.remove('loaded');
      }
      if (this.loading) this.loading.classList.remove('hide');
      if (this.errorState) this.errorState.classList.remove('show');
      this.currentGame = null;
    }
  };

  /* ============================================================
   * History · 状态机
   * ============================================================ */
  const History = {
    opened: false,
    push(file, title) {
      if (!global.history || !global.history.pushState) return;
      try {
        global.history.pushState(
          { game: file, title, t: Date.now() },
          title,
          location.pathname + location.search + '#game'
        );
        this.opened = true;
      } catch (e) {}
    },
    close() {
      if (!global.history || !global.history.back) return;
      if (location.hash === '#game') {
        try { global.history.back(); } catch (e) {}
      }
      this.opened = false;
    },
    reset() { this.opened = false; }
  };

  /* ============================================================
   * GameController · 游戏控制器
   * ============================================================ */
  const GameController = {
    open(file, title) {
      ViewManager.showGame();
      IframeLoader.load(file, title);
      History.push(file, title);
    },
    backToMenu(fromPopstate) {
      IframeLoader.unload();
      ViewManager.showMenu();
      if (!fromPopstate) History.close();
      else History.reset();
    },
    handlePopstate() {
      if (!ViewManager.game || !ViewManager.game.classList.contains('active')) {
        History.reset();
        return;
      }
      IframeLoader.unload();
      ViewManager.showMenu();
      History.reset();
    }
  };

  /* ============================================================
   * CardHover · 卡片光标跟随
   * ============================================================ */
  const CardHover = {
    init() {
      if (global.__AF_LITE__) return;
      if (Utils.prefersReducedMotion()) return;
      if (Utils.isCoarse()) return;

      const cards = document.querySelectorAll('.featured-card, .game-card');

      Array.prototype.forEach.call(cards, function (card) {
        let rafId = 0, lastEvent = null;

        function apply() {
          rafId = 0;
          if (!lastEvent) return;
          const r = card.getBoundingClientRect();
          if (!r.width || !r.height) return;
          const px = Math.max(0, Math.min(1, (lastEvent.clientX - r.left) / r.width));
          const py = Math.max(0, Math.min(1, (lastEvent.clientY - r.top) / r.height));
          card.style.setProperty('--mx', (px * 100).toFixed(2) + '%');
          card.style.setProperty('--my', (py * 100).toFixed(2) + '%');
        }

        card.addEventListener('mousemove', function (e) {
          lastEvent = e;
          if (!rafId) rafId = requestAnimationFrame(apply);
        });
        card.addEventListener('mouseleave', function () {
          if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
          lastEvent = null;
          card.style.setProperty('--mx', '50%');
          card.style.setProperty('--my', '50%');
        });
      });
    }
  };

  /* ============================================================
   * Counters · 数字滚动
   * ============================================================ */
  const Counters = {
    init() {
      const nodes = document.querySelectorAll('[data-count]');
      if (!nodes.length) return;

      const reduce = Utils.prefersReducedMotion();
      if (reduce || !('IntersectionObserver' in window)) {
        Array.prototype.forEach.call(nodes, function (el) {
          el.textContent = (el.dataset.count || '0') + (el.dataset.suffix || '');
        });
        return;
      }

      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          const el = en.target;
          io.unobserve(el);
          if (el.__done__) return;
          el.__done__ = true;

          const target = parseInt(el.dataset.count, 10) || 0;
          const suffix = el.dataset.suffix || '';
          const DURATION = 1200;
          let start = null;

          function tick(t) {
            if (!start) start = t;
            const p = Math.min((t - start) / DURATION, 1);
            const e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.floor(target * e) + suffix;
            if (p < 1) requestAnimationFrame(tick);
            else el.textContent = target + suffix;
          }
          requestAnimationFrame(tick);
        });
      }, { threshold: 0.3 });

      Array.prototype.forEach.call(nodes, function (el) { io.observe(el); });
    }
  };

  /* ============================================================
   * BackTop · 回到顶部
   * ============================================================ */
  const BackTop = {
    init() {
      const btn = document.getElementById('backTop');
      if (!btn) return;
      const fg = btn.querySelector('.ring-fg');
      const CIRC = 2 * Math.PI * CFG.RING_RADIUS;
      if (fg) { fg.style.strokeDasharray = CIRC; fg.style.strokeDashoffset = CIRC; }

      const onScroll = Utils.rafThrottle(function () {
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        const max = Math.max(1, (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight);
        const p = Math.max(0, Math.min(1, y / max));
        if (fg) fg.style.strokeDashoffset = CIRC * (1 - p);
        btn.classList.toggle('show', y > CFG.SCROLL_TOP_THRESHOLD);
      });

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      onScroll();

      btn.addEventListener('click', function () {
        const reduce = Utils.prefersReducedMotion();
        try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }
        catch (e) { window.scrollTo(0, 0); }
      });
    }
  };

  /* ============================================================
   * Mail · 复制邮箱
   * ============================================================ */
  const Mail = (function () {
    const EMAIL = '88061995@qq.com';
    const btn = document.getElementById('mailBtn');
    if (!btn) return { noop: true };

    function copyText(text) {
      if (navigator.clipboard && global.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;left:-9999px;opacity:0;';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('execCommand failed'));
        } catch (e) { reject(e); }
      });
    }

    btn.addEventListener('click', function () {
      if (btn.classList.contains('copied')) return;
      const textEl = btn.querySelector('.mail-text');
      const iconEl = btn.querySelector('.mail-icon');

      copyText(EMAIL).then(function () {
        btn.classList.add('copied');
        if (iconEl) iconEl.textContent = '✅';
        if (textEl) textEl.textContent = '已复制';
        Toast.show('邮箱已复制');
        setTimeout(function () {
          btn.classList.remove('copied');
          if (iconEl) iconEl.textContent = '📧';
          if (textEl) textEl.textContent = EMAIL;
        }, 1800);
      }).catch(function () {
        try { global.prompt('请手动复制邮箱：', EMAIL); }
        catch (e) { Toast.show('复制失败，请手动复制'); }
      });
    });
    return { noop: false };
  })();

  /* ============================================================
   * 事件绑定
   * ============================================================ */
  function bindEvents() {
    document.addEventListener('click', function (e) {
      let t = e.target;
      while (t && t !== document.body) {
        if (t.tagName === 'BUTTON' &&
            (t.classList.contains('featured-card') || t.classList.contains('game-card'))) {
          const file = t.getAttribute('data-game');
          const title = t.getAttribute('data-title') || '游戏';
          if (!file) return;
          if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
          GameController.open(file, title);
          return;
        }
        t = t.parentNode;
      }
    });

    const backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.addEventListener('click', function () { GameController.backToMenu(false); });

    const errorBack = document.getElementById('errorBack');
    if (errorBack) errorBack.addEventListener('click', function () { GameController.backToMenu(false); });

    const errorRetry = document.getElementById('errorRetry');
    if (errorRetry) errorRetry.addEventListener('click', function () { IframeLoader.retry(); });

    window.addEventListener('popstate', function () { GameController.handlePopstate(); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.keyCode === 27) {
        if (ViewManager.game && ViewManager.game.classList.contains('active')) {
          e.preventDefault();
          GameController.backToMenu(false);
        }
      }
    });

    window.addEventListener('pagehide', function () { IframeLoader.unload(); });
  }

  /* ============================================================
   * boot · 启动
   * ============================================================ */
  function boot() {
    try {
      Theme.init();
      ViewManager.init();
      IframeLoader.init();
      GameList.render();
      CardHover.init();
      Counters.init();
      BackTop.init();
      bindEvents();
      if (location.hash === '#game') {
        try { global.history.replaceState(null, '', location.pathname + location.search); }
        catch (e) {}
      }
    } catch (e) {
      Reporter.show('初始化异常：' + (e && e.message || e));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }

  global.__AF_GAME__ = { version: '7.0.0' };
})(window);
</script>
